[project]
name = "guppi"
version = "0.1.0"
description = "GUPPI: a Claude Code harness governed by ratified decisions, compiled into an Obsidian vault"
requires-python = ">=3.12,<3.13"
# PyYAML is the one runtime dependency: the vault's per-category `schema.yaml` files are
# read with it. Nothing else is added (owner's decision D3, 2026-09-09).
dependencies = ["pyyaml>=6.0"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["vault", "docs"]

[project.scripts]
guppi = "guppi.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
# a test marked `live` reads the live vault of this repository and runs only by `-m live`
markers = ["live: reads the live vault of this repository; run by -m live"]
addopts = '-m "not live"'

# The `guppi` entry point needs the project installed into the venv, which needs a build
# backend. uv's own is a build-time requirement, fetched once, not a runtime dependency.
[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
