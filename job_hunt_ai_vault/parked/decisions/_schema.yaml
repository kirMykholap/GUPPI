# What a page in this folder must and may carry.
#
# vault-check.sh READS THIS FILE. It is the one list: nothing restates it, and a key that
# appears in neither block below is rejected by the gate. Two lists of the same set drift,
# and this store has already lost two selftest cases to exactly that.
#
# THIS FILE ENCODES WHAT IS DECIDED, NOT WHAT IS OBSERVED. A field carried by every page
# today is not thereby required: that is how `quantity:` entered this store, around the
# admission procedure, and it took a day to remove. A field moves from `optional` to
# `required` when a decision says so, and the decision names the page it is written on.

type: decision

# The core, decided 2026-08-16 on [[the-frontmatter-core-is-fixed-and-updated-joins-it]].
required:
  - title
  - type
  - status
  - created
  - sources
  - tags
  - sprint
  - decided
  # Promoted from optional on 2026-08-19, owner's ruling: the field conflict
  # resolution rests on cannot be one a page may omit.
  # [[the-frontmatter-core-is-fixed-and-updated-joins-it]]
  - basis
  # Promoted from optional on 2026-08-21, owner's ruling, as the LAST step of the session that
  # filled the corpus - and the order is the decision, not an accident. `authority` stops being a
  # label a page may claim and becomes the index this corpus is searched by BEFORE a page is
  # opened: the librarian looks up the family a candidate belongs to and reads what is already
  # there rather than writing a fifth page about the same question. An index a page may omit is an
  # index with holes in it, and the holes are invisible - a lookup that returns nothing reads
  # exactly like a question nobody has answered.
  #
  # REQUIRED BEFORE THE BACK-FILL WOULD HAVE DEADLOCKED THE WORK. Red here turns the gate red,
  # and `lock-the-librarian.ps1` reads a red gate as a refusal to dispatch - locking out the only
  # writer permitted to clear it ([[the-librarian-lock-hook]],
  # [[a-lock-on-a-red-tree-hides-the-health-of-what-it-guards]]). So the field was legal and
  # optional while the corpus was marked, and promoted once every page carried it.
  #
  # Forbidden in `wiki/rules/`, which is not an exception to this: a rule answers with `governs:`,
  # and the two fields on one page would make the decision and the rule stating it share a slug
  # ([[authority-beside-governs-is-forbidden-on-any-page]]). The rules schema lists it in neither
  # block, so the gate already rejects it there.
  # [[authority-becomes-the-index-and-is-required-outside-rules]]
  - authority
  # WHAT A DECISION DOES TO THE READER, and it is required because this folder holds three
  # different things and answered as one. Measured 2026-08-21 across 189 pages, then filled the
  # same day: 168 `prohibition`, 18 `deferral`, 6 `divergence`. A plan checked against this folder
  # used to get a list of RELEVANT pages where it needed a list of what STOPS it.
  #
  # THE FIELD WAS LEGAL AND OPTIONAL WHILE THE CORPUS WAS BEING MARKED, AND PROMOTED WHEN IT WAS
  # FULL. A key in neither block is rejected outright, so it had to be legal before any page could
  # carry it; and `required` before the corpus carried it turns the gate red, which
  # `lock-the-librarian.ps1` reads as a refusal to dispatch - locking out the only writer permitted
  # to clear it ([[the-librarian-lock-hook]],
  # [[a-lock-on-a-red-tree-hides-the-health-of-what-it-guards]]).
  #
  # AN ABSENT VALUE READS AS `prohibition`. The field is required, so this is not a default the
  # schema permits - it is what a reader assumes, and it is the safe direction: a deferral misread
  # as a prohibition costs a question, a prohibition misread as a deferral costs the constraint.
  #
  # A BROKEN WIKILINK IN A SCHEMA IS INVISIBLE TO THE GATE, and this block proved it: rule 4 sweeps
  # `.md` and these files are `.yaml`, so a slug written here from memory rather than from the tree
  # reached nothing and reddened nothing. It was caught only because the librarian copied it onto a
  # page. Cite from the tree here.
  # [[a-decision-declares-whether-it-binds]]
  - binding

optional:
  - updated
  - supersedes
  - superseded_by
  # `Links:` WAS REMOVED FROM ALL SIX SCHEMAS ON 2026-08-30 and the key is legal nowhere. It was
  # admitted on 2026-08-23 to carry the body's `[[wikilinks]]` so a reader could walk the graph
  # without opening the page, filled by a script rather than by an agent. THE SCRIPT WAS NEVER
  # WRITTEN AND NO PAGE EVER CARRIED THE FIELD - zero under `wiki/` and zero under `archive/`,
  # measured the day it was removed, which is why removing the key reddens nothing.
  #
  # WHAT KILLED IT is that the graph it would have cached exists twice over already. Obsidian
  # builds its graph from the `[[wikilinks]]` in the body, so the field bought that reader nothing;
  # and an agent reads one page's outgoing links with a single grep over that one file, without
  # loading the page at all, so it bought that reader nothing either. The owner found the first
  # half by looking at his own graph. A field with no writer and no reader is a comment with a
  # colon in it ([[a-rule-with-no-instrument-behind-it-is-a-rule-a-fixture-can-violate-for-a-week]]).
  #
  # The proposal that designed the script was refused in the same change rather than left standing
  # over a field that no longer exists ([[links-is-filled-by-a-script-from-the-bodys-wikilinks]]).

  # THE TWO FIELDS OF THE DECISION LIFECYCLE, admitted 2026-08-30. `target_kind:` names WHAT KIND
  # of thing this decision produces and `target:` names the thing. Together they are the forward
  # half of a handshake: the decision names its target when it is ratified, the target names the
  # decision back in `decided_by:` when it lands, and only both together let the decision leave
  # this folder. Before them a decision closed on a BACKWARD pointer alone - somebody else, later,
  # naming it - which reads causation as carriage and has already taken a page out of view whose
  # claim nothing live carried.
  #
  # LEGAL AND OPTIONAL HERE, AND REQUIRED BY DATE IN RULE 16. This is the order this file set has
  # run three times, on `basis`, `authority` and `binding`: legal first, then the fill, then the
  # promotion. Required here today would fire the `missing` verdict on all 299 pages at once, and a
  # red gate is what `lock-the-librarian.ps1` reads as a refusal to dispatch - locking out the only
  # writer permitted to clear it ([[a-lock-on-a-red-tree-hides-the-health-of-what-it-guards]]).
  #
  # WHAT MAKES THEM OBLIGATORY IS `lifecycle_from:` BELOW, not this block. The owner ruled on
  # 2026-08-30 that the 299 pages already here are NOT back-filled and their type system is not
  # changed, because a census of this folder comes first and has never run
  # ([[the-decisions-folder-is-censused-before-its-type-system-is-redesigned]]). A date is what
  # separates the two populations, and it is the whole of why these are optional rather than
  # required.
  - target_kind
  # PLAIN TEXT AND NEVER A `[[wikilink]]`, and that is the one thing about this field a reader must
  # not correct. At the moment a decision is ratified its target does not exist yet - that is what
  # "open" means - and rules 4 and 5 sweep a wikilink in frontmatter exactly as they sweep one in
  # the body, so the link would be dead from the moment it was written until the page landed. The
  # store already solved this shape once: `authority.md` writes slugs as plain text so the register
  # does not join the link sweep, and this is the same problem with the same answer.
  #
  # WHAT PLAIN TEXT GIVES UP, named rather than discovered later: nothing checks that the slug ever
  # resolves. A target nobody wrote reads exactly like a target nobody has written YET, and only
  # rule 16's handshake - which fires when the page does exist - can tell them apart.
  - target

# THE LEGAL VALUES OF A FIELD, decided 2026-08-19 on the owner's ruling. Until then the gate
# enforced that `basis` was PRESENT and said nothing about what it said, so `basis: banana`
# passed on the one field conflict resolution rests on. A value outside the list below is red.
#
# The list is decided on the vault's own CLAUDE.md, section `basis`, which gives each value and
# its meaning. It is NOT swept off the corpus: a field's legal values being read off the pages
# that happen to carry them is how a typo becomes law, and it is the same mistake `quantity:`
# was. Same rule as the key set above - this file encodes what is decided.
#
# A `values:` header that parses to nothing is red, for the reason the key set is: a silent
# empty list turns the check into "every value is fine", in the direction of passing.
values:
  basis:
    - human
    - code
    - measurement
    - external
    - inference
  # `prohibition` - it may not be done, and lifting it is a conversation with the owner, never a
  # session's call. `deferral` - not now; doing it later is what was intended, so this is context
  # a plan needs and never a constraint it breaks. `divergence` - how a rule was already broken;
  # it teaches and forbids nothing, and its own title says so.
  #
  # `divergence` is the only one a script can verify: the title begins with `DIVERGENCE:`. The
  # other two are judgements, which is why the reader's default for an absent value is the strict
  # one - a deferral misread as a prohibition costs a question, a prohibition misread as a deferral
  # costs the constraint.
  binding:
    - prohibition
    - deferral
    - divergence

  # THE TWO STATUSES THIS STORE HAS ALWAYS HAD, moved here 2026-08-23 from
  # `scripts/vault-check.sh`, where they were hardcoded in the awk pass and restated in the
  # message beside it. The gate is the reader, not the register - the same ground the key set
  # moved on ([[the-legal-value-list-lives-in-each-folders-schema]]).
  #
  # WRITTEN INTO EVERY FOLDER'S FILE, and not only into the one that needed a third value. The
  # `badvalue` verdict iterates the fields a folder DECLARES values for, so a folder omitting
  # this block would lose its status check entirely, and silently - which is the direction that
  # hides a defect. `implemented` is legal in `proposals/` alone; here the word is red, and that
  # is the protection rather than an oversight
  # ([[implemented-joins-the-legal-status-values-and-the-status-block-enters-every-schema]]).
  # `archived`, ADMITTED 2026-08-28, and the value enters every schema BEFORE any sweep writes it
  # ([[the-archiver-sets-status-archived-and-the-value-enters-the-schema-first]]).
  #
  # WHY IT IS NEEDED HERE AT ALL, WHICH IS NOT THE REASON THAT PAGE GIVES. The gate's frontmatter
  # pass reads `find "$VAULT/wiki"` and nothing else - `scripts/vault-check.sh:84` - so a page that
  # has ALREADY reached `archive/` is validated by no schema and could carry any word. What makes
  # the declaration necessary is the sweep's own failure mode, decided 2026-08-28: it continues past
  # a refused move, collects the refusals and reports them at the end. So a page can be left HERE
  # carrying the mark of a move that did not complete, and an undeclared value would report that as
  # a schema fault rather than as the half-finished move it is.
  #
  # `processed`, ADMITTED 2026-08-28, AND LEGAL IN THIS FOLDER ALONE. It means the decision's
  # content has been carried forward into a page that page names in its own `decided_by:` - so the
  # decision is no longer the thing to read, the page it produced is. It is red in every other
  # folder, which is the protection rather than an oversight, the same shape `implemented` has in
  # `wiki/proposals/`.
  #
  # IT OPENS A STATE AND DOES NOT NAME A PLACE (owner, 2026-08-28), which is the ruling `implemented`
  # already carries. The librarian sets the mark, the page STAYS here, and the sweep moves it as a
  # separate step at `/vault-lint`. The gate judges it not at all. Setting the mark is a judgement
  # and moving the page is mechanics, and they fail differently: one step instead of two makes an
  # error of judgement immediately irreversible.
  #
  # IT FREES THE PAGE'S `authority:` SLUG, AND THAT WAS TAKEN DELIBERATELY (owner, 2026-08-28).
  # Rule 3 of the gate compares `authority:` between `current` pages only, so a page that stops
  # being `current` stops colliding with anything. That is correct here - a processed decision is no
  # longer the sole answer to its question, because the answer left with the page it produced - and
  # it is written down because the alternative is a reader finding two answers to one question later
  # and concluding the gate is broken.
  #
  # REPEALED 2026-08-30, AND THE VALUE IS LEGAL ONLY UNTIL THE LAST PAGE CARRYING IT LEAVES.
  # Everything above is kept because nothing here is deleted and because it is the record of what
  # the value was for. Nothing may take this mark from here on; the entry below stays in the list
  # for exactly one page.
  #
  # THE ORDER IS THE FILL ORDER RUN BACKWARDS, and it is not a hedge. One live page carries
  # `processed` today - `every-question-put-to-the-owner-carries-context-and-a-recommendation`,
  # which is the decision behind the rule Case 4 supersedes, so it is due to be swept anyway.
  # Striking the value while that page stands would redden the gate on it, and a red gate is what
  # `lock-the-librarian.ps1` reads as a refusal to dispatch - locking out the only writer permitted
  # to clear it. Legal until the corpus is empty of it, then struck: the same sequencing that put
  # `basis`, `authority` and `binding` in, taken in the other direction.
  #
  # THE REMOVAL IS OWED AND IS NOT A JUDGEMENT CALL: when `grep -rl '^status:[ \t]*processed'` over
  # `wiki/` returns nothing, the entry below and the line in `sweep_candidates()` that selects on it
  # both come out, together.
  #
  # WHAT KILLED IT WAS THE ONE-PASS RULING, NOT A CHANGE OF MIND ABOUT WHAT IT MEANT. The owner
  # ruled on 2026-08-30 that `scripts/vault-archive.sh` checks the closure criterion itself, sets
  # the mark and moves the page in a single pass - because the judgement the two-step arrangement
  # protected had been replaced by a mechanical criterion, so the ground the two steps rested on
  # was gone. And `processed` and `archived` are two values of ONE field: in a single pass the page
  # takes `archived`, and `processed` would be written and overwritten in the same act. A value no
  # reader can ever observe is motion rather than record.
  #
  # WHAT WAS SUPPOSED TO DEPEND ON IT IS DERIVED INSTEAD. The distinction it carried - a decision
  # whose content was carried forward, against one dropped because the proposal listing it was
  # refused - is readable off the tree: the first has a target that names it back in `decided_by:`,
  # the second does not and its proposal carries `status: refused`. A stored copy of a derived fact
  # drifts, which is the same ground the owner ruled the proposal checkbox on the same day.
  #
  # **owner:** «archived выглядит честнее, чем processed. По сути его ставит архиватор, а не
  # "обрабатывает агент"».
  status:
    - current
    - deprecated
    - archived
    - processed

  # WHAT KIND OF THING THIS DECISION PRODUCES, admitted 2026-08-30. Five values and no sixth:
  #
  #   rule      - a page in wiki/rules/. Built from the decision directly.
  #   proposal  - a page in wiki/proposals/, which carries the decisions it must close before it
  #               can be implemented, and produces an entity or a concept once it is.
  #   action    - a task. The decision is discharged the moment the task exists; what happens to
  #               the task afterwards is not the decision's business.
  #   repeal    - the product is an ABSENCE. Such a decision never closes and never leaves this
  #               folder, because it is the only carrier of the fact that something no longer
  #               exists; `vault-archive.sh` refuses to release one.
  #   none      - the decision produces nothing. A deferral is one; so is a RATIFICATION, which
  #               signs off something already being practised and fits no value of `binding:`
  #               ([[a-decision-declares-whether-it-binds]]).
  #
  # THE FIFTH VALUE IS `none` AND IT WAS `deferral` FOR ONE CONVERSATION. `binding:` already has a
  # value spelled `deferral`, and one word over two mechanisms is the shape that cost this store
  # three days on *retrospective* and held a live three-way collision on *frontier*. The owner
  # ruled the rename before either field was written, so no page ever carried the collision
  # ([[a-retrospective-is-a-sessions-end-not-a-sprints-ritual]]). `none` is not a new coinage
  # either: the feedback channel already writes `[none]` for an absent destination.
  #
  # NO VALUE HERE MAY EVER EQUAL A VALUE OF `binding:` ABOVE. That is the whole reason this list
  # reads as it does, and it is stated so that a later reader adding a sixth value knows what the
  # constraint is rather than rediscovering it.
  target_kind:
    - rule
    - proposal
    - action
    - repeal
    - none

# THE DATE THE DECISION LIFECYCLE STARTS, and rule 16 reads it. A page in this folder whose
# `created:` is on or after it carries the sections and the fields declared below; a page created
# before it is judged by none of them and is not back-filled.
#
# A DATE RATHER THAN A BACK-FILL, decided by the owner on 2026-08-30. The 299 pages already here
# have never been read as a set - the census that would read them is the decisions agent's second
# mode and has never run - and his prohibition is that the folder's state is established before
# its type system is changed. A dated cut changes the type system for pages written from here on
# and leaves the older population exactly as it stands, so the prohibition is not crossed and the
# census stays owed rather than blocking.
#
# WHAT THIS SHAPE COSTS, named rather than left to be found: it is a COHORT exemption and it does
# not expire. Nothing in this store had decided that case before - the pages nearest to it are
# about PER-PAGE declarations, which this is not, and about scoping by a re-derived property, which
# this is not either ([[a-declaration-that-silences-a-check-must-expire-or-be-re-derived]]). The
# older cohort never reddens again, even when a page in it is edited. That is the owner's ruling
# and it is written here so it reads as a decision rather than as an oversight.
lifecycle_from: 2026-08-30

# THE BODY SECTIONS A PAGE IN THIS FOLDER CARRIES, as `# ` headings and in no particular order.
# Rule 16 compares the set, never the sequence.
#
# `# ` AND NOT `## `, because that is what this corpus writes: 900 first-level headings against 395
# second-level ones across this folder. The rule reads the level it is told to read, and rule 8 -
# which judges a journal against its template - goes on reading `## ` because that is what the
# template writes. One helper, two callers, no second list.
#
# THE FIVE ARE THE OWNER'S, given on 2026-08-30 in this order and with these jobs:
#   Context             - what the thing is, how it works today, what pages and modules it touches
#   The question        - the problem, or the fork between options
#   How it works after  - and this one is load-bearing: it is the condition the decision is
#                         discharged by, so it names the target rather than describing a mood
#   Recommendation      - the session's, with its ground
#   Ratification        - who decided, in whose words, against what
#
# THE FIFTH IS WHAT THE OLD RULE HAD NOT GOT. `every-question-to-the-owner-carries-its-context`
# obliged four of these five and no more; the schema is strictly wider, which is why that rule is
# superseded rather than amended.
sections:
  - Context
  - The question
  - How it works after
  - Recommendation
  - Ratification

# THE KEYS THAT BECOME OBLIGATORY ON `lifecycle_from:`, checked by rule 16 and NOT by the
# frontmatter pass. They are listed under `optional:` above so that the `missing` verdict leaves
# the older cohort alone; this block is what makes them required for the newer one.
#
# TWO LISTS OF ONE SET DRIFT, so a key named here must also appear under `optional:` or `required:`
# above - otherwise the `unknownkey` verdict reddens the very page this block obliged. Rule 16
# checks that itself rather than trusting whoever edits this file.
required_from:
  - target_kind
  - target

# A SIXTH SECTION, AND ONLY FOR A DECISION WHOSE TARGET IS A RULE. Added 2026-08-30. It carries the
# sentence that becomes the rule page's clause, in the words it will be read in - so the step from
# a ratified decision to a landed rule is a copy rather than a fresh act of writing.
#
# WHY IT IS NOT IN `sections:` ABOVE: rule 16 compares that block as a SET, so a heading listed
# there is owed by every page in the folder, and a decision whose target is an action or a repeal
# has no rule text to write. A condition of this shape cannot be spelled inside a flat list, which
# is why it gets a block of its own and rule 16 reads `target_kind:` before it applies it.
#
# WHAT IT MAKES MECHANICAL, which is the whole reason it exists: a family rule in `wiki/rules/` is
# assembled from the clauses of the decisions that name it, and the librarian only has to decide
# the `authority:` slug. Without this section that assembly needs a human to write each clause from
# the body of a decision, which is the step this store cannot automate and would therefore skip
# ([[the-cleanup-suspends-the-rules-that-would-refuse-it]]).
#
# IT IS SCOPED BY `lifecycle_from:` LIKE THE FIVE ABOVE, so no page written before that date owes
# it, and the older cohort stays exactly as it stands.
sections_when_target_kind_rule:
  - The rule text
