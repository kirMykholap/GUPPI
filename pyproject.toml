[project]
name = "vault-harness"
version = "0.1.0"
description = "A Claude Code harness around an Obsidian vault of compiled session knowledge"
requires-python = ">=3.12,<3.13"
# PyYAML is the one runtime dependency: the vault scripts read the per-folder `_schema.yaml`
# files with it. It used to arrive as a transitive extra of the product's `uvicorn[standard]`
# and was declared as a dev dependency on the owner's ruling of 2026-08-22; the product left
# this repository on 2026-09-07 and the declaration moved here with nothing else changed.
dependencies = ["pyyaml>=6.0"]

[dependency-groups]
dev = ["ruff>=0.8"]

[tool.ruff]
line-length = 100
target-version = "py312"
