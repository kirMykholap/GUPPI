# The development project of the repository of GUPPI (case 819.1). The package `guppi`, its
# own `pyproject.toml`, `uv.lock` and tests stand in `.guppi/`, and every caller runs them as
# `uv run --project .guppi guppi …` and `uv run --project .guppi pytest`. This project takes the
# package from `.guppi/` as an editable path, so that a command without `--project .guppi` —
# the hooks a running session read before the move — still runs at the root. `guppi ship`
# does not write it, and a Case of a later session removes it.
[project]
name = "guppi-development"
version = "0.1.0"
description = "The development project of the repository of GUPPI; the package stands in .guppi/"
requires-python = ">=3.12,<3.13"
dependencies = ["guppi"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.uv.sources]
guppi = { path = ".guppi", editable = true }

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["vault", "docs"]

[tool.pytest.ini_options]
testpaths = [".guppi/tests"]
