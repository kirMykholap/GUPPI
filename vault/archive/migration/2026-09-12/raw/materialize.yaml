      script, and the quoting of the heredoc marker does not protect them; a multi-line edit script is
      written to the session scratchpad with the Write tool and run as python path, and console output
      with characters outside cp1252 needs PYTHONIOENCODING=utf-8 or the script dies at the print
  sections:
