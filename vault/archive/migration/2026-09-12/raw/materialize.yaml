      it.


      `lesson-readings-after-librarian-invisible-to-next-hi` (session F): fourteen estimate and lesson
      lines written after the librarian''s commit sit in the ledger; `/hi` loads `brief.md`, and `brief.md`
      was written before them, so the next session''s Frontier does not hold them.


      `lesson-vault-lesson-absent-at-the-moment-it-applies` (session K): `lesson-bash-tool-heredoc-escapes-interpreted`
