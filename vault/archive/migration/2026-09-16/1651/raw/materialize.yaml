  case_text:
    context: 'The Estimate model of case 182 is ratified by Cases 187–189 of session 1034: an Estimate
      is one promise, one way to check it and the last result; its Criterion is the `given`, `when` and
      `then` of one Case, replaced whole; `contract` on an `update`, `method`, `estimate_kind` and `estimate_slug`
      on a `create` go. The Rule-class files that describe the model are untouched. `index.md` in §2,
      §3, §5, §7 and §12 speaks of `### case N` blocks, of `method` on a Leaf `create` and of `contract:
      changed`. `estimates/schema.yaml` requires `## Context` and `## Method`; `estimates/schema.md` describes
      the Criterion as blocks. `glossary.md` repeats this in the rows Estimate and Case; `rules/schema.md`
      describes `## How it works` on a Leaf. Point 16 of the model named these files; no Case was written.
      This Case touches no Estimate: a Rule-class file has none.'
    problem: 'While the schemas and the map say the old model, Spec 1034 applies with contradictions:
      the ten new Estimates without `## Context` give ten lint findings, a reader of `index.md` gets a
      rule opposite to `case-schema.md`, and the table of `schema.md` stops agreeing with `schema.yaml`,
      which lint also checks. The question: the smallest set of changes to the Rule-class files that makes
      Spec 1034 applicable.'
    given: 'Cases 187, 188 and 189 are ratified and are applied by the same librarian run as this Case.

      **＋** lint reads `estimates/schema.yaml` and checks the table of `estimates/schema.md` against it.

      **＋** `guppi generate` writes every field of an entry''s `fields` into the frontmatter, with no
      list of allowed fields.

      **－** `rule-page-generation`, `rule-lint` and `rule-pretask` are deferred by case 191; this Case
      does not touch them, and point 10 of the model (Given and the Criterion list leave the Decision
      page) waits there too.'
    when: Someone reads `index.md`, `glossary.md`, `estimates/schema.md` or `rules/schema.md`; `guppi
      lint` reads `estimates/schema.yaml`.
    then: '`estimates/schema.yaml`: the required fields as today; optional `purpose`, `method`, `checked`;
      body — required `## Criterion` and `## History`, optional `## Context`, `## Method`, `## Result`;
      `## Result` required on `passed` and `failed`, as today.

      **＋** `estimates/schema.md`: the same table; `## Criterion` — the Given, When and Then of one Case,
      replaced whole by an `update` that names the Estimate by slug; `## Context` and `## Method` — the
      shape before case 193, not written to a new page; `method` — one line: the test command, or where
      and when it is read, or what is measured in Research; `purpose` — one line for the list on the rule;
      `checked` — the date of the reading; both examples in the new shape.

      **＋** `index.md`: §2 — "`given`, `when` and `then` are the Criterion of the Estimate"; §3 — the
      subsection "Paired Estimate on create" replaced: a new promise is an explicit `create` of an Estimate
      with `ref` and its slug in the Case, and the pre-task paragraph without `contract: changed`; §5
      — the row `create | — (Leaf)` replaced by `create | target | a new Estimate page, added to the target''s
      `estimates``; §7 — the new fields and sections, the Criterion replaced whole by the Case that names
      the Estimate, `pending` only on a replacement, `Result` overwritten; §12 — without "a Leaf `create`
      with no `method`".

      **＋** `glossary.md`: the row Estimate — without `### case N` and `contract: changed`, with the fields
      `purpose`, `method`, `checked`; the row Case — "`given` + `when` + `then` is the Estimate criterion".

      **＋** `rules/schema.md`: `## How it works` — MOC only; on a Leaf the mechanism lives in the docstring
      of its code; a Leaf that still carries the section keeps it until its next touch.

      **－** `rules/schema.yaml` does not change: `## How it works` is optional there already.

      **－** No field becomes required: the 42 old pages stay valid until the migration of case 191.'
