      When:

      A session ends.


      Then:

      It ends one of two ways: Work Mode, Retro, the commit, handoff and the librarian — or `/carry` straight
      after Plan Mode.

      **＋** In the ordinary way the order holds: `/handoff` is refused while the tree is dirty; `handoff.md`
      exists before the librarian is dispatched; no other commit stands between the handoff and the librarian''s;
      `make test-end-of-work` is green.

      **＋** On leaving Plan Mode the agent asks which of the two, and starts nothing until it is answered.

      **＋** `rule-carry-over` is a child of this MOC, after `rule-handoff`.

      **－** The order of the three steps of the ordinary way does not change.'
