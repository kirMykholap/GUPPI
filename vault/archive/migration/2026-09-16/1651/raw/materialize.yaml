  tags: []
  case_text:
    when: '`guppi materialize` lifts a record line of a ledger against its Spec.'
    then: 'One entry per record line, in ledger order: `case`, `kind`, `category` from the slug prefix,
      `slug`, `ref`, `source`, `supersedes`, `tags`, `origin`, `line`, `text`, `decision`; from the `then`
      block — `fields`, `sections`, `replace`, `change`, `impact`; what the block lacks is `incomplete`,
      never invented.

      **＋** An Estimate has its own line and its own entry; the `ref` of the line is the Estimate itself.

      **＋** An `update` entry for an Estimate carries the `given`, `when` and `then` of its Case verbatim
      with their operands as `sections.Criterion` — `Given:`, `When:`, `Then:` — replacing what stood
      there, and `set: {status: pending}`; the `given` of a sub-case is its parent''s when it has none
      of its own.

      **＋** A `create` entry for an Estimate keeps `kind`, `purpose`, `method`, `tags` as fields; its
      Criterion comes from the block''s `sections` when one is written, else from the Case''s `given`,
      `when`, `then` the same way; `## Context` and `## Method` are not written.

      **＋** One decision entry per Case: `decision`, `case_text`, `targets`; a sub-case inherits `context`,
      `problem`, `recommend`, `given`, never `when`.

      **＋** An `estimate` line for a page of the same ledger is folded into its `create`; for an earlier
      page it is an `estimate` entry, an update. The `new_tags` of any Case reach the yaml once. An existing
      yaml is extended, never rewritten.

      **－** An `update` entry carries no `contract`, and no Estimate is derived from it; a `create` carries
      no `method`, `estimate_kind` or `estimate_slug`; neither `criterion_block`, `case_removed` nor `remove_criterion`
      is derived.

      **－** The keys `contract`, `estimate_slug`, `estimate_kind` and `method` on a rule''s item are ignored:
      they reach neither the page nor `incomplete`; the blocks of Case 186 stay as signed.

      **－** A line the grammar does not parse goes under `unparsed`; the run goes on.'
    context: '`rule-materialize` is a Leaf, `enforcement: check`, its code `guppi/materialize.py`; two
      Estimates: `estimate-materialize-assembles` (a head Criterion and nine blocks) and `estimate-materialize-walks-dates`
      (a head and two blocks). Case 189 ratified: the script derives no Estimate from `contract`, `method`
      or `supersedes`; an Estimate has its own line and its own entry, its Criterion taken from the Case;
      `## How it works` goes into the docstring; six blocks became their own pages, 73.5 goes to `-walks-dates`,
      90.1 dies. Case 190.3 added the skip of a unit holding `carry.md`. But neither 189 nor 190.3 gave
      the page one line of text, both Estimates carry `set: {status: pending}` with no new Criterion,
      and `generate` can neither drop a section nor apply a `criterion` key on an `update`: it applies
      `set`, `sections`, `replace`. The blocks of Case 186 carry `contract: changed` and `estimate_slug`,
      which 189 does not read. This Case touches both Estimates of the page and not the six new ones:
      their Criterion is written in the blocks of 189.'
    problem: 'How 189 and 190.3 reach the page and the code without three holes: the text of `## Purpose`
      after `## How it works` leaves; the shape of the entry in which the lifted Criterion reaches the
      page through the existing `generate`; and the Criterion of both Estimates replaced whole without
      losing the promise of the head. And what to do with the keys of the old shape in the blocks of 186.'
    given: 'A unit `raw/<date>/<HHMM>/` holds `ledger.md` and `spec.md`; a Case in the Spec has a heading,
      the sections `given`, `when`, `then` and a `then` block.

      **＋** `guppi generate` applies the `sections` of an `update` entry as whole replacements and writes
      every field of a `create` entry''s `fields` into the frontmatter.

      **＋** Cases 189 and 190.3 are ratified; their entries for these same pages apply before the entries
      of this Case, in ledger order.

      **－** The tests in `tests/test_materialize.py` fix the behaviour; the live reading is the librarian''s
      run of this session.'
