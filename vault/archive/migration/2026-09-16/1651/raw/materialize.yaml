  sections:
    Criterion: 'Given:

      The hook `guppi spec` on `PostToolUse` of `ExitPlanMode` wrote the Spec and printed the fork into
      the context: go on — Work Mode — or conserve until the next session.

      **＋** The agent asked the person which of the two and got "conserve".

      **＋** `guppi materialize` knows a conserved unit by the file `carry.md` in the session folder (case
      190.3) — by its presence, not its content.

      **－** The person does not type `/carry`; the path of the skill is the agent''s call on `PreToolUse
      Skill`.


      When:

      The agent calls the skill `carry` after the person''s answer at the fork.


      Then:

      The skill reads the tree; when it holds changes outside the session folder and `vault/wiki/brief.md`,
      it stops and says: work was done, the ordinary exit applies.

      **＋** Otherwise it rewrites `brief.md` — that is the conservation: the next session starts from
      it.

      **＋** It puts `carry.md` into the session folder — one line, a flag for `materialize`, not a document;
      the session that finishes the work deletes it.

      **＋** It runs `make style` and commits `vault/raw/` and `vault/wiki/brief.md`.

      **－** It runs no Work Mode, `/retro`, `/handoff`, librarian, `materialize`, `generate`, `cleanup`
      or `render`; it writes no page of `vault/wiki/` but the brief.

      **－** The work stays sequential, session after session: one conserved Spec, no parallelism.

      **－** `.claude/skills/carry/SKILL.md` equals the Render of the page; it is not edited by hand.'
  applied: '19:45:25'
