- case: '212'
  decision: decision-case-212
  origin: raw/2026-09-16/2238/ledger.md#case-212
  targets:
  - kind: update
    category: estimates
    slug: estimate-lint-catches
    ref: estimate-lint-catches
  tags: []
  case_text:
    context: '`rule-plan-mode` is a MOC with four children and two Estimates: `estimate-plan-mode-verified`
      (`method: make test-plan-mode`, the pipeline over the children) and `estimate-plan-mode-names-its-estimates`
      (case 187, `method` a live reading of the Spec at the close: every Case names its Estimate by slug).
      The clause of 112.1 in `rule-lint` (`estimate-lint-catches`): a MOC''s Estimate with a `make <target>`
      passes always, and "by hand" passes only when every child''s Estimate is a reading too. The children
      of Plan Mode — `rule-pretask` among them — have tests, so lint prints `method: says by hand while
      estimate-pretask-checks-the-plan names a test file`. The Case touches one promise of `rule-lint`
      — `estimate-lint-catches`; the other Estimates of lint it does not touch. `estimate-lint-catches`
      gets its `method` field from 211.3 in the same yaml, earlier in ledger order.'
    problem: 'The clause of 112.1 was written when a MOC had one Estimate covering its children: "by hand"
      on such a MOC would hide the children''s tests. Now a MOC can carry a second, cross-cutting Estimate
      — a reading of the behaviour of Plan Mode itself, not a pipeline; no test checks it, and naming
      `make test-plan-mode` in its `method` would be false. Lint names a contradiction that is none.'
    given: '`guppi lint` reads the `method` of every Estimate against its target; the tests in `tests/test_lint.py`
      fix the classes of findings, the live reading is `make lint` in the librarian''s run.

      **＋** `estimate-plan-mode-verified` names `make test-plan-mode`, a target of the Makefile.

      **－** The Makefile and `render --check` do not change.'
    when: '`uv run guppi lint` reads the `method` of an Estimate whose target is a MOC.'
    then: 'A `make <target>` of the Makefile passes, whatever stands beside it.

      **＋** A reading (`by hand`, `reading`) passes when every child''s Estimate is a reading, or when
      another Estimate of the same MOC names a `make <target>` of the Makefile.

      **＋** Otherwise a finding `method: says by hand while <child estimate> names a test file`, one per
      page.

      **－** The Leaf rule does not change.'
  spec: vault/raw/2026-09-16/2238/spec.md
  applied: 01:48:01
- case: '213.1'
  decision: decision-case-213.1
  origin: raw/2026-09-16/2238/ledger.md#case-213.1
  targets:
  - kind: update
    category: estimates
    slug: estimate-pretask-checks-the-plan
    ref: estimate-pretask-checks-the-plan
  tags: []
  case_text:
    when: '`guppi pretask --check <plan>` runs.'
    then: 'The stamp is `--session`, else `CLAUDE_SESSION_ID`; with neither, one line on stderr `pretask:
      no session id; pass --session <stamp> from the hi: line`, exit 2, nothing checked.

      **＋** The session''s window is found as the ledger hook finds it: by the stamped `hi`, over the
      logs back to the date of its `session-start`; the `hi` of yesterday''s session is found after midnight.

      **－** The last `session-start` of today''s log is not read any more.'
    context: 'The Insight `insight-ledger-hi-tied-to-its-session-by-position` (`open`, severity 1, four
      lessons, deferred by 192 and 205) describes one fault: a `hi` was bound to its session by the `session-start`
      lines around it in the event log, and a foreign start or midnight broke the binding. Half of it
      is closed: `UserPromptSubmit` writes the `hi` with the session''s stamp (case 111), the ledger hook
      finds the window by the stamp and walks back across midnight (`hi_moment`, `session_event_logs`),
      the binding by position left with case 136.3. Two readers keep the old logic: `guppi pretask --check`
      — without `--session` and without `CLAUDE_SESSION_ID` (empty in the agent''s Bash, checked in this
      session) it takes the last `session-start` of today''s log — a foreign one beside a parallel session,
      none after midnight (`lesson-pretask-check-session-fallback-stops-at-midnight`); and the hook `PreToolUse
      ExitPlanMode` — it reads today''s log only, so after midnight it sees no `hi` and lets Plan Mode
      close without `/pre-task`. The stamp is in the context: the line `hi: HH:MM:SS <stamp> → raw/…`
      the hook prints at `/hi`. The Case touches `estimate-pretask-checks-the-plan` (`rule-pretask`),
      `estimate-pretask-hook-gates` (`rule-pretask-hook`) and `estimate-pretask-reconciles` (the Render
      of `rule-pretask`) — one per sub-case; `rule-ledger-write` and `rule-event-log` it does not touch.
      `estimate-pretask-hook-gates` is of the old shape: its `update` carries `set.method` (case 211)
      and its Criterion is written whole in the form of the model, the block of 136.2 folded in.'
    problem: Two readers guess the session where the ledger hook knows it. Guessing by position is the
      cause the Insight names; while it lives in `pretask`, the Insight cannot close, and `/pre-task`
      after midnight checks the wrong session or nothing, in silence.
    given: 'The ledger hook finds the session''s window by the stamp: the first `hi` of the stamp after
      its first `session-start`, over the logs from today back to the date of that start (`ledger.session_event_logs`,
