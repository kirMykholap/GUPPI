  sections:
    Criterion: 'Given:

      `guppi pretask --check <plan>` reads the Cases of the plan by their headings, the `then` blocks,
      the session''s `frontier.md` and the session''s ledger window; `guppi gate` writes the `pretask`
      line with the session''s stamp on the Skill call.

      **＋** An Estimate item of a `then` block is a `create` with `ref`, or an `update` with `set: {status:
      pending}`; its Criterion is the Case''s `given`, `when` and `then` unless the item wrote `sections:
      Criterion` itself (194.1).

