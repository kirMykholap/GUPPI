- case: '214.1'
  decision: decision-case-214.1
  origin: raw/2026-09-16/2238/ledger.md#case-214.1
  targets:
  - kind: update
    category: estimates
    slug: estimate-materialize-assembles
    ref: estimate-materialize-assembles
  tags: []
  case_text:
    when: '`guppi materialize` lifts a `create` or `defer` item of a `then` block into an entry.'
    then: 'Only the keys the category''s `schema.yaml` names as fields reach `fields`; the structural
      keys of the item go where they go today — `ref` to the entry, `sections`, `tags`, `file`.

      **＋** A key that is neither in the schema nor structural is marked `unknown: [key]` on the entry;
      `--show` prints it; the page does not get it; the entry applies.

      **＋** `incomplete` is counted by `REQUIRED`, as today.

      **－** The keys of the old shape (`method`, `contract`, `estimate_slug`, `estimate_kind` on a rule''s
      item) stay silently ignored — they are named in the Criterion, not `unknown`.'
    context: '`insight-materialize-lift-loses-a-schema-field` (`open`, severity 1, three lessons) was
      actioned by case 144.3 — "the table exists in code, `REQUIRED`" — and reopened by the librarian
      of 1955 with a third lesson: `_lift_item` copies every key of a `then` item into `fields` except
      a fixed skip list; case 194.1 gave the Estimate item a `ref`, the list was not extended, and `ref`
      landed on 15 pages as a field (F3, case 210). `REQUIRED` is the table of what is missing; the table
      of what *may* land on a page is not in the code — it is on disk: the `schema.yaml` of each category
      lists its `required` and `optional` fields. The Case touches one promise of `rule-materialize` —
      `estimate-materialize-assembles` (it gets `method` from 211.3, earlier in ledger order); `-marks-superseded`,
      `-fails-alone`, `-shows` and the others it does not touch.'
    problem: 'A skip list is wrong by construction: every new key of an item becomes a page field until
      somebody remembers the list. Three lessons are three times the same thing: the parser decided what
      reaches the page and was wrong, and lint named the page.'
    given: 'The `schema.yaml` of each category lists the fields of its page: `required` and `optional`.

      **＋** The tests in `tests/test_materialize.py` fix the lift; the live reading is the librarian''s
      run of this session.

      **－** `generate` does not change: it writes `fields` as it gets them.'
  spec: vault/raw/2026-09-16/2238/spec.md
  applied: 01:48:01
