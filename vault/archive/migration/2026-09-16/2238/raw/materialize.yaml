    Criterion: 'Given:

      `guppi lint` reads every live page of `wiki/<category>/` against the category''s `schema.yaml` and
      writes nothing.

      **＋** `estimates/schema.yaml` (193): `purpose`, `method`, `checked` are optional fields; `## Context`,
      `## Method` optional sections; `## Result` required on `passed` and `failed`.

      **＋** The tests in `tests/test_lint.py` fix the behaviour, one per class; the live reading is `make
      lint` in the librarian''s run of this session.

      **－** `render --check` and the Makefile do not change.


      When:

      `uv run guppi lint` reads the live pages of the vault.


      Then:

      Every live page is checked against the `schema.yaml` of its category; one line per finding, `<category>/<slug>:
      <class>: <what>`; exit 1 on any finding, 0 and no output on a clean vault; nothing is written.

      **＋** `schema`: a missing required field or section, a value outside the list, a conditional not
      met; `## When` is never required on a Decision page; `schema-prose`: `schema.md` and `schema.yaml`
      naming different fields or sections.

      **＋** `ref`: a slug in `parent`, `children`, `estimates`, `target`, `insight`, `addressed_by`, `deferred_by`
      or in a History wikilink that no live or archived page carries; a `[[…]]` in a body may name a hub
      file under `wiki/` by stem or path; a `[[slug]]` under a Decision page''s `## Criterion` that is
      no Estimate; a `### case N` block of an Estimate with no decision page.

      **＋** `origin`: both forms resolve in `raw/` or in `vault/archive/`; in neither, or in both, a finding.

      **＋** `path`: a file of `implementation_ref` or `governs` that does not exist.

      **＋** `orphan`: a live entity, rule or estimate that no live page''s frontmatter names; a lesson
      and an Insight never.

      **＋** `status`: `built` with an Estimate not `passed`, `draft` with every one `passed`; an Estimate
      `passed` or `failed` without `## Result`; an Estimate whose target is not an entity or a rule, or
      does not list it in `estimates`.

      **＋** `unread`: every Estimate `pending` or `failed` — one finding each, `unread: <status>`; red
      between a change of a promise and its reading, by design.

      **＋** `method`: the `method` field, or on a page of the old shape the `## Method` section; for a
      MOC''s Estimate a named `make <target>` of the Makefile passes whatever stands beside it, and a
      reading (`by hand`, `reading`) passes when the Estimates of every child are readings or when another
      Estimate of the same MOC names a `make <target>` of the Makefile (case 212); for a Leaf''s Estimate
      a `tests/` file that exists, the word `pytest`, a `make <target>` of the Makefile or a reading;
      else a finding.

      **＋** `decision`: a decision page with none of the four lists, or with `kind`/`target_slug`; a listed
      slug with a category prefix and no page.

      **＋** `deferred`: a placeholder earns one finding `deferred: <N> times since case <M>` in place
      of its `schema` and `orphan` findings; a page with `deferred_by` whose fields are in place earns
