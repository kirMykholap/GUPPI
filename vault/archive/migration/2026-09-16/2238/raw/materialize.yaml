decisions:
- case: '209'
  decision: decision-case-209
  origin: raw/2026-09-16/2238/ledger.md#case-209
  targets:
  - kind: create
    category: rules
    slug: rule-sprint
    ref: rule-documentation
  tags:
  - session
  - workflow
  - harness
  - librarian
  - sprint
  case_text:
    context: '`sprint.md` is the backlog of the sprint `migration`: the goal, the Definition of done,
      the Slices. It is a working file without a schema: `index.md` §1 says the librarian writes it, lint
      does not check it, `rule-brief` tells the librarian to change it "only when `handoff.md` tells you
      to", `/hi` reads it whole through `rule-internal-context`, `cleanup` and `archive` take the sprint
      id from its first `## migration` heading. The vault, asked through `ask-guppi`: no sprint page,
      no field from an Entity to a Rule, no render of `sprint.md`; the slugs `rule-sprint` and `entity-sprint-migration`
      are free; the tag `sprint` is not declared. The governed-files hook (`guppi/guard.py`) refuses an
      edit of any file a live Rule page names in `governs`, whatever the rule''s force. `built` is computed
      by the cascade of `generate` once every Estimate of the page is `passed`. This Case touches no Estimate:
      the page is new; its Estimate is created by 209.1.'
    problem: 'The close of an item in a session does not reach the sprint: the file is rewritten by hand
      a session later, and each time it is a Case of its own (F7 today, flag 5 of the handoff). No mechanism
      lets the `built` of a page close an item of the backlog. The sprint is the one file that says what
      gets built, and the one file whose state nobody computes.'
    given: 'The cascade of `generate` computes `built` on an Entity or a Rule once each of its Estimates
      is `passed`; `cleanup` sets `archived`.

      **＋** The guard refuses `Edit` and `Write` of a file a live Rule page names in `governs`.

      **＋** `sprint_id` reads the first `## <id>` heading of `sprint.md`.

      **＋** Order is the content of a page, not a field of an Entity MOC (`index.md` §6).

      **－** The script writes no page of `wiki/`: it reads statuses and writes one file.'
    when: The librarian runs `uv run guppi sprint` after `cleanup` and `render`, before the brief.
    then: 'The rule `rule-sprint` is a child of `rule-documentation`, where `generate` puts it, with `implementation_ref:
      [guppi/sprint.py, tests/test_sprint.py]` and `governs: vault/wiki/sprint.md`.

      **＋** A hand edit of `sprint.md` is refused by the guard with the same line as for a harness file.

      **＋** The backlog changes only by an `update` of the page `entity-sprint-migration` — a Case, not
      the librarian, not a hand.

      **－** Neither `sprint_id` nor the archive path changes: the `## migration` heading stays the first
      of the file.'
  spec: vault/raw/2026-09-16/2238/spec.md
  applied: 01:48:01
