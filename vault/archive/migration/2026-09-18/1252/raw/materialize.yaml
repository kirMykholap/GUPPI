  sections:
    Criterion: 'Given:

      `guppi render` without a flag writes every governed file and exits 0, or writes nothing and exits
      1.

      **＋** The units under `raw/` with a yaml are `units_with`; a yaml is applied whole when every entry
      carries `applied`.

