      When:

      `guppi render` without a flag wrote the files and exits 0.


      Then:

      In the `spec.md` of every unit under `raw/` whose yaml is applied whole, every unticked task line
      whose text opens with a code span holding `guppi render` becomes `- [x]`; nothing else changes.

      **－** A line where `guppi render` sits in a later code span — a `read `<slug>`` line, a line that
      names the command in its description — is not ticked.

      **－** `--check` and `--sync` tick nothing; exit 1 ticks nothing.

      **－** A unit without a yaml, with an unapplied or `failed` entry, or marked by `carry.md`, is not
      touched.'
