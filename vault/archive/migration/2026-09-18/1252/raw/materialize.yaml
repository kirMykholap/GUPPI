  origin: raw/2026-09-18/1252/ledger.md#L8
  fields:
    type: insight
    pattern: 'A `!` command of a skill is checked by a model call before it runs; when that call fails
      — a lapsed login, reported as the model unavailable — the substitution is refused and the Render:
      line comes back empty, while the SessionStart hook is not affected.'
    children:
    - lesson-hi-substitution-refused-when-the-permission-classifier-is-unavailable
    - lesson-hi-substitution-fails-when-the-login-has-lapsed
  tags:
  - harness
  - session
  - hooks
  sections:
    Pattern: Two lessons, one cause. At /hi of session 1119 the `!` substitution of `uv run guppi render
      --sync` was refused with "claude-opus-5[1m] is temporarily unavailable, so auto mode cannot determine
      the safety of Bash"; the lesson named the permission classifier's model. At the first /hi of session
      1252 the same refusal came with the client's login prompt beside it, and a second /hi after /login
      ran whole. The check of a skill's `!` command is a model call, and the call fails when the login
      has lapsed; the older lesson saw the symptom, the newer the cause.
    Proposal: 'One sentence in `rule-skill-hi`: a refused `!` substitution at /hi is a lapsed login —
      the cure is `/login` and `/hi` again, not `render --check` by hand and not an allow entry for the
      command. A suggestion, not a decision.'
