  case_text:
    context: '`entity-sprint-migration` holds the milestones of the sprint under `## Milestones`; Slice
      3b has two items, `rule-work-mode` and `rule-subagent-guppi`. Case 238 deferred `insight-workflow-code-live-before-the-page-it-reads`
      to Slice 3b, but the milestone does not name it, so the brief (229.4 leaves out only what the sprint
      page names) and `/hi` carry it as an item of its own. `guppi sprint` ticks an item by the status
      of its page: `DONE = {built, passed, archived}`; an Insight `actioned` is not in it, and as a line
      `- [[insight-…]]` of its own it would never close. The Case touches no Estimate: the render of `sprint.md`
      does not change, the text of one item does.'
    problem: Where on the sprint page to name the Insight so that it goes with `rule-work-mode` and does
      not stand as a separate item.
    given: 'The brief and `/carry` leave out of Deferred a target the sprint page names under a milestone
      or in its Backlog (case 229.4).

      **＋** `/hi` takes the Frontier from the current milestone (case 229.3).

      **－** An item line `- [[slug]]` is ticked only by a status in `DONE`; an Insight `actioned` is not
      in it.'
    when: The librarian applied the `update` and `guppi sprint` wrote `sprint.md`; the next brief and
      the next `/hi` read it.
    then: 'The item line of `rule-work-mode` in Slice 3b names `[[insight-workflow-code-live-before-the-page-it-reads]]`
      — the sentence of its Proposal enters the rule; case 238 is in the list of cases.

      **＋** The brief leaves the Insight out of Deferred; `/hi` carries it inside the item of Slice 3b.

      **－** The Insight stays `open`, `deferred_by: decision-case-238`; it has no line of its own in the
      milestone.'
