  tags: []
  case_text:
    context: '`generate`, once it applied an `estimate` entry of the yaml, ticks the first unticked line
      `- [ ] read `<slug>`` — in the Spec beside the yaml first, then in the Specs of the other sessions
      of `raw/`, oldest first. In the Spec beside the yaml it skips the sections of the Cases ratified
      after the reading (280); in the other Specs it skips nothing and looks at no Case. When a Case is
      superseded by another (`{supersedes:case N}`), its yaml entries are marked `superseded_by`: `generate`
      neither applies them nor ticks their page lines (151, 200.2), and Retro does not count their lines
      (282). But the `read` line of such a Case is an ordinary line to `tick_read`: in the run of 2106
      the reading of `estimate-case-protocol-loaded` landed on 1749:39 (Case 278, superseded by 279.1)
      and 1749:88 (279.1) stayed open. The Estimate page is right — `passed` on the Criterion of 279.1;
      the Spec says the opposite: a Criterion that is not there was read, and the signed one was not.
      The 1749 Spec is in the archive now, `generate` does not read it, and line 88 stays `[ ]` for good.
      The brief also names 1749:38 as ticked by the librarian of 1749 — in the file it is `[ ]`, as it
      should be for a superseded Case.

      `rule-page-generation` `draft` (`estimate-generate-rewords` pending); of the eight Estimates of
      the rule one is touched — `estimate-generate-ticks-the-spec` (`passed` 2106), the other seven not;
      an `update` with a `ref`, no vault query due.'
    problem: A reading closes the line of a Case whose work stands under another Case. The record in the
      Spec is wrong, and the line of the superseding Case never closes. Either this is contract — and
      `tick_read` skips the sections of superseded Cases by the marks of the yaml — or a fact for the
      reading of the Estimate, and the record stays wrong.
    given: 'A yaml entry of kind `estimate` carries `slug`, `status`, `result`, `line` and no `case`;
      a decision entry carries `case` and `line`, the number of its line in the ledger.

      **＋** A line `{supersedes:case N}` marks every entry of Case N `superseded_by`, in the yaml of any
      session under `raw/` (130.2, 175); `generate` neither applies them nor ticks their page lines (151,
      200.2).

      **＋** The lines of a superseded Case are not counted at Retro — its work stands under the superseding
      Case (282).

      **＋** The Spec of a session lies beside its `materialize.yaml` — `raw/<date>/<HHMM>/spec.md`; the
      Specs of the other sessions are the `spec.md` of their folders under `raw/`.

      **＋** A Case heading in the Spec is `## Case N — …` or `### Case N.M — …`; its section runs to the
      next such heading.

      **＋** A reading line of the Spec is `- [ ] read `<slug>`` with text after it, in any Case.

      **＋** `tests/test_generate.py` fixes the behaviour on a temp vault with a Spec beside the yaml and
      a second Spec with a yaml of its own in another session folder.

      **－** A Rule-class file entry `generate` does not apply — "applied by hand".'
    when: '`guppi generate` applied an entry and marked it `applied`.'
    then: 'For a `create`, `update`, `delete` or `defer` entry, in the `spec.md` of the same unit the
      first unticked line `- [ ] <kind> `<slug>`` in the section of the entry''s Case becomes `- [x]`;
      nothing else in the file changes.

      **＋** Two entries of one kind and slug in one Case tick two lines, in order.

      **＋** For an `estimate` entry, and for a `create` entry with `folded`, the first unticked line `-
      [ ] read `<slug>`` becomes `- [x]` — in the Spec beside the yaml first, then in the `spec.md` of
      the other session folders of `raw/`, oldest first; one line per entry.

      **＋** In the Spec beside the yaml, a `read` line in the section of a Case whose first decision entry
      of the yaml carries a `line` greater than the `line` of the `estimate` entry is not the reading''s
      line — the Case was ratified after it; the search goes on to the next line, then to the other sessions.

      **＋** In any Spec, a `read` line in the section of a Case whose entries in the yaml of that session
      are marked `superseded_by` is not the reading''s line — its work stands under the superseding Case;
      the search goes on. For the Spec beside the yaml the marks are the run''s entries; for the Spec
      of another session its `materialize.yaml` beside it, read for the marks alone; no yaml beside it
      — nothing is skipped there.

      **＋** A `create` entry with `folded` ticks both lines: the page line and the reading line; its Case
      is the reading''s Case, the filter of 280 does not apply to it; the filter by `superseded_by` does.

      **－** A line not found, a section not found, no Spec — no error and no stderr line; the entry is
      `applied` all the same.

      **－** `lesson` and Rule-class file entries, and an entry marked `failed`, tick no line; the lines
      on code, tests, migrations and `by hand` are the agent''s.

      **－** A Spec under `vault/archive/` is not read; the Specs of the other sessions are not filtered
      by `line`.'
  spec: vault/raw/2026-09-21/0019/spec.md
  applied: '10:37:53'
