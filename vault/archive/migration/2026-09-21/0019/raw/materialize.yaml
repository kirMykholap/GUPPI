  sections:
    Purpose: 'Prevents a working session from going on after a compaction without the Case schema, the
      Frontier and the Spec in its context. `/hi` loads the session''s texts once, through the `@` lines
      of its skill; a compaction keeps `CLAUDE.md` and a capped part of the skill''s body, and the rest
      survives only in the summary. This hook fires on `SessionStart` with `source: compact` and prints
      what to read back: the paths of the files `/hi` imports, the session''s `frontier.md` and its Spec,
      and the Frontier''s text itself. Paths, not texts: a hook''s stdout over 10,000 characters is saved
      to a file and the agent gets a preview (case 287).

      '
    How it works: '`uv run guppi recall`, registered on `SessionStart` with the matcher `compact` (`rule-hook-registry`).
      Reads the payload from stdin; with a `source` other than `compact` or without a `hi` in the session''s
      window — `session_dir` of `guppi/ledger.py`, the ledger hook''s own — it prints nothing, exit 0.
      Otherwise stdout holds one header line naming the time and the session''s folder, then one path
      per line: the `@` lines of `.claude/skills/hi/SKILL.md` in their order, the folder''s `frontier.md`
      when it exists, the Spec — `spec.md` of the folder, or before the approval the plan file the event
      log names last under `.claude/plans/`, as `guppi gate` finds it (case 122) — then `Frontier:` and
      the text of `frontier.md`. The list of files is the skill file''s, never a copy in the code. Exit
      0 always; the hook writes nothing.

      '
  applied: '10:37:53'
- line: 5
  text: decision[case 287][create][estimate-compact-recall-reloads]{ref:rule-compact-recall}{tags:session,hooks,harness}
  case: '287'
  kind: create
  slug: estimate-compact-recall-reloads
  origin: raw/2026-09-21/0019/ledger.md#case-287
  decision: decision-case-287
  ref: rule-compact-recall
  tags:
  - session
  - hooks
  - harness
  category: estimates
  fields:
    type: estimate
    kind: QA
    purpose: After a compaction of a working session the hook's header, the paths of the /hi files, the
      Spec and the Frontier's text stand in the context; an ordinary session and another source get nothing
    method: pytest tests/test_recall.py on a temp project; live — the first compaction of a working session,
      by hand, the hook's text in the context after it
    tags:
    - session
    - hooks
    - harness
  sections:
    Criterion: 'Given:

      `SessionStart` fires after a compaction with `source: compact`; the hook''s stdout on exit 0 enters
      the context as text; output over 10,000 characters is saved to a file and the agent gets a preview
      and the path (Claude Code docs, hooks guide).

      **＋** A `SessionStart` hook cannot block (`lesson-hooks-sessionstart-cannot-block`).

      **＋** The session''s window and folder are the ones the ledger hook finds: `session_dir` in `guppi/ledger.py`,
      the first `hi` of the stamp after its first `session-start`; `compact` does not close the window
      (case 14).

      **＋** The files `/hi` imports are the `@` lines of `.claude/skills/hi/SKILL.md`, the Render of `rule-internal-context`;
      the glossary joins them by C4.1.

      **＋** The Spec of a session is `spec.md` in its folder after the approval; before it, the plan file
      the event log names last under `.claude/plans/`, as `guppi gate` reads it (case 122).

      **＋** `tests/test_recall.py` fixes the behaviour on a temp project with an event log, a skill file
      and a session folder.


      When:

      The client compacted the context of the session — `/compact` or on its own — and `SessionStart`
      fired with `source: compact`.


      Then:

      With a `hi` in the session''s window, stdout holds: the line `recall: the context was compacted
      at HH:MM:SS; the session is raw/<date>/<HHMM>/. Read before the next reply:`; then one path per
      line — the `@` files of the `/hi` skill in their order, the session''s `frontier.md` when it exists,
      the Spec when one exists; then the line `Frontier:` and the text of `frontier.md` as it stands.

      **＋** The list of paths is the `@` lines of the skill file at the moment the hook fires, no copy
      in the code: a file added to `rule-internal-context` — the glossary by C4.1 — is in the list without
      a change to the hook.

      **＋** The texts of the files, the Frontier apart, are not printed — the paths only; the output stays
      under 10,000 characters.

      **－** Without a `hi` in the window — nothing on stdout, exit 0.

      **－** Another `source` — nothing: the matcher keeps the hook from firing, and the code checks `source`
      itself.

      **－** Exit 0 always; an error prints nothing and blocks nothing; the hook writes no file and no
      event line — `session-start compact` is already written by `guppi event`.'
  applied: '10:37:53'
