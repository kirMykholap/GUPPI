  case_text:
    context: '`/hi` brings `sprint.md`, `brief.md`, `case-schema.md` (and the glossary after C4.1) into
      the first turn through the `@` lines of the skill; `CLAUDE.md` lives in the system prompt. When
      the client compacts the context, `CLAUDE.md` is read again from disk, but the body of an invoked
      skill comes back capped at 5,000 tokens — after a compaction the Case schema, the Frontier and the
      Spec stand in the context only as far as the summary kept them. Two hooks run on `SessionStart`,
      both without a matcher: `guppi event session-start` (writes `session-start compact`; the `hi` window
      survives, case 14) and `guppi render --sync`. Nothing brings the session''s load back. A hook''s
      stdout over 10,000 characters is saved to a file, so the hook prints paths and the Frontier, not
      the texts.

      The vault: no page on compaction, `rule-compact-recall` free; the nearest is `rule-internal-context`
      (`built`), whose `estimate-internal-context-loaded` measures the first turn after `/hi`, not a compaction
      — not touched; `rule-session-start` (`built`, MOC) takes a fourth child, its `estimate-session-start-context`
      not touched; `rule-hook-registry` (`built`) — the registration, `estimate-hook-registry-rendered`
      measures the file against the page, its Criterion unchanged.'
    problem: After a compaction a working session goes on in Plan Mode or Work Mode without the Case schema,
      without the Frontier and without the exact text of the Spec — the agent works from a summary. A
      hook is needed that, after `compact`, brings back into the context what `/hi` brought at the start.
    given: '`SessionStart` fires after a compaction with `source: compact`; the hook''s stdout on exit
      0 enters the context as text; output over 10,000 characters is saved to a file and the agent gets
      a preview and the path (Claude Code docs, hooks guide).

      **＋** A `SessionStart` hook cannot block (`lesson-hooks-sessionstart-cannot-block`).

      **＋** The session''s window and folder are the ones the ledger hook finds: `session_dir` in `guppi/ledger.py`,
      the first `hi` of the stamp after its first `session-start`; `compact` does not close the window
      (case 14).

      **＋** The files `/hi` imports are the `@` lines of `.claude/skills/hi/SKILL.md`, the Render of `rule-internal-context`;
      the glossary joins them by C4.1.

      **＋** The Spec of a session is `spec.md` in its folder after the approval; before it, the plan file
      the event log names last under `.claude/plans/`, as `guppi gate` reads it (case 122).

      **＋** `tests/test_recall.py` fixes the behaviour on a temp project with an event log, a skill file
      and a session folder.'
    when: 'The client compacted the context of the session — `/compact` or on its own — and `SessionStart`
      fired with `source: compact`.'
    then: 'With a `hi` in the session''s window, stdout holds: the line `recall: the context was compacted
      at HH:MM:SS; the session is raw/<date>/<HHMM>/. Read before the next reply:`; then one path per
      line — the `@` files of the `/hi` skill in their order, the session''s `frontier.md` when it exists,
      the Spec when one exists; then the line `Frontier:` and the text of `frontier.md` as it stands.

      **＋** The list of paths is the `@` lines of the skill file at the moment the hook fires, no copy
      in the code: a file added to `rule-internal-context` — the glossary by C4.1 — is in the list without
      a change to the hook.

      **＋** The texts of the files, the Frontier apart, are not printed — the paths only; the output stays
      under 10,000 characters.

      **－** Without a `hi` in the window — nothing on stdout, exit 0.

      **－** Another `source` — nothing: the matcher keeps the hook from firing, and the code checks `source`
      itself.

      **－** Exit 0 always; an error prints nothing and blocks nothing; the hook writes no file and no
      event line — `session-start compact` is already written by `guppi event`.'
