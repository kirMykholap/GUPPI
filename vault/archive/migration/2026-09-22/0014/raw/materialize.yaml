      the Slug, `built`, `How it works` and Constraints notes, verbatim, one sentence on the edge after
      Constraints and one on the glossary page; `fields` and `sections` — the rows of the tables whole,
      `rules` and `## Terms` among them; `examples` — the two example pages.

      **－** `vault/wiki/entities/schema.md` does not exist.'
    context: '`glossary.md` — 50 rows in eight groups and a table of retired terms: `where` names a page
      on 28 rows, a `§N` of `index.md` on 19, `here` on 3. The file is changed by hand; `/hi` loads it
      through `rule-internal-context`. The pattern is the sprint: `entity-sprint-migration` holds its
      content in `## Milestones`, `rule-sprint` is its guard, writes `sprint.md`, `--check` in `make lint`,
