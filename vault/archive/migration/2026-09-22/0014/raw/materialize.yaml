      is the Makefile target over the whole suite, `estimate-harness-pipeline` covers `make test-harness`
      (render and lint). Vault: `entity-guppi`, `entity-glossary`, `rule-glossary` and the five Estimate
      slugs are free; `entity-sprint` `draft`, `rule-harness` `built`, `rule-documentation` `built`, `rule-lint`
      `built`, `rule-case-protocol` `draft`. The Render of `rule-entities-schema` was ratified in 305.2
