      origin, sprint, created, tags`; optional `parent, children, code_ref, deferred_by, rules`; values
      `kind: MOC | Leaf`, `status: draft | built | archived`; conditional — `Leaf` requires `parent`,
      `MOC` requires `children`; `computed: [rules]`; the sections `## Purpose` and `## History` required,
      `## How it works`, `## Milestones`, `## Backlog`, `## Closed`, `## Terms` optional.

      **＋** An Entity page with these fields, values and sections has no `schema` finding; one lacking
      a required field, with a value outside the list, with a conditional not met or lacking a required
      section has one finding per defect; an Entity with `rules` on live Rules has none; the glossary
      page with `## Terms` has none.

      **＋** The prose of the former `schema.md` stands in the file as data: `description` — the introduction,
      the Slug, `built`, `How it works` and Constraints notes, verbatim, one sentence on the edge after
      Constraints and one on the glossary page; `fields` and `sections` — the rows of the tables whole,
      `rules` and `## Terms` among them; `examples` — the two example pages.

      **－** `vault/wiki/entities/schema.md` does not exist.'
