      304.3) and do not exist yet — the field goes into their Render, so 305.1 supersedes 304.2 and 305.2
      supersedes 304.3 (299.1): the pages are born in the right shape, and the live legs of `estimate-prespec-catches-a-superseded-case`
      and `estimate-materialize-marks-superseded` are taken by it. `rule-page-generation` `draft`, `rule-sprint`
      `built`, `entity-sprint` `draft` (MOC, `estimates: []`), `rule-lint` `built`. The Estimates: `estimate-rules-schema-checked`
      and `estimate-entities-schema-checked` are created anew by the superseding Cases with the field
      in their Criterion; `estimate-lint-catches` gets a second `replace` pair of the session, on its
      `ref` line; `estimate-generate-writes-rules-from-applies-to` is new, on `rule-page-generation`;
      `estimate-generate-rewords` and the other Estimates of `rule-page-generation` are not touched; `rule-sprint`
      gets a field alone, its Estimates are not touched (296). In `materialize` the filter by the schema
      stands on a `create` and a `defer`, not on the `set` of an `update`, so `set: {applies_to: …}` passes;
      in the librarian''s run `render` comes after `generate`, so lint reads the new yaml. The slugs are
      free. Case 305.2 was superseded by 306.1 before the approval and left the Spec (299.1).'
    problem: Where every rule stands and whether a category MOC or a root is needed; how the edge Rule
      → Entity enters the schemas, who writes which side of it and who checks it; and how the field reaches
      the two Renders ratified an hour before.
