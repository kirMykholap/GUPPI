      tick of 306.6 marks a Spec line, never a term; `rule-work-mode`, a placeholder, is a live page and
      the `where` of Work Mode.

      The rows on `§N` and `here` go to the page whose meaning they name — after 304 the defining pages
      exist: the six schemas and `rule-page-schemas` take Entity, Rule, Estimate, Lesson, Insight, MOC,
      Leaf, Vault and the fields; `rule-page-generation` takes `origin`, `deferred_by` and the statuses;
      `rule-case-protocol` Ratification, Contract, Case, the ledger grammar and the agents. C4 model and
      Delegate — rejected ideas — and the four retired terms — retired — are not rows; the History of
      `entity-glossary` names them, their decisions stand in the archived ledgers of 2026-09-08 and 2026-09-09.'
    problem: 'How the glossary enters the graph as a thing: who its parent is and how the root earns its
      place; what its section and Estimate are; which rule guards it, how a term is added and how the
      file is rendered; who runs and checks the script; and where the 19 rows on `§N` and the 3 on `here`
      go, so that no row is lost.'
