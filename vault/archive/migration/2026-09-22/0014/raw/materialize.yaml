    Render: "<!-- rule-lessons-schema -->\ntype: lesson\ndescription: |\n  Three blocks: properties, body,\
      \ history. Always flat — grouping is what Insight is for.\n\n  A Lesson is a recorded fact, not\
      \ a ratified decision. It does not go through a Case and requires no ratification; the ledger hook\
      \ writes it directly.\n\n  Slug. Area + cause: `lesson-hooks-sessionstart-cannot-block`, `lesson-pricing-async-in-sync-tx`.\
      \ The area groups related lessons together in a plain file listing, and the cause makes near-duplicates\
      \ visible before anyone opens the index. Naming by symptom was rejected: two unrelated failures\
      \ often share one symptom, and the symptom is not what clustering compares.\n\n  There is no Estimate.\
      \ A lesson is a recorded fact: the trigger is the observation, and nothing about it is checked again.\
      \ An Estimate exists only for a page with a contract — an Entity or a Rule. A `knowledge` claim\
      \ is checked where it is leaned on: by the Estimate of the Rule built on it (case 53.1).\n\n  There\
      \ is no `reviewed` status. An intermediate \"the librarian looked at it\" state records nothing\
      \ useful — a lesson with no pair is simply still `new`, and will be reconsidered next session anyway.\
      \ Only membership in an Insight is a real change of state.\n\n  No `## Insight` section: the `insight`\
      \ field is the link (case 166.1).\nproperties:\n  required: [type, kind, root_cause, status, origin,\
      \ sprint, created, tags]\n  optional: [source, insight]\n  values:\n    kind: [error, knowledge]\n\
      \    status: [new, clustered, archived]\n  conditional:\n    - when: {kind: knowledge}\n      required:\
      \ [source]\n    - when: {status: clustered}\n      required: [insight]\nbody:\n  required: [\"##\
      \ Trigger\", \"## Root cause\", \"## History\"]\nfields:\n  type: |\n    required; `lesson`. Page\
      \ category.\n  kind: |\n    required; `error` | `knowledge`. `error`: something went wrong. `knowledge`:\
      \ external material studied once so the source never has to be supplied again.\n  root_cause: |\n\
      \    required; one line. Why it happened (`error`), or the mechanism the source claims (`knowledge`).\
      \ Lives in properties because the index line of the category is built from it, and clustering into\
      \ an Insight compares exactly this.\n  status: |\n    required; `new` | `clustered` | `archived`.\
      \ `clustered` once it belongs to an Insight. Archived when its Insight is `actioned`.\n  source:\
      \ |\n    required on `knowledge`; url or reference. Where the material came from.\n  insight: |\n\
      \    required on `clustered`; quoted wikilink `\"[[slug]]\"`. The Insight this belongs to, once\
      \ clustered. Written by the script. The scripts read the slug through the brackets; a slug without\
      \ a category prefix stays bare (case 148.2). The field is the link; no body section repeats it (case\
      \ 166.1).\n  origin: |\n    required; `raw/YYYY-MM-DD/HHMM/ledger.md#L<n>` — the date form, `raw/YYYY-MM-DD/ledger.md#L<n>`,\
      \ on pages born before 2026-09-13 (case 103.6). The ledger line. Unlike Entity and Rule, this points\
      \ at a `lesson[...]` line rather than a `decision[...]` one.\n  sprint: |\n    required; the sprint\
      \ id.\n  created: |\n    required; date.\n  tags: |\n    required; list. Includes what the material\
      \ applies to, for `knowledge`.\nsections:\n  \"## Trigger\": |\n    required. What happened (`error`),\
      \ or what was read (`knowledge`). The full account — the one-line version is `root_cause` in properties.\n\
      \  \"## Root cause\": |\n    required. Expands the property: why this happened, or what the source\
      \ actually claims and on what grounds.\n  \"## History\": |\n    required. Appended by hook, never\
      \ by an agent. Always the last section.\nexamples:\n  \"error\": |\n    ---\n    type: lesson\n\
      \    kind: error\n    root_cause: SessionStart cannot block, so nothing gated the first ledger write\n\
      \    status: clustered\n    insight: insight-hook-gating-assumptions\n    origin: raw/2026-09-08/ledger.md#L14\n\
      \    sprint: 2026-Q3-s4\n    created: 2026-09-08\n    tags: [hooks, ledger, session]\n    ---\n\n\
      \    ## Trigger\n    The first ratified decision of the session was written to `main` instead of\
      \ the session\n    branch. Noticed only at handoff, when the librarian found a ledger line outside\
