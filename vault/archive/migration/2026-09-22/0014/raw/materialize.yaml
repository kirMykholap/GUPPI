      \ they are listed. Editing the skill directly is meaningless — the next render\n    overwrites it.\
      \ Changes belong on these pages, through a ratified decision.\n\n    ## Render\n    <!-- rule-skill-hi\
      \ -->\n    <!-- rule-internal-context -->\n    <!-- rule-git-context -->\n    <!-- rule-github-issues\
      \ -->\n\n    Assemble the Frontier from the above and present it as a list: tasks, problems, debt\n\
      \    carried over, and where the sprint stands. Wait for the human to pick the order.\n    <!--\
