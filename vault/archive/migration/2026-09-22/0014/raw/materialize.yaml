  sections:
    Purpose: 'Prevents an Estimate page from carrying a field or section outside the shape lint checks,
      or lacking one it needs. The Render is `vault/wiki/estimates/schema.yaml`, the file `guppi lint`
      reads for every page of `wiki/estimates/`. The lists are what lint reads; `description`, `fields`,
      `sections` and `examples` are the prose of the former `schema.md` as data — lint refuses a listed
      name without a description and a description without a name (case 304.8).

      '
    Render: "<!-- rule-estimates-schema -->\ntype: estimate\ndescription: |\n  Three blocks: properties,\
      \ body, history. One schema for both kinds; sections that do not apply are omitted rather than left\
      \ empty.\n\n  An Estimate is the evidence. On a Rule it is a test that the guard works; on an Entity\
      \ it is a reading of the whole, which no single case can break. Which of the two it is, the prefix\
      \ of `target` says; the agent does not choose (case 240.3).\n\n  An Estimate is one promise, one\
      \ way to check it and the last result with its date (case 182). It is always a Leaf — never inline\
      \ on another page, never a MOC. Grouping is what the parent Entity's recursion already does. One\
      \ action (`when`) — one Estimate; the ＋/－ lines stay in its `then` while one run checks them; a\
      \ line with a test or a reading of its own is split off, and the axis of the split is the promise,\
      \ not the method.\n\n  `purpose`, `method` and `checked` are the fields of the model of case 182:\
      \ one line each, written on a page born since case 193; the older pages carry none until their recut\
      \ at their first touch — the update that sets `method` (case 211) — counted by lint as `unmigrated`\
      \ (case 202), so none is required yet (case 193). `target` names an Entity or a Rule; lint reports\
      \ any other category (case 53.1).\n\n  A `failed` Estimate is debt, not an endpoint: its target\
      \ stays `draft` and the librarian surfaces it in `brief.md` until a human decides. Absent a decision\
      \ to fix, the default is archival — something that cannot pass its own criterion should not sit\
      \ in the vault pretending to be work in progress.\n\n  Fields deliberately absent. `verified_at`\
      \ — `checked` takes its place (case 182, point 5): the date of the last reading, so lint can one\
      \ day catch a stale check. `blocking` — not yet. The distinction between a QA failure (blocks the\
      \ build) and a Research non-result (may be a fine outcome) is currently carried by `kind` plus human\
      \ judgment at the brief. `severity` — Estimates do not accumulate the way Insights do. `retry_count`\
      \ — a check that keeps failing is a Lesson, not a counter.\n\n  The two kinds sit at opposite ends\
      \ of the same schema: QA puts its weight on `Criterion` and treats `Result` as a formality, Research\
      \ often has a loose `Criterion` and carries everything in `Result`. That is why unused sections\
      \ are omitted rather than filled with placeholder text.\n\n  `Result` is overwritten, not appended.\
      \ It is about one run of one check: a test that passed, broke and was fixed leaves one current result;\
      \ the sequence of changes is what History is for. Same for Research: the page states what we currently\
      \ believe, and History records that the belief changed. `Criterion` is replaced, not appended: a\
      \ rule changes → the Estimate the Case names goes `pending` → the test or the reading → `passed`.\n\
      properties:\n  required: [type, kind, status, target, origin, sprint, created, tags]\n  optional:\
      \ [purpose, method, checked]\n  values:\n    kind: [QA, Research]\n    status: [pending, passed,\
      \ failed]\nbody:\n  required: [\"## Criterion\", \"## History\"]\n  optional: [\"## Context\", \"\
      ## Method\", \"## Result\"]\n  conditional:\n    - when: {status: passed}\n      required: [\"##\
      \ Result\"]\n    - when: {status: failed}\n      required: [\"## Result\"]\nfields:\n  type: |\n\
      \    required; `estimate`. Page category.\n  kind: |\n    required; `QA` | `Research`. QA: the expected\
      \ result is known in advance and checked against a stated criterion. Research: the result is not\
      \ known, and finding it produces new content — on an Entity only, since a Rule has its criterion\
      \ by definition; `failed` on a Research Estimate means the finding does not serve the purpose the\
      \ Estimate was made for — no answer, or the answer \"not this way\" — which of the two, the person\
      \ says in the estimate line; both are debt, a Case on a changed approach or archival; when a bar\
      \ grows out of the finding, it becomes a QA Estimate or a Rule (case 240.3); its `then` is a question,\
      \ its Result the finding. Reading a known criterion by eye is QA by hand, not Research.\n  status:\
      \ |\n    required; `pending` | `passed` | `failed`. Short state, from a fixed list. The narrative\
      \ belongs in the body.\n  target: |\n    required; quoted wikilink `\"[[slug]]\"` of an Entity or\
      \ Rule. The page with a contract this verifies; the scripts read the slug through the brackets (case\
      \ 148.2); a Lesson or an Insight has no Estimate (case 53.1). Written by the script from the ledger.\
      \ Without it the cascade — an Entity is `built` only once all its Estimates pass — cannot be computed.\n\
      \  purpose: |\n    optional; one line. The promise, for the list on the target page: the reader\
      \ of a rule sees its Estimates by `purpose` and opens only the touched ones. Written from the Case\
      \ on every page born since case 193; absent on the older pages until their recut, counted by lint\
      \ as `unmigrated` (case 202).\n  method: |\n    optional; one line. How the promise is checked:\
      \ the test command (`make test-x`, `pytest tests/test_x.py`); or where and when it is read by hand\
      \ — a live reading of a session start, the brief of a librarian's run; or, for Research, what is\
      \ measured. Written from the Case since case 193.\n  checked: |\n    optional; date. The date of\
      \ the last reading: the date the Result opens with, else the date of the reading's unit; written\
      \ by `generate` on every reading (case 201.1).\n  origin: |\n    required; `raw/YYYY-MM-DD/HHMM/ledger.md#case-N`\
      \ — the date form, `raw/YYYY-MM-DD/ledger.md#case-N`, on pages born before 2026-09-13 (case 103.6).\
      \ The ratified decision that created it.\n  sprint: |\n    required; the sprint id.\n  created:\
      \ |\n    required; date.\n  tags: |\n    required; list. Chosen at the vault query before the Case,\
      \ ratified in the Case.\nsections:\n  \"## Criterion\": |\n    required. The promise, written once:\
      \ the `given`, `when` and `then` of one Case, verbatim with their operands, as `Given:`, `When:`,\
      \ `Then:`. The Case that creates the Estimate writes it; an `update` that changes the promise replaces\
      \ it whole and sets the page `pending`; an `update` that names a part alone — a field, a `replace`\
      \ pair — keeps it, and a pair inside it sets `pending` (case 296); nothing is appended and no `###\
      \ case N` block exists (case 193; the blocks of the shape before it stand on the older pages until\
      \ their recut, counted by lint as `unmigrated`, case 202). The Criterion that was replaced stays\
      \ in the Spec of the session that wrote it, reached by `origin`, and in History. For Research the\
      \ `then` may legitimately be broad (\"determine whether we stay inside the latency budget\"); for\
      \ QA it should be exact.\n  \"## Result\": |\n    optional; required on `passed` and `failed`. Omitted\
      \ while `pending`. Its first line is the date of the reading and the command — `make test-x`, `pytest\
      \ tests/test_x.py` — or the place of a live reading; the result follows (case 199). For QA usually\
      \ one line more. For Research this is the substance of the page — findings, numbers, the conclusion\
      \ drawn.\n  \"## Context\": |\n    optional. The shape before case 193: the `problem` of the Case\
      \ that made the Estimate, written once. Not written to a new page — the Case is reached by `origin`;\
      \ dropped by the `update` that sets `method` (case 211).\n  \"## Method\": |\n    optional. The\
      \ shape before case 193: the `method` of the Case as a section. On a new page `method` is a field;\
      \ the `update` that sets `method` drops the section, and a recut — `sections: Criterion` on a page\
      \ without the field — is refused by `generate` unless `set` carries `method` (case 211).\n  \"##\
      \ History\": |\n    required. Appended by hook, never by an agent. Always the last section: `- <date>\
      \ created · <origin>`, `- <date> status: pending → passed`.\nexamples:\n  \"QA\": |\n    ---\n \
      \   type: estimate\n    kind: QA\n    status: passed\n    target: entity-discount-new-client\n \
      \   purpose: A client with no completed order gets a 0% discount\n    method: pytest tests/discounts/test_new_client.py\n\
      \    checked: 2026-09-08\n    origin: raw/2026-09-08/0900/ledger.md#case-2\n    sprint: 2026-Q3-s4\n\
      \    created: 2026-09-08\n    tags: [discounts, pricing]\n    ---\n\n    ## Criterion\n\n    Given:\n\
      \    The discount pipeline runs every rule in order and takes the first that applies.\n\n    When:\n\
      \    A client with zero completed orders asks for a discount.\n\n    Then:\n    The discount is\
      \ 0%.\n    **－** A client with one completed order is not a new client.\n\n    ## Result\n\n   \
      \ 2026-09-08, `pytest tests/discounts/test_new_client.py`: 3 passed.\n\n    ## History\n    - 2026-09-08\
      \ created · raw/2026-09-08/0900/ledger.md#case-2\n    - 2026-09-08 status: pending → passed\n  \"\
      Research\": |\n    ---\n    type: estimate\n    kind: Research\n    status: passed\n    target:\
      \ entity-cart\n    purpose: Whether the cart renders within 200ms, and what dominates the time if\
      \ not\n    method: measure the render at 10, 50 and 200 line items, against a seeded database\n\
      \    checked: 2026-09-11\n    origin: raw/2026-09-08/0900/ledger.md#case-1\n    sprint: 2026-Q3-s4\n\
      \    created: 2026-09-08\n    tags: [cart, performance]\n    ---\n\n    ## Criterion\n\n    Given:\n\
      \    A seeded database with carts of 10, 50 and 200 line items.\n\n    When:\n    A buyer opens\
      \ the cart.\n\n    Then:\n    Determine whether the cart renders within 200ms, and what dominates\
      \ the time if not.\n\n    ## Result\n\n    2026-09-11, the measurement of the method against the\
      \ seeded database: renders in 140ms at\n    50 items. At 200 items it reaches 380ms, dominated by\
      \ per-item price recalculation rather\n    than by rendering. The 200ms target holds for realistic\
      \ cart sizes; above roughly 120 items\n    it does not.\n\n    ## History\n    - 2026-09-08 created\
      \ · raw/2026-09-08/0900/ledger.md#case-1\n    - 2026-09-11 status: pending → passed\n<!-- /rule-estimates-schema\
      \ -->\n"
