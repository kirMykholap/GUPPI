      lacking one it needs. The Render is `vault/wiki/rules/schema.yaml`, the file `guppi lint` reads
      for every page of `wiki/rules/`. The lists are what lint reads; `description`, `fields`, `sections`
      and `examples` are the prose of the former `schema.md` as data — lint refuses a listed name without
