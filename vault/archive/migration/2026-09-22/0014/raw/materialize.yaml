      reads a page of `wiki/rules/`.'
    then: 'The file equals the Render. Lint reads from it: required `type, kind, purpose, status, estimates,
      origin, sprint, created, tags`; optional `enforcement, implementation_ref, governs, render_mode,
      parent, children, deferred_by, applies_to`; values `kind: MOC | Leaf`, `status: draft | built |
      archived`, `enforcement: hook | check | render`, `render_mode: full | partial`; conditional — `hook`
      and `check` require `implementation_ref`, `render` requires `governs`, `render_mode` and the section
      `## Render`, `MOC` requires `children` and forbids `enforcement: hook | check`; the sections `##
      Purpose` and `## History` required, `## Render` and `## How it works` optional; `ordered_children:
      true`.

      **＋** A Rule page with these fields, values and sections has no `schema` finding; one lacking a
      required field, with a value outside the list, with a conditional not met or lacking a required
      section has one finding per defect; a rule with `applies_to` on a live Entity has none.

      **＋** The prose of the former `schema.md` stands in the file as data: `description` — the introduction,
      Ordering, MOCs and enforcement, Enforcement, verbatim, and one sentence on the edge Rule → Entity
      after the paragraph of case 240.2; `fields` and `sections` — the rows of the tables whole, `applies_to`
      among them; `examples` — the four example pages.

      **－** `vault/wiki/rules/schema.md` does not exist.'
    context: 'The audit over the 47 pages of `wiki/rules/` — kind, parent, purpose, taken by grep, no
      page opened. 38 rules carry a parent: each is a step of the sequence of its phase (`rule-session-start`,
      `rule-plan-mode`, `rule-end-of-work`, `rule-documentation`; the order of `children` is content)
      or a tool under `rule-harness` (`rule-lint`, `rule-render-harness`, `rule-governed-files-hook`,
      `rule-bash-guard`, `rule-tests-clock-pinned`, the MOCs `rule-settings` and `rule-claude-md`). All
      stand: none is a condition on the pages of one category — `rule-synthesis` is about Insights, but
      it is a step of Documentation, and a page has one `parent`. The rules that hold for one category
      alone are the six schemas, one per category; no category has two, no category MOC is made, the schemas
      stay under `rule-page-schemas`. The five roots are the four phases and the harness: no root MOC
      over them — it would hold no cross-cutting promise of its own (the order of the phases is held by
      the hooks of each: the ledger hook without `/hi`, the prespec hook, the retro commit), and a MOC
      without an Estimate is against the rule. The four placeholders (`rule-work-mode`, `rule-subagent-guppi`,
      `rule-spec-box`, `rule-morph`) get a parent when they are taken up.

