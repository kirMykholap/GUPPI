    Render: "<!-- rule-insights-schema -->\ntype: insight\ndescription: |\n  Three blocks: properties,\
      \ body, history. Always a MOC — a single unclustered lesson is just a Lesson.\n\n  Insight is its\
      \ own type, not a kind of Lesson. It shares no fields with one: no `trigger`, no `root_cause`, no\
      \ `source`, no Estimate. It has `children`, `severity` and `addressed_by`, which a Lesson does not.\
      \ Two schemas under one name would have meant a page where most fields are inapplicable whichever\
      \ kind it is.\n\n  Created by the librarian, never by a decision; an `update` actions or rejects\
      \ it, a `defer` postpones it (case 124). It reaches the human through the Deferred list of `brief.md`\
      \ and becomes an ordinary ratified Case there.\n\n  Threshold. An Insight is created on the second\
      \ Lesson sharing a root cause. One occurrence is an incident; two is a pattern. The archive is not\
      \ searched. A Lesson is archived only when its Insight was actioned — its `clustered` children are\
      \ archived by the cascade of `generate` (case 104.2) — and that Insight stays live with its `pattern`\
      \ in its index line; a recurrence after the pattern was supposedly fixed is caught there, at the\
      \ cost of one index line, and reopens the Insight.\n\n  Reopening. `actioned` is not an end state.\
      \ When a new Lesson matches the root cause of an `actioned` Insight, the Insight returns to `open`\
      \ and the new Lesson becomes a child. Previously archived children stay archived, so `severity`\
      \ counts only the current run. No separate recurrence counter — the fact is legible from History\
      \ plus the retained `addressed_by`. One exception: a Lesson whose entry carries `addressed_by` —\
      \ a decision line of its own session marked it with `{addresses:<its slug>}`, the Case that closed\
      \ its cause. Then the Insight stays `actioned`, `addressed_by` moves to that decision, the Lesson\
      \ becomes a child and is archived with the other children by the cascade (case 284.4).\n\n  Slug.\
      \ Area + pattern, as for Lessons: `insight-hooks-lifecycle-assumptions`.\n\n  No `## Children` or\
      \ `## Addressed by` section: the fields are the links (case 166.1). `severity` is `count(children\
      \ where status != archived)`, recomputed by the cascade of `generate`.\nproperties:\n  required:\
      \ [type, pattern, status, children, severity, origin, sprint, created, tags]\n  optional: [addressed_by,\
      \ deferred_by]\n  values:\n    status: [open, actioned, archived]\n  conditional:\n    - when: {status:\
      \ actioned}\n      required: [addressed_by]\ncomputed: [severity]\nbody:\n  required: [\"## Pattern\"\
      , \"## History\"]\n  optional: [\"## Proposal\"]\nfields:\n  type: |\n    required; `insight`. Page\
      \ category.\n  pattern: |\n    required; one line. The shared root cause, stated once. The index\
      \ line of the category is built from it.\n  status: |\n    required; `open` | `actioned` | `archived`.\
      \ `actioned` when a ratified decision has addressed it. Not terminal — a new Lesson with the same\
      \ root cause reopens it, unless its entry carries `addressed_by`: a decision of its own session\
      \ closed its cause, and the Insight stays `actioned` (case 284.4); an Insight made from a lesson\
      \ whose entry carries `addressed_by` is set `actioned` right after its `create`, by the librarian's\
      \ `update` (case 302.2). `archived` when the cascade of `generate` finds an `open` Insight with\
      \ no live child (case 104.3); an `actioned` Insight is never archived by the cascade, it is kept\
      \ for the recurrence.\n  children: |\n    required; list of quoted wikilinks `\"[[slug]]\"`. The\
      \ Lessons clustered here. Unordered. The scripts read the slug through the brackets; a slug without\
      \ a category prefix stays bare (case 148.2). The field is the link; no body section repeats it (case\
      \ 166.1).\n  severity: |\n    required; integer. `count(children where status != archived)`. Recomputed\
      \ by the cascade of `generate` (case 104.3), a child read in `wiki/lessons/` or in the archive (case\
      \ 110), never written by hand (case 110.1).\n  addressed_by: |\n    required on `actioned`; decision\
      \ quoted wikilink `\"[[slug]]\"`. The ratified decision that fixed the pattern, or rejected it (case\
      \ 124). The field is the link; no body section repeats it (case 166.1).\n  deferred_by: |\n    optional;\
      \ list of decision quoted wikilinks `\"[[slug]]\"`. The `defer` decisions that postponed it; set\
      \ by `generate`, cleared by a `supersedes` (case 124.2).\n  origin: |\n    required; date + session.\
      \ When the librarian first clustered it. Unlike every other category this does not point at a ledger\
      \ line — no decision created it.\n  sprint: |\n    required; the sprint id.\n  created: |\n    required;\
      \ date.\n  tags: |\n    required; list.\nsections:\n  \"## Pattern\": |\n    required. Expands the\
      \ property: what the clustered lessons have in common, stated as a mechanism rather than a list\
      \ of symptoms.\n  \"## Proposal\": |\n    optional. What the librarian suggests doing about it.\
      \ A suggestion, not a decision — it is ratified, rejected or reshaped in a later Case.\n  \"## History\"\
      : |\n    required. Appended by hook, never by an agent. Always the last section. Reopening is visible\
      \ here.\nexamples:\n  \"actioned\": |\n    ---\n    type: insight\n    pattern: Hooks were assumed\
      \ to gate execution without checking which events can block\n    status: actioned\n    children:\
      \ [lesson-hooks-sessionstart-cannot-block, lesson-hooks-subagentstart-no-gate]\n    severity: 2\n\
      \    addressed_by: decision-hook-capability-table\n    origin: 2026-09-15 · session-2026-09-15\n\
      \    sprint: 2026-Q3-s4\n    created: 2026-09-15\n    tags: [hooks, session]\n    ---\n\n    ##\
      \ Pattern\n    Both failures came from placing a guard on an event that cannot block. The events\
      \ were\n    chosen by when they fire, without checking whether a non-zero exit there actually stops\n\
      \    anything. The shape recurs because the two properties are independent and only one is\n   \
      \ obvious from the event name.\n\n    ## Proposal\n    A capability table in the session-start rule:\
      \ for each hook event, whether exit 2 blocks.\n    Consult it before placing any guard.\n\n    ##\
      \ History\n    - 2026-09-15 created · clustered from 2 lessons\n    - 2026-09-19 status: open →\
      \ actioned · decision-hook-capability-table\n<!-- /rule-insights-schema -->\n"
