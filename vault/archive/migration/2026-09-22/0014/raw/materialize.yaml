    given: '`rule-render-harness`: the text of a `## Render` section of a page with `render_mode: full`,
      between its markers, becomes the whole file named by `governs`, without the markers; two `full`
      pages on one file fail the render (`tests/test_render.py`).

      **＋** `rule-governed-files-hook` refuses a hand edit of a file a live rule governs.

      **＋** `rule-lint` reads from `vault/wiki/<category>/schema.yaml` `properties.required`, `optional`,
      `values`, `conditional` and `body.required`, `optional`, `conditional`; a missing file is a finding;
      other keys it does not read.

