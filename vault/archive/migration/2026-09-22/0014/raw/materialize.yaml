      written in the Case; the Entity''s `rules` is its backlink, computed (case 305).

      '
    Render: "<!-- rule-rules-schema -->\ntype: rule\ndescription: |\n  Three blocks: properties, body,\
      \ history. Mirrors Entity, with three differences that matter: how it is enforced, what a MOC means,\
      \ and that children are ordered.\n\n  A Rule is a standing condition one case can break, with a\
      \ guard that refuses that case when it occurs. The check: can one case refute it, and is there something\
      \ to refuse that case? Yes to both → a Rule, and its Estimate is the test that the guard works.\
      \ A condition no single case can break — a measure of the whole — is not a Rule but an Estimate\
      \ on an Entity; a condition with no guard is not one either. A Leaf is a condition on each case;\
      \ a MOC a sequence whose Estimate promises the order — one run out of order breaks it. A Rule is\
      \ of the harness or of an Entity: on an Entity it is a checkable requirement, and its Estimate promises\
      \ how the requirement is controlled. That single definition covers both harness hooks and code constraints\
      \ — see Enforcement below (case 240.2).\n\n  Ordering. `children` on a Rule MOC is an ordered list,\
      \ and the order is the content. A workflow MOC says `retro → handoff → documentation`; sorting those\
      \ alphabetically destroys the only thing the page was recording. Scripts that rebuild backlinks\
      \ must preserve the order given, and lint must not normalize it. This is the one place a Rule MOC\
      \ differs structurally from an Entity MOC, where children are independent requirements and order\
      \ is arbitrary.\n\n  MOCs and enforcement. `hook` and `check` are meaningless on a MOC: grouping\
      \ does not fire on an event and does not run against code. The force there lives in the children.\
      \ `render` is the exception. A MOC that renders holds the frame of a harness file — its structure\
      \ and the markers its children splice into — while each child renders one section. The frame is\
      \ not separable from the grouping: a MOC over three sections plus a separate Leaf holding an empty\
      \ template with markers would be two pages describing one thing. So a rendering MOC uses `render_mode:\
      \ full` on the target file, and its children with a Render use `partial` into the same file. Child\
      \ order is the order of sections in the output, which is the ordinary Rule-MOC rule about order\
      \ being content, applied literally. A child without a Render — a script the frame calls by name\
      \ — is a step of the workflow that contributes nothing to the file; the renderer skips it, and a\
      \ marker line for it is an error. Not every step of a workflow is a child page. The atomicity rule\
      \ applies as everywhere: split when parts fail independently and are fixed differently. Four `@`-imports\
      \ from the vault fail the same way (missing file, wrong path) and are fixed the same way — one Leaf,\
      \ listed in its body. But `git pull` and `gh issue list` fail differently, on conflicts versus authentication,\
      \ so those are separate Leaves. Intermediate MOCs need justification too. A MOC earns its place\
      \ when a cross-cutting Estimate can be stated for it; \"internal storage\" has none of its own —\
      \ the only meaningful check covers the whole load, and that belongs to the workflow MOC.\n\n  Enforcement.\
      \ Three ways a rule has force. `hook` — fires during the session lifecycle. Blocks a ledger write,\
      \ appends to `log.md` on every page change, refuses a commit while tests are red. `implementation_ref`\
      \ points at the script. `check` — runs against the code. This is where constraints live: \"synchronous\
      \ API only in this module\" is not a hook, it is a linter rule that catches `async` there. `implementation_ref`\
      \ points at the linter config or test. `render` — the rule's own body is the harness text. `governs`\
      \ names the target file, `render_mode` says whether the body replaces it entirely or is spliced\
      \ between markers `<!-- rule-slug -->` … `<!-- /rule-slug -->`. `render` is what closes the self-improvement\
      \ loop. Where `hook` and `check` describe something implemented elsewhere, a `render` rule is the\
      \ implementation — the page is the source of truth and a script regenerates the harness from it.\
      \ Change the rule through a ratified decision and the skill changes; there is no second copy to\
      \ drift. `render` applies to harness rules and to the vault files a rule renders — `case-schema.md`\
      \ from `rule-case-protocol` (case 273.1), each `schema.yaml` from a child of `rule-page-schemas`\
      \ (case 304). A constraint on an Entity — async in the pricing module — is a `check`: it has no\
      \ `render_mode`, because there is nothing in the harness to write it into; a `check` rule whose\
      \ script writes a file names that file in `governs`, so the guard reads the field alike (`rule-sprint`,\
      \ case 209.7). A constraint that no hook, check or render can detect is not a Rule at all. It is\
      \ a sentence in an Entity's `How it works`. Keeping that line sharp is what stops `rules/` from\
      \ filling with unenforceable declarations. Every Rule requires an Estimate. A broken hook breaks\
      \ the workflow as thoroughly as broken product code breaks the product — there is no \"documentation-class\"\
      \ exemption. In the harness a thing is a Rule when its code is a guard — it refuses a case: a hook,\
      \ a check, a render that refuses drift. A thing is an Entity when it is measured and has no guard\
      \ of its own; its guard is a separate Rule. The sprint is an Entity by this criterion — its Definition\
      \ of done is read, and `rule-sprint` is its guard — not an exception (case 240.2). A rule of an\
      \ Entity names it in `applies_to`, the edge Rule → Entity; the Entity's `rules` is the backlink,\
      \ computed by the cascade of `generate`. A rule constrains a case — a page, a session, a file —\
      \ never another rule: what a rule reads or guards among the rules follows from `implementation_ref`\
      \ and `governs` and is never written (case 305).\n\n  No body section is derived from a ref field:\
      \ `estimates`, `children`, `parent` and `implementation_ref` are the link, seen by Obsidian since\
      \ case 148.1 (case 166.1). `deferred_by` is written on a defer and cleared on a `supersedes` by\
      \ `guppi generate`, never by hand (case 52.3).\nproperties:\n  required: [type, kind, purpose, status,\
      \ estimates, origin, sprint, created, tags]\n  optional: [enforcement, implementation_ref, governs,\
      \ render_mode, parent, children, deferred_by, applies_to]\n  values:\n    kind: [MOC, Leaf]\n  \
      \  status: [draft, built, archived]\n    enforcement: [hook, check, render]\n    render_mode: [full,\
      \ partial]\n  conditional:\n    - when: {enforcement: hook}\n      required: [implementation_ref]\n\
      \    - when: {enforcement: check}\n      required: [implementation_ref]\n    - when: {enforcement:\
      \ render}\n      required: [governs, render_mode]\n    - when: {kind: MOC}\n      required: [children]\n\
      \      forbidden_values: {enforcement: [hook, check]}\nordered_children: true\nbody:\n  required:\
      \ [\"## Purpose\", \"## History\"]\n  optional: [\"## Render\", \"## How it works\"]\n  conditional:\n\
      \    - when: {enforcement: render}\n      required: [\"## Render\"]\nfields:\n  type: |\n    required;\
      \ `rule`. Page category.\n  kind: |\n    required; `MOC` | `Leaf`. MOC: a workflow — an ordered\
      \ sequence of rules. Leaf: one enforceable rule.\n  purpose: |\n    required; one line. What this\
      \ prevents, not what it provides. The index line of the category is built from it.\n  status: |\n\
      \    required; `draft` | `built` | `archived`. Set by the cascade of `generate` once every Estimate\
      \ passes, never by hand.\n  enforcement: |\n    optional; `hook` | `check` | `render`. How the rule\
      \ has force, and which of the fields below apply. On a Leaf, any of the three. On a MOC, only `render`\
      \ — see MOCs and enforcement.\n  implementation_ref: |\n    required on `hook` and `check`; list\
      \ of paths. The hook script, or the linter/test that performs the check. The field is the link;\
      \ no body section repeats it (case 166.1).\n  governs: |\n    required on `render`, allowed on `check`;\
      \ path. The file this rule's text is rendered into — a harness file, or a file of the vault such\
      \ as `case-schema.md` (case 273.1) or a `schema.yaml` (case 304); on a `check` rule, the file its\
      \ script writes — the governed-files hook refuses a hand edit of either (case 209.7).\n  render_mode:\
      \ |\n    required on `render`; `full` | `partial`. Whether the rule's body becomes the whole target\
      \ file, or is spliced between markers inside it.\n  parent: |\n    on a Leaf; quoted wikilink `\"\
      [[slug]]\"`. The workflow MOC above it. The scripts read the slug through the brackets; a slug without\
      \ a category prefix stays bare (case 148.2). The field is the link; no body section repeats it (case\
      \ 166.1).\n  children: |\n    on a MOC; ordered list of quoted wikilinks `\"[[slug]]\"`. See Ordering.\
      \ The field is the link; no body section repeats it (case 166.1).\n  estimates: |\n    required;\
      \ list of quoted wikilinks `\"[[slug]]\"`. On a Leaf: that the rule does what it claims. On a MOC:\
      \ that the sequence itself holds. Empty until the person names a promise. The field is the link;\
      \ no body section repeats it (case 166.1).\n  deferred_by: |\n    optional; list of decision quoted\
      \ wikilinks `\"[[slug]]\"`. The Decision pages whose `defer` targets this page. Written by `guppi\
      \ generate` on a defer, cleared when a later Case `supersedes` that one; the index line carries\
      \ it, so `ask-guppi` reaches the deferred decision without opening the page (case 52.3).\n  applies_to:\
      \ |\n    optional; list of quoted wikilinks `\"[[entity-slug]]\"`. The Entities this rule is the\
      \ guard of (case 240.2): a rule that guards a thing names it here — `rule-sprint` → `entity-sprint`,\
      \ `rule-harness` → `entity-guppi`; a rule of the process — a phase MOC and its steps — carries none;\
      \ written in the Case, never computed. The Entity's `rules` is the backlink, written by the cascade\
      \ of `generate` (case 305). The field is the link; no body section repeats it.\n  origin: |\n  \
      \  required; `raw/YYYY-MM-DD/HHMM/ledger.md#case-N` — the date form, `raw/YYYY-MM-DD/ledger.md#case-N`,\
      \ on pages born before 2026-09-13 (case 103.6).\n  sprint: |\n    required; the sprint id.\n  created:\
      \ |\n    required; date.\n  tags: |\n    required; list, ratified in the Case.\nsections:\n  \"\
      ## Purpose\": |\n    required. Expands the property: what goes wrong without this rule. State the\
      \ failure it prevents, not the behaviour it produces.\n  \"## Render\": |\n    required on `render`.\
      \ The text written into `governs`, wrapped in `<!-- slug -->` markers. This section is the implementation.\
      \ On a rendering MOC it is the frame, containing the children's markers.\n  \"## How it works\"\
      : |\n    optional. MOC only: why the steps are in this order, and what breaks if they are reordered.\
      \ On a Leaf the promise lives in its Estimates and the mechanism in the docstring of its code, or\
      \ in its Render; a Leaf that still carries the section keeps it until its next touch, when the section\
      \ leaves (cases 193, 200.2).\n  \"## History\": |\n    required. Appended by hook, never by an agent.\
      \ Always the last section.\nexamples:\n  \"MOC — a rendering workflow\": |\n    Holds the frame\
      \ of the skill file; children splice into its markers, in child order.\n\n    ---\n    type: rule\n\
      \    kind: MOC\n    purpose: Prevents a session from being loaded piecemeal by read-tool calls\n\
      \    status: draft\n    enforcement: render\n    governs: .claude/skills/hi/SKILL.md\n    render_mode:\
      \ full\n    parent: rule-session-start\n    children: [rule-internal-context, rule-git-context,\
      \ rule-github-issues]\n    estimates: [estimate-hi-no-read-calls]\n    origin: raw/2026-09-08/ledger.md#case-5\n\
      \    sprint: 2026-Q3-s4\n    created: 2026-09-08\n    tags: [session, harness]\n    ---\n\n    ##\
      \ Purpose\n    Prevents a session from being loaded piecemeal by read-tool calls. Bash substitutions\
      \ in a\n    command body resolve before the agent's first turn, so the context is simply present\
      \ —\n    there is no step the agent can forget or reorder.\n\n    ## How it works\n    Rendered\
