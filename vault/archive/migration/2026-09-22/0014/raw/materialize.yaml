    Render: "<!-- rule-decisions-schema -->\ntype: decision\ndescription: |\n  Every page has three blocks:\
      \ properties (frontmatter), body (per-category sections), history (appended by hook). This is the\
      \ schema for Decision. One page per Case, however many ledger lines the Case produced.\n\n  Slug.\
      \ `decision-case-<N>`: `decision-case-18.1`. Mechanical, because the script writes the page and\
      \ may not name anything; unique, because a Case id is. Nothing searches Decision pages, so the slug\
      \ needs no meaning beyond the Case it points back at. A Decision is reached by reference only: from\
      \ a target page's `deferred_by` (a deferred decision, case 52.3), from the `[[decision-case-N]]`\
      \ wikilink of a History line (case 52.4), or by the case id a `supersedes` carries.\n\n  Fields\
      \ deliberately absent. `ratification` — a Decision page cannot exist without it. The Case does not\
      \ close, no ledger line is written, no page is generated. A field with one possible value carries\
      \ no information; the fact is recorded by the page existing and by `origin`. `recommend` — if the\
      \ human accepted the proposal it became `Then`; if they changed it, `Then` holds the change. Either\
