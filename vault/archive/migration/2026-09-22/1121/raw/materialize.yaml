      When:

      `guppi render` writes the files, and the agent reads `case-schema.md` at the start of a session.


      Then:

      `case-schema.md` holds the text of `rule-atomicity` between its markers: the statement, the pair
      test — list the conditions of "done", and for each pair ask whether one could fail while the other
      passes and needs a different fix — and the scope: Case, Entity, Rule, Estimate; not a Lesson, a
      recorded fact does not split; not an Insight, which is born by clustering, the same rule in reverse;
      depth is not fixed in advance.

      **＋** `render --check` after the render exits 0; a hand edit of the file is refused by the hook.

      **＋** `rule-case-protocol` is a MOC with the child `rule-atomicity` and a marker line in its Render.

      **－** The rule has no refusal of its own in substance: the refusal of two promises in one Case stays
