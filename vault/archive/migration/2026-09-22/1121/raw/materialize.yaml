- case: '309'
  decision: decision-case-309
  origin: raw/2026-09-22/1121/ledger.md#case-309
  targets:
  - kind: update
    category: rules
    slug: rule-materialize
    ref: rule-materialize
  - kind: create
    category: estimates
    slug: estimate-materialize-refolds-a-reading-on-a-supersede
    ref: rule-materialize
  tags:
  - harness
  - librarian
  case_text:
    context: 'An `estimate[...]` line of the ledger does not become an entry of its own when the yaml
      of the unit already holds an unapplied `create` of the same slug: `fold_estimate` writes `status`
      and `result` into that `create` and keeps the line number in `folded`. The mark `{supersedes:case
      N}` comes later — on the line of the next Case — and marks every entry of Case N `superseded_by`;
      `generate` skips them, the folded reading with them. In 0014 the readings L52 and L53 (`estimate-rules-schema-checked`,
      `estimate-entities-schema-checked`, both `passed`) folded into the creates of 304.2 and 304.3, which
      305.1 and 306.1 replaced at once: the pages stand `pending` with no Result, `rule-rules-schema`
      and `rule-entities-schema` `draft`. The order in `lift_line`: the new `create` is appended to `entries`
      before `mark_superseded`, so at the moment of the mark the live `create` of the same slug is already
      there. A yaml is never rewritten — 0014 is not repaired by this; its two readings are taken again
      by hand (W2) and reach the pages as entries of their own in this session. `rule-materialize` `built`;
      of its Estimates the Case touches one new one only; `estimate-materialize-marks-superseded` it does
      not touch.'
    problem: A reading taken between a `create` and its `{supersedes}` is lost in silence — no `failed`,
      no `incomplete`, no line in the brief; it shows only as an empty Result on the page.
    given: '`materialize` folds an `estimate[...]` line into the unapplied `create` of the same slug in
      the unit''s yaml — `status`, `result`, the line number in `folded` (case 49).

      **＋** `{supersedes:case N}` marks every entry of Case N `superseded_by`; `generate` skips the marked
      ones (case 175).

      **＋** The live `create` of a line with `{supersedes}` reaches `entries` before the mark.'
    when: '`materialize` lifts a line with `{supersedes:case N}`, and a `create` entry of Case N holds
      `folded`.'
    then: 'The readings of `folded` move to the live `create` of the same slug in this unit — `status`,
      `result`, the line numbers; the marked `create` loses `status`, `result` and `folded`.

      **＋** With no live `create`, each reading becomes an `estimate` entry of its own from the ledger
