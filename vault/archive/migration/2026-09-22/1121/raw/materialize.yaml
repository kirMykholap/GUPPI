- line: 5
  text: decision[case 309][create][estimate-materialize-refolds-a-reading-on-a-supersede]{ref:rule-materialize}{tags:harness,librarian}
  case: '309'
  kind: create
  slug: estimate-materialize-refolds-a-reading-on-a-supersede
  origin: raw/2026-09-22/1121/ledger.md#case-309
  decision: decision-case-309
  ref: rule-materialize
  tags:
  - harness
  - librarian
  category: estimates
  fields:
    type: estimate
    kind: QA
    purpose: A reading folded into a create that a later supersedes marks moves to the live create of
      the same slug in the unit, or becomes an estimate entry of its own; no reading folds into a superseded
      create
    method: uv run pytest tests/test_materialize.py -k refold — create A, a reading, create B with supersedes
      A, the reading on B; create A, a reading, supersedes A without a new create, an estimate entry;
      a reading after the mark, not on A
    tags:
    - harness
    - librarian
  sections:
    Criterion: 'Given:

      `materialize` folds an `estimate[...]` line into the unapplied `create` of the same slug in the
      unit''s yaml — `status`, `result`, the line number in `folded` (case 49).

      **＋** `{supersedes:case N}` marks every entry of Case N `superseded_by`; `generate` skips the marked
      ones (case 175).

      **＋** The live `create` of a line with `{supersedes}` reaches `entries` before the mark.


      When:

      `materialize` lifts a line with `{supersedes:case N}`, and a `create` entry of Case N holds `folded`.


      Then:

      The readings of `folded` move to the live `create` of the same slug in this unit — `status`, `result`,
      the line numbers; the marked `create` loses `status`, `result` and `folded`.

      **＋** With no live `create`, each reading becomes an `estimate` entry of its own from the ledger
      line of that number, after the mark.

      **＋** A reading lifted after the mark is not folded into the marked `create`.

      **－** A mark on a Case of another unit (`elsewhere`) moves nothing — no live `create` is there;
      the readings of that yaml stand as they are.'
  status: passed
  result: '2026-09-22, uv run pytest tests/test_materialize.py -k "folded or after_the_mark": 3 passed,
    70 deselected — the reading moves to the live create, becomes its own entry without one, and does
    not fold into a marked create'
  folded:
  - 90
  applied: '17:10:22'
