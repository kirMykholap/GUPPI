  case_text:
    context: '§6 of `index.md` holds the atomicity rule: a unit stays whole while its closing judgment
      is indivisible; once it breaks into conditions that fail apart and are fixed apart, it splits into
      children. Only the specializations stand on pages: `rule-entities-schema` the MOC/Leaf cut and the
      Entity vs Estimate fork, `rule-rules-schema` "a Rule MOC is a workflow", `case-schema.md` the Splitting
      section for a Case. The statement itself, the pair test and the scope are nowhere, and `rule-entities-schema`
      points at "§6 of `index.md`", a pointer theme 4 removes. The rule cannot be checked in substance
      — like `rule-language` and `rule-agent-writing`, whose guard is that their text stands in the file
      the agent reads and does not drift from the page. Pages: `rule-case-protocol` a `draft` Leaf, `render_mode:
      full`, four Estimates, none touched — the Case adds a child and a marker line; `rule-entities-schema`
      `draft`, `rule-rules-schema` `draft`, `rule-prespec` `built` — each changed outside its Criterion.
      The slugs `rule-atomicity` and `estimate-atomicity-rendered` are free by the Grep over `rules/`
      and `estimates/`; the nearest are `rule-language` and `rule-agent-writing`, the same pattern on
      another file.'
    problem: Where the rule that splits a unit lives once `index.md` is gone, and what it refuses when
      it cannot be checked in substance.
    given: '`rule-render-harness`: a page with `render_mode: partial` writes the body of its `## Render`
      between the markers `<!-- rule-slug -->` … `<!-- /rule-slug -->` of the file in `governs`; `render
      --check` catches a drift.

      **＋** `rule-governed-files-hook` refuses a hand edit of a file a live rule governs.

      **＋** `rule-case-protocol` renders `case-schema.md` whole; `/hi` loads it in every working session.

      **＋** `pre-spec` refuses a Case with two Estimate items and no written `sections: Criterion` — the
      one mechanical refusal of this rule, signed for `rule-prespec`.'
    when: '`guppi render` writes the files, and the agent reads `case-schema.md` at the start of a session.'
    then: '`case-schema.md` holds the text of `rule-atomicity` between its markers: the statement, the
      pair test — list the conditions of "done", and for each pair ask whether one could fail while the
      other passes and needs a different fix — and the scope: Case, Entity, Rule, Estimate; not a Lesson,
      a recorded fact does not split; not an Insight, which is born by clustering, the same rule in reverse;
      depth is not fixed in advance.

      **＋** `render --check` after the render exits 0; a hand edit of the file is refused by the hook.

      **＋** `rule-case-protocol` is a MOC with the child `rule-atomicity` and a marker line in its Render.

      **－** The rule has no refusal of its own in substance: the refusal of two promises in one Case stays
      with `rule-prespec`.'
