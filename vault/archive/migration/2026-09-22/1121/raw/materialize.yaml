  case_text:
    context: 'The five phases of a session — `rule-session-start`, `rule-plan-mode`, `rule-work-mode`,
      `rule-end-of-work`, `rule-documentation` — stand as root MOCs with no parent, and their order lives
      only in the table of §9 of `index.md`. By the rule "a Rule MOC is a workflow" the order of the children
      is the content, and the MOC''s Estimate promises it. Each phase holds its own cross-cutting Estimate
      inside itself: `estimate-session-start-context` the difference between an ordinary and a working
      session, `estimate-end-of-work-order` the order Retro → commit → handoff → librarian. Nobody holds
      the chain whole: that all five left their marks in the session folder, and in that order. Pages:
      of the five, `rule-session-start`, `rule-plan-mode` and `rule-end-of-work` are `built`, `rule-work-mode`
      and `rule-documentation` `draft`; the slugs `rule-session` and `estimate-session-phases-in-order`
      are free by the Grep over `rules/` and `estimates/`, the nearest are `rule-session-start` (the first
      phase, not the chain) and `rule-harness` (the tools outside the phases). The Estimates of the phases
      are untouched: a parent is a field, not a promise (case 296).'
    problem: Where the order of the phases lives once `index.md` is gone, and what promises that the chain
      ran whole.
    given: 'A Rule MOC is a workflow: its children are ordered, the order is the content, and the MOC''s
      Estimate promises the order itself (`rule-rules-schema`).

      **＋** A session leaves its marks in `raw/<date>/<hi HHMM>/`: the `hi` line in the day''s log, `frontier.md`,
      `spec.md` with its approved stamp, `handoff.md`; the Retro commit and the librarian''s commit in
      `git log`.

      **＋** A session conserved by `/carry` leaves `carry.md` in place of the last three marks (case 190.3).'
    when: A session has ended, and someone reads its folder and `git log`.
    then: 'All five phases left a mark, and the marks ascend in time: `hi` → `frontier.md` → `spec.md`
      approved → the Retro commit → `handoff.md` → the librarian''s commit.

      **＋** `rule-session` is the parent of the five phases, its children in that order.

      **－** A session conserved by `/carry` ends at `carry.md`: the marks of Work Mode, End of Work and
      Documentation are absent, and that is not a failure.'
  spec: vault/raw/2026-09-22/1121/spec.md
