  case_text:
    context: 'The architecture catches a duplicate three times, and all three are at the moment of the
      decision: `rule-ask` before a `create` without `ref`, `pre-spec` before the Spec is approved, and
      the index check of the librarian, who may turn a `create` into an `update`. Two things are missing.
      The vault query asks "does this exist" but not "what of this already exists that the thing could
      use"; and the relation "A uses B" is written nowhere: `parent`/`children` is decomposition, `applies_to`/`rules`
      (case 305) is Rule → Entity only, and an Entity → Entity edge does not exist. So nobody can ask
      what a change to a module breaks, and the next agent sees no example of reuse. The Backlog line
      "the product model … `ask-guppi` through Entities" (session 1119) is about the same thing but names
      neither the edge nor the check. Pages: `entity-sprint-migration` `draft`, changed in this session
      by 310.2 and 318; the change is in `## Backlog` and touches no Estimate (case 296).'
    problem: The shape of reuse was worked out in this session and is lost by the next one unless the
      Backlog names its cut.
    given: 'A note in a milestone or in the Backlog is a task not yet cut into pages; it leaves only by
      the `update` of the Case that cuts it (case 313).

      **＋** `applies_to`/`rules` is the pattern of an edge: one side written in the Case, the backlink
      computed by the cascade of `generate`, the pair checked by lint (case 305).

      **＋** An edge Rule → Rule is refused: a rule constrains a case, never another rule (case 305).'
    when: The `/hi` of a later session takes the Backlog, or the person names the reuse item.
    then: 'The Backlog holds three notes: the edge `uses` / `used_by` between Entities — `uses` written
      in the Case, `used_by` by the cascade, the pair checked by lint, no Rule → Rule; the second required
      question of the vault query — what of the existing the thing could use, the answer in `context`,
      and the Case names what it found in `uses` or says why not; a lint finding on two live Entities
      naming one path in `code_ref` with no edge between them.

      **＋** The product-model line stays: `kind` and the records of a product are its part, not covered
      by the three notes.

      **－** This Case creates no page: a later session cuts the notes.'
