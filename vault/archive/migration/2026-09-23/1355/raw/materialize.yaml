      which 378.4 refuses.'
    given: '`guppi/materialize.py` — builds the yaml of a unit from its ledger: `parse_line`, `mark_addressed`.

      **＋** `tests/test_materialize.py` — fixes the assembly on a temp ledger.

      **＋** `rule-materialize` — states the marks in its Purpose.

      **＋** `estimate-materialize-carries-addresses` — the promise, its Criterion replaced whole.'
    when: '`guppi materialize` assembles a unit whose ledger holds a lesson line and a decision line of
      Case N, the one written second carrying the mark: `{addresses:<lesson slug>}` on the decision line,
      or `{addressed_by:case N}` on the lesson line.'
    then: 'The lesson entry carries `addressed_by: decision-case-N` at the entry''s level, set by one
      function for both marks.

      **＋** A decision entry with the mark carries `addresses: [<slug>, …]`.

      **－** The lesson page gets no `addressed_by` field.

      **－** A decision mark naming no lesson of the unit is `incomplete: [addresses]` on the decision
      entry, and the run does not fail.

      **－** A lesson mark with no decision line of Case N earlier in the unit is `incomplete: [addressed_by]`
      on the lesson entry, and the run does not fail.'
    problem: A lesson can reach the ledger after the decision that already closed its cause. Then the
      mark has no place, the synthesis opens the Insight again, and a Case is spent on a fact the yaml
      already holds. Apart from that, the Insight stands `open` now.
