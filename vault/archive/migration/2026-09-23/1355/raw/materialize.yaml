      the lesson line carries the mark, `{addressed_by:case N}` (Case 379); `materialize` must carry it
      to the same field by the same code. The Criterion of `estimate-materialize-carries-addresses` speaks
      of the decision''s mark alone; it is replaced whole by one promise — the lesson entry gets `addressed_by`
