      '
    How it works: '`uv run guppi ratified` on `Stop`. After a reply whose `LEDGER` block holds `- decision[case
      N]` lines of a kind other than `defer`, it reads the session''s transcript, finds the last earlier
      reply that shows `## Case N —` whole, and writes that Case into the plan file named by `gate.plan_path`
      and into the ratified copy `<plan>.ratified.md` beside it, outside the repository: the heading,
      `context`, `problem`, `given`, `when` and `then` as they stand, a block tagged `then` built from
      the sub-points of `tasks`, and a block tagged `tasks` of the task lines without their sub-points;
      the section of Case N is replaced when it stands, appended otherwise. A last showing that is a `DIFF`
      block writes nothing. No plan file, no showing, or a sub-point it cannot read: exit 2 with the reason
      on stderr; on the re-fire (`stop_hook_active`) exit 0. A defer-only Case is the agent''s, under
      `## Deferred`.

      '
