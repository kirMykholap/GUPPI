      — `[x]` when each is `built`, `passed` or `archived`, the statuses after ` · ` in the order of the
      slugs; a wikilink after the ` — ` is text; a line with no wikilink before the ` — ` is a note, `-
      [ ] <text>`, never ticked, keeping its milestone open.

