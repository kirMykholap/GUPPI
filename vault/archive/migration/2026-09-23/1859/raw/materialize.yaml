      to read the `context`. The text rule of `rule-agent-writing` (case 359) does not hold the facts
      in memory. Case 380 deferred the Insight; this Case takes it up. Also, before dispatching ask-guppi
      the agent writes a list of the decisions (cases 198, 203.2): a copy of the plan written by hand,
      while ask-guppi can read the plan and the pages itself; only the slugs of the deferred decisions
      are needed, for case 186.2. At the pre-spec of this session the agent, on its own, answered the
      findings with one report — each finding numbered, the fix it proposed or why it was known, and two
      decisions for the person — before it showed the changed Cases; the person found the step right and
      asked for it to be written; the skill does not hold it. The translation step 387.4 adds belongs
      to this Criterion too. The Criterion of `estimate-prespec-reconciles` describes the steps of the
      skill and is replaced whole. Every item is an `update` with a `ref`.'
    problem: Is the text rule enough against facts wider than their check, or is a check due — and where?
    given: '`insight-workflow-fact-signed-from-a-check-that-does-not-cover-it` — the Insight the Case
      sets `actioned`.

      **＋** `lesson-case-context-claim-wider-than-its-search` — its live child.

      **＋** `lesson-case-context-bookkeeping-written-from-memory` — its live child.

      **＋** `rule-prespec` — its Render is `.claude/skills/pre-spec/SKILL.md`, which dispatches `ask-guppi`.

      **＋** `estimate-prespec-reconciles` — the Estimate of the steps of that skill.

      **＋** `rule-agent-writing` — the text rule in `CLAUDE.md`: a claim no wider than its check.'
    when: The person invokes `/pre-spec`, or the agent calls the skill, before the Spec is approved.
    then: 'The agent translates the name, `context` and `problem` of every Case of the plan into English,
      then runs `guppi prespec --check` on the plan file with `--session <id>`, the eight-character id
      of the `hi:` line, and reads the first line of the output before the exit code — "no hi recorded
      for session …; nothing checked" means the wrong value; it fixes the plan, the frontier or the line
      for every finding until the command prints no finding.

      **＋** `ask-guppi` is dispatched once with the absolute path of the plan file and the instruction
      to read every Case outside `## Deferred` — `context`, `when`, `then`, the `then` block — and, for
      an `update` of a rule or an entity, the page''s `estimates`; of a Case under `## Deferred` it reads
      only the slugs of its `defer` items.

      **＋** Three questions: which decisions contradict a page of the vault, a rule of the vault, or each
      other; whether an Estimate the Case does not name speaks of the thing the Case changes; which fact
      of a `context` — a page''s status, a count, a case number, a claim that no page holds a thing —
      the vault does not bear out.

      **＋** The agent answers the findings with one report before any Case is shown again: each finding
      numbered, with the fix it proposes or why it is already known, and the decisions it needs from the
      person.

      **＋** Then the changed Cases are shown again in one reply; a wrong fact of a `context` is fixed
      in the plan as a change of prose.

      **＋** `guppi gate` writes the stamped `prespec` line on the Skill call; then Plan Mode exits again.

      **－** The agent writes no list of the decisions: the plan is the list.

      **－** The body of a deferred decision is not read; a Case that changes a page another Case of the
      plan defers is still a finding.'
