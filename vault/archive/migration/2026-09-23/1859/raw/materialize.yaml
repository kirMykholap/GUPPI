  sections:
    Criterion: 'When:

      The librarian, at synthesis, hangs a lesson whose entry carries `addressed_by: decision-case-N`
      on an existing Insight of the same pattern that stands `actioned` with `addressed_by: decision-case-M`.


      Then:

      When case N is later than case M — compared number by number, `378.5` after `378.4` — the `update`
      carries `set: {addressed_by: decision-case-N}`, and `status` stays `actioned`.

      **＋** When case N is not later than M, the `update` carries no `addressed_by`: the field stays `decision-case-M`,
      and `status` stays `actioned`.

