- case: '386'
  decision: decision-case-386
  origin: raw/2026-09-23/1859/ledger.md#case-386
  targets:
  - kind: update
    category: estimates
    slug: estimate-sprint-renders-the-backlog
    ref: estimate-sprint-renders-the-backlog
  tags: []
  case_text:
    context: '`guppi sprint` writes `sprint.md` from the page `entity-sprint-migration`. The current milestone
      comes out whole; a closed one and a later one as one heading line. After a whole block `render_milestones`
      puts a blank line; after a collapsed line it puts none, so two collapsed headings stand back to
      back, as Slice 4 and Slice 5 do now. Markdown reads them anyway, but every other heading of the
      file stands between blank lines. Only `sprint_id` in `guppi/materialize.py` reads the file by code,
      and it needs the first `## ` line, so the change does not touch it. `tests/test_sprint.py` fixes
      the lines back to back: `EXPECTED` and two assertions. The Criterion of `estimate-sprint-renders-the-backlog`
      describes the layout of the file, so it is replaced whole; the other four Estimates of `rule-sprint`
      speak of `--check`, the ticks in the Spec and the moves of milestones, and are left alone. The `update`
      carries a `ref`, so no vault query.'
    problem: The collapsed milestone headings in `sprint.md` stand with no blank line between them, while
      every other heading of the file is set off by blank lines.
    given: '`guppi/sprint.py` `render_milestones` — writes the milestone lines; the module docstring describes
      the file.

      **＋** `tests/test_sprint.py` — fixes the render on a temp vault.

      **＋** `estimate-sprint-renders-the-backlog` — the Estimate of `rule-sprint`; its Criterion describes
      the file.

      **＋** `rule-sprint` — the rule, `governs: vault/wiki/sprint.md`.

      **＋** `entity-sprint-<id>` — the one live sprint page the script reads, `entity-sprint-migration`
      today.

      **＋** `vault/wiki/sprint.md` — the file the script writes.'
    when: '`guppi sprint` runs with a live page `entity-sprint-<id>` and reads its `estimates`, `## Purpose`,
      `## Milestones`, `## Backlog` and `## Closed`.'
    then: 'The file: `# Sprint`; `## <id>`; Purpose; `**Done when**`, one line per Estimate; then `##
      Milestones`: a closed milestone as one line `### [x] <name>`; the current one as the heading `###
      [ ] <name>` and each item with its status and `deferred_by`; each later one as one line `### [ ]
      <name> — N items: ` and its items separated by commas — an item with a wikilink as `[[slug]]`, an
      item without one by its text, no tick and no status; then `## Backlog`, each item a line; then `##
      Closed` as it is.

      **＋** Every heading of the file stands between blank lines: a blank line follows each `### ` line,
      collapsed or whole.

      **＋** An item is ticked by the statuses of every page its `[[slug]]` before the first ` — ` names
      — `[x]` when each is `built`, `passed` or `archived`, the statuses after ` · ` in the order of the
      slugs; a wikilink after the ` — ` is text; a line with no wikilink before the ` — ` is a note, `-
      [ ] <text>`, never ticked, keeping its milestone open.

      **＋** A milestone is closed when every item is `[x]`; with no item it is open.

      **－** A slug with no live or archived page: one line on stderr, exit 1, the file not written; `--check`
      compares this same render.

      **－** The script writes no page of `wiki/`, `entity-sprint-<id>` included.'
