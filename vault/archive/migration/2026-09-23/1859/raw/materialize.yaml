  sections:
    Purpose: 'Prevents a ratified Case from changing in what the scripts apply without the person seeing
      it whole and ratifying it again. The prose of a Case — its name, `context` and `problem` — is Russian
      in the ratified copy and English in the approved Spec, so it is not compared; everything the scripts
      apply is.

      '
    How it works: '`uv run guppi ratified --edit` on `PostToolUse` of `Edit`, `Write` and `MultiEdit`
      on the plan file: it compares each Case of the ratified copy `<plan>.ratified.md` with its section
      in the plan — the ids, `given`, `when`, `then`, the `then` block and the `tasks` block — and, for
