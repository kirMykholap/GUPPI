  sections:
    Criterion: 'When:

      The agent calls `Bash`, and `uv run guppi bashguard` on `PreToolUse` reads `tool_input.command`
      of the payload and finds every heredoc (`<<` or `<<-`, the marker quoted or not) and its body up
      to the closing line.


      Then:

      A body with a backslash, or a marker line that writes a file (`>` or `>>` not to `/dev/null`, `tee`),
      exits 2 with the reason on stderr: `bashguard: heredoc refused — <a backslash in its body | it writes
      <path>>. Write the script with the Write tool into the scratchpad and run it by path; change a file
      with Edit. The refusal is this guard working as designed, not an event of the session: do not report
      it at Retro.`

      **＋** Before the refusal one line `- HH:MM:SS <stamp> bashguard refused: <reason>` goes to `raw/<date>/event_log.md`.

      **＋** A `<<<` here-string, a heredoc with no backslash and no file write, a command without a heredoc,
      another tool — exit 0.

      **＋** A payload the hook cannot read — exit 0 with one line on stderr.

      **－** The hook never raises.'
