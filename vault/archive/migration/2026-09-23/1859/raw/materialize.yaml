  sections:
    Pattern: A Case is composed from what the agent has in view — the dialogue, the rule page, the code
      — and the pages it changes or runs beside are not read against it before it is shown, so a contradiction
      with them is found only by a later check. In session 1809 of 2026-09-15 Cases 175 and 164 changed
      the contract of a rule without reading the Estimate pages that take the new block; ask-guppi at
      pre-task found the contradicting blocks (`lesson-plan-mode-contract-change-skips-the-estimates-blocks`).
