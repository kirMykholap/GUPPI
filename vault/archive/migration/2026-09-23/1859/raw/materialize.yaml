  case_text:
    context: '`rule-bash-guard` refuses a heredoc with a backslash or with a file write and sends the
      agent to Write. The agent follows it, and at every Retro reports the refusal as a finding. The refusal
      is the behaviour the hook was made for, so these reports are noise. The message of the hook (`guppi/bashguard.py`,
      the function `run`) says what to do, but not that the refusal is normal. Case 382 deferred this;
      this Case takes it up. Three places quote the message: the How it works of `rule-bash-guard`, the
      Criterion of `estimate-bash-guard`, and the test; the How it works also names the log line `bashguard:
      <reason>`, while the code writes `bashguard refused: <reason>`. `estimate-bash-guard` stands in
      the shape before case 193 — a `### case 127` block, `## Context` and `## Method`, no `method` or
      `purpose` field — so its Criterion is replaced whole and the fields are set in the same `update`;
      the lines of the old Criterion on the page''s creation and on the registration in `settings.json`
      leave it, being the bookkeeping of case 127 and not the behaviour of the hook. Every item is an
      `update` with a `ref`, so no vault query.'
    problem: The message of the hook does not say that the refusal is legal and needs no report, so the
      agent takes it for an event of the session each time.
    given: '`rule-bash-guard` — the rule; its How it works quotes the message.

      **＋** `estimate-bash-guard` — the Estimate of the rule; its Criterion quotes the message.

      **＋** `guppi/bashguard.py` — the function `run` prints the message, the module docstring quotes
      it.

      **＋** `tests/test_bashguard.py` — the tests of the refusals check the message.

      **＋** `raw/<date>/event_log.md` — the day''s event log the hook writes the refusal line to.

      **＋** `/dev/null` — the one redirect target that is no file write.

      **＋** `decision-case-382` — the deferred decision the Case takes up.'
    when: The agent calls `Bash`, and `uv run guppi bashguard` on `PreToolUse` reads `tool_input.command`
      of the payload and finds every heredoc (`<<` or `<<-`, the marker quoted or not) and its body up
      to the closing line.
    then: 'A body with a backslash, or a marker line that writes a file (`>` or `>>` not to `/dev/null`,
      `tee`), exits 2 with the reason on stderr: `bashguard: heredoc refused — <a backslash in its body
      | it writes <path>>. Write the script with the Write tool into the scratchpad and run it by path;
      change a file with Edit. The refusal is this guard working as designed, not an event of the session:
      do not report it at Retro.`

      **＋** Before the refusal one line `- HH:MM:SS <stamp> bashguard refused: <reason>` goes to `raw/<date>/event_log.md`.

      **＋** A `<<<` here-string, a heredoc with no backslash and no file write, a command without a heredoc,
      another tool — exit 0.

      **＋** A payload the hook cannot read — exit 0 with one line on stderr.

      **－** The hook never raises.'
