- case: '406'
  decision: decision-case-406
  origin: raw/2026-09-24/2214/ledger.md#case-406
  targets:
  - kind: update
    category: rules
    slug: rule-case-protocol
    ref: rule-case-protocol
  - kind: update
    category: estimates
    slug: estimate-case-protocol-case-form
    ref: estimate-case-protocol-case-form
  tags: []
  case_text:
    context: 'The agent writes counts in the story sections of a Case: how many lines a journal has, how
      many Estimates are touched. A count goes stale first. An item is added or removed, the count stays
      in the text and goes into the Spec and onto the Decision page. In session 1916 this was a source
      of errors. `CLAUDE.md` already says that a count comes from the run that printed it. But a Case
      is written before the run and edited after it, and nothing checks the count in it. Today the Language
      paragraph of the Render of `rule-case-protocol` forbids in the story sections a count of sentences,
      line numbers and quotations. It does not forbid a count of items. The rule goes into `case-schema.md`,
      not into `CLAUDE.md`: `CLAUDE.md` works without GUPPI too, and only `/hi` loads the Case schema.
      `estimate-case-protocol-case-form` stands `pending`. Case 396.1 of the conserved Spec of session
      1916 already replaces its Criterion whole. This Case takes the `when` and `then` of 396.1 and extends
      the line on `context`, so the Spec of 1916 is applied first. An `update` with a `ref`, no vault
      query. `frame-guppi` found no contradiction. The other Estimates of the rule speak of other things,
      and this Case does not touch them. `estimate-agent-writing-followed` speaks of the width of a claim
      in any text of the agent, which this Case does not change, so it is not touched either.'
    problem: The rule does not forbid a count of items in `context`, `problem` and `recommend`. A stale
      count goes into the Spec and onto the Decision page, and neither the ratification nor a script catches
      it.
    given: '`rule-case-protocol` — its Render `vault/wiki/case-schema.md`: the Sections table and the
      Language paragraph on the story sections.

      **＋** `estimate-case-protocol-case-form` — the Estimate whose Criterion is replaced.

      **＋** `rule-agent-writing` — the writing rule in `CLAUDE.md`: a count comes from the run that printed
      it.'
    when: The agent shows a Case in the chat, at its first showing or again.
    then: 'The Case opens with the heading `## Case N — name`, a sub-case with `### Case N.M — name` under
      its parent, and holds its sections in the order of the Sections table, each one blockquote whose
      first line is `**name:**`.

      **＋** `context` is prose: the mechanism in plain words first, then the state of the pages the Case
      changes, the vault''s answer and why an Estimate of the rule is not touched; a case number stands
      in `context` or `problem` only when the Case is about that case, and a count of items stands in
      none of the story sections unless the Case is about that count.

      **＋** `given` holds the frame, one thing per line — each page, module, file and test the Case touches
      and the rule that constrains, its slug or path in a code span and its role — and no state; `when`
      and `then` name only what `given` names.

      **＋** In `given`, `when` and `then` each line after the first opens with `**＋**` or `**－**`, a `**－**`
      line names something of `given` or `when`, and `then` holds behaviour only.

      **＋** `tasks` names by slug each Estimate the Case creates or replaces, and under a line whose item
      writes content that content stands as sub-points; no `contract` line and no "block N" line.

      **＋** A pair under `replace` or `reword` stands only when the Case says what the sentence around
      each match names; a Case that changes the behaviour of a page gives an `update` to each Estimate
      of that page whose Criterion speaks of the change.

      **＋** `ratification` holds only the preview of the ledger lines in an untagged fence; the agent''s
      own text stands after the Case, after one horizontal rule, and the reply ends with a plain question.

      **＋** A Case with sub-cases is shown in one reply: the parent''s `context`, `problem` and `recommend`,
      then each sub-case whole.'
