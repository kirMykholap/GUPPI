  case_text:
    context: 'Case 407 was ratified in this session and leaves the Spec by this Case. Its mechanism: `prespec
      --check --case N` checks one Case without the Frontier and the translation; the `Stop` hook of `rule-spec-write`
      runs it on each Case it writes and gives the findings back by exit 2; a `PreToolUse` guard of `rule-spec-reconcile`
      refuses every edit of the plan by the agent but its creation and the part below `## Deferred`; the
      agent writes the name, `context`, `problem`, `given` and the task lines that are no items through
      a `Write` of `<plan>.fragment.md`, which the guard refuses, merges into the plan and checks; the
      comparison with the ratified copy drops `given` and the task lines that are no items. The full text
      of Case 407 stands in the ratified copy of this plan. The pre-spec of this session found in it what
      the next session answers first: a `given` written unshown still reaches the Decision page, against
      the purposes of `rule-spec-write` and `rule-spec-reconcile`; the `ratification` row of the Case
      schema keeps clauses on an edit of the plan and a `DIFF` of it, and a new task line on a file changes
      the scope; `is_plan` takes the fragment and the plan of a subagent for plan files; the finding of
      a ledger line that does not parse names no Case; `estimate-case-protocol-checks-its-frame` reads
      a changed `given` before a showing again, which would no longer happen; an exit 2 after the acknowledging
      reply makes the agent go on after its `LEDGER` block; no page says whether `guppi ledger` writes
      its lines before `guppi ratified` checks them at the same `Stop`; in Plan Mode the client may ask
      the person before a `Write` outside the plan file, by `lesson-permissions-reading-taken-by-the-agent-who-cannot-see-the-prompt`.
      The question of Case 410 — when the prose of a Case is translated — waits for the same mechanism
      and is taken in here.'
    problem: 'How the Spec is written by hooks alone, with each Case checked at once: decided in a later
      session, with the findings above answered.'
