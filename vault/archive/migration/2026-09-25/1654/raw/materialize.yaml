      that this write is not allowed to the agent. That stays true: the list of permissions does not change,
      the client asks the person before this edit, and this Case signs the edit itself. The list of yaml
      marks in `rule-documentation` says nothing of `superseded_by`, so it also stays true. The Criterion
      of `estimate-materialize-marks-superseded` promises that an entry without `case` gets no mark from
