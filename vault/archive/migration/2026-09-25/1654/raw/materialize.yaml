  case_text:
    context: 'In the ledger of session 1228, line 40 is the reading of `estimate-frame-check-finds-a-contradiction`,
      taken on the old Criterion, on dispatches of `frame-guppi`. In the same Spec Case 419.2 replaced
      that Criterion whole and renamed the page to `estimate-case-build-writes-the-case`. So `generate`
      does not find the page, sets `failed` on the entry and repeats that error at each run. The handoff
      of session 1228 asked not to apply this reading: by case 283 a reading of an Estimate is not taken
      while its new Criterion is not built.

      While the entry carries `failed`, the yaml of session 1228 is not applied whole. The function `applied_whole`
      in `guppi/render.py` asks every entry for `applied` or `superseded_by`, and none with `failed`.
      So `render` does not tick the render lines in the Spec of session 1228, and `kept_reason` in `guppi/archive.py`
      keeps the unit in `raw/`. All other entries and decisions of this yaml carry `applied`.

