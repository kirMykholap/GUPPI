  change: the Criterion replaced whole — a second item of one kind and slug under one Case is a finding
    (case 426)
  sections:
    Criterion: 'When:

      `uv run guppi prespec --check <plan>` compares the decision lines of the session''s window with
      the items of the plan''s `then` blocks.


      Then:

      A decision line whose Case has no heading in the plan is the finding `case N: line [kind][slug]:
      no Case N heading in the plan`; one whose Case holds no item of its kind and slug is `case N: line
      [kind][slug] has no item in the plan`.

      **＋** An item with no decision line of its kind and slug under its own Case heading — a sub-case''s
      heading included — is the finding `case N: item [kind][slug] has no decision line`.

      **＋** A nested `estimate` of a `create` needs no line of its own: the line of its parent covers
      it.

      **＋** A second item of one kind and slug under one Case heading — in the same fence tagged `then`
      or in another one — is the finding `case N: item [kind][slug] stands twice — one entry per target`:
      one decision line covers one item.

      **－** A `create` and an `update` of one slug, or items of one slug under two Case headings — sub-cases
      included — are no finding of this kind.'
  applied: '23:47:05'
