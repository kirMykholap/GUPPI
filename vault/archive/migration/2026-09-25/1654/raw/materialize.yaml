  sections:
    Criterion: 'When:

      The main agent shows in the chat a Case that `case-guppi` built, at its first showing or again.


      Then:

      The Case opens with the heading `## Case N — name`, a sub-case with `### Case N.M — name` under
      its parent, and holds its sections in the order of the Sections table of `vault/wiki/case-schema.md`,
      each one blockquote whose first line is `**name:**`.

      **＋** `context` is prose: the mechanism in plain words first, then the state of the pages the Case
      changes, the vault''s answer, what `case-guppi` found in the frame and why an Estimate of the rule
      is not touched; a case number stands in `context` or `problem` only when the Case is about that
      case, and a count of items stands in none of the story sections unless the Case is about that count.

      **＋** `given` holds the frame, one thing per line — each page, module, file and test the Case touches
      and the rule that constrains, its slug or path in a code span and its role — and no state.

      **＋** In `given`, `when` and `then` each line after the first opens with `**＋**` or `**－**`, a `**－**`
      line names something of `given` or `when`, and `then` holds behaviour only.

      **＋** `tasks` names by slug each Estimate the Case creates or replaces, and under a line whose item
      writes content that content stands as sub-points; no `contract` line and no "block N" line.

      **＋** A pair under `replace` or `reword` stands only when the Case says what the sentence around
      each match names; a Case that changes the behaviour of a page gives an `update` to each Estimate
      of that page whose Criterion speaks of the change.

      **＋** `ratification` holds only the preview of the ledger lines in an untagged fence; the agent''s
      own text stands after the Case, after one horizontal rule, and the reply ends with a plain question.

