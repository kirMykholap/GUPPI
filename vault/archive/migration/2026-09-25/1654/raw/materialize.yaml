      until the migration of Case 432 writes the new one. The unit 1228 is dated by the day of the run,
      so `archive` takes it only at a run on a later day. The open Insight `insight-retro-reading-taken-on-a-criterion-the-session-replaces`
      asks for the check that keeps such a reading from being written; Case 428.1 brings it in, not this
      Case.'
    problem: The entry of ledger line 40 of session 1228 never applies, and there is no mark that retires
      it by a decision. So the unit 1228 is not applied whole, its render lines are not ticked, and `archive`
      keeps it. It must be decided by which mark and by which writer to retire the entry.
    given: '`raw/2026-09-25/1228/materialize.yaml` — the yaml of session 1228; its entry of ledger line
