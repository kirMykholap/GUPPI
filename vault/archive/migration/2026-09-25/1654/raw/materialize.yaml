      from a `{supersedes:case N}`, and only on an entry with `case`. A reading entry has no field `case`.
      The mark cannot be derived automatically: by case 280 a reading that stands in the ledger after
      the decision line of its own Case counts as a reading of the new Criterion. Such a rule would also
      retire legitimate readings of Work Mode. The person chose a one-off migration signed by this Case.

      The value of the mark is `427`, not `419.2`. Case 419.2 replaced the Criterion and renamed the page,
      but it signed nothing about the reading entry. This Case signs the retirement of the entry. The
      code already accepts such an entry without a change. `generate` skips an entry with `superseded_by`
      without a line on stderr. It writes a decision page only for an entry with `case`, so nothing is
      written for this entry. `superseded_cases` reads only entries with `case`, so no section of the
      Spec is skipped. `materialize` does not touch the entry again: it appends only lines that are not
      in the yaml, and lifts again only an entry with `failed` and no `kind`. Only words change: the docstring
      of `guppi/materialize.py` lists the writer of each field of an entry and gets a second writer of
      `superseded_by`, and the Purpose of `rule-materialize` says the same.

