  tags: []
  case_text:
    given: '`rule-retro` — the rule of `/retro`; its Render says which readings Retro takes

      **＋** `.claude/skills/retro/SKILL.md` — the file its Render writes

      **＋** `estimate-retro-loads` — the promise of the readings at Retro

      **＋** `estimate-ledger-write-refuses-a-reading-of-a-change-of-the-session` — the refusal of Case
      428.1, which Retro follows'
    when: The person invokes `/retro`, and the agent takes the readings of the session's Estimates.
    then: 'A reading measures the Criterion the page carries at the moment of the reading — the one ratified
      last; its line is written only when the work that Criterion names is built — rendered, written,
      run.

      **＋** An Estimate that this session creates or updates — by a decision line of its slug, or by an
      `update` that renames a page to it — gets no reading in this session, built or not; the handoff
      names it as a reading of a later session.

      **＋** The `read` line of its old Criterion in an earlier Spec is not read; the reading of the new
      Criterion closes it in a later session, at the moment its `method` names.

      **－** A reading of an Estimate this session neither creates nor updates is taken as before, once
      its work is built.'
    context: 'Today the hook `guppi ledger` on `Stop` writes each `estimate[...]` line of a `LEDGER` block
      into the session''s ledger and checks nothing in it. Retro and the end of Work Mode take readings
      by lists: by a `read` line of an older Spec or by the Work list of the brief. The slug is not held
      against the decisions of the same session. So an Estimate whose Criterion a Case of this session
      replaced gets a reading on the old Criterion. That happened in session 1749 with `estimate-retro-loads`.
      The same happened in session 1228 with `estimate-frame-check-finds-a-contradiction`: a Case of the
      same session replaced its Criterion and renamed the page. There `generate` failed on the entry,
      and Case 427 retired it by a one-off migration. Case 283 forbids such a reading, but only in the
      words of the Render of `rule-retro`, and only while the new Criterion is not built. No code checks
      that rule.

      The person chose a simple rule: what a session changes, it does not measure. The hook does not write
      an `estimate[<slug>]` line when a decision line `create` or `update` of `<slug>` stands in this
      session. The decisions come from the session''s `ledger.md` and from the lines the hook writes on
      the same `Stop`. The hook reads each line by `parse_line` of `guppi/materialize.py`: that is the
      one parse of a ledger line. The import stands inside the function, because `guppi/materialize.py`
      imports `guppi/ledger.py`. The hook judges by the ledger alone: it needs no task ticks and no memory
      in the event log. The condition holds the whole session. So a refused line of the transcript is
      refused again at every `Stop`. The hook exits 2 with the reason only when the line stands in the
      reply just finished. It skips an older line without a word. A line of a text followed by a tool
      call is first judged at the next `Stop` and is also skipped without a word. Its absence shows in
      the Tail at Retro.

      The hook closes the case of 1228 without the Spec. The decision line `update` names the old slug
      of the renamed page, and the reading there was taken by the old slug. The hook does not catch a
      reading by the new slug of the same rename: no decision line names it. The person chose a judgment
      of the hook by the ledger alone. Retro is the agent''s judgment, and the agent may read the Spec.
      After Case 432 the `read` line of a renamed Estimate names the new slug. So at Retro the exception
      from debt and the refusal of a reading also cover the slug an `update` of this session renames a
      page to. Otherwise the renamed Estimate''s own `read` line would become debt at the Retro of the
      same session.

      The cost of the rule. A reading of a new Criterion waits for a later session, even a pytest reading
      in Work Mode. That may not be the next session: the reading of Case 430 waits for the first prompt
      past 400 000 tokens. Part of case 280 stops working for this session: a reading after the decision
      line of its own Case no longer ticks the `read` line of that Case in the same session. A reading
      of a later session ticks it. But it ticks it only while the unit lies in `raw/`. `tick_read` does
      not read the archive, and `kept_reason` does not look at open `read` lines. The person accepted
      this: the status `pending` of the Estimate and the lint finding `unread` carry the debt. This note
      goes to the handoff, not into the Case. The choice between "built" and "not built" goes away: the
      rule does not depend on whether the tasks are ticked.

      What the frame check showed. The sentence of `rule-ledger-write` that the hook is "interpreting
      nothing" becomes false, so the Case changes it by a `replace` pair. The Criterion of `estimate-ledger-write-lifts`
      promises that each line of a `LEDGER` block lands in the ledger. That becomes false, so sub-case
      428.2 replaces it whole. In the Render of `rule-case-protocol` the `estimate[...]` lines are written
      at the moment the measurement exists. For a measurement of what the session changed that becomes
      false, so the Render gets one pair. The paragraph of the Render of `rule-retro` on readings takes
      a reading when the build is finished and closes the line of the old Criterion "at the moment its
      `method` names". That moment can fall in this same session. So sub-case 428.3 replaces the paragraph
      whole, together with the Criterion of `estimate-retro-loads`. The opening list of Retro in the Render
      knows two kinds of an unticked line: waiting for the librarian, or debt. The Criterion of `estimate-retro-report-holds-each-fact-once`
      says the same. A third kind — a `read` line whose reading waits for a later session — makes both
      false. Sub-case 428.4 changes them.

      What is not touched. `rule-page-generation` and the Criterion of `estimate-generate-ticks-the-spec`
      describe what `generate` does with the `read` line of a Case ratified after the reading. They do
      not say that a reading in the same session occurs, and they stay true. In the Purpose of `rule-materialize`
      a reading folds into the unapplied `create` of its slug in the unit. The Criterion of `estimate-materialize-assembles`
      folds an `estimate` line into the `create` of the same unit. `estimate-materialize-refolds-a-reading-on-a-supersede`
      moves such a folded reading. For the unit of one session this path no longer occurs, because the
      hook refuses such a line. But these statements stay true of what `materialize` does with a ledger
      where such a line stands, so they are not touched. In `case-schema.md` the paragraph on tasks stays
      true: `generate` still ticks the `read` line, only by a reading of a later session. `rule-work-mode`
      holds only a Purpose, and it is not touched. In the Purpose of `rule-spec-box` the box writes readings
      into the ledger of its folder. That is a deferred placeholder, and it names the ledger hook inside
      a worktree as an open question. The Case does not touch it. The other hooks on `Stop` — `guppi ratified`,
      `guppi casecheck`, `guppi context` — do not judge ledger lines. The slug `estimate-ledger-write-refuses-a-reading-of-a-change-of-the-session`
      is free: no page has it in `wiki/` or in `archive/`. There are four sub-cases, because the Case
      touches four promises.'
    problem: 'No check holds an `estimate[...]` line against the decisions of its session. So a reading
      of an Estimate that this session created, replaced or renamed lands in the ledger on a Criterion
      nobody built. The person chose the rule: what a session changes, it does not measure. It must be
      decided how the hook checks it and which pages change with it.'
