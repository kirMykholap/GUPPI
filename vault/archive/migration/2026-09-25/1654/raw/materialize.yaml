      **＋** `rule-materialize` — the rule of `materialize`; its Purpose says who marks an entry `superseded_by`

      **＋** `guppi/materialize.py` — its docstring lists each field of an entry with its writer

      **＋** `guppi/generate.py` — `apply`, which skips an entry with `superseded_by`

      **＋** `guppi/render.py` — `applied_whole`, the test before the render lines of a Spec are ticked

      **＋** `guppi/archive.py` — `kept_reason`, the test before a unit moves to the archive

      **＋** `raw/2026-09-25/1228/spec.md` — the Spec of session 1228, which holds its render lines'
    when: 'The one-off migration of Case 427 sets `superseded_by: ''427''` on the entry of ledger line
      40 in `raw/2026-09-25/1228/materialize.yaml` and removes its `failed`, and then `uv run guppi generate`,
      `uv run guppi render` and `uv run guppi archive` run.

      **＋** Someone reads the docstring of `guppi/materialize.py` or the Purpose of `rule-materialize`
      to learn who writes `superseded_by`.'
    then: '`uv run guppi generate` skips the entry: it writes no page for the entry and prints no stderr
      line for it.

      **＋** `applied_whole` of `guppi/render.py` is true for `raw/2026-09-25/1228/materialize.yaml`, and
      `uv run guppi render` ticks the render lines of `raw/2026-09-25/1228/spec.md`.

      **＋** `kept_reason` of `guppi/archive.py` gives no reason for the unit 1228, and the first `uv run
      guppi archive` on a day after 2026-09-25 moves the unit to the archive.

      **＋** The docstring of `guppi/materialize.py` and the Purpose of `rule-materialize` name two writers
