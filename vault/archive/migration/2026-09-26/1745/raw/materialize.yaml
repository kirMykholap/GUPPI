  sections:
    Criterion: 'When:

      `Stop` fires after a reply of the main agent that shows a Case under `## Case N —` or `### Case
      N.M —` with at least one of its sections.


      Then:

      `uv run guppi casecheck` compares each such Case with the Case of the same id in `<plan>.checked.json`
      in its `given`, `when`, `then`, `tasks` and `ratification`, line by line once line ends and trailing
      spaces are the same.

      **＋** The name of its heading, its `context`, `problem` and `recommend` are not compared: a showing
      that differs from the answer only in them passes.

      **＋** A Case the store does not hold, a Case that differs in a compared section, or a Case stored
      with findings exits 2, the reason and the findings on stderr.

      **＋** A parent shown with its sub-cases is compared part by part, as the store holds each.

      **＋** The Spec hook `guppi/ratified.py` judges a showing by the same comparison, imported.

      **－** A heading with no section, as in the acknowledging reply, a fence tagged `DIFF`, and a deferred
      decision in the short form — `context`, `problem` and a fence tagged `then` with `defer` items,
      no `given` and no `when` — are not compared.

      **－** On the re-fire (`stop_hook_active`) it exits 0.'
