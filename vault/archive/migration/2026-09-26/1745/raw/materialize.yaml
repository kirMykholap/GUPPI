      itself, and the `context` of the Case gives the answer.

      **＋** It reads each page and file the `given` of the Case names, the Criterion of each Estimate
      such a page lists, and, for a Case that adds or changes a hook, the hooks on the same event in `.claude/settings.json`.

      **＋** Each contradiction it finds is fixed in the Case, or the `context` says why it stands.

      **＋** Its answer is the Case whole in English — the name, `context`, `problem` and `recommend` too
      — in the chat form of `vault/wiki/case-schema.md`, from the heading to the fence of `ratification`,
      and nothing else; asked again, it answers with the Case whole again, in English.

      **＋** An answer that needs a choice the person has not made is that question alone, with no Case
      heading.

