  sections:
    Criterion: 'When:

      `guppi prespec --check <plan>` runs at `/pre-spec` and reads the plan and its ratified copy `<plan>.ratified.md`.


      Then:

      A Case of the plan whose ids, `given`, `when`, `then`, `then` block or `tasks` differ from its section
      in the ratified copy: one finding naming the Case and the parts.

      **＋** A Case of the plan with no section in the copy, and a section of the copy with no Case in
      the plan: one finding each.

      **＋** A name, `context` or `problem` that holds a Cyrillic letter: one finding.

      **－** The section of a Case a `{supersedes:case N}` of the session''s window names is no finding:
      that Case left the plan (case 299.1).

      **－** The section of a parent with sub-cases in the copy, every one of them named by such a line,
      is no finding: the parent left the plan with them.

      **－** A Case under `## Deferred` is not compared.'
