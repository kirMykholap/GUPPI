decisions:
- case: '439'
  decision: decision-case-439
  origin: raw/2026-09-26/1745/ledger.md#case-439
  targets:
  - kind: update
    category: rules
    slug: rule-skill-hi
    ref: rule-skill-hi
  tags: []
  case_text:
    context: '`/hi` runs six `!` substitutions before the first turn of the agent, and their output is
      in the context with no read calls. Since client 2.1.282 in VS Code, the server-side classifier of
      auto mode checks each substitution. It gives no verdict for a substitution the person typed. The
      full reason was printed once, in session 1b191eaf: "the request that produced this action did not
      ask for one". So `/hi` failed at every run, and a fresh `/login` did not help. Commit 54509ed was
      made with the owner''s consent but with no Case. It added an `allowed-tools` line with the six commands
      to the frontmatter of the Render of `rule-skill-hi`, and one sentence on the cause to `## How it
      works`. `uv run guppi render` rewrote `.claude/skills/hi/SKILL.md`. `render --check` exited 0, pytest
      passed, the lint output did not change, and after that `/hi` in this session ran whole. The change
      has no History line and no Decision.

      An `update` that has only `change` applies: `ITEM_KEYS["update"]` of `guppi/materialize.py` holds
      `change`, and `guppi/generate.py`, which imports it, writes the History line `updated: <change>`
      with a link to `decision-case-439`. A `replace` pair would fail here, because its `old` is no longer
      on the page. `sections` would rewrite whole sections for one line.

      The other pages and why they stay as they are:

      - The Pattern of `insight-hi-skill-substitution-checked-by-a-model-call` names a lapsed login as
      the cause. Its Proposal says "not an allow entry for the command", and the new cause refutes both.
      But that Proposal was rejected by Case 246. An Insight changes only by an `update` that actions
      or rejects it, and this Case makes none, so it stays as it is. The new cause goes into a lesson
      line in the ratification, and the librarian of the next run links it to this Insight.

      - `rule-permissions` allows only the working files of the session in `.claude/settings.json`. The
      change does not touch its list. The `allowed-tools` of the skill holds only while `/hi` runs, and
      only the person opens `/hi` (`disable-model-invocation: true`). Two of the six commands write files
      — `git pull --ff-only` the working tree, `uv run guppi render --sync` the governed files — and the
      owner allowed them for `/hi`; the `SessionStart` hook runs the same `render --sync` with no permission
      check. The Criterion of `estimate-permissions` speaks only of the `allow` list in `settings.json`.

      - The Criterion of `estimate-hi-no-read-calls` promises the context after `/hi` with no read calls.
      The change brings this behaviour back but does not change the promise. The Criterion of `estimate-hi-writes-frontier`
      speaks of the Frontier. No Estimate is touched.

      - The Case has no `create`, so no vault query is needed.'
    problem: 'The change of `rule-skill-hi` and its Render already stand in the vault and in `.claude/skills/hi/SKILL.md`,
      but no Decision signed them. The question: ratify them after the fact as they stand, so that the
      History of the page gets a line with a link to the Decision.'
    given: '`rule-skill-hi` — the rule whose Render frontmatter and `## How it works` carry the change

      **＋** `.claude/skills/hi/SKILL.md` — the skill file rendered from `rule-skill-hi`

      **＋** `rule-permissions` — the rule of the allow list in `.claude/settings.json`'
    when: 'The person types `/hi` in Claude Code 2.1.282 or later.

      **＋** A reader opens `rule-skill-hi`.'
    then: 'The six `!` commands of `.claude/skills/hi/SKILL.md` — `git pull --ff-only`, `uv run guppi
      render --sync`, `git branch --show-current`, `git status --short`, `gh issue list`, `uv run guppi
      tail` — match the `allowed-tools` line of its frontmatter, run with no classifier verdict, and their
      output is in the context before the first turn.

      **＋** `## How it works` of `rule-skill-hi` says why: the server-side classifier gives no verdict
      for a `!` substitution the person types, and a matching rule needs no classifier.

      **－** The allow list of `.claude/settings.json`, rendered from `rule-permissions`, gets no entry
      for these commands.'
  spec: vault/raw/2026-09-26/1745/spec.md
  applied: '22:54:54'
- case: '440.1'
  decision: decision-case-440.1
  origin: raw/2026-09-26/1745/ledger.md#case-440.1
  targets:
  - kind: update
    category: estimates
    slug: estimate-materialize-lifts-a-create-by-the-schema
    ref: estimate-materialize-lifts-a-create-by-the-schema
  tags: []
  case_text:
    given: '`estimate-materialize-lifts-a-create-by-the-schema` — the promise on the lift of a `create`
      by the schema

      **＋** `guppi/materialize.py` — `IGNORED_KEYS`, `accepted_keys`, `item_keys`, `_lift_item` and the
      module docstring

      **＋** `guppi/prespec.py` — the docstrings of the module and of `check_form`

      **＋** `tests/test_materialize.py` — the tests of the lift by the schema and of `item_keys`

      **＋** `tests/test_prespec.py` — the test of the keys of the shape before case 189

      **＋** `tests/test_gate.py` — its plan fixture

      **＋** `vault/wiki/<category>/schema.yaml` — the fields of a category

      **＋** `rule-<category>-schema` — the rule of a category''s schema'
    when: '`uv run guppi materialize` lifts a `create` or `defer` item whose category has its `vault/wiki/<category>/schema.yaml`
      on disk, in a unit that neither creates nor updates `rule-<category>-schema`.'
    then: 'Only the keys the category''s `schema.yaml` names as fields reach `fields` of the entry; `ref`
      goes to the entry, `sections` to its own key.

      **＋** A key that is no field of the schema and none of the item''s own keys — `slug`, `ref`, `sections`,
      `file`, `estimate`, `parent_create`, `parent_tags` — is named under `unknown` on the entry, printed
      by `--show`, never written to the page, and the entry applies.

      **＋** The `type` and `purpose` of a `defer` are its own keys and reach `fields` whatever the category
      of its target; a `defer` without `purpose` is `incomplete: [purpose]`.'
    context: 'Case 72 brought in the key `contract: same|changed`. On the flag `changed`, the script `materialize`
      found the Estimate of the rule by itself. It appended a `### case N` block to its Criterion and
      set it `pending`. `estimate_slug` corrected the slug of the Estimate the script derived, when it
      matched a live page. `estimate_kind` gave the derived Estimate its `kind`. `method` on a `create`
      of a Leaf rule was the signal to derive an Estimate. Case 189 removed all derivation: an Estimate
      has its own line and its own item, and its Criterion is the `when` and `then` of the Case. Case
      194.1 left the old keys with no effect, so that old Specs lift with no `unknown`.


      Today nothing reads these keys. On a `create` of a rule or an entity, `materialize` drops them silently
      through `IGNORED_KEYS`, and `item_keys` lets them pass. On a `create` of an Estimate, `estimate_kind`
      and `estimate_slug` are removed. On an `update` they are not in the closed list `ITEM_KEYS`, and
      pre-spec gives a finding (case 436.2). They carry no function that does not exist elsewhere. A search
      of `vault/raw/` found no item line with these keys, and `materialize` reads only `raw/`. The pass
      of case 194.1 protects nothing any more.


      The Case takes all four keys. `method` goes only as a key of a rule or an entity: `case-schema.md`
      already says that a `create` of a rule or an entity carries none. On an Estimate, `method` is a
      field of the schema, and it stays. The keys `criterion` and `context` on a `create` of an Estimate
      and the nested `estimate` are not in the Case. They are other shapes (cases 193, 194.1), and a separate
      question. The line `contract: changed` in the unmigrated Criterion of `estimate-render-harness-reproduces`
      is the text of a past Case. It stays until that page is recut (case 202). The words "no `contract`
      line" in `estimate-case-protocol-case-form` speak of a `tasks` line, not of an item key, and they
      stay too.


      What changes after the removal. On a `create` of a rule or an entity these keys become `unknown`
      in `materialize`. The Spec hook refuses them. Pre-spec gives a finding. All three go by one `item_keys`.
      The Criteria of `estimate-prespec-checks-the-form-of-an-item` and `estimate-spec-write-copies-the-ratified-case`
      speak of this in general terms, and they stay. So `rule-prespec`, deferred by Case 438, is not touched.
      For a category whose schema the same session changes (case 308.2), such a key now reaches `fields`,
      like any foreign key. Today `IGNORED_KEYS` removes it there too. The Criterion of `estimate-materialize-lifts-unfiltered-on-a-schema-change`
      ("every key into `fields`") agrees with this and stays.


      Two Estimates of `rule-materialize` become false. `estimate-materialize-lifts-a-create-by-the-schema`
      lists these keys among the own keys of a `create`. The `－` line of `estimate-materialize-assembles`
      says they do not reach `unknown`. These are two promises, so two sub-cases. The Render of `rule-case-protocol`
      names the keys in two sentences, and that is the third sub-case. It changes no promise: the Estimates
      of `rule-case-protocol` speak of the loading of the file and of the form of a Case, not of item
      keys. No vault query is needed: the Case creates nothing.'
    problem: 'The keys `contract`, `estimate_slug`, `estimate_kind` and `method` on a rule or an entity
      are left from the shape before case 189. Today nothing reads them, but the code, the docstrings,
      the tests and the pages name them and let them pass silently. Decide how to remove them whole: from
      the judgment `item_keys`, from the lift of `materialize`, from the Estimates that promise their
      pass, and from the Render of `case-schema.md`.'
  spec: vault/raw/2026-09-26/1745/spec.md
  applied: '22:54:54'
