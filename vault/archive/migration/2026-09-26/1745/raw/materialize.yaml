  change: the Criterion replaced whole — the keys of the shape before case 189 are no own keys of a create
    (case 440.1)
  sections:
    Criterion: 'When:

      `uv run guppi materialize` lifts a `create` or `defer` item whose category has its `vault/wiki/<category>/schema.yaml`
      on disk, in a unit that neither creates nor updates `rule-<category>-schema`.


      Then:

      Only the keys the category''s `schema.yaml` names as fields reach `fields` of the entry; `ref` goes
      to the entry, `sections` to its own key.

      **＋** A key that is no field of the schema and none of the item''s own keys — `slug`, `ref`, `sections`,
      `file`, `estimate`, `parent_create`, `parent_tags` — is named under `unknown` on the entry, printed
      by `--show`, never written to the page, and the entry applies.

      **＋** The `type` and `purpose` of a `defer` are its own keys and reach `fields` whatever the category
      of its target; a `defer` without `purpose` is `incomplete: [purpose]`.'
  applied: '22:54:54'
- line: 4
  text: decision[case 440.2][update][estimate-materialize-assembles]{ref:estimate-materialize-assembles}
  case: '440.2'
  kind: update
  slug: estimate-materialize-assembles
  origin: raw/2026-09-26/1745/ledger.md#case-440.2
  decision: decision-case-440.2
  ref: estimate-materialize-assembles
  category: estimates
  set:
    status: pending
  change: the Criterion replaced whole — the line on the keys of the shape before case 189 gives way to
    the line that no Estimate is derived from a key (case 440.2)
  sections:
    Criterion: 'When:

      `uv run guppi materialize` lifts the record lines of a unit''s `ledger.md` against the `then` blocks
      of its `spec.md`.


      Then:

      `materialize.yaml` holds one entry per record line, in ledger order: `case`, `kind`, `category`
      from the slug prefix, `slug`, `ref`, `source`, `supersedes`, `tags`, `addresses`, `origin`, `line`,
      `text`, `decision`; from the `then` item found by its slug — `fields`, `sections`, `replace`, `reword`,
      `change`, `rename`, `impact`; what the block lacks is `incomplete`, never invented.

      **＋** `reword` is carried as a list of `{old, new}` pairs; a mapping or a scalar under it is `incomplete:
      [reword]`.

      **＋** An Estimate has its own line and its own entry, the `ref` of the line the Estimate itself;
      the entry of its `create` keeps `kind`, `purpose`, `method` and `tags` as fields.

      **＋** One decision record per Case: `decision`, `case_text`, `targets`; a sub-case reads a missing
      `context`, `problem`, `recommend` and `given` from its parent, never `when`.

      **＋** An `estimate` line whose slug has a `create` in the same unit is folded into it; one for a
      page of an earlier unit is an `estimate` entry of its own.

      **＋** The `new_tags` of any Case reach the yaml once each; an existing `materialize.yaml` is extended
      with the lines it does not hold, never rewritten.

      **＋** A line the grammar does not parse goes under `unparsed`, and the run goes on.

      **－** No entry of an Estimate is derived from a key of the item of a rule or an entity: an Estimate
      comes only from its own line.'
  applied: '22:54:54'
