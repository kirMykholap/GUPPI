  sections:
    Criterion: 'When:

      The `Stop` hook `uv run guppi ledger` finds a fresh `lesson[<slug>]` line in a `LEDGER` block of
      the session. `category_of` of `guppi/materialize.py` does not put its slug under the lessons folder:
      the slug does not start with the lesson prefix.


      Then:

      The line is not written.

      **＋** The other lines of the `Stop` are written as before.

      **＋** When the refused line stands in the reply just finished, the hook exits 2 with one stderr
      line per refused line: "ledger: lesson[<slug>] not written — a lesson slug starts with lesson-,
      then the area, then the cause: write the line again with the prefix."

      **＋** At every later `Stop`, a refused line from an earlier text of the transcript is skipped without
      a word.

      **－** A lesson line whose slug starts with the lesson prefix is written as before. A line already
      in the ledger of any session is not judged again.

      **－** `estimate[...]` and `decision[...]` lines are not judged by their prefix.

      **－** Without a `hi`, and with `stop_hook_active`, the hook acts as before and judges no line.'
