  sections:
    Criterion: 'When:

      `uv run guppi lint` reads the `method` of each live Estimate: the field, or `## Method` on a page
      of the old shape.


      Then:

      For an Estimate of a Leaf, a `tests/` file that exists, the word `pytest`, a `make <target>` of
      the `Makefile`, or `by hand` passes; else the finding "method: names no tests/ file, pytest or make
      target and is not a reading".

      **＋** A named `tests/` file that does not exist, or a `make <target>` the `Makefile` does not hold,
      is a finding.

      **＋** For an Estimate of a MOC, a `make <target>` of the `Makefile` passes whatever stands beside
      it; `by hand` without one passes when every counted Estimate of the children is a reading or a sibling
      Estimate names a `make <target>` of the `Makefile`; else a finding.

      **＋** On a MOC with `render_mode: full`, the Estimates of a child with `enforcement: render` are
      not counted.

      **＋** `estimate-claude-md-rendered` gets no `method` finding.

      **－** On a MOC with `render_mode: full`, the Estimates of a child without `enforcement: render`
      are counted.

      **－** On a MOC without `render_mode: full`, the Estimates of every child are counted, a child with
      `enforcement: render` included.'
