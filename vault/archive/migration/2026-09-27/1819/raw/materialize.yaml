  fields:
    type: estimate
    kind: QA
    purpose: make help, make style, make test and make lint run their recipes under a POSIX sh from PowerShell
      as from Git Bash, and stop with a message when no sh is found
    method: by hand, make help, make style, make test and make lint from PowerShell and from Git Bash
      on Windows, at the first session after the change
    tags:
    - harness
    - workflow
  sections:
    Criterion: 'When:

      On Windows, someone runs `make help`, `make style`, `make test` or `make lint` of the `Makefile`
      from PowerShell and from Git Bash. `C:/ProgramData/chocolatey/bin/make.exe` reads the `Makefile`.


      Then:

      Make runs each recipe under a POSIX `sh`, with stdin read from `/dev/null`. Each target gives the
      same exit code from PowerShell as from Git Bash.

      **＋** When make finds no POSIX `sh` on Windows, it stops before any recipe runs, with one message
      that names the missing shell and the places it searched.

      **－** Make never runs a recipe of the `Makefile` under `cmd.exe`.

      **－** No recipe of the `Makefile` reads the stdin of its caller, and no target writes to the working
      tree.

      **－** Outside Windows, the `SHELL` of the `Makefile` stays `/usr/bin/sh`.'
  applied: '20:41:21'
