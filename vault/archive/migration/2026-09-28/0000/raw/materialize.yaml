  text: decision[case 472.3][update][estimate-prespec-checks-the-form-of-an-item]{ref:estimate-prespec-checks-the-form-of-an-item}
  case: '472.3'
  kind: update
  slug: estimate-prespec-checks-the-form-of-an-item
  origin: raw/2026-09-28/0000/ledger.md#case-472.3
  decision: decision-case-472.3
  ref: estimate-prespec-checks-the-form-of-an-item
  category: estimates
  set:
    status: pending
  change: the Criterion replaced whole — every Estimate item that replaces a Criterion by names_a_part,
    written or lifted, counts as a promise (case 472.3)
  sections:
    Criterion: 'When:

      `uv run guppi prespec --check <plan>` reads the items of the plan''s `then` blocks.


      Then:

      A Case whose `then` block holds two or more Estimate items that set a new Criterion — a `create`,
      or an `update` that names no part of the page by `names_a_part` of `guppi/materialize.py` — is the
      finding `case N: two promises in one Case — split it`, whether each item writes its Criterion under
      `sections` or lifts it.

      **＋** An `update` of an Estimate whose page does not exist is the finding `case N: update <slug>:
      no such Estimate page`.

      **＋** A `create` of an Estimate whose `ref` names neither a live rule or entity nor a rule or entity
      a `create` item of the plan carries is the finding `case N: create <slug>: ref <ref> names no live
      page`.

      **＋** An `update` item carrying `file` is the finding `case N: file <path>; the file route is gone
      (case 320)`, naming the rule that governs the path when one does.

      **＋** A key of an item of any kind that `item_keys` of `guppi/materialize.py` does not give its
      kind and category — `slug` a key of every kind — is the finding `case N: <kind> <slug>: key <key>
      is not a key of this item`.

      **－** An `update` of an Estimate that names a part alone — `set` without `status`, a `replace` pair,
      a section other than `Criterion` — is not counted.

      **－** A `create` or a `defer` of a category with no schema file, or of one whose schema rule a decision
      line of the session creates or updates, is not judged by its keys (case 308.2).'
  applied: 04:00:14
