- case: '473.1'
  decision: decision-case-473.1
  origin: raw/2026-09-28/0000/ledger.md#case-473.1
  targets:
  - kind: update
    category: rules
    slug: rule-retro
    ref: rule-retro
  - kind: create
    category: estimates
    slug: estimate-retro-red-check-of-an-updated-page-is-a-handoff-note
    ref: rule-retro
  tags:
  - session
  - workflow
  - harness
  case_text:
    given: '`rule-retro` — its Render, the paragraph that keeps `make lint` out of Retro

      **＋** `.claude/skills/retro/SKILL.md` — the skill rendered from `rule-retro`

      **＋** `make lint` — the checks of the vault, which the librarian runs after the render

      **＋** `rule-handoff` — writes a note for the handoff as the end of its item, unchanged

      **＋** `estimate-retro-report-holds-each-fact-once` — the promise of the form of the report, unchanged

      **＋** `estimate-retro-red-check-of-an-updated-page-is-a-handoff-note` — the new promise'
    when: The person invokes `/retro` in a session whose Spec updates a page or a governed file, and in
      Work Mode `make lint`, one of its steps, or a hook of the working tree that reads that page or file
      went red or refused.
    then: 'The red or the refusal is an item of the frontier, and it ends as a note for the handoff that
      names the check and the page or file it waits for.

      **＋** The reading of the check that counts is the `make lint` of the librarian''s run, after the
      page is written and the file rendered.

      **－** The red is not debt: the agent does not fix it or revert it into a patch.

      **－** A red test is not such a check: it is fixed or reverted into a patch, and the handoff still
      needs green.'
    context: 'Some Cases change two things at once: a reader in code, and the page or governed file it
      reads. The reader runs from the working tree as soon as the code is written. The page lands only
      at the librarian''s run, and the governed file at the render in that run. Between those two moments
      the reader refuses or goes red, and this happens by construction. Two lessons record it. After case
      111.3, the Stop hook of session M refused 13 ledger lines: the reader required a stamped `hi`, and
