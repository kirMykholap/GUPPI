  text: decision[case 472.2][create][estimate-case-check-notes-a-then-line-shared-by-siblings]{ref:rule-case-check}{tags:hooks,harness,workflow}
  case: '472.2'
  kind: create
  slug: estimate-case-check-notes-a-then-line-shared-by-siblings
  origin: raw/2026-09-28/0000/ledger.md#case-472.2
  decision: decision-case-472.2
  ref: rule-case-check
  tags:
  - hooks
  - harness
  - workflow
  category: estimates
  fields:
    type: estimate
    kind: QA
    purpose: Two then lines of sibling sub-cases that share most of their words are a note of the answer
      of case-guppi and of pre-spec
    method: uv run pytest tests/test_casecheck.py tests/test_prespec.py -k sibling, then by hand the first
      sibling note the hook sends back to case-guppi
    tags:
    - hooks
    - harness
    - workflow
  sections:
    Criterion: 'When:

      `uv run guppi casecheck --subagent` checks an answer of `case-guppi` on `SubagentStop`, or `uv run
      guppi prespec --check <plan>` checks the plan, and the answer or the plan holds two or more sub-cases
      of one parent.


      Then:

      Two `then` lines of two sibling sub-cases (sub-cases of one parent, such as N.1 and N.2) are a note
      when the words that both lines hold make 60 percent or more of the words of the shorter line. A
      word is a run of letters and digits of four or more characters, and the case of letters is set aside.

      **＋** The note names both Cases and both lines, and it is a note in the sense of case 472.1: it
      goes where that Case sends a note. `case-guppi` signs the promise in one sub-case, or it keeps both
      lines and says why in `context`.

      **－** A line with no word of four or more characters is compared with no line.

      **－** A sub-case that the answer holds alone has no sibling in the answer and gets no note from
      `guppi casecheck`. `guppi prespec --check` compares it with its siblings in the plan.'
  applied: 04:00:14
