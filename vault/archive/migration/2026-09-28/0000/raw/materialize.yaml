- case: '472.1'
  decision: decision-case-472.1
  origin: raw/2026-09-28/0000/ledger.md#case-472.1
  targets:
  - kind: update
    category: rules
    slug: rule-case-check
    ref: rule-case-check
  - kind: update
    category: rules
    slug: rule-prespec
    ref: rule-prespec
  - kind: create
    category: estimates
    slug: estimate-case-check-notes-a-criterion-line-not-carried
    ref: rule-case-check
  tags:
  - hooks
  - harness
  - workflow
  case_text:
    given: '`rule-case-check` — its `How it works`, the `SubagentStop` check of the answer of `case-guppi`
      and its store

      **＋** `guppi/casecheck.py` — `subagent` and the store `<plan>.checked.json`, which send and hold
      the notes

      **＋** `guppi/prespec.py` — the functions that judge the notes, and `check`, which prints them

      **＋** `guppi/materialize.py` — `names_a_part`, the one judgment of an `update` that replaces a Criterion
      whole, unchanged

      **＋** `tests/test_casecheck.py` — the tests of the hook

      **＋** `tests/test_prespec.py` — the tests of `guppi prespec --check`

      **＋** `rule-prespec` — its Render, the sentence on `note:` lines

      **＋** `.claude/skills/pre-spec/SKILL.md` — the file rendered from `rule-prespec`

      **＋** `estimate-case-check-notes-a-criterion-line-not-carried` — the new promise'
    when: '`uv run guppi casecheck --subagent` checks an answer of `case-guppi` on `SubagentStop`, or
      `uv run guppi prespec --check <plan>` checks the plan, and a Case of it holds an `update` of an
      Estimate that names no part of the page by `names_a_part` of `guppi/materialize.py`, and so replaces
      its `## Criterion` whole.'
    then: 'The old Criterion is the `## Criterion` of the Estimate page as it stands. The new one is the
      Criterion the item writes under `sections`, or else the `when` and `then` of the Case that holds
      the item.

      **＋** Each line of the old Criterion that no line of the new one equals is a note that names the
      Case, the Estimate and the line. The operand at the head of a line, the labels `When:`, `Then:`
      and `Given:`, and whitespace are set aside.

      **＋** The notes of a Case are judged by functions of `guppi/prespec.py`, and `guppi/casecheck.py`
      imports them, not copies.

      **＋** `uv run guppi prespec --check <plan>` prints each note as a line opening with `note:`, which
      sets no exit code.

      **＋** `uv run guppi casecheck --subagent` exits 2 with the notes on stderr, beside any findings,
      and `case-guppi` answers again: it restores the line, or it keeps the change and says why in `context`.

      **＋** It stores the notes it sent for each Case id in `<plan>.checked.json`, apart from the findings,
      and a later answer for the same id keeps them.

      **－** A note that the store already holds for the same Case id is not sent again, and an answer
      whose only notes are held exits 0.

      **－** A note is not a finding. The file of the Case is written as for an answer with no finding,
      and the `Stop` check of `guppi casecheck` does not refuse a showing for a note.

      **－** An Estimate that a Case creates has no old Criterion and gets no note.'
    context: '`case-guppi` writes the promise lines of a Case next to the lines around them. When it replaces
      the Criterion of an Estimate whole, it writes the new lines from the old ones and the change. When
      it splits a Case, it writes each sub-case''s `then` next to its siblings''. The `SubagentStop` check
      of `rule-case-check` runs `judge` of `guppi/prespec.py`, and no judgment in it compares those lines.
      So a dropped or doubled promise reaches the person and is found only by ask-guppi at pre-spec, after
      ratification. The Insight `insight-case-build-promise-lines-compared-by-no-check` holds four child
      lessons of this kind: a Criterion line dropped (441.2), finding texts lost (459, 460.3), one promise
      signed in two wordings (445.5 and 445.6), and two promises in one sub-case where one Criterion was
      written under `sections` (460.2). The last one passes `check_form`, because it counts an Estimate
      `update` only with `set: {status: pending}` and not when it writes its Criterion.

      In the rounds the person chose these answers. A script cannot tell a reworded line from a dropped
      one, so a difference is a note, not a finding. The note goes back to `case-guppi` once by exit 2,
      and it never keeps the Case from being shown. The output of an exit-0 `SubagentStop` hook reaches
      neither the subagent nor the main agent, so exit 2 is the only way back. The comparisons live in
      `guppi/prespec.py`. `guppi/casecheck.py` imports them (`rule-one-judgment-one-implementation`),
      and `guppi prespec --check` prints them as `note:` lines. The count of `check_form` is fixed in
      the same Case. There are three sub-cases, one per promise.

      After the first build, pre-spec found four faults, and the person agreed to the fixes. First, "a
      Criterion replaced whole" is now judged by `names_a_part` of `guppi/materialize.py`, the predicate
      `materialize` lifts by (case 296). An Estimate `update` that names no part replaces the Criterion
      whole: `change` alone, any `set.status`, or a written `sections: Criterion`. So `check_form` now
      also counts an `update` with `set: {status: passed}`, which the old test called a reading. Second,
      the store replaces the entry of a Case at each answer, so 472.1 keeps the sent notes across a later
      answer. Third, the note mechanism is signed in 472.1 alone, and 472.2 signs only its comparison.
      Fourth, the Purpose of `rule-atomicity` names the narrower refusal, so 472.3 rewords it.

      What the frame shows: `.claude/settings.json` has one hook on `SubagentStop`, `guppi casecheck --subagent`,
      and the file does not change. The sentence of `rule-materialize` "it is how one Case touches two
      promises (case 204)" would become false under 472.3, so 472.3 replaces it. The `Given` line of `estimate-atomicity-rendered`
      says pre-spec refuses a Case with two Estimate items and no written Criterion. That stays true,
      since such a Case is still refused, so the Estimate is not touched. A change to the Purpose of `rule-atomicity`
      touches no Estimate. `estimate-prespec-notes-a-long-chain` speaks only of the long chain and stands.
      `estimate-case-check-sends-back-a-faulty-case` and `estimate-case-check-shows-only-the-checked-case`
      stand: a note is not a finding, the file of the Case is still written when an answer has no finding,
      and the `Stop` check does not refuse a showing for a note. A test of case 327 in `tests/test_prespec.py`
      holds two written Criteria in one Case, so it changes. The `given` of 472.1 and of 472.3 holds eight
      `＋` lines. They are the files each sub-case touches, not a second promise. No `create` here is without
      a `ref`, so no vault query ran. A Glob found both new slugs free, and no page holds such a comparison.
      The Insight has no `deferred_by`, so no `{supersedes}` is needed.'
    problem: A Criterion replaced whole can lose a line. One promise can be signed in two sibling sub-cases
      in two wordings. A sub-case can carry two promises when one Criterion is written under `sections`.
      No check sees any of these before the person ratifies, so the Case is built again after pre-spec.
  spec: vault/raw/2026-09-28/0000/spec.md
  applied: 04:00:14
