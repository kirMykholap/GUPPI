      copy in the code: a file added to those lines is in the list without a change to the hook.

      **＋** The texts of the files, the Frontier apart, are not printed, only the paths; the output stays
      under 10,000 characters.

      **－** Without a `hi` in the window, nothing is printed on stdout, and the exit is 0.

      **－** Another `source` gives nothing: the matcher keeps the hook from firing, and the code checks
      `source` itself.

