      Then:

      A `/handoff` on a dirty tree, where `git status --porcelain` is not empty, exits 2 with the reason
      "commit first" on stderr, and the client blocks the call; on a clean tree it exits 0.

      **＋** A `/retro` in a session with a `hi` but no `spec.md` in its folder, no plan file named by
      the event log and no `- decision[`, `- estimate[` or `- lesson[` line in its window exits 2 with
      "gate: /retro refused — nothing to review: no Spec and no ledger line in raw/<date>/<HHMM>/. Ratify
      a Case or write a reading or a lesson first, then type /retro again."; on the `Skill` path the end
      reads "…then call /retro in the next reply."

      **＋** Otherwise a `/retro` whose Spec holds an item with no decision line of its Case exits 2 with
      "gate: /retro refused — N item(s) of the Spec have no ledger line (case A). Ask the agent to end
      its reply with the LEDGER block, then type /retro again".

      **＋** A call it lets through, on either path, writes the same mark `prespec`, `retro` or `handoff`
      into the day''s event log; a refusal writes no mark.

