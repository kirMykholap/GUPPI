- case: '488.1'
  decision: decision-case-488.1
  origin: raw/2026-09-28/2229/ledger.md#case-488.1
  targets:
  - kind: update
    category: estimates
    slug: estimate-glossary-renders-the-terms
    ref: estimate-glossary-renders-the-terms
  tags: []
  case_text:
    given: '`estimate-glossary-renders-the-terms` — the promise, its Criterion replaced whole

      **＋** `rule-glossary` — the rule it promises for

      **＋** `entity-glossary` — the page whose `## Terms` table is the source

      **＋** `guppi/glossary.py` — `render`, `rows` and `group_of`, which write the file or refuse

      **＋** `vault/wiki/glossary.md` — the file written

      **＋** `.claude/agents/librarian-guppi.md` — step 6 of the librarian''s frame, which runs the script

      **＋** `tests/test_glossary.py` — the tests the reading runs'
    when: '`uv run guppi glossary` runs without a flag, from step 6 of the librarian''s frame in `.claude/agents/librarian-guppi.md`
      or by hand, and reads the `## Terms` table of `entity-glossary`.'
    then: '`vault/wiki/glossary.md` is written and the run exits 0. The file holds `# Glossary`, then
      the line "Written by `guppi glossary` from the `## Terms` of `entity-glossary`; a term changes by
      an `update` of that page", then one group `## [[<moc>]]` for each parent MOC of the pages in `where`,
      in the order of first appearance in the table. Each group holds the table `| term | meaning | where
      |` with its rows in the order of the table.

      **＋** A page in `where` that has no `parent`, such as a root MOC or a placeholder not yet placed,
      is its own group.

      **＋** A `where` with no live page, a `where` that is no `[[slug]]`, a row that is not three cells,
      a term twice, no `## Terms` section, or no single live `entity-glossary` gives one line on stderr
      and exit 1, and the file is not written.

      **＋** The librarian''s frame takes each line on stderr of the run as a flag.

      **－** The file holds no line that the table does not give, apart from the heading and the source
      line.'
    context: 'Each Estimate page holds one promise, its Criterion. A Criterion should hold only `When:`,
      which is the trigger and the input it acts on, and `Then:`, which is what must hold after. The older
      Estimates also open with `Given:`, a set of lines that describe the code, the tests or the history
      as they stood on the day the promise was written. The five Estimates of this group were all written
      by one parent Case (306), and four of them carry the same `Given:` text, copied from that parent.
      It speaks of `rule-sprint`, of MOCs and Leaves, and of superseded Cases, and none of it bears on
      the promise. Two of the five also promise the wrong thing. `estimate-guppi-tests-green` has the
      `purpose` "make test is green on the branch", but its `Then:` describes the one-time build of `entity-guppi`.
      `estimate-glossary-terms-defined` describes the one-time build of the glossary table, "a table of
      49 rows", and the row splits of that day.

      The person decided in one round. Slice 3g''s item on the `Given:` pages goes in seven Cases by area,
      one group per Case, and this session takes one group now. This Case takes the first group, the glossary
      and `entity-guppi`, with one sub-case per Estimate. A Criterion that records a one-time act gets
      a new Criterion that states the repeating behaviour its name, its `purpose` and the code give today
      (case 485). The done-conditions of the sprint are recut like the rest in their own group. `estimate-end-of-work-order`
      goes to the old-layout item. A page with no `purpose` gets one in the same change. All five pages
      of this group already have `purpose` and `method`, so no field is set but `status`. Each Criterion
      is replaced whole and goes back to `pending`. Its reading waits for a later session (case 428.1).
      The note of Slice 3g stays as it is until the last group (cases 484.7, 485.6).

      What each new Criterion keeps and drops. The check of the answer notes every old line as not carried,
      because each new line is a whole statement and not the old wording. The content of the old lines
      is carried, except for the lines named here. Each `Given:` goes out whole. The input moves into
      `When:`. In 488.1 that is the `## Terms` table and step 6 of the librarian''s frame. In 488.3 it
      is the units under `vault/raw/` with a `materialize.yaml`. 488.1 drops "`index.md` is not read",
      because the file no longer exists. It keeps the refusals of the old text and adds three that `guppi/glossary.py`
