      and "Read before the next reply:". Then comes one path per line: the `@` files of `.claude/skills/hi/SKILL.md`
      in their order, the session''s `frontier.md` when it exists, and the Spec when one exists. Last
      come the line `Frontier:` and the text of `frontier.md` as it stands.

