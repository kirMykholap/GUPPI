- case: '487.4'
  decision: decision-case-487.4
  origin: raw/2026-09-28/2229/ledger.md#case-487.4
  targets:
  - kind: update
    category: estimates
    slug: estimate-materialize-judges-a-fence
    ref: estimate-materialize-judges-a-fence
  tags: []
  case_text:
    given: '`estimate-materialize-judges-a-fence` — the promise of the one fence judgment; its Criterion
      replaced whole

      **＋** `guppi/materialize.py` — the functions of the judgment, `fence_breaks` among them

      **＋** `guppi/ratified.py` — `fenced_value`, a reader

      **＋** `guppi/prespec.py` — `plan_prose` and `check_pairs`, readers

      **＋** `guppi/casecheck.py` — the check of `ratification`, a reader

      **＋** `guppi/ledger.py` — `ledger_lines`, a reader

      **＋** `guppi/lint.py` — the class `fence`, a reader'
    when: 'A hook or a script reads a text that holds a fence: `then_blocks`, `tagged_blocks`, `quoted_sections`
      and `criterion_text` of `guppi/materialize.py`, `fenced_value` of `guppi/ratified.py`, `plan_prose`
      and `check_pairs` of `guppi/prespec.py`, the check of `ratification` in `guppi/casecheck.py`, `ledger_lines`
      of `guppi/ledger.py`, or the class `fence` of `guppi/lint.py`.'
    then: 'A line opens a fence when, after at most three spaces of indent inside the block it stands
      in (a quote, a sub-point of `tasks`), it starts with a run of three or more backticks or three or
      more tildes.

      **＋** The fence closes only on a line of the same character whose run is at least as long as the
      opening run, with nothing after the run but spaces.

      **＋** A line with a shorter run, a run of the other character, or a word after its run stays inside
      the fence as content.

      **＋** `fence_breaks` is built on `fence_opening` and `closes_fence`, so each break it reports is
      a line these readers keep as content, or an end of section they reach inside a fence.

      **＋** A fenced value under a sub-point of `tasks` that holds a shorter fence of the same character
      is read whole, together with the inner fence.

      **＋** Every one of these readers takes the judgment from the functions of `guppi/materialize.py`,
      and they all give the same answer for the same text.

      **－** No reader keeps a fence pattern of its own: the `FENCE` of `guppi/ledger.py`, the `OPEN_FENCE`
      of `guppi/ratified.py`, and the tests on three backticks in `guppi/ratified.py` and `guppi/casecheck.py`
      are removed.'
    context: 'A code block in a page opens on a line of three or more backticks and closes on a line of
      the same backticks with nothing after them. If text follows the backticks on that line, Markdown
      does not read it as a close. The block stays open and swallows the text after it. Today nothing
      checks this. `/pre-spec` applies each `replace` and `reword` pair of the plan to copies of the pages
      in memory, but it only counts how often each anchor is found. It never looks at what the pair leaves
      behind. `guppi lint` has no check of code blocks. `make style` runs ruff on Python only. So a pair
      whose `new` ends on a closing fence, anchored in the middle of a line, joins the rest of that line
      to the fence. Case 483 did this to `rule-retro`, and only the librarian found it, by eye. Case 486
      of this session fixes that page.

      The person agreed on one judgment in one module, called from both sides. `fence_breaks` in `guppi/materialize.py`
