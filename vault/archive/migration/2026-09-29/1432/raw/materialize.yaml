      is the fault recorded in `lesson-case-build-signs-one-criterion-twice-in-a-session`. So this Case
      carries both changes of 511.2. The list lines of the Criterion are carried word for word. The list
      sentence of `rule-case-build` now only points to the grill-me template and says no list shape of
      its own. Pre-spec found that the wording of 511.2 said the shape again, which the `then` line "word
      no shape of their own" forbids, and the person accepted the fix. Case 511.1 stands, and the Frontier
      line that Case 511 closed stays closed by it. The parent text of Case 511 still says the Case splits
      into two sub-cases. That is now true only of its record, and the person sees it when 511 is shown
      again, if ever.


