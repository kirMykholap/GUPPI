      that are not carried word for word. Each is dropped on purpose:

      - "The instructions of `case-guppi` point each question to the question shape…" is carried in the
      wording of Case 511.2, which adds the lists of the Context.

      - "The shape of a question is read by `estimate-skill-grill-me-asks-in-rounds`, not here" is carried
      in the wording of Case 511.2, which adds what counts as a list.

      - "Case numbers, the history of a slug and facts of the frame stand in the round only in the `➡️`
      line…" is replaced by the plain-words line and the quotation line. "Facts of the frame" is dropped
      because the person named numbers and history. A frame fact said in plain words does the harm the
      person described no more than any other sentence.

      - "The `context` of a Case keeps its case numbers and frame facts…" is widened to the `context`,
