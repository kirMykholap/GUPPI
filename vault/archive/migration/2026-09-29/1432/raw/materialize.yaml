      - The rule is for rounds only. The `context` of a Case is read mainly by the agent and becomes history
      on the Decision page, so it keeps its numbers and details. `problem` and `recommend` work well as
      they are, so the rule on the story of a Case (`rule-case-protocol`) does not change.

      - A round says things in plain words and uses no number where plain words are enough. A case or
      decision number, a session id, a ledger line number, a commit hash or a date in the history of a
      page stands in a round only beside a short quotation of the words it points to, as the source of
      that quotation. This holds in any line, the `➡️` line included.

      - A page name in a code span is not such a reference. It stays where the question is about that
      page.

