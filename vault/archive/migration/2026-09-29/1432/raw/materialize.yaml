      created, tags`; optional `create, update, delete, defer, source, supersedes, superseded_by`; values
      `status: current | superseded | archived`; the sections `## Problem` and `## History` required,
      `## Context`, `## Given`, `## When`, `## Criterion`, `## Deferred`, `## Note` optional.

      **＋** A Decision page with these fields, values and sections has no `schema` finding; one lacking
      a required field, with a value outside the list or lacking a required section has one finding per
      defect.

      **＋** A Decision page without `## Context` has no `schema` finding.

