      all eight sections. `spec.md` holds no `recommend`. The archive holds Case files from `2026-09-27/1819`
      on, and the older sessions hold only `spec.md`. `rule-decisions-schema` says that `recommend` is
      "recoverable from the archived ledger", which is false today. 513.1 changes that sentence, the required
      sections, the `## Context` and `## Given` descriptions, the `origin` field and the example page.
      It also replaces the Criterion and the `method` of `estimate-decisions-schema-checked`. `estimate-generate-writes-the-decision-page`
      names the body `## Context` and `## Problem`, so 513.2 replaces its Criterion whole. `estimate-generate-writes-the-given`
      promises a `## Given` that is no longer written, so 513.2 deletes it and carries its `－` line on
      the old pages into the other Criterion. The cascade takes it out of the `estimates` of `rule-page-generation`,
      as in case 506.2. That rule''s Purpose names no body section, so the rule stands. Two sentences
      of `rule-case-protocol` say that `given` "stays in the Case and on the Decision page", so 513.3
      changes them. That rule''s Estimates speak of the form of a Case, not of a Decision page, and an
      `update` of its Render touches no Estimate of the live reading (case 378.5).

      The person accepted four fixes from pre-spec. First, a Case superseded in its own session keeps
      its two-line body, `## Context` included (case 299.4), and `decision-case-511.2` of this session
      gets that body. So the schema text of 513.1 and its `then` name that body next to the short form.
      Second, the `method` of the Estimate said the pages of Cases 1–28 lack "Context and Problem". With
      Context optional, only Problem is a finding on them, so 513.1 sets the `method` anew. Third, I checked
      `## Given` on the live Decision pages. The pages of Cases before 201 carry it, from the model of
      case 52.1. The pages of Cases 201 to 375 carry none. The pages from 376 on carry it again. The new
      description says exactly this and no longer says "before case 378.3". Fourth, the sentence on this
      session''s pages below is corrected.

      What the check of the answer notes, and why each note stands. Three Criterion lines are not carried
      word for word, on purpose. In 513.1 the line on the sections moves `## Context` from the required
      list to the optional one. In 513.2 the body line names `## Problem` alone. The old `－` line on no
      `## When` and no `## Criterion` becomes one `－` line that also says no `## Given`, and no `## Context`
      for a Case with `given`. Every other line is kept word for word. Three `then` lines of 513.2 share
      words with 513.1: the `## Context` of a Case without `given`, the sections the page does not hold,
      and the old pages that are not rewritten. This is expected. 513.1 promises what the schema file
      says and what lint accepts, while 513.2 promises what `generate` writes and leaves alone. They are
      separate promises with separate tests.

      Several sentences stay true and stand. `ask-guppi.md` reads the `## Problem` of a deferred decision,
      and that section stays. The case schema says that a deferred decision is taken up "from its page
      — `context` and `problem` as they stand". That page keeps its Context. `estimate-lint-catches`,
      `estimate-generate-renames` and `estimate-generate-cascades` speak of Decision pages but not of
      their body sections.

      Code and timing. `guppi/materialize.py` still lifts `context` and `given` into `case_text`, and
      `generate` uses `given` to tell the short form apart. The code changes in Work Mode, and the yaml
      is rendered in the librarian''s run. So the pages of 510, 511.1 and 512 to 516 are written without
      Context. 511.2, superseded in its session, gets the two-line body, and 517 and 518, in the short
      form, keep Context. A `make lint` run before the render reports `missing section ## Context` on
      the pages written without it. `lint` only goes red, so no old form is kept, and that red is a note
      for the handoff by `rule-retro`. The Case creates no page, so no vault query was run.

      Not done: the old pages are not rewritten; `materialize`, `ask-guppi` and the archive are unchanged;
