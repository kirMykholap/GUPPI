      the Slug, the fields deliberately absent and the body paragraph; `examples` holds the example page.

      **＋** The file says that the History of a Decision takes `created`, `superseded by` and one `updated:`
      line of a Case that signs its text after the fact.

      **＋** The file says that the Case file, `cases/case-<N>.md` in the folder of `origin` with N the
      id of the top-level Case, holds the whole Case, `recommend` included, and moves into the archive
      with its session.

      **＋** The file says that a new page carries `## Context` only for a Case without `given`, the short
      form of a deferred decision, and in the two-line body of a Case superseded in its own session; that
      it never carries `## Given`; and that the pages written before keep the sections they carry.

      **－** The example page holds no `## Context` and no `## Given`.'
    context: 'When a Case is ratified, the librarian''s `guppi generate` writes a Decision page into `vault/wiki/decisions/`.
      Today the page copies three sections of the Case: `## Context`, `## Problem` and `## Given`. It
      adds the lists of the pages the Case created, updated, deleted or deferred, `## Deferred` for a
      Case that put something off, and `## History`. Since session 2026-09-27/1819 (case 457), the `SubagentStop`
      hook of `rule-case-check` also writes every Case that `case-guppi` builds to `raw/<date>/<HHMM>/cases/case-<N>.md`,
      with all eight sections. The session folder then moves whole into `vault/archive/<sprint>/<date>/<HHMM>/raw/`.
      So the same text is stored three times: in the Case file, in `spec.md` (which holds no `recommend`)
      and on the Decision page. The Context is the longest of these copies and is written for the agent.
      For example, the page of case 506.2 repeats a context of several hundred words that its Case file
      already holds.

      In one round the person accepted every recommendation. A new Decision page keeps only `## Problem`,
      the lists, `## Deferred` and `## History`. The schema''s text says where the Case file lies, and
      no new field is added. The page of a short-form deferred decision keeps `## Context`, because the
      main agent writes that form and it gets no Case file. The pages already written are not rewritten,
      so `## Context` becomes optional in the schema.

