decisions:
- case: '520'
  decision: decision-case-520
  origin: raw/2026-09-29/1753/ledger.md#case-520
  targets:
  - kind: update
    category: entities
    slug: entity-glossary
    ref: entity-glossary
  tags: []
  case_text:
    context: 'The glossary is the `## Terms` table of `entity-glossary`. Each row holds a term, a one-line
      meaning and a `where` link to the live page that defines the term. `guppi glossary` renders the
      table into `vault/wiki/glossary.md`, grouped by the parent MOC of each `where` page, and `/hi` loads
      it. `estimate-glossary-terms-defined` promises that each `where` page defines its row. The reading
      at this `/hi` failed on five rows after the librarian''s run d8c1f17, which applied case 515.

      - Vault links to `rule-page-schemas`, which never says what the vault is. Its meaning also reads
      as "one page per category".

      - Hook links to `rule-hook-registry`, but its meaning describes the ledger writer: it reads the
      transcript, keeps its window across midnight, and can block. Only `rule-ledger-write` says that.

      - `deferred_by` and `origin` link to `rule-page-generation`, whose body names neither field.

      - Entity / Rule (status) links to the same page, which lists neither `archived` nor "built once
      every Estimate passes".


      The `origin` meaning also says "created or deleted" and that lint greps the field. No page body
      says either.


      The person agreed with every recommendation of the round. Each changed row links to a page that
      states it. A clause that no such page states is cut, and it still stands on its own page, such as
      midnight on `rule-ledger-write`. The rows the reading accepted only loosely stay as they are: `CLAUDE.md`,
      `case-schema.md`, Types and Decision.


      Two passes of pre-spec changed the new meanings. The person agreed to cut the `deferred_by` meaning
      to what its page says.

      - Hook names `rule-hook-registry` in place of "this page", which in the glossary would read as `entity-glossary`.
      As that page says, a hook can also stand in an agent''s own frontmatter, as part of that agent''s
      Render.

      - `deferred_by` first kept "On an Entity, Rule or Insight", which `rule-rules-schema` does not state.
      Then it said "On a Rule", which was too narrow: `rule-entities-schema` and `rule-insights-schema`
      define the same field, and a live Insight carries it. The meaning now has no qualifier and opens
      with the Decision pages whose `defer` targets the page. That is true for all three types and is
      what `rule-rules-schema` states.

      - `origin` follows `rule-decisions-schema`: its case numbers, the Case file only for a Case built
      by `case-guppi` from session 2026-09-27/1819 on, and the pointer that is not rewritten. It opens
      "On a page a Case created". That is my choice over naming the Decision page alone: the Entity, Rule
      and Estimate schemas give the same form for a page a Case created. A Lesson points at its ledger
      line, and an Insight points at no ledger line. Neither is a page a Case created, so the meaning
      does not claim them.


      The Case creates no page, so no vault query was needed. The frame reads as follows. `rule-glossary`
      stops the write on a `where` that names no live page, so every new link must name a live page, and
      each one does. The Purpose of `entity-glossary` lets a term enter, change or leave by an `update`
      of the page with `replace` pairs, and the split of the status row does exactly that. The Criterion
      of `estimate-glossary-terms-defined` stands whole, because the promise does not change, only the
      rows. So its status is not set to `pending` here, and its reading waits for the librarian''s run
      that renders the table. The Estimates of `rule-glossary` speak of the render, the check and the
      ticks, not of these rows, and are not touched.'
