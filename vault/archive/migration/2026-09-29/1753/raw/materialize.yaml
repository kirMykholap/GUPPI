    - ledger
  sections:
    Criterion: 'When:

      `uv run guppi materialize` lifts the entries of a Case N from its fences tagged `then` in `raw/<date>/<HHMM>/spec.md`.


      Then:

      A fence of Case N that holds a YAML comment — a `#` at the start of a line or after a space or a
      tab, outside a quoted value and outside a `|` or `>` block — gives each decision entry of Case N
      `incomplete: [comment]`, and the run does not fail.

      **＋** The entry keeps the values that YAML read, and nothing is invented for the text after the
      `#`.

      **＋** The comment is found by the same function of `guppi/materialize.py` that the `Stop` hook of
      `rule-spec-write` imports, so both give the same answer for the same fence.

      **－** A `#` inside a quoted value or inside a `|` or `>` block is text and gives no mark.

      **－** `generate` still applies an entry so marked, since a page is always created, even incomplete.'
