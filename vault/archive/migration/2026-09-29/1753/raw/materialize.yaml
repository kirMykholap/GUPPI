    ref: rule-spec-write
  - kind: update
    category: estimates
    slug: estimate-spec-write-writes-a-defer
    ref: estimate-spec-write-writes-a-defer
  tags: []
  case_text:
    given: '`rule-spec-write` — the rule of the `Stop` hook that writes a deferred Case into the Spec

      **＋** `guppi/ratified.py` — `deferred_section`, which reads the fence tagged `then` of a short Case

      **＋** `guppi/materialize.py` — holds the one function that finds a comment in a fence tagged `then`,
      and `item_keys`

      **＋** `raw/<date>/<hi HHMM>/spec.md` — the Spec of the session, where a defer at Retro is written

      **＋** `tests/test_ratified.py` — the tests of a defer

      **＋** `estimate-spec-write-writes-a-defer` — the promise; its Criterion is replaced whole'
    when: 'The `Stop` hook `uv run guppi ratified` runs after a reply whose `LEDGER` block holds lines
      of a Case N that are all `defer` — beside the lines of other Cases or alone — and the same reply
      shows `## Case N —` in the short form: `context`, `problem` and a fence tagged `then` with its `defer`
      items.'
    then: 'The hook writes that Case under `## Deferred` of the plan file while Plan Mode lasts, and of
      `raw/<date>/<hi HHMM>/spec.md` once that file stands, at Retro: the heading, `context`, `problem`
      and the `then` block as the reply shows them.

      **＋** The section of Case N is replaced when it stands there, appended at the end of `## Deferred`
      otherwise; the heading `## Deferred` is added when the file has none.

      **＋** A reply with no showing of Case N, or a `then` block without a `defer` item carrying `slug`,
      `type` and `purpose` for each `defer` line of the reply: exit 2 with the reason on stderr; on the
      re-fire (`stop_hook_active`) exit 0.

      **＋** A key of a `defer` item that `item_keys` of `guppi/materialize.py` does not give a `defer`
      of its category: exit 2 with `` `<key>`: not a key of defer <slug> `` on stderr, and nothing of
      the Case is written.

      **＋** A `then` block that holds a YAML comment — a `#` at the start of a line or after a space or
      a tab, outside a quoted value and outside a `|` or `>` block — as the function of `guppi/materialize.py`
      judges it: exit 2 with the line of the comment and the advice to quote the value on stderr, and
      nothing of the Case is written.

      **－** A `#` inside a quoted value or inside a `|` or `>` block is text, not a comment, and is no
      refusal.

      **－** A `defer` of a category with no schema file, or of one whose schema rule a decision line of
      the session or of the reply creates or updates, is not judged by its keys (case 308.2).

      **－** The ratified copy `<plan>.ratified.md` gets no defer, and the check after the write does not
      run on it.'
    context: 'When the person puts a decision off, the main agent writes a short-form Case itself. The
      Case holds a fence tagged `then` in plain YAML with `slug`, `type` and `purpose`. The `Stop` hook
      of `rule-spec-write` (`guppi/ratified.py`) parses the fence. It checks that each `defer` line has
      an item with these three keys and no foreign key, then copies the fence into the Spec as the reply
      shows it. Later `materialize` parses the fence again, and `generate` writes `purpose` under `##
      Deferred` of the Decision page. In YAML a `#` after a space or a tab starts a comment, so a value
      without quotes ends before it. At the Retro of session 1432 the short Case 519 held `purpose: Correct
      the description of ## Criterion in the Render of rule-estimates-schema, …`, and YAML kept only "Correct
      the description of". That text stands in `materialize.yaml` L36 of 1432, under `## Deferred` on
      `decision-case-519`, and in the backlog through the `deferred_by` of `rule-estimates-schema`. No
      check saw it. A full Case built by `case-guppi` does not have this problem. Its values are code
      spans, and the hook writes their YAML itself with `yaml.dump` of `guppi/ratified.py`, which quotes
      a value that needs it. A search of every `spec.md` under `vault/raw/` for an unquoted value that
      holds ` #` found the line of case 519 and no other.

      In one round the person accepted every recommendation. The hook and `materialize` both catch a comment,
      by one function in `guppi/materialize.py`. Any comment in the fence is a finding, not only a comment
      after a value. The hook refuses, as it refuses a missing `purpose`. The deferred decision of case
      519 is taken up now: the sentence is corrected and case 519 is superseded. The short-form paragraph
      of `rule-case-protocol` tells the agent to quote such a value.

      What `case-guppi` found in the frame. The round said that `generate` does not apply an entry that
      `materialize` marks `incomplete`. That is false. `rule-page-generation` says "A page is always created,
      even incomplete". So the mark of 521.2 names the comment in the yaml that the librarian reads, but
      it does not stop the page. The refusal of the hook in 521.1 is what keeps the cut text off a page.
      521.2 states this as a `－` line and does not change `generate`. `estimate-spec-write-writes-a-defer`
      promises the checks of a defer, so 521.1 replaces its Criterion whole and keeps each earlier line
      word for word. The other Estimates of `rule-spec-write` speak of full Cases, the ratified copy,
      the approved Spec and a superseded Case, and stand. `estimate-materialize-assembles` says that what
      the block lacks is `incomplete`, never invented. A new reason does not make it false, so it stands.
      `estimate-materialize-judges-a-fence` speaks of where a fence opens and closes, not of the YAML
      inside it, and stands. The new promise of `materialize` is the Estimate that 521.2 creates. Its
      slug `estimate-materialize-marks-a-comment` is free: no page under `vault/wiki/` matches it. It
      has a `ref`, so no vault query was run. `estimate-estimates-schema-checked` promises the lists of
      the schema file and that its description and sections name no `Given:` kept on an older page. The
      corrected sentence keeps both, and an `update` of a Render touches no Estimate of the live reading
      (case 378.5), so it stands. `estimate-case-protocol-defers-in-one-reply` promises that a defer is
      shown and written in one reply. It says nothing about the value inside the fence and stands; its
      failed reading is Frontier item C8. The other hooks on `Stop` in `.claude/settings.json` are `guppi
      ledger`, `guppi casecheck` and `guppi context`. The ledger hook writes the `defer` line in parallel,
      whatever `ratified` answers.

      Pre-spec found that the Case defined a comment in two ways. The `then` lines said "after a space
      or a tab", but the `new` texts of `rule-spec-write` and `rule-materialize` and the sentence of 521.4
      said only "after a space". The person accepted the fix. Every text now says "a `#` at the start
      of a line or after a space or a tab", the one definition that the shared function implements. 521.4
      says "after a space or a tab" for a value.

      What the check of the answer notes, and why the notes stand. Two `then` lines of 521.2 share most
      of their words with 521.1: the definition of a comment, and the `－` line on a `#` inside quotes
      or inside a `|` or `>` block. This is on purpose. Both sides use one function and the same definition.
      521.1 promises what the hook refuses, and 521.2 promises what `materialize` marks. They are separate
      promises with separate tests, and the test of 521.2 runs both sides over the same fence.

      Code and timing. The hook runs from the working tree as soon as 521.1 is coded, and the sentence
      of 521.4 reaches `case-schema.md` at the render. In that time the hook may refuse a short Case with
      an unquoted ` #`. Nothing is lost. The ledger line is written, and the agent shows the Case again
      with the value in quotes. This is the same path as a refused missing `purpose`. The form it refuses
      was never correct, so no old form is kept. `materialize` extends an existing yaml and never rewrites
      it, so L36 of 1432 is not read again.

      Not done: `generate` still applies an entry marked `incomplete`. `materialize.yaml` L36 of 1432
      stays as it is. A full Case of `case-guppi` gets no new check, because its values do not pass through
      hand-written YAML.'
    problem: 'YAML cuts a value without quotes at ` #`, and no check sees the cut. So a short-form Case
      can reach the Spec, the Decision page and the backlog with a value the person never wrote, as the
      purpose of case 519 did. The backlog item of `rule-estimates-schema` also carries that cut text,
      and the sentence it was meant to correct is still wrong.'
