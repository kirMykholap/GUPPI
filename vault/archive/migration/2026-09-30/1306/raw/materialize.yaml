      run of backticks that opens a line inside it, three at the least, which `tagged_blocks` of `guppi/materialize.py`
      reads back whole; the same fence rule holds for the blocks it writes into `raw/<date>/<hi HHMM>/spec.md`
      once it stands, and for the `then` block of a short-form defer under `## Deferred`.

      **＋** No `SendUserFile` call on the file of Case N made after the time the store holds for Case
      N: exit 2 with the reason on stderr, and nothing of Case N is written.

      **＋** A last showing of Case N that differs from the stored answer in a section it shows — by the
      one comparison `uv run guppi casecheck` makes on `Stop`, imported from `guppi/casecheck.py` — a
      store with no Case N, or a Case N stored with findings: exit 2 with the reason on stderr, and nothing
      of Case N is written.

      **＋** A task line opening with `create`, `update`, `delete` or `defer` and the slug in its first
      code span is an item of the `then` block; its sub-points are its keys — `old` and `new` in pairs
      under `replace`, `reword old` and `reword new` under `reword`, `set`, `change`, `rename`, `sections.<Name>`,
      the fields of a `create` — each value one code span, padded by one space on each side when the value
      holds a backtick, or a fenced block under the sub-point.

      **＋** A sub-point that reads into no key `item_keys` of `guppi/materialize.py` gives the kind and
      the category of its item, or a value that holds a backtick in an outer span not padded on both sides,
