  case_text:
    given: '`rule-case-build` — the rule whose Render is the frame of `case-guppi`

      **＋** `.claude/agents/case-guppi.md` — the frame rendered from it

      **＋** `.claude/agents/ask-guppi.md` — the recipe of the index lines, judged by meaning

      **＋** `rule-case-build-checks-its-sub-cases` — the rule put off by case 480, taken up here

      **＋** `insight-case-build-promise-lines-compared-by-no-check` — the Insight of the departed option

      **＋** `insight-workflow-fact-signed-from-a-check-that-does-not-cover-it` — the Insight of the claim
      wider than its search

      **＋** `estimate-case-build-checks-the-finished-case` — the promise this sub-case creates'
    when: '`case-guppi`, with `.claude/agents/case-guppi.md` rendered from `rule-case-build`, has built
      a Case and is about to answer with it.'
    then: 'It puts each option the person chose in its rounds, or the person''s own words where they answered
      outside the options, beside the `then` and `recommend` of the Case, and the Case holds each one.

      **＋** Where the frame shows after a round that a chosen option cannot hold as written, its answer
      is a round on that point, not a Case with another behaviour.

      **＋** For each page whose text the change makes false, it searches the live pages of the vault,
      leaving out the Decision pages, and the code, for the page''s slug, and reads each hit that `given`
      does not name around the line of the hit.

      **＋** For a fact that no slug marks, it reads the index lines of the recipe of `.claude/agents/ask-guppi.md`
      and judges them by meaning.

      **＋** Each hit that the change makes false enters the Case, or its `context` says why it stands,
      and a claim of `context` about every text names the search it rests on.

      **＋** It reads side by side the finished new texts of all its sub-cases that change one page, and
      the Case holds no contradiction between them.

      **－** A hit in a History line, in `log.md` or in `brief.md` is not read.'
    context: '`case-guppi` asks the person rounds of questions and then writes the Case from the answers
      and from its reading of the frame. The frame is the pages and files that the Case''s `given` names.
      Two faults of this step were found only at pre-spec, each after ratification, and each cost a second
      ratification. In session 0248 the person chose an option saying that the brief of `/carry` lists
      no Cases, and the built Case took its Cases from the open lines of the Frontier (`lesson-case-build-built-case-departs-from-the-chosen-option`).
      The context of Case 534 said the Case changed all three texts that count the children of `rule-settings`,
      but the Purpose of `rule-hook-registry` held the same count (`lesson-case-build-frame-count-claimed-over-a-partial-search`).
      The frame reads only the pages that `given` names. Nothing compares the built Case with the options
      the person chose, and nothing holds those choices once the session ends: no vault file records the
      rounds, `recommend` stays in the Case file, and the Decision page carries only `## Problem`.

      The two lessons are the newest children of `insight-case-build-promise-lines-compared-by-no-check`
      and `insight-workflow-fact-signed-from-a-check-that-does-not-cover-it`. Both Insights are open in
      the backlog, each one reopened by its lesson after an earlier Case had actioned it (cases 472.3,
      388). The first Insight also names a Criterion replaced whole that drops a line. The note of pre-spec
      from case 472 already covers that half, and 544.1 closes the half about the chosen option. The draft
      rule `rule-case-build-checks-its-sub-cases`, put off by case 480, asks for a side-by-side reading
      of the sub-cases that change one page before the Case is shown. The person took it up here. A Grep
      of `vault/wiki/` finds its slug only in `brief.md`, `backlog.md`, `log.md` and `decision-case-480`.
      The two lessons come from another session and get no mark. Setting each Insight `actioned` lets
      the cascade of `generate` archive its clustered lessons.

      The person asked that the rounds reach the Decision page, and that this stay one Case with the form
      of `recommend` rather than become a Case of its own. On the shown Case the person objected that
      some items of `recommend` showed an earlier recommendation that a later question had replaced, such
      as `## Note`. Each item now gives the latest recommendation and the latest answer, and 544.2 makes
      that the rule. Each question keeps its own item, so the check of 544.3 still finds every title.

      The frame gave these findings. `SPEC_SECTIONS` of `guppi/ratified.py` leaves `recommend` out of
      the Spec, so `materialize` never sees it. A parent Case has no ledger line and so no Decision page:
      there is no `decision-case-534`. The `decision` class of `guppi/lint.py` refuses a Decision page
      with no kind list. Its `origin` check looks for `[case N]` in the ledger, which a parent does not
      have. `guppi/materialize.py` fills a sub-case''s `problem` and `recommend` from its parent and needs
      `problem` on every record. `generate` writes `## Context` for a record whose `case_text` has no
      `given`. A parent record carries the parent''s `given` when the parent has one, and a record with
      `children` never gets `## Context`. `estimate-materialize-lifts-when-and-then` still holds, because
      a Case with its own `given` still carries it in its `case_text`, and a sub-case without one carries
      its parent''s. The row `Decision page` of the glossary, the rule that bold is for section labels
      and operands only, and the sentences of `rule-case-protocol`, `rule-case-check` and `rule-decisions-schema`
      on `recommend`, the kind lists and the body of a Decision page would become false, so each gets
      a pair here.

      These Estimates speak of the change, and each one''s Criterion is replaced whole: `estimate-spec-write-copies-the-ratified-case`,
      `estimate-spec-write-reaches-the-approved-spec`, `estimate-case-protocol-case-form`, `estimate-materialize-assembles`,
      `estimate-generate-writes-the-decision-page`, `estimate-decisions-schema-checked` and `estimate-lint-finds-a-broken-link`.
      The reading of `estimate-spec-write-reaches-the-approved-spec` on this session''s Frontier then
      waits for a later session. The lines of these Criteria that are not carried word for word are the
      lines this Case changes on purpose. The then lines that the check found to share words across sub-cases
      name different pages and different promises. Some Estimates stand. `estimate-case-build-writes-the-case`
      stands, because case-guppi still reads each page `given` names, and the new checks are a new promise.
      `estimate-case-check-sends-back-a-faulty-case` stands, because the two new findings are sent back
      like any other. This session''s cases 543.1 and 543.3 change `rule-case-build` and `rule-case-protocol`,
      and case 542 changes `rule-spec-write`. The pairs here touch other text.

      No reader needs an old form. The two new findings send a Case back to `case-guppi`, and nothing
      is lost. `materialize` never rewrites a `materialize.yaml`. Decision pages written before are not
      rewritten. This session''s Spec was written by the old Spec hook and holds no `recommend`, so no
      page of this session gets `## Recommend`. If the code of 544.6 to 544.9 is built before the librarian''s
      run, this session''s pages do get the parent pages, `parent`, and sub-case pages with no `## Problem`.
      The full new shape starts with the Cases of the first session after the code is built. Every `create`
      carries a `ref`, so no vault query ran, and a Glob finds each new slug free.

      Not done: a similarity search by vectors, any judgment of what an answer says, and a hook that writes
      the rounds itself. The report of `ask-guppi` at pre-spec stays as a second net.'
