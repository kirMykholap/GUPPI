  applied: '17:24:03'
- case: '542'
  decision: decision-case-542
  origin: raw/2026-09-30/1306/ledger.md#case-542
  targets:
  - kind: update
    category: rules
    slug: rule-spec-capture
    ref: rule-spec-capture
  - kind: update
    category: rules
    slug: rule-spec-write
    ref: rule-spec-write
  - kind: update
    category: estimates
    slug: estimate-spec-write-writes-a-defer
    ref: rule-spec-write
  tags: []
  case_text:
    context: 'When the person defers a decision, the `Stop` hook of `rule-spec-write` writes it in the
      short form under `## Deferred`. It uses the plan file while `spec.md` in the session''s folder does
      not stand, and `spec.md` once it stands. Case 531.14 gave a short defer one moment, the close of
      Plan Mode: Retro puts nothing off, and what it would put off is a line of `handoff.md`. `rule-case-protocol`,
      `rule-retro`, the `retro` skill and the glossary row Retro already say this. Five texts still name
      Retro as the moment of a defer. The Purpose of `rule-spec-capture` says the hook writes a defer-only
      Case "at Retro", and so does the docstring of `guppi/spec.py`, which it mirrors (case 200.4). The
      "How it works" section of `rule-spec-write` and the docstring of `guppi/ratified.py` say it too.
      So does the Criterion of `estimate-spec-write-writes-a-defer`. The code comments in `guppi/ratified.py`
      and `guppi/materialize.py` and a test name in `tests/test_ratified.py` say the same. Case 531.14
      named `rule-spec-write` in its `given` but gave it no `update`. The hook''s behaviour stays: it
      still writes a defer into `spec.md` once that file stands. After case 531.14 no step of the protocol
      reaches that path, but that does not make any sentence false once "at Retro" is gone. The Criterion
      of `estimate-spec-write-writes-a-defer` is replaced whole, since it names Retro. Two of its lines
      change on purpose. The first line no longer names Retro or Plan Mode as the moment: it names only
      whether `spec.md` stands. The exception on the ratified copy `<plan>.ratified.md` goes, because
      the hook has written no such copy since case 445.2. Its other half stays: the check after the write
      does not run on a defer. The other lines are carried word for word. The other Estimates of `rule-spec-write`
      and of `rule-spec-capture` do not name Retro and are not touched. The History lines that name Retro
      stay: they record what was decided then. The open defer on `rule-spec-write` by case 475 is a different
      bug, about a Case built again as a parent. It stays in the backlog, and this Case does not supersede
      it. This Case creates no page, so the vault query was not run.'
    problem: Two pages, an Estimate and the code still say the hook writes a short defer at Retro, and
      Retro puts nothing off since case 531.14. Each such sentence is false and must be corrected without
      changing what the hook does.
    given: '`rule-spec-write` — the `Stop` hook that writes a short defer, its "How it works"

      **＋** `estimate-spec-write-writes-a-defer` — the promise that the hook writes a short defer, its
      Criterion replaced whole

      **＋** `rule-spec-capture` — the writers of `spec.md`, its Purpose

      **＋** `guppi/ratified.py` — the hook, its docstring and the comment on the target of a defer

      **＋** `guppi/spec.py` — the docstring that names the writers of `spec.md`

      **＋** `guppi/materialize.py` — the comment on the short form in the check for an incomplete Case

      **＋** `tests/test_ratified.py` — the test of a defer written into `spec.md`

      **＋** `rule-case-protocol` — a short defer has one moment, the close of Plan Mode'
    when: 'The `Stop` hook `uv run guppi ratified` runs after a reply whose `LEDGER` block holds lines
      of a Case N that are all `defer` — beside the lines of other Cases or alone — and the same reply
      shows `## Case N —` in the short form: `context`, `problem` and a fence tagged `then` with its `defer`
      items.'
    then: 'The hook writes that Case under `## Deferred` of the plan file while `spec.md` in the session''s
      folder does not stand, and of that `spec.md` once it stands: the heading, `context`, `problem` and
      the `then` block as the reply shows them.

      **＋** The section of Case N is replaced when it stands there, appended at the end of `## Deferred`
      otherwise; the heading `## Deferred` is added when the file has none.

      **＋** A reply with no showing of Case N, or a `then` block without a `defer` item carrying `slug`,
      `type` and `purpose` for each `defer` line of the reply: exit 2 with the reason on stderr; on the
      re-fire (`stop_hook_active`) exit 0.

      **＋** A key of a `defer` item that `item_keys` of `guppi/materialize.py` does not give a `defer`
      of its category: exit 2 with `` `<key>`: not a key of defer <slug> `` on stderr, and nothing of
      the Case is written.

      **＋** A `then` block that holds a YAML comment — a `#` at the start of a line or after a space or
      a tab, outside a quoted value and outside a `|` or `>` block — as the function of `guppi/materialize.py`
      judges it: exit 2 with the line of the comment and the advice to quote the value on stderr, and
      nothing of the Case is written.

      **－** A `#` inside a quoted value or inside a `|` or `>` block is text, not a comment, and is no
      refusal.

      **－** A `defer` of a category with no schema file, or of one whose schema rule a decision line of
      the session or of the reply creates or updates, is not judged by its keys (case 308.2).

      **－** The check after the write does not run on the Case.'
  spec: vault/raw/2026-09-30/1306/spec.md
  applied: '17:24:03'
- case: '543.1'
  decision: decision-case-543.1
  origin: raw/2026-09-30/1306/ledger.md#case-543.1
  targets:
  - kind: update
    category: rules
    slug: rule-case-build
    ref: rule-case-build
  tags: []
  case_text:
    given: '`rule-case-build` — the rule whose Render is the frame of `case-guppi`

      **＋** `.claude/agents/case-guppi.md` — the frame rendered from it'
    when: '`case-guppi` answers with a round of questions, with `.claude/agents/case-guppi.md` rendered
      from `rule-case-build`.'
    then: 'The round ends with the `➡️` line of its last question and the lines of a list under it.

      **＋** No horizontal rule, no list of the files `case-guppi` read and no note stand after it, even
      where a general instruction of Claude Code asks a sub-agent to share file paths.

      **－** A first round still opens with its `**Context:**` paragraph before its first question.'
    context: 'Two readings failed on the rounds of questions that `case-guppi` writes. First, `estimate-case-build-writes-a-plain-round`
      failed because the first round on Case 534 ended, after its last question, with a list of the files
      the agent checked, named by session ids alone. The frame `.claude/agents/case-guppi.md`, rendered
      from `rule-case-build`, already says that a round holds nothing else but the context of a first
      round. But Claude Code also gives every sub-agent a general note: in its final response, share the
      file paths that are relevant to the task. The frame does not say that this note does not apply to
      a round. The list does not help the person, and it does not help the main agent either: the main
      agent shows the round translated line by line, it reads none of those files to do so, and it asks
      `case-guppi` for a fact when it needs one.

      Second, `estimate-skill-grill-me-asks-in-rounds` failed because the label `**Options:**` came out
      indented by four spaces in most rounds. This session saw the same in the rounds on Cases 541 and
      542. Markdown shows a line indented four spaces after a blank line as code. The cause is the question
      template of `.claude/skills/grill-me/SKILL.md`, rendered from `rule-skill-grill-me`. The whole template
      is an indented code block, and its Options label has eight spaces where the `**Now:**` line and
      each option have four. `case-guppi` copies it as it stands.

      The eight spaces came from the page writer. `replace_hits` of `guppi/generate.py` splits the `old`
      of a pair into its words and joins them with any whitespace, so the leading spaces of `old` are
      never matched. The pair of case 511.1 had an `old` that opened with four spaces and a `new` that
      opened with four spaces. The match started at the first word, so the page kept its four spaces and
      `new` added four more. Pre-spec replays each pair by the same function (`check_pairs` of `guppi/prespec.py`),
      and the Case check hook of `rule-case-check` runs the same checks through `judge`. So neither of
      them could see the doubled indent. No live `materialize.yaml` under `vault/raw/` holds a pair whose
      `old` or `new` opens with whitespace, so no signed pair waits on the old matching.

      In the frame, `estimate-case-build-writes-the-case` already promises that a round holds nothing
      else. Its Criterion stands, and so does that of `estimate-case-build-writes-a-plain-round`: the
      person chose to replace no Criterion for the note after a round. The Criterion of `estimate-skill-grill-me-asks-in-rounds`
      already asks for the label alone on its line, so it stands too. `estimate-generate-writes` promises
      a `replace` with whitespace collapsed and exactly one occurrence, and `estimate-prespec-simulates-the-pairs`
      promises a replay with whitespace collapsed as `generate` collapses it. Both stay true: the leading
      spaces never make an anchor miss or hit twice. So the new promises go to new Estimates, and those
      two Criteria are not replaced. The Criterion of `estimate-case-check-sends-back-a-faulty-case` says
      the hook runs `judge` of `guppi/prespec.py`, so a new finding of `judge` reaches it with no change
      there. Both new slugs are free, and each `create` carries a `ref`, so no vault query ran. No open
      backlog line of the Frontier names a page of this Case.'
  parent: decision-case-543
  spec: vault/raw/2026-09-30/1306/spec.md
  applied: '17:24:03'
