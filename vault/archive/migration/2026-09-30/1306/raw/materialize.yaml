      the answer of `case-guppi` stored under Case N, and the session''s transcript for the `SendUserFile`
      calls on `raw/<date>/<hi HHMM>/cases/case-<N>.md`, N the id of the top-level Case, and for the last
      earlier reply that shows Case N with at least one of its sections.


      Then:

      The hook writes the stored answer of Case N into the plan file `plan_path` finds, the section of
      Case N replaced when it stands, appended otherwise: the heading, `context`, `problem`, `recommend`,
      `given`, `when` and `then` as the answer holds them; a block tagged `then` built from the sub-points
      of `tasks`; a block tagged `tasks` of the task lines without their sub-points; `ratification` is
      not written.

      **＋** A sub-case''s own `recommend` is written under its heading, and the `context`, `problem` and
      `recommend` of its parent come from the parent''s stored answer.

