- case: '568'
  decision: decision-case-568
  origin: raw/2026-10-01/1237/ledger.md#case-568
  targets:
  - kind: update
    category: rules
    slug: rule-case-build
    ref: rule-case-build
  - kind: update
    category: rules
    slug: rule-case-protocol
    ref: rule-case-protocol
  - kind: update
    category: estimates
    slug: estimate-case-build-records-the-rounds-in-recommend
    ref: estimate-case-build-records-the-rounds-in-recommend
  tags: []
  case_text:
    context: 'Each Case that `case-guppi` builds records the questions of its rounds in `recommend`. Each
      item gives a question, what was recommended and the person''s answer. Since case 544.2, an item
      whose answer changed only one sub-case must stand under that sub-case''s heading, and the others
      stand on the parent. `case-guppi` keeps the item on the parent anyway. The reading on ledger line
      45 of session 2356 marked `estimate-case-build-records-the-rounds-in-recommend` failed for this.
      In Case 561, the question on what done means changed only 561.11, and its item stands on the parent.
      The file `raw/2026-10-01/1237/cases/case-567.md` repeats the fault: the question on whether the
      report still names every page changed only 567.1, and its item stands on the parent. A second read
      of Case 561 found more items on the parent that shaped one sub-case, such as the question on what
      blocks leaving Plan Mode and the question on how `/pre-spec` starts with no question. The person
      sees no problem in an item on the parent, and chose that the parent is allowed. An item whose answer
      changed only one sub-case may stand on the parent or under that sub-case. Every other item stands
      on the parent. No script checks the place, since either place is now correct. Cases 561 and 567
      stay as ratified, because under the new rule nothing in them is misplaced.


      The rule stands in three sentences. One is in the Render of `rule-case-build`, and two are in the
      Render of `rule-case-protocol`: the `recommend` row of the sections table and the paragraph on splitting.
      This Case rewrites all three. The Criterion of `estimate-case-build-records-the-rounds-in-recommend`
      is replaced whole. The check of the answer noted that the old line on the place of an item is not
      carried. That line changes on purpose, to the new rule, and every other line is carried word for
      word. The `purpose` of the Estimate changes to match. The Estimate is set `pending` and is read
      again on the Cases of a later session.


      No reader in code changes. In `guppi/casecheck.py`, `recommend_titles` collects the item titles
      from every Case of the answer, so the check that each question has an item passes with the item
      in either place. In `guppi/materialize.py`, a sub-case never reads `recommend` from its parent,
      and a parent with sub-cases gets a record of its own that carries the parent''s `recommend`. So
      an item on the parent lands on the parent''s Decision page.


      No create is made, so the vault was not queried. Searches:

