      that the lines stand in that one reply, or that the agent goes on after it, and none sets what else
      the reply holds. `case-schema.md` also says that a line closed at Retro shows no Frontier, which
      the new form keeps. A Grep for `ends Retro|end of Retro|reply that ends|Retro` over `.claude/` printed
      the skills `work`, `hi`, `retro` and `handoff`. The hit in `hi` speaks of closing a line at Retro,
      and `work` and `handoff` set no form for this reply. The hook of `rule-retro-onward` judges only
