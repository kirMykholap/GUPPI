    recommend: "- **What may stand before the ledger block in the reply that ends Retro?**\n  - Recommended:\
      \ (a) one short line in Russian, then the block: one sentence in the chat language that names the\
      \ commit, then the `LEDGER` block and nothing else; a headed part or a list before the block breaks\
      \ the rule.\n  - Answer: (a).\n- **Does anything beyond the skill's text hold the form of that reply?**\n\
      \  - Recommended: (a) the text alone, checked by the reading: the skill states the form exactly,\
      \ and the reading by hand of the Estimate catches a departure.\n  - Answer: (a)."
    given: '`rule-retro` — the rule of the skill `/retro`, whose Render sets the reply that ends Retro

      **＋** `.claude/skills/retro/SKILL.md` — the skill rendered from that Render

