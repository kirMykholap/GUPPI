  decision: decision-case-567.1
  ref: estimate-documentation-completes
  category: estimates
  set:
    status: pending
  sections:
    Criterion: 'When:

      `librarian-guppi` starts after the handoff and runs to the end, in a clean context. Its frame is
      the Render of `rule-documentation`. Its inputs are the `handoff.md` of the session''s folder, every
      `materialize.yaml` the walk named, and `tags.md`. The index lines are the Greps that `rule-index-check`
      and `rule-synthesis` name.


      Then:

      `make test-documentation` is green: materialize, generate and cleanup as one pipeline.

      **＋** Live, after the run: every decision line of the session''s ledger has a Decision page and
      its target page, and no page exists that no ledger line produced.

      **＋** Every read in its event log that its frame says the job does not need has its line under Flags
      of the new `vault/wiki/brief.md`: `plan.md`, the text of a page under `vault/wiki/decisions/`, a
      search of the text of the pages under `vault/archive/`, `ledger.md` beyond its one allowed read,
      `spec.md` beyond its unticked lines and the lines the run ticked, a `materialize.yaml` that `guppi
      materialize` did not name, and an archived page opened at the synthesis.

      **＋** Its report names each page opened to judge whether a create is the same page or a near one,
      whether a lesson shares its root cause, or why a script failed, with the reason and the outcome,
      and the one allowed read of `ledger.md`.

      **＋** It edited no yaml entry beyond the marks and the entries of the index check and the synthesis.
      Its commands are in `event_log.md`, its commit is separate from the session''s, and it did not stop
      to ask.

      **＋** It wrote `vault/wiki/brief.md` with the `Write` tool. The new brief holds no fact taken from
      the old brief, and the librarian put no file under `vault/` by `cp`, `mv`, a redirect or a heredoc.

      **＋** After `cleanup` and before the brief, it runs `uv run guppi render`, then `uv run guppi sprint`,
      then `uv run guppi backlog`, then `uv run guppi glossary`. Every line on their stderr is a flag.
      A file the render could not write is left to the next session start. `make lint` then passes its
      `render --check` step.

      **＋** After the brief and before the close, it runs `uv run guppi archive`. Every line on its stderr
      is a flag. The units it moved and the units it kept, with the reason, go into the report. It skips
      the session of the run, which is the latest session folder of the run day or else the nearest date
      back, across midnight too. The commit picks the move up.

      **－** Any other read needs no line under Flags and no name in the report: a page under `vault/wiki/`
      outside `vault/wiki/decisions/`, read for a fact of the brief, the field names of a page or any
      other need, and the scripts'' own files.

      **－** A read that has its line under Flags fails nothing, whatever it read: a Decision page, a Spec,
      the ledger or the archive.

      **－** A hook''s refusal of one of its calls is not worked around by another route: the librarian
      names the refusal in the report and goes on as the refusal says.

      **－** The librarian refuses an instruction of the handoff to repair a yaml entry. It names what
      was asked and why in the report, and the refusal does not stop the run.'
  change: the Criterion replaced whole — only a read the frame says the job does not need is flagged;
