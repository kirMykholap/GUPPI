    recommend: "- **Was the read outside the listed reasons?**\n  - Recommended: (b) inside; the read\
      \ was one step of reading the statuses for Readings due, so the failed result was a misjudgment\
      \ and the Estimate is read again at the next librarian run.\n  - Answer: (b), agreed with the recommendations;\
      \ not answered in the first round, asked again."
    given: '`rule-documentation` — the frame of the librarian, whose Render names the reads, the flags
      and the report

      **＋** `rule-brief` — the brief section spliced into the frame, whose sentence on a fact of the brief
      names the page in the report

      **＋** `estimate-documentation-completes` — the Estimate whose Criterion is replaced

      **＋** `.claude/agents/librarian-guppi.md` — the agent file rendered from these pages

      **＋** `vault/wiki/brief.md` — the brief whose Flags take the line

      **＋** `rule-synthesis` — constrains: names an earlier yaml and an archived page as not needed, flagged
      as the frame says

      **＋** `rule-index-check` — constrains: names in the report a page opened for a same-or-near judgment'
    when: '`librarian-guppi` runs after the handoff with the Render of `rule-documentation` as its frame.
      It writes `vault/wiki/brief.md` and its report.'
    then: 'A read that the frame of `.claude/agents/librarian-guppi.md` names as one its job does not
      need has one line under Flags of `vault/wiki/brief.md`. This includes the earlier yaml and the archived
      page that `rule-synthesis` names.

      **＋** The report names each page opened for one of these, with the reason and the outcome:

      - to judge same or near under `rule-index-check`;

      - to judge a shared root cause under `rule-synthesis`;

      - to say why a script failed.


      It also names the one allowed read of the ledger.

      **－** Any other page under `vault/wiki/` that is not a Decision page needs no line under Flags and
      is not named in the report. This holds whether it was read for a fact of the brief, for the field
      names of a page or for any other need.

      **－** A read that has its line under Flags fails nothing.'
    context: 'The librarian, `librarian-guppi`, runs alone after each session and writes the brief. Its
      frame, the Render of `rule-documentation`, lists four reasons to open a page in the vault. Since
      case 558.1, any read outside those reasons and outside the reads the frame names needs a line under
      Flags of the brief. The frame also asks the librarian to name in its report every page it opens.
      Reading W18 recorded `estimate-documentation-completes` as failed for one read. In the run of 1f43cf1c
      the librarian printed the first lines of `estimate-prespec-onward-sends-the-agent-on` to learn the
      field names of an Estimate, and then searched every Estimate page for its status, target and method
      for Readings due. Its report named that page among the reads it made for the brief, and the brief
      has no Flags line for it. The person judged that read to be part of reading the statuses, which
      the fourth reason covers. They also judged the flag rule too strict for live pages. From now on,
      a flag is due only for a read that the frame itself says the job does not need. The report names
      only the pages behind a judgment and, as case 349 set, the one allowed read of the ledger.


      The frame names the reads the job does not need in one sentence of the Render of `rule-documentation`,
      the one that opens with "Your job does not need": `plan.md`, the text of a page under `wiki/decisions/`,
      a search of the text of the pages under `vault/archive/`, `ledger.md` beyond its one allowed read,
      and `spec.md` beyond its unticked lines and the lines the run ticked. Two sentences of the Render
      of `rule-synthesis` also say that an earlier `materialize.yaml` and an archived page are not needed,
      and that such a read is flagged "as the frame says". They stay true unchanged, because the new frame
      counts those two reads among the flagged ones. This was not asked as a separate question. It follows
      from the title of the chosen answer: flag only the reads the instructions say the job does not need.


      Each replaced Criterion keeps its old lines word for word, with three exceptions. In `estimate-documentation-completes`,
      the line on reads beyond the frame changes, because that is the promise this Case changes, and the
      line on the report adds the pages behind a judgment and the one ledger read. In `estimate-brief-written`,
      the line on the kinds of Flags lines changes for the same reason.


      No create is made, so the vault was not queried. A Grep of `flag the read|beyond the reads|read
      you made beyond|Read beyond|Name every page|name the page in the report|names every page|in the
      report` over `vault/wiki/` printed 18 files: `case-schema.md`, `brief.md`, `log.md`, `rule-case-protocol.md`,
      `rule-documentation.md`, `rule-brief.md`, `rule-index-check.md`, `rule-synthesis.md`, `estimate-documentation-completes.md`,
      `estimate-brief-written.md`, `estimate-index-check-merges.md`, `estimate-synthesis-clusters.md`,
      `estimate-raw-archive.md`, `estimate-case-check-refuses-text-before-a-round.md`, `estimate-case-protocol-asks-in-the-grill-me-shape.md`,
      `decision-case-143.md`, `decision-case-197.md` and `decision-case-357.md`. The glob meant to leave
      out `decisions/` did not apply.

      - `case-schema.md`, `rule-case-protocol.md` and the two Estimates of `rule-case-check` and `rule-case-protocol`
      speak of the report of `/pre-spec`, not of the librarian.

      - The `estimate-raw-archive.md` hit is a Result line.

      - `rule-index-check`, `rule-synthesis`, `estimate-index-check-merges` and `estimate-synthesis-clusters`
      name a page opened for a same-or-near or a shared-cause judgment. That naming stays.

      - `brief.md` and `log.md` are not read, by the rule of this task.

      - The three Decision pages were not opened and are not changed.


      The same pattern over `guppi/`, `tests/` and `.claude/` printed one file, `.claude/agents/librarian-guppi.md`,
      the render of these pages. No code or test judges this text, so no reader in code needs an old form
      kept beside the new. A Grep of `Flags` over `vault/wiki/rules/` and `.claude/` printed 5 files:
      `rule-documentation.md`, `rule-brief.md`, `rule-carry-over.md`, `.claude/agents/librarian-guppi.md`
      and `.claude/skills/carry/SKILL.md`. The Flags of `rule-carry-over` and of the skill `carry` say
      what the vault does not know about a carried session and speak of no read, so they stand. `estimate-brief-carries-the-run-facts`
      speaks of how a Readings due line ends, not of the fields it is read from, so its Criterion stands.
      This session''s librarian runs on the frame it loaded at its start, so the new frame is first read
      at the librarian run of a later session.'
