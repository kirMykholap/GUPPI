  sections:
    Criterion: 'When:

      An agent calls `Edit`, `Write` or `MultiEdit` on a file, and `uv run guppi ratified --guard` on
      `PreToolUse` reads the path, the content and the agent type of the call from the hook input.


      Then:

      The hook refuses every `Edit` and `MultiEdit` of a plan file, and every `Write` of a plan file that
      exists: exit 2 with the reason on stderr, which Claude Code shows the agent, and the call does not
      run.

      **＋** A `Write` of a plan file that does not exist is let through when its content, trimmed, is
      one line that opens with `# `; a `Write` with any other content is refused the same way.

      **＋** Every `Edit`, `Write` or `MultiEdit` of a store `<plan>.checked.json` is refused the same
      way.

      **＋** An `Edit`, `Write` or `MultiEdit` of a file under the `cases/` folder of a session folder
      `vault/raw/<date>/<HHMM>/`, whatever its name and whether it exists or not, is refused the same
      way when the hook input does not name `case-guppi` as the agent type; the reason names the file
      and says that `case-guppi` alone writes it.

      **＋** An `Edit`, `Write` or `MultiEdit` whose hook input names `case-guppi` on a file outside such
      a `cases/` folder is refused the same way.

      **＋** A file under that folder is judged by `is_case_file` of `guppi/casecheck.py`, which the check
      of the file uses too; a plan file is a `.md` file under `.claude/plans/`, judged by `is_plan_file`
      of `guppi/ledger.py`, which `plan_path` uses too.

      **＋** A refusal writes one line of the refusal to the day''s event log and no `tool` line, so `plan_path`
      of `guppi/ledger.py` still names the plan file.

      **－** A call whose hook input names `case-guppi` on a file under such a `cases/` folder is let through
      unless `<plan>.checked.json` holds the number of the file from another agent, as `estimate-spec-reconcile-refuses-a-case-file-another-agent-holds`
      sets it.

      **－** An edit of a file outside `.claude/plans/` and outside such a `cases/` folder by any agent
      but `case-guppi` is not judged by this hook.

      **－** A payload the hook cannot read: exit 0 with one line on stderr.

      **－** No `PostToolUse` hook compares an edit of the plan.'
