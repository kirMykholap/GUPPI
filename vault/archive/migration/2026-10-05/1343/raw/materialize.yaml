- case: '650'
  decision: decision-case-650
  origin: raw/2026-10-05/1343/ledger.md#case-650
  children:
  - decision-case-650.1
  - decision-case-650.2
  tags:
  - hooks
  - harness
  - workflow
  case_text:
    context: 'Each Case is built by its own `case-guppi`, which writes it into `raw/<date>/<hi HHMM>/cases/case-<N>.md`.
      When the agent stops, the check of `rule-case-check` reads the file and stores each Case in `<plan>.checked.json`
      with the `agent_id` of the agent. Since case 645.3 the guard of `rule-spec-reconcile` lets any `case-guppi`
      write any file under `cases/`. Two agents can hold one number: the main agent gives a number twice,
      or the check gives the same free number to two agents it sends back at about the same time (the
      clash that case 610.2 counts numbers for). Then the second agent''s `Write` replaces the first agent''s
      file before the check sends the second agent back. The `Stop` comparison refuses the showing of
      the first Case, and nothing tells its agent to write the Case again (the handoff of session 0311,
      from the Not done of Case 645). The person chose a guard that claims the number at the first write.
      When the store holds no entry under the number of the file, the first call of a `case-guppi` on
      that file writes its `agent_id` there. A call of another agent on that file is refused with a free
      number, and that agent builds its Case under the free number. The holder is judged by `clashes`
      and the number is counted by `new_number` of `guppi/casecheck.py`. These are the judgments the check
      runs, so the guard and the check share one function. Case 650.1 creates the Estimate of this promise.
      The Criterion of `estimate-spec-reconcile-refuses-an-edit-of-the-plan` says that a call that names
      `case-guppi` under `cases/` is let through. That line becomes false, so Case 650.2 replaces the
      Criterion whole, and its line on `case-guppi` becomes an exception that names the new Estimate.
      Its `purpose` and `method` do not say that a call of `case-guppi` passes, so they stand. The Purpose
      and How it works of `rule-spec-reconcile` say that every write of `case-guppi` under `cases/` is
      an exception, and that only the hooks of `rule-spec-write` and `rule-case-check` write the store.
      Four pairs in Case 650.1 fix those sentences. Both Estimates carry a `ref`, so the vault query of
      `ask-guppi` was not run. A Glob `vault/**/*another-agent-holds*` printed nothing, so the new slug
      is free.


      What the frame showed, by these searches. A Grep of `checked\.json` over `vault/wiki/`, with `*.md
      !**/decisions/**`, printed 15 files. `rule-spec-reconcile` and `estimate-spec-reconcile-refuses-an-edit-of-the-plan`
      enter the Case. Ten files read the text, findings or notes of an entry that the check stores: `rule-spec-write`,
      `estimate-spec-write-refuses-a-changed-case-file`, `estimate-spec-write-copies-the-ratified-case`,
      `estimate-case-check-refuses-a-changed-case-file`, `estimate-case-check-shows-only-the-checked-case`,
      `estimate-case-check-sends-back-a-faulty-case`, `estimate-case-check-notes-a-criterion-line-not-carried`,
      `estimate-case-check-refuses-a-letter-outside-the-script`, `estimate-case-check-requires-each-question-of-the-rounds`
      and `estimate-case-check-sends-back-a-clash-with-another-case`. They stand. The check replaces the
      entry of a held number with the Case of the same agent. Until then the entry holds no text, so the
      Spec hook and the `Stop` comparison refuse a showing, as they refuse one that differs from the store.
      `estimate-case-check-sends-back-a-ratified-case-in-another-shape` stands: it counts the keys of
      the store, and a held number is one of them, so the check does not give out a held number. `estimate-case-check-sends-back-a-case-number-held-by-another-agent`
      stands: it judges an entry by its `agent_id`, so an answer of the old path under a held number is
      sent back, as the person chose. Its words "from an answer" name the entry of the agent that holds
      the number. `lesson-hooks-subagentstop-reads-the-last-text-not-the-handback` records a past session.
      A Grep of `PreToolUse` over `vault/wiki/rules/` printed 14 files, and over `.claude/` it printed
      `.claude/settings.json`. Only `rule-spec-reconcile` sets what happens at an `Edit` or `Write` of
      a file under `cases/`. `rule-governed-files-hook` runs `uv run guppi guard` on the same event, for
      rendered harness files only. `rule-hook-registry` and `.claude/settings.json` keep the registration
      of the guard as it is. The other hits name other tools or quote an example.


      `rule-case-build` stands. Its agent file says that the file of its Case is the one file the guard
      lets the agent write, and that stays true. The refusal itself tells the agent to build under the
      free number, as the finding of the check has done since case 610.1. In Work Mode, a new agent dispatched
      to build again a Case that another agent holds is refused. The check of case 610.2 already sends
      such an agent back. The guard reads entries that the check already writes with an `agent_id`, and
      an entry with no `agent_id` is not compared, so the guard needs no old form.


      Pre-spec raised three findings, and this build answers them. The pairs on `rule-spec-reconcile`
      now match the `then` lines: the first write passes when no other agent holds the number, and a number
      counts as held when the store holds Case N or a sub-case of it from another agent, as `clashes`
      judges it. On its own error the guard keeps exit 0 and lets the call run, as the existing rule of
      the guard sets it in `estimate-spec-write-exits-2-on-an-error`. That Criterion stays true, and 650.1
      names the error in a `－` line. A store that cannot be read or written then holds no number, and
      the check of `rule-case-check` still sends back a number held by another agent when the agent stops.
      The guard reads `agent_id` from the `PreToolUse` input. The handoff of session 0311 records this
      field in the probe of 645.3: "the `PreToolUse` input held `agent_id` and `agent_type` (`claude`)".
      So this Case adds no probe. The method of the new Estimate adds a reading by hand of the entry that
      a live `case-guppi` writes with its first `Write`.


      The check sent back notes, and they stand. In Case 650.2, the old line that let a call of `case-guppi`
      under `cases/` through is not carried word for word. It changed on purpose: it is now a line on
      the other agents and an exception that names the new Estimate. Two `then` lines of 650.2 share many
      words with 650.1, the refusal under `cases/` and the line of the event log. Each sub-case still
      sets its own promise: 650.2 the refusal of an agent that is not `case-guppi`, 650.1 the refusal
      of a `case-guppi` whose number another agent holds.


      Not done: the guard and the check each read the store whole and write it whole. Two writes at the
      same instant can still lose one of them, and this Case does not lock the store.'
    problem: A second `case-guppi` that builds under a number another agent holds replaces that agent's
      file before any check runs. The first Case can no longer be shown until its agent writes it again,
      and nothing tells that agent to do so. The question was whether a guard stops the second write and
      how it knows that a number is taken, what the refused agent does, and how done is checked.
    recommend: "- **Whether a guard stops the second write, and how it knows the number is taken**\n \
      \ - Recommended: (a) the guard claims the number at the first write: the first builder whose write\
      \ creates the file is recorded in the store as the holder of the number at once, and a write or\
      \ edit of that file by any other builder is refused before it runs, with a free number counted as\
      \ the check counts one; this covers the time between the first builder's write and its stop.\n \
      \ - Answer: agreed, (a).\n- **What the refused builder does next**\n  - Recommended: (a) it builds\
      \ under the free number the refusal names, counted as the check counts one, and the main agent learns\
      \ the number from the summary.\n  - Answer: agreed, (a).\n- **How the new refusal is checked**\n\
      \  - Recommended: (a) a new check for the claim under the guard's rule, and the old check of the\
      \ guard replaced whole, its line on builders now naming a number held by another builder as the\
      \ exception; two sub-cases.\n  - Answer: agreed, (a)."
