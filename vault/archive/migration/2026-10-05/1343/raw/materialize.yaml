  case_text:
    context: '`orchestration.md` tells the main agent what to do in a session. It still calls the reply
      of `case-guppi` "the answer", from the time that reply held the whole Case. Since case 645, `case-guppi`
      writes the Case into its file and replies with a summary: the path, and for each Case its id, name,
      Estimate and ledger lines in a plain fence. Now "the answer" can mean the summary, the file or the
      text the check stored. The page also leaves out two exact forms that the checks read. It says that
      the `ratification` of a showing holds the ledger lines "as the answer holds them". The `Stop` check
      reads only the quote block under `> **ratification:**`, so in session 1834 of 2026-10-02 the main
      agent put the fence outside the quote and the check refused the showing (`lesson-case-showing-ratification-fence-outside-the-blockquote`).
      The page says the `then` block of a short-form defer carries "slug, type and purpose". The hook
      of `rule-spec-write` reads only a list of items, so in session 0109 of 2026-10-05 a single mapping
      was refused twice (`lesson-orchestration-short-defer-then-block-written-as-a-mapping`). Both lessons
      are children of `insight-workflow-case-schema-silent-on-what-the-scripts-accept`. Case 646 left
      that Insight open until a later Case covered the forms the main agent writes.


      The person chose the following. Each meaning gets its own word: the summary, the file, and the text
      the check stored. Only `orchestration.md` changes. The two forms are shown by examples that a test
      runs the checks over, as case 646 did for `case-schema.md`. Only the two forms of the lessons are
      covered. The work is three sub-cases. The tests skip until the librarian''s render. The example
      of a showing is a parent with two sub-cases, and its heading is in English because the page is documentation.
      The Insight is set `actioned` by this Case. A Grep of `answer` over `vault/wiki/rules/rule-orchestration.md`
      counted 8 lines. The hits on lines 38, 42, 44 and 46 that name a reply of `case-guppi`, the file
      it writes, or what the check stored from that file enter Case 651.1 as fourteen `replace` pairs,
      the first reply on an item from which a round may come among them. Line 32 names the person''s answer
      and line 56 the main agent''s answer to a refusal, so they stand. Lines 84 and 94 are History. The
      other hits on lines 38 and 46 name the person''s answers, `case-guppi` answering as a verb, or the
      recommended answer of a question, the option a round recommends, and they stand.


      What the frame showed. `estimate-orchestration-shows-the-built-case` already calls the reply "the
      summary" and reads the showing that the new words describe, so it checks 651.1 and its Criterion
      stands. `estimate-orchestration-defers-in-one-reply` speaks of "a fence tagged `then` with one `defer`
      item per target", which the example of 651.3 bears out, so it stands. `estimate-orchestration-signs-a-batch-together`
      keeps its own words "an answer of a `case-guppi`", which the new page text does not make false,
      and `estimate-orchestration-forwards-a-discussion-question` keeps "the answer" for the `**Fact:**`
      reply the page now calls "that reply", with the same meaning. `estimate-prespec-gathers-the-answers-after-findings`
      sets the loop of `rule-prespec` whose steps the batch sentence of `orchestration.md` takes, which
      651.1 rewords. Its words "while an answer is out" and "until every `case-guppi` it sent has answered
      with its Case" keep their meaning beside the new words of the page. Its line on "the showing that
      `vault/wiki/orchestration.md` sets" stays true, and that is the showing the example of 651.2 shows.
      So its Criterion stands. `estimate-guppi-tests-green` says that a skipped test is not a failure,
      so `make test` stays green while the new tests of `tests/test_orchestration.py` skip, and it stands.
      `estimate-orchestration-loaded`, `estimate-case-protocol-loaded` and `estimate-ratification-loaded`
      say that no paragraph of `orchestration.md` repeats one of `case-schema.md` or `ratification.md`.
      The new paragraphs and examples are worded apart from the example of `case-schema.md`, with another
      subject and other ledger lines. The checks the examples pass are not changed: `estimate-case-check-refuses-text-outside-the-list`
      and `estimate-spec-write-writes-a-defer` stand. The tests read text that lands only at the librarian''s
      generate and render. `rule-retro` lets no red test pass, so, as the person chose and as `tests/test_case_schema.py`
      does, each test skips with a reason while the page holds no block of its tag. A Case of a later
      session removes the skips after the readings pass.


      The searches this Case rests on. A Grep of `rule-orchestration|orchestration\.md` over the repository
      root, with the glob `!**/decisions/** !**/raw/** !**/archive/** !**/log.md !**/brief.md`, printed
      38 files. I read each hit outside History lines, and none says something that this Case makes false.
      A Grep of `short form|the summary` over `vault/wiki/rules/` printed 6 files: `rule-orchestration`,
      `rule-case-protocol`, `rule-spec-write`, `rule-case-build`, `rule-decisions-schema` and `rule-compact-recall`.
      Over `.claude/` it printed `.claude/agents/case-guppi.md`. `rule-spec-write` sets how the hook reads
      a short-form defer, and it is named in `given` of 651.3 and unchanged. `rule-case-build` and the
      agent file set the summary that `case-guppi` writes, a moment before the main agent''s showing,
      and they stand. `rule-case-protocol` and `rule-decisions-schema` point to `orchestration.md` for
      the short form, and `rule-compact-recall` speaks of the summary of a compaction. A Glob `vault/**/*example*`
      printed `vault/wiki/lessons/lesson-wait-what-invents-an-example.md` and `vault/wiki/estimates/estimate-case-protocol-example-passes-the-check.md`,
      so both new slugs are free. Both new Estimates carry a `ref`, so the vault query of `ask-guppi`
      was not run. The Insight is set `actioned` with `addressed_by: decision-case-651.3`, the bare form
      that case 636 used. The cascade of `generate` then archives its `clustered` children, among them
      `lesson-case-build-closes-a-sprint-item-without-the-sprint-page` and `lesson-case-build-splits-a-case-whose-line-stands`.
      A new lesson of the same kind reopens it.


      The check sent back notes, and they stand. Three `then` lines of 651.3 share most of their words
      with 651.2: the paragraph before the block, the test that holds no copy, and the skip. Each sub-case
      still sets its own promise. 651.2 covers the block tagged `showing` and the `Stop` check of `rule-case-check`.
      651.3 covers the block tagged `defer` and the hook of `rule-spec-write`.


      Not done:

      - `rule-case-check`, `rule-spec-write`, the other Estimates and the code keep the word "answer",
      the refusal of the `Stop` comparison included.

      - The acknowledging reply gets no example.

      - The tests keep their skips until a Case of a later session removes them.'
    problem: '`orchestration.md` calls the reply of `case-guppi` "the answer" while that reply is now
      a summary, and it states the `ratification` of a showing and the `then` block of a short-form defer
      in words that the main agent has twice read into a form the checks refuse. The question was which
      words replace "the answer", how far the change reaches, how the two forms are shown and checked,
      and what happens to the Insight.'
    recommend: "- **Which word replaces \"the answer\"**\n  - Recommended: (a) a word for each meaning:\
      \ the summary where the main agent reads the reply of `case-guppi`, the file where the Case is sent,\
      \ and the text the check stored where the Spec hook reads; a round and a Fact reply keep their names.\n\
      \  - Answer: agreed, (a).\n- **How far the change reaches**\n  - Recommended: (a) only `orchestration.md`;\
      \ the other pages and the code keep their words.\n  - Answer: agreed, (a).\n- **How the page states\
      \ the two forms**\n  - Recommended: (b) an example checked by a test that runs the checks over it\
      \ and fails on any refusal.\n  - Answer: agreed, (b).\n- **Which forms the page covers**\n  - Recommended:\
      \ (a) the `ratification` of a showing and the `then` block of a short-form defer, the two the lessons\
      \ name.\n  - Answer: agreed, (a).\n- **One check or one per form**\n  - Recommended: (a) three sub-cases:\
      \ the rewording, checked by `estimate-orchestration-shows-the-built-case` as it stands; the example\
      \ of a showing with a new Estimate; the example of a short-form defer with a new Estimate.\n  -\
      \ Answer: agreed, (a).\n- **What the test does before the page holds the example**\n  - Recommended:\
      \ (a) skip until the render, with a reason that names `orchestration.md`; a Case of a later session\
      \ removes the skip after the readings pass.\n  - Answer: agreed, (a).\n- **What the example of a\
      \ showing shows**\n  - Recommended: (a) a parent with two sub-cases: the heading, a list of two\
      \ items, one `ratification` quote block with the lines of both, the horizontal rule and the agent's\
      \ own text.\n  - Answer: agreed, (a), with the heading of the example in English, since the example\
      \ is part of the documentation.\n- **What happens to the open Insight**\n  - Recommended: (a) mark\
      \ it `actioned`, addressed by this Case.\n  - Answer: agreed, (a)."
