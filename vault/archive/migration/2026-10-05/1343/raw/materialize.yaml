      \ a message that names the file.\n  - Answer: agreed, (a)."
    given: '`tests/test_case_schema.py`: the test that runs the check over the example.

      **＋** `estimate-case-protocol-example-passes-the-check`: its Criterion is replaced whole.

      **＋** `vault/wiki/case-schema.md`: the page that holds the example, rendered from `rule-case-protocol`.
      Unchanged.

      **＋** `rule-case-protocol`: the rule whose Render is that page. Unchanged.

      **＋** `guppi/casecheck.py`: the check of the Cases of a file, which the test imports. Unchanged.

      **＋** `rule-case-check`: its `SubagentStop` hook runs that check over the file of a Case. Unchanged.'
    when: '`tests/test_case_schema.py` runs under `uv run pytest`. It reads the block tagged `case` in
      `vault/wiki/case-schema.md`, rendered from `rule-case-protocol`, and runs over it the function of
      `guppi/casecheck.py` that the `SubagentStop` hook of `rule-case-check` runs over the Cases of a
      file. It runs in a temporary project that holds the schema files of the vault and the pages the
      example updates.'
    then: '`vault/wiki/case-schema.md` holds, under its own heading after its `## Language` section, one
      block tagged `case`: one Case with sub-cases, in the chat form that `case-guppi` writes into its
      file.

      **＋** The example holds a `create` and an `update` with their sub-points, a `replace` pair whose
      values hold a backtick in spans padded by one space, a `set` in a fenced block, an `update` of an
      Estimate whose Criterion it replaces, a read line for each Estimate it creates or replaces, and
      its ledger lines in a quoted fence under `ratification`.

      **＋** The example''s `context` says what the sentence around the match of its `replace` pair names.

      **＋** The paragraph before the block says that the example passes the check of the `SubagentStop`
      hook of `rule-case-check`, and that the check, not the paragraph, is the source of the limits; it
      lists no limit.

      **＋** The check gives the example no finding and no note, and the test passes.

      **＋** A change of the check that gives the example a finding or a note fails the test, which prints
      it.

      **＋** The test reads the example from `vault/wiki/case-schema.md` and the checks from `guppi/casecheck.py`,
      and holds no copy of either.

      **－** While `vault/wiki/case-schema.md` holds no block tagged `case`, both tests of `tests/test_case_schema.py`
