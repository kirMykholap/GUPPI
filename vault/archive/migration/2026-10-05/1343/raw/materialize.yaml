  replace:
  - old: Retro counts the unticked (case 59.3).
    new: 'Retro counts the unticked (case 59.3).


      ### A showing, by example


      The block below is the text of a reply that shows a Case with two sub-cases, written after the `SendUserFile`
      call that sends its file. Its `ratification` is a quote block: the fence and each ledger line stand
      on lines that open with `> `, while the summary of `case-guppi` gives the same lines in a plain
      fence. In the chat the heading, the names and the short texts stand in {{chat_lang}}; the example
      is in {{documentation_lang}}, as the vault is. A test runs over the example the functions that the
      `Stop` check of `rule-case-check` runs over a reply that shows a Case, and fails on any refusal,
      so the example keeps to that check as the check stands (case 651.2). Copy its form; a refusal of
      the check names the limit a showing broke.


      ````showing

      ## Case 7 — Members get a reminder before a booking


      - 7.1 — The reminder goes out a day before. Done when `estimate-booking-sends-a-reminder` passes:
