      records an earlier stub line of a block that the hook skipped the same way. The person chose that
      every non-blank line of a `LEDGER` block that is no record line is refused aloud, with its own stderr
      line, told only when it stands in the reply just finished, as a line the grammar cannot read is
      told (case 552.2), and checked by a new Estimate: Case 695.1. The hook judges such lines also when
      the reply holds no fresh record line, since it returns early today when it has none. This Case replaces
      Case 691, which was ratified whole and is built again with sub-cases after the findings of `/pre-spec`
      and the person''s answer to a further round; its decision lines carry `{supersedes:case 691}`.


      `ledger_lines` itself does not change: a Grep `\bledger_lines\(` over `guppi/` printed `guppi/ledger.py`,
      `guppi/onward.py` and `guppi/ratified.py`, and the two other hooks read the record lines through
      it as before; the new judgment lives beside it and reads `PREFIXES` of the same module. A Grep `LEDGER_LINE
