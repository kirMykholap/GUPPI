  set:
    status: pending
    purpose: Whether /retro reviews the session with no report and no approval, writes every reading and
      lesson of the turn in one reply and each refused record line of a refusal of the ledger hook again
      in one reply that holds only them, a refused line that is no record left out, commits on green and
