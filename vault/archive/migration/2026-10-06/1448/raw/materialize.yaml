  sections:
    Criterion: 'When:

      The agent writes or edits a working file of the session — `frontier.md`, `spec.md`, `handoff.md`,
      `work.md` or `carry.md` under `vault/raw/**` — or `vault/wiki/brief.md`; or `case-guppi` writes
