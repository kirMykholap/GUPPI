  sections:
    Criterion: 'When:

      The `Stop` hook `uv run guppi ledger` of `guppi/ledger.py` writes fresh decision lines of the reply
      just finished, and a `lesson[<slug>]` line stands before them, in the session''s ledger or among
      the lines the same `Stop` writes, with no `{addressed_by:...}` and no decision line after it that
      carries `{addresses:<slug>}`.


      Then:

      The hook writes every line of the `Stop` as it would without the reminder, and holds back no line
      for the mark.

      **＋** After the write, for each such lesson the hook exits 2 and prints: "ledger: lesson[<slug>]
      has no mark — did a Case of this session fix its cause? Then write the decision line of the Case
      or sub-case that fixed it again with {addresses:<slug>} added, alone in a LEDGER block; otherwise
      go on without it."

      **＋** The stderr line names no Case, however many fresh decision lines follow the lesson.

      **＋** The stderr line is printed only when it does not already stand in a refusal of the hook since
      the person''s last message.

      **＋** A decision line written again with `{addresses:<slug>}` lands beside the first line, the hook
      reminds of that lesson no more, and `guppi materialize` gives the lesson entry `addressed_by`.

      **＋** The hook judges which lessons no mark links to a Case by one function of `guppi/materialize.py`,
      over the ledger lines in their order.

      **－** A lesson that carries `{addressed_by:...}`, that a decision line after it marks, or that stands
      after every fresh decision line brings no reminder; nor does a fresh lesson line that the same `Stop`
      holds back or refuses.

      **－** A `defer` line, and a decision line from an earlier text of the transcript, bring no reminder.

      **－** A session with no `hi` gets no reminder. With `stop_hook_active` set and a transcript the
      hook cannot read, the lines land and the hook prints nothing.'
