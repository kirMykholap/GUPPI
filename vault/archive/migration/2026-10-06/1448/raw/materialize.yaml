      (case 685.1, `reminder_message`). Both messages list the Cases through one function, `named_cases`
      of `guppi/ledger.py`. The hold lists every Case whose decision lines stand before the lesson. The
      reminder lists every Case of the fresh decision lines after it. The hook cannot judge which Case
      is related to a lesson. The ledger of session 0104 holds two Retro lessons, at lines 47 and 48,
      after decision lines of nineteen Cases, 685.1 to 690.3; the brief records that the hold named all
      nineteen, once for each lesson. In this session the ledger holds `lesson-hooks-a-mod-draws-nothing-in-the-mobile-code-tab`
      at line 1, before the decision lines of Cases 691, 692.1, 692.2 and 693. By `reminder_message`,
