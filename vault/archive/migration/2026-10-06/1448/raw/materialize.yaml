      `~/.claude/projects/c--PROJECTS-GUPPI` itself as its path, or a path under it.


      Then:

      The allow list of `.claude/settings.json` holds Edit and Write for `frontier.md`, `spec.md`, `handoff.md`
      and `work.md` under `vault/raw/**`, Write for `carry.md` under `vault/raw/**`, Edit and Write for
      `vault/wiki/brief.md`, `Read(~/.claude/projects/c--PROJECTS-GUPPI)` and `Read(~/.claude/projects/c--PROJECTS-GUPPI/**)`.

      **＋** `.claude/settings.json` is rendered from `rule-permissions`; the JSON case of `tests/test_render.py`
      fixes the shape of the block.

      **＋** Whether the client asked is seen by the person only; the agent''s reply does not tell an approved
      call from one not asked.

      **＋** The client''s prompt is the person''s word: the reading line records whether the client asked,
      from the person, never from the agent.

      **＋** In Plan Mode the client asks before every edit of the main agent outside the plan file, allow
      list or not.

      **＋** `case-guppi` writes the file of its Case in the mode `permissionMode: acceptEdits` of `.claude/agents/case-guppi.md`,
      with no prompt in Plan Mode, and the guard of `rule-spec-reconcile` keeps it inside `cases/`.

      **＋** A Read, Grep or Glob whose path is `~/.claude/projects/c--PROJECTS-GUPPI` itself or a path
      under it runs with no prompt, in Plan Mode too.

      **－** A prompt in Plan Mode on an edit of the main agent, approved by the person, is not a finding
      and not a `failed`.

      **－** `deny` and `ask` are empty; nothing else under `wiki/` is allowed, no path under `cases/`
      is on the allow list, no other path outside the project is on it, and no Edit or Write rule names
      `~/.claude/projects/c--PROJECTS-GUPPI`.'
