    context: 'The `Stop` hook `uv run guppi ledger` takes from a block tagged `LEDGER` only the lines
      that open with `- decision[`, `- estimate[` or `- lesson[`, by `ledger_lines` of `guppi/ledger.py`,
      and skips every other line of the block without a word. In session 0104 a reading line of Retro
      was written as `- estimate-` with no `[`; it was lost unseen and written again as line 49 of that
      session''s ledger, which holds it. The lesson `lesson-ledger-block-written-with-a-placeholder-line`
      records an earlier stub line of a block that the hook skipped the same way. The person chose that
      every non-blank line of a `LEDGER` block that is no record line is refused aloud, with its own stderr
      line, told only when it stands in the reply just finished, as a line the grammar cannot read is
      told (case 552.2), and checked by a new Estimate: Case 695.1. The hook judges such lines also when
      the reply holds no fresh record line, since it returns early today when it has none. This Case replaces
      Case 691, which was ratified whole and is built again with sub-cases after the findings of `/pre-spec`
      and the person''s answer to a further round; its decision lines carry `{supersedes:case 691}`.


      `ledger_lines` itself does not change: a Grep `\bledger_lines\(` over `guppi/` printed `guppi/ledger.py`,
      `guppi/onward.py` and `guppi/ratified.py`, and the two other hooks read the record lines through
      it as before; the new judgment lives beside it and reads `PREFIXES` of the same module. A Grep `LEDGER_LINE
      = ` over `guppi/` printed `guppi/casecheck.py`, which holds `LEDGER_LINE`, a second copy of `PREFIXES`
      for the `ratification` of a Case file; by the finding of `/pre-spec`, Case 692 of this session,
      which changes `guppi/casecheck.py`, imports `PREFIXES` from `guppi/ledger.py` and drops `LEDGER_LINE`,
      so this Case does not touch that module. This Case sets only what the ledger hook does with a line
      at `Stop` and how Retro answers its refusal, not the form of a reply that shows a round or a Case,
      which Case 692 sets. A Grep `LEDGER.{0,200}(skipped|dropped|ignored|silently)` over `vault/wiki/`,
      `.claude/` and `guppi/` printed `vault/wiki/brief.md`, not read, `vault/wiki/lessons/lesson-ledger-block-written-with-a-placeholder-line.md`
      and `vault/wiki/lessons/lesson-ledger-ratification-with-a-new-item-lost-its-block.md`; both lessons
      tell what happened in a past session and stay true. The sentence of `rule-ratification` that a record
      is such a line inside a `LEDGER` block, and a line elsewhere a preview, stays true. The Criterion
      of `estimate-ledger-write-lifts` speaks only of record lines that land, and that of `estimate-ledger-write-refuses-a-line-it-cannot-read`
      only of lines that open with the bracket, so both stand.


      `rule-orchestration` sets a line written again only for the reminder of a lesson with no mark (case
      685.1) and for a held decision line (case 688.7), which this Case does not touch; the general sentence
      that the answer to a refusal of the ledger hook writes the refused lines again stands only in the
      Render of `rule-retro`, for the answer after the reply that ends Retro. There a refused note written
      again would be refused again, while the new stderr line asks to leave it out; the person chose that
      Retro leaves such a line out and goes on to `/handoff` when nothing is left to write: Case 695.2,
      which changes the Render of `rule-retro`, replaces the Criterion of `estimate-retro-runs-on-to-the-handoff`
      and sets its `purpose` anew, since it names the refused line written again; its `method`, a run
      read by hand, names no such promise and stands. A Grep `refused lines? (written )?again|writes the
      refused|lines written again` over `vault/wiki/`, `.claude/` and `guppi/` printed `vault/wiki/log.md`,
      not read, `vault/wiki/rules/rule-page-generation.md`, `vault/wiki/rules/rule-retro-onward.md`, `vault/wiki/rules/rule-retro.md`,
      `vault/wiki/estimates/estimate-retro-onward-sends-the-agent-to-the-handoff.md`, `vault/wiki/estimates/estimate-retro-runs-on-to-the-handoff.md`,
      `.claude/skills/retro/SKILL.md`, `guppi/generate.py` and `guppi/onward.py`. The hit in `rule-page-generation`
      and in `guppi/generate.py` is about decision lines written again with a mark, another thing; the
      hit in `rule-retro` at its History stays. The Purpose of `rule-retro-onward` says the agent answers
      a refusal with a reply that writes the refused lines again and must end, which Case 695.2 corrects.
      The Criterion of `estimate-retro-onward-sends-the-agent-to-the-handoff` and the docstrings of `guppi/onward.py`
      say the hook sends the agent on again at the end of the next reply, which writes the refused lines
      again; the hook''s judgment does not change, and an answer that writes no line and calls `/handoff`
      leaves `handoff.md` standing at its `Stop`, where that Criterion already has the hook exit 0, so
      they stand.'
