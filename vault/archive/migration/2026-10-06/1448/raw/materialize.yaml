  tags: []
  case_text:
    context: The `Stop` run `uv run guppi casecheck` refuses a reply that shows a round of `case-guppi`
      when the main agent wrote text in the turn before its last tool call, by `texts_before_last_call`
      of `guppi/casecheck.py` (case 562). The turn starts at the person's message or a returned answer,
      by `opens_turn` of `guppi/ledger.py`, and a refusal of a `Stop` hook does not open a turn, so a
      text written before a tool call stays in the turn after every refusal. Showing the round again cannot
      remove it, yet the refusal tells the agent to do just that. In this session the main agent wrote
      a status note before it dispatched `case-guppi` for Case 691; the transcript holds the same refusal
      three times, quoting that note, and `LIMIT`, three, let the fourth showing through, so the person
      saw one round four times. The check of the layout of a showing (case 611) calls the same `texts_before_last_call`,
      and its refusal tells the agent to move that text after the horizontal rule, which a text written
      before a tool call cannot be. The person chose that the check judges only texts written after the
      round came back, and after a refusal only what follows it; that the check of a shown Case takes
      the same fix, applied to the summary of `case-guppi`; and that the limit of three stays. Case 692.1
      replaces the Criterion of `estimate-case-check-refuses-text-before-a-round` and Case 692.2 that
      of `estimate-case-check-refuses-text-outside-the-list`, and sets the `purpose` of each anew, since
      each names text before the last tool call; their `method` lines name the tests and stand. Case 692.1
      also changes the Purpose of `rule-case-check` and its `purpose` field for both sub-cases. The Criterion
      of `estimate-case-check-judges-a-showing-after-a-refusal` speaks of the count of refusals and of
      the reasons it counts; the count stays at three and a text before a round or outside a showing is
      still such a reason, so it stands. The check finds its last refusal by `refusals` of `guppi/ledger.py`,
      the one judgment of the refusals, which it already calls to count them, so no second test of a refusal
      record is written; `estimate-ledger-write-lifts`, `estimate-prespec-onward-sends-the-agent-on` and
      `estimate-retro-onward-sends-the-agent-to-the-handoff`, whose Criteria rest on that one judgment,
      stand. The bound of the turn does not change, only what is judged inside it, so `estimate-ledger-write-names-the-kind-of-a-user-record`,
      whose Criterion sets the turn the check reads for a round, stands. Case 692.2 knows a summary by
      one function, a first line that opens with `**Built:**`, which `summary_findings` of `guppi/casecheck.py`
      calls too in place of its own test, as `is_round` is shared for a round; the behaviour of that check
      does not change, so `estimate-case-check-sends-back-a-summary-without-the-case-name` stands. `LEDGER_LINE`
      of `guppi/casecheck.py` is a copy of `PREFIXES` of `guppi/ledger.py`; Case 692.1 drops it and imports
      `PREFIXES` (`rule-one-judgment-one-implementation`), and the tests of the check that read the `ratification`
      of a Case cover it with no promise changed. A Grep `estimate-case-check-refuses-text-before-a-round|estimate-case-check-refuses-text-outside-the-list|texts_before_last_call`
      over `vault/wiki/`, `guppi/`, `tests/` and `.claude/` printed `vault/wiki/log.md`, not read, `guppi/casecheck.py`,
      which enters through its tasks, `vault/wiki/rules/rule-case-check.md`, whose hits are its `estimates`
      list and History, and `vault/wiki/estimates/estimate-case-check-refuses-text-outside-the-list.md`,
      which Case 692.2 changes. A Grep `(nothing before|text of (the main agent's|your) own|before the
      round|before a round)` over `vault/wiki/` and `.claude/` printed `vault/wiki/orchestration.md`,
      `vault/wiki/log.md`, `vault/wiki/estimates/estimate-case-check-judges-a-showing-after-a-refusal.md`,
      `vault/wiki/estimates/estimate-case-check-refuses-text-outside-the-list.md`, `vault/wiki/estimates/estimate-case-check-refuses-text-before-a-round.md`,
      `vault/wiki/rules/rule-orchestration.md`, `vault/wiki/insights/insight-case-form-chat-form-read-by-no-script.md`,
