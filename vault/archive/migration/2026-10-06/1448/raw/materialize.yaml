  category: estimates
  fields:
    kind: QA
    purpose: Whether the ledger hook refuses aloud a non-blank line of a LEDGER block that does not open
      with a record prefix, and says why only for the reply just finished
    method: uv run pytest tests/test_ledger.py — piped payloads and a session ledger in a temp vault
    tags:
    - session
    - hooks
    - harness
    - ledger
    type: estimate
  sections:
    Criterion: 'When:

      The `Stop` hook `uv run guppi ledger` of `guppi/ledger.py`, in a session with a `hi`, finds in a
      `LEDGER` block of a text of the main agent a non-blank line that does not open with `- decision[`,
      `- estimate[` or `- lesson[`.


      Then:

      The line is not written to the ledger.

      **＋** The record lines of the same `Stop` are written and judged as before.

      **＋** When the line stands in the reply just finished, the hook exits 2 with one stderr line per
      such line: "ledger: line not written — a LEDGER block holds only lines that open with - decision[,
      - estimate[ or - lesson[: <line>. Write it again with that opening, or leave it out."

      **＋** A reply whose `LEDGER` block holds no record line gets the same stderr line for each such
      line.

      **＋** Each stderr line is told once until the person''s next message; a repeat of the same line
      stays silent.

