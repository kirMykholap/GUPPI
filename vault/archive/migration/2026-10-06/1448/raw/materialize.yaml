  case_text:
    given: '`guppi/casecheck.py`: the `Stop` run that judges how a round is shown.

      **＋** `guppi/ledger.py`: `refusals`, the one judgment of the refusals, and `PREFIXES`, the openings
      of a ledger line.

      **＋** `tests/test_casecheck.py`: the tests of the check.

      **＋** `rule-case-check`: the rule of the check, whose Purpose names the change.

      **＋** `estimate-case-check-refuses-text-before-a-round`: its Criterion is replaced whole.

      **＋** `estimate-case-check-judges-a-showing-after-a-refusal`: the count of refusals, which stands.

      **＋** `rule-prespec`: the rule of `/pre-spec`, whose `prespec` line ends the judgment of text before
      a tool call.

      **＋** `/hi` and `.claude/skills/wait-what/SKILL.md`: where the main agent puts its own questions
      and re-pitches, with no round.'
    when: '`Stop` fires after a reply of the main agent, and `uv run guppi casecheck` runs on it.'
    then: 'When the turn of the reply, the records after the last `user` record that the function of `guppi/ledger.py`
      names the person''s message or a returned answer, holds a round of `case-guppi`, `uv run guppi casecheck`
      judges how the reply opens. A round is a text that `case-guppi` gives back to an `Agent` or `SendMessage`
      call and that `is_round` of `guppi/casecheck.py`, the one test of a round, finds one; it comes back
      in the `tool_result` of an `Agent` call, or in the returned answer that opens the turn.

      **＋** While the session''s event log holds no `prespec` line of this session after its `hi`, it
      exits 2 when the main agent wrote text in the turn after the first round of the turn came back and
      before its last tool call.

      **＋** When the turn holds a refusal of `uv run guppi casecheck`, judged by `refusals` of `guppi/ledger.py`,
      it judges only the texts after the last such refusal, so a round shown again with nothing before
      it passes.

      **＋** It exits 2 when the first line of the reply that is not blank opens neither with `❓ ` nor
      with a bold label that ends in a colon, the label of the Context paragraph as it stands translated.

      **＋** Its reason on stderr quotes the text that stands before the round and tells the agent to show
      the round again, opening with its Context paragraph or its first question, with nothing before it.

      **＋** The check runs in the same `Stop` run as the comparison of shown Cases, and a reply that both
      refuse gives both reasons.

      **－** A text the main agent wrote in the turn before the first round came back is not judged.

      **－** Text after the last question and one horizontal rule is not judged.

      **－** Once the session''s event log holds a `prespec` line of this session after its `hi`, text
      before the last tool call of the turn is not judged, and a reply of the loop after the findings
      of `/pre-spec` is judged only by its first line; in that loop each answer of a `case-guppi` comes
      back in a turn of its own, and the text the main agent writes there is set by `rule-prespec`.

      **－** A turn with no round of `case-guppi` is not judged: the main agent''s own questions in the
      report of `/pre-spec`, at `/hi` or at a stop of Work Mode, a `**Fact:**` answer shown with the question
      that stood open, and a re-pitch by `.claude/skills/wait-what/SKILL.md`.

      **－** With `stop_hook_active` set a round shown again after a refusal is judged again, and the reason
      is given as `estimate-case-check-judges-a-showing-after-a-refusal` sets it.

      **－** It stores nothing and writes no file.'
    context: The `Stop` run `uv run guppi casecheck` refuses a reply that shows a round of `case-guppi`
      when the main agent wrote text in the turn before its last tool call, by `texts_before_last_call`
      of `guppi/casecheck.py` (case 562). The turn starts at the person's message or a returned answer,
      by `opens_turn` of `guppi/ledger.py`, and a refusal of a `Stop` hook does not open a turn, so a
      text written before a tool call stays in the turn after every refusal. Showing the round again cannot
      remove it, yet the refusal tells the agent to do just that. In this session the main agent wrote
      a status note before it dispatched `case-guppi` for Case 691; the transcript holds the same refusal
      three times, quoting that note, and `LIMIT`, three, let the fourth showing through, so the person
      saw one round four times. The check of the layout of a showing (case 611) calls the same `texts_before_last_call`,
      and its refusal tells the agent to move that text after the horizontal rule, which a text written
      before a tool call cannot be. The person chose that the check judges only texts written after the
      round came back, and after a refusal only what follows it; that the check of a shown Case takes
      the same fix, applied to the summary of `case-guppi`; and that the limit of three stays. Case 692.1
      replaces the Criterion of `estimate-case-check-refuses-text-before-a-round` and Case 692.2 that
      of `estimate-case-check-refuses-text-outside-the-list`, and sets the `purpose` of each anew, since
      each names text before the last tool call; their `method` lines name the tests and stand. Case 692.1
      also changes the Purpose of `rule-case-check` and its `purpose` field for both sub-cases. The Criterion
      of `estimate-case-check-judges-a-showing-after-a-refusal` speaks of the count of refusals and of
      the reasons it counts; the count stays at three and a text before a round or outside a showing is
      still such a reason, so it stands. The check finds its last refusal by `refusals` of `guppi/ledger.py`,
      the one judgment of the refusals, which it already calls to count them, so no second test of a refusal
      record is written; `estimate-ledger-write-lifts`, `estimate-prespec-onward-sends-the-agent-on` and
      `estimate-retro-onward-sends-the-agent-to-the-handoff`, whose Criteria rest on that one judgment,
      stand. The bound of the turn does not change, only what is judged inside it, so `estimate-ledger-write-names-the-kind-of-a-user-record`,
      whose Criterion sets the turn the check reads for a round, stands. Case 692.2 knows a summary by
      one function, a first line that opens with `**Built:**`, which `summary_findings` of `guppi/casecheck.py`
      calls too in place of its own test, as `is_round` is shared for a round; the behaviour of that check
      does not change, so `estimate-case-check-sends-back-a-summary-without-the-case-name` stands. `LEDGER_LINE`
      of `guppi/casecheck.py` is a copy of `PREFIXES` of `guppi/ledger.py`; Case 692.1 drops it and imports
      `PREFIXES` (`rule-one-judgment-one-implementation`), and the tests of the check that read the `ratification`
      of a Case cover it with no promise changed. A Grep `estimate-case-check-refuses-text-before-a-round|estimate-case-check-refuses-text-outside-the-list|texts_before_last_call`
      over `vault/wiki/`, `guppi/`, `tests/` and `.claude/` printed `vault/wiki/log.md`, not read, `guppi/casecheck.py`,
      which enters through its tasks, `vault/wiki/rules/rule-case-check.md`, whose hits are its `estimates`
      list and History, and `vault/wiki/estimates/estimate-case-check-refuses-text-outside-the-list.md`,
      which Case 692.2 changes. A Grep `(nothing before|text of (the main agent's|your) own|before the
      round|before a round)` over `vault/wiki/` and `.claude/` printed `vault/wiki/orchestration.md`,
      `vault/wiki/log.md`, `vault/wiki/estimates/estimate-case-check-judges-a-showing-after-a-refusal.md`,
      `vault/wiki/estimates/estimate-case-check-refuses-text-outside-the-list.md`, `vault/wiki/estimates/estimate-case-check-refuses-text-before-a-round.md`,
      `vault/wiki/rules/rule-orchestration.md`, `vault/wiki/insights/insight-case-form-chat-form-read-by-no-script.md`,
      `vault/wiki/rules/rule-case-protocol.md`, `vault/wiki/rules/rule-case-check.md`, `vault/wiki/lessons/lesson-orchestration-own-text-before-a-round.md`,
      `vault/wiki/lessons/lesson-sendmessage-answers-open-a-turn-of-their-own.md`, `vault/wiki/estimates/estimate-orchestration-shows-the-built-case.md`
      and `vault/wiki/estimates/estimate-spec-capture-offers-the-fork.md`. The sentence of `rule-orchestration`,
      its render `orchestration.md` and `estimate-orchestration-shows-the-built-case` that a refused round
      is shown again with nothing before it stands, and with this Case that showing passes; the hits in
      `rule-case-protocol`, the insight and `log.md` are History; the two lessons tell what happened in
      past sessions; the hit in `estimate-spec-capture-offers-the-fork` is about another moment. Case
      691 of this session sets what the ledger hook does at the same `Stop`; this Case sets only what
      `uv run guppi casecheck` judges and leaves the ledger hook as it stands, and it takes on the `LEDGER_LINE`
      of `guppi/casecheck.py` that Case 691 left to it.
