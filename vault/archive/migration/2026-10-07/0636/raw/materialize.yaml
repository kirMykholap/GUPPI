      **＋** A Case whose item in the summary carries a line `**Other Case:**` is shown as it stands, and
      the main agent asks the person whether that other Case is built again.

      **＋** A reply that shows a Case and that the `Stop` check of `rule-case-check` refuses — its file
      not sent, or a showing that differs from the checked text — is followed, before the person answers,
      by a reply that sends the file and shows the `ratification` as the summary holds it.

