      2 beside any findings, stored under `notes` in `<plan>.checked.json`, and not sent again for the
      same Case id.

      **－** The note is no finding: the Case is stored with no finding for it, and the `Stop` check of
      `guppi casecheck` does not refuse a showing for it.

      **－** Two pairs of the Cases of the file in one sentence give no note, and neither do two pairs
      of other Cases.

      **－** `uv run guppi prespec --check` does not print the note.'
