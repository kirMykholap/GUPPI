      **＋** An answer with no first line `**Built:**`, `**Fact:**` or `**Dropped:**` is a round of questions:
      the main agent shows it in the chat translated into Russian line by line, slugs, paths and quotations
      unchanged, each quotation in its blockquote — the `**Context:**` paragraph that opens the first
      round on an item translated in place before the first question, its label naming its Case and its
      item of `raw/<date>/<hi HHMM>/frontier.md` when the round is one of a batch, each question in the
      order and with the number of the answer, opening with its `❓ **Qn** - **<title>**:` line of `.claude/skills/grill-me/SKILL.md`
      and closing with its `➡️` line, its title, body and recommended answer translated in place, nothing
      merged, dropped or added between the questions, the agent''s own text after the last question and
      one horizontal rule; no Case is shown, no file is sent, and no step of confirmation follows the
      last round.

      **＋** The main agent shows a built Case at every showing by `SendUserFile` with `display: render`
