  change: the Criterion replaced whole — a change the person drops on a ratified Case goes to its case-guppi,
    and the Case is shown and ratified again with the same lines (case 705.2)
  sections:
    Criterion: 'When:

      The main agent takes up a Frontier item, the person answers a round of questions, answers a shown
      Case with a question or a change, or asks for a plain explanation of the agent''s text — by `/wait-what`
      on `UserPromptSubmit` or in words — or a ratified Case changes and is shown again, in Plan Mode
      or in Work Mode, with `vault/wiki/orchestration.md` rendered from `rule-orchestration`.

      **＋** Or the person puts off or keeps the item of a Case that `case-guppi` built and that is not
      ratified, or drops that Case so that the item ends another way.

      **＋** Or the person drops a change to a ratified Case that its `case-guppi` made after the Case
      was last ratified.


      Then:

      The main agent dispatches `case-guppi` with the Case id, the Frontier item and its source, and the
      person''s words on it, in the prompt of the call, after the plan file stands with its title line;
      nothing of the Case stands in the chat before the answer.

      **＋** The person''s answers to a round go to the same `case-guppi` by `SendMessage`, verbatim and
      untranslated, and so does a question or a change of the person on a shown Case that is not a request
      for a plain explanation.

      **＋** A request for a plain explanation of a round, of the short text on a Case or of a reply the
      main agent answers itself by `.claude/skills/wait-what/SKILL.md`; it sends the `case-guppi` of the
      Case a `SendMessage` only to ask for a fact of the Case, and `case-guppi` answers with the fact
      alone, under a first line `**Fact:**` and with no Case heading.

      **＋** An answer with no first line `**Built:**`, `**Fact:**` or `**Dropped:**` is a round of questions:
      the main agent shows it in the chat translated into Russian line by line, slugs, paths and quotations
      unchanged, each quotation in its blockquote — the `**Context:**` paragraph that opens the first
      round on an item translated in place before the first question, its label naming its Case and its
      item of `raw/<date>/<hi HHMM>/frontier.md` when the round is one of a batch, each question in the
      order and with the number of the answer, opening with its `❓ **Qn** - **<title>**:` line of `.claude/skills/grill-me/SKILL.md`
      and closing with its `➡️` line, its title, body and recommended answer translated in place, nothing
      merged, dropped or added between the questions, the agent''s own text after the last question and
      one horizontal rule; no Case is shown, no file is sent, and no step of confirmation follows the
      last round.

      **＋** The main agent shows a built Case at every showing by `SendUserFile` with `display: render`
      on `raw/<date>/<hi HHMM>/cases/case-<N>.md`, the file `case-guppi` wrote and the hook of `rule-case-check`
      checked. In the same reply it writes the heading of the top-level Case: its id, and its name in
      Russian translated from the `**Case:**` line of the summary `case-guppi` answered with. Under the
      heading it writes one list with an item per Case and sub-case of the summary: its id, its name in
      Russian, and a short text in Russian on what done means and how it is checked, taken from the Estimate
      the summary names for it. Then it writes one `ratification` with the ledger lines of every Case
      of the list as the summary holds them, and its own text after one horizontal rule. A summary in
      which a Case names no such Estimate goes back to its `case-guppi` by `SendMessage` before the Case
      is shown.

      **＋** A Case whose item in the summary carries a line `**Other Case:**` is shown as it stands, and
      the main agent asks the person whether that other Case is built again.

      **＋** A reply that shows a Case and that the `Stop` check of `rule-case-check` refuses — its file
      not sent, or a showing that differs from the checked text — is followed, before the person answers,
      by a reply that sends the file and shows the `ratification` as the summary holds it.

      **＋** A round or a Case shown with a text of the main agent''s own before it or outside its list
      is not refused and is not shown again: `rule-case-check` tells the agent of it at the person''s
      next message, and the agent keeps the form from the next showing on.

      **＋** A ratified Case that changes — in its prose or in its body — changes through its `case-guppi`,
      and its new file is sent and ratified again; the main agent edits no Case in the plan file or under
      `cases/`.

      **＋** An item that needs no decision the main agent closes alone, with no dispatch; it dispatches
      `ask-guppi` only at pre-spec, one run over the whole plan at its first run, never to build a Case,
      and asks that run again only to confirm its own findings.

      **＋** When the person puts off or keeps the item of a Case that `case-guppi` built and that has
      no decision line in `raw/<date>/<hi HHMM>/ledger.md`, or drops that Case so that the item ends another
      way, the main agent sends the drop by `SendMessage` to the `case-guppi` of that Case, and the turn
      of the person''s words ends with one line under the bold label `**Waiting:**`, translated, and nothing
      else. The agent goes on with the item only in the turn that the answer `**Dropped:**` of that `case-guppi`
      opens, so that the hook of `rule-prespec-onward` finds the file of the Case empty at the end of
      every later reply.

      **＋** The drop adds no closer: the line of the item in `raw/<date>/<hi HHMM>/frontier.md` closes
      by one of the closers of `vault/wiki/orchestration.md`, as fits what the person chose — `[x] … ·
      work`, `[x] … · case N` of another Case, `[-] … · sprint · defer`, `[-] … · backlog · kept` or `[-]
      … · defer case N`.

      **＋** When the person drops a change to a ratified Case that its `case-guppi` made after the Case
      was last ratified, the main agent sends the drop to that `case-guppi` by `SendMessage`. `case-guppi`
      undoes the change and answers with the summary of the Case in its ratified form. The main agent
      shows the Case again as after a change, and the person ratifies it again, the acknowledging reply
      carrying the same decision lines, so that the hook of `rule-prespec-onward` counts the Case as ratified.

      **－** The main agent writes the heading, the list, the `ratification` and the question on another
      Case from the summary, and does not read the file of the Case.

      **－** The heading carries no name of the main agent''s own and not the words of the Frontier item.

      **－** The main agent writes no context of its own before the first question of a round. The label
      that names the Case of a round in a batch is no such context.

      **－** The main agent writes no `given`, `when`, `then` or `tasks` of a built Case into the chat.

      **－** A deferred decision in the short form is written by the main agent in English in the chat,
      with no dispatch and no file.

      **－** The file of a Case with a decision line in `raw/<date>/<hi HHMM>/ledger.md` is never emptied:
      it keeps the `context` and `given` that its Decision page leaves there.'
