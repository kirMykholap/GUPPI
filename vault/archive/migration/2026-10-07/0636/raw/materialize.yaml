      Case that creates the rule of the hook, and `rule-harness` counts in its Purpose the rules that
      run in no pipeline; tags — `hooks`, `harness` and `workflow`, each a row of `tags.md`; a Glob `vault/**/*shell-write*`
      printed nothing, so `rule-shell-write-check` and `estimate-shell-write-check-repairs-and-reports`
      are free. `estimate-hook-registry-rendered` says that every hook the harness runs is registered
