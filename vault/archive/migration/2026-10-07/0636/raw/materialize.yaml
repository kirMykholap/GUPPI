      \ in plain words.\n- **Which shell tools the check covers**\n  - Recommended: (b) Bash and PowerShell.\n\
      \  - Answer: agreed, (b).\n- **Which page holds the new check**\n  - Recommended: (a) a new rule\
      \ page, such as `rule-shell-write-check`, with its own Estimate; `rule-bash-guard` and its Estimate\
      \ stay as they are, and `rule-hook-registry` gains the hook entries.\n  - Answer: agreed, (a).\n\
      - **Which files the check looks at after each call**\n  - Recommended: (a) every changed or new\
      \ file, ignored files left out, at every call, so a faulty file is reported again until it is repaired.\n\
      \  - Answer: agreed, (a).\n- **What the hook does with a faulty file**\n  - Recommended: (b) repair\
