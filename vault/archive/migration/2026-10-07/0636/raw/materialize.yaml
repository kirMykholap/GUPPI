  case_text:
    context: 'The agent sometimes changes a file of the repository with a Bash or PowerShell command instead
      of the Edit or Write tool, and on Windows the tool on the way rewrites the bytes of the file. The
      three lessons of `insight-workflow-file-changed-through-a-shell-command` show it. Windows PowerShell
      5.1 read `frontier.md` in the ANSI code page and wrote it back with a byte-order mark and broken
      characters. Two inline Python scripts in Bash rewrote `guppi/onward.py` by `Path.write_text`, and
      after the last one the file held 412 CRLF line endings against 0 at HEAD. `guppi/bashguard.py` runs
      before a Bash call and refuses a heredoc only for a backslash in its body or a redirect into a file
      on its marker line, so both scripts passed. No hook of `.claude/settings.json` judges or guards
      a call of the PowerShell tool: the only hook that runs on it is `uv run guppi event tool`, which
      logs every tool on `PostToolUse`, and its line 242 of `vault/raw/2026-09-18/event_log.md` shows
      that the agent calls that tool. The person chose a check after the call rather than a wider guard
      before it, on Bash and on PowerShell; a rule page of its own with its own Estimate; every changed
      or new file at each call; and a hook that repairs CRLF line endings and a UTF-8 byte-order mark
      itself and only names a file it cannot repair, in UTF-16 or not valid UTF-8. `.gitattributes` sets
      `* text=auto eol=lf`, so LF is the form the repository sets for every text file. The hook gives
      its lines as `hookSpecificOutput.additionalContext`, which `rule-spec-capture` names the one shape
      in which the stdout of a `PostToolUse` hook reaches the agent (case 255). A file whose characters
      a tool changed but which stays valid UTF-8 with no mark is not caught, since no byte rule tells
      it from a sound file; where the hook removes a mark it asks the agent to check the characters, since
      in the first lesson the mark came with broken characters. A shell call of a subagent is not checked:
