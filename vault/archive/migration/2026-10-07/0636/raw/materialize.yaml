  - harness
  - workflow
  case_text:
    given: '`rule-case-check`: the rule of the check of the file of a Case, whose Purpose gains the finding.

      **＋** `guppi/casecheck.py`: `check_answer` gives the finding.

      **＋** `guppi/tags.py`: the new module that reads the rows of `tags.md` and the tags that tag lines
      declare, which `register_tags` of `guppi/generate.py` also uses.

      **＋** `vault/wiki/tags.md`: the list of registered tags.

      **＋** `tests/test_casecheck.py`: the tests of the finding.

      **＋** `estimate-case-check-sends-back-an-unlisted-tag`: the new check of the finding.

      **＋** `raw/<date>/<hi HHMM>/cases/case-<N>.md`: the file of a Case.

      **＋** `raw/2026-10-07/0636/cases/case-711.md`: Case 711 changes the same hook and other sentences
      of the Purpose of `rule-case-check`.'
    when: The `SubagentStop` hook `uv run guppi casecheck --subagent` of `guppi/casecheck.py` checks a
      file `raw/<date>/<hi HHMM>/cases/case-<N>.md` whose Case carries a tag in the `tags` of a `create`,
      in `tags` under the `set` of an `update`, or in a `{tags:...}` block of a decision line of its `ratification`.
    then: 'A tag that no row of `vault/wiki/tags.md` holds is a finding of its Case: "case <N>: tag <tag>
      is not in tags.md: use a tag of tags.md, or declare it by a tag line in this Case."

      **＋** A tag that a `tag` line of the same file declares is no finding.

      **＋** A tag that a `tag` line of another Case of the session declares is no finding when a decision
      line of that Case stands in the session''s ledger; the hook reads that tag line from the text of
      that Case as the check stored it.

      **＋** `guppi/casecheck.py` and `guppi/generate.py` read the rows of `vault/wiki/tags.md` by one
      function of `guppi/tags.py`.

      **－** A tag line of a Case of the session with no decision line in the session''s ledger does not
      make a tag listed.

      **－** Where `vault/wiki/tags.md` does not stand, no tag is judged.'
    context: 'A tag reaches a page from a lesson line, from the `tags` of a `create`, or from a `set`
      of `tags` in an `update`. No check compares it with `vault/wiki/tags.md`, the list of tags a Case
      ratified. `register_tags` of `guppi/generate.py` prints a warning that a tag is used but not registered
      only in the librarian''s run, after the page is written. A Grep for `\{tags:[^}]*orchestration`
      over `vault/raw/2026-10-07/0211/ledger.md` printed a count of 2: two lesson lines carried `orchestration`,
      which the list does not hold, and the brief flagged it only after the run. Case 702 gave the Case
      file a tag line that declares a new tag, and its Q2 (a) left this check out. The person chose two
      checks, one where each line is born. The check of the Case file in `guppi/casecheck.py` sends back
      a Case whose `create`, `set` of `tags` or decision line carries an unlisted tag, so `case-guppi`
      declares the tag or picks a listed one before the person sees the Case (Case 703.1). The ledger
      hook in `guppi/ledger.py` refuses a fresh lesson line with an unlisted tag (Case 703.2). A tag counts
      as listed when a row of `tags.md` holds it, when a tag line of the same Case file declares it, or
      when a tag line of a Case of the session with a decision line in the session''s ledger declares
      it. Both checks, and `register_tags`, read the rows through one new module, `guppi/tags.py`. Where
      `tags.md` does not stand, no tag is judged: the seed of `tests/test_case_schema.py` writes no `tags.md`,
      and the example Case of `case-schema.md` carries `cart`, `checkout`, `payment` and `performance`.
      So the example and `estimate-case-protocol-example-passes-the-check` stand. The tags of an Insight
      that the librarian takes from its lessons are not checked, since the lessons that give them are
      checked.


      Both readers run from the working tree as soon as Work Mode changes them. The text they read, `tags.md`,
      changes at the librarian''s run of this session only by Case 704, which declares `orchestration`
      by a tag line. That only widens what passes, and once Case 704 is ratified its tag line already
      counts as declared in this session. A Case that is sent back is fixed by `case-guppi`. A refused
      lesson line stays in the transcript and is judged again at each `Stop`. In Plan Mode a Case may
      first declare the new tag. From `/work` to the end of Retro, `rule-orchestration` puts the lesson
      lines in the one reply that ends Retro, where no Case is ratified. There, by the person''s answer
      to a finding of `/pre-spec`, the lesson takes a tag of `tags.md` and the new tag goes as a line
      of the handoff to a later session, and the stderr line says so. So a refusal loses no lesson, only
      its new tag waits for a later session, and no old form is kept. The lesson lines that already stand
      in a ledger are not fresh and are not judged. Case 704 registers `orchestration`, which `insight-prespec-onward-a-case-ended-with-no-decision-line-stays-out`
      carries.


      The Criterion of `estimate-case-check-sends-back-a-faulty-case` lists the checks of a file without
      saying it lists all of them, so it stands, and the new finding is the promise of a new Estimate.
      `estimate-spec-write-reads-a-new-tag` says that `guppi/casecheck.py` reads the tag line by the same
      function of `guppi/ratified.py`. Case 703.1 takes the tags declared in the same file from that reading,
      so the Criterion stays true and stands. Its method, `-k tag` over `tests/test_casecheck.py`, also
      selects the new tests whose names hold `unlisted_tag`, and they pass when Case 703.1 holds. Among
      the Estimates of `rule-ledger-write`, `estimate-ledger-write-lifts` says that a line any refusal
      of the rule refuses does not land. `estimate-ledger-write-refuses-a-lesson-without-its-prefix` says
      that a line refused for its prefix gets that refusal, and `estimate-ledger-write-refuses-a-line-it-cannot-read`
      says that a line the grammar does not read gets no other refusal. Case 703.2 judges neither kind
      of line for its tags, so both Criteria stand. `estimate-ledger-write-refuses-a-mark-with-no-decision-line`
      says that a line whose mark has a decision line before it is written as before. The other refusals
      of the hook already stood beside it, and the Criterion of `estimate-ledger-write-lifts` bounds it,
      so it stands. `estimate-ledger-write-asks-for-the-mark-of-a-lesson` says that an unmarked line lands
      as it stands when it is written again or stands only in an earlier text, and it lists the lines
      it does not hold. Case 703.2 keeps a line refused for its tag out, and Case 703.3 says that such
      a line is not held. So Case 703.3 replaces that Criterion whole, keeps its lines, and adds one line
      for each, and it sets anew its `purpose`, which states that the line written again is written. `estimate-generate-writes`
      says that a used and undeclared tag goes to stderr, and that stays true.


      Case 711 of this session changes `rule-case-check` and `guppi/casecheck.py` too. Its pairs anchor
      on other sentences of the Purpose than the sentence that ends with case 688.1, after which Case
      703.1 adds its own. Read side by side, the new texts do not contradict each other. The Purpose sentence
      that the checks of a Case are those of pre-spec and of the Spec hook, imported, not copied, is made
      false by Case 703.1 too, since the tag check is the hook''s own. Case 711.3 rewords that sentence
      to name the check of the read of the pairs as an exception, and it should name the tag check of
      Case 703.1 as a second exception. This Case leaves that sentence to Case 711.3, so that two Cases
      do not change one sentence.'
