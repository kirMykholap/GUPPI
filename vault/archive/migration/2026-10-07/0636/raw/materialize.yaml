- case: '711.1'
  decision: decision-case-711.1
  origin: raw/2026-10-07/0636/ledger.md#case-711.1
  targets:
  - kind: create
    category: estimates
    slug: estimate-case-check-applies-the-pairs-of-the-session-in-order
    ref: rule-case-check
  - kind: update
    category: rules
    slug: rule-case-check
    ref: rule-case-check
  tags:
  - hooks
  - harness
  - workflow
  case_text:
    given: '`rule-case-check`: the rule of the check of the file of a Case, whose Purpose gains the run
      in session order.

      **＋** `guppi/casecheck.py`: `check_answer` and `other_blocks` give the other Cases of the session.

      **＋** `guppi/prespec.py`: `check_pairs` applies the pairs in order.

      **＋** `tests/test_casecheck.py`: the tests of the run.

      **＋** `<plan>.checked.json`: the store of the checked Cases of the session, beside the plan file.

      **＋** `estimate-case-check-applies-the-pairs-of-the-session-in-order`: the new check of the run.

      **＋** `raw/<date>/<hi HHMM>/cases/case-<N>.md`: the file of a Case.

      **＋** `raw/2026-10-07/0636/cases/case-703.md`: Case 703.1 adds another finding to the same hook.'
    when: The `SubagentStop` hook `uv run guppi casecheck --subagent` of `guppi/casecheck.py` checks a
      file `raw/<date>/<hi HHMM>/cases/case-<N>.md` whose Case carries a `replace` or `reword` pair, while
      the plan file of the session or `<plan>.checked.json` holds other Cases of the session.
    then: 'The hook applies the `replace` and `reword` pairs of the other Cases of the session first,
      in the order `other_blocks` gives them, and the pairs of the Cases of the file last, to copies of
      the pages in memory, by `check_pairs` of `guppi/prespec.py`, imported; nothing is written to disk.

      **＋** An old text of a Case of the file that then misses, or hits more than once, is a finding of
      that Case in the words `check_pairs` gives it.

      **＋** An old text of a Case of the file that hits once only after a pair of another Case is no finding,
      though the page on disk does not hold it.

      **－** A finding of that run that opens with another Case is no finding of the file.

      **－** The other Cases are those `other_blocks` gives: a dropped Case, a Case a `{supersedes:case
      N}` mark names, a stored Case with findings and the family of a Case of the file are not among them.

      **－** With no other Case of the session, the pairs are judged against the pages on disk as before.'
    context: 'An edit pair is the old and the new words that a Case signs to change a page: a `replace`
      changes one place, a `reword` changes a word on every live page. Today the `SubagentStop` check
      of a Case file runs `judge` of `guppi/prespec.py` over the Cases of the file alone, so `check_pairs`
      looks for each old text on the page as it stands on disk. Only `/pre-spec` applies the pairs of
      every Case of the session in order. No script looks at two Cases whose pairs change one sentence
      while both still match, and no script checks that `case-guppi` read the sentence around a match,
      though `case-schema.md` asks for that read (case 353). `insight-workflow-edit-pair-signed-from-a-grep-fragment`
      names both gaps. Case 351 set it `actioned` with the simulation at `/pre-spec`, and `lesson-case-build-related-cases-same-sentence-missed`
      reopened it: two Cases of session 0104 changed one sentence of `rule-orchestration` so that it named
      one reply twice, and only `/pre-spec` found it, after the person had approved both. The person asked
      whether the check could be made by a script, and chose three checks in the hook, each a sub-case
      with its own Estimate. Case 711.1 applies the pairs of the other Cases of the session first and
      those of the file last, by `check_pairs`, imported. Case 711.2 sends a note once when a pair of
      the file changes a sentence that a pair of another Case wrote into. Case 711.3 sends back a pair
      whose sentence came back whole from no `Read` call of `case-guppi`, and sets the Insight `actioned`.
      A sentence runs to a full stop followed by a space and a capital letter, or to the end of its paragraph,
      by one function that 711.2 and 711.3 share. Pairs of the file''s own Cases in one sentence give
      no note, since `case-guppi` already reads the new texts of its own sub-cases side by side by its
      instructions, and the person''s choice named another Case.


      `estimate-prespec-simulates-the-pairs` checks the run at `/pre-spec`, which does not change, so
      its Criterion stands; its line that the meaning of the words is not judged by a machine stays true,
      since a note judges no meaning. `estimate-case-check-sends-back-a-faulty-case` says that `judge`
      runs over the Cases of the file, which stays true: 711.1 replaces only its pair findings on the
      Cases of the file by those of the run in session order, so an old text that matches only after another
      Case''s pair is no longer a wrong finding. `estimate-case-check-sends-back-a-clash-with-another-case`
      judges clashes by `check_same_target`, and says nothing of pairs, so it stands. The notes of 711.2
      go where the notes of `estimate-case-check-notes-a-criterion-line-not-carried` go, and that Criterion
      speaks only of its own note, so it stands. The test of `estimate-case-protocol-example-passes-the-check`
      calls the check of `guppi/casecheck.py` with no record of an agent, so 711.3 judges no read there,
      the example gets no finding, and that Criterion stands. When the read shows that a pair holds, `case-guppi`
      changes no line and answers with the summary again. The Criterion of `estimate-case-build-writes-the-case`
      speaks of the lines that change, so it stands. With the Insight `actioned`, the cascade of `estimate-generate-cascades`
      archives its `clustered` child at the librarian''s run; the lesson is of another session, so no
      decision line carries `{addresses:...}`.


      The sentence of the Purpose of `rule-case-check` that the checks of a Case are those of pre-spec
      and of the Spec hook becomes false with the read check, and 711.3 changes it. A Grep `checks of
      a Case are the ones of pre-spec` over the repository with the glob `!vault/{raw,archive}/**` printed
      `vault/wiki/rules/rule-case-check.md` alone. A Grep `SubagentStop` over `vault/wiki/rules/` printed
      `rule-orchestration.md`, `rule-case-check.md`, `rule-case-protocol.md`, `rule-hook-registry.md`
      and `rule-spec-reconcile.md`, and over `.claude/` printed `.claude/settings.json`. `rule-orchestration`
      and `rule-spec-reconcile` name the hook and the file it checks, `rule-hook-registry` registers it,
      and `rule-case-protocol` says the example passes the check, which stays true as above; all stand.
      `.claude/settings.json` registers only `uv run guppi casecheck --subagent` on `SubagentStop`. Case
      703.1 of this session adds a finding of an unlisted tag to the same hook and changes `rule-case-check`
      with a pair on the sentence that ends with case 688.1. The pairs of this Case anchor on other sentences
      of that Purpose, and this Case covers pairs only. The two Cases still meet on the sentence that
      the checks of a Case are those of pre-spec and of the Spec hook: the tag finding of 703.1 reads
      `tags.md` through `guppi/tags.py` and is no check of either, so 711.3 names it there as a second
      exception beside the read check. 703.1 sets `implementation_ref` of the page, which this Case leaves
      alone. `estimate-prespec-catches-an-indent-added-twice` says that the hook of `rule-case-check`
      runs `judge` over an answer and sends back a pair that adds an indent twice. Under 711.1 that finding
      of the answer comes from the run in session order instead of from `judge`, and `check_pairs` still
      gives it, so the hook still sends the Case back and that Criterion stands; 711.2 adds a record of
      spans to `check_pairs` and changes none of its findings. A finding of 711.3, or a note of 711.2,
      may name a Case of the session that the prompt of `case-guppi` did not name, such as a `reword`
      that hits a page the item does not name. `rule-case-build` lets `case-guppi` read only the case
      files of the Cases its prompt names, so it could not clear such a finding. So Case 711.4 lets it
      read the case file of a Case that the check of its file names in a finding or a note. It replaces
      the Criterion of `estimate-case-build-checks-the-finished-case`, whose line on the Cases it reads
      says no other Case, and sets its `purpose` anew, since the `purpose` lists the Cases its prompt
      names; its `method` counts the clashes with a Case named in the prompt, which stays true, so it
      stands. Case 705.1 of this session changes the paragraph of `rule-case-build` on the drop of a Case,
      and 711.4 changes the sentence on related Cases in the paragraph of the checks before the summary,
      so the two pairs do not touch one sentence. The rendered `case-guppi.md` changes at the librarian''s
      render, while the hook runs from the working tree at once: in the Work Mode of this session a Case
      built again could be sent back for a part written by a Case its prompt does not name, and it stays
      unshown until that file is read; no line is lost, so no old form is kept. The `addressed_by` of
      the Insight stands bare, `decision-case-711.3`, because the check of this file refused the quoted
      wikilink with `case 711.3: [[decision-case-711.3]] outside a code span names no page`, the Decision
      page not standing before the librarian''s run. The person chose the bare form in that case. The
      Criterion that 711.4 writes changes on purpose one line of the old one, the line on the case files
      it reads, which the check noted as not carried. The new line adds the Cases that a finding or a
      note of the check names, and every other line is carried word for word. The hook runs from the working
      tree as soon as Work Mode changes it, and the writer, `case-guppi`, does not change. A pair sent
      back is fixed by `case-guppi`, so no refusal loses a line and no old form is kept. The check noted
      that two `then` lines of 711.3 share most of their words with a `then` line of 711.2. Both sub-cases
      speak of the sentence around a match of a pair of the file and of text another Case''s pair wrote,
      but 711.2 promises a note on such a sentence and 711.3 promises a finding when it was not read,
      so the lines stay in both.'
