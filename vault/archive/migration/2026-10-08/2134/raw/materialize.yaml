decisions:
- case: '738'
  decision: decision-case-738
  origin: raw/2026-10-08/2134/ledger.md#case-738
  targets:
  - kind: update
    category: rules
    slug: rule-prespec
    ref: rule-prespec
  tags: []
  case_text:
    context: '`/pre-spec` judges the `method` of each Estimate item of a plan by `names_a_form` of `guppi/lint.py`,
      so a MOC''s Estimate whose `method` names a test file or `pytest` alone passes the plan and turns
      `make lint` red only at the librarian''s run. Case 733 of session 0213 ratified the stricter check:
      on a MOC as the plan leaves it, a `method` that names neither a `make <target>` nor `by hand` is
      a finding, by one predicate `names_a_moc_form` that `check_method` of lint calls too. Its code turned
      `make test` red at that Retro, in `tests/test_case_schema.py::test_case_schema_the_example_passes_the_check`,
      since the example Case of `vault/wiki/case-example.md` gave the MOC `entity-cart` an Estimate with
      a `pytest` command alone. The code was saved to `vault/raw/2026-10-08/0213/patch-prespec-moc-method-form.diff`
      and reverted; the four code boxes of Case 733 stand unticked in the 0213 Spec, and `estimate-prespec-catches-a-method-without-a-form`
      stands `failed`. Case 735 of session 1547 changed the example, and `vault/wiki/case-example.md`
      now gives that Estimate `make test-cart, which runs uv run pytest tests/test_cart_view.py -k render_time`,
      in the example Case and in the `then` block example; `MAKE_TARGET` of `guppi/lint.py` matches it,
      so the patched check passes the example. The person chose that this Case lands the code already
      ratified, with one decision line, an `update` of `rule-prespec` that adds a History line only, and
      that the four boxes of the 0213 Spec stay as that session left them; this session''s boxes and its
      handoff say where the code landed. `estimate-prespec-catches-a-method-without-a-form` checks the
      change: its Criterion, `purpose` and `method`, set by Case 733, already state the stricter check,
      so they stand and are not signed again; its reading at the Retro of this session runs `tests/test_prespec.py`.
      The `when` and `then` below are that Criterion word for word. `estimate-lint-checks-the-method`
      stands: the patch moves the test of the form out of `check_method` into `names_a_moc_form` and keeps
      each answer of `check_method`, which `tests/test_lint.py` shows. A Grep of `MOC` over `vault/wiki/estimates/`
      with the glob `estimate-prespec-*.md` printed `vault/wiki/estimates/estimate-prespec-catches-a-method-without-a-form.md`
      alone, so no other Estimate of `rule-prespec` speaks of a MOC''s `method`. The Render of `rule-prespec`
      leaves what the check compares to the module docstring of `guppi/prespec.py`, which the patch rewrites,
      so no sentence of the page changes; this Case does not set its `status`. Case 739.1 of this session
      writes the same module docstring: it names the cascade notes under Notes, while the patch rewrites
      the item on the `method` of an Estimate item and the docstring of `check_form`, a function Case
      739.1 does not touch. The two texts say different things and neither makes the other false; the
      patch lands first, and Case 739.1 adds its notes after it. `estimate-case-example-passes-the-check`
      speaks of the check this Case changes: the check gives the example of `vault/wiki/case-example.md`
      no finding and no note, and a change of the check that gives it one fails `tests/test_case_schema.py`.
      It already checks that the example still passes, so its Criterion stands; the box on `tests/test_case_schema.py`
      and the full `make test` of Work Mode run it, and it gets no read line, since this Case neither
      creates it nor sets it `pending`. The hunks of `guppi/prespec.py` in the patch name line numbers
      a few lines off the file today, and the lines around them stand as the patch holds them. The patch''s
      `tests/test_prespec.py` holds one long line in `test_a_moc_is_judged_as_the_plan_leaves_it` that
      `make style` reformats. A Grep of `(ROOT|REPO)\s*/\s*"(vault|\.claude)"` over `tests/` printed `tests/test_case_schema.py`,
      `tests/test_generate.py`, `tests/test_orchestration.py` and `tests/test_schemas.py`. Only `tests/test_case_schema.py`
      runs a live text through the changed code, the example through `guppi/casecheck.py`, which imports
      `guppi/prespec.py`; the other three read `schema.yaml` files or `vault/wiki/orchestration.md` and
      run no Estimate item through `check_form` or `check_method`.'
    problem: The stricter check that Case 733 ratified is not in the code, so pre-spec still passes a
      MOC's Estimate whose `method` names a test file or `pytest` alone, and its Estimate stands `failed`.
    recommend: "- **How does this session carry the code that is already ratified?**\n  - Recommended:\
      \ (a) a Case that lands the code by the patch, `make style` and the full `make test`, with one `update`\
      \ of `rule-prespec` that adds a History line, its `context` naming `estimate-prespec-catches-a-method-without-a-form`\
      \ as the check, the Criterion unchanged, read at Retro.\n  - Answer: agreed, (a).\n- **What happens\
      \ to the four unticked boxes in the earlier Spec?**\n  - Recommended: (a) they stay unticked; this\
      \ session's boxes and its handoff record that the code landed here.\n  - Answer: agreed, (a)."
    given: '`rule-prespec`: the rule of pre-spec; a History line only.

      **＋** `guppi/prespec.py`: `check_form` judges the `method` of each Estimate item of the plan.

      **＋** `guppi/lint.py`: `names_a_form`, and `check_method`, whose test of the form of a MOC''s `method`
      becomes `names_a_moc_form`.

      **＋** `tests/test_prespec.py`: the unit tests of the findings of `check_form`.

      **＋** `tests/test_lint.py`: the unit tests of `check_method`.

      **＋** `tests/test_case_schema.py`: the test of `estimate-case-example-passes-the-check`, which runs
      the check of the Case file over the example of `vault/wiki/case-example.md`.

      **＋** `estimate-prespec-catches-a-method-without-a-form`: the check of the change; its Criterion
      stands.

      **＋** `vault/raw/2026-10-08/2134/cases/case-739.md`: Case 739.1 writes the module docstring of `guppi/prespec.py`
      too, after this patch.'
    when: '`uv run guppi prespec --check <plan> --session <id>` reads the items of the plan''s `then`
      blocks before the Spec is approved.'
    then: 'A `create` of an Estimate, or an `update` carrying `set: {method: …}`, whose `method` names
      none of the forms lint classifies (a `make <target>`, the word `pytest`, a path under `tests/`,
      or the words `by hand`) gives one line `case N: <create|update> <slug>: method names no form`, which
      goes on to name those forms.

      **＋** A `create` of an Estimate with no `method` at all gives the same finding.

      **＋** When the target of the Estimate is a MOC as the plan leaves it — the live page, or a `create`
      or an `update` of the plan that writes `kind: MOC` — a `method` that names neither a `make <target>`
      nor `by hand` gives one line `case N: <create|update> <slug>: method of a MOC''s Estimate names
      no make target and is not a reading`, in place of the line of no form.

      **＋** The predicate is one, lifted out of `guppi/lint.py`; `pre-spec` writes no second one.

      **＋** The form of a MOC''s `method` is one predicate too, in `guppi/lint.py`, which `check_method`
      of `make lint` calls as well.

      **－** Existence is not checked in the plan: the file under `tests/` is written in Work Mode and
      lint checks it later.

      **－** Whether the `Makefile` holds the `make <target>` a MOC''s `method` names is left to lint.

      **－** Whether every counted Estimate of the MOC''s children is a reading, or a sibling Estimate
      names a `make <target>`, is left to lint.

      **－** An `update` of an Estimate that writes no `method` gives no line of the form of a MOC''s `method`.'
  spec: vault/raw/2026-10-08/2134/spec.md
  applied: '22:53:00'
- case: '739.1'
  decision: decision-case-739.1
  origin: raw/2026-10-08/2134/ledger.md#case-739.1
  targets:
  - kind: create
    category: estimates
    slug: estimate-prespec-notes-a-page-the-cascade-archives
    ref: rule-prespec
  tags:
  - session
  - workflow
  - harness
  case_text:
    given: '`estimate-prespec-notes-a-page-the-cascade-archives`: the new check of the note.

      **＋** `rule-prespec`: the rule of pre-spec, the target of the new Estimate; its text does not change.

      **＋** `guppi/prespec.py`: the check `--check` and its module docstring, which gain the note.

      **＋** `guppi/generate.py`: `cascade`, whose rules of the archive move into one function that the
      check imports.

      **＋** `tests/test_prespec.py`: the unit tests of the note.

      **＋** `tests/test_generate.py`: the tests of the cascade, which run green over the moved function.

      **＋** `rule-prespec-hook`: the hook on the exit from Plan Mode, which blocks on a finding and not
      on a note.

      **＋** `vault/raw/2026-10-08/2134/cases/case-738.md`: Case 738 changes `check_form` and the module
      docstring of `guppi/prespec.py` in the same session, and lands first.'
    when: '`uv run guppi prespec --check <plan> --session <id>` reads the `then` blocks of the plan and
      the decision lines of the session''s window.

      **＋** Or `tests/test_prespec.py` runs it over a made-up plan.'
    then: 'For each `update` item of the plan whose page the cascade of `guppi/generate.py` archives once
      the items of the plan apply, the check prints one line that opens with `note:` and names the Case
      of the `update`, the page and the Case whose item sets off the archive.

      **＋** The pages archived are: each lesson standing `clustered` among the `children` of an Insight
      that an `update` of the plan sets `status: actioned`; each Insight standing `open` whose every child
      stands `archived` once the items of the plan apply; and the Decision page of each Case that a `{supersedes:case
      N}` mark on a decision line of the session names.

      **＋** The pages are judged by one function of `guppi/generate.py`, which the cascade of `uv run
      guppi generate` calls too.

      **＋** An `update` and the item that sets off its archive in one Case, or in two sub-cases of one
      Case, give the note too.

      **＋** The note is no finding: it does not change the exit code, and the hook of `rule-prespec-hook`
      does not block the exit from Plan Mode on it.

      **＋** The agent answers the note in one line in the chat, and the person may change a Case or keep
      the `update`.

      **－** A `create`, `delete` or `defer` item of such a page gives no note.

      **－** A rule or an entity that the cascade moves between `built` and `draft` gives no note.'
    context: 'After a session, `uv run guppi generate` applies the items of the Spec and then runs its
      cascade. The cascade archives each `clustered` lesson of an Insight set `actioned`, archives an
      `open` Insight left with no live child, and archives a superseded Decision page. It also moves a
      rule or an entity between `built` and `draft`. No check of a Case looks at that cascade. In session
      1547, Case 736.1 set `insight-workflow-contract-change-leaves-its-derived-text-stale` `actioned`,
      and Case 737 tagged its clustered lesson `lesson-case-build-misses-the-example-a-changed-check-runs-over`.
      The same librarian run applied the tags and then archived the lesson. `generate` printed nothing
      about it, since `cascade` of `guppi/generate.py` tests only the status of the lesson. `ask-guppi`
      found the clash at `/pre-spec`, the person kept the target, and both Cases were ratified a second
      time. `lesson-case-build-misses-the-cascade-of-a-related-case` records it and joined no Insight.
      The person chose a check by script over a new step of `case-guppi`. The rules of the cascade move
      out of `cascade` into one function of `guppi/generate.py` that `cascade` calls, and `/pre-spec`
      and the check of the file of a Case both use it. The check runs at both moments. It covers the three
      steps that archive a page and only an `update` of such a page. It gives a note, not a finding, and
      an `update` and its archive inside one Case give the note too. Case 739.1 is the note of `/pre-spec`,
      and Case 739.2 is the note of the check of the file. Each creates its own Estimate, since the two
      can fail apart and need different fixes. The judgment of which pages, items and Cases give the note
      is signed once, in Case 739.1; the `then` of Case 739.2 points to that Estimate and adds only who
      gets the note in the file and how it is sent, so nothing is signed twice. Q5 named the second Estimate
      `estimate-case-check-notes-a-page-another-case-archives`. After Q7 the archive may come from the
      same Case, so both Estimates end in `the-cascade-archives`. `estimate-generate-cascades` stands:
      the function keeps every answer of `cascade`, and `tests/test_generate.py` shows it. The Render
      of `rule-prespec` leaves what the check compares to the module docstring of `guppi/prespec.py`,
      so no sentence of the page changes, and Case 739.1 changes only that docstring and the code. Case
      738 of this session also changes `guppi/prespec.py`: `check_form`, which this Case does not touch,
      and the module docstring, which this Case changes too. Its patch adds the MOC form to the list of
      the form of an Estimate item, at `@@ -81,7 +81,10 @@` of `vault/raw/2026-10-08/0213/patch-prespec-moc-method-form.diff`,
      and Case 739.1 adds the cascade notes under the Notes paragraph of the same docstring. The patch
      of Case 738 lands first, and Case 739.1 adds its notes after it, on the docstring as that patch
      leaves it. The Purpose of `rule-case-check` lists the notes and the checks that the file of a Case
      gets, so Case 739.2 adds one sentence after the note of case 711.2. No other sentence of that Purpose
      becomes false, since the new note is a judgment of `/pre-spec`, imported. No Criterion of an Estimate
      of `rule-case-check` or `rule-prespec` speaks against a new note. The new Estimate of `rule-case-check`
      sets that page from `built` to `draft` until it is read. A Grep of `(ROOT|REPO)\s*/\s*"(vault|\.claude)"`
      over `tests/` printed `tests/test_case_schema.py`, `tests/test_generate.py`, `tests/test_orchestration.py`
      and `tests/test_schemas.py`. Only `tests/test_case_schema.py` runs a live text through the changed
      code: the example of `vault/wiki/case-example.md` goes through `check_answer` of `guppi/casecheck.py`,
      and the test fails on any note. The example sets no status of an Insight and carries no `{supersedes:case
      N}` mark, and the test runs over a temporary project with no lesson or Insight page, so it gives
      no new note. `estimate-case-example-passes-the-check` already checks this: its Criterion says that
      the check gives the example no finding and no note, and that a change of the check that gives one
      fails the test. Its Criterion stands, since this Case keeps that promise, so it is not set `pending`
      and gets no `read` line; the task line of `tests/test_case_schema.py` under Case 739.2 runs its
      test. The other three read `schema.yaml` files or `vault/wiki/orchestration.md`. The lesson line
      of `lesson-case-build-misses-the-cascade-of-a-related-case` stands in the ledger of session 1547,
      so no decision line here carries an `{addresses:...}` mark, and the lesson stays `new`. The backlog
      item `insight-ledger-ratified-line-never-withdrawn` is about the number of a Case built again, not
      about the cascade, and stays out.'
  parent: decision-case-739
