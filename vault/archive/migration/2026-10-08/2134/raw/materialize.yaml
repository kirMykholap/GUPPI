  sections:
    Criterion: 'When:

      The agent calls `/work` on `PreToolUse Skill` after the person picked it at the fork of `ExitPlanMode`,
      or the person types `/work` on `UserPromptSubmit`, and the run goes from the tasks of `raw/<date>/<hi
      HHMM>/spec.md` to the librarian''s report.

      **＋** Or the agent calls `/box` on `PreToolUse Skill`, and the run goes from its first step to the
      librarian''s report.


      Then:

      The context of `/work` holds the text of `vault/wiki/where-to-stop.md`, rendered from `rule-where-to-stop`.

      **＋** The context of `/box`, from `.claude/skills/box/SKILL.md`, holds the same text.

      **＋** The agent ends a reply with a question to the person on a fork that changes a contract, on
      a hook refusal whose text gives no step it can follow or says that it is a stop, and before an action
      that git in the repository cannot undo.

      **＋** Before a task of `raw/<date>/<hi HHMM>/spec.md` whose text opens with `stop:`, the agent stops
      and asks; the task runs after the person''s word.

      **＋** On the branch `main` the agent stops and says so: Work Mode does not start there.

      **＋** In a run of `/box`, the agent stops and asks when `uv run guppi box --check` prints a line,
      or when a `git merge --ff-only` of `/box` refuses.

      **＋** When the full `make test` run of `/work` after its last task finds a failing test that `##
      Baseline` of `raw/<date>/<hi HHMM>/work.md` does not hold, and its fix needs a choice that no ratified
      Case makes, the agent ends a reply with a question to the person that names the test and its failure.

      **＋** When the auto mode classifier of Claude Code refuses a tool call that the run needs, the agent
      ends a reply with a question to the person that gives the shell command doing what the refused call
      would do, for the person to type after `!` in the prompt.

      **＋** A reply that stops from the call of `/retro` until `raw/<date>/<hi HHMM>/handoff.md` stands
      opens with `STOP:`.

      **＋** After the person''s answer the run goes on from where it stopped.

      **＋** After the person has run the command that a refusal of the auto mode classifier gave, the
      run goes on from where it stopped.

      **＋** `vault/wiki/case-schema.md` names a task line that opens with `stop:` as a task that waits
      for the person''s word.

      **－** No other point stops the run: any other red test, at `/retro` too, a reading that only the
      person can take, an observation or a doubt ends as a lesson or a line of `raw/<date>/<hi HHMM>/handoff.md`.'
  change: the Criterion replaced whole — a refusal of the auto mode classifier is a stop, and the person
    runs the command after ! (case 741)
  applied: '22:53:00'
