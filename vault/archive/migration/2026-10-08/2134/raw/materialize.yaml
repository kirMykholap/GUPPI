  sections:
    Criterion: 'When:

      `SubagentStop` fires when `case-guppi` writes a file of Cases, and `uv run guppi casecheck --subagent`
      reads the Cases of the file, the plan file of the session, `<plan>.checked.json` beside it and the
      session''s `raw/<date>/<hi HHMM>/ledger.md`.

      **＋** Or `tests/test_casecheck.py` runs it over a made-up file, plan file, store and ledger.


      Then:

      The hook judges the Cases of the file with the other Cases of the session, as `other_blocks` of
      `guppi/casecheck.py` gives them, by the function of `guppi/prespec.py` that prints the cascade notes
      of pre-spec, imported, not copied.

      **＋** Which pages, items and Cases give a note is what `estimate-prespec-notes-a-page-the-cascade-archives`
      sets for that function; this check adds only who gets the note and how.

      **＋** The note goes to `case-guppi` under the Case of the file it names, and asks it to drop the
      change or to give the reason in `context`.

      **＋** The note is sent back once by exit 2 beside any findings, stored under `notes` in `<plan>.checked.json`,
      and not sent again for the same Case id.

      **－** The note is no finding: the Case is stored with no finding for it, and the `Stop` check of
      `guppi casecheck` refuses no showing for it.

      **－** Two other Cases of the session give the file no note.'
  status: passed
