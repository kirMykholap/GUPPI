    purpose: Whether the check of the file of a Case sends case-guppi a note once for an update of a page
      that the cascade of generate archives after an item of the file or of another Case of the session,
      by the judgment pre-spec prints
    method: uv run pytest tests/test_casecheck.py -k cascade
