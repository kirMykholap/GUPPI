- case: '740'
  decision: decision-case-740
  origin: raw/2026-10-08/2134/ledger.md#case-740
  targets:
  - kind: update
    category: insights
    slug: insight-case-check-a-case-id-leaves-only-by-a-supersedes-line
    ref: insight-case-check-a-case-id-leaves-only-by-a-supersedes-line
  tags: []
  case_text:
    context: '`insight-case-check-a-case-id-leaves-only-by-a-supersedes-line` gathers three lessons with
      one cause: a check kept a Case id in view until a `{supersedes:case N}` mark of the ledger named
      it. In `lesson-prespec-parent-of-superseded-sub-cases`, a parent with no ledger lines of its own
      stayed a finding after each of its sub-cases was superseded. In `lesson-case-check-store-keeps-sub-cases-a-rebuild-dropped`,
      the store of the check of a case file kept sub-cases that a rebuild had dropped. In `lesson-case-check-refuses-a-rebuild-under-a-new-number`,
      a build under a new number was refused while the build it replaced stood in the plan. Each failure
      is fixed in the code today. The module docstring of `guppi/prespec.py` says that the plan is compared
      with no other file, since the ratified copy is gone (case 445.2). `other_blocks` of `guppi/casecheck.py`
      leaves out a stored Case that the file of its top-level Case no longer holds, by `left_by_its_file`
      (case 722.1), and a Case that a mark on a decision line of the answer''s own file names, by `ratification_records`
      (case 725.2). `remove_superseded` of `guppi/ratified.py` removes a parent from the plan once marks
      retire each of its sub-cases, by `retired_whole` of `guppi/prespec.py` (case 722.2). Three Estimates
      check these fixes and all three stand `passed`: `estimate-case-check-sends-back-a-clash-with-another-case`,
      `estimate-case-check-leaves-out-a-case-the-file-supersedes` and `estimate-spec-write-removes-a-superseded-case`.
      Their Criteria stand, since this Case changes no code. The person chose to set the Insight `actioned`
      with `addressed_by` naming `decision-case-725.2`, the latest decision that fixed the pattern, as
      `rule-insights-schema` asks. That Decision page already exists, so the field takes the quoted wikilink.
      `estimate-insights-schema-checked` checks that an `actioned` Insight carries one `addressed_by`,
      and its Criterion stands. When the Insight is `actioned`, the cascade of `uv run guppi generate`
      archives its three `clustered` lessons. Case 739 of this session notes an `update` of a page that
      this cascade archives; this Case updates none of the three lessons. A Grep of `insight-case-check-a-case-id-leaves-only-by-a-supersedes-line`
      over `vault/wiki/` printed `vault/wiki/backlog.md`, `vault/wiki/log.md` and the three lessons; over
      `guppi/` it printed nothing. `backlog.md` is written again by `uv run guppi backlog`, which drops
      an Insight that is not `open`. The `insight` field of each lesson still names the Insight correctly,
      and the cascade archives the lessons. `log.md` is not read.'
    problem: The Insight stands `open` in the backlog, though the code now fixes each failure it records,
      and the Estimates of those fixes have passed.
    recommend: "- **What happens to the Insight**\n  - Recommended: (a) close it and name the last earlier\
      \ fix: set it `actioned` with `addressed_by` naming `decision-case-725.2`, and change no code.\n\
      \  - Answer: agreed, (a)."
    given: '`insight-case-check-a-case-id-leaves-only-by-a-supersedes-line`: the Insight that is set `actioned`.

      **＋** `rule-insights-schema`: the rule that sets `addressed_by` of an `actioned` Insight to the
      latest decision that fixed it.

      **＋** `lesson-prespec-parent-of-superseded-sub-cases`: a `clustered` child of the Insight.

      **＋** `lesson-case-check-store-keeps-sub-cases-a-rebuild-dropped`: a `clustered` child of the Insight.

      **＋** `lesson-case-check-refuses-a-rebuild-under-a-new-number`: a `clustered` child of the Insight.

      **＋** `decision-case-725.2`: the Decision page of the latest fix of the pattern, which `addressed_by`
      names.

      **＋** `vault/wiki/backlog.md`: the list of open items, written by `uv run guppi backlog`.'
    when: The librarian runs `uv run guppi generate` over the Spec of the session, then `uv run guppi
      backlog`.
    then: '`insight-case-check-a-case-id-leaves-only-by-a-supersedes-line` stands `actioned`, and its
      `addressed_by` names `decision-case-725.2`.

      **＋** The cascade of `uv run guppi generate` archives `lesson-prespec-parent-of-superseded-sub-cases`,
      `lesson-case-check-store-keeps-sub-cases-a-rebuild-dropped` and `lesson-case-check-refuses-a-rebuild-under-a-new-number`.

      **＋** `vault/wiki/backlog.md` no longer lists the Insight.

      **－** The `## Pattern` and `## Proposal` of the Insight do not change.'
  spec: vault/raw/2026-10-08/2134/spec.md
  applied: '22:53:00'
- case: '741'
  decision: decision-case-741
  origin: raw/2026-10-08/2134/ledger.md#case-741
  targets:
  - kind: update
    category: rules
    slug: rule-where-to-stop
    ref: rule-where-to-stop
  - kind: update
    category: estimates
    slug: estimate-where-to-stop-stops-only-on-its-conditions
    ref: rule-where-to-stop
  - kind: update
    category: insights
    slug: insight-permissions-classifier-weighs-the-rules-not-the-persons-word
    ref: insight-permissions-classifier-weighs-the-rules-not-the-persons-word
  tags: []
  case_text:
    context: 'In auto mode Claude Code runs a classifier before each tool call of the agent. The classifier
      judges the call against the permission rules of the settings, not against the person''s word in
      the chat. `insight-permissions-classifier-weighs-the-rules-not-the-persons-word` clusters two lessons.
      In `lesson-permissions-auto-mode-refuses-a-remote-change-despite-the-chat` the classifier refused
      `git remote remove origin` twice, the second time after the person allowed it in the chat, and the
      person ran it by hand with `!` in the prompt. In `lesson-permissions-auto-mode-refuses-editing-the-case-check-store`
      the classifier refused the script that was to clear two stale entries from the store of the Case-file
      check, and the entries stand. `vault/wiki/where-to-stop.md` lists no such refusal among its stops,
      and its closing paragraph says that nothing else is a stop, so a refused task stays undone and ends
      as a lesson. The person chose a new eighth condition: the run stops on the refusal, gives the person
      the command to type after `!`, and goes on after the person has run it. The Proposal of the Insight
      suggested instead that each Case name in advance who runs such a task. The person did not take that,
      since nobody can know in advance which calls the classifier refuses. The Proposal section stays
      as the record of the suggestion, and History records the decision. The Insight goes to `actioned`
      with `addressed_by: decision-case-741`, as `rule-insights-schema` sets for a decision of the same
      session.


      The Criterion of `estimate-where-to-stop-stops-only-on-its-conditions` lists each stop, so it is
      replaced whole with one new line. Its `purpose` speaks of each condition of the file and of no other,
      and its `method` reads the text of the file or the new Render in the Spec, so both stand. `rule-permissions`
      stands: the new stop adds no permission rule, and its allow list keeps to the session''s own files.
      The closing paragraph of the Render stays true, since the list it closes gains the new condition.
      A Grep of `classifier` over `vault/wiki/` and `.claude/` printed `backlog.md`, `log.md`, `rules/rule-skill-hi.md`,
      `rules/rule-permissions.md`, the two lessons, the Insight and `insights/insight-hi-skill-substitution-checked-by-a-model-call.md`.
      `rule-skill-hi` names the classifier at the `!` substitutions of `/hi`, which come before the run,
      and `rule-permissions` names it for the calls of `case-guppi`. Neither sets what the run does after
      a refusal, so both stand. `log.md` and `backlog.md` are not read. A Grep of `where-to-stop` over
      `.claude/`, `guppi/`, `tests/` and `vault/wiki/` printed 29 files. Those that load the file or point
      to its conditions stand. `rules/rule-spec-box.md` and `.claude/skills/box/SKILL.md` name condition
      6 by its number, and the new condition comes after it.'
    problem: When the auto mode classifier refuses an action that a ratified task needs, the run goes
      on without it. The task stays undone, even when the person asked for it, and only the person can
      run it.
    recommend: "- **What to do with this Insight**\n  - Recommended: (a) a new stop condition in `where-to-stop.md`:\
      \ the run stops on a refusal of the classifier, gives the person the command to type after `!`,\
      \ and goes on after the person has run it; the Insight is set `actioned`, and the Criterion of `estimate-where-to-stop-stops-only-on-its-conditions`\
      \ is replaced.\n  - Answer: agreed, (a)."
    given: '`rule-where-to-stop`: the rule whose Render is the list of stops.

      **＋** `vault/wiki/where-to-stop.md`: the file rendered from `rule-where-to-stop`, loaded by `/work`,
      `/box` and `/hi`.

      **＋** `.claude/skills/work/SKILL.md`: the skill `/work`, which loads the list of stops.

      **＋** `.claude/skills/box/SKILL.md`: the skill `/box`, which loads the same list.

      **＋** `estimate-where-to-stop-stops-only-on-its-conditions`: the check of the stops; its Criterion
      is replaced whole.

      **＋** `insight-permissions-classifier-weighs-the-rules-not-the-persons-word`: the Insight this Case
      actions.

      **＋** `rule-insights-schema`: the rule that sets `addressed_by` of an `actioned` Insight.

      **＋** `rule-permissions`: the permission rules of the settings; it stands.

      **＋** `raw/<date>/<hi HHMM>/spec.md`: the Spec whose tasks the run carries out.'
    when: 'The agent calls `/work` on `PreToolUse Skill` after the person picked it at the fork of `ExitPlanMode`,
