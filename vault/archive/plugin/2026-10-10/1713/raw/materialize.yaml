  case_text:
    context: 'A sprint is one page, `entity-sprint-<id>`, a Leaf under `entity-sprint`. Its `estimates`
      are its Definition of done and its `## Milestones` are the work in order. `guppi sprint` renders
      `vault/wiki/sprint.md` from it. Since the close of `migration` no live sprint page stands, and `vault/wiki/sprint.md`
      reads that no sprint is open. The ledger hook refuses each decision line but a `defer` until a `create`
      of an `entity-sprint-` page stands, so this opening Case, run under `/sprint-open` (`rule-skill-sprint-open`),
      is the first Case the session ratifies. The person set the id `plugin` and a goal of five lines
      of work: the opening and the close of a sprint fixed, a final README, the repository on GitHub ready
      for pull requests from others, CI that writes a clean version of the project to a branch of its
      own, and that clean version made into a Claude Code plugin. Each line becomes one condition of the
      Definition of done, one Estimate each, in Case 756.2 to Case 756.6; Case 756.1 creates the page.
      `vault/wiki/backlog.md` holds 3 items, and the person took none of them. A Glob `vault/**/*plugin*`
      printed only `vault/.obsidian/core-plugins.json`, so the new slugs are free. Case 756.1 adds no
      Estimate: `estimate-sprint-renders-the-backlog` already checks the render of a live sprint page,
      and the pending `estimate-sprint-close-next-session-opens-the-sprint` checks that the pages written
      from this session''s ledger carry the new sprint id; their Criteria speak of any sprint page and
      stand. `estimate-skill-sprint-open-asks-the-opening-questions` checks the questions of the opening,
      which this Case asked, and stands. `case-schema.md` says that a `method` holds only what runs in
      the Case''s own session. The methods of Case 756.2 to Case 756.6 are read in a later session of
      the sprint, before its close, since `rule-sprint` and `entity-sprint` set that the Estimates of
      a sprint page are read before its close. Neither page states an exception to case 670.4; the exception
      for a sprint page stands on their words that its Estimates are read before its close, and on the
      precedent of `entity-sprint-migration`, whose Estimate `estimate-sprint-migration-merges` was read
      in Work Mode of session 1555, the session that closed it. The read lines of these Estimates stay
      open at the Retro of this session and are carried until their moment. The sprint-turn condition
      is read at the end of Work Mode of the closing session, since the move to the archive runs later,
      in the librarian''s run (Q7). No separate reading of that run comes at the close of `plugin`: `estimate-sprint-close-runs-in-the-librarian-run`
      was read `passed` at the `/hi` of this session over the close of `migration`, line 1 of this session''s
      ledger, and the move of the sprint page and its Estimates is held by the tests of `estimate-sprint-close-archives-the-sprint-page-and-keeps-the-rest`.
      Case 756.2 signs only what is new, no step done or fixed by hand; the steps of the skill stand in
      the Criteria of `estimate-skill-sprint-close-leads-the-closing-session` and `estimate-sprint-close-takes-the-readings-in-groups`,
      which are not signed again. `README.md` exists at the root of the repository with the heading `#
      Vault harness`; a Grep for `README` over `vault/wiki/`, `log.md` left out, printed nothing, so no
      page governs it yet. The person added that the form of the sprint opening may be discussed later,
      and asked no change for it now.'
    problem: No sprint is open, and the session can ratify no other Case until a sprint page stands. The
      next sprint needs its id, its goal, its Definition of done, its milestones and an answer on the
      backlog.
    recommend: "- **What is the goal of the sprint?**\n  - Recommended: (a) your own goal; failing one,\
