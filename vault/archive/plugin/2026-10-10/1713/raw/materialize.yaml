  targets:
  - kind: update
    category: rules
    slug: rule-brief
    ref: rule-brief
  - kind: update
    category: estimates
    slug: estimate-brief-written
    ref: rule-brief
  tags: []
  case_text:
    context: 'At the end of its run the librarian rewrites `vault/wiki/brief.md`. Its section Next session
      sorts the open items into three lists, and `Cases` is what needs a decision. The Render of `rule-brief`
      puts "a contradiction" there, and the Criterion of `estimate-brief-written` says the same. At the
      /hi of this session the reading of that Estimate failed: the brief of the run ab8be60f holds under
      Flags the contradiction that the handoff of session 1555 gave under Observations — the `－` line
      of `estimate-sprint-migration-merges` puts the merge on a `## Backlog` line of `entity-sprint-migration`
      that the page does not hold — and no line of `Cases` holds it. Both pages stand under `vault/archive/migration/2026-10-10/1555/`.
      The other contradiction of those Flags, on `estimate-sprint-close-settles-unread-estimates`, reached
      `Cases` through a line of `## For the next session` of the handoff. The Render does not say that
      each contradiction of Flags is meant, or what a contradiction between archived pages is, so the
      librarian could leave one out by a judgment the Render forbids elsewhere. The contradiction itself
      needs no work: the merge it speaks of is the work of Case 757. The person chose that the Render
      say it outright, the Criterion kept at first. The person first chose to read the Estimate at the
      /hi after each run of the librarian; the check of this file refused that `method`, since a `method`
      holds only what runs in its own session, and the person then kept the `method` as it stands, a reading
      at the /hi after the librarian''s run of the session that closes a sprint. The Criterion of `estimate-brief-written`
      held the same words as the Render, "a `failed` Estimate, a contradiction, a defect the librarian
      found", so it did not state the two new promises; at `/pre-spec` the person chose to replace it
      whole. The new Criterion is the old one with the `Cases` line naming each contradiction of Flags,
      archived pages too, and one `－` line for a contradiction that `## For the next session` already
      carries; the rest stands word for word. The page goes `pending`. The person first kept its `method`,
      a reading at the /hi after the close of a sprint; the check of this file refused a `pending` page
      whose `method` waits for another session, and the person chose a reading of the rendered `.claude/agents/librarian-guppi.md`
      at the Retro of this session. That reading cannot run then: the `update` of `rule-brief` reaches
      the page at `guppi generate` and `guppi render` writes the frame after `guppi cleanup`, both in
      the librarian''s run (steps 2 to 4 of `.claude/agents/librarian-guppi.md`), and `render` ticks the
      render line of this Case there (`orchestration.md`). The person then chose their own answer, on
      the brief the librarian writes, at the /hi after the close of `plugin`; `lint.waits_for_another_session`,
      the predicate the check of this file calls, leaves to another session a part of a `method` that
      names the person. The page has no `purpose` field that states the old promise. In `rule-brief`,
      read whole, the sentences that state what goes into `Cases` are the `Cases` sentence of the Render,
      which the pair changes; "Write facts and flags only. Add no decision and no judgment of the work."
      and the Purpose''s "nothing in the brief is a decision", which the change follows and which stand;
      and the paragraph of the skill `carry`, whose `Cases` is always the line "none", which stands, since
      the new sentence is in the librarian''s list alone. The Criterion of `estimate-brief-carries-the-run-facts`
      speaks of Readings due, not of `Cases`, and stands. A Grep `Next session` over `vault/wiki/rules/`
      printed `rule-documentation.md`, `rule-skill-hi.md`, `rule-brief.md` and `rule-carry-over.md`, and
      over `.claude/` printed `.claude/skills/hi/SKILL.md`, `.claude/agents/librarian-guppi.md` and `.claude/skills/carry/SKILL.md`;
      `rule-skill-hi` and `.claude/skills/hi/SKILL.md` take the lines of `Cases` into the Frontier and
      read any line, `rule-documentation` names the reads the brief needs, and the carry pages set the
      short shape, so none of them sets the form of a contradiction line and all stand. A Grep `librarian-guppi|rule-brief|estimate-brief`
      over `tests/` printed one line, in `tests/test_grepguard.py`, which names the agent and reads no
      live file of it, so no test reads the new text.'
    problem: The brief left a contradiction of its Flags out of `Cases`, though the brief rule puts a
      contradiction there, because the rule does not say that each contradiction is meant, archived pages
      too.
    recommend: "- **What should change after the brief missed the contradiction?**\n  - Recommended: (a)\
      \ the rule says it outright: each contradiction of Flags also gets a line in `Cases`, one between\
      \ archived pages too, and one that a line of the handoff's For the next session already carries\
      \ stands once; the check keeps its wording and stays failed until its next reading.\n  - Answer:\
      \ agreed, (a).\n- **When should the check be read next?**\n  - Recommended: (a) keep the current\
      \ timing, since the check of the Case file refuses a method that waits for another session: the\
      \ check stays failed and is read next at the start of the session after the close of `plugin`.\n\
      \  - Answer: agreed, (a).\n- **What method should the check use once its wording is replaced?**\n\
      \  - Recommended: (a) read the rule text at the end of this session: the rendered librarian instructions\
      \ read by hand against the new wording.\n  - Answer: agreed, (a).\n- **How can the check be read\
      \ when the new rule text reaches the instructions only after this session?**\n  - Recommended: (c)\
      \ your own answer on the brief at the start of the session after the close of `plugin`.\n  - Answer:\
      \ agreed, (c).\n- **Change**\n  - Asked: at `/pre-spec`, replace the Criterion of `estimate-brief-written`\
      \ so that it holds both new promises, the page set `pending`, its method and moment unchanged.\n\
      \  - Taken: the Case adds an `update` of `estimate-brief-written` with its Criterion replaced whole,\
      \ and a reading of it; its method changes as the answer on the method of the check sets it."
    given: '`rule-brief`: the rule of the brief, whose Render sets the lists of Next session.

      **＋** `.claude/agents/librarian-guppi.md`: the librarian''s frame, which holds that Render.

      **＋** `estimate-brief-written`: the check of the brief, whose Criterion is replaced whole.

      **＋** `vault/wiki/brief.md`: the brief the librarian writes.

      **＋** `raw/<date>/<hi HHMM>/handoff.md`: the handoff the brief reads.

      **＋** `vault/archive/`: the folder of the pages a sprint close moves.'
    when: The librarian rewrites `vault/wiki/brief.md` at the end of its run, and its Flags hold a contradiction.
    then: '`Cases` of Next session holds a line for each contradiction of Flags, with what and from where.

      **＋** A contradiction between pages that stand in `vault/archive/` gets its line too.

      **－** A contradiction that a line of `## For the next session` of `raw/<date>/<hi HHMM>/handoff.md`
      already carries gets no second line in `Cases`.'
