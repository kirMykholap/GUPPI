      \ of `migration` in this session, the person's choice (a), since no Render sets the steps for later\
      \ openings; and `estimate-where-to-stop-stops-only-on-its-conditions` and `estimate-work-mode-runs-the-spec-on-a-branch-from-a-baseline`\
