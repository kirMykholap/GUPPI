  sections:
    Purpose: 'GUPPI ships as a Claude Code plugin: a clean version built by CI on a branch of its own,
      on GitHub with a README and ready for pull requests from others, and the opening and close of a
      sprint work with no fix by hand. Done when every Estimate of this page passes: the close steps run
      from the close line, the README describes the project, a pull request from another account is checked
      and reviewed on GitHub, CI writes the clean branch, and the clean branch installs as a plugin. Each
      Estimate of this page is read before the close of the sprint; one that has not passed by then goes
      to the archive with this page, its status kept in the record of the close (rule-sprint-close).'
    Milestones: '### The sprint turn and GitHub


      - the opening and the close of a sprint run with no fix by hand and each flaw found in them is fixed

      - the repository on GitHub set up so that a pull request from another person is easy to review


      ### The clean branch


      - CI that writes a clean version of the project to a branch of its own with no case references in
      its texts and no session data such as the Frontier or the sprint


      ### The plugin


      - the clean version made into a Claude Code plugin

      - the README on what the project is and what it is for and on its main parts and its use

      - the close of `plugin` — `/sprint-close`, a session of its own'
