      and `vault/archive/migration/2026-10-10/1555/estimates/estimate-sprint-migration-merges.md`, so
      the new slug is free.'
    problem: The work of `migration` is not on `main`, and the session must merge it without leaving Work
      Mode on `main`. No check says when this merge is done.
    recommend: "- **How should `main` take the work of `migration`?**\n  - Recommended: (a) fast-forward\
      \ only, a refusal a stop for the person's word.\n  - Answer: agreed, (a).\n- **Which branch does\
      \ the work go on after the merge?**\n  - Recommended: (a) a new branch `plugin` made from `main`,\
      \ and `migration` deleted by `git branch -d`.\n  - Answer: agreed, (a).\n- **What checks that the\
      \ merge is done?**\n  - Recommended: (a) a new Estimate under `rule-skill-sprint-close`, read by\
      \ hand in this session and at each later opening after a sprint with a branch of its own.\n  - Answer:\
      \ agreed, (a).\n- **What happens to the unticked merge line in the old Spec?**\n  - Recommended:\
