      is pushed. Work Mode stops on `main` (`.claude/skills/work/SKILL.md`), so the session cannot merge
      there and stay there. This Case replaces Case 757. The findings of `/pre-spec` showed that the Estimate
      of Case 757 promised the merge at every opening after a sprint with a branch of its own, while no
      Render of `rule-skill-sprint-close` or `rule-skill-sprint-open` sets those steps. The person chose
      to narrow the Estimate to this merge alone, so it takes a new slug and this Case a new number. Steps
      of the sprint turn that merge a branch at each opening stay work of the first milestone of `entity-sprint-plugin`.
      That also covers the sentence of step 4 that says the brief gives the merge line under `Work`, while
      the brief gave it under `Cases`. A refusal of `git merge --ff-only` or of `git branch -d` here is
      the first condition of `vault/wiki/where-to-stop.md`. It is a fork that changes a contract: the
      merge as ratified cannot run, and the next step needs a choice that no ratified Case makes. The
      run goes on after the person''s answer, as the closing paragraph of that file sets it. So `estimate-where-to-stop-stops-only-on-its-conditions`
      stands: its Criterion already stops on such a fork, and this Case adds no other stop. `estimate-work-mode-runs-the-spec-on-a-branch-from-a-baseline`
      stands too. Work Mode starts on `migration` and writes its Baseline there before the first change.
      The task leaves `main` as soon as the fast-forward is done. After it `main`, `migration` and `plugin`
      are one commit, so the Baseline describes the same tree. The extra `make test` is a task of the
      Spec, and the full run after the last task still runs. The reading of the new Estimate is taken
      at the Retro of this session, as `/work` leaves the reading of an Estimate that its session creates,
      from what Work Mode printed. A Grep for `merge` over `.claude/` printed four files: `.claude/skills/box/SKILL.md`,
      `.claude/skills/sprint-close/SKILL.md`, `.claude/skills/handoff/SKILL.md` and `.claude/agents/librarian-guppi.md`;
