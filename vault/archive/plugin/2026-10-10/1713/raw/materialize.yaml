  case_text:
    context: 'At the close of a sprint, `uv run guppi sprint-close` lists each Estimate that stands `pending`
      or `failed`, and the close refuses to move a page until each listed Estimate is settled. `guppi/sprint_close.py`
      settles a `failed` Estimate without a name only when the sprint page lists it. For any other listed
      Estimate, `failed` or `pending`, it wants a name by `--carry` or `--archive-unread`. The function
      `settled` holds this rule, and `tests/test_sprint_close.py` pins it: an unnamed `failed` Estimate
      outside the sprint page is refused. The Criterion of `estimate-sprint-close-settles-unread-estimates`,
      which stands `passed`, promises otherwise: such an Estimate, read now with a `failed` result, counts
      as settled and is carried with no name. The code cannot keep that promise as written, because a
      page that failed in the closing session looks the same as one that has stood `failed` since an earlier
      sprint. The handoff of session 1555 reported the disagreement under Observations. The person chose
      to make the check follow the code, so no code and no test changes.


      This Case replaces Case 759, which changed only that Estimate. Pre-spec found two faults in it.
      First, the `－` line of `estimate-sprint-close-takes-the-readings-in-groups` allows the close line
      to name only an Estimate still unread after Work Mode. Under the new rule, the close line must also
      name an Estimate read `failed` in Work Mode that the sprint page does not list. Second, the preview
      over the live vault in the `method` of the first Estimate cannot run in this session. `Close.__init__`
      of `guppi/sprint_close.py` stops with no live `entity-sprint-<id>` page, a Glob of `vault/wiki/entities/entity-sprint-*.md`
      printed no file, and `entity-sprint-migration` stands only under `vault/archive/migration/2026-10-10/1555/`.
      So Case 763.1 replaces the Criterion of `estimate-sprint-close-settles-unread-estimates` and sets
      its `purpose` and its `method`. The `method` becomes the `pytest -k settle` run alone. The `When`
      keeps its line on the preview over the live vault for a later reading. The new Criterion keeps each
      old line but two. It leaves out on purpose the line that a `failed` reading counts as settled, and
      puts in its place one line for an Estimate of the sprint page and one for any other Estimate. It
      keeps the rule that no page moves before the person has chosen for each listed Estimate. Case 763.2
      replaces the Criterion of `estimate-sprint-close-takes-the-readings-in-groups` and sets its `purpose`,
      which states the old promise in its last clause. By the person''s answer it sets the `method` to
      a reading, in this session, of the closing Case and the ledger of the last session that closed a
      sprint, `vault/raw/2026-10-10/1555/`. That close named five Estimates by `--carry` and none stood
      `failed`, so the reading passes without testing the new case; the close of `plugin` is its first
      real test. The new Criterion leaves out on purpose the old `－` line and keeps the other lines. The
      `then` of the two sub-cases shares words, but the promises differ and can fail apart. Case 763.1
      checks what the command `uv run guppi sprint-close` settles. Case 763.2 checks what the closing
      session writes into its closing Case and its close line.


      Step 4 of the Render of `rule-skill-sprint-close` has the closing Case name by `--carry` or `--archive-unread`
      each Estimate still unread after Work Mode. A closing Case built from that step would leave out
      an Estimate read `failed` in Work Mode outside the sprint page, and the close would refuse. So Case
      763.2 adds that Estimate to the step by a `replace` pair and renders `.claude/skills/sprint-close/SKILL.md`.
      No other Estimate of that rule reads the live file. A Grep for `still unread` over `vault/wiki/`,
      `.claude/` and `guppi/` printed `.claude/skills/sprint-close/SKILL.md`, `vault/wiki/rules/rule-skill-sprint-close.md`,
      `vault/wiki/estimates/estimate-skill-sprint-close-leads-the-closing-session.md` and `vault/wiki/estimates/estimate-sprint-close-takes-the-readings-in-groups.md`.
      The Criterion of `estimate-skill-sprint-close-leads-the-closing-session` stands. It asks for the
      person''s choice for each Estimate still unread and does not say that only those are named, so naming
      one more stays true under it. No test reads `.claude/skills/sprint-close/SKILL.md` or either Estimate
      page live. A Grep for `skills.{0,10}sprint-close|still unread` over `tests/` printed nothing. A
      Grep for either Estimate slug over `vault/wiki/`, `guppi/`, `tests/` and `.claude/` printed `vault/wiki/brief.md`,
      `vault/wiki/log.md` and `vault/wiki/rules/rule-sprint-close.md`. The rule page only lists them in
      `estimates` and stands. The docstring of `guppi/sprint_close.py` already states the code''s rule
      and stands. Case 757 creates an Estimate under `rule-skill-sprint-close` and does not change its
      Render. Case 756 creates `estimate-sprint-plugin-close-steps-run-from-the-line` on the flow of the
      closing session as a whole and does not cover this settling.'
    problem: The Criterion of `estimate-sprint-close-settles-unread-estimates` promises that a `failed`
      reading of an Estimate outside the sprint page settles that Estimate with no name. `guppi/sprint_close.py`
      and its tests require a name by `--carry` or `--archive-unread` for it. A signed check that the
      code does not keep stands `passed`, and the check of the closing session and its skill would leave
      such an Estimate unnamed.
    recommend: "- **Which side follows the other**\n  - Recommended: (a) the check follows the code. The\
      \ Criterion is replaced so that a `failed` Estimate outside the sprint page must still be named\
      \ by `--carry` or `--archive-unread`, its `purpose` is reworded, and no code changes.\n  - Answer:\
      \ agreed, (a).\n- **How the check of the grouped readings is read in this session**\n  - Recommended:\
      \ (a) read the last close now. The line is fixed so that the close line names an Estimate still\
      \ unread after Work Mode, or one read `failed` in Work Mode that the sprint page does not list,\
      \ and the method becomes a reading by hand, in this session, of the closing plan and ledger of the\
      \ last session that closed a sprint.\n  - Answer: agreed, (a)."
