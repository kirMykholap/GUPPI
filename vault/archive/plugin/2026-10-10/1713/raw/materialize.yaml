  sections:
    Criterion: 'When:

      The librarian rewrites `vault/wiki/brief.md` at the end of its run.


      Then:

      The brief holds, in order: Where things stand, Readings due, Flags, Next session, Readings at the
      close.

      **＋** It holds no Deferred list and no cap on deferred items. They stand in `vault/wiki/backlog.md`.

      **＋** Where things stand, Readings due and Readings at the close are as before.

      **＋** Readings due takes from each Estimate page its `status`, `target` and `method`, and from the
      target rule its `status`.

      **＋** Flags keep their kinds of lines — marked entries, failed Estimates, MOC candidates, stale
      defers, contradictions, the lint output — and add one kind: a read that the librarian''s frame says
      its job does not need, with what was read, the part of the job it served, and the handoff when the
      handoff asked for it.

      **＋** Next session holds `Cases`, `Work` and `Ask the person`. `Cases` is what needs a decision:
      after a run whose `guppi sprint-close --apply` moved the sprint page, first the line `open the next
      sprint — no sprint is open since the close of <id>`; a line of `## For the next session` of `handoff.md`,
      a handoff flag with a question or a request to change the sprint, a `failed` Estimate, each contradiction
      of Flags, one between pages that stand in `vault/archive/` too, a defect the librarian found; one
      line per item, with what and from where. `Work` is what is done without a decision: every `pending`
      reading of Readings due by its slug but one that `Ask the person` holds, the unticked boxes of the
      Specs, a ledger line this run did not apply, a dirty tree; one line per item.

      **＋** `Ask the person` holds each line of `## Ask the person` of `handoff.md`: the Estimate by slug,
      the mark `needs the person` and its question, as the handoff wrote them.

      **＋** An item stands in one list only. A list with no item is the line "none".

      **＋** The brief of the skill `carry` keeps a short shape: Where things stand, Flags and Next session,
      without Readings due, Readings at the close and a Deferred list. In its Next session, `Work` and
      `Ask the person` take the open `W` and `A` lines of the session''s `frontier.md`, and `Cases` is
      the line "none", since a deferred decision stands in `vault/wiki/backlog.md` and a sprint item on
      `vault/wiki/sprint.md`. `rule-brief` and `rule-carry-over` both say so.

      **－** A contradiction of Flags that a line of `## For the next session` of `handoff.md` already
      carries gets no second line in `Cases`.

      **－** The brief states no decision: the sort by kind is not a judgment of the work.'
