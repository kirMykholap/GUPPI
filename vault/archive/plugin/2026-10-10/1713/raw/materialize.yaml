      **＋** `vault/raw/2026-10-10/1713/work.md`: the Baseline of this session''s Work Mode.

      **＋** `vault/wiki/where-to-stop.md`: the conditions on which Work Mode stops.'
    when: In Work Mode of the session that opens the sprint `plugin`, the agent runs the merge of `migration`
      into `main`, the task line that the closing Case of `migration` left unticked in `vault/raw/2026-10-10/1555/spec.md`.
    then: '`main` moves to the last commit of `migration` by `git merge --ff-only`, and no merge commit
      is made.

