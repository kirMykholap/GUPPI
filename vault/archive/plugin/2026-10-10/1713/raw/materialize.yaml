      \ under the new slug `estimate-skill-sprint-close-migration-merged-into-main` with `when` and `then`\
      \ on this merge alone, the `－` line on the first condition, and the two Estimates named in `context`."
    given: '`estimate-skill-sprint-close-migration-merged-into-main`: the new check of this merge.

