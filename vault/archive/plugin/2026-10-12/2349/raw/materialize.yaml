      `guppi/lint.py`, `guppi/backlog.py`, `guppi/sprint_close.py` and `guppi/sprint.py`. I read whole
      `has_page` of `guppi/materialize.py`, `archived_sprint_pages` of `guppi/backlog.py`, the collision
