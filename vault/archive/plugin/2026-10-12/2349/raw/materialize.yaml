      and case 785 set it. `new_number` counts the ledger and the store, and the command was to count
      the Decision pages and the ledger: the two sides parted, so 788.4 puts the count into one function
      `next_id` of `guppi/caseid.py`, which both call. For the taken sprint id, a Grep for `entity-sprint`
