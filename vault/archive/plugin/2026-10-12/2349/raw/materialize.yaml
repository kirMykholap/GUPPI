      **＋** `guppi/casecheck.py` of `rule-case-check`: `case_number`, `clashes` and `new_number`, which
      the guard calls.

      **＋** `raw/<date>/<hi HHMM>/cases/case-<N>.md`: the file of a Case.

      **＋** `<plan>.checked.json`: the store beside the plan file.

      **＋** `tests/test_ratified.py`: the tests of the guard.

      **＋** `estimate-spec-reconcile-refuses-a-case-file-another-agent-holds`: its Criterion, `purpose`
      and `method` are set anew.

      **＋** `estimate-spec-write-exits-2-on-an-error`: the error rule of the guard.'
    when: '`case-guppi` calls `Edit`, `Write` or `MultiEdit` on `raw/<date>/<hi HHMM>/cases/case-<N>.md`,
      and `uv run guppi ratified --guard` on `PreToolUse` reads the path, the agent type and the `agent_id`
      of the call from the hook input, and `<plan>.checked.json` beside the plan file of the session.'
    then: 'The guard reads the id N from the file name by `case_number` of `guppi/casecheck.py`, a plain
      id such as `785` or an id of a sprint such as `kir-plugin-12` alike.

      **＋** The call is refused when `<plan>.checked.json` holds Case N, or a sub-case of it, under its
      id alone with an `agent_id` other than the one of the call: exit 2 with the reason on stderr, and
      the call does not run.

      **＋** The reason names the file and a free id, and tells `case-guppi` to build its Case under that
      id.

      **＋** The holder is judged by `clashes` and the free id is counted by `new_number` of `guppi/casecheck.py`,
      the judgments that the check of `rule-case-check` runs.

      **＋** A call that passes while `<plan>.checked.json` holds no entry under N alone writes there,
      under N, an entry with the `agent_id` of the call and the time, and no text, so the id is held before
      the agent stops.

      **＋** A refusal writes one line of the refusal to the day''s event log.

      **－** A call whose `agent_id` is the one of the entry under N, and an entry with no `agent_id`,
      are not refused by this check.

      **－** A call with no `agent_id`, a file whose name gives no id, and a session with no plan file
      are not judged by this check, and nothing is written into `<plan>.checked.json`.

      **－** An error of the guard while it finds the plan file or reads or writes `<plan>.checked.json`
      lets the call run: exit 0 with one line on stderr, as `estimate-spec-write-exits-2-on-an-error`
      sets it for the guard.'
    context: 'A Case id is one number that grows across all sessions, with a dot for each sub-case level.
      It names the Decision page `decisions/decision-case-<N>.md` written by `guppi/generate.py`, the
      Case file `cases/case-<N>.md`, and a later Case points back at it by `{supersedes:case N}`. The
      person plans a public repository where others run their own sprints on their own branches and send
      them to `main` by pull request. Two branches cut from the same `main` would both write a Case 786,
      so their pull requests would bring two different `decision-case-786` pages and a mark that can point
      at either. The person chose an id made of the sprint id, a hyphen and a number that starts again
      at 1 in each sprint, such as `kir-plugin-12.1`. The sprint id starts with its author''s GitHub name,
      and the main agent asks for it before it dispatches the opening Case, which is `<id>-1`. The ledger
      hook refuses a sprint id whose page `has_page` finds live or archived, and does not check the name.
      The existing ids stay plain, every reader takes both forms for good, and the sprints `migration`
      and `plugin`, opened before this Case, keep plain ids to their close. One function counts the next
      free id from the Decision pages, the session''s ledger, the store `<plan>.checked.json` and the
      session''s Case files. The command `guppi caseid --next` holds the id it prints in that store, so
      that Cases dispatched together never share an id. The check of a Case built again uses the same
      function.


      The Case was ratified in two parts, then built again on the findings of `/pre-spec`, which the person
      accepted. The person then chose seven parts, one check each. The parts keep their ratified numbers,
      because a part that loses an item of its decision lines would need a new number. So 788.1 is the
      refusal of a taken sprint id, 788.2 the id form, its readers, the command and the dispatch, 788.3
      the sprint id asked first, 788.4 the count of the next id, 788.5 `/box`, 788.6 the guard of a Case
      file, and 788.7 the check of an id that another agent holds. 788.1 keeps its update of `rule-skill-sprint-open`
      for the sentence on the refusal, and 788.3 updates the same page for the question before the dispatch,
      on other anchors. The Decision page of a new-form id is written by `guppi generate` only at a librarian''s
      run in a later sprint, and no test of this session runs it, so 788.2 says nothing of that page beyond
      the Render of `rule-decisions-schema`.


      The readers that take only a plain id today come from a Grep for `isdigit\(\)|\(\\d\+\)|\[\\w\.\]`
      over `guppi/`. It printed `guppi/lint.py`, `guppi/gate.py`, `guppi/casecheck.py` and `guppi/box.py`.
      I read each such function whole. `case_key` of `guppi/gate.py` reads a part that is not a number
      as 0. `case_number` and `new_number` of `guppi/casecheck.py` take digits only, and `held_number`
      of `guppi/ratified.py` calls both. `DECISION_LINK`, `history_cases` and `spec_items` of `guppi/box.py`
      take digits only. `ORIGIN_CASE` and `DEFERRED_LINE` of `guppi/lint.py` take no hyphen. `top_case`
      of `guppi/casecheck.py`, `ancestors` of `guppi/ratified.py`, and `parse_line` and `_case_of` of
      `guppi/materialize.py` already read the new form, because a sprint id holds no dot. So the readers
      agree on a plain id and part on the new form, and 788.2 moves the grammar into `guppi/caseid.py`,
      which they all import, with a test that runs each of them over both forms, as `rule-one-judgment-one-implementation`
      and case 785 set it. `new_number` counts the ledger and the store, and the command was to count
      the Decision pages and the ledger: the two sides parted, so 788.4 puts the count into one function
      `next_id` of `guppi/caseid.py`, which both call. For the taken sprint id, a Grep for `entity-sprint`
      over `guppi/` printed `guppi/prespec.py`, `guppi/materialize.py`, `guppi/generate.py`, `guppi/ledger.py`,
      `guppi/lint.py`, `guppi/backlog.py`, `guppi/sprint_close.py` and `guppi/sprint.py`. I read whole
      `has_page` of `guppi/materialize.py`, `archived_sprint_pages` of `guppi/backlog.py`, the collision
      check of a `create` in `guppi/generate.py` and `is_sprint_page` of `guppi/ledger.py`. `has_page`
      finds a page live or in its category folder under `vault/archive/` outside `raw/`, and reads no
      frontmatter. `archived_sprint_pages` also finds a folder `entities/` under `raw/` and drops a page
      whose frontmatter fails to read. The check in `generate` sees only the live page. The person chose
      `has_page` where they part, so 788.1 imports it, with `is_sprint_page`. The check in `generate`
      keeps its own question, because the ledger hook refuses an archived id before `generate` runs.


      In `rule-ratification`, read whole, the sentence on the form of the id is the one sentence that
      says what an id is, and 788.2 extends it. The table keeps `case 12` as an example of the plain form.
      In `rule-decisions-schema`, read whole, the slug sentence and the field `case` give only plain examples,
      and they gain one of the new form. In `rule-orchestration`, read whole, only the sentence on the
      dispatch names where the Case id comes from. The Criteria of `estimate-orchestration-shows-the-built-case`
      and `estimate-orchestration-names-related-cases-in-the-dispatch` name the Case id in the prompt,
      not where it comes from, so both stand. In `rule-skill-sprint-open`, read whole, step 2 and its
      list ask the sprint id in the rounds of the opening Case, and step 5 says that `case-guppi` puts
      each answer to the person. 788.3 changes both, and the Criterion of `estimate-skill-sprint-open-asks-the-opening-questions`,
      which states them, is replaced whole. Its line on the close line is kept word for word, because
      Case 789.1 relies on it. Case 789 of this session changes steps 3 and 4 of the same Render. I read
      its file, and its anchors and mine do not overlap. Its new step 4 tells the owner from an author
      by the GitHub login, which fits the GitHub name that starts the sprint id. In the Purpose of `rule-ledger-write`,
      the sentence on the refusal while no sprint is open stays true, because a refused `create` opens
      no sprint. The Estimates of `rule-ledger-write` speak of other refusals, and `estimate-ledger-write-holds-a-decision-line-off-the-stored-case`
      names the refusal while no sprint is open, which stays true. `estimate-ratification-ledger-line-form`,
      `estimate-ratification-loaded` and `estimate-decisions-schema-checked` stand, since the id stays
      `case N` and the files keep their lists and sections. A Grep for `gives no number|whole part|free
      number|new number` over `vault/wiki/`, `log.md` left out, printed 16 files. In them, "number" names
      the id of a Case, and with the new form the part that is counted is still a number. Four of them
      are changed by this Case: `estimate-spec-box-refuses-a-stale-spec` by 788.5, `estimate-spec-reconcile-refuses-a-case-file-another-agent-holds`
      by 788.6, `estimate-case-check-sends-back-a-case-number-held-by-another-agent` by 788.7, and `estimate-case-check-sends-back-a-ratified-case-in-another-shape`
      by 788.4. The rest stand. `rule-case-build` and `estimate-case-build-writes-the-case` count a new
      Case beside a ratified one from the Case files and the ledger, and name the free number of the guard
      as the fallback, which still holds when the store holds a higher id. A Grep for `ROOT / "(vault|\.claude)"|REPO
      / "vault"|"\.claude" / "skills"` over `tests/` printed `tests/test_generate.py`, `tests/test_schemas.py`,
      `tests/test_recall.py`, `tests/test_orchestration.py`, `tests/test_guard.py` and `tests/test_case_schema.py`.
      `tests/test_recall.py` and `tests/test_guard.py` write under a temp folder. `tests/test_generate.py`
      writes its own decisions schema. `tests/test_schemas.py` reads the lists of the live schemas, which
      do not change. `tests/test_orchestration.py` and `tests/test_case_schema.py` run the checks over
      the examples of `orchestration.md` and `case-example.md`, whose ids `7` and `1` keep the plain form.
      So all six stand. The two new Estimates have free slugs: a Glob `vault/**/estimate-*{taken-sprint-id,case-id}*.md`
      printed nothing. Their tags stand in `vault/wiki/tags.md`. No part drops a section of a page. In
      the four Criteria that 788.3, 788.4, 788.6 and 788.7 replace, the lines that are not carried word
      for word are changed on purpose: the word number becomes id, the sources of the count are named,
      and the id asked first is stated. The lines are not dropped. The lines of 788.4, 788.5, 788.6 and
      788.7 that share words with another part state the same steps of different hooks, the check of a
      Case file, `/box` and the guard. They are not one promise signed twice.'
