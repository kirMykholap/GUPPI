  case_text:
    context: 'When the person puts an item off, a short Case writes one `defer` line per page, and at
      the librarian''s run `guppi generate` adds the decision to the `deferred_by` of the page. When the
      page does not exist, the `defer` method of `guppi/generate.py` writes a stand-in page with `status:
      draft` and the fields the Case gave, for every vault folder but `estimates`, which case 783 closed.
      That fits a rule or an entity: `is_placeholder` of `guppi/lint.py` knows a stand-in only in those
      two folders and gives it one `deferred` finding. For an Insight it goes wrong: `rule-insights-schema`
      allows only `open`, `actioned` and `archived`, and the stand-in has no `pattern` or `children`.
      A Lesson page allows only `new`, `clustered` and `archived`, and a Decision page is written only
      by the script, so a stand-in in those folders is wrong too. Case 783 left the Insight out by the
      person''s choice (handoff of session 2252, For the next session). The person chose three things.
      A defer with no page writes no page and fails alone. This holds for every kind of page but a rule
      or an entity. `/pre-spec` reports such a defer by the same judgment. Each part replaces the Criterion
      of one existing Estimate, as case 783 did for an Estimate: Case 786.1 replaces the Criterion of
      `estimate-generate-writes`, and Case 786.2 that of `estimate-prespec-checks-the-form-of-an-item`.
      The `purpose` and `method` of both state no promise that changes, so they stand. In `estimate-generate-writes`
      the `defer` line and the `－` line on an Estimate are rewritten, not dropped. In `estimate-prespec-checks-the-form-of-an-item`
      the line on an Estimate, the line on the judgment and the `－` line on an Insight are rewritten,
      not dropped. The check notes each rewritten line as not carried. The `then` lines of Case 786.2
      on a defer share words with lines of Case 786.1. That is meant: 786.1 sets what `guppi generate`
      does with such a defer, and 786.2 sets what `/pre-spec` reports. These are two promises, checked
      by two Estimates. A Grep for `^status: draft` over `vault/` with the glob `**/{insights,lessons}/*.md`
      printed no match, so no stand-in Insight or Lesson stands today and nothing needs to move.


      Shared code. The functions each side calls today were read whole. `defer` of `guppi/generate.py`
      asks `has_page` of `guppi/materialize.py` for an Estimate, then `find`, which reaches a page in
      any category folder. `check_form` of `guppi/prespec.py` asks `category_of` and `has_page` for an
      Estimate. `is_placeholder` of `guppi/lint.py` judges a stand-in by the folders `rules` and `entities`,
      written there as a literal. `generate` and `/pre-spec` already share `has_page`, which finds a page
      only in its own category folder; case 783 set that judgment, and `has_page` is asked before `find`,
      so the two sides cannot part on a page in a folder of another category. Case 786.1 adds to `guppi/materialize.py`
      the constant `PLACEHOLDER_CATEGORIES`, the folders `rules` and `entities`, and the predicate `defer_writes_no_page`.
      `guppi/generate.py` and `guppi/prespec.py` import the predicate, and `is_placeholder` of `guppi/lint.py`
      imports the constant in place of its literal, so the folders where a stand-in may stand are one
      judgment. The behaviour of lint does not change, so the Criterion of `estimate-lint-checks-the-statuses`
      stands. A Grep for `placeholder|has_page` over `guppi/` printed `guppi/generate.py`, `guppi/glossary.py`,
      `guppi/lint.py`, `guppi/materialize.py`, `guppi/prespec.py` and `guppi/render.py`. In `render.py`
      the word means a language placeholder, and in `glossary.py` a page with no `parent`. The hits in
      `generate.py`, `materialize.py` and `prespec.py` are the docstrings and code the tasks change. The
      fill of a stand-in by a `create` in `generate.py` stays true, since a stand-in now stands only as
      a rule or an entity.


      Pages. A Grep for `placeholder page|a placeholder|draft placeholder|stand-in|has_page` over `vault/wiki/`,
      with `log.md` and `brief.md` left out, printed `glossary.md`, `entity-glossary.md`, `rule-page-generation.md`,
      `estimate-generate-writes.md`, `estimate-prespec-checks-the-form-of-an-item.md`, `rule-brief.md`,
      `rule-decisions-schema.md`, `rule-glossary.md`, `rule-lint.md`, `estimate-glossary-renders-the-terms.md`,
      `estimate-guppi-config-fills-the-languages.md`, `estimate-lint-checks-the-statuses.md`, `estimate-lint-finds-a-broken-link.md`
      and `lesson-case-build-reused-judgment-not-checked-against-the-other-side.md`. The Purpose of `rule-page-generation`
      names the exception of case 783 for an Estimate only, so Case 786.1 widens it. The Types row of
      `entity-glossary`, rendered into `glossary.md`, says a defer writes a stand-in page when there is
      no `ref`, so Case 786.1 limits it to a rule or an entity. The last `－` line of the Criterion of
      `estimate-prespec-checks-the-form-of-an-item` says a defer of an Insight with no page is no finding,
      so Case 786.2 rewrites it. In `rule-brief`, a deferred item lives on as a draft stand-in or as the
      open Insight itself, and an Insight is deferred only as a page that stands, so the sentence stays
      true. In `rule-decisions-schema`, `rule-glossary`, `rule-lint`, `estimate-glossary-renders-the-terms`,
      `estimate-lint-checks-the-statuses` and `estimate-lint-finds-a-broken-link`, a stand-in is a rule
      or an entity page, which stays true. In `estimate-guppi-config-fills-the-languages` the word means
      a language placeholder. The lesson is a record. A Grep for `placeholder|defer of an Estimate|has_page`
      over `.claude/` printed no match. In `rule-orchestration`, read whole, the sentences on what a defer
      names are the take-back sentence and the sentence of case 783. The take-back defers each rule, entity
      and insight page that a ratified Case names, and such an Insight stands, so it stays true. The sentence
      of case 783 stays true, and Case 786.2 adds the route for the new finding after it, since a short
      Case has no `case-guppi` to send a finding to. The short-form example defers `entity-booking-export`,
      an entity, which keeps its stand-in. The change to the Purpose of `rule-page-generation` and to
      the Render of `rule-orchestration` touches no Estimate (case 378.5). The Criteria of the other Estimates
      of `rule-page-generation` speak of other steps; `estimate-generate-fails-alone` speaks of any entry
      that fails, which the new failure joins, so it stands. The Criteria of the Estimates of `rule-orchestration`
      on a defer speak of the reply, the example and the take-back, which stay true. The Criterion of
      `estimate-glossary-terms-defined` asks that no row contradict its `where` page, and `rule-case-protocol`
      says nothing of stand-in pages, so it stands. The text of `rule-insights-schema` says a defer postpones
      an Insight, which stays true, and the Case does not change it.


      Tests that read live files. A Grep for `(ROOT|REPO)\s*/\s*"(vault|\.claude)"` over `tests/` printed
      `tests/test_case_schema.py`, `tests/test_generate.py`, `tests/test_orchestration.py` and `tests/test_schemas.py`.
      `test_case_schema.py` runs the check of `guppi/casecheck.py`, which reaches `check_form` through
      `prespec.judge`, over `case-example.md`, which holds no `defer` item. `test_orchestration.py` reads
      the blocks tagged `showing` and `defer` of `orchestration.md`; the new sentence adds no block, and
