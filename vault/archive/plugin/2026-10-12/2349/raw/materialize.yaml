  case_text:
    given: '`rule-git-context`: the rule of the git lines of `/hi`, which states the remote.

      **＋** `estimate-git-context-current`: its Criterion is replaced whole.

      **＋** `.claude/skills/hi/SKILL.md`: the skill whose commands the Criterion runs.'
    when: The person invokes `/hi`, and `.claude/skills/hi/SKILL.md` runs the commands of `rule-git-context`.
    then: 'The context holds `Render:` with the output of `uv run guppi render --sync` (a diff for each
      governed file that differed and was written, or nothing), then `Branch:` with the current branch
      and `Status:` with `git status --short`.

      **＋** `git remote -v` prints `origin` with the URL of the repository `GUPPI` on GitHub.

      **－** The skill runs no `git pull`, and the context holds no `Pull:` line.'
    context: 'The milestone The sprint turn and GitHub of `entity-sprint-plugin` asks for the repository
      on GitHub, set up so that a pull request from another person is easy to review. Today nothing of
      it exists: `.git/config` holds no `[remote]` section, and a Glob `.github/**` printed nothing. The
      person wants a public repository. Only the owner pushes. Every pull request goes into `main`, and
      `prod` is a branch that only the owner and later the CI write. No page governs a CI file or the
      settings of a GitHub repository. The ask-guppi query found these facts. The index lines of `vault/wiki/rules/`
      and `vault/wiki/entities/` hold no rule or entity on GitHub, CI or a remote. The lessons hold one
      near hit: `lesson-obsidian-cli-needs-the-running-app` names CI only as a place where that CLI cannot
      run. The insights hold none. A Glob `vault/**/rule-github*.md` printed only `vault/archive/migration/2026-09-30/0138/rules/rule-github-issues.md`,
      so `rule-github-repository` is free. The tags `github`, `ci` and `git` exist in `tags.md`. Case
      787.1 creates `rule-github-repository` for the rulesets, the CI workflow and the approval of outside
      runs. Its list of Estimates stays empty for now. Until the sprint closes, `estimate-sprint-plugin-pull-requests-reviewed-on-github`
      checks the setup, and a later Case gives the rule a lasting Estimate. The Criterion of that sprint
      Estimate expects a pull request against `plugin` and a merge into `plugin` (case 766). The person
      now sends every pull request into `main`, so Case 787.1 replaces the Criterion whole and sets its
      `purpose` anew. None of its old lines is carried on purpose. The trigger now names `main`, not `plugin`.
      The line on the checks of CI becomes the line that names the workflow and its three checks. The
      merge into `plugin` becomes a merge into `main` that only the owner can do. The exception that `main`
      takes the pull request with `plugin` at the close becomes the test pull request closed without a
      merge. Its `method` stands, since it does not name the branch. Case 789 leaves that Criterion to
      this Case. This Case closes the Frontier line of the sprint item, so 787.1 also updates `entity-sprint-plugin`.
