      page, git stops on a conflict, and the author of the branch settles it (case 790). The author runs
      `/merge-main` in a session of its own, after the work of the sprint and before `/sprint-close`,
      while the sprint page is live. The ledger then takes the lines of the merge Case, and the close
      settles each check that the merge Case set `pending`. Files that a command writes are written again
      rather than joined, and git keeps both sides of `log.md` and `tags.md`, which only gain lines. Every
      other conflicted file takes a joined text that the person signs in the merge Case and Work Mode
      writes. These are what a merge of `main` writes into `vault/wiki/` besides the script ([[rule-page-generation]],
      [[rule-vault-layout]]). The close archives what it archived before ([[rule-sprint-close]]). The
      pull request follows the close: for the owner''s sprint the opening Case of the next sprint opens
      and merges it ([[rule-skill-sprint-open]]), and the owner reviews the pull request of another person
      by `/pr-review`.'
    Render: "<!-- rule-skill-merge-main -->\n---\nname: merge-main\ndescription: \"Merge main into the\
      \ branch of the open sprint as one merge Case, before the close of the sprint. Run it when the person\
      \ types /merge-main.\"\n---\n\nThis session merges `origin/main` into the branch of the open sprint,\
      \ after the work of the sprint and before `/sprint-close`, so that the pull request of the closed\
      \ sprint reaches `main` with no conflict. The merge Case is the one Case of this session (case 790).\n\
      \n1. When `/hi` printed `main` under `Branch:`, or the first heading of `vault/wiki/sprint.md` marks\
      \ the last sprint closed, build no Case and merge nothing: tell the person that `/merge-main` runs\
      \ on the branch of an open sprint, before its close.\n2. Until the merge Case is ratified, only\
      \ read: write nothing into the tree or into `.git`, so run no `git fetch` (`rule-default-mode`).\
      \ `gh api repos/{owner}/{repo}/commits/main --jq .sha` prints `<hash>`, the commit of `main` on\
      \ GitHub. When `git merge-base --is-ancestor <hash> HEAD` exits 0, the branch already holds `main`:\
      \ build no Case, and tell the person so.\n3. `git merge-base HEAD origin/main` prints `<base>`,\
      \ the last commit of `main` that the branch holds. `gh api repos/{owner}/{repo}/compare/<base>...<hash>\
      \ --jq '.files[].filename'` names each file that `main` changed since, and `git diff --name-only\
