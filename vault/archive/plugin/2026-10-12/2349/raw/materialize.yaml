      \ this session read, and its last task runs `git commit -m \"merge: main <hash> into <branch> —\
      \ case N\"`;\n   - each file that a command writes — a file that a live rule page names in `governs`,\
      \ `vault/wiki/glossary.md`, `vault/wiki/sprint.md`, `vault/wiki/backlog.md` and `vault/wiki/brief.md`\
      \ — takes the text of `main` by `git checkout --theirs -- <path>` when git leaves it in conflict;\
