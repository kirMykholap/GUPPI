      at 1 in each sprint, such as `kir-plugin-12.1`. The sprint id starts with its author''s GitHub name,
      and the main agent asks for it before it dispatches the opening Case, which is `<id>-1`. The ledger
      hook refuses a sprint id whose page `has_page` finds live or archived, and does not check the name.
      The existing ids stay plain, every reader takes both forms for good, and the sprints `migration`
      and `plugin`, opened before this Case, keep plain ids to their close. One function counts the next
      free id from the Decision pages, the session''s ledger, the store `<plan>.checked.json` and the
      session''s Case files. The command `guppi caseid --next` holds the id it prints in that store, so
      that Cases dispatched together never share an id. The check of a Case built again uses the same
      function.


