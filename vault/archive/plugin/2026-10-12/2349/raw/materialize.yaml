  case_text:
    context: 'Case 787.1 set up the repository `GUPPI` on GitHub. In Work Mode the workflow `.github/workflows/checks.yml`
      and the scan of the history were done, and the push waits at its stop. Two of its choices changed
      before the push. First, the history goes up whole today. The reflog of `main` shows that the tag
      `vault-v1` marks the commit `afb1b914`, the clone from `c:/PROJECTS/job hunt ai`, and that its child
      `8b34941a` is the commit "chore: the product leaves, and the repository becomes the harness and
      the vault". Every commit before it belongs to the former product. The person chose to cut the history
      there: `8b34941a` becomes the first commit, and each later commit keeps its files and message with
      a new id. Second, Case 787.1 makes the three jobs of the workflow block a merge into `main`. `make
      lint` exits non-zero at the Baseline of this session in `work.md`, and the glossary row of Lint
      says that its red is a signal, not a gate. So with lint required, no pull request from outside could
      merge. The person chose that only `style` and `test` block a merge, and that `lint` runs and shows
      its result. This Case is Case 787.1 built again under a new number, since a ratified Case is not
      taken back in Work Mode. Its decision line carries `{supersedes:case 787.1}`. Case 787.2 stands
      as it is. Its sentence that `origin` had been the product repository this vault was split from stays
      true. The text of 787.1 is carried but for the lines below. The Purpose of `rule-github-repository`
      says that the history on GitHub starts at the cut, and that only `style` and `test` block a merge.
      The Criterion of `estimate-sprint-plugin-pull-requests-reviewed-on-github` is replaced whole again.
      Its line on the three checks now names `style` and `test`, and a new `－` line says that a red `lint`
      blocks no merge. Its `purpose` and `method` do not name which checks block, so they are set as Case
      787.1 set them. The tasks gain the cut, a check by hand before the push, a change of `README.md`,
      and the removal of the backup after the push. A local backup branch holds the old history while
      the cut is made and checked, so a cut that went wrong can be undone and needs no stop. After the
      push is checked, the backup branch and the tag `vault-v1` are removed and git clears the old commits.
      git cannot undo that, so it is a stop by the third condition of `rule-where-to-stop`. The history
      of the product stays in the owner''s local product repository: a Glob found `c:/PROJECTS/job hunt
      ai/.git/HEAD`. Pages that quote a commit id stay as records, by the person''s answer. A Grep `\b(commit|commits|run
      of|at|of) [0-9a-f]{7,40}\b` over `vault/wiki/` printed 27 occurrences across 25 files. After the
      cut those ids open nowhere, and their text stays as it is. A Grep `rev-parse|merge-base|rev-list|filter-repo|filter-branch`
      over the repository outside `vault/` printed nothing, so no code reads a stored commit id. A Grep
      `(?i)whole history|job hunt|split (out|from)` over the repository outside `vault/raw/` and `vault/archive/`
      printed `README.md` and `vault/wiki/rules/rule-git-context.md`. The sentence of `README.md` that
      the project was split out with the whole history becomes false at the push, so a task changes it.
      The hit in `rule-git-context` is the sentence that Case 787.2 changes, and it stays true. A Grep
      `README|sprint-plugin|github-repository|checks\.yml` over `tests/` printed `tests/test_prespec.py`
      and `tests/test_lint.py`. Both build their pages under a temporary folder or hold the name as a
      string, so no test reads a file this Case changes. The cut itself is checked by hand in Work Mode
      before the push, since a fault found after the push cannot be undone. The Estimate checks the pull
      request, as the person chose.'
    problem: Case 787.1 would push the whole history, the former product's commits included. It would
      also make `lint` block every merge into `main`, though lint is red at the Baseline and is only a
      signal.
    recommend: "- **Change**\n  - Asked: the person, in Work Mode, chose to cut the history at `8b34941a`\
      \ before the first push, so that the commits after it keep their content with new ids, and to make\
      \ only `style` and `test` required on `main`, with `lint` shown but not blocking.\n  - Taken: Case\
      \ 787.1 is built again as Case 794 with `{supersedes:case 787.1}`. The Purpose of `rule-github-repository`,\
      \ the Criterion of `estimate-sprint-plugin-pull-requests-reviewed-on-github` and the tasks change\
      \ as `context` says.\n- **Where should the old history stay on this computer?**\n  - Recommended:\
      \ (b) a local backup branch only while the cut is made and checked; after the push and its check,\
      \ the backup branch and the tag `vault-v1` are removed, and git clears the old commits.\n  - Answer:\
      \ agreed, (b).\n- **What happens to the commit ids that pages already quote?**\n  - Recommended:\
      \ (a) they stay as records; the texts do not change.\n  - Answer: agreed, (a).\n- **Does this Case\
      \ change the README sentence about the history?**\n  - Recommended: (a) this Case changes the sentence\
      \ before the push: the public history starts at the commit that removed the product, and the earlier\
      \ history stays only in the owner's local copy.\n  - Answer: agreed, (a).\n- **How is the cut checked?**\n\
      \  - Recommended: (a) a check by hand in Work Mode just before the push: the first commit has no\
      \ parent and holds the files of the commit that removed the product, the last commit of `plugin`\
      \ holds the same files as before the cut, and a search of the new history for the key and the token\
      \ finds nothing; the check page of the sprint keeps only the pull request.\n  - Answer: agreed,\
      \ (a)."
    given: '`rule-github-repository`: the new rule of the repository on GitHub, its history, its rulesets
      and its CI.

      **＋** `.github/workflows/checks.yml`: the workflow whose jobs `style`, `test` and `lint` run the
      checks.

      **＋** `estimate-sprint-plugin-pull-requests-reviewed-on-github`: its Criterion is replaced whole.

      **＋** `entity-sprint-plugin`: the sprint whose milestone asks for the repository.

      **＋** `Makefile`: the targets `test`, `lint` and `style` that the workflow runs.

      **＋** `README.md`: its sentence on the history of the project.

      **＋** `rule-where-to-stop`: the push, the login and the removal of the old history wait for the
      person''s word.'
    when: In a session of the sprint `plugin` before its close, someone opens a pull request against the
      branch `main` of the repository `GUPPI` on GitHub, which `rule-github-repository` describes, from
      an account other than the owner's, such as a second account that the owner made for the test.
    then: 'The workflow `.github/workflows/checks.yml` runs `make test`, `make lint` and `make style`
      of the `Makefile` on `windows-latest` on the pull request, and shows each result on it.

      **＋** A run of a first-time contributor waits until the owner approves it.

      **＋** The owner reviews the pull request on GitHub, and only the owner can merge it.

      **＋** A merge into `main` waits until the jobs `style` and `test` pass, except for the owner, who
      is on the bypass list of the ruleset on `main`.

      **＋** The other account cannot push to `main` or to `prod`, and a pull request against `prod` cannot
      be merged.

      **－** A red result of the job `lint` does not block a merge into `main`.

      **－** The workflow does not run on the event `pull_request_target`, so the code of the pull request
      reaches no secret of the repository.

      **－** The test pull request is closed without a merge, so `main` takes no commit before `plugin`
      closes.'
