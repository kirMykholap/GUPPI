decisions:
- case: '785'
  decision: decision-case-785
  origin: raw/2026-10-12/2349/ledger.md#case-785
  targets:
  - kind: update
    category: rules
    slug: rule-case-build
    ref: rule-case-build
  - kind: update
    category: estimates
    slug: estimate-case-build-finds-an-existing-judgment
    ref: rule-case-build
  tags: []
  case_text:
    context: 'When a task of a Case adds code that judges a text, such as whether a page exists, `case-guppi`
      searches `guppi/` for code that already makes that judgment and has the task import it (case 752).
      It does not read the function that the other side of the pipeline calls today for the same judgment,
      so it can name a function as shared when it answers differently. In session 2252 Case 783 had `/pre-spec`
      reuse the page test of `guppi/materialize.py` for a defer that `guppi generate` judges by its own
      lookup in `guppi/generate.py`. The two answered differently for an Estimate archived outside a folder
      `estimates/`. The `ask-guppi` run at `/pre-spec` found it, and the Case was built again around a
      new shared `has_page` (handoff of session 2252; `lesson-case-build-reused-judgment-not-checked-against-the-other-side`).
      Case 784 added a search for changed field names, not a check of a shared judgment in code (handoff
      of session 2252, For the next session).


      The person chose four things. A new sentence in the Render of `rule-case-build` has `case-guppi`
      read whole the function each side calls and judge whether they answer alike, and no script or `/pre-spec`
      question is added. Where the functions part, `case-guppi` asks the person in a round which answer
      both sides share. Where they parted, the task adds one test over that input. The Criterion of `estimate-case-build-finds-an-existing-judgment`
      is replaced whole, and no new Estimate is created. The new sentence stands right after the sentence
      of case 752 in the Render. Its `purpose` and `method` state the old promise, so the same `update`
      sets them anew. The old Criterion''s last `－` line on `insight-workflow-case-written-without-reading-the-pages-it-changes`
      was the bookkeeping of case 752 and is not carried.


      In `rule-case-build`, read whole, the sentence of case 752 is the one sentence on this behaviour.
      It stays true, because the new sentence adds a step before the import. The sentence that `case-guppi`
      decides nothing the person has not decided agrees with the round the new sentence asks for. The
      text of `rule-one-judgment-one-implementation` asks for a test only where the two sides cannot share
      code. The new test, where the old functions parted, adds to that rule and makes no sentence of it
      false. The Criterion of `estimate-one-judgment-one-implementation-followed` speaks of the code of
      a session, not of how `case-guppi` builds a Case, so it stands. The other Estimates of `rule-case-build`
      speak of other steps of the build, so they stand. A Grep for `existing judgment|already makes that
      judgment|second copy of a judgment` over `vault/wiki/` and `.claude/` printed `.claude/agents/case-guppi.md`,
      `vault/wiki/rules/rule-case-build.md` and `vault/wiki/estimates/estimate-case-build-finds-an-existing-judgment.md`,
      all three changed by this Case. A Grep for `case-guppi\.md|rule-case-build` over `tests/` printed
      no match, so no test reads the changed files. The Case changes no code and adds no hook. It takes
      no `{addresses:...}` mark, because the lesson stands in the ledger of another session (case 284.2).'
    problem: '`case-guppi` can name an existing function as the judgment that both sides share without
      reading the function the other side calls, so the two sides may still answer differently.'
    recommend: "- **Where should the fix go?**\n  - Recommended: (a) a new sentence in the instructions\
      \ of `case-guppi` only: it reads the function each side calls and judges whether they answer alike,\
      \ and `context` names both and what it found.\n  - Answer: agreed, (a).\n- **What should `case-guppi`\
      \ do when the two functions answer differently?**\n  - Recommended: (a) ask the person which answer\
      \ is right: name neither function as shared, and show in a round the input where they part and what\
      \ each answers there.\n  - Answer: agreed, (a).\n- **Should a test prove that both sides agree?**\n\
      \  - Recommended: (a) a test over the input where they parted, which runs both sides and asserts\
      \ they answer alike.\n  - Answer: agreed, (a).\n- **Which check confirms the fix?**\n  - Recommended:\
      \ (a) rewrite the Criterion of `estimate-case-build-finds-an-existing-judgment` whole, its purpose\
      \ with it.\n  - Answer: agreed, (a)."
    given: '`rule-case-build`: its Render gains the sentence on the function each side calls.

      **＋** `.claude/agents/case-guppi.md`: the file rendered from `rule-case-build`.

      **＋** `estimate-case-build-finds-an-existing-judgment`: its Criterion, `purpose` and `method` are
      set anew.

      **＋** `guppi/`: the code that `case-guppi` searches and reads.

      **＋** `rule-one-judgment-one-implementation`: the rule that a judgment lives in one module.'
    when: '`case-guppi`, with `.claude/agents/case-guppi.md` rendered from `rule-case-build`, builds a
      Case with a task that adds code under `guppi/` that judges a text — a pattern, a map or a predicate.'
    then: 'Before it writes the task, `case-guppi` searches `guppi/` for the words of what the code judges,
      such as the field, the category or the form of the line, and reads each hit around its line.

      **＋** Where code under `guppi/` already makes that judgment, the task imports it, or moves it into
      one module that both sides import, as `rule-one-judgment-one-implementation` sets it.

      **＋** Where the two sides cannot share the code, the task adds one test that runs both over the
      same input and asserts they answer alike.

      **＋** Before it names a function as the judgment both sides share, `case-guppi` reads whole the
      function each side calls today for that judgment, the side the Case does not change included, and
      judges whether they answer alike on each input where they could part.

      **＋** Where they part, `case-guppi` names neither as the shared judgment and asks the person in
      a round which answer both sides share, with the input and what each answers there.

      **＋** Where they parted, the task adds one test that runs both sides over that input and asserts
      they answer alike.

      **＋** The `context` of the Case names that search, its pattern, its paths and what it printed.

      **＋** The `context` of the Case names each function it read for the judgment both sides share, and
      what it found.

      **－** A Case whose tasks add no code that judges a text takes no such search.'
  spec: vault/raw/2026-10-12/2349/spec.md
  applied: 04:30:30
- case: '786.1'
  decision: decision-case-786.1
  origin: raw/2026-10-12/2349/ledger.md#case-786.1
  targets:
  - kind: update
    category: rules
    slug: rule-page-generation
    ref: rule-page-generation
  - kind: update
    category: entities
    slug: entity-glossary
    ref: entity-glossary
  - kind: update
    category: estimates
    slug: estimate-generate-writes
    ref: rule-page-generation
  tags: []
  case_text:
    given: '`rule-page-generation`: the rule of `guppi generate`, whose Purpose names the exception to
      a page always created.

      **＋** `guppi/generate.py`: the `defer` of an entry and the module docstring.

      **＋** `guppi/materialize.py`: its routing table names the defer with no page; `has_page`, and the
      new `PLACEHOLDER_CATEGORIES` and `defer_writes_no_page`, which `guppi/generate.py` and `guppi/prespec.py`
      import.

      **＋** `guppi/lint.py`: `is_placeholder`, which judges a stand-in by the folders where it may stand.

      **＋** `tests/test_generate.py`: the tests of `guppi generate`.

      **＋** `estimate-generate-writes`: its Criterion is replaced whole.

      **＋** `estimate-generate-fails-alone`: the Estimate of an entry that fails alone.

      **＋** `entity-glossary`: the terms, rendered into `vault/wiki/glossary.md`, whose Types row names
      the stand-in page of a defer.

      **＋** `rule-insights-schema`, `rule-lessons-schema` and `rule-decisions-schema`: the formats whose
      statuses a stand-in page breaks.

      **＋** `vault/wiki/sprint.md`, `vault/wiki/log.md` and `vault/wiki/tags.md`: the files `guppi generate`
      reads or appends to; the sprint comes from `vault/wiki/sprint.md`, or from `entity-sprint-<id>`
      when a unit creates it.

      **＋** `vault/wiki/<category>/`, and a folder `<category>` under `vault/archive/` outside its `raw/`
      folders: where the page of a slug stands.'
    when: '`guppi generate` applies one entry of a yaml to a page.'
    then: 'A `create` becomes a page: `type`, the fields of the entry, `status` by category (entity and
      rule `draft`, estimate `pending`, lesson `new`, insight `open`), `origin`, `sprint` — the `sprint`
      of the yaml, which `guppi materialize` takes from the first `## <id>` of `sprint.md` or, in a unit
      whose ledger creates `entity-sprint-<id>`, from that `<id>`, `created` — the yaml''s date, `tags`;
      the body sections from `sections`, `## Purpose` from `purpose` on a rule or an entity; a `ref` lands
      in the parent''s `children` or the target''s `estimates` with History `child <slug> added` / `estimate
      <slug> added`, at the end of the run when the parent comes later in the yaml.

      **＋** An Estimate page carries `purpose`, `method` and `checked` as fields, in that order after
      `target`, and `deferred_by` after `checked` once a `defer` marks it; `## Criterion` from `sections`;
      neither `## Context` nor `## Method` is written.

      **＋** A `create` whose slug is a placeholder (`draft`, no `kind`) fills it: `created` and `deferred_by`
      kept, History `created over placeholder`; any other existing page is a collision, not a rename.

      **＋** An `update` applies `set` to the frontmatter, `sections` as whole replacements, `replace`
      inside the body (whitespace collapsed, exactly one occurrence), History `updated: <change>`; an
      `update` of an Estimate with `sections.Criterion` replaces the section whole.

      **＋** An `update`, `estimate`, `delete` or `defer` whose slug is not under `vault/wiki/` finds the
      page under `vault/archive/` (`raw/` folders excluded) and edits it there.

      **＋** An `estimate` sets `status`, overwrites `## Result`, writes `checked` — the date the `result`
      opens with, else the yaml''s date — and appends History `status: a → b · <ledger pointer>`.

      **＋** A `delete` sets `archived` with History `deleted`; a `delete` outside the vault is a line
      on stdout, the entry applied, no page written.

      **＋** A `defer` with a page appends the decision slug to `deferred_by` (rule, entity, insight, estimate)
      with History `deferred`; without a page it writes a placeholder `draft` with the Case''s fields
      and `deferred_by` for a rule or an entity only.

      **＋** A `lesson` writes the lesson only, `source` when the line carries it; no Estimate is created.

      **＋** Every ref field is written as `"[[slug]]"`, a list as `["[[a]]", "[[b]]"]`; a slug without
      a category prefix stays bare; read through the brackets.

      **＋** A `create` in `insights` applies only with the mark `librarian`; a `delete` of an Insight
      is refused always.

      **＋** History lines and `log.md` lines carry the date of the run and end with `[[decision-case-N]]`
      or the ledger pointer; `log.md` is appended after each entry; a tag of `new_tags` lands in `tags.md`,
      a used and undeclared one goes to stderr.

      **－** A `defer` of an Estimate, an Insight, a Lesson or a Decision page whose page stands neither
      under `vault/wiki/<category>/` nor in a folder `<category>` under `vault/archive/` outside a `raw/`
      folder, by `defer_writes_no_page` of `guppi/materialize.py`, which asks `has_page`, writes no page:
      the entry fails alone (`estimate-generate-fails-alone`), with `generate: <slug>: an Estimate is
      deferred only with its page — defer the page it would check` on stderr for an Estimate, and `generate:
      <slug>: a placeholder is written only for a rule or an entity — defer a page that stands` for the
      other kinds.

      **－** No body section is derived from a ref field; a section the entry does not name under `sections`
      or reach by `replace` is not touched.

      **－** An `update` of an Estimate whose `set` carries `method` drops no section.

      **－** `criterion_block` on an `update` and an entry of kind `remove_criterion` are not applied:
      a shape the script does not know — the entry fails alone (`estimate-generate-fails-alone`).'
    context: 'When the person puts an item off, a short Case writes one `defer` line per page, and at
      the librarian''s run `guppi generate` adds the decision to the `deferred_by` of the page. When the
      page does not exist, the `defer` method of `guppi/generate.py` writes a stand-in page with `status:
      draft` and the fields the Case gave, for every vault folder but `estimates`, which case 783 closed.
      That fits a rule or an entity: `is_placeholder` of `guppi/lint.py` knows a stand-in only in those
      two folders and gives it one `deferred` finding. For an Insight it goes wrong: `rule-insights-schema`
      allows only `open`, `actioned` and `archived`, and the stand-in has no `pattern` or `children`.
      A Lesson page allows only `new`, `clustered` and `archived`, and a Decision page is written only
      by the script, so a stand-in in those folders is wrong too. Case 783 left the Insight out by the
      person''s choice (handoff of session 2252, For the next session). The person chose three things.
      A defer with no page writes no page and fails alone. This holds for every kind of page but a rule
      or an entity. `/pre-spec` reports such a defer by the same judgment. Each part replaces the Criterion
      of one existing Estimate, as case 783 did for an Estimate: Case 786.1 replaces the Criterion of
      `estimate-generate-writes`, and Case 786.2 that of `estimate-prespec-checks-the-form-of-an-item`.
      The `purpose` and `method` of both state no promise that changes, so they stand. In `estimate-generate-writes`
      the `defer` line and the `－` line on an Estimate are rewritten, not dropped. In `estimate-prespec-checks-the-form-of-an-item`
      the line on an Estimate, the line on the judgment and the `－` line on an Insight are rewritten,
      not dropped. The check notes each rewritten line as not carried. The `then` lines of Case 786.2
      on a defer share words with lines of Case 786.1. That is meant: 786.1 sets what `guppi generate`
      does with such a defer, and 786.2 sets what `/pre-spec` reports. These are two promises, checked
      by two Estimates. A Grep for `^status: draft` over `vault/` with the glob `**/{insights,lessons}/*.md`
      printed no match, so no stand-in Insight or Lesson stands today and nothing needs to move.


      Shared code. The functions each side calls today were read whole. `defer` of `guppi/generate.py`
