      while the branch does not hold `origin/main` is Case 791. Case 789.1 has `/sprint-open` write a
      `/merge-main` line before the close line.


      Not done. When `main` takes another pull request after the merge and before the pull request of
      this branch is merged, GitHub shows a conflict. The sprint is closed by then, so `/merge-main` cannot
      run again, and no rule covers that case yet. No code checks that the merge Case is the one Case
      of its session.'
    problem: 'A sprint branch and `main` that changed one page conflict in git, and no rule says who settles
      the conflict, where, or how the settled text is signed. The rules on `vault/wiki/` leave no way
      to write a joined text: only the script writes a page.'
