      exits non-zero only on files that the merge Case settles is no refusal, and the run goes on to the
      tasks that settle them.

      **＋** When the full `make test` run of `/work` after its last task finds a failing test that `##
      Baseline` of `raw/<date>/<hi HHMM>/work.md` does not hold, and its fix needs a choice that no ratified
      Case makes, the agent ends a reply with a question to the person that names the test and its failure.

