      into an item that names `rule-github-repository`, since an item ticks only when its page is `built`,
      and the cascade of `guppi/generate.py` leaves a page with no Estimate as it stands. The change of
      the sprint page and of the Estimate''s purpose makes `sprint.md` stale, so 787.1 runs `uv run guppi
      sprint`. The remote makes two texts false. `rule-git-context` says the repository has no remote
      since case 528. The Criterion of `estimate-git-context-current` says that `git remote` prints no
      remote. A Grep `(?i)no remote|prints no remote|has no remote` over `vault/wiki/` and `.claude/`
      printed `vault/wiki/log.md`, `vault/wiki/rules/rule-git-context.md` and `vault/wiki/estimates/estimate-git-context-current.md`;
      `log.md` is not read. Case 787.2 changes both texts, and `/hi` still runs no `git pull`. One old
      line of that Criterion is not carried on purpose: the line that `git remote` prints no remote becomes
      the line that it prints `origin`. Its other lines stand as they were. Only a `/hi` gives the context
      that the Criterion reads, and the `/hi` of this session ran before the push. So 787.2 sets the `method`
      anew to wait for the first `/hi` after the first push to GitHub, a part that opens with `by hand,
      after` and names its event, as case 781 allows. `rule-rules-schema` says that a Leaf which still
      carries `## How it works` drops the section at its next touch, the mechanism living in the docstring
      of its code or in its Render. `rule-git-context` renders commands into `.claude/skills/hi/SKILL.md`
      and has no code with a docstring. The section stays here all the same, and 787.2 changes only its
      sentence on the remote by a `replace` pair; the Purpose stands as it is. No form of an `update`
      removes a section today: `body` in `guppi/generate.py` writes a section set to empty text as its
      heading alone. `rule-vault-layout` says that no file of `wiki/` is written by hand, so no task removes
      the section by hand either. By the person''s answer, the form of an `update` that drops a section
      is put off to the backlog by a defer of `rule-page-generation`. A later Case moves the facts of
      the section into the Purpose and drops the section in one step, once that form exists. The new sentence
      says how the local `main` and a sprint branch take the work of GitHub. The local `main` follows
      `origin/main` by `git fetch origin` and `git merge --ff-only origin/main` in the opening Case of
      a sprint, which Case 789.1 sets. A sprint branch takes `main` by the merge Case of `/merge-main`,
      which Case 790 sets. Before anything goes public, the history is scanned. A Grep `(?i)users[\\/]+kir`
