  category: estimates
  set:
    status: pending
    purpose: Whether a pull request from another account, a second account of the owner included, runs
      the checks of CI on GitHub and can be reviewed and merged into the branch main by the owner alone
  change: the Criterion replaced whole — the pull request goes against main, only style and test block
    a merge, only the owner merges, the test pull request is closed without a merge
  sections:
    Criterion: 'When:

      In a session of the sprint `plugin` before its close, someone opens a pull request against the branch
      `main` of the repository `GUPPI` on GitHub, which `rule-github-repository` describes, from an account
      other than the owner''s, such as a second account that the owner made for the test.


      Then:

      The workflow `.github/workflows/checks.yml` runs `make test`, `make lint` and `make style` of the
      `Makefile` on `windows-latest` on the pull request, and shows each result on it.

      **＋** A run of a first-time contributor waits until the owner approves it.

      **＋** The owner reviews the pull request on GitHub, and only the owner can merge it.

      **＋** A merge into `main` waits until the jobs `style` and `test` pass, except for the owner, who
      is on the bypass list of the ruleset on `main`.

      **＋** The other account cannot push to `main` or to `prod`, and a pull request against `prod` cannot
      be merged.

      **－** A red result of the job `lint` does not block a merge into `main`.

      **－** The workflow does not run on the event `pull_request_target`, so the code of the pull request
      reaches no secret of the repository.

      **－** The test pull request is closed without a merge, so `main` takes no commit before `plugin`
      closes.'
