  text: decision[case 786.2][update][estimate-prespec-checks-the-form-of-an-item]{ref:rule-prespec}
  case: '786.2'
  kind: update
  slug: estimate-prespec-checks-the-form-of-an-item
  origin: raw/2026-10-12/2349/ledger.md#case-786.2
