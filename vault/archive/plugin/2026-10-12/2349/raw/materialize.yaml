  sections:
    Criterion: 'When:

      `SubagentStop` fires when `case-guppi` stops after it wrote or edited `raw/<date>/<hi HHMM>/cases/case-<N>.md`,
      and `uv run guppi casecheck --subagent` reads the Cases of that file, the decision lines of the
      session''s `raw/<date>/<hi HHMM>/ledger.md`, and `<plan>.checked.json` beside the plan file.


      Then:

      For a file that holds a top-level Case N, the hook reads the decision lines of a kind other than
      `defer` in the session''s ledger that belong to the family of Case N, which is Case N and its sub-cases
      at any depth.

      **＋** Case N gets a finding when a number of its family that has such a line has no section in the
      file, or when a number that has such a line has a sub-case in the file.

      **＋** The finding names each such number and a new id of the sprint of Case N: one above the highest
      number of that sprint that the Decision pages under `vault/wiki/decisions/` and `vault/archive/`,
      the decision lines of the session''s ledger, the keys of `<plan>.checked.json` and the names of
      the files under `raw/<date>/<hi HHMM>/cases/` hold.

      **＋** The judgment comes from one function of `guppi/casecheck.py`, and the new id from `next_id`
      of `guppi/caseid.py`, which the command for the next id runs too.

      **＋** The finding tells `case-guppi` to build the Case under the new id. Its decision lines carry
      one `{supersedes:case N}` for the number N, and one `{supersedes:case M}` for each number M of the
      family that has a decision line.

      **＋** The hook exits 2 with the finding on stderr, and `case-guppi` fixes the file or writes the
      Case under the new id.

      **－** An answer on the old path that holds sub-cases of Case N without Case N gets no finding of
      this check.

      **－** A Case whose family has no decision line other than `defer` in the session''s ledger gets
