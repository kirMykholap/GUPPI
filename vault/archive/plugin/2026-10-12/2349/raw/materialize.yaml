      Findings of `/pre-spec`. A merge Case may set several Estimates `pending`. Each `update` that sets
      one counts as a new Criterion, so two of them in one Case are two promises. The glossary row of
      an Estimate says its Criterion is the `when` and `then` of one Case. So the merge Case sets each
      such Estimate `pending` by a sub-case of its own, whose `when` and `then` are that Criterion as
      the page holds it. A path that `git checkout --theirs` takes stays unmerged until `git add`, so
      the merge Case runs `git add` on each conflicted path before its commit. Git keeps both sides of
      `log.md` and `tags.md` by a `merge=union` line in `.gitattributes`, the merge driver that git has
      built in. No rule page governs `.gitattributes`: a Grep `gitattributes` over `vault/wiki/` printed
      only `rule-shell-write-check.md`, which names the file and does not render it. The exception texts
      name these two files beside the joined text. `rule-default-mode` keeps a session from writing anything
      before a Case is ratified, and a `git fetch` writes into `.git/`. So before the merge Case `/merge-main`
      only reads. It takes the commit of `main` and the files `main` changed by `gh api`, and the files
      the branch changed by `git`. The fetch, the merge and all that needs them run in Work Mode. Without
      a merge before the Case, the merge Case cannot know which files git will leave in conflict. So it
      holds a joined text for each file that both sides changed, and Work Mode writes that text whether
      or not git left the file in conflict. Case 789.3 now names the tasks of a merge Case of `/merge-main`
      in the sixth condition of `rule-where-to-stop`. A refused `git` command there is a stop, and so
      is a file left in conflict that the merge Case does not settle. This Case leaves that condition
