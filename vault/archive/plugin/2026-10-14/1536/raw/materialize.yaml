  category: estimates
  set:
    status: pending
    purpose: Whether every reader of a Case id takes an id that carries its sprint and a plain id from
      before sprint ids alike, and guppi caseid --next --session <stamp> prints and holds the next id
      of the open sprint, which the main agent runs only for the id of a new top-level Case and never
      to check an id, and prints no id without --session or without the plan file of the session
    method: 'uv run pytest tests/test_caseid.py; by hand at the Retro of this session: the new Render
      of rule-orchestration in raw/<date>/<hi HHMM>/spec.md, and the Render of rule-ratification, read
      against the Criterion'
  sections:
    Criterion: 'When:

      `guppi/casecheck.py`, `guppi/ratified.py`, `guppi/lint.py`, `guppi/gate.py` or `guppi/materialize.py`
      reads a Case id in a ledger line, a heading of a Case file, a file name `case-<id>.md` or an `origin`.

      **＋** The main agent, with `vault/wiki/orchestration.md` rendered from `rule-orchestration`, runs
      `uv run guppi caseid --next --session <stamp>`, `<stamp>` the stamp of the `hi:` line of its session,
      before it dispatches a new top-level Case.

      **＋** Or `uv run guppi caseid --next` runs without `--session`, or with a stamp whose session has
      no plan file.


      Then:

      A Case id of a sprint opened after case 788.2 is the sprint id, a hyphen and the number of the Case
      in that sprint, from 1, with a dot for each sub-case level, such as `kir-plugin-12.1`, and its Case
      file is `case-<id>.md` of its top-level Case.

      **＋** The readers read a Case id through `guppi/caseid.py`, which takes both forms and reads the
      sprint id as the text before the last hyphen ahead of the number.

      **＋** The sprints `migration` and `plugin`, opened before case 788.2, keep plain ids to their close,
      by a fixed list in `guppi/caseid.py`.

      **＋** The main agent creates the plan file of its session with its title line before its first run
      of the command.

      **＋** `uv run guppi caseid --next --session <stamp>` takes the open sprint from the `create` decision
      line of a sprint page in `raw/<date>/<hi HHMM>/ledger.md` of the session of that stamp, else from
      the first heading of `vault/wiki/sprint.md`, and prints the next id of that sprint.

      **＋** It holds the id it prints in `<plan>.checked.json` of the plan file of that session, under
      that id, with no `agent_id` and no text, so that the next run prints the id after it.

      **＋** The main agent dispatches each new top-level Case with the id that the command printed, but
      the opening Case of a sprint, whose id `/sprint-open` sets.

      **－** The main agent runs the command only to get the id of a new top-level Case, once for each
      Case, and never to check an id or what the store holds, since each run holds a new id.

      **－** Without `--session` the command prints no id: it prints its usage error and exits 2.

      **－** With a stamp whose session has no plan file, the command prints no id, holds nothing, prints
      one line on stderr and exits 1.

      **－** An id with no sprint part, such as `785.1`, stays a Case from before sprint ids, and no page,
      file or citation is renamed.'
  change: the Criterion replaced whole — the main agent runs guppi caseid --next only for the id of a
    new top-level Case, never to check an id
  applied: '18:06:16'
