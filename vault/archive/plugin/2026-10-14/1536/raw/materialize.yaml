    slug: estimate-ratification-case-id-carries-the-sprint
    ref: rule-ratification
  tags: []
  case_text:
    context: '`uv run guppi caseid --next --session <stamp>` has one mode: each run prints the next free
      id and holds it in `<plan>.checked.json`, so the next run gets the id after it. In session 0232
      a Case was built again under a number of its own, and the main agent ran the command to check that
      the number was held; that run held 813, which no Case used (`lesson-caseid-run-to-check-an-id-held-a-new-one`,
      handoff of session 0232). The check was never needed: the guard `guppi ratified --guard` of `guppi/ratified.py`
      holds the number at the first call of a `case-guppi` on its case file (docstring of `guppi/casecheck.py`,
      case 650.1). `rule-orchestration` says when the main agent runs the command, before the dispatch
      of a new top-level Case, but not that it runs it for nothing else. The person chose one sentence
      in that Render and no new mode of the command, so `guppi/caseid.py` and its tests do not change.
      The rule that governs the change is `rule-orchestration` itself; no rule forbids it. `estimate-ratification-case-id-carries-the-sprint`
      already promises when the main agent runs the command, so its Criterion is replaced whole: every
      line it holds is kept, one `－` line is added, and its `purpose` and `method` are set anew, since
      the `purpose` names the use of the main agent and the `method` named a new Render of `rule-ratification`,
      which this Case does not change. A Grep `caseid` over `vault/wiki/` (Decision pages left out) printed
      13 files: `brief.md`, `log.md`, `orchestration.md`, `ratification.md`, `rules/rule-orchestration.md`,
      `rules/rule-ratification.md`, `lessons/lesson-caseid-run-to-check-an-id-held-a-new-one.md`, `insights/insight-caseid-printed-an-id-it-did-not-hold.md`,
      `estimates/estimate-ratification-case-id-carries-the-sprint.md`, `estimates/estimate-orchestration-shows-the-built-case.md`,
      `estimates/estimate-case-check-sends-back-a-case-number-held-by-another-agent.md`, `estimates/estimate-case-check-sends-back-a-ratified-case-in-another-shape.md`
      and `estimates/estimate-spec-box-refuses-a-stale-spec.md`; the same Grep over `.claude/` printed
      nothing. None of them is made false: `ratification.md` says what the command does, which stands;
      the Criterion of `estimate-orchestration-shows-the-built-case` names the command for the Work Mode
      dispatch of a new top-level Case, which the new sentence keeps; the two `case-check` Estimates speak
      of the count and of an id the command holds; `estimate-spec-box-refuses-a-stale-spec` names `guppi/caseid.py`
      as a reader of ids; the Insight speaks of a run with no plan file. `tests/test_orchestration.py`
      reads the live `orchestration.md`, but only its blocks tagged `showing` and `defer` by `example`,
      and the new sentence stands outside them. The decision lines carry no `{addresses}` mark: the lesson
      line stands in the ledger of session 0232, and a lesson whose fix is ratified in another session
      gets no mark (`ratification.md`).'
    problem: '`orchestration.md` does not tell the main agent that each run of `guppi caseid --next` holds
      a new id, so the agent ran it to check an id and held one that no Case uses.'
    recommend: "- **How do we stop a run that only checks from holding an id?**\n  - Recommended: (a)\
      \ a sentence in `orchestration.md` only: the main agent runs the command only to get the id of a\
      \ new top-level Case, once for each Case, and never to check an id; no code changes.\n  - Answer:\
