  sections:
    Criterion: 'When:

      After a live run, the librarian commits at the close, as `.claude/agents/librarian-guppi.md` says,
      with the list that `uv run --project .guppi guppi render --paths` prints.


      Then:

      `uv run --project .guppi guppi render --paths` prints each file that `guppi render` writes, one
      path per line, and writes nothing.

      **＋** `git log` shows one commit after the Retro commit, separate from the session''s, with the
      message `docs(vault): librarian, <date>`, and never `--amend`.

      **＋** The commit takes `vault/` and each file of that list: `git add vault $(uv run --project .guppi
      guppi render --paths)`.

      **＋** After the commit, `git status` shows no file that `.guppi/guppi/render.py` wrote as modified
      or untracked.

      **＋** The report reaches the main agent with the counts, the flags and the lint total, in twenty
      lines or fewer.

      **－** The commit takes no path that neither `vault/` nor that list names.

      **－** In a project without `rule-plugin-install`, the list and the commit name no `plugin/skills/install/SKILL.md`.'
