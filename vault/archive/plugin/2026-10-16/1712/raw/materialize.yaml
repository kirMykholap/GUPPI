      whose `Branch:` line names a branch. A `－` line leaves the `/hi` that reads `none: this folder is
      no git repository` out of this promise. `estimate-git-context-offers-git-init` already checks that
      `/hi`, and that the next `/hi` starts `/sprint-open`. Nothing is signed twice (`rule-case-protocol`),
      so this Estimate does not repeat the git step. The `When` says that the person types `/hi` again
      after the git step where the folder has no git, so that the Criterion reads without the Case. Two
      lines change: the `＋` line of the `When` on the install and `/hi`, and the last `＋` line of the
      `Then` on the first `/hi`. The other lines keep their words. The `purpose` names the old promise,
      so it is set anew in the same `update`. The `method` is set anew too. Its hand reading waits for
