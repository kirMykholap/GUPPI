  sections:
    Criterion: 'When:

      `uv run --project .guppi guppi ship <folder>`, as `rule-clean-branch` sets it, builds the clean
      version of the project from its working tree into an empty folder.

      **＋** Or, in an empty project, the person installs the plugin `guppi` from such a copy, types `/guppi:install`,
      reopens Claude Code there and types `/hi`, and types `/hi` again after the git step of `rule-git-context`
      where the folder is no git repository.


      Then:

      It writes `vault/wiki/sprint.md` as `closed_form` of `.guppi/guppi/sprint.py` writes it for the
      sprint `guppi`, so its first `## ` heading carries the mark of a closed sprint.

      **＋** It writes `vault/wiki/backlog.md` and `vault/wiki/glossary.md` as `guppi backlog` and `guppi
      glossary` write them over the clean version, by their own code.

      **＋** It writes a `vault/wiki/brief.md` whose `Cases` of its `## Next session` open with the line
      `open the next sprint — no sprint is open since the close of guppi`, and a `vault/wiki/log.md` that
      holds its heading and the paragraph under it alone.

      **＋** Over the clean version, `guppi sprint --check`, `guppi backlog --check` and `guppi glossary
      --check` print nothing and exit 0.

      **＋** In that project, the first `/hi` whose `Branch:` line, the output of `uv run --project .guppi
      guppi gitstate`, names a branch starts `/sprint-open` before the Frontier.

      **－** A `/hi` whose `Branch:` line reads `none: this folder is no git repository` is no part of
      this promise.

      **－** It writes no `sprint.md`, `backlog.md`, `brief.md`, `glossary.md` or `log.md` of the project
      it builds from.'
  applied: '19:40:42'
