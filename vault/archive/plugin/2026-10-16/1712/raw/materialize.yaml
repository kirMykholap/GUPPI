      The `How it works` of `rule-git-context` tells the history of the git error and stands. `rule-plugin-install`
      says that the first `/hi` renders the harness, which this Case does not touch. `rule-morph` is `draft`,
      and its setup Case, which comes at the first `/hi` before the first sprint, is not built. Case 851
      set the git step before it, and this Case does not change that order. `estimate-morph-sets-up-the-project-at-the-first-hi`
