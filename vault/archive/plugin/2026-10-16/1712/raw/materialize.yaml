      The third `/hi` of that reading is the first `/hi` in a git repository. Both readings belong to
      the install session that Frontier item C3 plans, after that run, and this Case does not take up
      C3. Keeping the Criterion and narrowing only the method was turned down: the words would still promise
      the first `/hi` in any empty project. Dropping the line was turned down too: this Estimate would
