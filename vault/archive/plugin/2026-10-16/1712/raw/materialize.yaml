- case: '856.1'
  decision: decision-case-856.1
  origin: raw/2026-10-16/1712/ledger.md#case-856.1
  targets:
  - kind: update
    category: rules
    slug: rule-rules-schema
    ref: rule-rules-schema
  - kind: update
    category: rules
    slug: rule-entities-schema
    ref: rule-entities-schema
  - kind: update
    category: rules
    slug: rule-ratification
    ref: rule-ratification
  - kind: update
    category: estimates
    slug: estimate-clean-branch-ships-neutral-texts
    ref: rule-clean-branch
  tags: []
  case_text:
    given: '`rule-rules-schema`: its Render, `vault/wiki/rules/schema.yaml`, describes the field `core`.

      **＋** `rule-entities-schema`: its Render, `vault/wiki/entities/schema.yaml`, describes the field
      `core`.

      **＋** `rule-ratification`: its Render, `vault/wiki/ratification.md`, says which sprints keep plain
      Case ids.

      **＋** `.guppi/guppi/ship.py`: `guppi ship`, which writes the clean version and removes a bracket
      that holds a pointer.

      **＋** `.guppi/guppi/caseid.py`: holds the list `PLAIN_SPRINTS`.

      **＋** `estimate-clean-branch-ships-neutral-texts`: read again, its Criterion unchanged.

      **＋** `rule-case-protocol`: a pointer in the new text of a page with `core: true` stands in a bracket
      at the end of its sentence.'
    when: Someone reads `vault/wiki/rules/schema.yaml`, `vault/wiki/entities/schema.yaml` and `vault/wiki/ratification.md`
      in the repository of GUPPI, and in the clean version that `uv run --project .guppi guppi ship --allow-draft
      <folder>` writes into an empty folder.
    then: 'Both schemas call `core` the mark of a part of GUPPI, which `guppi ship`, run in the repository
      of GUPPI, writes into the clean version that others install, and say that a page without the mark
      belongs to the repository that holds it.

      **＋** `vault/wiki/ratification.md` says that the sprints that `PLAIN_SPRINTS` of `.guppi/guppi/caseid.py`
      lists keep plain Case ids to their close.

      **＋** In the repository of GUPPI, a bracket at the end of that sentence names the sprints `migration`
      and `plugin` beside its pointer.

      **－** The clean version holds no such bracket, since `guppi ship` removes it whole.'
    context: '`guppi ship` builds the clean version of GUPPI that a project installs. It writes each rule
      and entity with `core: true`, the files rendered from them, and each `passed` Estimate of those
      pages whose `method` names no target of the `Makefile` (`ships` of `.guppi/guppi/ship.py`, lines
      359–367). A sentence there that holds only in the repository of GUPPI misleads that project. The
      reading of `estimate-clean-branch-ships-neutral-texts` at the `/hi` of session 0342 (line 2 of `vault/raw/2026-10-16/0342/ledger.md`)
      failed on three such sentences. Two are the description of the field `core` in the Render of `rule-rules-schema`
      and of `rule-entities-schema`, which ends "a page without it stays in this repository only". The
      third is the sentence of the Render of `rule-ratification` that says the sprints `migration` and
      `plugin` keep plain Case ids to their close. The reading also listed four shipped Estimates. `estimate-skill-sprint-close-migration-merged-into-main`
      describes one past event, the merge of `migration` into `main`. The methods of `estimate-sprint-close-archives-done-insights-and-lone-lessons`,
      `estimate-sprint-close-archives-the-decisions` and `estimate-sprint-close-archives-the-sprint-page-and-keeps-the-rest`
      preview `--sprint migration`. The handoff of session 0342 says that the reading was a keyword grep
      and not a read of every sentence.


      Case 856.1 rewrites the three sentences, and Case 856.2 deals with the four Estimates. Case 856.3
      takes up `decision-case-828`, which put off a fix of `rule-rules-schema`. The Render of that page
      still says that a page with `core: true` comes into a new project without its Estimates. That is
      false since `guppi ship` writes those Estimates (the Purpose of `rule-clean-branch`, as set in case
      822); an Estimate whose `method` names a target of the `Makefile`, such as `estimate-harness-pipeline`,
      stays in the repository of GUPPI, so the new sentence names that limit. The new wording of `core`
      follows Case 824, which named "the repository of GUPPI" where a shipped page meant this repository.
      The new sentence of `rule-ratification` names the list `PLAIN_SPRINTS` of `.guppi/guppi/caseid.py`,
      which ships. The two sprint names go into a bracket with the pointer to case 788.2, and `guppi ship`
      removes that bracket whole, as `rule-clean-branch` and `case-schema.md` (case 807.4) set it for
      the new text of a page with `core: true`. Each new text keeps its pointer in a bracket at the end
      of its sentence.


      `estimate-skill-sprint-close-migration-merged-into-main` is deleted. Its rule, `rule-skill-sprint-close`,
      now says that the closing Case holds no task line for the merge, and `estimate-skill-sprint-open-merges-the-closed-sprint-branch`
      (`passed`) checks the merge as it works today, with a merge commit and not a fast-forward. A `delete`
      sets the page `archived` (`delete` of `.guppi/guppi/generate.py`) and does not touch the `estimates`
      of its target, so Case 856.2 sets that field on `rule-skill-sprint-close`. The three methods change
      by `set` alone, so their Criterion and their `passed` status stand.


      How each sub-case is checked: Case 856.1 reads `estimate-clean-branch-ships-neutral-texts` again.
      Its Criterion stands, since it already promises the change, and it is written back unchanged with
      the status `pending`. Its method is set anew so that the reading waits for the librarian''s run
      of this session, where the pages change, and reads each sentence whole. Case 856.2 rests on the
      same reading: the fourth `Then` line of that Criterion has the reader list each sentence of a shipped
      Estimate that holds only in the repository of GUPPI, and Case 856.2 is checked when that list holds
      no sentence of the four Estimates it changes; the known line of `estimate-ratification-case-id-carries-the-sprint`
      may stay on the list for a later Case. Case 856.3 replaces the Criterion of `estimate-rules-schema-checked`,
      whose `description` line names the old sentence. `estimate-entities-schema-checked` and `estimate-rules-schema-checked`
      name the description of `core` only as a name described in `fields`, so Case 856.1 leaves them alone.
      One line of the Criterion of `estimate-ratification-case-id-carries-the-sprint` says that the sprints
      `migration` and `plugin` keep plain ids by a fixed list in `.guppi/guppi/caseid.py`. That line stands:
      it is true of the code that ships, and the person chose to leave it for the next reading to list.
      `estimate-ratification-loaded` promises only that the file equals the Render.


      Searches. A Grep for `without its Estimates|stays in this repository only|keep that form to their
      close` over the repository outside `vault/raw/` and `vault/archive/` printed nine files: `vault/wiki/ratification.md`,
      `vault/wiki/rules/schema.yaml`, `vault/wiki/entities/schema.yaml`, `vault/wiki/estimates/estimate-clean-branch-ships-neutral-texts.md`,
      `vault/wiki/rules/rule-ratification.md`, `vault/wiki/rules/rule-rules-schema.md`, `vault/wiki/estimates/estimate-rules-schema-checked.md`,
      `.guppi/guppi/caseid.py` and `vault/wiki/rules/rule-entities-schema.md`. The three rendered files
      follow the render. The docstring of `caseid.py` names the sprints of `PLAIN_SPRINTS` and not the
      two sprints, so it stands. The Result of `estimate-clean-branch-ships-neutral-texts` quotes the
      old sentences as its reading and stands. A Grep for `estimate-skill-sprint-close-migration-merged-into-main`
      over the same paths printed `vault/wiki/log.md`, `vault/wiki/estimates/estimate-clean-branch-ships-neutral-texts.md`
      and `vault/wiki/rules/rule-skill-sprint-close.md`. The log and the Result are records and stand,
      and the `estimates` field of the rule enters Case 856.2. A Grep for `ratification\.md|rules/schema\.yaml|entities/schema\.yaml|rule-ratification|rule-rules-schema|rule-entities-schema`
      over `.guppi/tests/` printed `test_ledger.py`, `test_materialize.py` and `test_ship.py`, which read
      a string or a copy under a temporary folder. `.guppi/tests/test_schemas.py` builds the path of the
      live `schema.yaml` from the category and reads only its lists, which no sub-case changes.'
  parent: decision-case-856
  spec: vault/raw/2026-10-16/1712/spec.md
  applied: '19:40:42'
