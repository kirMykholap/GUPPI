  text: decision[case 881.10][update][rule-search-leaves-out-decisions]{ref:rule-search-leaves-out-decisions}
  case: '881.10'
  kind: update
  slug: rule-search-leaves-out-decisions
  origin: raw/2026-10-17/2307/ledger.md#case-881.10
  decision: decision-case-881.10
  ref: rule-search-leaves-out-decisions
  category: rules
  sections:
    Purpose: Prevents the text of a Decision page from entering the context of the main agent, `ask-guppi`
      or `case-guppi` through a search of the vault. A Decision page states a Case at its moment, and
      the folder holds a page per Case, so a search over the whole wiki that does not leave them out fills
      the context with them. The Grep tool reads a glob that holds a slash from the working directory,
      the root of the project, and not from the folder it searches, so `!decisions/**` over `vault/wiki/`
      leaves nothing out (case 640). The rule stands in one file under `.claude/rules/`, which Claude
      Code loads into the context of every agent with no `paths:` to scope it (in the reading of session
      1343). The file alone does not keep the Decision pages out of a Grep, so a `PreToolUse` hook on
      Grep adds the exclusion at the end of the glob, in every agent, the librarian too; a Grep inside
      `vault/wiki/decisions/` it leaves unchanged, and the file keeps the rule on reading a Decision page
      (nine Greps over the wiki carried no exclusion, and one put it first, where it leaves nothing out,
      in the reading of session 1343, case 664.1). The librarian follows its own frame, which flags such
      a read rather than forbids it; the hook filters its Greps over the wiki too, and a read of a Decision
      page it needs stays open to it (case 664.1).
  change: the Purpose gives the reasons of the rule, its trials in brackets, and names no lesson
  applied: 00:25:10
