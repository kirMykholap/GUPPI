    given: '`rule-page-generation`: the rule of `guppi generate`, whose Purpose changes.

      **＋** `.guppi/guppi/generate.py`: `Vault.decision` and the module docstring.

      **＋** `.guppi/tests/test_generate.py`: the tests of the Decision page.

      **＋** `estimate-generate-writes-the-decision-page`: its Criterion is replaced whole.

      **＋** `.guppi/guppi/materialize.py`: the module docstring on what a `supersedes` mark makes.

      **＋** `rule-decisions-schema`: the field `status` of its Render changes.

      **＋** `vault/wiki/decisions/schema.yaml`: the file rendered from it.

      **＋** `entity-glossary`: the row `Decision (status)` changes.

      **＋** `vault/wiki/glossary.md`: the file rendered from it.

      **＋** `vault/wiki/decisions/decision-case-<N>.md`: the Decision pages that `guppi generate` writes
      and supersedes.

      **＋** `vault/archive/`: the folder where an archived earlier Decision page may stand.

      **＋** `vault/wiki/log.md`: the feed of page changes that `guppi generate` appends to.'
    when: '`uv run --project .guppi guppi generate` reaches the first entry of a Case in `materialize.yaml`,
      or a `decisions` record with no page yet.'
    then: 'One page `vault/wiki/decisions/decision-case-<N>.md` is written: `case`, `status: current`,
      one list per kind present — `create`, `update`, `delete`, `defer` — the slugs in ledger order; `source`
      when a line carries one; `supersedes`; `origin`, `sprint`, `created`; `tags`, the union of the targets''
      tags; the body `## Problem` and `## Recommend` from `case_text` when it carries them, and `## Deferred`
      with one `### [[slug]]` per target of a `defer` line and its `purpose` verbatim.

      **＋** A record with `children`, a Case with sub-cases, gets its page before the pages of its sub-cases,
      with `children` their pages as quoted wikilinks, `tags` the union of theirs and no kind list; each
      page of a sub-case carries `parent`, its parent''s page.

      **＋** A record with no `children` whose `case_text` carries no `given` — the short form of a deferred
      decision — also gets `## Context` from `case_text`, before `## Problem`.

      **＋** The page is written before the first entry of its lines, so their History lines name it.

      **＋** A `supersedes` sets the earlier page `superseded`, unless it stands `archived`, and appends
      to its `superseded_by`, and does the same to each page in the `children` of the earlier page, at
      any depth, that stands `current`, a page of an earlier session too. It removes the earlier slug
      from the `deferred_by` of each target of its `defer` list that a decision line of the superseding
      Case names; an empty `deferred_by` is dropped.

      **＋** An earlier page that stands `archived`, under `vault/archive/` or under `vault/wiki/decisions/`,
      keeps `status: archived` and its place; it takes the new page into its `superseded_by` with one
      History line `superseded by decision-case-<N>`, and it removes the earlier slug from the `deferred_by`
      of each target of its `defer` list that a decision line of the superseding Case names, as for a
      page that stands `current`.

      **＋** A target of the earlier page''s `defer` list that no decision line of the superseding Case
      names keeps the earlier slug in its `deferred_by`; neither does a page reached only through `children`
      clear a `deferred_by`.

      **＋** An existing page is skipped; a `create` marked `exists` writes no page, but the Decision page
      of its Case is written.

      **＋** A record with `superseded_by` and no `case_text` gets a two-line body: `## Context` `Superseded
      by [[decision-case-M]] in its own session, before the Spec was approved; the Case left the Spec
      (case 299).`, `## Problem` `Decided under [[decision-case-M]].`

      **－** The page holds no `## Given`, no `## When` and no `## Criterion`, and no `## Context` when
      `case_text` carries `given` or the record carries `children`.

      **－** The Decision pages already written are not rewritten.

      **－** A page whose `superseded_by` already names the new page gets no second History line and no
      second line in `vault/wiki/log.md`, whether an earlier run put the name there or an earlier step
      of the same record did, such as a sub-case page reached through the `children` of its parent and
      named in `supersedes` too.

      **－** A page in `children` that stands `archived` or `superseded` is left as it is.

      **－** The page of a sub-case carries no `## Problem`, and a `case_text` with no `recommend` gives
      no `## Recommend`.

      **－** A record that carries `superseded_by`, a Case that a later Case retired, still gets its page
      with its `supersedes`, but that `supersedes` changes no other page: no earlier page or page in its
      `children` changes `status` or takes the record into `superseded_by`, no target loses a `deferred_by`,
      and no History line and no line of `vault/wiki/log.md` names the retired page for such a change.'
