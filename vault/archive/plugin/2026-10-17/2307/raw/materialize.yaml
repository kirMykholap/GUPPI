  case_text:
    context: 'At the close of a sprint, `old_logs` of `.guppi/guppi/sprint_close.py` picks the event logs
      that move from `vault/raw/<date>/` to the archive. It takes the newest session folder by `session_of_run`
      of `.guppi/guppi/materialize.py`, whose date is the date of the `/hi` of that session, and moves
      each log dated before the day before that date. It never reads when the session started. The hooks
      of a session read its logs through `session_event_logs` of `.guppi/guppi/ledger.py`, and after Case
      884 that walk reaches back past a later resume to the `startup` or `fork` start line of the stamp.
      So a session that started two or more days before its `/hi` would lose the logs of its first days
      at a close, and the texts that give the reason as the day before become false. This session opened
      with `/hi` on 2026-10-17 and runs on 2026-10-25: its folder is `vault/raw/2026-10-17/2307/`, and
      a close today would keep the logs from 2026-10-16 on, so the gap does not hit this session. I read
      `old_logs`, `move_logs`, `empty_raw` and `run` of `sprint_close.py`, `session_of_run` of `materialize.py`,
      and `session_event_logs`, `hi_moment` and `session_dir` of `ledger.py` whole. The two judgments
      of the window part on a session whose start line stands two or more days before the date of its
      folder: `old_logs` keeps the logs from the day before the folder date, `session_event_logs` reads
      from the start date. The person chose that the close asks the window of the hooks: it finds the
      stamp whose `hi` line `session_dir` takes to the newest session folder, and keeps the logs from
      the first date `session_event_logs` gives for that stamp. So the close imports both functions from
      `ledger.py` and holds no second copy of the window, as `rule-one-judgment-one-implementation` sets
      it. A Grep of `def \w*(stamp|hi_line|of_folder|folder_stamp|session_id)\w*` over `.guppi/guppi/`
      printed `session_stamp` of `.guppi/guppi/event.py` and `stamp` of `.guppi/guppi/spec.py`, and neither
      maps a session folder to its stamp. Without a session folder, or where no stamp or more than one
      leads to it, the close moves no log and says why on stdout, by the person''s choice.


      A tool line of this session whose text held the stamp and the word `session-start` cut its window
      once on 2026-10-25, since `session_event_logs` searched the whole text of a log. The person removed
      that line by hand, and Case 884, built again, makes the walk end only at a start line read by its
      form. This Case rests on that walk, so its test with a resume on a later date runs after the task
