- kind: create
  category: insights
  slug: insight-ledger-window-ends-at-any-start-text-of-the-stamp
  origin: raw/2026-10-17/2307/ledger.md#L26
  fields:
    type: insight
    pattern: '`session_event_logs` of .guppi/guppi/ledger.py ends its walk back from today at the first
      date whose log holds the stamp and the word session-start in any form, not at the startup or fork
      start line of the session, so a later resume or a logged tool line cuts the window and every reader
      of it loses the hi of the session'
    children:
    - lesson-ledger-window-stops-at-a-resume-on-the-next-day
    - lesson-session-window-cut-by-a-resume-on-a-later-date
  tags:
  - ledger
  - session
  - hooks
  sections:
    Pattern: Two lessons, one cause. Session 44ee5004 (hi 2026-10-14) was resumed on 2026-10-15, and session
      392fc00e (hi 2026-10-17) was resumed on 2026-10-24; each time `session_event_logs` stopped at the
      date of the resume line, the window no longer held the hi, and the ledger hook or `guppi caseid`
      lost the session until the person removed the line by hand.
    Proposal: Read the start of a session from its startup or fork start line by its form alone, and test
      a later walk against a resume, a compaction and a logged tool line on a later date. A suggestion,
      not a decision.
  librarian: synthesis
  applied: 00:25:10
