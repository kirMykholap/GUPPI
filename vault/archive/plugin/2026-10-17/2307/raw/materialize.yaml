      names that Criterion and its method as waiting for a Case of their own. The Purpose of `rule-sprint-close`
      says the close moves the event logs that the hooks of the open session no longer read. The fix makes
      that true, so it stands. The sentence of `rule-raw-archive` on the logs dated before the day before
      the session of the run becomes false, and a pair replaces it. A Grep of `day before` over `vault/wiki/`,
      `.claude/` and `.guppi/guppi/` printed `vault/wiki/orchestration.md` and `vault/wiki/rules/rule-orchestration.md`,
      on a reminder of an example Case, which stand; `vault/wiki/rules/rule-raw-archive.md`, which the
      pair changes; `vault/wiki/estimates/estimate-sprint-close-moves-old-event-logs.md`, whose Criterion
      is replaced; and `.guppi/guppi/sprint_close.py`, whose docstrings a task changes. A Grep of `rule-raw-archive|sprint-close-moves-old-event-logs|rule-sprint-close`
      over `.guppi/tests/` printed nothing, so no test reads these pages live. The tests of the logs in
      `.guppi/tests/test_sprint_close.py` write made-up logs with no `hi` line, so they change with the
      code.'
    problem: The sprint close keeps the event logs from the day before the date of the `/hi` of the open
      session, while its hooks read back to the date it started, so a session that started days before
      its `/hi` loses logs it still reads.
    recommend: "- **How the close finds the start of the open session**\n  - Recommended: (a) ask the\
      \ window the hooks use: the stamp whose `hi` line `session_dir` takes to the newest session folder,\
      \ and the first date `session_event_logs` gives for it.\n  - Answer: agreed, (a).\n- **When the\
      \ close cannot tell which session is open**\n  - Recommended: (a) move no log, and say so on stdout.\n\
      \  - Answer: agreed, (a).\n- **Where the stop on a tool line is fixed**\n  - Recommended: (a) Case\
      \ 884 fixes it.\n  - Answer: agreed, (a).\n- **How the change is checked**\n  - Recommended: (a)\
      \ replace the Criterion of `estimate-sprint-close-moves-old-event-logs`; keep its purpose and method.\n\
      \  - Answer: agreed, (a).\n- **Whether the Purpose of `rule-sprint-close` changes**\n  - Recommended:\
      \ (a) the Purpose stands; the docstring and `rule-raw-archive` change.\n  - Answer: agreed, (a)."
