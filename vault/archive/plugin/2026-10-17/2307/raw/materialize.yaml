      of `.guppi/guppi/ship.py` writes into an empty folder.
    then: 'For an Estimate, `vault/wiki/estimates/schema.yaml` lists the shorter ledger path as a second
      shape of `origin` that `.guppi/guppi/lint.py` passes, its history in brackets.

      **＋** No text of `rule-estimates-schema` names a former `schema.md`.

      **－** The forms of `method` keep their text.'
    context: '`guppi ship` builds the clean version of GUPPI that other projects install. By `removed`
      of `.guppi/guppi/pointers.py`, which `clean` of `.guppi/guppi/ship.py` calls, it removes each bracket
      that holds a reference to a case, a `decision-case-N` id or a mention of a session by its id, every
      word in it included, and `clean` writes a link to a page the copy does not write as the slug in
      a code span. It cannot fix a sentence that tells the history of GUPPI outside such a bracket, or
      one that names a page or a skill the copy does not hold. `estimate-clean-branch-ships-neutral-texts`
      promises that the rules, the entities and `CLAUDE.md` of the copy, and the `purpose` and `method`
      of each shipped Estimate, hold no sentence true only in the repository of GUPPI; its reading at
      the `/hi` of session 1805, line L1 of `raw/2026-10-17/1805/ledger.md` and the Result of the page,
      failed on ten rules and on the purpose or method of three Estimates, and named doubtful sentences
      besides. Of the three Estimates, `estimate-skill-sprint-close-leads-the-closing-session` got its
      method anew by Case 880.16 after that reading, and Case 880.15 replaced the Criterion of `estimate-ratification-case-id-carries-the-sprint`
      whole, whose purpose, the doubtful text, now names no sprint of GUPPI; neither changes here. By
      the person''s choice the `.gitignore` stays out: the method of `estimate-sprint-close-moves-old-event-logs`,
      the sentence of `rule-event-log` that the event log is gitignored and the row `Event log` of `entity-glossary`
      wait for the put-off of Case 882.3 of this session on `rule-clean-branch`, which takes up the put-off
      of `decision-case-880.21`, leaves to a Case of its own whether the clean version gets a `.gitignore`,
      and names these three texts, so the next reading still fails on that method. The Criterion sentences
      the reading listed fail no part of the promise, by its `－` line, and their rewrite is the Frontier
      item C4; the Renders of shipped rules that name a skill the copy does not hold are the milestone
      item `rule-clean-branch`, as Case 880 bounded them. Each sub-case changes one page in the manner
      of Case 880, by the person''s choice: the history goes into the bracket of its sentence with the
      case it came from, so the copy drops it; a fact is said by its role; a link to a page the copy does
      not hold is dropped; a fact this repository needs stays in a bracket that names the repository of
      GUPPI. The sentences that name `guppi ship` or the `Makefile` stand, by the person''s choice, since
      each says how the copy was made or what the shipped code of lint does: the `make <target>` form
      of `method` in the schema of Estimates is a form that `.guppi/guppi/lint.py` classifies, `core`
      in the schemas is said of the repository of GUPPI, and the bracket rule of `case-schema.md` holds
      in the copy. `check_origin` of `.guppi/guppi/lint.py`, read whole, accepts an `origin` that `ORIGIN_CASE`
      or `ORIGIN_LINE` matches, whose date folder takes an optional `/HHMM`, and then checks that its
      ledger holds the line, so the new text that lint also accepts the date form is true. The rule that
      governs is `rule-clean-branch`, with the rule of `case-schema.md` for the new text of a page with
      `core: true`: each new pointer stands in a bracket of its own at the end of its sentence, and no
      bracket holds a bracket, since `BRACKET` of `pointers.py` takes none. A Grep `/merge-main` over
      `vault/wiki/` printed 20 files; of the shipped rules and entities, `rule-git-context`, `rule-page-generation`,
      `entity-glossary` and `rule-vault-layout` change here, the last, which names it in the same exception
      as `rule-page-generation`, by the person''s answer at `/pre-spec`; `rule-documentation`, `rule-skill-sprint-close`,
      `rule-skill-sprint-open` and `rule-where-to-stop` name it in their Render, which is the milestone
      item. The Criterion of `estimate-vault-layout-holds`, the Estimate of `rule-vault-layout`, holds
      no word on who writes `wiki/`, by a Grep `merge|by hand|written` over its page that printed nothing,
      so it stands. The other sentences found in the pages read stand: the old path of `rule-case-check`
      in `rule-spec-reconcile` holds in the copy while `.guppi/guppi/casecheck.py` keeps it, and the sections
      of the schema of decisions that only older pages carry say what a page may hold. Of the Estimates
      of the changed pages, a Grep `ourteen|not rows` over `vault/wiki/estimates/` printed `estimate-clean-branch-ships-neutral-texts.md`,
      in its Result, `estimate-harness-pipeline.md`, whose Criterion names the plugin skill among the
      rules of the Purpose of `rule-harness`, and `estimate-glossary-terms-defined.md`, whose `－` line
      says that the terms the Purpose names as not rows stand in no row; both Criteria stay true, since
      this repository keeps both texts inside the bracket. A Grep `former|before 2026-09-13|before sprint
      ids|limit lifted|Not rows|PROJECTS-GUPPI|Fourteen|second name|weighed` over `.guppi/tests/` printed
      nothing. The tests that read a changed file live: `test_schemas.py`, `test_generate.py` and `test_materialize.py`
      read the lists and the keys of each live `schema.yaml`, which no sub-case changes; `test_live_build_of_this_repository_prints_no_line_on_a_shipped_page_of_the_checks`
      of `test_ship.py` fails on a `ship:` line on an Estimate, and the two new methods hold no pointer;
      `test_no_live_page_names_the_old_command_or_path_where_a_reword_changes_it` of `test_guppi_package.py`
      fails on `uv run guppi`, `uv run pytest` or a bare `guppi/` or `tests/` path, which no new text
      holds. An `update` of a `## Purpose` or of a `## Render` sets no Estimate `pending` (case 378.5),
      and no sub-case changes a promise: each is checked by `estimate-clean-branch-ships-neutral-texts`,
      whose Criterion stands, since it already promises what each sub-case does. It stays `failed`; its
      method waits for the librarian''s run of the session of Case 856.1, an event already past, and the
      next `/hi` after the librarian''s run of this session reads it, as the brief lists it under Readings
      due. The two methods that change are parts alone, so their Estimates keep their status and their
      Criterion. `rule-page-generation` and `rule-ledger-write` carry the put-offs of `decision-case-793`
      and `decision-case-876`, on a form of `update` that removes a section and on the walk of the event
      logs; neither sub-case touches them, and Case 884 of this session takes up the put-off of `decision-case-876`,
      by `{supersedes:case 876}`. The files of Cases 882, 883, 884 and 886 of this session, read after
      their builds ended, fit this Case: the defer of 882.3 on `rule-clean-branch` names the method of
      `estimate-sprint-close-moves-old-event-logs`, the sentence of `rule-event-log` and the row `Event
      log` of `entity-glossary` as waiting for a Case on a `.gitignore`; Case 884 takes up `decision-case-876`
      by an `update` of `rule-ledger-write` with only a `change`, which leaves the pairs of 881.16 standing;
      Case 886 replaces the Criterion of `estimate-sprint-close-moves-old-event-logs` and keeps its method,
      which this Case leaves as it is; and the pairs of Case 883 hit other sentences than those of this
      Case — on `rule-page-generation` the sentence on the page of a Case superseded in its own session,
      on `rule-decisions-schema` the field `status`, and on `entity-glossary` the row `Decision (status)`,
      while 881.5, 881.8 and 881.24 change the sentence on the only writer to `wiki/`, the slug, the fields
      `case` and `origin` and the Purpose, and the rows `Librarian` and `origin`, so each `old` of either
      Case still hits its page once. I read the `## Terms` of `entity-glossary` whole around the pairs
      of 881.24 and the file of Case 883 whole: the `old` of the row `Librarian` and of the row `origin`
      each stand once in the table and in no text of 883, and the new rows read beside the new row `Decision
      (status)` of 883 say nothing of a supersede, so they agree with it. `estimate-ratification-case-id-carries-the-sprint`
      reads `vault/wiki/ratification.md` against its Criterion, which says that the sprints `PLAIN_SPRINTS`
      names keep plain ids to their close and that an id with no sprint part stays as it is and is not
      renamed; the new text of 881.7 says both and keeps the sentence that every reader takes both forms,
      so that Criterion stands.'
