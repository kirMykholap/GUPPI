  case_text:
    context: 'Each hook and command that reads the window of a session finds its `hi` and its plan file
      in the daily event logs, through `session_event_logs` of `.guppi/guppi/ledger.py`. That function
      walks the logs back from today and stops at the newest date that holds a start line of the stamp
      of any kind. A resume writes a start line with the same stamp, so a session resumed on a later date
      loses the date of its `hi`: `hi_moment` finds no `hi`, `session_dir` names no folder, and `plan_path`
      names no plan file. This session opened with `/hi` on 2026-10-17 at 23:07:24 and wrote its plan
      file at 23:55:37 (`vault/raw/2026-10-17/event_log.md`, lines 1472 to 1478). The lesson line of the
      session''s ledger, `lesson-session-window-cut-by-a-resume-on-a-later-date`, records the resume on
      2026-10-24 and the run of 2026-10-25 in which `run` of `.guppi/guppi/caseid.py` printed that no
      plan file stood, since `plan_path` gave None. The person removed the resume line by hand. A compaction
      on a later date writes a start line too and cuts the window the same way. The same cause hit session
      `44ee5004` on 2026-10-15 (`lesson-ledger-window-stops-at-a-resume-on-the-next-day`), and `decision-case-876`
      put it off on `rule-ledger-write`: this Case takes up that defer, so its decision line on `rule-ledger-write`
      carries `{supersedes:case 876}`. That mark retires the whole of `decision-case-876`, and the same
      Decision also puts off `rule-orchestration`, whose `deferred_by` names it. So this Case carries
      that put-off over unchanged: a `defer` of `rule-orchestration` with the text of the section of `decision-case-876`
      on that page, and an `update` of `rule-orchestration` with only a `change`, since `generate` clears
      a defer only from the pages the superseding Case names on a line other than a `defer`. The put-off
      stays in `backlog.md`, and `rule-orchestration` changes in no other way.


      The person chose that only a `startup` or a `fork` start line ends the walk. The Claude Code hooks
      page, https://code.claude.com/docs/en/hooks, calls `startup` the start of a new session and `fork`
      a new session forked from an existing one, and says nothing on whether `/clear` keeps the session
      id. A walk that passes a `clear` line is right either way, and is only slower when `/clear` gives
      a new stamp. A resume keeps the stamp: a Grep of `(0f0c3a58|654272af|44ee5004) (session-start|hi)`
      over the `event_log.md` files of `vault/raw/` printed lines in the logs of 2026-10-09, 2026-10-12,
      2026-10-14 and 2026-10-15, where each `resume` line carries the stamp of an earlier `startup` line.
      I read `session_event_logs`, `hi_moment`, `session_dir` and `plan_path` of `.guppi/guppi/ledger.py`,
      `run` of `.guppi/guppi/caseid.py` and `recall` of `.guppi/guppi/recall.py` whole. `hi_moment`, `hi_of`
      of `.guppi/guppi/event.py` and `retro_mark` of `.guppi/guppi/onward.py` each open the window at
      the first start line of the stamp over the logs they get, and the wider walk gives them the start
      of the session.


      No code judges the kind of a start line today: a Grep of `"(compact|resume|startup|clear|fork)"`
      over `.guppi/guppi/` printed `.guppi/guppi/recall.py` alone, whose `SOURCE` judges the `source`
      of a payload, not a line of the log. So the new judgment stays in `.guppi/guppi/ledger.py` beside
      the walk, with no second copy (case 752). The test `test_the_walk_stops_at_the_first_date_holding_this_sessions_start`
      of `.guppi/tests/test_ledger.py` puts a `startup` line on a later date than an older `hi`, and it
      still passes, since a `startup` line still ends the walk. A Grep of `Path\(__file__\)` over `.guppi/tests/`
      printed 8 files, and a Grep of `event_log|session_dir|hi_moment` over those 8 printed nothing, so
      no test reads the live event logs.


      A Grep of `back to the (date|first)` over `vault/wiki/`, with `log.md` and `brief.md` left out,
      printed `estimate-prespec-checks-the-plan.md` and `estimate-prespec-hook-gates.md`. Both say that
      the logs reach back to the date of the session''s start line, and both stand: the start that opened
      the session is still that line. `rule-event-log` says that a `/hi` writes no second `hi` when one
      follows the first start line of the stamp in the logs the ledger hook walks, and this stays true.
      `estimate-ledger-write-lifts` and `estimate-session-start-context` promise that the lines of a session
      opened with `/hi` reach its ledger. Their Criteria stand: the fix makes them hold after a resume
      on a later date, and the new Estimate checks that case. `estimate-event-log-records` promises that
      a `/hi` writes a `hi` line only when no `hi` of the stamp follows its first start line, and that
      a second `/hi` writes nothing and prints `hi: already recorded`. `prompt_line` and `hi_context`
      of `.guppi/guppi/event.py` judge that by `hi_of`, which reads the logs through `session_event_logs`.
      So far a `/hi` after a resume on a later date found no `hi`, and wrote a second one: session `44ee5004`
