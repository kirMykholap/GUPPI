- case: '881.1'
  decision: decision-case-881.1
  origin: raw/2026-10-17/2307/ledger.md#case-881.1
  targets:
  - kind: update
    category: rules
    slug: rule-git-context
    ref: rule-git-context
  tags: []
  case_text:
    given: '`rule-git-context`: its `## How it works` changes.

      **＋** `/merge-main`: the skill of the repository of GUPPI that merges `main` into a sprint branch.

      **＋** `.guppi/guppi/ship.py`: the build of the clean version, which removes each bracket that holds
      a pointer.

      **＋** `estimate-clean-branch-ships-neutral-texts`: the check of the texts of the clean version.'
    when: Someone reads `rule-git-context` in this repository, or its copy in the clean version that `uv
      run --project .guppi guppi ship --allow-draft <folder>` of `.guppi/guppi/ship.py` writes into an
      empty folder.
    then: '`rule-git-context` says that `guppi gitstate` exits 0 in each case, since Claude Code stops
      the whole skill on a `!` command that fails.

      **＋** The git commands that stood on those lines before, and the merge of `main` into a sprint branch
      by `/merge-main`, sit in brackets that the copy drops.'
    context: '`guppi ship` builds the clean version of GUPPI that other projects install. By `removed`
      of `.guppi/guppi/pointers.py`, which `clean` of `.guppi/guppi/ship.py` calls, it removes each bracket
      that holds a reference to a case, a `decision-case-N` id or a mention of a session by its id, every
      word in it included, and `clean` writes a link to a page the copy does not write as the slug in
      a code span. It cannot fix a sentence that tells the history of GUPPI outside such a bracket, or
      one that names a page or a skill the copy does not hold. `estimate-clean-branch-ships-neutral-texts`
      promises that the rules, the entities and `CLAUDE.md` of the copy, and the `purpose` and `method`
      of each shipped Estimate, hold no sentence true only in the repository of GUPPI; its reading at
      the `/hi` of session 1805, line L1 of `raw/2026-10-17/1805/ledger.md` and the Result of the page,
      failed on ten rules and on the purpose or method of three Estimates, and named doubtful sentences
      besides. Of the three Estimates, `estimate-skill-sprint-close-leads-the-closing-session` got its
      method anew by Case 880.16 after that reading, and Case 880.15 replaced the Criterion of `estimate-ratification-case-id-carries-the-sprint`
      whole, whose purpose, the doubtful text, now names no sprint of GUPPI; neither changes here. By
      the person''s choice the `.gitignore` stays out: the method of `estimate-sprint-close-moves-old-event-logs`,
      the sentence of `rule-event-log` that the event log is gitignored and the row `Event log` of `entity-glossary`
      wait for the put-off of Case 882.3 of this session on `rule-clean-branch`, which takes up the put-off
      of `decision-case-880.21`, leaves to a Case of its own whether the clean version gets a `.gitignore`,
      and names these three texts, so the next reading still fails on that method. The Criterion sentences
      the reading listed fail no part of the promise, by its `－` line, and their rewrite is the Frontier
      item C4; the Renders of shipped rules that name a skill the copy does not hold are the milestone
      item `rule-clean-branch`, as Case 880 bounded them. Each sub-case changes one page in the manner
      of Case 880, by the person''s choice: the history goes into the bracket of its sentence with the
      case it came from, so the copy drops it; a fact is said by its role; a link to a page the copy does
      not hold is dropped; a fact this repository needs stays in a bracket that names the repository of
      GUPPI. The sentences that name `guppi ship` or the `Makefile` stand, by the person''s choice, since
      each says how the copy was made or what the shipped code of lint does: the `make <target>` form
      of `method` in the schema of Estimates is a form that `.guppi/guppi/lint.py` classifies, `core`
      in the schemas is said of the repository of GUPPI, and the bracket rule of `case-schema.md` holds
      in the copy. `check_origin` of `.guppi/guppi/lint.py`, read whole, accepts an `origin` that `ORIGIN_CASE`
      or `ORIGIN_LINE` matches, whose date folder takes an optional `/HHMM`, and then checks that its
      ledger holds the line, so the new text that lint also accepts the date form is true. The rule that
      governs is `rule-clean-branch`, with the rule of `case-schema.md` for the new text of a page with
      `core: true`: each new pointer stands in a bracket of its own at the end of its sentence, and no
      bracket holds a bracket, since `BRACKET` of `pointers.py` takes none. A Grep `/merge-main` over
      `vault/wiki/` printed 20 files; of the shipped rules and entities, `rule-git-context`, `rule-page-generation`,
      `entity-glossary` and `rule-vault-layout` change here, the last, which names it in the same exception
      as `rule-page-generation`, by the person''s answer at `/pre-spec`; `rule-documentation`, `rule-skill-sprint-close`,
      `rule-skill-sprint-open` and `rule-where-to-stop` name it in their Render, which is the milestone
      item. The Criterion of `estimate-vault-layout-holds`, the Estimate of `rule-vault-layout`, holds
      no word on who writes `wiki/`, by a Grep `merge|by hand|written` over its page that printed nothing,
      so it stands. The other sentences found in the pages read stand: the old path of `rule-case-check`
      in `rule-spec-reconcile` holds in the copy while `.guppi/guppi/casecheck.py` keeps it, and the sections
