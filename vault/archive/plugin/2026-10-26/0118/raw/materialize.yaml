  text: decision[case 889.2][update][estimate-prespec-onward-tells-the-loop-from-its-end]{ref:rule-prespec-onward}
  case: '889.2'
  kind: update
  slug: estimate-prespec-onward-tells-the-loop-from-its-end
  origin: raw/2026-10-26/0118/ledger.md#case-889.2
  decision: decision-case-889.2
  ref: rule-prespec-onward
  category: estimates
  set:
    status: pending
    purpose: Whether guppi onward --plan, after /pre-spec, names each Case still out and sends the agent
      on with it while one is out, sends the agent to the check and the exit only when no Case is out
      and a file under cases/ that holds more than blank space was written after the last prespec line
      of the session, and on with the loop after the findings when none was; the emptied file of a dropped
      Case counts as none
  change: the Criterion replaced whole — a third reason names each Case still out in place of the silence
  sections:
    Criterion: 'When:

      The `Stop` hook `uv run --project .guppi guppi onward --plan` of `.guppi/guppi/onward.py` receives
      the end of a reply of the main agent that carries a `LEDGER` block, the event log holds a `prespec`
      line of this session after its `hi`, and every other condition holds under which the hook sends
      the agent on.


      Then:

      When a Case is still out, as `rule-prespec-onward` judges it, the hook exits 2 and tells the agent
      that the Cases it names by id were built again and are not ratified yet: to send each one that must
      change to its `case-guppi`, as the loop after the findings of `/pre-spec` sets it. What the agent
      does when only the person can go on, or while a `case-guppi` has not answered, is the text that
      each reason adds, as `estimate-prespec-onward-sends-the-agent-on` sets it.

      **＋** It names each Case still out by the N of its file `case-<N>.md` under `raw/<date>/<hi HHMM>/cases/`,
      found by the one function of `.guppi/guppi/onward.py` that judges whether a Case is still out.

      **＋** When no Case is still out and a file under `raw/<date>/<hi HHMM>/cases/` was written after
      the last `prespec` line of the session, the hook exits 2 and tells the agent that the Cases built
      again on the findings of `/pre-spec` are ratified, to run `uv run --project .guppi guppi prespec
      --check` on the plan file with `--session <id>`, to fix what it prints, and to call `ExitPlanMode`
      when it prints no finding.

      **＋** When no Case is still out and no file under `cases/` was written after that line, the hook
      exits 2 and tells the agent to go on with the loop after the findings of `/pre-spec`: to send each
      finding in a Case to its `case-guppi`, or, when no Case goes back, to run the check and exit as
      above.

      **＋** The hook reads the time of the `prespec` line, on the date of the event log that holds it,
      through the one function of `.guppi/guppi/prespec.py` that `window` uses to find the line.

      **＋** One function of `.guppi/guppi/casecheck.py` tells whether a file under `raw/<date>/<hi HHMM>/cases/`
      holds nothing but blank space, both for this judgment and for the judgment whether a Case is still
      out.

      **－** While a Case is still out, the hook never tells the agent that the Cases built again are ratified,
      and never sends it on with the loop alone.

      **－** A reply that writes a defer or a lesson after `/pre-spec` and before any Case is built again
      never gets the message that the Cases built again are ratified.

      **－** An emptied file under `cases/`, the file of a dropped Case, is never taken for a Case built
      again after the `prespec` line, nor for a Case still out, whatever its time: with no other file
      written after that line, the agent is sent on with the loop after the findings.'
  applied: 02:58:30
