  sections:
    Criterion: 'When:

      `SubagentStop` fires when `case-guppi` answers with a Case, and `uv run --project .guppi guppi casecheck
      --subagent` reads the Cases of the answer, the plan file of the session, `<plan>.checked.json` beside
      it and the session''s `raw/<date>/<hi HHMM>/ledger.md`.

      **＋** Or `.guppi/tests/test_casecheck.py` runs it over a made-up plan file, store and ledger.


      Then:

      The hook judges the Cases of the answer together with the other Cases of the session by `check_same_target`
      of `.guppi/guppi/prespec.py`, imported, not copied: each Case of the plan file, as `estimate-case-check-takes-a-case-built-again-from-its-file`
      sets it for a Case built again after its ratification, and each entry of `<plan>.checked.json` under
      its number alone whose id the plan file does not hold.

      **＋** A Case of the answer whose `update` of a page sets one field to another value than another
      Case, writes a section that another Case writes, or replaces whole the Criterion of an Estimate
      that another Case replaces whole, gets a finding that names both Cases, the page and the field or
      the section.

      **＋** The finding is stored with the Case, the hook exits 2, and `case-guppi` answers again before
      the main agent shows the Case.

      **－** A stored Case that has findings, an entry joined with an agent id, a Case whose number a `{supersedes:case
      N}` mark of the session''s ledger names, and a Case left out as `estimate-case-check-leaves-out-a-case-the-file-supersedes`
      sets are not compared.

      **－** A stored Case whose top-level file `raw/<date>/<hi HHMM>/cases/case-<N>.md` holds nothing
      but blank space is a dropped Case and is not compared, judged by the one function of `.guppi/guppi/casecheck.py`
      that the hook of `rule-prespec-onward` uses too.

      **－** A stored Case whose top-level file `raw/<date>/<hi HHMM>/cases/case-<N>.md` holds text but
      no heading of its id is a part that a Case built again no longer holds, and is not compared; its
      entry stays in the store.

      **－** A Case whose id the answer holds is compared only as the answer holds it, and an answer that
      holds a top-level Case is compared with no part of that Case''s family in the plan file or the store.

      **－** Two other Cases that clash with each other give this answer no finding.

      **－** The `Stop` hook `uv run --project .guppi guppi ratified` keeps its check of the Cases it writes,
      by the same function.'
