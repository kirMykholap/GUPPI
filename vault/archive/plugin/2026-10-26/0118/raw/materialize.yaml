      with a finding held back the four with none; the person ratified 882, 883, 884 and 886 first and
      881 after, and put both matters off by Case 887. The person chose that the check takes such a Case
      as its file holds it, when its stored entry has no finding, in each judgment that reads `other_blocks`,
      so that one list of the other Cases stays, as `rule-one-judgment-one-implementation` sets it; and
      that, when the `Stop` check refuses a showing of a batch for a finding stored with one Case, that
      Case goes back to its `case-guppi` and leaves the batch and the other Cases are shown for ratification,
      in every batch before `/pre-spec` and in the loop after its findings. `rule-case-check` and `rule-orchestration`
