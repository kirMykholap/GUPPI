      checks a file under `raw/<date>/<hi HHMM>/cases/`, while the plan file of the session holds another
      Case that `<plan>.checked.json` holds under its number alone with another text, since it was built
      again after its ratification.
    then: 'The hook takes that other Case as `<plan>.checked.json` holds it, in place of its text in the
      plan file, when its entry holds no finding and the file under `raw/<date>/<hi HHMM>/cases/` of its
      top-level Case holds its heading.

      **＋** It takes it so in each judgment that reads the other Cases of the session through `other_blocks`
      of `.guppi/guppi/casecheck.py`: the clash of two Cases, the order of the `replace` and `reword`
      pairs, the read of the sentence around each pair, and the notes of the cascade.

      **＋** A part of a sentence that a pair of that other Case wrote then counts as read when it stands
      whole in the outputs of the `Read` calls of the subagent on the file of that Case.

