  case_text:
    context: 'After `/pre-spec`, the `Stop` hook `uv run --project .guppi guppi onward --plan` sends the
      agent on where no person is needed, since a reply that carries a `LEDGER` block ends in that text
      and can call no tool. `plan_onward` of `.guppi/guppi/onward.py` returns no reason when `case_out`
      finds a Case still out: a file `case-<N>.md` under `cases/` written after the last decision line
      of Case N. So a batch that the person ratifies in part leaves the Cases still out to no turn. At
      `/pre-spec` of session 2307 the person ratified Cases 882, 883, 884 and 886, Case 881 had to go
      back to its `case-guppi`, the hook said nothing, and the session stood until the person asked what
      came next (`lesson-prespec-loop-stalls-when-one-case-waits-after-a-partial-ratification`, from L55
      of `raw/2026-10-17/2307/ledger.md`). The person chose that the hook sends the agent on in that state
      too, at every reply it sends on today, with a third reason that names each Case still out; the agent
      sends each one that must change to its `case-guppi`, ends the turn as `orchestration.md` sets it
      for a Case out while a `case-guppi` has not answered, or opens its reply with `STOP:` when each
      Case waits only for the person''s word. `rule-prespec-onward` is the rule this touches: its Purpose
      is to keep Plan Mode from stopping where no person is needed, and the chosen option serves it. Two
      sentences of its Purpose change: the one that sends the agent to the check and the exit gains the
      condition that no Case is still out, and the third reason is added after the reason of the loop.
      The Criterion of `estimate-prespec-onward-sends-the-agent-on` lists "no Case is still out" among
      the conditions of exit 2, and the Criterion of `estimate-prespec-onward-tells-the-loop-from-its-end`
      says that a Case built again and not yet ratified keeps the hook silent; the change makes both false,
      so Case 889.1 and Case 889.2 replace each whole, and set anew each `purpose` that states the old
      promise. Each reason carries the text of `ONLY_THE_PERSON` of `.guppi/guppi/onward.py`, which today
      asks for `STOP:` for "a Case still out with its case-guppi"; beside the third reason that would
      tell the agent both `STOP:` and `**Waiting:**` for the same Case (finding F1 of `/pre-spec`), so
      by the person''s choice of the third message that text, and the line of the Criterion of Case 889.1
      that states it, keep `STOP:` for a question the person must answer and a Case that waits only for
      the person''s word, and, while a `case-guppi` has not answered, send the agent to the end of the
      turn that `orchestration.md` sets for a Case out. The reason does not name the `**Waiting:**` line
      itself, since Case 890.3 sets that a Case sent back after the check refused a showing of a batch
      is out of the batch and takes no `**Waiting:**` line while its `case-guppi` has not answered; after
      the person ratifies the other Cases, that Case is still out and this hook names it, and the agent
      waits for it as `orchestration.md` then sets it. The Criterion of `estimate-prespec-onward-reads-the-decisions-of-the-session`
      sets when a Case is still out, and that judgment does not change; its line that a Case replaced
      under a new number does not keep the hook silent stays true, since after the change no Case keeps
      it silent, so its Criterion stands and the person''s choice of two rewritten checks holds. But its
      tests told a Case out by the silence of the hook and a Case not out by exit 2 alone, which would
      pass whether the Case is out or not once a Case still out exits 2 too (finding F4 of `/pre-spec`);
      so the tests of a Case out assert the third reason, and the tests of a Case not out assert the reason
      of the exit or of the loop, never the third, so that its `method` still tells the two apart. Before
      `/pre-spec` the hook stays silent on purpose, and this Case does not change that. The Case does
      not change `rule-orchestration`: the sentences of `orchestration.md` and of `.claude/skills/pre-spec/SKILL.md`
      that say the hook of `rule-prespec-onward` sends the agent on after the reply that acknowledges
      the ratification stay true. The item put off on that page by Case 884 stays in `backlog.md`; the
      item put off by Case 887 is retired by Case 890, whose file carries `{supersedes:case 887}` on the
      decision lines of Case 890.1 on `rule-case-check` and of Case 890.3 on `rule-orchestration` (finding
      F2 of `/pre-spec`). A Grep of `rule-prespec-onward|onward --plan` over `vault/wiki/`, `log.md` and
      `brief.md` left out, printed 21 files; besides the rule page and its three Estimates, the hits of
      `estimate-orchestration-acknowledging-reply`, `estimate-orchestration-defers-in-one-reply`, `estimate-orchestration-shows-the-frontier-after-a-closed-line`
      and `estimate-work-mode-runs-the-spec-on-a-branch-from-a-baseline` say only that the hook sends
      the agent on after `/pre-spec` or nothing once `spec.md` stands, which stays true; `estimate-prespec-confirms-the-findings-once`
      says the hook sends the agent to the check and the exit after the one ratification of every Case
      built again, which stays true; the other hits name the hook as a child, in the registry of hooks,
      in a Result or a History, or for what it counts as no Case or as ratified (`rule-case-build`, `estimate-case-check-sends-back-a-clash-with-another-case`,
      `estimate-orchestration-shows-the-built-case`), or as a judgment apart (`estimate-retro-onward-sends-the-agent-to-the-handoff`),
      which the change leaves true. The same Grep over `.claude/` printed `.claude/settings.json`, `.claude/skills/pre-spec/SKILL.md`
      and `.claude/agents/case-guppi.md`, none of which the change makes false. A Grep of `case_out|cases_out`
      over `.guppi/` printed only `.guppi/guppi/onward.py` and `.guppi/tests/test_onward.py`, so the judgment
      of a Case still out lives in one function, and the ids of the third reason come from that same judgment,
      with no second copy, as `rule-one-judgment-one-implementation` sets it. The lesson stands in the
      ledger of session 2307, so no decision line carries `{addresses:...}`.'
    problem: 'After `/pre-spec`, a batch ratified in part leaves the Cases still out with no turn: the
