  case_text:
    given: '`estimate-orchestration-shows-the-clean-cases-of-a-batch-first`: the new check of the showing
      after a refusal.

      **＋** `rule-orchestration`: the rule of the main agent, whose Render gains the sentence.

      **＋** `vault/wiki/orchestration.md`: the file rendered from `rule-orchestration`.

      **＋** `rule-case-check`: the `Stop` check that refuses a showing of a Case with a stored finding.

      **＋** `<plan>.checked.json`: the store that holds the findings of each Case.

      **＋** `rule-prespec`: the loop after the findings of `/pre-spec`.

      **＋** `case-guppi`: the agent that builds each Case.

      **＋** `raw/2026-10-26/0118/cases/case-889.md`: the Case whose hook names the Case sent back after
      `/pre-spec` and points to `orchestration.md` for the end of the turn.'
    when: In Plan Mode, the `Stop` check of `rule-case-check` refuses a reply of the main agent that shows
      the Cases of a batch, for a finding that `<plan>.checked.json` holds with one of them, with `vault/wiki/orchestration.md`
      rendered from `rule-orchestration`.
    then: 'The main agent sends the Case whose finding the refusal names, with its top-level Case and
      each sub-case of that file, back to its `case-guppi` by `SendMessage` with the finding, and that
      Case leaves the batch.

      **＋** In its answer to the refusal it shows the other Cases of the batch, each in the showing that
      `vault/wiki/orchestration.md` sets, for one ratification, and the person ratifies them at once or
      names the ids.

      **＋** The Case sent back is shown when its `case-guppi` answers, as a Case the person questions
      or changes is shown again: alone when no other Case of the session is out, and otherwise in a batch
      with the Cases still out.

      **＋** The answer to the refusal ends as a showing ends, its own text after the horizontal rule naming
      the Case sent back as still out; the Case sent back is out of the batch, so neither the `**Waiting:**`
      line of a batch nor the joining of Cases out at the same time holds for it in that answer.

      **＋** Each later turn that ends while its `case-guppi` has not answered, and while no Case shown
      waits for the person''s word, ends with one line under the bold label `**Waiting:**`, translated,
      that names the Case sent back, and nothing else.

      **＋** This holds in every batch before `/pre-spec` and in the loop after the findings of `/pre-spec`
      that `rule-prespec` sets.

      **－** A refusal for a file not sent, or for a showing that differs from the stored text, sends no
      Case back: the main agent sends the file and shows the Cases as `vault/wiki/orchestration.md` sets
      it.

      **－** The main agent puts before the person no Case that the check refused for a stored finding.'
