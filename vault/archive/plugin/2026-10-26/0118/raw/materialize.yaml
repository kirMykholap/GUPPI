      it. A Grep of `for one ratification` over `vault/wiki/` printed 12 files: `orchestration.md`, `log.md`,
      `rule-orchestration`, `rule-prespec`, `estimate-prespec-gathers-the-answers-after-findings`, `estimate-orchestration-marks-each-round-of-a-batch`,
      `estimate-orchestration-signs-a-batch-together`, `estimate-orchestration-signs-items-taken-together`,
      `estimate-orchestration-rechecks-a-sibling-after-a-joint-send`, `estimate-prespec-confirms-the-findings-once`,
      `estimate-orchestration-acknowledging-reply` and `estimate-orchestration-batches-cases-out-at-once`.
      Each hit outside `log.md` and the History lines says that every Case of a batch, or every Case built
      again, is shown in one reply for one ratification; that showing still comes first, and the new step
      only follows its refusal, with the Case sent back out of the batch, so the hits stand; the person
      chose that the Criterion of `estimate-prespec-gathers-the-answers-after-findings` names the new
      step, and Case 890.4 replaces it, carrying its other lines but the two on the labelled line and
