    method: uv run --project .guppi pytest .guppi/tests/test_casecheck.py -k backlog
  change: the Criterion replaced whole — a Case that names the page of an open backlog line only on defer
    lines needs the mark of each Case of its deferred_by too; the method is the test alone
  sections:
    Criterion: 'When:

      `SubagentStop` fires when `case-guppi` stops after it wrote or edited `raw/<date>/<hi HHMM>/cases/case-<N>.md`,
      and `uv run --project .guppi guppi casecheck --subagent` reads the Cases of that file, the session''s
      `vault/raw/<date>/<hi HHMM>/frontier.md`, and the pages of the vault.


      Then:

      For each open line of the Frontier whose source is `backlog`, each page that its title names in
      a code span and that carries `deferred_by` is checked against each top-level Case N of the file
      that, itself or through a sub-case, names that page on a decision line other than a `defer`.

