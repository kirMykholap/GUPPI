- case: '943.3'
  decision: decision-case-943.3
  origin: raw/2026-10-30/2005/ledger.md#case-943.3
  targets:
  - kind: update
    category: estimates
    slug: estimate-guppi-package-is-ready-after-the-install
    ref: rule-guppi-package
  tags: []
  case_text:
    given: '`estimate-guppi-package-is-ready-after-the-install`: its Criterion is replaced whole and its
      `method` set anew.

      **＋** `rule-guppi-package`: the rule of the Python environment `.guppi/.venv/`.

      **＋** `.guppi/guppi/ship.py`: `uv run --project .guppi guppi ship --allow-draft <folder>`, which
      writes the clean version.

      **＋** `plugin/skills/install/SKILL.md`: the skill `/guppi:install`, which runs `uv --version` and
      `uv sync --project .guppi`.

      **＋** `rule-plugin-install`: sets the install.

      **＋** `/plugin marketplace add <folder>` and `/plugin install guppi@guppi-marketplace`: the commands
      of Claude Code that add the catalogue and install the plugin.

      **＋** `.claude/settings.json`: the file that holds the hooks of the project.

      **＋** `/hi`: the command that the install sends the person to.'
    when: In the repository of GUPPI, the agent writes the clean version into a local folder by `uv run
      --project .guppi guppi ship --allow-draft <folder>`; the person adds that folder as a catalogue
      by `/plugin marketplace add <folder>`, installs the plugin by `/plugin install guppi@guppi-marketplace`
      and types `/guppi:install` in an empty project open in Claude Code, as `rule-plugin-install` sets
      it.
    then: 'Before it writes anything, `/guppi:install` runs `uv --version`.

      **＋** It copies each file of the install but `.claude/settings.json`, and then runs `uv sync --project
      .guppi` in the project, which builds the Python environment `.guppi/.venv/`.

      **＋** Once `uv sync` passes, it copies `.claude/settings.json`, and then tells the person to reopen
      Claude Code and type `/hi`.

      **＋** The hooks of the project find that environment built at the first `/hi`.

      **－** Where `uv --version` passes, it asks nothing about `uv`.'
    context: 'Four Estimates wait on an install by hand from a clean copy: `estimate-plugin-install-sets-aside-the-files-of-the-project`,
      `estimate-plugin-install-writes-guppi-into-an-empty-project` and `estimate-plugin-install-runs-no-hook-before-uv-sync`,
      of `rule-plugin-install`, and `estimate-guppi-package-is-ready-after-the-install`, of `rule-guppi-package`.
      Each `method` writes the clean version by `uv run --project .guppi guppi ship --allow-draft`, adds
      it as a catalogue by `/plugin marketplace add`, installs it by `/plugin install guppi@guppi-marketplace`
      and types `/guppi:install` in a test project. The method of `estimate-guppi-package-is-ready-after-the-install`
      says that the person does this at a stop of Work Mode and that its copy and project may be those
      of `estimate-plugin-install-runs-no-hook-before-uv-sync`. Their event has come: the brief reports
      the librarian''s run of session 1713 and that `git tag --merged HEAD` prints `prod-0.2.0`. The methods
      name five projects. The first is an empty project, for the copy, the hooks before `uv sync`, and
      the reopen and `/hi`. The second is an empty project with Claude Code started with `UV_OFFLINE=1`
      and `UV_CACHE_DIR` set to an empty folder. The third holds a `CLAUDE.md`, a `.claude/settings.json`
      with a hook and a `.gitattributes` of its own. The fourth is such a project, offline. The fifth
      holds a file of its own under `vault/`. `where-to-stop.md` lets Work Mode stop for the person only
      on its conditions, and the fourth condition is a task of the Spec whose text opens with `stop:`.


      I read `run`, `drafts` and `version` of `.guppi/guppi/ship.py` whole. A build into a folder that
      is not empty writes nothing. With `--allow-draft`, the lines on the draft pages with `core: true`
      are printed and set no exit code, and the copy is written when a tag `prod-x.y.z` stands in the
      history of HEAD. The person chose to take all four readings in this session, with the copy written
      by the agent, one stop, and the readings after the person''s word. The Claude Code page https://code.claude.com/docs/en/plugin-marketplaces
      says that one user cannot have two marketplaces with the same name, and that `claude plugin marketplace
      remove <name>` removes the marketplace and uninstalls its plugins. So the steps first remove a `guppi-marketplace`
      left by an earlier install.


      This Case replaces Case 941, which was ratified with the stop alone and the four Criteria kept.
      A finding of `/pre-spec` showed that two Criteria say that the person writes the copy, while the
      agent writes it. In `estimate-plugin-install-writes-guppi-into-an-empty-project` this is a `＋` line
      of its When, and in `estimate-guppi-package-is-ready-after-the-install` it is its When; the `method`
      of the second already says that the agent writes it. The person chose to replace both Criteria whole,
      with the agent as the one who writes the copy and the rest as it stands, and to build Case 941 again
      under a new number with sub-cases. The rule that governs this is the form of a promise in `case-schema.md`:
      a promise changes only by a Criterion replaced whole. So Cases 943.2 and 943.3 replace each Criterion
      whole and set each Estimate `pending`. Each `method` waited for the librarian''s run of the session
      that sets its Criterion; once this session sets it, that wait would move past this session. So each
      `method` is set anew, with the reading at Retro of this session, as the person chose. Each `purpose`
      speaks of what the install does, not of who writes the copy, so it stands. `.claude/skills/work/SKILL.md`
      leaves to Retro the reading of an Estimate that this session creates or updates. So these two are
      read at Retro, against the Spec that holds their new Criteria. The two other Estimates are still
      read in Work Mode after the last task. Case 943.1 names the two rules by an `update` with only `change`.
      I read `names_a_part` and `lift_criterion` of `.guppi/guppi/materialize.py`: an `update` of a rule
      is no Estimate entry, so nothing is lifted and no status is set.


      `estimate-where-to-stop-stops-only-on-its-conditions` stands `passed`. It already promises that
      the agent stops before a task that opens with `stop:` and runs it after the person''s word, so its
      Criterion stands. The Criteria of `estimate-plugin-install-sets-aside-the-files-of-the-project`
      and `estimate-plugin-install-runs-no-hook-before-uv-sync` do not say who writes the copy, so they
      stand. `estimate-sprint-plugin-installs-as-a-plugin` also reads an install into an empty project
      with `/hi`. Its target is the live sprint page, and `.claude/skills/hi/SKILL.md` makes such an Estimate
      wait for the Retro of the session that finishes the work of the sprint. Item C1 of the clean branch
      is still open, so that Estimate stays out. I read the finished file of Case 939 whole. It runs `guppi
      ship --allow-draft --review` at Retro into an empty temporary folder of its own, so the two builds
      share no folder. It also replaces the sentence of `rule-clean-branch` on the uses of `--allow-draft`,
      and its new sentence still names the install by hand from that folder, which is what this Case does.
      This Case names `rule-clean-branch` only as the rule of the clean version and changes none of its
      text, so the two Cases need no change against each other. The ledger of this session holds no `error`
      lesson, so no line carries `{addresses:...}`.'
