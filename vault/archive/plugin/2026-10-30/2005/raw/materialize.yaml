  tags:
  - session
  - workflow
  case_text:
    given: '`rule-orchestration`: its Render names the new closer under `## Plan Mode and the Frontier`.

      **＋** `rule-skill-hi`: its Render names the new closer in the list of closers.

      **＋** `vault/wiki/orchestration.md`: rendered from `rule-orchestration`.

      **＋** `.claude/skills/hi/SKILL.md`: rendered from `rule-skill-hi`.

      **＋** `vault/wiki/backlog.md`: the backlog whose item a Case defers again.

      **＋** `raw/<date>/<hi HHMM>/frontier.md`: the Frontier whose line closes.

      **＋** `estimate-orchestration-closes-a-backlog-item-deferred-again`: the new check of the closer.

      **＋** `estimate-prespec-checks-the-frontier`: the check of 937.1, which sets what the Case named
      in the closer must hold.'
    when: In Plan Mode, with `vault/wiki/orchestration.md` rendered from `rule-orchestration` and `.claude/skills/hi/SKILL.md`
      from `rule-skill-hi`, a Case of the session defers again, with a new wording, an item of `vault/wiki/backlog.md`
      that stands on a line of `raw/<date>/<hi HHMM>/frontier.md` with the source `backlog`.
    then: 'The agent closes the line of the item `[-] … · backlog · defer case N`, N the id of that Case,
      in the reply that carries the decision lines of the Case.

      **＋** The agent takes this closer only for a Case whose decision lines meet the backlog rule of
      `estimate-prespec-checks-the-frontier`, so that the check that Estimate reads finds nothing on the
      line.

      **＋** An item of `vault/wiki/backlog.md` left as it stands, with no Case, closes `[-] … · backlog
      · kept`, and so does one whose ratified Case the person takes back in Plan Mode.

      **－** The line of an item that a Case defers again does not close `[x] … · backlog · case N`, which
      stays for a Case that takes the item off the backlog.'
    context: 'When a session ends an item of its Frontier, the agent closes the item''s line with a closer.
      `orchestration.md` and the `/hi` skill give a backlog item two closers: `[x] … · backlog · case
      N` for a Case that takes the item off the backlog, and `[-] … · backlog · kept` for an item left
      as it stands, with no Case and no ledger line. They name none for a Case whose only decision puts
      the item off again with a new wording. In session 1713, Case 934 deferred `rule-spec-capture` again
      with `{supersedes:case 909}`. The agent closed its line `[x] … · backlog · case 934`, and `guppi
      prespec --check` printed two findings, as `lesson-frontier-closed-a-backlog-item-deferred-again-as-a-case`
      records. The line was then closed `kept`, although a Case stood. The person chose a third closer,
      `[-] … · backlog · defer case N`. The check accepts it when a `defer` line of Case N names a page
      of the title and carries `{supersedes:case M}` for each Case M of that page''s `deferred_by`. A
      take-back keeps `kept`.


      The check is `check_frontier` of `.guppi/guppi/prespec.py`, which I read whole with `check_backlog_line`,
      `deferred_pages`, `decided_on_its_page`, `has_defer_item` and the closer constants `CLOSERS`, `PUT_OFF_SOURCE`
      and `PUT_OFF_CLOSER`. Today it refuses `defer case N` after `backlog` through `PUT_OFF_CLOSER`.
      It accepts `kept` after `backlog` and checks nothing more. It sends a line closed `[x] … · backlog
      · case N` to `check_backlog_line`, which calls `decided_on_its_page`. That function counts only
      lines other than a `defer` as naming the page. `generate.clear_deferred_by` of `.guppi/guppi/generate.py`
      drops Case M from a page''s `deferred_by` when the superseding Case names the page on any of its
      decision lines, a `defer` included; its caller passes the slugs of every target of the record. So
      a `defer` that carries the mark removes the old wording, and the new judgment counts `defer` lines
      in the same way. `backlog.py` counts an item by every `[-]` line that names its slug (`put_off_count`,
      through `generate.frontier_marks`), so the new closer adds to the count as `kept` does.


      One judgment: a Grep for `decided_on_its_page` over `.guppi` printed `.guppi/guppi/casecheck.py`
      and `.guppi/guppi/prespec.py`. The check of the answer of `case-guppi` in `casecheck.py` imports
      it and counts lines other than a `defer`. So Case 937.1 adds a keyword to that one function and
      adds no second copy, as `rule-one-judgment-one-implementation` sets it. The keyword is false by
      default, so `check_backlog_line` keeps its answer. No test reads that function over a live file.
      The finding of `/pre-spec` on `estimate-case-check-requires-a-backlog-item-decided-on-its-page`
      showed that `check_backlog` of `casecheck.py`, which I read whole with `open_backlog_lines`, judges
      only a Case that names the page on a line other than a `defer` (`missing if named else []`). So
      a Case that only defers the page again without the mark would get no finding when `case-guppi` stops,
      only at `/pre-spec` after ratification, which is the shape of the failure of session 1713. The person
      agreed that `check_backlog` calls the same mode, so Case 937.3 replaces the Criterion of that Estimate.
      Its test `test_backlog_a_case_naming_the_page_only_in_a_defer_line_is_not_judged` of `.guppi/tests/test_casecheck.py`
      asserts the old answer, so 937.3 changes it. The `method` of that Estimate also asked for a reading
      by hand of the first answer of `case-guppi` on an item taken from the backlog, an event this session
      may not see. So 937.3 sets the `method` to the test alone, as the fix the person agreed to says.
      Its `purpose` still holds. The finding of `/pre-spec` on the slugs of a title showed two functions
      that read them. `deferred_pages` of `prespec.py` reads every code span after the item id and trims
      spaces inside the backticks. `frontier_marks` of `.guppi/guppi/generate.py` reads only the text
      before the first ` · ` and keeps such spaces. They part on a code span after the first ` · ` and
      on one with spaces inside its backticks. The person chose that one function in `generate.py` takes
      the title before the first ` · ` with spaces trimmed, and that each site imports it. A third finding
      of `/pre-spec` was left with no change to this Case: a backlog line closed `defer case N` by a Case
      of a conserved Spec in a session of `/box` is a finding before this Case and after it, and it goes
      to the handoff as a line. A Grep for `orchestration\.md|skills/hi/SKILL|skills" / "hi` over `.guppi/tests`
      printed `test_lint.py`, `test_ratified.py`, `test_onward.py`, `test_ship.py`, `test_guard.py`, `test_prespec.py`,
      `test_recall.py` and `test_orchestration.py`. `test_orchestration.py` reads the live `orchestration.md`,
      but only its blocks tagged `showing` and `defer`, which this Case leaves as they are. `test_recall.py`
      writes its skill under a temporary folder. `test_ship.py` runs `test_the_live_code_holds_no_pointer_outside_a_bracket`
      over the live code of `.guppi/`. So the new docstrings and comments of 937.1 keep each pointer to
      a Case in a bracket at the end of its sentence.


      A Grep for `backlog · kept|· defer case N|defer case N`` over `.claude/` and `vault/wiki/` printed
      17 files. These are `.claude/skills/sprint-close/SKILL.md`, `.claude/skills/hi/SKILL.md`, `vault/wiki/orchestration.md`,
      `vault/wiki/log.md`, the lesson above, `rule-case-protocol`, `rule-orchestration`, `rule-skill-hi`,
      `rule-skill-sprint-close`, `estimate-orchestration-shows-the-built-case`, `estimate-prespec-checks-the-frontier`,
      `estimate-hi-writes-frontier`, `estimate-orchestration-takes-back-a-ratified-case`, `estimate-hi-takes-a-conserved-spec`,
      `estimate-orchestration-shows-the-frontier-after-a-closed-line`, `estimate-orchestration-defers-in-one-reply`
      and `estimate-orchestration-acknowledging-reply`. The Criterion of `estimate-prespec-checks-the-frontier`
      says that `defer case N` after `backlog` is a finding, so Case 937.1 replaces it. Its `purpose`
      and `method` still hold. `orchestration.md` and the skill of `rule-skill-hi` list the closers, so
      Case 937.2 adds the new closer to each. The other hits stand. The sprint-close skill closes a backlog
      item left at the close of a sprint as `kept`, which stays true. In `rule-case-protocol` the hit
      is a History line. The Estimates of the acknowledging reply, the built Case, the Frontier after
      a closed line and the conserved Spec list `[-] … · defer case N`, a form that the new closer keeps.
      `estimate-orchestration-takes-back-a-ratified-case` keeps `kept` for a take-back, as the person
      chose. `estimate-orchestration-defers-in-one-reply` covers sources other than the sprint and the
      backlog by its `When`. `estimate-hi-writes-frontier` stays as it is: each of its lines stays true.
      It already waits, unread, for the session that opens a sprint, and a replaced Criterion with a `method`
      that waits for a later session is a finding of `/pre-spec`. `estimate-prespec-requires-a-backlog-item-decided-on-its-page`
      stands: its Criterion speaks only of lines closed `[x] … · backlog · case N`, and its two findings
      do not fire on a `[-]` line. The `/pre-spec` sentence of `case-schema.md` on a Case that takes up
      a backlog item stands, since it speaks of that Case alone. The row `Plan Mode` of `glossary.md`
      names a backlog item kept as it stands, which stays true.


      The brief reports `uv run --project .guppi guppi test` at the close of session 1713 as "1814 passed,
      6 skipped, 1 deselected, exit 0". It reports no output of `guppi prespec --check`. The options of
      the rounds rest on the code I read, not on a run. The check runs at `/pre-spec` of this session
      with the code as it stands then. No line of this session''s Frontier closes `· backlog · defer case
      N`, so the old code finds nothing new. The session''s ledger holds no `lesson[error]` line, and
      the lesson above is of session 1713, so no line carries `{addresses:...}`.'
