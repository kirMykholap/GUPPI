  sections:
    Criterion: 'When:

      In the repository of GUPPI, the agent writes the clean version into a local folder by `uv run --project
      .guppi guppi ship --allow-draft <folder>`; the person adds that folder as a catalogue by `/plugin
      marketplace add <folder>`, installs the plugin by `/plugin install guppi@guppi-marketplace` and
      types `/guppi:install` in an empty project open in Claude Code, as `rule-plugin-install` sets it.


      Then:

      Before it writes anything, `/guppi:install` runs `uv --version`.

      **＋** It copies each file of the install but `.claude/settings.json`, and then runs `uv sync --project
      .guppi` in the project, which builds the Python environment `.guppi/.venv/`.

      **＋** Once `uv sync` passes, it copies `.claude/settings.json`, and then tells the person to reopen
      Claude Code and type `/hi`.

      **＋** The hooks of the project find that environment built at the first `/hi`.

      **－** Where `uv --version` passes, it asks nothing about `uv`.'
