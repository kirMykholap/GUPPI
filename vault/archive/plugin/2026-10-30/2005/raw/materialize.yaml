  case_text:
    given: '`vault/wiki/rules/`: the Rule pages, MOC and Leaf.

      **＋** `rule-rules-schema`: the target of the new check.

      **＋** `estimate-rules-schema-leaf-carries-no-how-it-works`: the new check.

      **＋** `rule-tests-clock-pinned`: a Leaf whose section leaves.

      **＋** `.guppi/tests/conftest.py`: the code of `rule-tests-clock-pinned`.

      **＋** `rule-spec-write`: a Leaf whose section leaves.

      **＋** `.guppi/guppi/ratified.py`: the code of `rule-spec-write`.

      **＋** `rule-compact-recall`: a Leaf whose section leaves.

      **＋** `.guppi/guppi/recall.py`: the code of `rule-compact-recall`.

      **＋** `rule-event-log`: a Leaf whose section leaves.

      **＋** `.guppi/guppi/event.py`: the code of `rule-event-log`.

      **＋** `rule-retro-commit`: a Leaf whose section leaves.

      **＋** `.guppi/guppi/gate.py`: the code of `rule-retro-commit`, and of the marks of `rule-event-log`.

      **＋** `rule-raw-archive`: a Leaf whose section leaves.

      **＋** `.guppi/guppi/archive.py`: the code of `rule-raw-archive`.

      **＋** `rule-git-context`: a Leaf whose section leaves.

      **＋** `.guppi/guppi/gitstate.py`: the code of `rule-git-context`.

      **＋** `rule-ledger-tail`: a Leaf whose section leaves.

      **＋** `.guppi/guppi/tail.py`: the code of `rule-ledger-tail`.

      **＋** `rule-page-read`: a Leaf whose section leaves.

      **＋** `.guppi/guppi/pageread.py`: the code of `rule-page-read`.

      **＋** `rule-governed-files-hook`: a Leaf whose section leaves.

      **＋** `.guppi/guppi/guard.py`: the code of `rule-governed-files-hook`.

      **＋** `rule-internal-context`: a Leaf with no code, whose section leaves for its Purpose.

      **＋** `.guppi/tests/test_ship.py`: its test of pointers reads the live code.'
    when: After Work Mode writes the new docstrings and the librarian's run applies the updates of the
      session, an agent reads a Leaf page of `vault/wiki/rules/` and the docstring of its code.
    then: 'No Leaf page of `vault/wiki/rules/` carries a section `## How it works`.

      **＋** Each fact that such a section held stands in the docstring of the code that the page''s `implementation_ref`
      names, and for `rule-internal-context` in its `## Purpose`, as the failure that a line of its list
      prevents.

      **－** A remark on what stood before some Case does not move into the docstrings or the Purpose.

      **－** A MOC page of `vault/wiki/rules/` keeps its `## How it works`.'
    context: 'A Rule page of one rule, a Leaf, still carries the section `## How it works` on eleven pages.
      The schema of Rule pages keeps that section for a MOC, a workflow page, and puts the mechanism of
      a Leaf in the docstring of its code or in its Render; it lets a Leaf keep the section until its
      next touch. The section can drift from the code it describes: the one of `rule-retro-commit` restates
      when `guppi gate` blocks the `handoff` skill, which `.guppi/guppi/gate.py` decides. Earlier Cases
      moved such facts into the docstring and removed the section by hand, such as cases 589.2, 632.1
      and 904.1. Session 1713 added `drop`, the key of an `update` that removes a section with its heading
      (cases 931, 935). The person chose to remove the section from all eleven Leaf pages now. Each fact
      it holds moves first into the docstring of the code that the page''s `implementation_ref` names,
      and for `rule-internal-context`, which has no code, into its `## Purpose`, written as the failure
      each line of its list prevents, as the schema defines a Purpose. A remark on what stood before some
      Case leaves with the section, since the History of each page and its Decision pages keep it. Case
      942 replaces Case 940, which has decision lines in the session''s ledger and is built again in two
      parts after `/pre-spec`. The change of the schema can fail alone while every docstring holds its
      facts, and its fix is another, so the person chose two sub-cases. Case 942.1 removes the sections,
      checked by a new Estimate. Case 942.2 rewords the schema, checked by `estimate-rules-schema-checked`,
      whose Criterion it replaces.


      A Grep `^## How it works` over `vault/wiki/rules/` printed 15 files: `rule-skill-hi`, `rule-git-context`,
      `rule-documentation`, `rule-spec-write`, `rule-raw-archive`, `rule-event-log`, `rule-page-read`,
      `rule-tests-clock-pinned`, `rule-claude-md`, `rule-retro-commit`, `rule-ledger-tail`, `rule-governed-files-hook`,
      `rule-compact-recall`, `rule-internal-context` and `rule-session-start`. A Grep `^kind: MOC` over
      those 15 files printed 4: `rule-skill-hi`, `rule-documentation`, `rule-claude-md` and `rule-session-start`.
      These keep the section, as the schema allows. The other eleven are Leaves, and each carries `core:
      true`, so each pointer to a Case in new text stands in a bracket at the end of its sentence. `estimate-clean-branch-code-holds-pointers-only-in-brackets`
      and `estimate-clean-branch-tests-judge-the-live-code`, both `passed`, already promise that for the
      comments and docstrings under `.guppi/guppi/` and `.guppi/tests/`, the new docstrings among them,
      so this Case adds no promise of its own on pointers. Case 937 of this session updates `rule-skill-hi`,
      a MOC, and no page of this Case. I read `drop` of `.guppi/guppi/generate.py` whole. It removes each
      named section with its heading. It fails the item when the page lacks the section, or when the removal
      adds a schema finding, and `## How it works` is optional on a Rule page. I also read `replace_hits`
      of the same module, which joins the words of an `old` by any whitespace. So the pairs of `rule-rules-schema`
      below match across the line breaks and the indent of its examples. Its Render holds the examples
      as one section.


      A Grep `How it works` over `vault/wiki/`, without `log.md` and `brief.md`, printed 39 files. Besides
      the 15 pages above, the hits that are no History line are these. In `rule-rules-schema` and `vault/wiki/rules/schema.yaml`,
      the description of the section and the three examples of a Leaf that still carry it enter Case 942.2
      by four pairs. `rule-entities-schema`, `vault/wiki/entities/schema.yaml`, `glossary.md`, `entity-glossary.md`
      and `estimate-entities-schema-checked` speak of the section of an Entity, which this Case does not
      touch. The Criterion of `estimate-rules-schema-checked` lists `## How it works` as optional, which
      stays true; Case 942.2 replaces it whole with that line kept and one line added. Its `purpose` and
      `method` stand: the purpose speaks of findings on a page, and the method reads the live file against
      the Criterion after a librarian''s run. `estimate-generate-writes` and `estimate-materialize-assembles`
      hold it in a Result line, a record. A Grep `How it works` over `.claude/` printed nothing, so no
      harness file changes. A Grep `How it works|docstring` over the Estimates of the eleven pages printed
      nothing. Their Criteria speak of behaviour that this Case leaves as it is, so none of them changes.


      A Grep `schema\.yaml` over `.guppi/tests/` printed 10 files: `test_generate.py`, `test_materialize.py`,
      `test_ratified.py`, `test_ship.py`, `test_case_schema.py`, `test_casecheck.py`, `test_prespec.py`,
      `test_lint.py`, `test_schemas.py` and `test_orchestration.py`. `test_schemas.py` reads the live
      `vault/wiki/rules/schema.yaml` for its lists and conditions alone. `test_generate.py`, `test_materialize.py`,
      `test_case_schema.py` and `test_orchestration.py` copy the live schema files into a temporary folder,
      and their tests rest on the lists, which this Case leaves as they are. The rest write their schema
      under a temporary folder. `test_the_live_code_holds_no_pointer_outside_a_bracket` of `test_ship.py`
      reads the live code of `.guppi/`, the new docstrings among it. The brief reports `uv run --project
      .guppi guppi check` at the close of session 1713 as 13 lines, exit 1, each a page with `core: true`
      that stands `draft`, none a schema finding; this Case sets no status of a Rule page. The session''s
