  sections:
    Criterion: 'When:

      The main agent dispatches `case-guppi` by an `Agent` call to build the Case of an item of `raw/<date>/<hi
      HHMM>/frontier.md`, with `vault/wiki/orchestration.md` rendered from `rule-orchestration`.


      Then:

      The prompt of the call names each Case of the session, ratified or already shown, that changes a
      page the item names or sets what happens at the same moment as the item: the same kind of reply,
      the same hook event or the same command.

      **＋** The prompt also names each Case of the session, ratified or already shown, that sets the form
      of a text a check reads, or how the check reads it, when the Case of the item may write text of
      that kind, such as the `method` of an Estimate.

      **＋** Each such Case stands in the prompt by its id, one sentence on what it sets and which pages
      it changes, and the path of its case file `raw/<date>/<hi HHMM>/cases/case-<N>.md`.

      **＋** When the item is one of two or more items that one answer of the person took up, the prompt
      also names each other Case of that batch by its id and its Frontier item, and by the path of its
      case file where that file stands.

      **＋** The main agent judges which Cases of the session are related, and the prompt does not send
      `case-guppi` to search the Cases of the session.

      **－** A Case of the session that changes no page the item names, acts at another moment, sets no
      form of a text of a kind the Case of the item may write and is no Case of the same batch need not
      stand in the prompt.

      **－** A Case that only writes a text a check reads, and sets no form of it, is not related by that
      text alone.

      **－** When no Case of the session is related and the item is taken up alone, the prompt names none
      and holds the Case id, the Frontier item with its source and the person''s words.'
