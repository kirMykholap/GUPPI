- case: '943.1'
  decision: decision-case-943.1
  origin: raw/2026-10-30/2005/ledger.md#case-943.1
  targets:
  - kind: update
    category: rules
    slug: rule-plugin-install
    ref: rule-plugin-install
  - kind: update
    category: rules
    slug: rule-guppi-package
    ref: rule-guppi-package
  tags: []
  case_text:
    given: '`rule-plugin-install`: the install the readings check; an `update` with only `change`.

      **＋** `rule-guppi-package`: the rule of the Python environment after the install; an `update` with
      only `change`.

      **＋** `.guppi/guppi/ship.py`: `guppi ship --allow-draft`, which writes the clean version.

      **＋** `plugin/skills/install/SKILL.md`: the skill `/guppi:install` that the person types.

      **＋** `rule-where-to-stop`: sets the stop before a task that opens with `stop:`.

      **＋** `.claude/skills/work/SKILL.md`: takes the readings after the last task.

      **＋** `estimate-guppi-package-is-ready-after-the-install`: the reading by the person''s answer.'
    when: In Work Mode of the session, the agent writes the clean version by `uv run --project .guppi
      guppi ship --allow-draft <folder>` of `.guppi/guppi/ship.py` into a new empty folder outside the
      repository, makes the five test projects outside the repository, and reaches the `stop:` task of
      this Case.
    then: 'Before the stop, each test project holds only the files that its method names, and the agent
      records what each holds.

      **＋** The agent stops as `rule-where-to-stop` sets it, and its reply gives the person the steps
      for each project: the folder, how to start Claude Code there, offline where the method says so,
      the commands of the catalogue, the install and `/guppi:install`, and what to run after.

      **＋** Where a catalogue `guppi-marketplace` already stands from an earlier install, the first step
      removes it by `claude plugin marketplace remove guppi-marketplace`.

      **＋** The reply puts the question of `estimate-guppi-package-is-ready-after-the-install` on the
      first empty project, after the person reopens Claude Code there and opens a working session.

      **＋** After the person''s word, the run goes on, and the readings that `.claude/skills/work/SKILL.md`
      sets read the transcripts and the files of the projects against the Criteria of the Estimates of
      `rule-plugin-install` and `rule-guppi-package`.

      **－** The agent adds no catalogue, installs no plugin and types no `/guppi:install` itself, and
      deletes no folder outside the repository.

      **－** No text of `rule-plugin-install` or `rule-guppi-package` changes.'
    context: 'Four Estimates wait on an install by hand from a clean copy: `estimate-plugin-install-sets-aside-the-files-of-the-project`,
      `estimate-plugin-install-writes-guppi-into-an-empty-project` and `estimate-plugin-install-runs-no-hook-before-uv-sync`,
