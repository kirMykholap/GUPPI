  category: estimates
  set:
    status: pending
    method: 'uv run --project .guppi pytest .guppi/tests/test_ship.py -k plugin_skill; by hand, at Retro
      of the session that sets this Criterion, with a tag prod-x.y.z in the history of HEAD: the clean
      version written by the agent in Work Mode into a local folder by uv run --project .guppi guppi ship
      --allow-draft; at a stop of Work Mode, in an empty project, the person adds that folder as a catalogue
      by /plugin marketplace add, installs guppi by /plugin install guppi@guppi-marketplace and types
      /guppi:install; the files of the project read against those of the plugin and against the Criterion'
  change: the Criterion replaced whole — the agent writes the clean copy; the reading at Retro of the
    session that sets it
  sections:
    Criterion: 'When:

      `uv run --project .guppi guppi ship --allow-draft <folder>` builds the clean version, as `rule-clean-branch`
      sets it, and `uv run --project .guppi guppi ship --check` judges the working tree.

      **＋** The agent writes the clean version into a local folder by `uv run --project .guppi guppi ship
      --allow-draft <folder>`; the person adds that folder as a catalogue by `/plugin marketplace add
      <folder>`, installs the plugin by `/plugin install guppi@guppi-marketplace` and types `/guppi:install`
      in the project open in Claude Code, as `rule-plugin-install` sets it.


      Then:

      `uv run --project .guppi guppi ship --allow-draft <folder>` writes `plugin/skills/install/SKILL.md`
      to `skills/install/SKILL.md` of the clean version and cleans it like each other file it writes,
      and the clean version holds no file under `plugin/skills/`.

      **＋** `uv run --project .guppi guppi ship --check` judges `plugin/skills/install/SKILL.md` in place,
      as it judges each other file outside `vault/`.

      **＋** The installed plugin offers the skill `install`, which the person types as `/guppi:install`.

      **＋** In a project that holds none of the files it would write, `/guppi:install` copies each file
      of the plugin to the same path in the project, but those under `.claude-plugin/`, `skills/` and
      `.git/`, such as `CLAUDE.md`, `.claude/settings.json`, the code under `.guppi/` and the pages under
      `vault/wiki/`.

      **＋** It checks that each copied file stands, and its last message tells the person to reopen Claude
      Code in the project and type `/hi`.

      **－** It writes nothing into the folder of the plugin, and runs no `guppi` command and no `git`
      command.

      **－** The skills it copies under `.claude/skills/` keep their bare names, such as `hi`.

      **－** Which files a new project needs, what the install does about `uv` and the Python environment
      under `.guppi/`, and what it does with a file of the project that stands at one of its paths are
      no part of this promise.'
  applied: '23:31:09'
