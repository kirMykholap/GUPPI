- case: '947'
  decision: decision-case-947
  origin: raw/2026-10-30/2345/ledger.md#case-947
  targets:
  - kind: update
    category: estimates
    slug: estimate-prespec-checks-the-frontier
    ref: rule-prespec
  tags: []
  case_text:
    context: 'When a session takes a conserved Spec, `/box` runs it, and the agent closes each other open
      line of the Frontier as left. A line whose target a `defer` item of that Spec puts off closes `[-]
      … · defer case N`, N being the Case of that Spec, with no ledger line of this session (case 620.1).
      For a line of the source `backlog`, that closer is `[-] … · backlog · defer case N`. `guppi prespec
      --check` judges such a line by `check_backlog_defer_line`, which looks for the `defer` lines of
      Case N and their `{supersedes:case M}` marks only among the decision lines of the session''s window.
      The lines of a Case of the conserved Spec stand in the `ledger.md` of the folder that `/carry` marked,
      outside that window. So the check reports that no defer line of Case N names a page of the title.
      The same judgment feeds the hook on `ExitPlanMode`, so the finding stops a `/box` session, which
      ratifies no Case of its own and cannot fix it. Before Case 937 the line was a finding too, through
      `PUT_OFF_CLOSER`. A line of another source is judged against the `defer` items of the conserved
      Spec by `conserved_blocks` and passes. A Glob `vault/raw/**/carry.md` printed nothing, so no conserved
      Spec waits today and no session has met the finding. The handoff of session 2005 left it as a line,
      and the person chose that the check also reads the ledger of the conserved Spec and judges the line
      as for a Case of the session, marks included.


      I read in `.guppi/guppi/prespec.py` the module docstring, `window_lines`, `session_decisions`, `deferred_pages`,
      `decided_on_its_page`, `check_backlog_line`, `check_backlog_defer_line`, `conserved_blocks`, `has_defer_item`,
      `check_frontier`, `judge` and `plan_findings`, and `conserved_spec_named` of `.guppi/guppi/box.py`.
      `plan_findings` passes `check_frontier` the records of `window_lines`, which reads the session''s
      own `ledger.md` and the date-level ledgers from the `hi` on. `conserved_spec_named` returns the
      folder of the conserved Spec only when `carry.md` marks it, and `/carry` keeps `guppi materialize`
      off that folder, so the page''s `deferred_by` does not yet hold Case N. The new reading takes the
      lines of that folder''s `ledger.md` by `TIMED_RECORD` and `session_decisions`, so a decision line
      is parsed by `materialize.parse_line` as everywhere else, and the judgment stays `decided_on_its_page`
      with `by_defer`; a Grep for `"ledger\.md"` over `.guppi/guppi` printed `archive.py`, `casecheck.py`,
      `caseid.py`, `materialize.py`, `lint.py`, `ledger.py`, `prespec.py`, `ratified.py`, `onward.py`
      and `tail.py`, and none of them holds a reader of the decision lines of a whole session ledger that
      this Case could import instead, so the task adds no second copy of a judgment, as `rule-one-judgment-one-implementation`
      sets it.


      The Criterion of `estimate-prespec-checks-the-frontier` says that the check reads the decision lines
      of the session''s window, so this Case replaces it; its `purpose` and its `method`, the run of `.guppi/tests/test_prespec.py`,
      still hold. Three lines of the old Criterion are not carried word for word, by intent: the second
      line of `When` gains the ledger of the conserved folder, the line on `defer case N` after `sprint`
      and `backlog` gains its last sentence on where the lines of Case N stand, and the `－` line on a
      title line that names no folder holding `carry.md` gains the backlog line judged against the window
      alone; each keeps the rest of its old text. A Grep for `decision lines of the session''s window`
      over `vault/wiki/`, `.claude/` and `.guppi/guppi/` printed `.guppi/guppi/gate.py`, `estimate-prespec-requires-a-backlog-item-decided-on-its-page`,
      `estimate-prespec-notes-a-page-the-cascade-archives`, `estimate-prespec-matches-lines-and-items`
      and `estimate-prespec-checks-the-frontier`. The other hits stand: `gate.py` and the matching of
      lines and items speak of the plan''s own Cases, the cascade note of the plan''s `then` blocks, and
      `estimate-prespec-requires-a-backlog-item-decided-on-its-page` of lines closed `[x] … · backlog
      · case N`, which a `/box` session does not write. The texts that set the closer stand: `orchestration.md`
      and the skill of `rule-skill-hi` ask of Case N a `defer` line that names the page with the marks,
      and `/pre-spec` reports the line otherwise, which stays true; `estimate-hi-takes-a-conserved-spec`
      names the closer and not the check. `estimate-orchestration-closes-a-backlog-item-deferred-again`
      stands, a finding of `/pre-spec` named: its Criterion asks that the agent take the closer only for
      a Case whose decision lines meet the backlog rule of `estimate-prespec-checks-the-frontier`, and
      its `When` covers a Case of the session only; for such a Case the rule judges the same lines of
      the session''s window after this Case as before it, and the ledger of the conserved folder adds
      only the lines of a Case of the conserved Spec, which that `When` does not cover. A Case of the
      conserved Spec whose `defer` lacks a mark is still a finding, since `generate` would then keep the
      old defer beside the new one; the agent may close such a line `kept`. The tests of the Frontier
      check build their files under a temporary folder; `test_the_live_code_holds_no_pointer_outside_a_bracket`
      of `.guppi/tests/test_ship.py` reads the live code, so each pointer to a Case in a new docstring
      stands in a bracket at the end of its sentence. The brief reports `uv run --project .guppi guppi
      test` at the close of session 2005 as "1819 passed, 6 skipped, 1 deselected, exit 0", and no output
      of `guppi prespec --check`. The session''s ledger holds no `lesson[error]` line, so no line carries
      `{addresses:...}`.'
    problem: '`guppi prespec --check` reports a backlog line that a Case of the conserved Spec puts off
      again, closed `[-] … · backlog · defer case N` as the `/box` closer sets it, because it looks for
      the decision lines of that Case only in the session''s window. The finding stops the exit from Plan
      Mode of a session that cannot fix it.'
    recommend: "- **What the check reads for a backlog line put off by a Case of the saved Spec**\n  -\
      \ Recommended: (a) also read the saved Spec's own ledger, and judge the line as for a Case of the\
      \ current session, marks included.\n  - Answer: agreed, (a)."
    given: '`.guppi/guppi/prespec.py`: the Frontier check `check_frontier` and `check_backlog_defer_line`,
      which judge a backlog line closed `defer case N`.

      **＋** `.guppi/guppi/box.py`: `conserved_spec_named`, which finds the folder of the conserved Spec
      that the title line of the plan names.

      **＋** `.guppi/tests/test_prespec.py`: the tests of the Frontier check.

      **＋** `.guppi/tests/test_ship.py`: its test of pointers in the live code reads the new docstrings.

      **＋** `estimate-prespec-checks-the-frontier`: its Criterion is replaced whole.

      **＋** `vault/raw/<date>/<HHMM>/frontier.md`: the Frontier the check reads.

      **＋** `vault/raw/<date>/<HHMM>/spec.md` and `vault/raw/<date>/<HHMM>/ledger.md`: the conserved Spec
      that the title line of the plan may name, and the ledger of its folder.

      **＋** `rule-one-judgment-one-implementation`: the line of a Case of the conserved Spec is judged
      by the one judgment of a page decided by a Case.'
    when: '`uv run --project .guppi guppi prespec --check <plan>` reads the session''s `vault/raw/<date>/<HHMM>/frontier.md`,
      and the title line of `<plan>` may name the `vault/raw/<date>/<HHMM>/spec.md` of a folder that holds
      `carry.md`.

      **＋** The check reads the decision lines of the session''s window, the decision lines of the `vault/raw/<date>/<HHMM>/ledger.md`
      of that folder when the title line names one, and the pages of the vault.'
    then: 'A missing file is the finding `frontier: <path> is missing`.

      **＋** An open line under `## Cases` is a finding. An open line under `## Work` or `## Ask` is not.

      **＋** A closed line whose last segment after ` · ` is none of `case N`, `work`, `defer`, `kept`
      and `defer case N` is a finding.

      **＋** These pairings of box and closer are findings: `[x]` with `defer`, `kept` or `defer case N`,
      and `[-]` with `case N` or `work`.

      **＋** `defer` is clean only after the source segment `sprint`, the segment before the closer. `kept`
      is clean only after the source `backlog`. After any other source, each one is a finding.

      **＋** `defer case N` after the source `sprint` is a finding. After the source `backlog`, it is a
      finding when no `defer` line of Case N or of its sub-cases names a slug that the title, the text
      before the first ` · `, names in a code span. It is also a finding for each Case M of the `deferred_by`
      of such a page when no Case among Case N and its sub-cases both names the page on a `defer` line
      and carries `{supersedes:case M}`. The lines of Case N are those of the session''s window and, for
      a Case of the conserved Spec, those of the `ledger.md` of its folder.

      **＋** After another source, `defer case N` is a finding when there is no `defer` item under Case
      N in the plan, and none under Case N of the `spec.md` that the title line of the plan names.

      **＋** A line closed `case N` is a finding when the plan has no heading of Case N.

      **－** A title line that names no folder holding `carry.md` adds no Case and no ledger: `defer case
      N` after the source `backlog` is then judged against the session''s window alone, and after a source
      other than `sprint` or `backlog` against the plan alone.

      **－** A line that is not a box line, such as `Backlog: N items` or an indented `- near` line, is
      not read. No line of another session''s Frontier file is read.'
  spec: vault/raw/2026-10-30/2345/spec.md
  applied: 01:09:20
- case: '948.1'
  decision: decision-case-948.1
  origin: raw/2026-10-30/2345/ledger.md#case-948.1
  targets:
  - kind: update
    category: rules
    slug: rule-case-build
    ref: rule-case-build
  - kind: create
    category: estimates
    slug: estimate-case-build-reads-each-list-of-a-new-member
    ref: rule-case-build
  tags:
  - session
  - workflow
  - harness
  - case-build
  case_text:
    given: '`rule-case-build`: its Render, `.claude/agents/case-guppi.md`, gains the sentence on a new
      member of a list.

      **＋** `estimate-case-build-reads-each-list-of-a-new-member`: the new check of that sentence.

      **＋** `vault/wiki/` outside `decisions/`, `.claude/` and `.guppi/guppi/`: the texts the search runs
      over.'
    when: '`case-guppi`, with `.claude/agents/case-guppi.md` rendered from `rule-case-build`, builds a
      Case that adds a member to a list that texts spell out one by one — a key of an item, a kind, a
      status or a field — and is about to answer with its summary.'
    then: 'It searches the live pages of `vault/wiki/` outside `decisions/`, `.claude/` and `.guppi/guppi/`
      for a member that stands in the list already.

      **＋** It reads each hit that lists the members of the list.

      **＋** Each text that lists the members and would miss the new member enters the Case, or the `context`
      of the Case names it and says why it stands.

      **－** A hit in a History line, in `log.md` or in `brief.md` is not read.'
    context: '`estimate-case-build-reads-the-readers-of-a-changed-step` checks the sentence of case 924
      in the Render of `rule-case-build`: a Case that changes what a step writes, copies or shows searches
      for the name of that output and reads each step that reads it. Its reading at the Retro of session
      2005, line 54 of `vault/raw/2026-10-30/2005/ledger.md`, came out `failed`: at the `/pre-spec` of
      session 1713, finding 1.2 was Case 931, which added `drop` to the keys of a page `update` and left
      two texts that list those keys one by one, the sentence of `case-schema.md` on the sub-point keys
      that the hook of `rule-spec-write` reads, and the sentence of `rule-materialize` that lists the
      keys the lift carries. Both texts were fixed in that session: the file of Case 931, built again
      after `/pre-spec`, holds a second pair on `rule-case-protocol` that adds `drop` to that list, and
      line 30 of `vault/wiki/case-schema.md` now holds `drop` among the keys; Case 935.1 added `drop`
      to the sentence of `rule-materialize`, and that page''s History holds the line of `decision-case-935.1`.
      So no Case is needed for the two texts. The miss has one shape: a new member of a list is a word
      no text holds yet, so a search for it finds nothing, while a search for a member already in the
      list finds each text that lists them; the file of Case 931 built again says that a Grep of `` `rename`
      `` over `vault/wiki` printed both texts. The sentence of case 924 names outputs and paths, and the
      sentence of case 784 names a field, term or command whose behaviour changes; neither names a new
      member of a list, and both stand, since the new sentence adds to them and changes neither. A finding
      of `/pre-spec` named `estimate-case-build-checks-the-finished-case`, which I read: its When is `case-guppi`
      about to answer with a built Case, and one line of its Then is the search for the name of each field,
      term or command whose behaviour the Case changes, the sentence of case 784; its `purpose` and `method`
      count what `ask-guppi` still finds at `/pre-spec` among the checks they list. Its Criterion stands:
      the new sentence changes none of the searches it lists, and a search for the name of a changed thing
      cannot find a list that a new member is missing from, since that member stands in no text yet. The
      new search is a promise of its own: it can fail while the search of case 784 passes, and the fix
      is another sentence, so by the rule of atomicity in `ratification.md` it gets its own Estimate,
      not a line added to that Criterion. The rule on a failed Estimate is line 35 of `rule-estimates-schema`:
      a `failed` Estimate is debt until a human decides, and archival is the default absent a decision
      to fix. The person chose to fix it: Case 948.1 adds to the Render one sentence on a new member of
      a list and creates `estimate-case-build-reads-each-list-of-a-new-member` to check it; a Glob `vault/**/*list*member*`
      printed nothing, so the slug is free. Case 948.2 sets the failed Estimate `pending` again, its Criterion
      written back word for word, its `purpose` kept since it states the same promise, and its `method`
      set anew to wait for the `/pre-spec` of the first session on the new Render. The brief reports the
      last `guppi check` under `## Flags`: `estimate-case-build-reads-the-readers-of-a-changed-step: unread:
      failed`. In `.guppi/guppi/lint.py` I read `check_unread`, `waits_for_a_later_moment`, `waits_for_an_event`
