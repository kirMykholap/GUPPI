- case: '946'
  decision: decision-case-946
  origin: raw/2026-10-30/2345/ledger.md#case-946
  children:
  - decision-case-946.1
  - decision-case-946.2
  tags: []
  case_text:
    context: 'Case 942.1 removed `## How it works` from each Leaf of `vault/wiki/rules/` and moved its
      facts into the docstrings of the code. The agent of session 2005 found two facts that do not match
      today''s code, and it moved neither. At /hi of this session, the reading of `estimate-rules-schema-leaf-carries-no-how-it-works`
      was `failed` on those two facts. The first fact is the last sentence of the old section of `rule-governed-files-hook`,
      which said that subagents get no project hook. The archived Spec of session 2026-09-12/0454 holds
      that sentence. The sentence is false. The Claude Code hooks page (https://code.claude.com/docs/en/hooks)
      says that hooks from settings files also run inside subagents and that the hook input then carries
      `agent_id` and `agent_type`. In this build, the `PostToolUse` hook `pageread` added its context
      to the reads of `case-guppi`, which is a subagent. The docstring of `.guppi/guppi/ratified.py` also
      records the `agent_type` that Claude Code gives a hook fired inside a subagent (measured 2026-10-05).
      I read `run`, `governed`, `relative` and `key` of `.guppi/guppi/guard.py`: no condition reads the
      agent, so the hook refuses an edit of a subagent the same way.


      The second fact is the condition under which the Spec hook removes a parent. The old section of
      `rule-spec-write`, as the archived Spec of session 2026-10-07/2114 holds it (case 722.2), removes
      the parent when it holds no decision line of its own that no mark retires. The docstring says the
      parent holds no decision line of its own. I read `remove_superseded`, `ancestors` and `remove_case`
      of `.guppi/guppi/ratified.py`, `retired_whole`, `retired_by` and `superseded_in_window` of `.guppi/guppi/prespec.py`,
      and `in_family` of `.guppi/guppi/materialize.py`. The parent step tests `parent not in own`, so
      the docstring states that step as written. But a mark retires the parent''s own line only when it
      names the parent or a Case above it, by `in_family`. Such a mark puts that Case among the removed
      Cases, and `remove_case` removes it with all its sub-cases. So the two texts give the same result.
      The old wording therefore stays true in `vault/wiki/case-schema.md`, in its source `rule-case-protocol`
      and in the Criterion of `estimate-spec-write-removes-a-superseded-case`, and these stand. The test
      `test_superseded_a_parent_with_a_line_of_its_own_stays` of `.guppi/tests/test_ratified.py` covers
      the parent step, and the code does not change.


      The rule that governs is `rule-rules-schema`: a Leaf keeps its mechanism in the docstring of its
      code. `CLAUDE.md` asks for a real source for each claim, so a false fact is corrected, never moved.
      The Criterion of `estimate-rules-schema-leaf-carries-no-how-it-works` asks that each fact stand
      in the docstring, which a corrected fact cannot meet, so Case 946.1 replaces that Criterion and
      sets its `purpose` and `method` anew. Two lines of the old Criterion do not carry over on purpose:
      its `When`, which waited for the librarian''s run that has already applied Case 942.1, and the fact
      line that asked for each fact as it stood. Case 946.2 likewise drops the line of the Criterion of
      `estimate-shell-write-check-repairs-and-reports` that a shell call of a subagent is not checked.
      A Grep for `does not inherit|inherit no project hook` printed `vault/wiki/brief.md`, `vault/wiki/rules/rule-documentation.md`,
      `vault/wiki/rules/rule-shell-write-check.md` and `vault/wiki/estimates/estimate-shell-write-check-repairs-and-reports.md`
      over `vault/wiki/`, nothing over `.claude/`, and `.guppi/guppi/shellwrite.py` over `.guppi/guppi/`.
      The brief is not read. Case 946.2 fixes the other four. I read `run`, `lines_for`, `judge` and `changed_files`
      of `.guppi/guppi/shellwrite.py`, and no condition reads the agent. The Render of `rule-documentation`
      keeps the librarian''s own `PostToolUse` hook, and only the reason given in its `## How it works`
      goes. This Case does not judge whether that hook is still needed. The Criterion of `estimate-governed-files-hook-refuses`
      says nothing about subagents, so it stands. A Grep of `.guppi/tests/` for `How it works`, the slugs
      of the Estimates and `librarian-guppi.md` found no test that reads a live file this Case changes.
      The session''s ledger holds no `error` lesson.'
    problem: Two facts of the removed `## How it works` sections stand in no docstring. One fact is false,
      and its false reason also stands in four other live texts. The Estimate on the moved facts asks
      for each fact as it stood, so it cannot pass.
    recommend: "- **What the docstring of guard.py says about subagents**\n  - Recommended: (a) the docstring\
      \ states the true fact: Claude Code runs the hook on a call of a subagent too, and the hook refuses\
      \ it the same way.\n  - Answer: agreed, (a).\n- **Whether the Case also fixes the same false reason\
      \ elsewhere**\n  - Recommended: (a) a second sub-case fixes the docstring of `shellwrite.py`, the\
      \ Purpose of `rule-shell-write-check`, the Criterion of its Estimate and the `## How it works` of\
      \ `rule-documentation`.\n  - Answer: agreed, (a).\n- **What the docstring of ratified.py says about\
      \ removing a parent**\n  - Recommended: (a) the docstring adds one clause that joins the two wordings;\
      \ the code does not change.\n  - Answer: agreed, (a).\n- **How the Estimate on the moved facts is\
      \ checked**\n  - Recommended: (a) replace the Criterion of `estimate-rules-schema-leaf-carries-no-how-it-works`\
      \ whole, and set its purpose and method anew.\n  - Answer: agreed, (a)."
  spec: vault/raw/2026-10-30/2345/spec.md
  applied: 01:09:20
