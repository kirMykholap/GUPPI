      the entries marked incomplete or failed, the pages archived, the flags you raised, the lint total,
      and each part that another step of this frame sends to the report. Nothing else: no test result
      and no list of files (as set in case 913). Commit the vault with the files the render wrote, by
      the Bash tool, since the command is written for a POSIX shell: `git add vault $(uv run --project
      .guppi guppi render --paths) && git commit -m "docs(vault): librarian, <date>"`, never `--amend`,
