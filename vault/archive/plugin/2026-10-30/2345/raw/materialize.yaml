  case_text:
    context: 'The librarian ends its run with a report, and `/handoff`, or `/box` in a session that `/box`
      runs, shows it to the person unchanged. No file of the repository holds that report, and `/hi` reads
      no transcript of an earlier session (case 670.5), so the method of `estimate-close-reports-the-run`
      asks the person whether the report was complete. At the /hi of this session the person answered
      from memory on the report of session 2005, and the ledger holds that reading as passed; the person
      said the Estimate is wrong, since the agent should read and check the report by itself. The `##
      Result` of the page also holds an earlier failed reading that rested on another report than the
      one the method meant. With this Case the librarian writes its report by the `Write` tool into `report.md`
      in the session folder, the folder of the `handoff.md` its dispatch names, before its commit, so
      the commit of the run takes the file, and it returns the text of that file unchanged. `rule-close`
      is a Leaf with `core: true` and status `draft`; its Render is the close step of `.claude/agents/librarian-guppi.md`,
      and the Case rewrites that paragraph whole by one pair; its `## Purpose` stands, since it speaks
      of the commit only. The Criterion of `estimate-close-reports-the-run` is replaced whole, and its
      `purpose` and `method` are set anew, since both name the report as `/handoff` shows it and the person''s
      answer; the Estimate goes `pending`, and the passed reading of this session stays in its History.
      No line of the old Criterion is carried word for word, by the person''s choice of a Criterion replaced
      whole. Its `When` lines, on the run that `/handoff` or `/box` dispatches and the showing of its
      report, become one `when` line on that run reaching the close. Its lines on the parts of the report,
      on what the report does not hold and on the limit of lines now speak of the file. Its line on the
      exit code of `uv run --project .guppi guppi test` that `/box` shows beside the report is dropped,
      since that exit code is a line of `/box` and never enters the file. The Criterion promises the file
      and what it holds; that the returned text equals the file stands in the Render only, since the event
      log of the run keeps a tool name and one input field, never the text written (read in `.guppi/guppi/event.py`,
      the module docstring and `tool_detail`), and the chat of an earlier session is not read. The librarian''s
      run of this session still loads the old frame when it starts, so the first run that writes `report.md`
      is that of the next session, and the reading waits for it. The frame already says that a hook''s
      refusal of a call is named in the report; a refused commit comes after the file is written, so the
      new Render places such a refusal after the text of the file in the returned report, which keeps
      the two sentences from contradicting each other. A finding of `/pre-spec` on the ratified Case showed
      that step 1 of the Render of `rule-documentation`, which is `built` and has `core: true`, tells
      the librarian to write the report and stop when `guppi materialize` exits 1, before any close or
      commit; the person chose that such a run writes no `report.md` and returns its report as text, as
      today, and the Case rewrites that sentence by one pair, while the Criterion, whose `when` is a run
      that reaches the close, does not change. A Grep of `write the report and stop|exits 1, write the
      report` over the repository outside `vault/raw/` printed `.claude/agents/librarian-guppi.md`, `vault/wiki/rules/rule-documentation.md`,
      `vault/archive/migration/2026-09-10/raw/materialize.yaml` and `vault/archive/migration/2026-09-10/raw/spec.md`;
      the two archived files are records of an earlier session and stand, and the agent file follows by
      the render. The sentence of that Render that the librarian writes only through the scripts named
      below stands: it follows the sentence on `vault/wiki/`, the same frame already names a write outside
      the scripts, `vault/wiki/brief.md` by the `Write` tool, and `report.md` lies outside `vault/wiki/`,
      its write set in the close step. The `## Purpose` and `## How it works` of `rule-documentation`
      say nothing of where the report goes, and the Criterion of its Estimate `estimate-documentation-completes`
      has no line on the stop at step 1, so both stand. `estimate-close-commits` stands: its Criterion
      lets the commit take any path under `vault/`, and `report.md` lies there. `estimate-documentation-completes`
      stands: `report.md` is no page of `vault/wiki/`, and the librarian writes it by `Write`, not by
      `cp`, `mv`, a redirect or a heredoc. A Grep of `rule-close|librarian-guppi\.md|close-reports|no
      test result` over `.guppi/` printed `.guppi/guppi/onward.py` and `.guppi/guppi/render.py`, neither
      under `.guppi/tests/`, so no test reads the changed file live. A Grep of `librarian.{0,40}report|report
      of the librarian|its report` over `vault/wiki/` printed the files `rule-handoff`, `rule-spec-box`,
      `rule-where-to-stop`, `rule-skill-hi`, `rule-retro`, `rule-case-protocol`, `case-schema.md`, `where-to-stop.md`,
      `glossary.md`, `entity-glossary`, `estimate-close-reports-the-run`, `estimate-handoff-dispatches`,
      `estimate-spec-box-runs-a-conserved-spec`, `estimate-documentation-completes`, `estimate-orchestration-states-a-subagent-fact-from-its-transcript`,
      `estimate-sprint-close-runs-in-the-librarian-run`, `estimate-where-to-stop-stops-only-on-its-conditions`,
      `estimate-synthesis-clusters`, `lesson-hi-reads-the-end-state-of-a-command-that-failed-first`, `lesson-librarian-writes-a-total-no-count-printed`,
      `lesson-brief-lists-transcript-readings-under-work`, `lesson-hooks-subagentstop-reads-the-last-text-not-the-handback`,
      `lesson-harness-a-paths-rule-misses-a-new-file-and-a-compaction`, `insight-case-build-changes-a-step-without-reading-its-readers`
      and `log.md`, 25 files; the hits read outside the lessons, the Insight and `log.md` say that `/handoff`
      and `/box` show the report unchanged, or name the report as the end of a run, and each stays true,
      since the report the librarian returns is still the one they show.'
    problem: The Estimate of the librarian's report can be read only by the person, from a text shown
      once in the chat of an earlier session, so the agent cannot check it by itself.
    recommend: "- **How the agent reads the report**\n  - Recommended: (a) the librarian writes the report\
      \ into `report.md` in the session folder before its commit and returns the same text.\n  - Answer:\
      \ agreed, (a).\n- **What happens to the promise and to today's passed reading**\n  - Recommended:\
      \ (a) one Estimate: its Criterion replaced whole with the file, its `purpose` and `method` set anew,\
      \ its status `pending`.\n  - Answer: agreed, (a).\n- **What the Estimate promises about the text\
      \ the librarian sends back**\n  - Recommended: (a) the Estimate promises the file and its content\
      \ only; the frame still tells the librarian to return the text of the file unchanged.\n  - Answer:\
      \ agreed, (a).\n- **Change**\n  - Asked: after a finding of `/pre-spec`, the person chose that a\
      \ run that stops at step 1 of the frame, when `guppi materialize` exits 1, writes no `report.md`\
      \ and returns its report as text, as today; the Criterion does not change.\n  - Taken: an `update`\
      \ of `rule-documentation` rewrites step 1 of its Render so; `context` says why the line on the scripts\
      \ as the only way to write stands."
    given: '`rule-close`: the Rule whose Render is the close step of the librarian.

      **＋** `rule-documentation`: the Rule whose Render is the frame of the librarian, step 1 among its
      steps.

      **＋** `.claude/agents/librarian-guppi.md`: the frame of the librarian, rendered from both.

      **＋** `estimate-close-reports-the-run`: its Criterion is replaced whole.

      **＋** `.claude/skills/handoff/SKILL.md`: dispatches the librarian''s run and shows its report.

      **＋** `.claude/skills/box/SKILL.md`: dispatches the librarian''s run in a session that `/box` runs.

      **＋** `vault/raw/<date>/<hi HHMM>/report.md`: the file the run writes.'
    when: The librarian's run that `/handoff` of `.claude/skills/handoff/SKILL.md` dispatches, or that
      `/box` of `.claude/skills/box/SKILL.md` dispatches in a session that `/box` runs, reaches the close
      of `.claude/agents/librarian-guppi.md`.
    then: 'Before its commit, the librarian writes its report by the `Write` tool into `vault/raw/<date>/<hi
      HHMM>/report.md`, the folder of the `handoff.md` its dispatch names.

      **＋** The commit of the run takes that file.

      **＋** The file gives the pages created and updated per category, the entries marked incomplete or
      failed, the pages archived, the flags the run raised and the lint total.

      **＋** The file gives each part that another step of `.claude/agents/librarian-guppi.md` sends to
      the report.

      **－** The file holds no test result and no list of files.

      **－** No limit of lines binds the file.'
  spec: vault/raw/2026-10-30/2345/spec.md
  applied: 01:09:20
- case: '945'
  decision: decision-case-945
  origin: raw/2026-10-30/2345/ledger.md#case-945
  targets:
  - kind: update
    category: rules
    slug: rule-where-to-stop
    ref: rule-where-to-stop
  - kind: create
    category: estimates
    slug: estimate-where-to-stop-writes-each-step-whole
    ref: rule-where-to-stop
  tags:
  - session
  - workflow
  - harness
  case_text:
    context: 'When Work Mode stops for the person to do something by hand, the agent''s reply lists the
      steps. No rule sets how those steps are written. At the stop of Work Mode of session 2005, the steps
      wrote out the start command with `UV_OFFLINE=1` and `UV_CACHE_DIR` only for the second test project.
      The step for the fourth project said "the same two variables as in step 4". The person started it
      in a new window, which kept neither variable, and the fourth project installed online. So the reading
      of `estimate-plugin-install-sets-aside-the-files-of-the-project` did not happen (lesson `lesson-plugin-install-steps-named-the-offline-variables-by-reference`,
      ledger line L56 of session 2005). The steps came from one `then` line of Case 943.1, which asked
      for "the steps for each project" and set no form.


      `rule-where-to-stop` renders `vault/wiki/where-to-stop.md`, which `/work`, `/box` and `/hi` load.
      It sets when the agent stops and that the reply ends with the question to the person. It says nothing
      on the form of steps the person runs by hand. The person chose to add the guard there, for every
      stop, and to check it by a new Estimate, read at the next stop whose reply gives the person commands
      to run. The new sentence goes after the sentence that ends the reply with the question, so the eight
      numbered conditions keep their numbers. The page has `core: true`, so the pointer to this Case stands
      in a bracket at the end of its sentence.


      `estimate-where-to-stop-stops-only-on-its-conditions` stands `passed`. Its Criterion speaks of when
      the agent stops and that it asks. One of its lines also speaks of what a reply holds: on a refusal
      of the auto mode classifier, the reply gives the shell command that does what the refused call would
      do, for the person to type after `!`. That line promises that the command is given; the new sentence
      sets how a command the person runs is written, and its own Estimate checks that. The new text adds
      one sentence after the eight conditions and leaves the text that sets each line of that Criterion
      word for word, so each line still holds and its Criterion stands. This Case does not set it `pending`.
      Its `method` names a reading at the Retro of the session that changes the Render; the new Render
      makes no line of its Criterion false, so that reading would find what its last Result found, and
      this Case does not ask for it. The deferral of the reading of `estimate-plugin-install-sets-aside-the-files-of-the-project`
      is Frontier item C6, and this Case leaves it out.


      A Grep of `.guppi/` for `where-to-stop|where_to_stop` printed `.guppi/tests/test_gate.py`, `.guppi/guppi/gate.py`,
      `.guppi/tests/test_onward.py` and `.guppi/guppi/onward.py`; each hit names the path inside a message
      string, and none reads the text of the file, so no test needs a change. A Grep of `.claude/` for
      `where-to-stop|stop:` printed `.claude/skills/work/SKILL.md`, `.claude/skills/box/SKILL.md`, `.claude/skills/hi/SKILL.md`,
      `.claude/skills/pr-review/SKILL.md`, `.claude/skills/sprint-open/SKILL.md` and `.claude/skills/retro/SKILL.md`;
      they load the file or name a condition by its number, and the new sentence changes no number. A
      Grep of `vault/wiki/rules/` for `STOP:|reply that stops|the question to the person` printed `rule-prespec-onward.md`,
      `rule-where-to-stop.md`, `rule-retro-onward.md` and `rule-retro.md`, and the same Grep of `.claude/`
      printed `.claude/skills/retro/SKILL.md`. Each of the other hits sets that a stop reply opens with
      `STOP:`, and none sets what the steps of the reply hold, so this Case does not cover the `STOP:`
      opening. The lesson stands in the ledger of session 2005, and the ledger of this session holds no
      `error` lesson, so no line carries `{addresses:...}`.'
    problem: A stop reply may write a command once and then point to it from a later step. A new window
      keeps none of the variables, so the person runs a different command than the check needs.
    recommend: "- **Which text carries the guard?**\n  - Recommended: (a) `rule-where-to-stop`, a paragraph\
      \ on the stop reply.\n  - Answer: agreed, (a).\n- **Which check closes the Case?**\n  - Recommended:\
      \ (a) a new check, read at the next stop with steps by hand.\n  - Answer: agreed, (a)."
    given: '`rule-where-to-stop`: sets when Work Mode stops and how the reply ends.

      **＋** `vault/wiki/where-to-stop.md`: the Render of `rule-where-to-stop`, loaded by `/work`, `/box`
      and `/hi`.

      **＋** `estimate-where-to-stop-writes-each-step-whole`: the new check of the steps of a stop reply.'
    when: Work Mode stops on a condition of `vault/wiki/where-to-stop.md`, and the reply asks the person
      to run commands by hand.
    then: 'Each step of the reply writes out whole each command it asks the person to run, as the person
      types it, with each variable, folder and flag the command needs.

      **＋** A step that starts a program in a new window or terminal writes the variables that the start
      needs in its own command.

      **－** No step names a part of its command by a reference to another step.'
  spec: vault/raw/2026-10-30/2345/spec.md
  applied: 01:09:20
- case: '946.1'
  decision: decision-case-946.1
  origin: raw/2026-10-30/2345/ledger.md#case-946.1
  targets:
  - kind: update
    category: estimates
    slug: estimate-rules-schema-leaf-carries-no-how-it-works
    ref: rule-rules-schema
  tags: []
  case_text:
    given: '`estimate-rules-schema-leaf-carries-no-how-it-works`: its Criterion is replaced whole, and
      its purpose and method are set anew.

      **＋** `.guppi/guppi/guard.py`: the hook of `rule-governed-files-hook`, whose docstring gains the
      fact on subagents.

      **＋** `.guppi/guppi/ratified.py`: the Spec hook of `rule-spec-write`, whose docstring gains the
      clause on a retired parent.

      **＋** `rule-rules-schema`: the rule that a Leaf keeps its mechanism in the docstring of its code.

      **＋** `rule-internal-context`: its `## Purpose` holds the facts of its old section.

      **＋** `vault/wiki/rules/`: the Rule pages that the reading covers.'
    when: After Work Mode writes the docstrings of `.guppi/guppi/guard.py` and `.guppi/guppi/ratified.py`,
      an agent reads each Leaf page of `vault/wiki/rules/` and the docstring of the code that its `implementation_ref`
      names.
    then: 'No Leaf page of `vault/wiki/rules/` carries a section `## How it works`.

      **＋** Each fact that such a section held stands, as the code bears it out, in the docstring of the
      code that the page''s `implementation_ref` names, and for `rule-internal-context` in its `## Purpose`;
      a fact that the code does not bear out stands there corrected.

      **＋** The docstring of `.guppi/guppi/guard.py` says that Claude Code runs the hook on a call of
      a subagent too, and that the hook refuses such a call the same way.

      **＋** The docstring of `.guppi/guppi/ratified.py` says that a parent whose own decision line a mark
      retires is named by that mark or lies under a Case it names, and leaves by that mark with its sub-cases.

      **－** A remark on what stood before some Case does not move into the docstrings or the Purpose.

      **－** A MOC page of `vault/wiki/rules/` keeps its `## How it works`.'
    context: 'Case 942.1 removed `## How it works` from each Leaf of `vault/wiki/rules/` and moved its
      facts into the docstrings of the code. The agent of session 2005 found two facts that do not match
      today''s code, and it moved neither. At /hi of this session, the reading of `estimate-rules-schema-leaf-carries-no-how-it-works`
      was `failed` on those two facts. The first fact is the last sentence of the old section of `rule-governed-files-hook`,
      which said that subagents get no project hook. The archived Spec of session 2026-09-12/0454 holds
      that sentence. The sentence is false. The Claude Code hooks page (https://code.claude.com/docs/en/hooks)
      says that hooks from settings files also run inside subagents and that the hook input then carries
      `agent_id` and `agent_type`. In this build, the `PostToolUse` hook `pageread` added its context
      to the reads of `case-guppi`, which is a subagent. The docstring of `.guppi/guppi/ratified.py` also
      records the `agent_type` that Claude Code gives a hook fired inside a subagent (measured 2026-10-05).
      I read `run`, `governed`, `relative` and `key` of `.guppi/guppi/guard.py`: no condition reads the
      agent, so the hook refuses an edit of a subagent the same way.


      The second fact is the condition under which the Spec hook removes a parent. The old section of
      `rule-spec-write`, as the archived Spec of session 2026-10-07/2114 holds it (case 722.2), removes
      the parent when it holds no decision line of its own that no mark retires. The docstring says the
