  case_text:
    context: '`estimate-orchestration-acknowledging-reply` checks the form of the reply that acknowledges
      a ratification. Case 992.2 added to its Criterion the line that an acknowledging reply after `/pre-spec`
      that waits for the person''s word opens with `STOP:`, the `LEDGER` block right after it. The reading
      of ledger line 22 of session 2038 then set the page `passed`, but it was taken on the replies of
      that session, on the Render before Case 992.2, and its Result says that the `STOP:` line was not
      exercised (brief, Flags; handoff of session 2038, Observations). Such a reply comes only in a session
      where, after `/pre-spec`, an acknowledging reply still waits for the person, so the line needs a
      reading of its own. `rule-estimates-schema` sets that the `＋` and `－` lines stay in one Criterion
      while one run checks them, and that a line with a test or a reading of its own is split off, on
      the axis of the promise. The person chose the split: Case 993.1 replaces the Criterion of the old
      Estimate whole without that line, which only points to the new Estimate, and the old Estimate goes
      `pending` and is read at the Retro of this session; Case 993.2 creates `estimate-orchestration-acknowledging-reply-opens-with-stop-after-prespec`,
      whose `method` waits for that event, as case 781 sets for a part that opens with `by hand, after`.
      The text of `rule-orchestration` and of `vault/wiki/orchestration.md` does not change, since the
      behaviour stays as Case 992.2 set it; only the Estimates that check it change. The `purpose` and
      `method` of the old Estimate state the four parts in order and the replies it reads, not the `STOP:`
      line, so they stand. The block of the old Estimate in `.guppi/links.md` names as neighbours `estimate-ledger-write-holds-a-decision-line-off-the-stored-case`,
      `rule-ledger-write`, `rule-orchestration`, `rule-prespec-onward` and `estimate-orchestration-shows-the-frontier-after-a-closed-line`;
      none of their purpose lines speaks of the `STOP:` line of an acknowledging reply. A Grep of `vault/wiki/`
      for `estimate-orchestration-acknowledging-reply`, `log.md` and `brief.md` left out, printed `rules/rule-orchestration.md`
      (its `estimates` list and a History line) and `estimates/estimate-orchestration-shows-the-frontier-after-a-closed-line.md`;
      the two lines of the second say that the checklist and the own form of the acknowledging reply are
      as the old Estimate sets them, and both stay true, since the checklist and the four parts do not
      change. A Grep of `.guppi/tests/` for `acknowledging-reply` printed a count of 0, so no test reads
      the old page live. A Glob `vault/**/estimate-orchestration-acknowledging-reply-*.md` printed nothing,
      so the new slug is free. The promise of `estimate-prespec-onward-sends-the-agent-on`, that the hook
      stays silent on a reply that opens with `STOP:`, is not signed again in Case 993.2. The new Criterion
      of Case 993.1 drops the `STOP:` line of the old one and rewrites its first line to point to the
      new Estimate, since that line moves to Case 993.2; the lines of Case 993.2 share words with those
      of Case 993.1 because both describe parts of the same reply, but each promise stands in one Criterion
      only. Finding 1.1 of `ask-guppi` at the `/pre-spec` of this session found that the first `when`
      of Case 993.2 covered only a reply that waits while another Case shown waits for the person, though
      the old line and `vault/wiki/orchestration.md` speak of any reply after `/pre-spec` that waits for
      the person''s word, and line 26 of `estimate-prespec-onward-sends-the-agent-on` names a second reason
      to wait, a question the person must answer; the `when` now names both, so no part of the old line
      is left with no Criterion. A Grep of the ledger of this session for `lesson\[error\]` and for `\{addresses:`
      printed nothing, so no lesson is addressed.'
    problem: '`estimate-orchestration-acknowledging-reply` stands `passed` while the `STOP:` line of its
      Criterion has had no reading, and that line can be read only in a session that has the event it
      needs.'
    recommend: "- **How the unread STOP: line gets a reading**\n  - Recommended: (a) split the `STOP:`\
      \ line into its own Estimate, whose `method` waits for an acknowledging reply after `/pre-spec`\
      \ that waits for the person's word; the old Criterion is replaced whole without it, points to the\
      \ new Estimate, goes `pending` and is read at the Retro of this session.\n  - Answer: agreed, (a)."
