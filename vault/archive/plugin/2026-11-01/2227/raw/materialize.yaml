  case_text:
    context: 'The Render of `rule-case-build` tells `case-guppi` what to do when a task of its Case adds
      a file that is no page of `vault/wiki/`. It searches `.guppi/guppi/`, `.claude/` and `vault/wiki/rules/`
      for the path of each folder that holds the file. It searches `.guppi/guppi/` and `.guppi/tests/`
      for the calls that walk a folder. It reads each `.gitignore` there and each reader that takes every
      file of such a folder. Nothing the agent leaves shows whether it did these steps. The reading of
      `estimate-case-build-reads-the-readers-of-a-new-files-folder` in session 2038 (line 17 of `raw/2026-11-01/2038/ledger.md`)
      checked the new file `.claude/skills/approve-spec/SKILL.md` of Case 987. Of 8 searches and readings,
      2 were done, 1 in part and 5 missing. One missing reader was `callers()` of `.guppi/tests/test_guppi_package.py`,
      and `ask-guppi` at `/pre-spec` raised no finding on it. I read `callers()` whole: it takes the `Makefile`
      and every file under `.claude` and `.github/workflows` but `settings.local.json`. The person made
      three choices. First, the `context` of such a Case names each of those searches and readings (995.1);
      the rerun of the searches `context` names, which comes just before the summary, then covers them,
      as Case 979 did for a list member. Second, `ask-guppi` at the first `/pre-spec` checks that list,
      through a new question in the Render of `rule-prespec`, and runs its own Grep of the code for folder
      walks, which a new sentence of the Render of `rule-ask` allows (995.2). Third, `estimate-prespec-reconciles`,
      whose Criterion lists the questions of `/pre-spec`, gets the new question (995.3). That change stands
      in a sub-case of its own, since `case-schema.md` sets one promise per sub-case and 995.2 already
      creates an Estimate. The governing rule is the sentence of `rule-case-build` from case 629.5: `context`
      names a search only when the Case rests on it. The new sentence states the claim the searches rest
      on, namely that the new file makes no reader of its folders wrong. So the sentence and the Criterion
      of `estimate-case-build-checks-the-finished-case`, which carries the same rule, stand. The new texts
      of `core: true` pages put each pointer to a Case in a bracket at the end of its sentence, and the
      pair on `rule-prespec` adds no pointer. I read the blocks of `rule-case-build`, `rule-prespec`,
      `rule-ask`, `estimate-case-build-reads-the-readers-of-a-new-files-folder`, `estimate-prespec-reconciles`,
      `.claude/agents/case-guppi.md`, `.claude/agents/ask-guppi.md` and `.claude/skills/pre-spec/SKILL.md`
      in `.guppi/links.md`. The block of `estimate-prespec-reconciles` has an empty purpose line. Four
      neighbours bear on the change, and each stands. `estimate-ask-searches-at-prespec` already allows
      further Greps as a finding needs. `estimate-ask-finds` sets one list per question of the skill,
      so the new question gets its own list. Its line that `.claude/agents/ask-guppi.md` does not list
      the questions of `/pre-spec` itself also stays true, since the new sentence of `rule-ask` only allows
      the one Grep of `.guppi/guppi/` and `.guppi/tests/` for the question that `/pre-spec` sets and does
      not repeat that question (finding 2.1 of `/pre-spec`). After finding 1.5 of `/pre-spec`, a second
      pair on `rule-prespec` adds the `tasks` block to what the dispatch tells `ask-guppi` to read for
      every Case, because only the `tasks` block shows which Case adds a file; 995.3 carries the same
      list in the Criterion of `estimate-prespec-reconciles`, so its dispatch line is not carried as it
      stood either. `estimate-prespec-confirms-the-findings-once` allows no Grep at the confirmation,
      and 995.2 keeps it that way. The other Estimates of `rule-prespec` speak of `prespec --check` and
      of the loop, not of the questions of `ask-guppi`. The sentence of `rule-ask` that it searches the
      vault at `vault/wiki/` stands, because the new sentence names the one Grep of the code beside it.
      A Grep `speaks of the thing the Case changes` found the texts that list the questions of `/pre-spec`.
      Over `vault/wiki/` it printed `rules/rule-prespec.md` and `estimates/estimate-prespec-reconciles.md`,
      over `.claude/` it printed `skills/pre-spec/SKILL.md`, and over `.guppi/guppi/` it printed nothing;
      this Case changes all three texts. A Grep `walk a folder` printed `rules/rule-case-build.md` and
      `estimates/estimate-case-build-reads-the-readers-of-a-new-files-folder.md` over `vault/wiki/`, and
      `agents/case-guppi.md` over `.claude/`. A Grep `CALLERS|REPO / "\.claude"` over `.guppi/tests/`
      printed `test_guppi_package.py` alone. Its test over `callers()` looks for `uv run guppi` and `uv
      run pytest`, and the new texts hold neither. Its test over the live pages runs `Vault.reword_text`
      with `guppi/` and `tests/`. I read `reword_text`, `reword_pattern` and `is_path_pair` of `.guppi/guppi/generate.py`
      and `PATH_START` of `.guppi/guppi/lint.py`, which is `(?<![\w./-])`. A path `old` matches only where
      no `.` or `/` stands before it, so neither matches in `.guppi/guppi/` or `.guppi/tests/`, the only
      forms the new texts use. I read `check_frame` and `frame_name` of `.guppi/guppi/prespec.py`: each
      code span of `when` or `then` that is a slug, or that holds a `/`, must stand in the text of `given`,
      and the lines of `given` are written for that. The check of this file noted that some `then` lines
      of 995.2 and 995.3 share most of their words with lines of 995.1. They stand: 995.1 sets what `case-guppi`
      searches and names in `context`, 995.2 sets what `ask-guppi` checks and searches on that `context`
