      <folder>` prints one line for each such page, writes nothing and exits 1, so the workflow writes
      nothing to `prod`; with the option `--allow-draft` it writes'
  - old: '`guppi ship --check` does not judge the status of a page, and `guppi lint` reports each such
      page where the module of the command `ship` stands; both judge it by `is_draft_core` of `.guppi/guppi/pages.py`.
      A draft page that a new project can go without loses `core` until it is `built` (case 822).'
    new: '`guppi ship --check` does not judge the status of a page, and `guppi lint` reports each page
      that blocks the build where the module of the command `ship` stands, and no other `draft` page with
      `core: true`; both judge it by `is_draft_core` of `.guppi/guppi/pages.py`, and a test of `.guppi/tests/test_lint.py`
      runs the cascade of `generate` that sets a page `built` and the judgment over that page (as set
      in case 996.1). A page that blocks the build and that a new project can go without loses `core`
      until it is `built` (as set in cases 822 and 996.1). A page that the clean version holds as `draft`
      keeps that status there, and `guppi lint` of a project that installed GUPPI reports neither it nor
      its Estimates that the build leaves out (as set in case 996.1).'
  change: 'the build is blocked only by a draft page with core: true that was never built or has a failed
    Estimate; a page shipped as draft draws no lint finding in an installed project'
