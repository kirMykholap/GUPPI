      file and the questions of `.claude/skills/pre-spec/SKILL.md`, rendered from `rule-prespec`; the
      agent follows `.claude/agents/ask-guppi.md`, rendered from `rule-ask`; and a Case of the plan has
      a line in its `tasks` block that adds a file that is no page of the vault.


      Then:

      `ask-guppi` reads the `tasks` block of each Case of the plan, as the dispatch of `.claude/skills/pre-spec/SKILL.md`
      tells it, and answers, for a Case with such a line, whether its `context` names each search and
