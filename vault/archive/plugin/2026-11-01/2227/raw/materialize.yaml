  sections:
    Criterion: 'When:

      `case-guppi`, with `.claude/agents/case-guppi.md` rendered from `rule-case-build`, builds a Case
      with a task that adds a file that is no page of `vault/wiki/`, and is about to answer with its summary.


      Then:

      It searches `.guppi/guppi/`, `.claude/` and the Rule pages of `vault/wiki/` for the path of each
      folder that holds the new file.

      **＋** It searches `.guppi/guppi/` and `.guppi/tests/` for the calls that walk a folder, such as
      `os.walk`, `rglob`, `glob` and `iterdir`.

