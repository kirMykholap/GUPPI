  ref: entity-sprint-plugin
  category: estimates
  set:
    status: pending
  change: the Criterion replaced whole — a run fails while a page that blocks the build stands
  sections:
    Criterion: 'When:

      In a session of the sprint `plugin` before its close, the owner pushes a tag `prod-x.y.z`, such
      as `prod-0.2.0`, on a commit of the branch `plugin` to the repository of the project on GitHub,
      and the workflow `.github/workflows/prod.yml` runs on that commit.

      **＋** `uv run --project .guppi guppi ship <folder>` runs on a commit with no tag `prod-x.y.z` in
      its history.


      Then:

      The run writes the clean version that `uv run --project .guppi guppi ship` builds to the branch
      `prod`, as one new commit on top of its last commit, or as its first commit when `prod` does not
      stand yet, whose message names the commit it was built from.

      **＋** The run pushes to `prod` with the deploy key whose private half is the secret `PROD_DEPLOY_KEY`,
      which the bypass list of the ruleset on `prod` lets through.

      **＋** `prod` holds each page with `core: true` and no other page.

      **＋** No text of the clean version holds a reference to a case or a decision, a link to a page that
      the clean version leaves out, or a mention of a session of this repository; a sample, as `rule-clean-branch`
      sets it, such as a string of a test, is no reference.

      **＋** The clean version holds no data of the sessions of this repository, such as its Frontier and
      its sprint.

      **＋** The `version` of `.claude-plugin/plugin.json` on `prod` is the number of the highest tag `prod-x.y.z`
      in the history of the commit it was built from, such as `0.2.0` for `prod-0.2.0`, and a tag of another
      form, such as `prod-2`, gives no version.

      **＋** The `on:` block of `.github/workflows/prod.yml` starts the same run on a push to `main`.

      **－** `uv run --project .guppi guppi ship <folder>` with no tag `prod-x.y.z` in that history exits
      1 and writes nothing, and `uv run --project .guppi guppi ship --check` reads no tag.

      **－** A run whose `uv run --project .guppi guppi ship` exits 1 fails and writes nothing to `prod`,
      as it does while a page with `core: true` stands that blocks the build, which `estimate-clean-branch-refuses-a-draft-core-page`
      checks.

      **－** A run whose clean version equals the last commit of `prod` adds no commit.'
