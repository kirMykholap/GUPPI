    ref: rule-lint
  - kind: update
    category: estimates
    slug: estimate-clean-branch-refuses-a-draft-core-page
    ref: rule-clean-branch
  tags: []
  case_text:
    given: '`rule-clean-branch`: the rule whose Purpose sets when `guppi ship` refuses to build.

      **＋** `estimate-clean-branch-refuses-a-draft-core-page`: its Criterion is replaced whole.

      **＋** `rule-lint`: the rule whose Purpose says which draft pages lint reports.

      **＋** `estimate-lint-checks-the-statuses`: its `purpose` names the pages lint reports; its Criterion
      is 996.3.

      **＋** `.guppi/guppi/pages.py`: holds `is_draft_core`, the one judgment.

      **＋** `.guppi/guppi/ship.py`: the build, whose `drafts` imports it.

      **＋** `.guppi/guppi/lint.py`: lint, whose `check_status` imports it.

      **＋** `.guppi/guppi/generate.py`: its cascade writes the History line that sets a page `built`.

      **＋** `.guppi/tests/test_ship.py`: the tests of the build.

      **＋** `.guppi/tests/test_lint.py`: the tests of lint, and the test that runs the cascade and the
      judgment together.

      **＋** `.github/workflows/prod.yml`: the workflow that writes `prod`.

      **＋** `rule-skill-merge-main`: a rule without `core`.

      **＋** `rule-skill-pr-review`: a rule without `core`.'
    when: '`uv run --project .guppi guppi ship <folder>` or `uv run --project .guppi guppi ship --review
      <folder>`, as `rule-clean-branch` sets it, builds the clean version into an empty folder, with or
      without the option `--allow-draft`, or `uv run --project .guppi guppi lint` runs where the module
      of the command `ship` stands.'
