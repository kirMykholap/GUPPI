      for the calls that walk a folder, such as `os.walk`, `rglob`, `glob` and `iterdir`, and reads around
      its line each hit whose folder holds the new file.

      **＋** Each reader that takes every file of such a folder and that the Case does not name is a finding
      that names the Case and the reader.

