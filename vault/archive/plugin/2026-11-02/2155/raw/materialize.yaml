  case_text:
    context: 'The main agent closes a line of `frontier.md` by changing its box and adding a closer at
      its end, such as `- [x] C3 — … · backlog · case 1012`. Twice it edited only the tail of the line:
      its `Edit` matched the end of the title and appended the closer, so the box stayed `[ ]`, and the
      first run of `guppi prespec --check` printed each line as open (C7 at Cases 977 and 978, and C2,
      C3 and C5 in session 1548). `insight-orchestration-frontier-closer-leaves-the-box-open` clusters
      the two lessons, and the text of `orchestration.md` that sets each closer with its box did not stop
      the fault. The person chose a `PreToolUse` hook that refuses the edit, under a new rule page with
      a new Estimate, judging the whole text the call would leave and refusing only an open box beside
      a closer.

      `case-guppi` read `open_case_items` and `check_frontier` of `.guppi/guppi/prespec.py` whole: the
      check treats a `- [ ]` line outside `## Work` and `## Ask` as open by its box alone, judges the
      closer of a closed line by `CLOSERS`, and reads the line by `FRONTIER_LINE` and `FRONTIER_SEPARATOR`
      of `.guppi/guppi/generate.py`; no code judges an open box beside a closer today, so the new predicate
      is no second copy, and it stands in `prespec.py` beside `CLOSERS` for the hook to import, by `rule-one-judgment-one-implementation`.
      A Grep of `.guppi/guppi/` for `replace_all|CLOSERS|open_case_items` printed `prespec.py`, `onward.py`
      and `ratified.py`: `builder_write` of `ratified.py`, read whole with `builder_file`, already works
      out the text an `Edit`, `Write` or `MultiEdit` leaves, so the task moves that computation into one
      function both hooks call, and `builder_write` keeps its behaviour. The session folder is judged
      as `is_case_file` of `.guppi/guppi/casecheck.py` judges it, by `generate.DAY` and `generate.SESSION`.

      The Claude Code hooks reference at https://code.claude.com/docs/en/hooks says that exit 2 of a `PreToolUse`
      hook blocks the tool call and that its stderr is the message Claude gets, that the input of `Edit`
      holds `file_path`, `old_string`, `new_string` and `replace_all` and that of `Write` holds `content`,
      and that `tool_input.file_path` is always absolute. The two hooks already on `PreToolUse` of `Edit|Write|MultiEdit`
      stand: `guppi guard` of `rule-governed-files-hook` refuses an edit of a file a Rule page governs,
      and `guppi ratified --guard` of `rule-spec-reconcile` judges only the plan file, its store and the
      files under `cases/`. `rule-hook-registry` sets that adding a hook is an `update` of that page in
      the same Case that creates the hook''s rule; the hook fires once the librarian''s render writes
      `.claude/settings.json`. The new rule carries `core: true`, since `rule-hook-registry` ships in
      the clean version and registers the command there; so its new text keeps each pointer in a bracket
      at the end of its sentence, and the new module and test keep their pointers so too, as `guppi ship`
      reads the docstrings and comments of the code and the tests.

      The vault''s answer: the Grep of the rules and of each other category by the recipe of `ask-guppi`
      found no rule that guards an edit of `frontier.md`, and a Glob `vault/**/rule-frontier*.md` printed
      nothing, so `rule-frontier-hook` is free; `estimate-frontier-hook-refuses-an-open-box-with-a-closer`
      is new too. A Grep over `vault/**/frontier.md` for `^- \[ \] .* · (work|defer|kept|case \S+|defer
      case \S+)$` printed nothing, so no Frontier of an earlier session holds a line the hook would refuse.
      A Grep over `{vault/wiki,.claude}/**` for `closer` printed 27 files; the passages of `orchestration.md`,
      `rule-orchestration`, `rule-prespec`, `estimate-prespec-checks-the-frontier`, `estimate-hi-writes-frontier`,
      `.claude/skills/hi/SKILL.md` and `.claude/skills/sprint-close/SKILL.md` set the closers, what `/hi`
      writes and what `/pre-spec` reports, and the hook changes none of them, since `/hi` writes open
      lines with no closer and `/pre-spec` keeps its check; `backlog.md` and `log.md` are not read; the
      two lessons and the Insight record the fault; the other files set the closers of other moments and
      stand. A Grep over `{vault/wiki,.claude,.guppi/guppi}/**` for `ratified --guard`, a hook command
      already listed, printed `.claude/settings.json`, `log.md`, `casecheck.py`, `rule-hook-registry`,
      `cli.py`, `ledger.py`, `ratified.py`, `estimate-spec-reconcile-refuses-an-edit-of-the-plan`, `estimate-spec-write-exits-2-on-an-error`
      and `estimate-spec-reconcile-refuses-a-case-file-another-agent-holds`: the module docstring of `cli.py`
      lists every hook command and gains `frontierguard`, `rule-hook-registry` and its render enter the
      Case, and the others speak of that one guard, not of a list of hooks.

      A Grep of `.guppi/` for `os\.walk|rglob\(|\.glob\(|iterdir\(` printed 29 files: under `.guppi/guppi/`
      `cleanup.py`, `caseid.py`, `casecheck.py`, `backlog.py`, `archive.py`, `sprint_close.py`, `materialize.py`,
      `pages.py`, `prespec.py`, `onward.py`, `ship.py`, `lint.py`, `ledger.py` and `generate.py`, and
      under `.guppi/tests/` `test_check.py`, `test_backlog.py`, `test_case_schema.py`, `test_archive.py`,
      `test_lint.py`, `test_guppi_package.py`, `test_gitstate.py`, `test_materialize.py`, `test_onward.py`,
      `test_generate.py`, `test_orchestration.py`, `test_sprint_close.py`, `test_spec.py`, `test_ship.py`
      and `test_ratified.py`. Of them only two walk a folder of the new files: `named_files` of `casecheck.py`,
      which reads every file of `.guppi/guppi/` and `.guppi/tests/` for the note of names, and `tree_files`
      of `ship.py`, which copies every file of `.guppi/` but the skipped names into the clean version;
      neither is made wrong, since the new module and test are one more file to search and to ship, and
      their pointers stand in brackets as `guppi ship` asks. Each other walk reads folders of `vault/`,
      `.claude/`, `.github/workflows/` or a temporary folder, and stands. `.guppi/.gitignore` holds only
      `.venv/`, so it stands. A Grep over `{.guppi/guppi,.claude,vault/wiki/rules}/**` for `\.guppi/guppi`
      printed 81 files, one for `\.guppi/tests` printed 52 files, one for the bare name `(^|[^\w.-])guppi/([^\w]|$)`
      printed 47 files and one for `(^|[^\w./-])tests/([^\w]|$)` printed 38 files. Most hits are History
      lines of the `reword` of case 819.1 or the paths of single files in an `implementation_ref`, which
      no new file changes. The hits that name a whole folder each stand. `NAMED_IN` of `casecheck.py`
      and `rule-case-check` search it for names. `rule-case-build` and `rule-ask` tell an agent to search
      it. `rule-documentation` lets a session read it. `TESTS` of `ship.py`, `masked_strings` of `pointers.py`
      and `TEST_PATH` of `lint.py` judge the comments of a test file and the form of a test path, which
      the new test keeps. The key `test` of `commands.py` runs pytest over `.guppi/tests/`, which then
      runs the new test as this Case wants. `reword_pattern` of `generate.py` matches a path that starts
      with `tests/`. A Grep of `.guppi/tests/` for `settings\.json|rule-hook-registry|COMMANDS` printed
      `test_guard.py`, `test_guppi_package.py`, `test_render.py`, `test_ratified.py`, `test_ship.py` and
      `test_shellwrite.py`: only `test_guppi_package.py` reads the live `settings.json` and the live pages,
      for the old command forms and for the command of each hook it lists, and the new texts write only
      `uv run --project .guppi guppi frontierguard`; the others build their files in a temporary folder.

      `estimate-hook-registry-rendered` checks only that `settings.json` equals the Render, so its Criterion
      stands. The session''s ledger holds no `error` lesson, so no line carries a mark. `/pre-spec` keeps
      its check of the Frontier: a line whose box was written by a shell call still shows there. Case
      1013 of this batch, read in its finished file, changes the paragraph of `rule-orchestration` on
      the acknowledging reply so that a heading or a label may keep a term of the harness in English,
      replaces the Criterion of `estimate-orchestration-acknowledging-reply` and actions its own Insight;
      it reads `frontier.md` only as the checklist the reply shows, and this Case changes no page it changes
      and refuses only an edit of `frontier.md` that leaves an open box beside a closer, so the two do
      not clash.

      The check of this file sent the note of names. A Grep over `{vault/wiki,.claude,.guppi/guppi,.guppi/tests}/**`
      for `(^|[^\w-])settings\.json([^\w-]|$)` printed 76 files, and one for `(^|[^\w-])(prespec\.py|guppi
