    ref: insight-orchestration-acknowledging-reply-keeps-headings-in-english
  tags: []
  case_text:
    context: 'After the person ratifies a Case, the main agent writes a reply that acknowledges it. The
      paragraph of `rule-orchestration` on that reply says that each heading and label stands in the language
      of the chat, and since cases 997 and 1002 it names each one by what it says and not by English words
      to copy. The agent still writes the heading of the Frontier in English. In the transcript of this
      session the reply that acknowledged Case 1011 wrote a Russian heading that the Cases are ratified,
      with the word Case kept in English, and then the heading `## Frontier`; the first reply of `/hi`
      wrote a heading of the Frontier that kept the word Frontier in English beside Russian words for
      the session, and the heading `### Cases`. The render of `rule-language` in `CLAUDE.md` says that
      a technical term in English is not transliterated in the text of the chat, and Frontier is a term
      of the glossary, in the row of `/hi`, so the agent keeps it as it keeps the word Case. `insight-orchestration-acknowledging-reply-keeps-headings-in-english`
      stands `open` with one live child, `lesson-orchestration-defer-reply-frontier-heading-in-english`.

      The person said that the rule should be softened: the text of a reply is written in the right language,
      a heading that holds a term may keep it in English, and that is normal; the current behaviour suits
      the person. So the paragraph of the acknowledging reply lets a heading or a label keep a term of
      the harness in English, a heading made of the term alone included, and the Insight is closed as
      `actioned` by this decision, since `rule-insights-schema` sets that a decision that rejects a pattern
      is named in `addressed_by` with the status `actioned`. The person asked that an Estimate failed
      for this reason be set `passed`: the `## Flags` of `brief.md` say that no Estimate stands `failed`,
      and `estimate-orchestration-acknowledging-reply` stands `passed`, so no status is set by the person''s
      decision. The Criterion of that Estimate names the heading `## Frontier` as one that must stand
      in the language of the chat, so this Case replaces it whole, and its `method`, which waits for the
      render of the old paragraph, is set anew; its `purpose` names only the four parts and stands.

      Three sentences of `rule-orchestration` name the heading of the Frontier in the language of the
      chat: the part of the acknowledging reply that holds the Frontier, the reply that acknowledges the
      opening Case of `/sprint-open`, and the reply that closes a Frontier line with no ratification in
      `## Plan Mode and the Frontier`; `/pre-spec` found that the Case left them, and each now says that
      the heading names the Frontier in the language of the chat or by the term Frontier alone. The reply
      that carries a defer and the reply that acknowledges Cases ratified together say only that their
      headings are written as the acknowledging reply sets them, so they follow the new sentence with
      no change of their own. The first reply of `/hi` keeps the form that `rule-skill-hi` sets, which
      names no language for its headings, and the person''s answer keeps the current behaviour, so `rule-skill-hi`
      is not changed. The heading of a shown Case, which `estimate-orchestration-shows-the-built-case`
      checks, is no part of the acknowledging reply and stands. A Grep over `{vault/wiki,.claude,.guppi/guppi,.guppi/tests}/**`
      for `by what it says|words in \{\{documentation_lang\}\}|words in English to copy|cases 167, 997
      and 1002` printed `orchestration.md`, `.claude/agents/case-guppi.md`, `insight-orchestration-acknowledging-reply-keeps-headings-in-english`,
      `log.md`, `rule-case-build`, `estimate-orchestration-acknowledging-reply` and `rule-orchestration`:
      `rule-case-build` and its render `case-guppi.md` use the words by what it says for how `case-guppi`
      judges a sentence, which is another matter, `log.md` is not read, and each other file enters the
      Case. A Grep of `.guppi/tests/` for `orchestration\.md|rule-orchestration` printed `test_onward.py`
      and `test_orchestration.py`: `test_orchestration.py` reads only the two examples of `orchestration.md`,
      which this Case does not change, and `test_onward.py` reads the strings of `onward.py`, so both
      stand. The check of this file sent a note with a count for `rule-orchestration` and `orchestration.md`:
      a Grep over `{vault/wiki,.claude,.guppi/guppi,.guppi/tests}/**` for `(^|[^\w-])(rule-orchestration|orchestration\.md)([^\w-]|$)`
      printed 89 files, and a Grep over the same paths for `heading[^.]{0,80}(language of the chat|chat_lang|in
      Russian|translated)` printed `orchestration.md`, `insight-orchestration-acknowledging-reply-keeps-headings-in-english`,
      `log.md`, `lesson-orchestration-defer-reply-frontier-heading-in-english`, `estimate-orchestration-acknowledging-reply`,
      `rule-orchestration`, `estimate-orchestration-shows-the-built-case`, `estimate-orchestration-forwards-a-discussion-question`
      and `estimate-orchestration-showing-example-passes-the-check`: the last three speak of the heading
      of a shown Case or of an answer of `case-guppi`, not of the acknowledging reply, so they stand;
      the lesson records its own trigger and is archived with the Insight by the cascade of `generate`;
      `log.md` is not read; and each other file of the 89 names the rule or its render for another promise,
      so it stands. `estimate-orchestration-acknowledging-reply-opens-with-stop-after-prespec` and `estimate-orchestration-shows-the-frontier-after-a-closed-line`
      name `estimate-orchestration-acknowledging-reply` only for the order of the parts and the form of
      the checklist, which the new Criterion keeps, so they stand. `backlog.md` lists the Insight while
      it stands `open`; `guppi backlog` writes that file and drops the line once the Insight is `actioned`.
      The Criterion line on the language of the headings is not carried on purpose, since this Case replaces
      the Criterion whole. The session''s ledger holds no lesson line, so no lesson waits for a mark.'
    problem: The text asks for every heading of the acknowledging reply in the language of the chat, while
      the language rule keeps a term of the harness in English, so the agent keeps the heading of the
      Frontier in English and the rule calls that a failure that the person does not see as one.
    recommend: "- **How the Case keeps the headings of a reply in the language of the chat**\n  - Recommended:\
      \ (a) a check of the headings when the reply ends.\n  - Answer: none of the options; the person\
      \ asked to soften the rule: the text is written in the right language, a heading sometimes stays\
      \ in English because it holds terms, and that is normal; it is no problem now, an Estimate failed\
      \ for this reason should be set passed, and the current behaviour suits the person.\n- **Which replies\
      \ the Case covers**\n  - Recommended: (b) those replies and the first reply after `/hi`.\n  - Answer:\
      \ not answered; the answer to \"How the Case keeps the headings of a reply in the language of the\
      \ chat\" keeps the current behaviour, so no reply changes its form."
    given: '`rule-orchestration`: the rule whose paragraph sets the acknowledging reply.

      **＋** `vault/wiki/orchestration.md`: the render of `rule-orchestration` that the main agent loads.

      **＋** `estimate-orchestration-acknowledging-reply`: its Criterion is replaced whole.

      **＋** `insight-orchestration-acknowledging-reply-keeps-headings-in-english`: the Insight this Case
      closes.

      **＋** `CLAUDE.md`: the language of the chat and the rule on technical terms.

      **＋** `raw/<date>/<hi HHMM>/frontier.md`: the Frontier the reply shows.

      **＋** `estimate-orchestration-acknowledging-reply-opens-with-stop-after-prespec`: the check of the
      `STOP:` line.

      **＋** `rule-prespec-onward`: the hook that sends the agent on after `/pre-spec`.

      **＋** `rule-ledger-write`: the ledger hook.

      **＋** `estimate-ledger-write-holds-a-decision-line-off-the-stored-case`: the check of a held decision
      line.'
    when: The person ratifies a Case, ratifies again a Case shown again after its ratification, or ratifies
      in one answer Cases shown together, and the agent writes the reply that acknowledges it, with `vault/wiki/orchestration.md`
      rendered from `rule-orchestration`.
    then: 'The reply has four parts, in this order. First, the `LEDGER` block, before which stands nothing
      but the `STOP:` line that `estimate-orchestration-acknowledging-reply-opens-with-stop-after-prespec`
      checks. Second, the heading `## Case N — ratified` and a paragraph `Changes:` that says what changes,
      in one or two sentences. Third, a paragraph `Notes:` with facts that did not enter the Case, left
      out when there are none. Last, the heading `## Frontier` and the lines of `raw/<date>/<hi HHMM>/frontier.md`
      as a checklist.

      **＋** Each heading and label of the reply stands in the language of the chat that `CLAUDE.md` sets,
      but for the terms of the harness it holds: the words of the heading `## Case N — ratified` and of
      the labels `Changes:` and `Notes:` other than such a term stand in that language, not in the English
      words by which this Criterion names them.

      **＋** In the checklist the closed lines are folded into one line, and the lines put off stand as
      `[-] … · sprint · defer`, `[-] … · backlog · kept` or `[-] … · defer case N`.

      **＋** The open `W` lines are folded into one line that lists their ids, and each other open line
      stands on its own line with a short title.

      **＋** While a line under `## Cases` is open, the question which item is next ends the reply.

      **＋** When none is open before `/pre-spec`, the question whether to go on to `/pre-spec` ends the
      reply, in the plain form of the question which item is next. The agent calls `/pre-spec` only after
      the person says to go on. A reply that answers a question of the person instead ends with the same
      question again.

      **＋** When none is open after `/pre-spec`, the reply ends with the Frontier and asks nothing, and
      the hook of `rule-prespec-onward` sends the agent on.

      **＋** One reply acknowledges every Case and sub-case ratified in one answer, a Case with its sub-cases
      or Cases shown together for one ratification: one `LEDGER` block with all their lines, one heading
      `## Case N — ratified` that names their ids, one paragraph `Changes:`, one Frontier.

      **＋** The reply that acknowledges a re-ratification carries the `LEDGER` block with the decision
      lines of each Case ratified again, as at its first ratification.

      **＋** No tool call follows the `LEDGER` block in the same reply.

      **－** A term of the harness that a heading or a label holds, such as Case or Frontier, may stay
      in English, untransliterated as `CLAUDE.md` sets it, and the heading of the Frontier may be that
      term alone, such as `## Frontier`.

      **－** Slugs, paths, the tag of the `LEDGER` block, the ledger lines and the word `STOP:` that opens
      a reply keep their own words in any language of the chat; the rest of the `STOP:` line stands in
      the language of the chat.

      **－** The ledger hook of `rule-ledger-write` does not append a repeated decision line a second time.

      **－** When a `Stop` hook other than the ledger hook of `rule-ledger-write` refuses the reply with
      exit 2, the agent''s answer to the refusal is a reply of its own and may call tools. The `LEDGER`
      block stands written, but for a decision line the ledger hook holds, as `estimate-ledger-write-holds-a-decision-line-off-the-stored-case`
      sets it.'
