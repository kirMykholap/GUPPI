  text: decision[case 1012][create][estimate-frontier-hook-refuses-an-open-box-with-a-closer]{ref:rule-frontier-hook}{tags:hooks,harness,session}
  case: '1012'
  kind: create
  slug: estimate-frontier-hook-refuses-an-open-box-with-a-closer
  origin: raw/2026-11-02/2155/ledger.md#case-1012
  decision: decision-case-1012
  ref: rule-frontier-hook
  tags:
  - hooks
