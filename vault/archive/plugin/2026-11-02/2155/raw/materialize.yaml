      1012" in the docstring of .guppi/guppi/frontierguard.py failed test_the_live_code_holds_no_pointer_outside_a_bracket
      of .guppi/tests/test_ship.py at the first full guppi test of Work Mode. In both the agent wrote
      a case number in the live code in a form other than the bracket at the end of a sentence that the
