decisions:
- case: '1011.1'
  decision: decision-case-1011.1
  origin: raw/2026-11-02/2155/ledger.md#case-1011.1
  targets:
  - kind: update
    category: rules
    slug: rule-case-check
    ref: rule-case-check
  - kind: update
    category: estimates
    slug: estimate-case-check-notes-the-files-that-name-what-a-case-changes
    ref: rule-case-check
  - kind: delete
    category: estimates
    slug: estimate-case-check-sends-one-note-for-a-broad-name
  tags: []
  case_text:
    given: '`rule-case-check`: the rule of the hook that sends the note.

      **＋** `.guppi/guppi/casecheck.py`: `names_notes`, which builds the note.

      **＋** `.guppi/guppi/cli.py`: `COMMANDS`, which maps a command to its module.

      **＋** `.guppi/tests/test_casecheck.py`: the tests of the note.

      **＋** `estimate-case-check-notes-the-files-that-name-what-a-case-changes`: its Criterion is replaced
      whole.

      **＋** `estimate-case-check-sends-one-note-for-a-broad-name`: the check of the limit of 20 files,
      deleted.

      **＋** `raw/<date>/<hi HHMM>/cases/case-<N>.md`: the file of a Case that the hook checks.

      **＋** `vault/wiki/`: the pages the hook searches.

      **＋** `.claude/`: the harness files the hook searches.

      **＋** `vault/wiki/decisions/`: the Decision pages, left out of the note.'
    when: 'The `SubagentStop` hook `uv run --project .guppi guppi casecheck --subagent` of `.guppi/guppi/casecheck.py`
      checks a file `raw/<date>/<hi HHMM>/cases/case-<N>.md` that `case-guppi` wrote, whose Case updates
      or deletes a page, or writes in the first code span of a task line the path of a file of the repository
      outside `vault/wiki/`.

      **＋** Or `.guppi/tests/test_casecheck.py` runs it over a made-up file, transcript, plan file and
      store.'
    then: 'The hook searches the files under `vault/wiki/`, `.claude/`, `.guppi/guppi/` and `.guppi/tests/`
      for every name of each such page and file.

      **＋** The names of a page are its slug, the file name of each path of its `governs`, `implementation_ref`
      and `code_ref`, the name of the agent, or of the skill with its slash, whose file those paths name,
      and `guppi <command>` for each command that `COMMANDS` of `.guppi/guppi/cli.py` maps to a module
      of those paths.

      **＋** The names of a file are its file name and the name of the agent, the skill or the command
      it carries.

      **＋** A task line names a changed file only by its first code span, where that span holds the path
      of a file of the repository outside `vault/wiki/`.

      **＋** It sends one note that names the Case and lists each file that holds a name and that the subagent,
      in `agent_transcript_path`, read by no `Read` call of the file and no `Grep` call whose `path` is
      the file, once, under the first name it holds, with, for a page, its `purpose`, `root_cause` or
      `pattern` line, however many files hold the name.

      **＋** The note asks the agent to read each listed file whose purpose line or path speaks of what
      the Case changes, or to name it in `context` with the reason it stands.

      **＋** The note is sent by exit 2 beside any findings and stored under `notes` in `<plan>.checked.json`;
      a later check of the same Case id lists only the files that no earlier note of that id listed, and
      sends no note when none is left.

      **－** A later code span of a task line and a code span of a sub-point name no changed file.

      **－** The note leaves out the file of the page or the file itself, the pages under `vault/wiki/decisions/`,
      `log.md` and `brief.md`.

      **－** A note is no finding: the `Stop` check of `guppi casecheck` refuses no showing for it, and
      a transcript the hook cannot read gives no such note.'
    context: 'When `case-guppi` stops, the `SubagentStop` hook of `rule-case-check` searches the files
      under `vault/wiki/`, `.claude/`, `.guppi/guppi/` and `.guppi/tests/` for the names of each page
      the Case updates or deletes and of each file in the first code span of a task line. It sends one
      note per unread file that holds such a name, with the purpose line of a page, and since case 1010.2
      a name that more than 20 files hold gets one note with the count instead. The handoff of session
      2035 asked whether 20 fits once a real note under that code is seen; none was seen yet. `case-guppi`
      counted the files for some names by a Grep over `{vault/wiki,.claude,.guppi/guppi,.guppi/tests}/**`,
      the pattern `(^|[^\w-])<name>([^\w-]|$)` as the whole-word rule of `name_pattern`: `rule-clean-branch`
      printed 26 files, `log.md` among them, 14 of them its own Estimates, and `rule-case-check` printed
      80 files, `log.md` and `brief.md` among them; the counts run evenly from a few files to about eighty,
      with no break at 20. The person first took the limit of 20 counted over unread files, then said
      that no fixed number makes sense, since any number is a guess, that the hook should point to the
      files by their purpose and require no reading of everything, and that a miss is for `/pre-spec`
      to show. So the note becomes one list per Case with no limit (Case 1011.2 sets the answer of `case-guppi`
      to it), and `case-guppi` reads the Estimates of a changed page by their purpose first. The Case
      splits in three, as the atomicity rule of `ratification.md` sets: the hook, the answer to the list
      and the reading of the Estimates can each fail alone.

      `case-guppi` read in `.guppi/guppi/casecheck.py` whole `looked_files`, `carried_names`, `changed_targets`,
      `named_files`, `name_pattern` and `names_notes`, the part of `check_answer` that joins the notes,
      and the loop of the `--subagent` run that stores them: a note is sent once because a note whose
      text the store already holds under `notes` for the Case id is not sent again, so a list whose text
      changes would be sent again whole; the task of Case 1011.1 keeps each file listed once for the Case
      id. The note asks the agent to read a file or to name it in `context`; any `Read` call of the file
      counts as a read, a part too. The guard against a missed Estimate stands in `.claude/skills/pre-spec/SKILL.md`:
      its `ask-guppi` reads the `estimates` of each page a Case updates and asks whether an Estimate the
      Case does not name speaks of the thing the Case changes. After the findings of `/pre-spec`, Case
      1011.3 changes the sentence of `case-schema.md`, by an update of `rule-case-protocol`, so that a
      Case still owes an `update` to each Estimate whose Criterion speaks of the change, finds it by its
      purpose first, and has `/pre-spec` behind it, as the person asked. It changes too the sentence of
      `rule-case-build` that counts an Estimate the Case does not name as a contradiction. The Criterion
      of `estimate-case-build-writes-the-case` speaks of the same reading at every dispatch, so Case 1011.4
      writes it whole under its item, since the check of this file counts a second Estimate as a second
      promise and its trigger is not that of `estimate-case-build-reads-by-need-and-in-parts`; the note
      that a line of that Criterion is not carried is meant, since the item writes the Criterion. `estimate-clean-branch-ships-neutral-texts`
      and `estimate-skill-grill-me-asks-in-rounds` name that Estimate, read by a Grep of each: the first
      in a Result on the language of its words, which the new Criterion keeps, the second in a History
      line, so both stand. A Grep over `{vault/wiki,.claude,.guppi/guppi,.guppi/tests}/**` for `(^|[^\w-])(rule-case-protocol|case-schema\.md)([^\w-]|$)`
      printed 56 files; of them only the files of the search below for the words of an Estimate that a
      Case updates speak of what this Case changes, and each other file names the schema or its rule for
      the form of a Case, its loading or another promise, so it stands. `estimate-case-protocol-case-form`
      stands, since its line that a Case gives an `update` to each Estimate whose Criterion speaks of
      the change still holds, and `estimate-case-protocol-loaded` checks only that the Render is loaded.
      Case 1011.2 says that the list excuses no hit of the searches that `rule-case-build` sets before
      the summary, since such a hit is read by the lines a Grep with lines of context prints, so `estimate-case-build-checks-the-finished-case`
      stands. A Grep over `{vault/wiki,.claude,.guppi/guppi,.guppi/tests}/**` for `more than 20|20 or
      fewer|broad` printed `brief.md`, `log.md`, `.claude/agents/case-guppi.md`, `rule-case-example`,
      `rule-case-check`, `rule-case-build`, `lesson-hi-brief-line-judged-apart-from-a-broad-milestone-line`,
      `.guppi/tests/test_casecheck.py`, `estimate-case-check-notes-the-files-that-name-what-a-case-changes`,
      `rule-estimates-schema`, `case-example.md`, `estimate-case-check-sends-one-note-for-a-broad-name`,
      `schema.yaml` and `.guppi/guppi/casecheck.py`: the pages of the two rules, the render, the two Estimates,
      the module and its test enter the Case; `rule-case-example`, `case-example.md`, the lesson, `rule-estimates-schema`
      and `schema.yaml` speak of another limit or another broad thing, and `brief.md` and `log.md` are
      not read. A Grep over the same paths for `note of names|note of a broad name|note on a name|note
      of a name|note on a file|names note` printed `brief.md`, `.claude/agents/case-guppi.md`, `log.md`,
      `estimate-case-build-searches-the-names-of-what-it-changes`, `rule-case-build`, `rule-case-check`,
      `.guppi/tests/test_casecheck.py`, `.guppi/guppi/casecheck.py` and `lesson-case-check-names-note-lists-hundreds-of-files`:
      the lesson stands, since it records the probe of session 1548, `brief.md` and `log.md` are not read,
      and each other file enters the Case. A Grep over the same paths for ``Criterion`? of each Estimate|whose
      Criterion speaks|reads the page''s .estimates`` printed `.claude/skills/merge-main/SKILL.md`, `case-schema.md`,
      `.claude/agents/case-guppi.md`, `rule-case-build`, `rule-case-protocol`, `estimate-case-build-writes-the-case`,
      `estimate-case-protocol-case-form`, `estimate-case-build-reads-by-need-and-in-parts`, `rule-skill-merge-main`
      and `estimate-skill-merge-main-joins-a-conflicted-page`: the merge skill, its rule and its Estimate
      set what a merge does with a joined text, not what `case-guppi` reads, so they stand; `estimate-case-protocol-case-form`
      stands as said above, `estimate-case-build-writes-the-case` enters Case 1011.4, and each other file
      enters Case 1011.3. A Grep of `.guppi/tests/` for `case-guppi\.md|rule-case-build|rule-case-check|estimate-case-check-sends-one-note-for-a-broad-name|estimate-case-check-notes-the-files|estimate-case-build-reads-by-need|estimate-case-build-searches-the-names`
      printed `test_casecheck.py`, `test_guppi_package.py`, `test_orchestration.py` and `test_onward.py`:
      `test_casecheck.py` enters Case 1011.1, `test_orchestration.py` and `test_onward.py` name a rule
      in a docstring, and `test_guppi_package.py` reads the live pages for old command forms and paths,
      and the new texts write only `.guppi/`-prefixed paths. The new texts of the two rules keep each
      pointer in a bracket at the end of its sentence, as `test_ship.py` asks of a page with `core: true`,
      and the code of Case 1011.1 does the same in its comments. The check of this file sent the note
      of names under the code of case 1010: one note with a count for each of `rule-case-check`, `casecheck.py`,
      `guppi casecheck`, `test_casecheck.py`, `settings.json`, `rule-case-build`, `case-guppi.md` and
      `case-guppi`, and a note for each of `.guppi/guppi/ledger.py`, `estimate-case-check-sends-back-an-unlisted-tag`,
      `estimate-ledger-write-refuses-a-lesson-with-an-unlisted-tag` and `rule-ledger-write` by `tags.py`.
      A Grep over `{vault/wiki,.claude,.guppi/guppi,.guppi/tests}/**` for `(^|[^\w-])(rule-case-check|casecheck\.py|guppi
      casecheck|test_casecheck\.py|settings\.json|rule-case-build|case-guppi\.md|case-guppi)([^\w-]|$)`
      printed 277 files; of them only the files of the search above for the words of the note of names
      speak of what this Case changes, and each other file names the rule, the agent, the module, its
      test or the settings for another promise, so it stands. The four files that name `tags.py` stand,
      since a Grep of each, or its purpose line, shows that it speaks of the reading of the rows of `tags.md`,
      not of the note of names. The notes of a Criterion line not carried are meant, since each sub-case
      replaces its Criterion whole, and the notes of `then` lines shared between sub-cases stand, since
      the hook, the answer of `case-guppi` to the note, its reading of the Estimates of a changed page
      and its reading at every dispatch are each the promise of its own Estimate, and a line of Case 1011.4
      states for every dispatch the reading that Case 1011.3 states for a changed page. A Grep of the
      session''s `ledger.md` for `lesson\[error\]` and for `\{addresses:` printed no line, so no lesson
      waits for a mark.'
  parent: decision-case-1011
