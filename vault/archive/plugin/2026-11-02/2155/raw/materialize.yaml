      nor what those two commands answer, so each stands. A Grep over the same paths for `(Edit|Write|MultiEdit).{0,80}frontier\.md|frontier\.md.{0,80}(Edit|Write|edit)`
      printed `.claude/skills/work/SKILL.md`, `.claude/settings.json`, the lesson and the Insight of this
      item, `rule-work-mode`, `rule-permissions`, `.guppi/tests/test_render.py` and `estimate-permissions`:
      `rule-permissions`, its Estimate and the settings file let the session edit `frontier.md` with no
      question, which the hook does not change, since it refuses only the edit that leaves an open box
      beside a closer; `rule-work-mode` and its skill tick lines of `frontier.md` in Work Mode, which
      the hook judges alike; `test_render.py` builds its files in a temporary folder. Of the files that
      name `rule-hook-registry`, `.guppi/guppi/recall.py`, `entity-glossary`, `glossary.md`, `rule-harness`,
      `rule-session-start`, `rule-morph`, `rule-page-read`, `estimate-settings`, `estimate-case-check-refuses-text-before-a-round`,
      `estimate-powershell-guard-refuses-a-here-string-piped-into-an-interpreter`, `estimate-shell-write-check-repairs-and-reports`
      and `estimate-sprint-plugin-link-graph-is-gone` say that a hook is registered by that page or name
      it for another hook, and the row of the glossary says that a new hook is an `update` of it in the
      Case that creates its rule, which this Case does; `lesson-hooks-matching-hooks-of-one-event-run-in-parallel`
      says the hooks of one event run in parallel, and the new hook reads no output of `guppi guard` or
      `guppi ratified --guard`, so the order does not matter. `backlog.md` lists this Insight and changes
      at the librarian''s run. Of the files that name `cli.py`, `.guppi/guppi/pages.py` names its list
      of commands for the command `ship`, `rule-python-utf8` says the commands set UTF-8 on their stdout
      and stderr in `cli.py`, which the refusal with its `·` relies on, `rule-compact-recall` and `rule-event-log`
      list it in `implementation_ref`, `rule-case-check` and `estimate-case-check-notes-the-files-that-name-what-a-case-changes`
      read `COMMANDS` for the note of names, and `estimate-skill-wait-what-re-pitches` quotes it in a
      reading; each stands.'
    problem: An edit that adds a closer to a Frontier line and leaves its box `[ ]` passes unseen until
      `/pre-spec`, and a text of `orchestration.md` that the agent has to remember did not stop it twice.
    recommend: "- **How should the box and the closer get written together?**\n  - Recommended: (a) a\
      \ hook refuses the edit.\n  - Answer: (a).\n- **Which rule should own the new hook?**\n  - Recommended:\
      \ (a) a new rule page for the hook, `rule-frontier-hook`, under `rule-plan-mode`, with `rule-hook-registry`\
      \ updated.\n  - Answer: (a).\n- **What should the hook refuse?**\n  - Recommended: (a) only an open\
      \ box with a closer.\n  - Answer: (a).\n- **Which lines should the hook look at?**\n  - Recommended:\
      \ (a) every line of the text the call would leave.\n  - Answer: (a).\n- **How should we check that\
      \ the hook works?**\n  - Recommended: (a) a new Estimate with a test.\n  - Answer: (a)."
    given: '`rule-frontier-hook`: the new rule of the hook.

      **＋** `estimate-frontier-hook-refuses-an-open-box-with-a-closer`: the new check of the refusal.

      **＋** `rule-hook-registry`: the `hooks` key of `.claude/settings.json`, where the hook is registered.

      **＋** `insight-orchestration-frontier-closer-leaves-the-box-open`: the Insight this Case actions.

      **＋** `.guppi/guppi/frontierguard.py`: the new hook.

      **＋** `.guppi/guppi/prespec.py`: `CLOSERS`, and the new predicate of an open box beside a closer.

      **＋** `.guppi/guppi/ratified.py`: `builder_write`, whose computation of the text after a call the
      hook shares.

      **＋** `.guppi/guppi/cli.py`: `COMMANDS` and the list of hook commands.

      **＋** `.guppi/tests/test_frontierguard.py`: the tests of the hook.

      **＋** `vault/raw/<date>/<HHMM>/frontier.md`: the Frontier of a session.'
    when: 'The agent calls `Edit`, `Write` or `MultiEdit` on a file `vault/raw/<date>/<HHMM>/frontier.md`,
      and the `PreToolUse` hook `uv run --project .guppi guppi frontierguard` of `.guppi/guppi/frontierguard.py`
      reads the payload.

      **＋** Or `.guppi/tests/test_frontierguard.py` runs the hook over a made-up payload and a made-up
      `frontier.md`.'
    then: 'The hook works out the whole text the call would leave: the `content` of a `Write`, or the
      file with each `old_string` replaced by its `new_string` in order, once or at each match with `replace_all`,
      by the one function that `builder_write` of `.guppi/guppi/ratified.py` uses too.

      **＋** When a box line of that text, under any heading, keeps the box `[ ]` while its last segment
      after ` · ` is a closer by `CLOSERS` of `.guppi/guppi/prespec.py`, the hook exits 2, and the call
      does not run.

      **＋** The reason on stderr names each such item and its closer, and says that the box and the closer
      are written in one edit of the whole line, `[x]` for an item ended and `[-]` for an item put off.

      **＋** Before the refusal one line goes to the day''s `event_log.md`, since a blocked call has no
      `PostToolUse`.

      **－** A text whose open lines carry no closer, a file other than such a `frontier.md`, and another
      tool exit 0.

      **－** An old string missing or found more than once without `replace_all`, a file to edit that does
      not exist, and a payload the hook cannot read exit 0, the last with one line on stderr; the hook
      never raises.

      **－** The check of the Frontier in `.guppi/guppi/prespec.py` stays as it is.'
