  case_text:
    given: '`rule-guppi-config`: the page whose Render is `guppi.toml`.

      **＋** `rule-clean-branch`: the rule of the clean version that `guppi ship` builds.

      **＋** `estimate-clean-branch-ships-the-setup-not-done`: the new check of the key in the clean version.

      **＋** `guppi.toml`: the settings file of GUPPI.

      **＋** `.guppi/guppi/config.py`: the reading of `guppi.toml`.

      **＋** `.guppi/guppi/ship.py`: the command `guppi ship`.

      **＋** `.guppi/tests/test_config.py`: the tests of the reading of `guppi.toml`.

      **＋** `.guppi/tests/test_ship.py`: the tests of `guppi ship`.'
    when: '`uv run --project .guppi guppi ship <folder>` builds the clean version from a working tree
      whose Render of `rule-guppi-config` holds the line `setup_done = true`, or no line of the key `setup_done`.

      **＋** A hook reads `guppi.toml` by `setup_pending` of `.guppi/guppi/config.py`, or `.guppi/tests/test_config.py`
      and `.guppi/tests/test_ship.py` run it over a made-up project.'
    then: 'The copy of `rule-guppi-config` in the clean version holds `setup_done = false` in place of
      each line of that key, or as a line added before the closing marker line of its Render where no
      line of the key stands, and every other line of its Render as the working tree holds it.

      **＋** A `guppi.toml` written from the Render of that copy makes `setup_pending` answer that the
      setup is not done.

      **＋** `setup_pending` answers that the setup is not done only where `guppi.toml` holds `setup_done
      = false`.

      **－** A missing `guppi.toml`, a text that does not parse, a missing key `setup_done` and any other
      value of it count as the setup done.

      **－** The key does not stop the render, and `guppi.toml` of the working tree stays out of the clean
      version.'
    context: 'A project that installs GUPPI by `/guppi:install` runs on the settings of the repository
      of GUPPI: `guppi.toml` holds its languages and its commands of `test` and `style`, `CLAUDE.md` a
      blank description, and the read rules of `rule-permissions` the folder of its saved transcripts.
      Nothing changes them: the first `/hi` sees the sprint `guppi` closed and starts `/sprint-open`,
      and the ledger hook refuses every decision line but a `defer` until a sprint page is created, so
      a setup Case before the opening could not be written. `rule-morph` describes the setup Case, but
      it is `draft`, carries no `core`, and none of its parts is built; its two Estimates, `estimate-morph-sets-up-the-project-at-the-first-hi`
      and `estimate-morph-takes-in-the-set-aside-files`, are `pending`. The person chose to build all
      of it now: a key `setup_done` of `guppi.toml`, `false` in the clean version and `true` here; the
      setup Case under the id that `guppi caseid --next` prints in a new project; every decision line
      written while the key is `false`; a skill `/setup` that `guppi sprint --hi` starts first; no name
      of the main branch and no git remote; `core: true` on `rule-morph` and on the new page `rule-skill-setup`
      now; a test for each code part; and a reply that acknowledges the setup Case with no Frontier. After
      its ratification the person asked, on the round of Case 1018, that this reply end with the open
      question on what the first sprint is to build, not with the sprint id, and agreed that the main
      agent proposes the id right after the answer, before it dispatches the opening Case under `<id>-1`;
      so Cases 1017.3, 1017.4, 1017.6 and 1017.7 change under the same number, with the same pages. The
      open question at the opening of every sprint, who asks it, the options of the goal question and
      step 2 of `/sprint-open`, where the id is proposed, belong to Case 1018 (item C8), whose finished
      file I read after its build ended; this Case sets only the setup reply and the Criterion of `estimate-skill-sprint-open-asks-the-opening-questions`,
      which Case 1018.1 names as the check of its change and does not replace. Case 1018.1 changes the
      Purpose of `rule-skill-sprint-open` at the sentence that the backlog is not gone through, step 2
      of its Render and the words of step 5 that the main agent asks the person for the id; the pair of
      Case 1017.6 on that page has its anchor in another sentence of the Render, that the opening Case
      is the first Case the session ratifies, so the pairs of the two Cases touch no text in common, and
      the new text of each says the same of the setup reply: the person''s answer to it is taken and the
      question is not asked again. Case 1018.2 has the opening Case word the goal from the person''s answer
      with no question on it, so Case 1017.6 lists the goal among the parts that the opening Case builds
      from that answer and says that `case-guppi` asks in its rounds only what the answer leaves open.
      The line of the old Criterion of `estimate-skill-sprint-open-asks-the-opening-questions` that says
      the main agent asks the person for the id is not carried as it stands: the person chose in Q12 that
      the main agent proposes the id and the person confirms or corrects it, and the `－` line of Case
      1017.6 says so. A `＋` line of Case 1017.6 and the `－` line of Case 1017.4 share words about `guppi.toml`
      and `setup_done = false` but set two things: the first says that the reply confirming the setup
      Case asks the open question, and the second says that a project without that key gets no setup Case,
      so neither is the other written twice. I read the code behind each claim. `sprint_id` of `.guppi/guppi/materialize.py`
      takes the first word of the first `## ` heading of `vault/wiki/sprint.md`, which `closed_form` of
      `.guppi/guppi/sprint.py` writes for `SHIPPED`, `guppi`, of `.guppi/guppi/pages.py`, and `open_sprint`
      and `next_id` of `.guppi/guppi/caseid.py` take that sprint, not one of `PLAIN_SPRINTS`, so the setup
      Case is `guppi-1` with no change of code. `refused_without_sprint` of `.guppi/guppi/ledger.py` returns
      no line when a live sprint page or a `create` of one stands, and `refused_taken_sprint` refuses
      a taken id apart from it. `hi_hook` of `.guppi/guppi/sprint.py` prints its line only on `/hi` with
      the closed mark. `shipped_page` of `.guppi/guppi/ship.py` writes the copy of each page and calls
      `blank_description` for the Render of `rule-claude-md` alone, and `LEFT_OUT` keeps `guppi.toml`
      out of the copy, so the first `/hi` of a project renders it from the shipped page; `parse` of `.guppi/guppi/config.py`
      reads only the two language keys, so a new key does not stop the render. The settings of a setup
