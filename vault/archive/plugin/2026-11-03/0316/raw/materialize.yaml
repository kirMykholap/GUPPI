    given: '`rule-ask`: the rule of `ask-guppi`, whose Render sets the limit.

      **＋** `.claude/agents/ask-guppi.md`: the agent file rendered from `rule-ask`.

      **＋** `.claude/skills/pre-spec/SKILL.md`: the skill whose questions the agent answers.

      **＋** `estimate-ask-searches-at-prespec`: its Criterion, `purpose` and `method` are replaced.

      **＋** `estimate-prespec-finds-a-reader-of-a-new-files-folder`: the check of the folder-walk Grep.

      **＋** `estimate-search-leaves-out-decisions-by-the-grep-hook`: the check of the Grep hook on `vault/wiki/decisions/`.

      **＋** `estimate-search-leaves-out-decisions-in-every-agent`: the check of the reads of Decision
      pages.

      **＋** `vault/wiki/rules/`: the folder of the rules, the first index Grep of the agent.

      **＋** `vault/wiki/entities/`: the folder of the entities, an index Grep of the agent.

      **＋** `vault/wiki/lessons/`: the folder of the lessons, an index Grep of the agent.

      **＋** `vault/wiki/insights/`: the folder of the insights, an index Grep of the agent.

      **＋** `vault/archive/`: the archive, which the agent searches by slug alone.'
    when: At the first run of `/pre-spec` in a session, the main agent dispatches `ask-guppi` through
      the `Agent` tool with the plan file and the questions of `.claude/skills/pre-spec/SKILL.md`, and
      the agent follows `.claude/agents/ask-guppi.md` as rendered from `rule-ask`.
    then: 'The agent starts with the Grep `^(purpose|deferred_by):` over `vault/wiki/rules/`, then runs,
      whatever the question, the Grep `^(purpose|deferred_by):` over `vault/wiki/entities/`, `^(root_cause|deferred_by):`
      over `vault/wiki/lessons/` and `^(pattern|deferred_by):` over `vault/wiki/insights/`, each with
      its pattern as the recipe writes it and no word added.

      **＋** After those Greps it runs further Greps and Reads as a finding needs, including the search
      behind a count that a `context` states.

      **＋** Those Greps and Reads may cover the code, the tests and the harness files as well as the vault.

      **＋** The list of what the agent did not check names no search of the code as a broken rule of `.claude/agents/ask-guppi.md`.

      **＋** A count of a `context` whose search covers `vault/wiki/decisions/` is not run again and is
      no finding.

      **－** No search of the code, the tests or the harness files reaches `vault/archive/`, which the
      agent searches by slug alone.

      **－** Whether the folder-walk Grep runs for a Case that adds a file that is no page of the vault
      is outside this promise: `estimate-prespec-finds-a-reader-of-a-new-files-folder` reads it.

      **－** Whether a Grep of the agent over a folder that holds `vault/wiki/decisions/` leaves that folder
      out is outside this promise: `estimate-search-leaves-out-decisions-by-the-grep-hook` reads it.

      **－** Whether a Read of the agent, or a Grep inside `vault/wiki/decisions/`, reaches a Decision
      page only for a reason of its frame is outside this promise: `estimate-search-leaves-out-decisions-in-every-agent`
      reads it.'
    context: 'At the first run of `/pre-spec`, the main agent sends `ask-guppi` over the plan. The agent
      checks each Case against the vault, and lists each search that broke a rule of its frame. Its frame,
      `.claude/agents/ask-guppi.md` rendered from `rule-ask`, lets it grep and read as each finding needs.
      For the code, it allows one search only: the folder-walk Grep for a Case that adds a file that is
      no page (case 995.2). But the questions of `/pre-spec` ask about contradictions and false facts
      in a Case, and many of these facts are about code. In the last two sessions the agent searched and
      read the code to check them, and it listed those searches as broken rules. In session 2035, its
      answer at line 204 of the transcript `~/.claude/projects/c--PROJECTS-GUPPI/591bb5b1-415f-4996-bd48-66e9dfb58b97/subagents/agent-a69d749dca3dd42a8.jsonl`
      says that finding 4 rests in part on a Read of `casecheck.py`. That finding showed a false claim
      in the `context` of Case 1010. In session 2155, its answer at line 368 of `~/.claude/projects/c--PROJECTS-GUPPI/c818d971-be31-4157-ab5d-802bd511827f/subagents/agent-ae110edf4b52bb4ee.jsonl`
      says that no finding rests on its searches of code. It also says that its "none" under the question
      on the facts of a `context` rests on one of them.


      The person chose to let those searches stand: at `/pre-spec` the Greps and Reads that a finding
      needs may cover the code, the tests and the harness files. The folder-walk Grep is still required
      for a Case that adds a new file. The same answer of session 2155 also reports two Greps that reached
      `vault/archive/` by a pattern. The person left that out of this Case, so the archive rule of the
      first paragraph of the Render stands as it is. Finding 4 of the `ask-guppi` run of `/pre-spec` noted
      that the new sentence, which says that a search of the code breaks no rule, read as if it excused
      such a Grep. The new sentence now says that a search of the code does not reach `vault/archive/`,
      which stays searched by slug alone, and the new Criterion says so in a line of its own.


      `rule-ask` is `draft`. The pair of Case 1015.1 changes the one sentence that sets the limit. A Grep
      `one search of the code|search(es)? of (the )?code` over `{vault/wiki,.claude,.guppi/guppi,.guppi/tests}/**`
      printed `.claude/agents/ask-guppi.md`, `vault/wiki/rules/rule-ask.md` and `vault/wiki/brief.md`.
      The first is the render of the second, and the brief lines report the item, so no other text sets
      the limit. The first sentence of the Render, "You search the vault at `vault/wiki/` for the caller",
      stands: it names the field of every run, and the paragraph on `/pre-spec` adds the code for that
      run alone.


      Of the Estimates of `rule-ask`, `estimate-ask-searches-at-prespec` speaks of what the agent searches
      at `/pre-spec`, so Case 1015.1 replaces its Criterion and sets its `purpose` and `method` anew.
      `estimate-ask-finds` stands: its Criterion asks for a line per search rule broken, and a search
      of code simply breaks no rule after the change. `estimate-ask-query-before-a-create`, `estimate-ask-opens-a-decision-only-for-a-finding`
      and `estimate-ask-tries-a-decision-call-only-for-a-hook-trial` speak of the query before a `create`
      and of Decision pages, not of the code. `estimate-prespec-finds-a-reader-of-a-new-files-folder`,
      of `rule-prespec`, says that a plan with no such Case starts no Grep of the code. The change makes
      that false, so Case 1015.2 replaces its Criterion; its `purpose` and `method` speak only of the
      folder-walk Grep and stand. The new Criterion changes two of its lines on purpose: the folder-walk
      Grep runs "beside its other searches", no longer "beside its searches of the vault", and a plan
      with no such Case starts no folder-walk Grep, no longer no Grep of the code.


      The check of this file sent a note that lists the files that name `rule-ask`, `ask-guppi.md` or
      `ask-guppi`. The Grep for the limit above covered each of them and printed none, so none of them
      states the limit. Judged by its purpose line, `estimate-prespec-confirms-the-findings-once` speaks
      of the confirmation of findings, where the agent runs no Grep. That stands, since this Case leaves
      the confirmation as it is. `estimate-prespec-reconciles` and `vault/wiki/orchestration.md` speak
      of the dispatch of `ask-guppi` and of the loop of `/pre-spec`, not of what it searches, so they
      stand. The other listed files speak of `case-guppi`, of Decision pages or of other moments, not
      of the searches of code of `ask-guppi` at `/pre-spec`.


      A Grep `ask-guppi|rule-ask|ask_guppi|searches-at-prespec|reader-of-a-new-files-folder` over `.guppi/tests/`
      printed `test_casecheck.py` and `test_grepguard.py`. Both build their files under a temporary folder,
      so no test reads the changed texts live. No `error` lesson stands in the ledger of this session.'
