- case: '1018.1'
  decision: decision-case-1018.1
  origin: raw/2026-11-03/0316/ledger.md#case-1018.1
  targets:
  - kind: update
    category: rules
    slug: rule-skill-sprint-open
    ref: rule-skill-sprint-open
  tags: []
  case_text:
    given: '`rule-skill-sprint-open`: the skill `/sprint-open`, which sets the questions of the opening.

      **＋** `estimate-skill-sprint-open-asks-the-opening-questions`: the check of the questions before
      the dispatch, as Case 1017.6 sets it.

      **＋** `.claude/skills/sprint-open/SKILL.md`: the skill file rendered from `rule-skill-sprint-open`.

      **＋** `rule-morph`: the setup Case, whose acknowledging reply asks the open question in the setup
      session.

      **＋** `vault/wiki/sprint.md`: the file whose first heading marks the last sprint closed.

      **＋** `vault/wiki/brief.md`: the brief whose Next session holds the line `open the next sprint`.'
    when: The main agent starts the skill `/sprint-open` of `.claude/skills/sprint-open/SKILL.md`, rendered
      from `rule-skill-sprint-open`, on `PreToolUse Skill`, or the person types `/sprint-open` on `UserPromptSubmit`,
      in a session whose `vault/wiki/sprint.md` marks the last sprint closed.
    then: 'Before any Frontier is assembled and before any dispatch, the main agent asks the person one
      plain question with no options: what they want to build in this sprint, how they see it and what
      should happen.

      **＋** Where the reply that acknowledges the setup Case of `rule-morph` asked that question in the
      session, the main agent takes the person''s answer to it and does not ask it again.

      **＋** Right after the answer, the main agent proposes in one plain question an id of the sprint
      worded from the answer, and the person confirms it or gives another.

      **＋** The id names the page of the sprint, starts with the GitHub name of its author, such as `kir-plugin`,
      and holds lower-case letters, digits and hyphens and no dot.

      **＋** The main agent then dispatches `case-guppi` with the Case id `<id>-1` for the line `open the
      next sprint` of the `Cases` of Next session in `vault/wiki/brief.md`, with the id, the person''s
      answer word for word, and the request that the opening Case build its Definition of done as Estimates
      and its first milestone and items from that answer and ask in its rounds only what the answer leaves
      open.

      **－** The main agent puts no question on the goal, the Definition of done or the milestones before
      the dispatch.

      **－** The main agent decides neither the work nor the id: the person describes the work and chooses
      the id.'
    context: 'Today `/sprint-open` asks the person one plain question, the id of the sprint, and then
      sends `case-guppi` to build the opening Case. That Case asks the goal of the sprint as a choice
      between goals taken from the description of the project in `CLAUDE.md` and one goal in the person''s
      own words (case 952). Nothing asks the person, in their own words, what they want to build. In a
      new project the description is still blank in the setup session, so the opening Case starts from
      the id alone; `lesson-sprint-open-asks-no-goal-of-a-new-project`, of an earlier session, records
      a first round that offered a goal the agent made up. The person chose this order for every sprint:
      first one open question on what to build in the sprint, how the person sees it and what should happen;
      then the main agent proposes the id, worded from the answer; then the opening Case builds the sprint
      from the answer and asks only what it leaves open. The goal sentence is worded by the opening Case
      from the answer, with no question on it, and the person corrects it at the showing. Case 1018.2
      replaces the Criterion of `estimate-skill-sprint-open-asks-the-goal-as-an-open-question`, since
      it states the options from the description, and sets its `purpose` anew, since that states the old
      promise; no line of its old Criterion is carried, on purpose, since each speaks of the options of
      a goal question that no longer stands. The person chose that this Case replace the Criterion of
      `estimate-skill-sprint-open-asks-the-opening-questions`, which states the id first; the check of
      this file reported that Case 1017.6 replaces that Criterion too, and `same_target_findings` of `.guppi/guppi/prespec.py`
      reports two Cases of one plan that do so. Case 1017, built again at the same time as this Case,
      now writes in that Criterion the order the person chose here: the open question on what the sprint
      is to build comes first, asked by the reply that acknowledges the setup Case where one stands and
      taken from it; right after the answer, the main agent proposes the id in one plain question and
      the person confirms it or gives another; then `case-guppi` is sent with `<id>-1` and the person''s
      answer. So that Estimate, as Case 1017.6 sets it, checks the change of Case 1018.1, and this Case
      does not replace its Criterion, since one promise is signed in one wording. The id is proposed in
      one plain question, not as a choice between ids, since the person''s answer to the question of Case
      1017 on the id, asked again after the clash, took that form. The prompt of the call still names
