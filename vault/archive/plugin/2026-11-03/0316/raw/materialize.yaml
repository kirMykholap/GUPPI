  fields:
    kind: QA
    purpose: Whether guppi ship writes setup_done = false into the Render of rule-guppi-config of the
      clean version, whether the working tree holds the key or not, every other line kept, and whether
      setup_pending of config.py takes the setup as not done only on setup_done = false
    method: uv run --project .guppi pytest .guppi/tests/test_config.py .guppi/tests/test_ship.py -k setup
    tags:
