  sections:
    Criterion: 'When:

      At the first run of `/pre-spec` in a session, the main agent dispatches `ask-guppi` with the plan
      file and the questions of `.claude/skills/pre-spec/SKILL.md`, rendered from `rule-prespec`; the
      agent follows `.claude/agents/ask-guppi.md`, rendered from `rule-ask`; and a Case of the plan has
      a line in its `tasks` block that adds a file that is no page of the vault.


      Then:

      `ask-guppi` reads the `tasks` block of each Case of the plan, as the dispatch of `.claude/skills/pre-spec/SKILL.md`
      tells it, and answers, for a Case with such a line, whether its `context` names each search and
      reading that `.claude/agents/case-guppi.md` sets for the folders that hold the new file.

      **＋** A search or a reading that the `context` misses is a finding that names the Case and what
      it misses.

      **＋** Beside its other searches, it runs one Grep of `.guppi/guppi/` and `.guppi/tests/` for the
      calls that walk a folder, such as `os.walk`, `rglob`, `glob` and `iterdir`, and reads around its
      line each hit whose folder holds the new file.

      **＋** Each reader that takes every file of such a folder and that the Case does not name is a finding
      that names the Case and the reader.

      **－** A plan with no such Case starts no such Grep for the calls that walk a folder, and the question
      says "none".

      **－** At the confirmation of its findings, the agent runs no such Grep.

      **－** The other Greps and Reads of the code that a finding needs are outside this promise: `estimate-ask-searches-at-prespec`
      reads them.'
