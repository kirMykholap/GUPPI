  case_text:
    given: '`rule-morph`: the rule of the setup of a new project.

      **＋** `estimate-morph-sets-up-the-project-at-the-first-hi`: its Criterion is replaced whole.

      **＋** `rule-skill-setup`: the skill `/setup`, which `/hi` starts and which hands over to `/sprint-open`.

      **＋** `rule-plugin-install`: the install `/guppi:install`, which comes before.

      **＋** `rule-ledger-write`: the ledger hook, which writes the lines of the setup Case.

      **＋** `guppi.toml`: the settings file that holds the key `setup_done`.

      **＋** `entity-sprint-plugin`: the sprint page, whose milestone item and backlog change.'
    when: In a project where the person installed the plugin `guppi` and typed `/guppi:install`, as `rule-plugin-install`
      sets it, and whose `guppi.toml` holds `setup_done = false`, the person reopens Claude Code and types
      `/hi`.
    then: '`/hi` opens the session and starts `/setup` of `rule-skill-setup`, which puts the setup Case
      of `rule-morph` first, before the opening Case of the first sprint and before the Frontier.

      **＋** The setup Case takes the name of the project''s folder of saved transcripts from the path
      of the project.

      **＋** It asks the person only for the values it cannot find: the language of the repository, the
      language of the chat, the commands of the keys `test` and `style` of `guppi.toml` and the description
      of the project.

      **＋** Every value stands in that one setup Case, which the person ratifies or corrects, and the
      ledger hook of `rule-ledger-write` writes its decision lines though no sprint is open.

      **＋** The reply that acknowledges the setup Case shows no Frontier and ends with the open question
      on what the first sprint is to build, and on the person''s answer `/sprint-open` starts in the same
      session with that answer.

      **＋** The librarian''s run of that session writes the settings by the render of the rule pages that
      hold them, `guppi.toml`, the description of the project in `CLAUDE.md` and the read rules of the
      saved transcripts, and `guppi.toml` then holds `setup_done = true`.

      **－** `/guppi:install` is no Case, and the person ratifies nothing at it.

      **－** Between `/guppi:install` and that librarian''s run, no settings file changes but by the copy
      and the setting aside of `/guppi:install` and the render that `/hi` runs.

      **－** The setup step asks for no category set, no name of the main branch and no git remote, reads
      no code of the project and creates no page for it.

      **－** A project whose `guppi.toml` does not hold `setup_done = false` gets no setup Case at `/hi`.'
    context: 'A project that installs GUPPI by `/guppi:install` runs on the settings of the repository
      of GUPPI: `guppi.toml` holds its languages and its commands of `test` and `style`, `CLAUDE.md` a
      blank description, and the read rules of `rule-permissions` the folder of its saved transcripts.
      Nothing changes them: the first `/hi` sees the sprint `guppi` closed and starts `/sprint-open`,
      and the ledger hook refuses every decision line but a `defer` until a sprint page is created, so
      a setup Case before the opening could not be written. `rule-morph` describes the setup Case, but
      it is `draft`, carries no `core`, and none of its parts is built; its two Estimates, `estimate-morph-sets-up-the-project-at-the-first-hi`
      and `estimate-morph-takes-in-the-set-aside-files`, are `pending`. The person chose to build all
      of it now: a key `setup_done` of `guppi.toml`, `false` in the clean version and `true` here; the
      setup Case under the id that `guppi caseid --next` prints in a new project; every decision line
      written while the key is `false`; a skill `/setup` that `guppi sprint --hi` starts first; no name
      of the main branch and no git remote; `core: true` on `rule-morph` and on the new page `rule-skill-setup`
      now; a test for each code part; and a reply that acknowledges the setup Case with no Frontier. After
      its ratification the person asked, on the round of Case 1018, that this reply end with the open
      question on what the first sprint is to build, not with the sprint id, and agreed that the main
      agent proposes the id right after the answer, before it dispatches the opening Case under `<id>-1`;
      so Cases 1017.3, 1017.4, 1017.6 and 1017.7 change under the same number, with the same pages. The
      open question at the opening of every sprint, who asks it, the options of the goal question and
      step 2 of `/sprint-open`, where the id is proposed, belong to Case 1018 (item C8), whose finished
      file I read after its build ended; this Case sets only the setup reply and the Criterion of `estimate-skill-sprint-open-asks-the-opening-questions`,
      which Case 1018.1 names as the check of its change and does not replace. Case 1018.1 changes the
      Purpose of `rule-skill-sprint-open` at the sentence that the backlog is not gone through, step 2
      of its Render and the words of step 5 that the main agent asks the person for the id; the pair of
      Case 1017.6 on that page has its anchor in another sentence of the Render, that the opening Case
      is the first Case the session ratifies, so the pairs of the two Cases touch no text in common, and
      the new text of each says the same of the setup reply: the person''s answer to it is taken and the
      question is not asked again. Case 1018.2 has the opening Case word the goal from the person''s answer
      with no question on it, so Case 1017.6 lists the goal among the parts that the opening Case builds
      from that answer and says that `case-guppi` asks in its rounds only what the answer leaves open.
      The line of the old Criterion of `estimate-skill-sprint-open-asks-the-opening-questions` that says
      the main agent asks the person for the id is not carried as it stands: the person chose in Q12 that
      the main agent proposes the id and the person confirms or corrects it, and the `－` line of Case
      1017.6 says so. A `＋` line of Case 1017.6 and the `－` line of Case 1017.4 share words about `guppi.toml`
      and `setup_done = false` but set two things: the first says that the reply confirming the setup
      Case asks the open question, and the second says that a project without that key gets no setup Case,
      so neither is the other written twice. I read the code behind each claim. `sprint_id` of `.guppi/guppi/materialize.py`
      takes the first word of the first `## ` heading of `vault/wiki/sprint.md`, which `closed_form` of
      `.guppi/guppi/sprint.py` writes for `SHIPPED`, `guppi`, of `.guppi/guppi/pages.py`, and `open_sprint`
      and `next_id` of `.guppi/guppi/caseid.py` take that sprint, not one of `PLAIN_SPRINTS`, so the setup
      Case is `guppi-1` with no change of code. `refused_without_sprint` of `.guppi/guppi/ledger.py` returns
      no line when a live sprint page or a `create` of one stands, and `refused_taken_sprint` refuses
      a taken id apart from it. `hi_hook` of `.guppi/guppi/sprint.py` prints its line only on `/hi` with
      the closed mark. `shipped_page` of `.guppi/guppi/ship.py` writes the copy of each page and calls
      `blank_description` for the Render of `rule-claude-md` alone, and `LEFT_OUT` keeps `guppi.toml`
      out of the copy, so the first `/hi` of a project renders it from the shipped page; `parse` of `.guppi/guppi/config.py`
      reads only the two language keys, so a new key does not stop the render. The settings of a setup
      Case change at the librarian''s run of its session, since its pages change there and its render
      lines are run there, so `rule-morph` and the two Criteria name that run in place of the Work Mode.
      Missing key or file counts as done, so this repository, whose `guppi.toml` gains the key only at
      the librarian''s run, never sees the setup. A Grep of `setup` over `.guppi/guppi/` printed nothing,
      so no code judges the key yet, and `.guppi/guppi/config.py` holds the one judgment that `ledger.py`,
      `sprint.py` and the test of `ship.py` share. A Grep of `chat_lang` over `{vault/wiki,.claude,.guppi/guppi}/**`,
      in the mode of paths, printed 15 files; of the texts that list the keys of `guppi.toml`, the docstring
      of `config.py` and the Purpose of `rule-guppi-config` change here, and the Criterion of `estimate-guppi-config-runs-the-test-and-style-commands`
      stands, since it says that the keys other than the languages do not stop the render. A Grep of `guppi\.toml|SETTINGS_FILE|rule-guppi-config`
      over `.guppi/tests/`, in the mode of paths, printed 7 files, `test_casecheck.py`, `test_commands.py`,
      `test_ship.py`, `test_prespec.py`, `test_render.py`, `test_case_schema.py` and `test_config.py`;
      each writes its own `guppi.toml` or a sample Render in a temporary folder, and `test_ledger.py`
      and `test_sprint.py` write none, so their tests keep their answers with the key missing. Of the
      tests that read a live file this Case changes, `test_orchestration.py` reads from `vault/wiki/orchestration.md`
      only the blocks tagged `showing` and `defer`, which the new sentence does not touch. The Criterion
      of `estimate-skill-sprint-open-starts-at-hi` stands: the line it names is still printed, and a heading
      with no closed mark still prints nothing. The Criterion of `estimate-clean-branch-writes-the-session-files`
      stands: the first `/hi` of a new project still starts `/sprint-open` before the Frontier, after
      `/setup`. The step of `rule-git-context` for a folder that is no git repository stands: it ends
      the reply, so it starts no `/setup` either, and `rule-skill-hi` names that exception. The sentence
      of `rule-clean-branch` that takes `core` from a page that blocks the build and that a new project
      can go without stands, since a new project whose `/hi` starts `/setup` cannot go without `rule-skill-setup`
      and `rule-morph`; while they are `draft`, the workflow writes nothing to `prod`, and the readings
      install from a copy that `--allow-draft` writes. Case 1014 of this session defers the reading of
      `estimate-orchestration-acknowledging-reply`; Case 1017.7 replaces its Criterion with the exception
      of the setup reply and leaves that defer standing, so the reading waits in the backlog for the new
      Criterion. Case 1016 updates `rule-clean-branch` by other pairs, which this Case does not touch.
      The milestone item of `entity-sprint-plugin` changes, so the Frontier line C2 closes by this Case.
      Of the files the check named, I read where they speak of what this Case changes. The Criterion of
      `estimate-clean-branch-refuses-a-draft-core-page` says that `rule-morph` carries no `core`, which
      `core: true` makes false, so Case 1017.8 replaces it. The Criterion of `estimate-clean-branch-ships-neutral-texts`
      leaves the values of the Render of `rule-guppi-config` out of its promise, and the new sentence
      of its Purpose holds in any project. `rule-morph` and `rule-skill-setup` enter the clean version
      for the first time with `core: true`, so each of their new sentences is judged against its third
      `＋` line, with the bracket of a case number gone: a sentence of `rule-morph` that a name of the
      main branch other than main waits as a line of the backlog of the sprint that builds the page holds
      only in the repository of GUPPI, so Case 1017.4 removes the old sentence on the parts still to be
      built without one in its place, and the backlog line stands on `entity-sprint-plugin` alone, which
      is no core page; the other new sentences of the two pages speak of `guppi.toml`, `/setup`, `/hi`
      and the clean version as they stand in any project that installed GUPPI. So that Criterion stands.
      `lesson-sprint-open-asks-no-goal-of-a-new-project`, of an earlier session, says that the opening
      Case of a new project asks the goal by options from the vault alone; its cause is the goal question
      of `/sprint-open`, which item C8 changes, so this Case carries no mark for it. The Criterion of
      `estimate-skill-sprint-open-refuses-a-taken-sprint-id` stands, since Case 1017.2 keeps that refusal.
      Of the Criterion of `estimate-git-context-offers-git-init`, the lines on the question of `git init
      -b main` and on the answer no stand, since the git step still ends its reply; its line that the
      next `/hi` goes on with `/sprint-open` first is read in a new install, where `guppi.toml` holds
      `setup_done = false` and `/setup` comes first, so Case 1017.9 replaces its Criterion whole with
      that line changed and every other line carried as it stands, and sets the Estimate `pending`; its
      `method` stands, since it already reads a new install after the librarian''s run. It stands as a
      sub-case of its own, since a Criterion changes only whole and each sub-case holds one promise. The
      line of the old Criterion of `estimate-git-context-offers-git-init` that says the next `/hi` goes
      on with `/sprint-open` first is not carried as it stands, on purpose: Case 1017.9 writes it with
      `/setup` first where the setup of the project is not done. A `then` line of Case 1017.2 and one
      of Case 1017.1 share the words `guppi.toml`, `setup_done = false` and `setup_pending`, but set two
      things: the first says that the ledger hook writes a decision line, the second what the clean version
      ships. The Criteria of `estimate-orchestration-acknowledges-the-opening-with-the-frontier`, `estimate-sprint-plugin-installs-as-a-plugin`
      and `estimate-plugin-install-writes-guppi-into-an-empty-project` stand: the reply that acknowledges
      the opening Case still shows the Frontier, `/hi` still runs in a new project, and the install still
      writes `guppi.toml` only through the render of the first `/hi`. `.guppi/guppi/render.py` and `.guppi/guppi/commands.py`
      read the Render and `guppi.toml` by `parse` and `commands_of` of `config.py`, which take no new
      key, so they stand. The other files the check named speak of the forms of a Case, the ledger, lint,
      pre-spec, the settings file or the skills in general, not of the setup, so they stand. The Criterion
      of `estimate-sprint-plugin-ci-writes-a-clean-branch` says that a run writes nothing to `prod` while
      a page that blocks the build stands, which Case 1017.8 keeps, so it stands; `estimate-case-build-reads-each-list-of-a-new-member`
      speaks of how `case-guppi` searches, not of the build, so it stands. The line of the old Criterion
      of `estimate-clean-branch-refuses-a-draft-core-page` that says `rule-morph` carries no `core` is
      not carried on purpose. The findings of `/pre-spec` on this Case are fixed as follows. `shipped_page`
      of `.guppi/guppi/ship.py` runs from the working tree at once, while the live Render of `rule-guppi-config`
      gains `setup_done = true` only at the librarian''s run, so the task of Case 1017.1 has it add `setup_done
      = false` before the closing marker line where no line of the key stands; a clean version built in
      that gap ships the key too, and `prod` takes none while `rule-morph` and `rule-skill-setup` are
      `draft`. Step 2 of the Render of `rule-skill-setup` names the eight-character session id, the second
      token of the `hi:` line, as `.claude/skills/pre-spec/SKILL.md` spells it out, since `lesson-caseid-session-option-takes-the-hhmm`,
      of session 2155, names the words of `vault/wiki/orchestration.md` on the stamp as the cause of a
      `--session` given the time of the folder; that lesson stands in an earlier ledger, so this Case
      carries no mark for it. The Criterion of `estimate-sprint-close-next-session-opens-the-sprint` stands:
      its When names the session after the librarian''s run of the session that closes a sprint of the
      project, and its tests run `guppi ledger` over a made-up vault that `.guppi/tests/test_ledger.py`
      writes with no `guppi.toml`, which `setup_pending` takes as done; the task of Case 1017.2 names
      the new tests with `setup` and not `sprint`, so its run `-k sprint` takes none of them. Case 1017.3
      no longer says what `/hi` does on the setup line, since its method runs only the hook; `estimate-morph-sets-up-the-project-at-the-first-hi`
      checks that `/hi` starts `/setup`, by the first line of the `then` of Case 1017.4, and `estimate-git-context-offers-git-init`,
      by Case 1017.9, checks it after `git init -b main`. The `method` of `estimate-skill-sprint-open-asks-the-opening-questions`
      is set anew to wait for the librarian''s run of the session that replaces its Criterion and to read
      the Render of `rule-skill-setup` and the sentence of `rule-orchestration` on the setup reply beside
      the Render of `rule-skill-sprint-open`, since `.claude/skills/sprint-open/SKILL.md` changes only
      at that render and the setup reply is set by the other two; its `purpose`, which said the sprint
      id comes first, is set anew too. The `method` of `estimate-orchestration-acknowledging-reply` keeps
      its reading and gains a second one, after the librarian''s run of the session that replaces its
      Criterion and a setup Case ratified in a new install, which reads the reply that acknowledges that
      setup Case; the defer of Case 1014 stands. The new file `.claude/skills/setup/SKILL.md` makes no
      reader of its folders wrong. A Grep of `os\.walk|rglob|\.glob\(|iterdir` over `.guppi/guppi/` printed
      14 files and over `.guppi/tests/` printed 15 files; of them, three take every file of `.claude/`:
      `tree_files` of `.guppi/guppi/ship.py`, called on each folder of `TREES`, `.guppi` and `.claude`,
      copies each file but those of `SKIPPED_NAMES` into the clean version, which is where Case 1017.8
      wants the skill file; `named_files` of `.guppi/guppi/casecheck.py` reads each UTF-8 file under `NAMED_IN`,
      `.claude` among them, for the note of names, and takes the new Markdown file as it takes the other
      skill files; `callers` of `.guppi/tests/test_guppi_package.py` takes each file under `.claude`,
      and `test_no_caller_runs_the_code_or_the_tests_without_the_project` fails on `uv run guppi` or `uv
      run pytest`, which the new Render does not hold, since its one command is `uv run --project .guppi
      guppi caseid`. A Grep of `\.claude/skills` over `vault/wiki/rules/` printed 23 files, and a Grep
      of `"\.claude"|\.claude/skills|"skills"` over `.guppi/guppi/` printed `casecheck.py`, `ship.py`,
      `ledger.py` and `recall.py`; their hits are `NAMED_IN` and `TREES` of the two readers above, the
      form `SKILL_FILE` of `casecheck.py`, which takes the path of any skill, `PLUGIN_SKILLS` of `ship.py`,
      the folder `plugin/skills` of the plugin, the path of the skill `/hi` in `recall.py` and the plans
      folder in `ledger.py`, and none lists the skills one by one; the hits of `vault/wiki/rules/` each
      name the file of one skill, and none lists them. A Grep of `\.claude/skills|\bskills\b` over `.claude/`
      printed 8 files, `.claude/skills/box/SKILL.md`, `.claude/skills/wait-what/SKILL.md`, `.claude/skills/sprint-open/SKILL.md`,
      `.claude/skills/sprint-close/SKILL.md`, `.claude/skills/pre-spec/SKILL.md`, `.claude/skills/merge-main/SKILL.md`,
      `.claude/agents/ask-guppi.md` and `.claude/agents/case-guppi.md`; each hit names the file of one
      other skill, such as `grill-me`, `merge-main` or `pr-review`, or the word skills in a sentence on
      skills in general or on the `skills` field of an agent, and none lists the skills one by one or
      takes every file of `.claude/skills/`, so the new file makes none of them wrong. No `.gitignore`
      stands under `.claude/`, by a Glob, and the `.gitignore` of the root holds no line of `.claude`
      or `skills`. The session''s ledger holds no `error` lesson.'
