  case_text:
    given: '`estimate-git-context-offers-git-init`: its Criterion is replaced whole.

      **＋** `rule-git-context`: the step of `/hi` for a folder that is no git repository, run by `guppi
      gitstate` under the `Branch:` line of `.claude/skills/hi/SKILL.md`.

      **＋** `rule-skill-hi`: the skill `/hi`, which starts `/setup` before `/sprint-open`.

      **＋** `rule-skill-setup`: the skill `/setup`.

      **＋** `rule-skill-sprint-open`: the skill `/sprint-open`, whose hook asks for it.

      **＋** `rule-default-mode`: the rule of what may be written before a ratified Case, which allows
      `git init -b main`.

      **＋** `guppi.toml`: the settings file that holds the key `setup_done`.'
    when: In an empty folder that is no git repository, where GUPPI is installed from a copy that `guppi
      ship --allow-draft` wrote and `guppi.toml` holds `setup_done = false`, the person types `/hi`, answers
      yes to `git init -b main`, and types `/hi` again.
    then: 'The `/hi` after `git init -b main` prints `main` under `Branch:` and starts `/setup` of `rule-skill-setup`
      first, as `rule-skill-hi` sets it, before `/sprint-open` and before the Frontier.

      **－** The `/hi` that asks for `git init -b main` starts no `/setup` and no `/sprint-open`, as before.'
    context: 'A project that installs GUPPI by `/guppi:install` runs on the settings of the repository
      of GUPPI: `guppi.toml` holds its languages and its commands of `test` and `style`, `CLAUDE.md` a
      blank description, and the read rules of `rule-permissions` the folder of its saved transcripts.
      Nothing changes them: the first `/hi` sees the sprint `guppi` closed and starts `/sprint-open`,
      and the ledger hook refuses every decision line but a `defer` until a sprint page is created, so
      a setup Case before the opening could not be written. `rule-morph` describes the setup Case, but
      it is `draft`, carries no `core`, and none of its parts is built; its two Estimates, `estimate-morph-sets-up-the-project-at-the-first-hi`
      and `estimate-morph-takes-in-the-set-aside-files`, are `pending`. The person chose to build all
      of it now: a key `setup_done` of `guppi.toml`, `false` in the clean version and `true` here; the
      setup Case under the id that `guppi caseid --next` prints in a new project; every decision line
      written while the key is `false`; a skill `/setup` that `guppi sprint --hi` starts first; no name
      of the main branch and no git remote; `core: true` on `rule-morph` and on the new page `rule-skill-setup`
      now; a test for each code part; and a reply that acknowledges the setup Case with no Frontier. After
      its ratification the person asked, on the round of Case 1018, that this reply end with the open
      question on what the first sprint is to build, not with the sprint id, and agreed that the main
      agent proposes the id right after the answer, before it dispatches the opening Case under `<id>-1`;
      so Cases 1017.3, 1017.4, 1017.6 and 1017.7 change under the same number, with the same pages. The
      open question at the opening of every sprint, who asks it, the options of the goal question and
      step 2 of `/sprint-open`, where the id is proposed, belong to Case 1018 (item C8), whose finished
      file I read after its build ended; this Case sets only the setup reply and the Criterion of `estimate-skill-sprint-open-asks-the-opening-questions`,
      which Case 1018.1 names as the check of its change and does not replace. Case 1018.1 changes the
      Purpose of `rule-skill-sprint-open` at the sentence that the backlog is not gone through, step 2
      of its Render and the words of step 5 that the main agent asks the person for the id; the pair of
      Case 1017.6 on that page has its anchor in another sentence of the Render, that the opening Case
      is the first Case the session ratifies, so the pairs of the two Cases touch no text in common, and
      the new text of each says the same of the setup reply: the person''s answer to it is taken and the
      question is not asked again. Case 1018.2 has the opening Case word the goal from the person''s answer
      with no question on it, so Case 1017.6 lists the goal among the parts that the opening Case builds
      from that answer and says that `case-guppi` asks in its rounds only what the answer leaves open.
