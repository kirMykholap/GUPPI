      the main agent asks the person for the id is not carried as it stands: the person chose in Q12 that
      the main agent proposes the id and the person confirms or corrects it, and the `－` line of Case
      1017.6 says so. A `＋` line of Case 1017.6 and the `－` line of Case 1017.4 share words about `guppi.toml`
      and `setup_done = false` but set two things: the first says that the reply confirming the setup
      Case asks the open question, and the second says that a project without that key gets no setup Case,
      so neither is the other written twice. I read the code behind each claim. `sprint_id` of `.guppi/guppi/materialize.py`
      takes the first word of the first `## ` heading of `vault/wiki/sprint.md`, which `closed_form` of
      `.guppi/guppi/sprint.py` writes for `SHIPPED`, `guppi`, of `.guppi/guppi/pages.py`, and `open_sprint`
      and `next_id` of `.guppi/guppi/caseid.py` take that sprint, not one of `PLAIN_SPRINTS`, so the setup
      Case is `guppi-1` with no change of code. `refused_without_sprint` of `.guppi/guppi/ledger.py` returns
      no line when a live sprint page or a `create` of one stands, and `refused_taken_sprint` refuses
      a taken id apart from it. `hi_hook` of `.guppi/guppi/sprint.py` prints its line only on `/hi` with
      the closed mark. `shipped_page` of `.guppi/guppi/ship.py` writes the copy of each page and calls
      `blank_description` for the Render of `rule-claude-md` alone, and `LEFT_OUT` keeps `guppi.toml`
      out of the copy, so the first `/hi` of a project renders it from the shipped page; `parse` of `.guppi/guppi/config.py`
      reads only the two language keys, so a new key does not stop the render. The settings of a setup
      Case change at the librarian''s run of its session, since its pages change there and its render
      lines are run there, so `rule-morph` and the two Criteria name that run in place of the Work Mode.
      Missing key or file counts as done, so this repository, whose `guppi.toml` gains the key only at
      the librarian''s run, never sees the setup. A Grep of `setup` over `.guppi/guppi/` printed nothing,
      so no code judges the key yet, and `.guppi/guppi/config.py` holds the one judgment that `ledger.py`,
      `sprint.py` and the test of `ship.py` share. A Grep of `chat_lang` over `{vault/wiki,.claude,.guppi/guppi}/**`,
