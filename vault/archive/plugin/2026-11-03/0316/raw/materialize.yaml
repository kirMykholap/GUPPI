    - plugin
    type: estimate
  sections:
    Criterion: 'When:

      `uv run --project .guppi guppi ship <folder>` builds the clean version from a working tree whose
      Render of `rule-guppi-config` holds the line `setup_done = true`, or no line of the key `setup_done`.

      **＋** A hook reads `guppi.toml` by `setup_pending` of `.guppi/guppi/config.py`, or `.guppi/tests/test_config.py`
      and `.guppi/tests/test_ship.py` run it over a made-up project.


      Then:

      The copy of `rule-guppi-config` in the clean version holds `setup_done = false` in place of each
      line of that key, or as a line added before the closing marker line of its Render where no line
      of the key stands, and every other line of its Render as the working tree holds it.

      **＋** A `guppi.toml` written from the Render of that copy makes `setup_pending` answer that the
      setup is not done.

      **＋** `setup_pending` answers that the setup is not done only where `guppi.toml` holds `setup_done
      = false`.

      **－** A missing `guppi.toml`, a text that does not parse, a missing key `setup_done` and any other
      value of it count as the setup done.

      **－** The key does not stop the render, and `guppi.toml` of the working tree stays out of the clean
      version.'
