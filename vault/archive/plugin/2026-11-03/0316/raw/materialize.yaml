      **＋** `rule-skill-setup`: the skill `/setup`, whose Case comes first.

      **＋** `guppi.toml`: the settings file that holds the key `setup_done`.

      **＋** `vault/wiki/sprint.md`: the file whose first heading marks the last sprint closed.'
    when: The main agent starts the skill `/sprint-open` of `.claude/skills/sprint-open/SKILL.md`, rendered
      from `rule-skill-sprint-open`, on `PreToolUse Skill`, or the person types `/sprint-open` on `UserPromptSubmit`,
      in a session whose `vault/wiki/sprint.md` marks the last sprint closed.
    then: 'Before any Frontier is assembled and before the skill dispatches anything, the person answers
      one open question on what the sprint is to build: what they want to build in it, how they see it
      and what should happen.

      **＋** In a session where `/setup` of `rule-skill-setup` built the setup Case, since `guppi.toml`
      holds `setup_done = false`, the reply that acknowledges that Case asks that question, and the skill
      takes the person''s answer and does not ask it again.

      **＋** Right after that answer, the main agent proposes in one plain question the id of the sprint,
      which names the page of the sprint and starts with the GitHub name of its author, such as `kir-plugin`,
      with lower-case letters, digits and hyphens and no dot, and the person confirms it or gives another.

      **＋** The main agent then dispatches `case-guppi` with the Case id `<id>-1` for the line `open the
      next sprint` of the `Cases` of Next session in the brief, with the id of the sprint, the person''s
      answer and the parts of the opening that the opening Case builds from that answer in the prompt
      of the call: its goal in one sentence, its Definition of done as Estimates, and the first milestone
      and its items.

      **＋** The prompt asks that the opening Case say how many items the backlog holds and ask the person
      whether to take any of them.

      **＋** The prompt asks that the opening Case write, as the last item of the last milestone of the
      new sprint page, the line ``- the close of `<id>` — `/sprint-close`, a session of its own``.

      **＋** The opening Case is the first Case the session ratifies, but for that setup Case, which comes
      before it.

      **－** No Frontier is assembled, written or shown, and no other item is taken up, before the person
      ratifies the opening Case.

      **－** The opening Case goes through no item of the backlog that the person does not name.

      **－** The skill decides none of the answers: the main agent proposes the id and the person confirms
      or corrects it, and `case-guppi` asks the person in its rounds only what the answer leaves open.'
