  - kind: update
    category: estimates
    slug: estimate-orchestration-dispatches-case-guppi-at-a-level
    ref: rule-orchestration
  tags: []
  case_text:
    context: 'When the main agent dispatches `case-guppi`, it passes the parameter `effort`: `low` for
      an item that asks to change only the text of pages, `high` for one that asks to change a hook or
      a check, `medium` for every other item. The reading at the `/hi` of session 1336 set `estimate-orchestration-dispatches-case-guppi-at-a-level`
      `failed` on two misses of opposite direction: Case 1060 went out at `medium` on an item that asked
      a question whose answer could only change page text, and Case 1061 went out at `low` on an item
      whose first offered fix changed the code of `guppi ship`. The root cause is the wording: a question
      asks no change, so it fell under every other item, and the text names no rule for an item that offers
      several fixes. The person chose to judge the level by the widest change that the item, any fix its
      words offer, or any answer its question could lead to would make. The pair changes the one sentence
      of the Render of `rule-orchestration` that sets the levels (line 39 of the page, in the paragraph
      on the dispatch); the sentences that follow on the person''s word, on the level holding to the end
      of the Case and on `xhigh`, `max` and `model` stand. The Criterion of the Estimate is replaced whole,
      and its `purpose` is set anew since it named what the item asks for; its `method`, a reading of
      the next session''s transcript, stands. A Grep for `effort|dispatches-case-guppi-at-a-level` over
      `{vault/wiki,.claude}/**` printed `brief.md`, `orchestration.md`, `.claude/agents/case-guppi.md`,
      `log.md`, `rule-case-build.md`, `estimate-orchestration-dispatches-case-guppi-at-a-level.md`, `rule-orchestration.md`,
      `estimate-case-build-writes-the-case.md`, `lesson-harness-empty-grep-taken-as-absence.md`, `estimate-context-size-agents-counts-each-agent.md`
      and `rule-permissions.md`; outside the two pages this Case changes, the hits name the `effort: medium`
      field of the agent or the level the call passes, and none states the rule of the levels, so they
      stand. A Grep for `orchestration\.md|rule-orchestration` over `.guppi/tests/` printed `test_onward.py`
      and `test_orchestration.py`; a Grep of both for `effort|low|every other item` printed one line of
      `test_onward.py` on a ratification, not on this sentence, so no test reads the changed text. The
      ledger of the session holds no `error` lesson, so no mark is added. The sentence around the pair,
      line 39 of `rule-orchestration`, was read whole: the pair changes only how the level is judged,
      and the sentences before and after it stand. The check of this file listed the pages, skills and
      code that name `rule-orchestration` or `orchestration.md`; by their purpose lines and paths they
      speak of other steps of the main agent, but for `estimate-sprint-plugin-case-guppi-level-trial-decided`,
      read whole: it measures what the levels saved at the close of the sprint, names no rule of how a
      level is judged, and stands; `glossary.md` holds no row on `effort` or a level. The lines of the
      old Criterion that the check notes as not carried are replaced on purpose, since the Criterion is
      replaced whole.'
    problem: The rule of the levels does not say how to judge an item that is a question or that offers
      several fixes, so the main agent judged two such items at levels the Criterion does not set.
    recommend: "- **How should the level be judged for an item that asks a question or offers several\
      \ fixes?**\n  - Recommended: (a) judge by the widest change any option of the item could make.\n\
      \  - Answer: agreed, (a)."
    given: '`rule-orchestration`: its Render sets the level of the dispatch of `case-guppi`.

      **＋** `vault/wiki/orchestration.md`: the file rendered from that rule.

      **＋** `estimate-orchestration-dispatches-case-guppi-at-a-level`: its Criterion is replaced whole.

      **＋** `.claude/agents/ask-guppi.md`: the agent whose dispatch stays as it is.'
    when: The main agent, with `vault/wiki/orchestration.md` loaded, dispatches `case-guppi` by the Agent
      tool for a Case of Plan Mode or Work Mode.
    then: 'The call passes the parameter `effort`, judged once at the dispatch by the widest change that
      the Frontier item, each fix its words offer, each answer its question could lead to and the person''s
      words would make.

      **＋** The level is `low` when each such change touches only the text of pages and no code, and for
      the setup Case and the opening Case of a sprint.

      **＋** The level is `high` when one such change touches a hook, a check or other code that judges
      a text.

      **＋** The level is `medium` for every other item, an item where one such change touches other code
      included.

      **＋** The person''s word on a Case sets another level up to `high`, and the call passes that level.

      **＋** The level holds to the end of the Case, through each `SendMessage`, also where the built Case
      changes more than its item asked.

      **－** No new dispatch raises the level of a Case.

      **－** No call passes `xhigh` or `max`, and no call passes the parameter `model`.

      **－** The dispatch of `.claude/agents/ask-guppi.md` does not change.'
  spec: vault/raw/2026-11-26/1336/spec.md
