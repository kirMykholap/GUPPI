  - kind: create
    category: estimates
    slug: estimate-orchestration-leaves-the-number-to-case-guppi
    ref: rule-orchestration
  tags:
  - session
  - workflow
  case_text:
    context: 'When a ratified Case changes in Plan Mode, the main agent sends it back to its `case-guppi`,
      and the new file is shown and ratified again. The Render of `rule-orchestration` says so, in the
      paragraph on showing and signing a Case. On the number, that paragraph says only that a Case ratified
      in Work Mode, none of whose tasks has run, changes under its own number, as in Plan Mode, and so
      it sets the old number in Plan Mode with no exception, as the root cause of the lesson below says.
      The rule that a ratified Case that comes back in another shape takes a new number, its decision
      lines carrying `{supersedes:case N}`, stands in the Splitting section of `vault/wiki/case-schema.md`,
      which the main agent does not load. In session 2003 the main agent sent the `case-guppi` of Case
      1060 back to build under 1060; the check of the case file refused that build, and the Case was built
      as 1063 superseding 1060, as `lesson-orchestration-case-built-again-in-another-shape-under-its-old-number`
      records. The person chose to leave the number to `case-guppi` and its check, with a pointer to the
      rule, and not to copy the rule into `orchestration.md`, so that it stands in one wording. The first
      pair adds one sentence after the sentence that ends with "(cases 438, 441)" in that paragraph. The
      second pair rewords the sentence on a Case ratified in Work Mode so that it changes as in Plan Mode,
      under the number that `case-schema.md` sets for it, and no longer sets the old number with no exception;
      the other sentences on Work Mode stand, since there a new number is already set. These findings
      came from `/pre-spec`. Cases 1065 and 1067 are built at the same time as this one, so their files
      were not read in this build. No Estimate of `rule-orchestration` checks the number: their `purpose`
      lines were read, and `estimate-orchestration-shows-the-built-case` is the one whose Criterion speaks
      of a ratified Case that changes. Its lines say the Case changes through its `case-guppi` and is
      ratified again, and that in Work Mode it is not built again under its own number; the new sentence
      makes none of them false, so it stands. Making that Estimate check the number too would mean replacing
      its long Criterion whole, so this Case creates a new Estimate instead. That is a choice of form.
      A Grep for `under its own number|in its prose as in its body` over `{vault/wiki,.claude,.guppi/guppi,.guppi/tests}/**`
      printed `.claude/agents/case-guppi.md`, `.claude/skills/work/SKILL.md`, `.guppi/guppi/ratified.py`,
      `estimate-case-build-writes-the-case.md`, `estimate-orchestration-shows-the-built-case.md`, `estimate-spec-reconcile-refuses-a-case-file-another-agent-holds.md`,
      the lesson, `log.md`, `orchestration.md`, `rule-case-build.md`, `rule-orchestration.md` and `rule-work-mode.md`.
      The hits outside the page this Case changes speak of Work Mode, of the side of `case-guppi`, which
      Case 1065 checks, or of the guard of the case file, and none says the main agent picks the number,
      so they stand. Case 1064 changes another sentence of the same Render, on the level of the dispatch,
      and the two pairs do not overlap. A Grep for `orchestration\.md|rule-orchestration` over `.guppi/tests/`
      printed `test_onward.py` and `test_orchestration.py`; the second tests the two examples only, and
      the line of the first is the one Case 1064 found on a ratification, so no test reads the changed
      sentence. The check of this file listed the pages, skills and code that name `rule-orchestration`
      or `orchestration.md`; by their purpose lines and paths they speak of other steps of the main agent
      or of other rules, and `estimate-orchestration-signs-a-batch-together`, whose purpose speaks of
      a ratified Case sent back, checks only that it is shown in a batch, not its number, so all of them
      stand. The lesson was written in session 2003, and the ledger of this session holds no `error` lesson,
      so no `{addresses:...}` mark is set.'
    problem: '`orchestration.md` gives the main agent no rule for the number of a ratified Case that comes
      back in another shape, so the main agent sent back a correct build under a new number.'
    recommend: "- **What should the orchestration file say about the number of a ratified Case that comes\
      \ back changed?**\n  - Recommended: (a) leave the number to case-guppi and point to the rule.\n\
      \  - Answer: agreed, (a)."
    given: '`rule-orchestration`: its Render sets how a ratified Case changes through its `case-guppi`.

      **＋** `vault/wiki/orchestration.md`: the file rendered from that rule.

      **＋** `estimate-orchestration-leaves-the-number-to-case-guppi`: the new check of the number of a
      changed Case.

      **＋** `vault/wiki/case-schema.md`: its Splitting sets the new number of a Case that comes back in
      another shape.'
    when: In Plan Mode, with `vault/wiki/orchestration.md` loaded, the main agent sends a ratified Case
      back to its `case-guppi` and that `case-guppi` answers with the summary of the Case.
    then: 'The main agent asks for no number in its message to `case-guppi`.

      **＋** The main agent shows the Case under the number of the `**Case:**` line of the summary.

      **＋** A new number whose decision lines carry `{supersedes:case N}` is shown as it stands, since
      the Splitting of `vault/wiki/case-schema.md` sets it.

      **－** The main agent does not send the Case back to be built under its old number.'
  spec: vault/raw/2026-11-26/1336/spec.md
  applied: '15:03:37'
- case: '1067'
  decision: decision-case-1067
  origin: raw/2026-11-26/1336/ledger.md#case-1067
  targets:
  - kind: update
    category: rules
    slug: rule-backlog
    ref: rule-backlog
  - kind: update
    category: estimates
    slug: estimate-backlog-renders
    ref: rule-backlog
  tags: []
  case_text:
    context: '`guppi backlog` writes `vault/wiki/backlog.md`, the list of deferred work. One of its sources
      is the `## Backlog` of each closed sprint page under `vault/archive/`. A line there that names a
      page leaves the list only while that page stands `built`, `passed` or `archived` at the moment of
      the run (`deferred` and `finished` of `.guppi/guppi/backlog.py`, read whole, with `item_slugs`,
      `item_statuses` and `is_done` of `.guppi/guppi/sprint.py`, read whole; case 743.4). A page goes
      from `built` back to `draft` each time a Case gives it a new Estimate that has not been read. So
      the line comes back, though nobody put the work off. The brief reports this for `rule-work-mode`:
      the `## Backlog` of the archived `vault/archive/migration/2026-10-10/1555/entities/entity-sprint-migration.md`
      names it, and the cascade set it `draft` when Case 1061 added `estimate-work-mode-runs-the-style-check-before-a-stop`.
      Its line in `backlog.md` says `put off in 31 sessions`. A Grep of ``^- \[-\].*`rule-work-mode` ``
      over the `frontier.md` files of `vault/` printed 31 files, all under `vault/archive/migration/`,
      so every put-off it counts comes from before the close of that sprint. The work that line stood
      for already stands as a note on the live sprint page `entity-sprint-plugin`, which Case 962 put
      there; that Case accepted that the archived line may leave once the page stands `built`. The History
      of `rule-work-mode` sets it `built` on 2026-10-08 and `draft` on 2026-10-14, so it stood `built`
      on the day of the close, and sets it `built` again on 2026-10-31 and on 2026-11-23. That day is
      the date of the line of the archived sprint page `2026-10-10 status: draft → archived · the close
      of sprint migration (sprint-close)`, which `mark` of `.guppi/guppi/sprint_close.py` (read whole)
      writes. The person chose that such a line leaves for good once its page has stood finished on or
      after the day its sprint closed. So at the librarian''s run of this session the `rule-work-mode`
      line leaves `backlog.md`, and the `rule-spec-box` line, which stood `built` on 2026-11-02, does
      not come back when that page gets a new Estimate. A line whose page has not been finished since
      the close still stands. The rule `rule-one-judgment-one-implementation` governs the new reader of
      History lines. `pages.py` already reads a History line that set a page `built`: `SET_BUILT` and
      `is_draft_core`, read whole (case 996.1). `box.py` reads the date of a History line by `HISTORY_DATE`
      in `history_cases`, read whole. A Grep of `SET_BUILT|HISTORY_DATE|is_draft_core` over `.guppi/`
      printed `box.py`, `lint.py`, `pages.py`, `ship.py`, `test_lint.py` and `test_ship.py`. The status
      lines are written by `Vault.history` of `.guppi/guppi/generate.py` (read whole), which writes `-
      <date> <what> · <pointer>`. A Grep of `status: \{` over `.guppi/guppi/` printed `generate.py`, at
      two calls of `history` that pass `status: <before> → <after>`, and `sprint_close.py`, at `mark`;
      a third call of `history` in `generate.py`, seen in an earlier Grep, passes `status: pending → <status>`
      for a reading. So the Case puts one reader of a status line and of the date of a History line in
      `pages.py`. `is_draft_core` and `backlog.py` judge by it, and `box.py` imports the date pattern
      instead of its own copy. A test runs the writers and the reader over one page and asserts they agree.
      The test `test_a_page_the_cascade_set_built_then_draft_again_is_no_draft_core` of `.guppi/tests/test_lint.py`
