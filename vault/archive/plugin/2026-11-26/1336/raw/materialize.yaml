  category: estimates
  set:
    status: pending
    purpose: Whether case-guppi settles a choice of form itself and names it in context, asks in a round
      only where its options differ in behaviour, in cost or in what they block, and builds a new Case
      beside a ratified one under a new number with no supersedes mark, the ratified file left as it is
    method: 'by hand, at the Retro of the session that sets this Criterion, the text of .claude/agents/case-guppi.md
      read against the Criterion; by hand, after a session whose case-guppi.md holds the Render of rule-case-build:
      each round of case-guppi in the transcript of that session under ~/.claude/projects/ read against
      the Criterion, the transcript in the estimate line'
  change: the Criterion replaced whole — the line on the number of a changed Case dropped, since estimate-case-build-writes-the-case
    checks it with its exception
  sections:
    Criterion: 'When:

      `case-guppi`, following `.claude/agents/case-guppi.md` as rendered from `rule-case-build`, meets
      on an item a choice that the person''s words do not give.


      Then:

      A choice of form is how the work splits into Cases and sub-cases, whether a promise takes a new
      Estimate, a replaced Criterion or an Estimate that already checks the change, which page holds a
      thing, and where a fix goes that adds a second behaviour to a ratified Case.

      **＋** It settles a choice of form itself, with no question in a round.

      **＋** The `context` of the Case names the choice, and the person sees it at the showing of the Case.

      **＋** A choice of form whose options differ in behaviour, in cost or in what they block is a fork,
      and it asks that choice in a round.

      **＋** It asks in a round how a Case is checked only where the Case can give no Estimate, or where
      the options of that question differ in behaviour, in cost or in what they block.

      **＋** A new Case it builds beside a ratified Case takes the number one above the highest number
      of the case files and of the decision lines of the session''s ledger, or the free number that the
      guard of its case file names, and carries no `{supersedes:case N}` mark.

      **＋** The file of that ratified Case stays as it is, and a pair of the new Case whose sentence the
      ratified Case changed takes that sentence as the ratified Case leaves it.

      **－** A choice of the bound, of a second reasonable `recommend`, of the exceptions or of what is
      left not done stays a fork.

      **－** A Case that can give no Estimate still asks in a round what its Estimate will check.'
  applied: '15:03:37'
