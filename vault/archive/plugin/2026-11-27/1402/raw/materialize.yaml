  - kind: update
    category: estimates
    slug: estimate-work-mode-runs-the-style-check-before-a-stop
    ref: rule-work-mode
  tags: []
  case_text:
    context: 'Before each task of the Spec that opens with `stop:`, `/work` runs `uv run --project .guppi
      guppi style`. In this repository that command runs ruff over the Python code, as `guppi.toml` sets
      it and `run` of `.guppi/guppi/commands.py` runs it. The step fixes each finding in a file the session
      changed, writes each other finding into `handoff.md`, and then stops for the person. `estimate-work-mode-runs-the-style-check-before-a-stop`
      failed at `/hi` of this session, by its reading on the `/work` of session 0947 (ledger line 1).
      That run reached four `stop:` tasks. In its transcript the check ran before the first three stops:
      Bash calls on JSONL lines 1971, 1980 and 2046, before the stop replies on lines 2016 and 2054. On
      line 2066 the person answered that the trial passed. The agent then edited only `spec.md` and `frontier.md`
      of the session, and it stopped at the fourth task on line 2117 with no run of the check between.
      No Python file had changed since the last clean run, so a run would have found nothing. The skill
      gives no word on a repeat run, and the agent judged that this one was not needed.

      The person chose to say it plainly: the Render of `rule-work-mode` says "before each task" and adds
      that the check runs every time, also when an earlier run was clean and no file changed since then.
      The Purpose of `rule-work-mode` stands, since its sentence on this step stays true and an `update`
      of a Purpose touches no Estimate. The fourth condition of `vault/wiki/where-to-stop.md` stands too:
      it names no style check. The Criterion of the Estimate already binds each stop, so the Case writes
      it back word for word under `sections: Criterion` to set the Estimate `pending`. By `case-schema.md`
      that is no new Criterion, so its `method`, which reads the transcript of the next `/work`, stands
      under the rule of case 1071.1, and no second Estimate is needed. That `method` waits for the first
      `/work` after the librarian''s render, which this Case''s render line gives. The other two Estimates
      of `rule-work-mode` speak of the branch and the baseline and of the Work readings, by their `purpose`
      lines, so this Case leaves them alone.

      `rule-work-mode` carries `deferred_by` of `decision-case-1080`, the subagent per Case put off at
      session 0947. The Case carries no `{supersedes:case 1080}`, so that defer stays in the backlog,
      as `case-schema.md` sets it. `check_backlog` of `.guppi/guppi/casecheck.py` judges only the open
      Frontier lines whose source is `backlog`, read by `open_backlog_lines`, and the line of this item
      has the source `person`. A Grep for `guppi style` over `{vault/wiki/rules,.claude}/**` printed `carry/SKILL.md`,
      `handoff/SKILL.md`, `retro/SKILL.md` and `work/SKILL.md` under `.claude/skills/`, and `rule-agent-writing`,
      `rule-carry-over`, `rule-claude-md`, `rule-estimates-schema`, `rule-github-repository`, `rule-guppi-config`,
      `rule-handoff`, `rule-retro` and `rule-work-mode` under `vault/wiki/rules/`. Only the line in `work/SKILL.md`
      and its Render in `rule-work-mode` state the step before a stop. The other hits set the check at
      a commit, at Retro, in the handoff, or as the key of `guppi.toml`, and the change makes none of
      them false. A Grep of `.guppi/tests/` for `skills/work/SKILL\.md|skills" ?/ ?"work|rule-work-mode`
      printed `test_glossary.py` and `test_sprint.py`. Both write the slug into text of their own under
      a temporary folder, and none reads the live page or the skill. The ledger of this session holds
      no `error` lesson.'
    problem: '`/work` skipped the style check before a `stop:` task when it judged that the run was not
      needed, and the Estimate of that step failed.'
    recommend: "- **How the skipped style check gets fixed**\n  - Recommended: (a) say it plainly in the\
      \ skill: before each `stop:` task, every time, also when an earlier run was clean and no file changed\
      \ since then; the Estimate keeps its promise word for word and is read again at the next `/work`.\n\
      \  - Answer: agreed, (a)."
    given: '`rule-work-mode`: the rule of Work Mode, whose Render is the skill `/work`.

      **＋** `.claude/skills/work/SKILL.md`: the skill `/work`, rendered from `rule-work-mode`.

      **＋** `estimate-work-mode-runs-the-style-check-before-a-stop`: the check of the step, set `pending`
      with its Criterion written back.

      **＋** `vault/wiki/where-to-stop.md`: the conditions on which Work Mode stops.

      **＋** `raw/<date>/<hi HHMM>/handoff.md`: the handoff of the session, which takes a finding in a
      file the session did not change.'
    when: '`/work` of `.claude/skills/work/SKILL.md`, rendered from `rule-work-mode`, reaches a task of
      the Spec whose text opens with `stop:`.'
    then: 'Before it stops, the agent runs `uv run --project .guppi guppi style` and fixes each finding
      in a file that the session changed.

      **＋** The agent writes each finding in a file that the session did not change as a line of `raw/<date>/<hi
      HHMM>/handoff.md`.

      **＋** The agent then stops before that task as `vault/wiki/where-to-stop.md` sets it.

      **－** A task that does not open with `stop:` gets no style check from this step.'
  spec: vault/raw/2026-11-27/1402/spec.md
