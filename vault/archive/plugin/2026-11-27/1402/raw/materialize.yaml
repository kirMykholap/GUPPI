      with a code span holding `guppi sprint` becomes `- [x]`. A yaml is applied whole when each entry
      carries `applied` or `superseded_by` and none carries `failed`. Nothing else in the file changes,
      but the map at the head of an approved document that holds one, which `rule-spec-write` rebuilds.

      **－** A line where `guppi sprint` sits in a later code span, such as a `read` line or a description,
      is not ticked.

      **－** A line whose first code span holds `guppi sprint-close` is not ticked: `guppi sprint-close`
      ticks it.

      **－** `--check` ticks nothing, and a run that exits 1 ticks nothing.

      **－** A unit without a yaml, with an entry not applied, with a `failed` entry, or marked by `carry.md`,
      is not touched.'
