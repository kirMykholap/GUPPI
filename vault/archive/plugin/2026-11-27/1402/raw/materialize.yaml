  case_text:
    context: 'The plan file that Claude Code shows at the exit of Plan Mode opens with a map of its Cases.
      The `Stop` hook of `rule-spec-write` rebuilds that map from the Cases at each run that writes, places
      or removes one (case 1078.1). Each task stands there as a plain line with a sign: ✅ for a ticked
      line, ⛔ for an open stop, 🔍 for an open check. After the approval, Work Mode ticks the task lines
      of `spec.md`, and no tick reaches either map. The hook rebuilds only the map of the plan file, from
      the Cases of the plan, whose task lines nobody ticks. The copy of the map that `guppi spec` puts
      into `spec.md` at the approval stays as it was. At the preview of the map in session 0947, the person
      asked for real checkboxes that the ticks follow into.


      The person chose these answers. Both maps follow the ticks, and the plan file is the main view (Q1
      c). A hook that runs after each edit of `spec.md` rebuilds them at once (Q2 b). The box takes the
      place of ✅, with ⛔ and 🔍 after an open box (Q3 a). The scripts of the librarian''s run rebuild the
      maps of each `spec.md` they tick, and the plan file stays as Work Mode left it (Q4 a). The boxes
      as VS Code shows the plan file get a check of their own (Q5 b). Four promises can fail apart, so
      the Case has four sub-cases for them: the boxes of the map of the plan file (1085.1), the maps of
      `spec.md` and the hook after an edit (1085.2), the maps after a tick of the scripts (1085.3), and
      the boxes as VS Code shows them (1085.4). The Criteria of `estimate-generate-ticks-the-spec`, `estimate-render-harness-ticks-the-spec`,
      `estimate-sprint-ticks-the-spec` and `estimate-glossary-ticks-the-spec` each say "Nothing else in
      the file changes", which 1085.3 makes false. A Grep `Nothing else in the file changes|nothing else
      changes`, case aside, over `vault/wiki` printed those four files. Each Estimate checks the promise
      of another rule, so each gets a sub-case of its own (1085.5 to 1085.8). Each sub-case writes its
      Criterion back word for word, but for that sentence, which now leaves out the map at the head of
      an approved document. Their methods stand, but for the colon that 1085.7 adds. The open fact of
      the tool, on which the answer to Q2 rests, gets a one-off check in 1085.9. The pre-spec findings
      on this Case are fixed here: the update of `rule-spec-capture` and the task on the docstring of
      `.guppi/guppi/spec.py` in 1085.1, the sentence on `ITEM_LINE`, the readings of `estimate-brief-written`
      and `estimate-documentation-completes`, and 1085.9.


      Choices of form. The one `replace` pair on `rule-spec-write` stands in 1085.1 and describes the
      map, the hook after an edit and the scripts, since 1085.2 and 1085.3 would need anchors in the same
      sentence. A box of the map of the plan file is the box of the task line with the same text in the
      sections of the same Case in `spec.md`. That is the judgment of `keep_boxes` of `.guppi/guppi/ratified.py`,
      so the map takes the box from there and holds no second copy. A document of `spec.md` that holds
      no map gets none, so the `spec.md` files from before the map, which the scripts of the librarian
      also tick, keep their text. The new hook is the mode `--boxes` of the same command, as `--guard`
      and `--map` are. Its entry stands in `rule-hook-registry` apart from the entry of `guppi codewrite`,
      since `without_code_write` of `.guppi/guppi/ship.py` removes that entry from the clean version by
      its exact text, `CODE_WRITE_ENTRY`. The new tests take the keyword `spec_map`. A Grep `def test_\w*(map|boxes)\w*`
      over `.guppi/tests` printed `test_agents.py`, `test_generate.py`, `test_materialize.py`, `test_orchestration.py`
      and `test_ratified.py`, and in `test_generate.py` the keyword `map` would also select `test_a_replace_mapping_fails_that_entry_alone`.
      A Grep `spec_map|plan_map|boxes_hook|def test_\w*boxes` over `.guppi/tests` printed nothing.


      The boxes and their readers. A Grep `"- \[|''- \[|\[ \]"|\[x\]"` over `.guppi/guppi` printed `generate.py`,
      `prespec.py`, `ratified.py`, `render.py`, `sprint.py` and `sprint_close.py`. I read `tick_read`
      and `tick_spec` of `generate.py`, `command_line` and `tick_command_lines` of `render.py` and `tick`
      of `sprint_close.py`. Each one ticks only a line that opens with `- [ ]` at its first character.
      `tick_read` and the tickers by command take such a line anywhere in `spec.md`, outside the sections
      of the Cases too. `TASK_LINE` of `ratified.py`, `STOP_LINE` of `prespec.py` and `READ_LINE` of `generate.py`
      all open with `^- \[`. `ITEM_LINE` of `ratified.py` opens with `^(create|update|delete|defer)`,
      and `read_tasks` and `map_tasks` match it only on the text after the box of a line that `TASK_LINE`
      matched first. So each box of the map stands indented under the entry of its Case, where no script
      takes it for a task. Retro sorts "the unticked boxes of the `tasks` of the Spec", as `.claude/skills/retro/SKILL.md`
      writes it, and the map stands outside every block tagged `tasks`. So `rule-retro` stands, and so
      does `rule-handoff`, whose `## Debt` takes the boxes that Retro sorts. `.claude/agents/librarian-guppi.md`
      reads `spec.md` only for "its unticked `- [ ]` lines" and takes "the unticked boxes of the Specs"
      under `Work`. Those sentences stand: the line that opens each map says that its boxes copy the task
      lines below and are no tasks, and with 1085.3 each box of a map equals its task line when the librarian
      reads the file after its scripts. `.claude/skills/work/SKILL.md` tells the agent to tick each box
      of code, a test, a migration or a `by hand` check in `spec.md`. The agent runs the tasks of each
      Case in order and ticks the line it finished, and the hook after that edit sets back a box ticked
      in the map alone. So `rule-work-mode` stands, and this Case leaves alone the sentence that Case
      1084 changes there. The text of a line of code also stands in its map line, so an edit that names
      only that text names two lines, and the agent then names the line by more of its text.


      The hook after an edit. On `PostToolUse` of `Edit`, `Write` and `MultiEdit`, `.claude/settings.json`
      runs `guppi codewrite` of `rule-clean-branch`, which reads only files under `.guppi/`, and, for
      every tool, `guppi event tool`. The new hook writes the plan file with no tool call, as the `Stop`
      hook does, so it writes no event line. The Claude Code page on hooks, https://code.claude.com/docs/en/hooks,
      gives `tool_input.file_path` of `Write` and `Edit` as an absolute path, with backslashes on Windows.
      It says that a `PostToolUse` hook matching `Edit|Write` does not run when a `Bash` command rewrites
      the file, so the scripts of the librarian, which run by `Bash`, need 1085.3. The page does not say
      whether Claude Code asks for a new Read before the next edit of a file that a hook changed. That
      fact is open: the answer of the person to Q2 rests on it, and no page I read settles it. So 1085.9
      reads it in the Work Mode of this session, by a one-off Estimate of `entity-sprint-plugin` with
      `once: true`, since it checks one fact of a tool once. A command rewrites a file between two `Edit`
      calls of the agent, and the reading takes what the second `Edit` gives back. Where that `Edit` is
      refused, each tick of Work Mode after a rebuild of the map costs a new `Read`, and the failed reading
      shows that cost before the librarian''s render registers the hook. The page on the VS Code extension,
      https://code.claude.com/docs/en/vs-code, says only that the plan opens "as a full Markdown document".
      The page on the Markdown preview of VS Code, https://code.visualstudio.com/docs/languages/markdown,
      does not mention task lists. So 1085.4 reads the boxes by the person''s answer. Obsidian''s page
      on syntax, https://obsidian.md/help/syntax, says "You can toggle a task in Reading view by selecting
      the checkbox", and that a nested task list is made by indenting. A Grep `def is_\w+\(|"spec\.md"`
      over `.guppi/guppi` printed 21 files and no function that judges a path as the `spec.md` of a session
      folder. So the hook judges the path by `DAY` and `SESSION` of `generate.py`, imported, as `is_case_file`
      of `casecheck.py` judges the path of a case file. A Grep `guppi ratified --guard` in the mode that
      prints paths, glob `{vault/wiki,.claude,.guppi/guppi}/**`, printed 9 files: `.claude/settings.json`
      and `rule-hook-registry`, which this Case changes; `ratified.py`, whose docstring and parser the
      task changes; `ledger.py`, `casecheck.py`, `estimate-spec-reconcile-refuses-a-case-file-another-agent-holds`,
      `estimate-spec-reconcile-refuses-an-edit-of-the-plan` and `estimate-spec-write-exits-2-on-an-error`,
      which speak of the guard alone; and `log.md`. A Grep `guppi codewrite` in the same mode printed
      11 files: `.claude/settings.json` and `rule-hook-registry`, which this Case changes; `ship.py`,
      whose `CODE_WRITE_ENTRY` keeps its exact text; `cli.py` and `ledger.py`, whose docstrings speak
      of that hook alone; `codewrite.py`; `rule-clean-branch`, `estimate-clean-branch-ships-no-code-write-hook`,
      `estimate-clean-branch-names-a-pointer-at-the-write` and `insight-ship-live-code-writes-a-case-number-outside-a-bracket`,
      which speak of that hook alone; and `log.md`. None of them lists the hooks of `PostToolUse` but
      the two files this Case changes. A Grep `settings\.json|rule-hook-registry` over `.guppi/tests`
      printed 5 files. Of the tests in those files, only the tests of `test_guppi_package.py` and `test_ship.py`
      read the live file. `settings_commands` of `test_guppi_package.py` reads each command. Its tests
      ask that a hook with a `COMMAND` stands in the settings, and that every command runs by the project
      folder, and the new command keeps that form. `test_ship.py` ships the live repository, and the entry
      of `guppi codewrite` keeps its text.


      The vault''s answer. The Criterion of `estimate-spec-write-writes-the-map` speaks of ✅ and says
      that no line of the map opens with a box, so 1085.1 replaces it whole with its `purpose`, and keeps
      its `method`. `estimate-spec-write-shows-the-map-in-the-plan-view` stands. It is read at the exit
      of this session, on the map as it stands then, with no boxes, as the person chose (Q5 b), and its
      line on the signs before the lines they mark stays true after the change. `estimate-spec-write-reaches-the-approved-spec`
      stands: its Criterion names no map, and the test that places a Case after the map changes only its
      last assertion. By their `purpose` lines, the other Estimates of `rule-spec-write` speak of the
      copy, the check, the defers and the refusals of the hook. `estimate-hook-registry-rendered` stands,
      since it promises only that `.claude/settings.json` equals the Render. The Purpose of `rule-spec-capture`
      says that `spec.md` has three writers: `guppi spec`, the `Stop` hook of `rule-spec-write` with what
      it writes there, and Work Mode, which ticks the boxes. The hook after an edit, the new write of
      the `Stop` hook and the scripts of the librarian would make that list false. So 1085.1 adds a sentence
      after it that names them and what they write. The docstring of `.guppi/guppi/spec.py` holds the
      same list, so a task of 1085.1 changes it too. An `update` of a Purpose touches no Estimate. `estimate-spec-capture-appends`
      says only that `guppi spec` changes nothing that stands in the file, and that stays true. `estimate-brief-written`
      has `Work` take "the unticked boxes of the Specs but the `read` box of such a reading". It stands:
      a box of a map is no task line, the line that opens the map says so, and with 1085.3 each box of
      a map equals its task line when the librarian reads `spec.md`, so the brief lists no task twice.
      `estimate-documentation-completes` flags a read of `spec.md` beyond its unticked lines and the lines
      the run ticked. It stands: a map line is either an unticked line or a line that the run''s scripts
      ticked when they rebuilt the map, so a read of it is no read beyond those lines. A Grep `(?i)\bthe
      map\b|map of the Cases|--map` in the mode that prints paths, glob `{vault/wiki,.claude,.guppi/guppi}/**`,
      printed 9 files: `brief.md` and `log.md`, not read; `rule-spec-write`, the two Estimates and `ratified.py`,
      which this Case changes or reads; and `rule-case-protocol`, `entity-glossary` and `rule-claude-md`,
      whose hits are History lines on another map. The Frontier line of this item has the source `brief`.
      `rule-spec-write` carries `deferred_by` of `decision-case-1081`, and this Case does not take that
      defer up, so it carries no `{supersedes:case 1081}` and the defer stays in the backlog. A Glob `vault/**/*{rebuilds-the-maps,follows-the-ticks,shows-the-boxes,edit-takes-a-file}*`
      printed nothing, so the four new slugs are free. The ledger of the session holds no `error` lesson.


      The notes of the check of this file. Three lines of the old Criterion of `estimate-spec-write-writes-the-map`
      are not carried word for word, on purpose. The line on the entries now puts a box before each task
      line in place of ✅. The line on `--map` now says that the mode takes its boxes in the same way.
      The `－` line now says "starts with a box at its first character", since each box stands indented.
      The check listed further files that name `rule-spec-write`, `ratified.py`, `guppi ratified`, `test_ratified.py`,
      `.claude/settings.json`, `rule-hook-registry`, `generate.py`, `guppi generate`, `render.py`, `guppi
      render`, `sprint_close.py`, `guppi sprint-close` and `test_render.py`, and I judged them by their
      purpose lines. `rule-materialize` lets the librarian read the Spec "beyond its unticked lines" no
      further, and it stands for the same reason as `librarian-guppi.md`. `rule-brief` holds the same
      two sentences that `librarian-guppi.md` holds, and they stand. `rule-page-generation`, `rule-render-harness`
      and `rule-glossary` say that their scripts tick a line, and that stays true. Their Estimates are
      1085.5 to 1085.8. `estimate-sprint-close-runs-in-the-librarian-run` says that the close line stands
      ticked and that a run that refuses ticks nothing, and both stay true. `rule-spec-reconcile` and
      `estimate-spec-reconcile-refuses-an-edit-of-the-plan` refuse the agent''s edits of the plan file,
      and the new hook writes the plan file with no tool call, so they stand. `lesson-hooks-matching-hooks-of-one-event-run-in-parallel`
      stands. The new hook runs beside `guppi codewrite` and `guppi event tool`, and the three share no
      file. `lesson-hooks-relative-project-path-fails-after-a-cd` stands, since the new command names
      the project by `${CLAUDE_PROJECT_DIR}`. `lesson-hooks-guard-broken-mid-edit-of-its-own-contract`
      warns that the guard of `ratified.py` runs from the working tree while Work Mode edits that module.
      That holds for this Case as for any change of the module, and the new registration lands only at
      the librarian''s render. `estimate-one-judgment-one-implementation-followed` and `estimate-clean-branch-code-holds-pointers-only-in-brackets`
      stand: the tasks import `keep_boxes`, `DAY` and `SESSION`, and they put each pointer in a bracket.
      `estimate-settings` and `rule-settings` stand, since the settings file still parses and is rendered
      whole. The other files speak of other steps of the hooks, of the Cases, of the guards, of the install
      and of the sprint, and none of them speaks of the map or of the boxes of `spec.md`. In 1085.5 to
      1085.8, the first line of each `then` is not carried word for word, on purpose: its sentence "Nothing
      else in the file changes" now leaves out the map. The `then` lines of 1085.5 to 1085.8 share words
      with each other and with 1085.2, but they are the Criteria of four scripts of four rules, and each
      sub-case only writes back its own Criterion. So no promise stands in two wordings. The `method`
      of `estimate-sprint-ticks-the-spec` read "by hand, after a librarian''s run," with no colon after
      the event, which the check takes for a reading of another session. 1085.7 sets it again with the
      colon, as `estimate-render-harness-ticks-the-spec` writes its own method, so the reading waits for
      the librarian''s run as an event. `rule-sprint` says that `guppi sprint` ticks its lines, and that
      stays true. `estimate-sprint-marks-a-closed-sprint` speaks of `sprint.md` with no live sprint page.
      `test_sprint.py` and `test_glossary.py` tick a `spec.md` with no map, which keeps its text, so their
      tests stand. The check also listed the files that name `rule-spec-capture`. `rule-spec-box`, `.claude/skills/box/SKILL.md`
      and `.guppi/guppi/box.py` run a conserved Spec. The hook after an edit rebuilds the maps of that
      `spec.md` too, since its folder is a session folder, and `conserved_spec_named` of `box.py` reads
      only the first line that opens with `# `, which no map holds, so they stand. `estimate-spec-capture-offers-the-fork`,
      `rule-skill-approve-spec` and `.claude/skills/approve-spec/SKILL.md` speak of the fork and of the
      typed approval, which do not change. `.guppi/tests/test_spec.py` tests `guppi spec`, whose code
      this Case leaves as it is, but for its docstring. `estimate-plan-mode-verified`, `estimate-spec-box-runs-a-conserved-spec`,
      `estimate-orchestration-asks-in-the-grill-me-shape`, `estimate-orchestration-puts-the-harness-before-plan-mode`
      and `insight-frontier-line-closed-by-the-case-built-on-its-item` speak of other steps of Plan Mode
      and of `/box`, and none of them names the writers of `spec.md`.'
    problem: The map of the plan shows each task with a sign and no box, and no tick of Work Mode or of
      the librarian's run reaches the map of the plan file or the copy in `spec.md`, so the person cannot
      follow the progress of the Spec on the map.
    recommend: "- **Where the map with live boxes stands after the approval**\n  - Recommended: (b) `spec.md`\
      \ only, its maps rebuilt from its Cases, the map of the plan file kept as approved.\n  - Answer:\
      \ (c) both; the main idea is to see the boxes in the plan file.\n- **When a box of the map follows\
      \ a tick**\n  - Recommended: (b) at once after each edit of `spec.md`, by a new hook that runs after\
      \ the edit.\n  - Answer: agreed, (b).\n- **How a line of the map shows its box**\n  - Recommended:\
      \ (a) the box takes the place of ✅, with ⛔ and \U0001F50D after an open box.\n  - Answer: agreed,\
      \ (a).\n- **Whether the librarian's ticks reach the maps**\n  - Recommended: (a) the scripts rebuild\
      \ the map of each `spec.md` they tick; the plan file keeps the boxes as Work Mode left them.\n \
      \ - Answer: agreed, (a).\n- **How the boxes in the plan file are checked as you see them**\n  -\
      \ Recommended: (b) keep the open check of the plan view, and add a new check for the boxes, read\
      \ by the person's answer in the next session.\n  - Answer: agreed, (b)."
