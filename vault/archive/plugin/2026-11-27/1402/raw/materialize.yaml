- case: '1085.9'
  decision: decision-case-1085.9
  origin: raw/2026-11-27/1402/ledger.md#case-1085.9
  targets:
  - kind: create
    category: estimates
    slug: estimate-sprint-plugin-edit-takes-a-file-a-hook-changed
    ref: entity-sprint-plugin
  tags:
  - hooks
  - harness
  case_text:
    given: '`estimate-sprint-plugin-edit-takes-a-file-a-hook-changed`: the new one-off check of the fact
      of the tool.

      **＋** `entity-sprint-plugin`: the live sprint page, which the one-off check targets.

      **＋** `Edit`: the tool of Claude Code by which Work Mode ticks a box of `spec.md`.

      **＋** `rule-spec-write`: the rule whose hook after an edit rewrites `spec.md` between two edits.'
    when: In Work Mode, the agent changes a scratch file outside the repository by `Edit`, a command outside
      the tool then rewrites one line of that file, and the agent changes another line of the file by
      `Edit` with no `Read` between.
    then: 'Claude Code runs the second `Edit` and writes its change.

      **－** Claude Code does not ask for a new `Read` of the file before that `Edit`.'
    context: 'The plan file that Claude Code shows at the exit of Plan Mode opens with a map of its Cases.
      The `Stop` hook of `rule-spec-write` rebuilds that map from the Cases at each run that writes, places
      or removes one (case 1078.1). Each task stands there as a plain line with a sign: ✅ for a ticked
      line, ⛔ for an open stop, 🔍 for an open check. After the approval, Work Mode ticks the task lines
      of `spec.md`, and no tick reaches either map. The hook rebuilds only the map of the plan file, from
      the Cases of the plan, whose task lines nobody ticks. The copy of the map that `guppi spec` puts
      into `spec.md` at the approval stays as it was. At the preview of the map in session 0947, the person
      asked for real checkboxes that the ticks follow into.


      The person chose these answers. Both maps follow the ticks, and the plan file is the main view (Q1
      c). A hook that runs after each edit of `spec.md` rebuilds them at once (Q2 b). The box takes the
      place of ✅, with ⛔ and 🔍 after an open box (Q3 a). The scripts of the librarian''s run rebuild the
      maps of each `spec.md` they tick, and the plan file stays as Work Mode left it (Q4 a). The boxes
      as VS Code shows the plan file get a check of their own (Q5 b). Four promises can fail apart, so
      the Case has four sub-cases for them: the boxes of the map of the plan file (1085.1), the maps of
      `spec.md` and the hook after an edit (1085.2), the maps after a tick of the scripts (1085.3), and
      the boxes as VS Code shows them (1085.4). The Criteria of `estimate-generate-ticks-the-spec`, `estimate-render-harness-ticks-the-spec`,
      `estimate-sprint-ticks-the-spec` and `estimate-glossary-ticks-the-spec` each say "Nothing else in
      the file changes", which 1085.3 makes false. A Grep `Nothing else in the file changes|nothing else
      changes`, case aside, over `vault/wiki` printed those four files. Each Estimate checks the promise
      of another rule, so each gets a sub-case of its own (1085.5 to 1085.8). Each sub-case writes its
