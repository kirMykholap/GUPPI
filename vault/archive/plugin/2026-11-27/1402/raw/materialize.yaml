    slug: estimate-spec-write-writes-the-map
    ref: rule-spec-write
  - kind: update
    category: rules
    slug: rule-spec-capture
    ref: rule-spec-capture
  tags: []
  case_text:
    given: '`rule-spec-write`: the rule of the `Stop` hook that writes the plan file and its map.

      **＋** `.guppi/guppi/ratified.py`: the hook, whose map takes the boxes.

      **＋** `.guppi/tests/test_ratified.py`: the tests of the hook.

      **＋** `raw/<date>/<hi HHMM>/spec.md`: the approved Spec, whose task lines give the boxes.

      **＋** `.guppi/guppi/materialize.py`: `split_cases`, the reader of the Cases of the plan and of `spec.md`.

      **＋** `estimate-spec-write-writes-the-map`: its Criterion is replaced whole.

      **＋** `rule-spec-capture`: the rule that names the writers of `spec.md`, which takes the new ones.

      **＋** `.guppi/guppi/spec.py`: the hook of `rule-spec-capture`, whose docstring names the same writers.'
    when: 'The `Stop` hook `uv run --project .guppi guppi ratified` of `.guppi/guppi/ratified.py` writes,
      places or removes a Case in the plan file of the session.

      **＋** Or `uv run --project .guppi guppi ratified --map <file> --session <stamp>` runs on a file
      that holds Cases.'
    then: 'Right under its title line, the plan file holds a map of the Cases it holds, rebuilt from them
      at each such run.

      **＋** The map opens with a table of one row per top-level Case: its id, its name, and the number
      of open `stop:` lines and of open `read` lines of the Case and its sub-cases.

      **＋** A Mermaid diagram follows, with one node per Case and sub-case in the order of the plan, an
      edge from each top-level Case to the next and from a parent to each of its sub-cases, and ⛔ on the
      node of a Case that holds an open `stop:` line.

      **＋** Then each Case and sub-case has an entry: 🧩 with its id, its name and the path of its case
      file, and under it, indented, each line of its `tasks` block without its sub-points after a box:
      `[x]` for a ticked line, `[ ] ⛔` for an open `stop:` line, `[ ] 🔍` for an open `read` line, and
      `[ ]` for any other open line.

      **＋** Once `raw/<date>/<hi HHMM>/spec.md` stands, each box of the map is the box of the task line
      with the same text in the same Case in `spec.md`.

      **＋** A `create`, `update`, `delete` or `defer` line carries the `purpose`, the `change` or the
      `impact` of its item, and a `read` line carries the `purpose` of the `create` of the same Estimate
      in the Case.

      **＋** The Cases under `## Deferred` stand in the map by id and name.

      **＋** `--map` prints the same map of the Cases of `<file>`, its boxes taken in the same way, reads
      no payload and writes no file.

      **－** No line of the map starts with a box at its first character, with a Case heading or with `#
      `, and no line of it is `## Deferred`, so `split_cases` of `.guppi/guppi/materialize.py`, the tickers
      and `place` of `.guppi/guppi/ratified.py` read the plan file and `spec.md` as before, and a Case
      placed after the approval goes before the `## Deferred` of its document, never into the map.

      **－** A box ticked in the map alone ticks no task, and the next rebuild writes it back from its
      task line.'
    context: 'The plan file that Claude Code shows at the exit of Plan Mode opens with a map of its Cases.
      The `Stop` hook of `rule-spec-write` rebuilds that map from the Cases at each run that writes, places
      or removes one (case 1078.1). Each task stands there as a plain line with a sign: ✅ for a ticked
      line, ⛔ for an open stop, 🔍 for an open check. After the approval, Work Mode ticks the task lines
      of `spec.md`, and no tick reaches either map. The hook rebuilds only the map of the plan file, from
      the Cases of the plan, whose task lines nobody ticks. The copy of the map that `guppi spec` puts
      into `spec.md` at the approval stays as it was. At the preview of the map in session 0947, the person
      asked for real checkboxes that the ticks follow into.


      The person chose these answers. Both maps follow the ticks, and the plan file is the main view (Q1
      c). A hook that runs after each edit of `spec.md` rebuilds them at once (Q2 b). The box takes the
      place of ✅, with ⛔ and 🔍 after an open box (Q3 a). The scripts of the librarian''s run rebuild the
      maps of each `spec.md` they tick, and the plan file stays as Work Mode left it (Q4 a). The boxes
      as VS Code shows the plan file get a check of their own (Q5 b). Four promises can fail apart, so
      the Case has four sub-cases for them: the boxes of the map of the plan file (1085.1), the maps of
      `spec.md` and the hook after an edit (1085.2), the maps after a tick of the scripts (1085.3), and
      the boxes as VS Code shows them (1085.4). The Criteria of `estimate-generate-ticks-the-spec`, `estimate-render-harness-ticks-the-spec`,
      `estimate-sprint-ticks-the-spec` and `estimate-glossary-ticks-the-spec` each say "Nothing else in
      the file changes", which 1085.3 makes false. A Grep `Nothing else in the file changes|nothing else
      changes`, case aside, over `vault/wiki` printed those four files. Each Estimate checks the promise
