- case: '1085.4'
  decision: decision-case-1085.4
  origin: raw/2026-11-27/1402/ledger.md#case-1085.4
  targets:
  - kind: create
    category: estimates
    slug: estimate-spec-write-shows-the-boxes-in-the-plan-file
    ref: rule-spec-write
  tags:
  - hooks
  - harness
  - workflow
  case_text:
    given: '`rule-spec-write`: the rule whose page holds the new check.

      **＋** `ExitPlanMode`: the tool of Claude Code that shows the plan file for approval; this Case reads
      the plan file in the VS Code extension.

      **＋** `raw/<date>/<hi HHMM>/spec.md`: the approved Spec, whose ticks reach the plan file.

      **＋** `estimate-spec-write-shows-the-boxes-in-the-plan-file`: the new check of the boxes as the
      person sees them.'
    when: 'The VS Code extension of Claude Code shows the plan file at `ExitPlanMode`, after the `Stop`
      hook of `rule-spec-write` wrote its map with boxes.

      **＋** Then, in Work Mode of the same session, the agent ticks a task line of `raw/<date>/<hi HHMM>/spec.md`,
      and the person looks at the plan file in VS Code.'
    then: 'The boxes of the map stand drawn as checkboxes.

      **＋** After the tick, the plan file in VS Code shows the box of that line ticked.

      **＋** The person says that the boxes show the progress of the plan in the way they want.'
    context: 'The plan file that Claude Code shows at the exit of Plan Mode opens with a map of its Cases.
      The `Stop` hook of `rule-spec-write` rebuilds that map from the Cases at each run that writes, places
      or removes one (case 1078.1). Each task stands there as a plain line with a sign: ✅ for a ticked
      line, ⛔ for an open stop, 🔍 for an open check. After the approval, Work Mode ticks the task lines
      of `spec.md`, and no tick reaches either map. The hook rebuilds only the map of the plan file, from
      the Cases of the plan, whose task lines nobody ticks. The copy of the map that `guppi spec` puts
      into `spec.md` at the approval stays as it was. At the preview of the map in session 0947, the person
      asked for real checkboxes that the ticks follow into.


      The person chose these answers. Both maps follow the ticks, and the plan file is the main view (Q1
      c). A hook that runs after each edit of `spec.md` rebuilds them at once (Q2 b). The box takes the
      place of ✅, with ⛔ and 🔍 after an open box (Q3 a). The scripts of the librarian''s run rebuild the
      maps of each `spec.md` they tick, and the plan file stays as Work Mode left it (Q4 a). The boxes
      as VS Code shows the plan file get a check of their own (Q5 b). Four promises can fail apart, so
      the Case has four sub-cases for them: the boxes of the map of the plan file (1085.1), the maps of
      `spec.md` and the hook after an edit (1085.2), the maps after a tick of the scripts (1085.3), and
      the boxes as VS Code shows them (1085.4). The Criteria of `estimate-generate-ticks-the-spec`, `estimate-render-harness-ticks-the-spec`,
      `estimate-sprint-ticks-the-spec` and `estimate-glossary-ticks-the-spec` each say "Nothing else in
      the file changes", which 1085.3 makes false. A Grep `Nothing else in the file changes|nothing else
      changes`, case aside, over `vault/wiki` printed those four files. Each Estimate checks the promise
      of another rule, so each gets a sub-case of its own (1085.5 to 1085.8). Each sub-case writes its
      Criterion back word for word, but for that sentence, which now leaves out the map at the head of
      an approved document. Their methods stand, but for the colon that 1085.7 adds. The open fact of
      the tool, on which the answer to Q2 rests, gets a one-off check in 1085.9. The pre-spec findings
      on this Case are fixed here: the update of `rule-spec-capture` and the task on the docstring of
      `.guppi/guppi/spec.py` in 1085.1, the sentence on `ITEM_LINE`, the readings of `estimate-brief-written`
      and `estimate-documentation-completes`, and 1085.9.


      Choices of form. The one `replace` pair on `rule-spec-write` stands in 1085.1 and describes the
      map, the hook after an edit and the scripts, since 1085.2 and 1085.3 would need anchors in the same
      sentence. A box of the map of the plan file is the box of the task line with the same text in the
      sections of the same Case in `spec.md`. That is the judgment of `keep_boxes` of `.guppi/guppi/ratified.py`,
      so the map takes the box from there and holds no second copy. A document of `spec.md` that holds
      no map gets none, so the `spec.md` files from before the map, which the scripts of the librarian
      also tick, keep their text. The new hook is the mode `--boxes` of the same command, as `--guard`
      and `--map` are. Its entry stands in `rule-hook-registry` apart from the entry of `guppi codewrite`,
      since `without_code_write` of `.guppi/guppi/ship.py` removes that entry from the clean version by
      its exact text, `CODE_WRITE_ENTRY`. The new tests take the keyword `spec_map`. A Grep `def test_\w*(map|boxes)\w*`
      over `.guppi/tests` printed `test_agents.py`, `test_generate.py`, `test_materialize.py`, `test_orchestration.py`
      and `test_ratified.py`, and in `test_generate.py` the keyword `map` would also select `test_a_replace_mapping_fails_that_entry_alone`.
      A Grep `spec_map|plan_map|boxes_hook|def test_\w*boxes` over `.guppi/tests` printed nothing.


      The boxes and their readers. A Grep `"- \[|''- \[|\[ \]"|\[x\]"` over `.guppi/guppi` printed `generate.py`,
      `prespec.py`, `ratified.py`, `render.py`, `sprint.py` and `sprint_close.py`. I read `tick_read`
      and `tick_spec` of `generate.py`, `command_line` and `tick_command_lines` of `render.py` and `tick`
      of `sprint_close.py`. Each one ticks only a line that opens with `- [ ]` at its first character.
      `tick_read` and the tickers by command take such a line anywhere in `spec.md`, outside the sections
      of the Cases too. `TASK_LINE` of `ratified.py`, `STOP_LINE` of `prespec.py` and `READ_LINE` of `generate.py`
      all open with `^- \[`. `ITEM_LINE` of `ratified.py` opens with `^(create|update|delete|defer)`,
      and `read_tasks` and `map_tasks` match it only on the text after the box of a line that `TASK_LINE`
      matched first. So each box of the map stands indented under the entry of its Case, where no script
      takes it for a task. Retro sorts "the unticked boxes of the `tasks` of the Spec", as `.claude/skills/retro/SKILL.md`
      writes it, and the map stands outside every block tagged `tasks`. So `rule-retro` stands, and so
      does `rule-handoff`, whose `## Debt` takes the boxes that Retro sorts. `.claude/agents/librarian-guppi.md`
      reads `spec.md` only for "its unticked `- [ ]` lines" and takes "the unticked boxes of the Specs"
      under `Work`. Those sentences stand: the line that opens each map says that its boxes copy the task
      lines below and are no tasks, and with 1085.3 each box of a map equals its task line when the librarian
      reads the file after its scripts. `.claude/skills/work/SKILL.md` tells the agent to tick each box
