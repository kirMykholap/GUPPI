      carries `applied` or `superseded_by` and none carries `failed`. Nothing else in the file changes,
      but the map at the head of an approved document that holds one, which `rule-spec-write` rebuilds.

      **＋** The form of the line in `vault/wiki/case-schema.md` is `` - [ ] `uv run --project .guppi guppi
      glossary` ``, the command in the first code span.

      **－** A line that names `guppi glossary` only in a later code span, such as a `read` line, is not
      ticked.

      **－** `--check` ticks nothing, and a run that exits 1 ticks nothing.

      **－** A unit whose yaml is not applied whole is not touched.'
