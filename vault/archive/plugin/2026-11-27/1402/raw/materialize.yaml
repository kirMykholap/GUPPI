- case: '1086'
  decision: decision-case-1086
  origin: raw/2026-11-27/1402/ledger.md#case-1086
  targets:
  - kind: create
    category: estimates
    slug: estimate-sprint-plugin-first-sketch-picture-is-small
    ref: entity-sprint-plugin
  tags:
  - readme
  - github
  case_text:
    context: 'This Case replaces Case 1082 whole, in Work Mode, before any of its tasks ran. Case 1082
      set that `plugin/assets/GUPPI.png` is a PNG from 800 to 1200 pixels wide and under 500 000 bytes,
      and that the person puts a smaller export of the Excalidraw board at that path. The person''s export
      now stands there. Its size is over the bound of 500 000 bytes. I could not measure the file with
      the tools of this build, so this Case states no figure of its size. The person chose to keep the
      picture as it stands and to raise the bound on the size to 1 000 000 bytes, since a picture under
      1 MB already gives the page nearly all the gain over the full picture of about 6 MB that the handoff
      of session 0947 reports. Everything else of Case 1082 stands: the width bound of 800 to 1200 pixels,
      the check of the PNG signature, `README.md` unchanged, and the plugin untouched, since `rule-clean-branch`
      says that `guppi ship` writes no file of `plugin/assets/` and `estimate-clean-branch-leaves-out-the-source-pictures`
      checks that. The `stop:` task of Case 1082 waited for the person''s export; that work stands, so
      this Case drops the task, a choice of form.


      The vault''s answer stays as Case 1082 found it. Its Grep `GUPPI\.png` over `vault/wiki/` found
      pages that name the picture by its path or role, and each stays true, since the path and the role
      do not change. `estimate-guppi-repository-readme-shows-the-first-sketch` gets no `update`: ledger
      line 2 of this session read it `passed` by the person''s answer on the section, and at `/pre-spec`
      the person chose to leave that reading. The new one-off Estimate on `entity-sprint-plugin`, with
      `once: true`, is the Estimate of Case 1082 with the size bound of its `purpose` set to 1 000 000
      bytes; the librarian has not built it yet, so this Case creates it under the same slug and the mark
      retires the line of Case 1082. Its `method` is the command of Case 1082, unchanged. The ledger of
      the session holds no `error` lesson, so this Case closes none.'
    problem: The export the person made is a PNG of the right width but over the size bound of Case 1082,
      and the person judges it small enough.
    recommend: "- **The size bound of the picture**\n  - Recommended: (b) raise the bound to 1 000 000\
      \ bytes and keep the picture as it stands, since under 1 MB the page already gets nearly all the\
      \ gain over about 6 MB.\n  - Answer: agreed, (b)."
    given: '`estimate-sprint-plugin-first-sketch-picture-is-small`: the one-off check of the size of the
      picture.

      **＋** `plugin/assets/GUPPI.png`: the picture of the first sketch, the person''s smaller export of
      the board.

      **＋** `README.md`: its section "The first sketch" shows the picture and links to it.

      **＋** `rule-clean-branch`: the clean version holds no file of `plugin/assets/`.'
    when: The person's new export of the Excalidraw board stands at `plugin/assets/GUPPI.png` in the working
      tree.
    then: '`plugin/assets/GUPPI.png` holds fewer than 1 000 000 bytes.

      **＋** `plugin/assets/GUPPI.png` is a PNG from 800 to 1200 pixels wide.

      **－** `README.md` does not change: its picture and its link keep the path `plugin/assets/GUPPI.png`.

      **－** No file of `plugin/assets/` enters the clean version that `rule-clean-branch` sets.'
