    given: '`rule-spec-write`: the rule of the hooks that write the plan file, `spec.md` and their maps.

      **＋** `.guppi/guppi/ratified.py`: the hook, which gains the maps of `spec.md` and the mode `--boxes`.

      **＋** `.guppi/tests/test_ratified.py`: the tests of the hook.

      **＋** `raw/<date>/<hi HHMM>/spec.md`: the approved Spec, whose maps follow its boxes.

      **＋** `vault/raw/<date>/<HHMM>/`: a session folder, whose `spec.md` the new hook judges.

      **＋** `rule-hook-registry`: the registrations of the hooks, which take the new one.

      **＋** `.claude/settings.json`: the file rendered from it.

      **＋** `estimate-spec-write-rebuilds-the-maps-of-the-spec`: the new check of the maps of `spec.md`.'
    when: 'The agent''s `Edit`, `Write` or `MultiEdit` of a `spec.md` in a session folder `vault/raw/<date>/<HHMM>/`
      ends, and `uv run --project .guppi guppi ratified --boxes` of `.guppi/guppi/ratified.py` runs on
      its `PostToolUse`.

      **＋** Or the `Stop` hook `uv run --project .guppi guppi ratified` writes, places or removes a Case
      or a defer in `raw/<date>/<hi HHMM>/spec.md`.'
    then: 'Each approved document of that `spec.md` that holds a map has its map rebuilt from the Cases
      and the boxes of that document, in the form of the map of the plan file.

      **＋** A document that holds no map gets none.

      **＋** The line that opens each map, in `spec.md` and in the plan file, says that each box copies
      the box of its task line below and is no task of its own.

      **＋** After an edit of the `spec.md` of the session''s own folder, `--boxes` also rebuilds the map
      of the plan file of the session, with its boxes taken from that `spec.md`.

      **＋** `--boxes` refuses no call, prints nothing on stdout and exits 0; an error gives one line on
      stderr.

      **－** `--boxes` changes no file after an edit of any other file.'
