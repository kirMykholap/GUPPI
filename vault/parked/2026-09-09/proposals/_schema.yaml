# What a page in this folder must and may carry.
#
# vault-check.sh READS THIS FILE. It is the one list: nothing restates it, and a key that
# appears in neither block below is rejected by the gate. Two lists of the same set drift,
# and this store has already lost two selftest cases to exactly that.
#
# THIS FILE ENCODES WHAT IS DECIDED, NOT WHAT IS OBSERVED. A field carried by every page
# today is not thereby required: that is how `quantity:` entered this store, around the
# admission procedure, and it took a day to remove. A field moves from `optional` to
# `required` when a decision says so, and the decision names the page it is written on.

type: proposal

# The core, decided 2026-08-16 on [[the-frontmatter-core-is-fixed-and-updated-joins-it]].
required:
  - title
  - type
  - status
  - created
  - sources
  - tags
  - sprint
  # Promoted from optional on 2026-08-19, owner's ruling: the field conflict
  # resolution rests on cannot be one a page may omit.
  # [[the-frontmatter-core-is-fixed-and-updated-joins-it]]
  - basis
  # Promoted from optional on 2026-08-21, owner's ruling, as the LAST step of the session that
  # filled the corpus - and the order is the decision, not an accident. `authority` stops being a
  # label a page may claim and becomes the index this corpus is searched by BEFORE a page is
  # opened: the librarian looks up the family a candidate belongs to and reads what is already
  # there rather than writing a fifth page about the same question. An index a page may omit is an
  # index with holes in it, and the holes are invisible - a lookup that returns nothing reads
  # exactly like a question nobody has answered.
  #
  # REQUIRED BEFORE THE BACK-FILL WOULD HAVE DEADLOCKED THE WORK. Red here turns the gate red,
  # and `lock-the-librarian.ps1` reads a red gate as a refusal to dispatch - locking out the only
  # writer permitted to clear it ([[the-librarian-lock-hook]],
  # [[a-lock-on-a-red-tree-hides-the-health-of-what-it-guards]]). So the field was legal and
  # optional while the corpus was marked, and promoted once every page carried it.
  #
  # Forbidden in `wiki/rules/`, which is not an exception to this: a rule answers with `governs:`,
  # and the two fields on one page would make the decision and the rule stating it share a slug
  # ([[authority-beside-governs-is-forbidden-on-any-page]]). The rules schema lists it in neither
  # block, so the gate already rejects it there.
  # [[authority-becomes-the-index-and-is-required-outside-rules]]
  - authority

optional:
  - updated
  - supersedes
  - superseded_by
  # THE DECISION THAT CAUSED THIS PAGE. A field of its own rather than a line in `sources:`,
  # which would then mean both what a page was compiled FROM and what CAUSED it, with no way for
  # a reader to tell which a given entry was; and rather than a link in the body, which no
  # machine can separate from a decision the page merely mentions
  # ([[decided-by-is-a-field-of-its-own-and-not-a-line-in-sources]]). It is a `[[wikilink]]`,
  # never a path, and there is exactly one: a page has one cause.
  #
  # LEGAL IN `wiki/proposals/` AND `wiki/rules/` ALONE, decided 2026-08-23 on the causal chain
  # the owner stated - a decision produces a proposal or a rule and nothing else, and anything
  # further down names what it descends from in `sources:`. This narrows the ruling of the day
  # before, which obliged the field in all six
  # ([[decided-by-is-legal-in-proposals-and-rules-and-required-in-rules]]).
  #
  # AND THE ALL-SIX ARGUMENT DOES NOT REACH A KEY, which is why the narrowing is safe rather than
  # merely permitted. That argument was transplanted from the `status:` block below, where it is
  # about legal VALUES and is correct: the `badvalue` verdict iterates the fields a folder
  # DECLARES values for, so a folder left out loses that verdict silently, in the direction of
  # passing. A KEY fails the other way - `scripts/vault-check.sh` reddens a page carrying a key
  # that appears in neither block - so a key belongs only where it is legal, and a folder left
  # out refuses rather than waves through.
  - decided_by

  # `Links:` WAS REMOVED FROM ALL SIX SCHEMAS ON 2026-08-30 and the key is legal nowhere. It was
  # admitted on 2026-08-23 to carry the body's `[[wikilinks]]` so a reader could walk the graph
  # without opening the page, filled by a script rather than by an agent. THE SCRIPT WAS NEVER
  # WRITTEN AND NO PAGE EVER CARRIED THE FIELD - zero under `wiki/` and zero under `archive/`,
  # measured the day it was removed, which is why removing the key reddens nothing.
  #
  # WHAT KILLED IT is that the graph it would have cached exists twice over already. Obsidian
  # builds its graph from the `[[wikilinks]]` in the body, so the field bought that reader nothing;
  # and an agent reads one page's outgoing links with a single grep over that one file, without
  # loading the page at all, so it bought that reader nothing either. The owner found the first
  # half by looking at his own graph. A field with no writer and no reader is a comment with a
  # colon in it ([[a-rule-with-no-instrument-behind-it-is-a-rule-a-fixture-can-violate-for-a-week]]).
  #
  # The proposal that designed the script was refused in the same change rather than left standing
  # over a field that no longer exists ([[links-is-filled-by-a-script-from-the-bodys-wikilinks]]).

# THE LEGAL VALUES OF A FIELD, decided 2026-08-19 on the owner's ruling. Until then the gate
# enforced that `basis` was PRESENT and said nothing about what it said, so `basis: banana`
# passed on the one field conflict resolution rests on. A value outside the list below is red.
#
# The list is decided on the vault's own CLAUDE.md, section `basis`, which gives each value and
# its meaning. It is NOT swept off the corpus: a field's legal values being read off the pages
# that happen to carry them is how a typo becomes law, and it is the same mistake `quantity:`
# was. Same rule as the key set above - this file encodes what is decided.
#
# A `values:` header that parses to nothing is red, for the reason the key set is: a silent
# empty list turns the check into "every value is fine", in the direction of passing.
values:
  basis:
    - human
    - code
    - measurement
    - external
    - inference

  # THE TWO STATUSES THIS STORE HAS ALWAYS HAD, plus a third this folder alone carries. Moved
  # here 2026-08-23 from `scripts/vault-check.sh`, where the pair was hardcoded in the awk pass
  # and restated in the message beside it. The gate is the reader, not the register
  # ([[the-legal-value-list-lives-in-each-folders-schema]]).
  #
  # `implemented` - the proposal was realised, the pages recording what exists carry the claim
  # now, and this page moves to `archive/`. It is NOT `deprecated`: a retired page was replaced
  # because it went false, and an implemented proposal was never false. Owner's ruling of
  # 2026-08-23, which reversed the ruling of the day before that a built proposal stays here
  # ([[an-implemented-proposal-moves-to-archive-and-the-successor-carries-its-claim]]).
  #
  # `built` IS NOT HERE YET, deliberately. The same ruling splits the old single mark in two:
  # `built` means the design is finished and ready to implement, and its test is a complete task
  # list, which needs `wiki/tasks/` - deferred to S4. A status nothing can decide is the class of
  # assertion this sprint exists to remove, so it waits for its test
  # ([[implemented-joins-the-legal-status-values-and-the-status-block-enters-every-schema]]).
  status:
    - current
    - deprecated
    - implemented
    # `refused` AND `idea`, ADMITTED 2026-08-23, and each was decided before it could be written.
    #
    # `refused` - the owner refused the proposal. The page moves to `archive/` and names the
    # decision that refused it in `decided_by:`. It carries NO `superseded_by:`: a refusal is a
    # CAUSE, and `superseded_by:` is a relation between two pages asserting the same claim
    # differently, which a refusal and its proposal do not
    # ([[a-refused-proposal-is-archived-and-takes-status-refused]]). That `decided_by:` is
    # required WHEN THE STATUS IS `refused` is a conditional this file cannot express, so
    # `scripts/vault-archive.sh` refuses the move instead - the same shape as `paths` under
    # `render: whole` in `wiki/rules/`, and for the same reason.
    #
    # `idea` - pre-design, half-thought, not yet a proposal. Decided 2026-08-17 and unminted
    # until today, so no page has ever been able to carry it and none does: the folder is the
    # KIND of a record and the status is its MATURITY
    # ([[an-idea-is-a-proposal-with-an-immature-status]]).
    #
    # A VERDICT PAIRING `idea` WITH `decided_by:` IS OWED AND NOT BUILT. The session that admitted
    # these two values designed the pair, then dropped it, and the owner OVERRULED the drop at the
    # retro of 2026-08-23: it is to be built.
    #
    # The argument the session lost is kept here because it is the thing the build has to answer,
    # not because it stands: a pair would make this field mean AUTHORISATION where the ruling above
    # makes it mean MATURITY, so a fully designed proposal that no decision produced would have to
    # assert an immaturity it does not have, and a half-thought one produced by a deferral decision
    # could not be an idea at all - and deferral decisions with proposals behind them are the
    # ordinary case here rather than the corner.
    #
    # THE ORDER IS PART OF THE ITEM. The verdict lands AFTER `decided_by:` is filled across the
    # `proposals/` pages, never before: on the day it lands it reddens every page still lacking the
    # field, and a red gate locks the librarian out of the work that would clear it. That is the
    # deadlock `wiki/rules/` avoided by promoting last, and it is written here because this file is
    # what a reader opens when they go to build it.
    #
    # BUILT 2026-08-24, AND THE ARGUMENT ABOVE IS WHAT IT WAS BUILT AGAINST. The paragraph before
    # last is left exactly as it stood, because it is the objection and not a mistake; what follows
    # is its answer.
    #
    # The verdict is NARROWED, on the owner's ruling: a page is red when it carries `status: idea`
    # AND names a cause whose `binding:` is not `deferral`. So the case the objection is about -
    # a half-thought produced by a deferral decision - keeps its `idea`, and the field goes on
    # meaning MATURITY rather than authorisation. It lives in rule 5c of `scripts/vault-check.sh`,
    # which already resolved `decided_by:` and opened the page it names, and it reads `binding:` in
    # that same pass. Two selftest cases, one each way, each proved to fail before it was believed.
    #
    # IT FIRES ON NOTHING IN THIS CORPUS AND THAT IS BY CONSTRUCTION. The back-fill method sets
    # `status: idea` only where no decision exists, so an idea page carries no `decided_by:` and
    # the two halves never meet. It is a guard against a page somebody writes tomorrow.
    #
    # AND THE ORDER ABOVE WAS OBEYED WITHOUT BEING NEEDED: the back-fill ran first and took the
    # shortfall from 33 pages to 7. The deadlock the order protects against belongs to a WIDER
    # reading of the pair - that a proposal which is not an idea must carry the field - which is
    # forbidden outright by [[decided-by-is-legal-in-proposals-and-rules-and-required-in-rules]].
    # The order cost nothing and its justification is narrower than it reads.
    - refused
    - idea
    # `archived`, ADMITTED 2026-08-28, and the value enters every schema BEFORE any sweep writes it
    # ([[the-archiver-sets-status-archived-and-the-value-enters-the-schema-first]]).
    #
    # WHY IT IS NEEDED HERE AT ALL, WHICH IS NOT THE REASON THAT PAGE GIVES. The gate's frontmatter
    # pass reads `find "$VAULT/wiki"` and nothing else - `scripts/vault-check.sh:84` - so a page
    # that has ALREADY reached `archive/` is validated by no schema and could carry any word. What
    # makes the declaration necessary is the sweep's own failure mode, decided 2026-08-28: it
    # continues past a refused move, collects the refusals and reports them at the end. So a page
    # can be left HERE carrying the mark of a move that did not complete, and an undeclared value
    # would report that as a schema fault rather than as the half-finished move it is.
    #
    # THIS FOLDER REACHES IT LAST OF THE FIVE, and that is worth saying because it already has two
    # values that name a departure. `implemented` and `refused` are CAUSES a proposal leaves for,
    # each with its own precondition in `scripts/vault-archive.sh`; `archived` is what the sweep
    # writes once it has actually moved the page. A proposal therefore passes through two marks and
    # not one, and the first of them is the librarian's while the second is the script's.
    - archived

    # `repealed` IS NOT ADMITTED HERE AND THE ABSENCE IS THE DECISION. The value was minted on
    # 2026-08-30 for a page that is CANCELLED and replaced by nothing, and this folder already has
    # that cause under its own name: `refused` is "we decided not to build this", carries
    # `decided_by:` naming the decision that refused it, and `scripts/vault-archive.sh` refuses to
    # release the page without one. A second word for one cause is the drift a closed value list
    # exists to prevent, so `repealed` is legal in `wiki/rules/` alone and is red here.

# THE DATE THE DECISION LIFECYCLE STARTS, read by rule 16, and it is the same date and the same
# ruling as the one in `wiki/decisions/_schema.yaml`. A proposal created before it is judged by
# none of the sections below and is not back-filled.
lifecycle_from: 2026-08-30

# THE BODY SECTION A PROPOSAL CARRIES, as a `# ` heading. One, and rule 16 checks only that it is
# present.
#
# WHAT IT HOLDS is the proposal's own frontier: one line per decision this proposal must close
# before it can be implemented, written as a checkbox, a link and the verdict. **The checkbox
# records RATIFICATION and never completion** (owner, 2026-08-30) - an unanswered item is prose
# carrying no link at all, and an answered one is ticked and carries a resolving link. That is why
# no verdict compares the checkbox against anything: an unticked line with a link, or a ticked line
# whose link resolves to nothing, is already caught by the link sweep of rules 4 and 5.
#
# THE HEADING IS IDENTICAL ACROSS EVERY PROPOSAL, which is the owner's own requirement and the
# whole reason it is declared here rather than left to each page: `scripts/vault-archive.sh` reads
# this list to decide what a refused proposal takes with it, and a reader that has to guess where
# the list is cannot be trusted with a move.
#
# BEING LISTED CLOSES NOTHING. A decision in this list leaves `wiki/decisions/` on its own target
# being satisfied, not on being ticked here - so the list shrinks by itself, and a line whose link
# points into `archive/` is a question that was answered rather than a fault.
sections:
  - Decisions
