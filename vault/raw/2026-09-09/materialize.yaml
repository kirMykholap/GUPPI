    then: "**context.** Родитель трёх механизмов, ратифицированных в Case 9–11. Rule MOC: порядок\nдетей\
      \ — содержание. Не рендерится (это не файл harness'а, а описание фазы), поэтому\n`enforcement` нет;\
      \ сила — в детях.\n\n**now.** Черновик `docs/migration/rule-session-start.md` целиком, с `TBD` в\
      \ `origin`,\n`sprint`, `created`. Его секция `## The Frontier` не входит в список секций\n`rules/schema.yaml`\
      \ — переносится в `## How it works`. Родителя у MOC фазы нет (верхний\nуровень). `estimates: [estimate-session-start-context]`\
      \ — уже назван черновиком.\n\n**problem.** Только сквозная проверка: что именно измеряет Estimate\
      \ MOC, чего не\nизмеряют Estimates детей. Дети проверяют, что каждый механизм работает; MOC — что\n\
      различение «обычная / рабочая сессия» держится насквозь.\n\n**recommend.** Страница — черновик с\
      \ реальными значениями, Frontier внутри\n`## How it works`. Estimate — два показания, два запуска:\
      \ обычная сессия (без `/hi`), в\nкоторой агент пишет голую `- decision[...]`-строку → строка не\
      \ попадает в `ledger.md`, и\nчеловек видит в ответе причину; рабочая сессия (после `/hi`) с той\
      \ же строкой → строка в\n`ledger.md`. Метод ручной, оба показания в строку `estimate[...]`.\n\n\
      **then.**\n\n```\nslug: rule-session-start\ntype: rule\nkind: MOC\npurpose: Prevents a working session\
      \ from starting against unknown state\nchildren: [rule-skill-hi, rule-event-log, rule-ledger-write]\
      \   # порядок — содержание\nsprint: migration\ntags: [session, workflow, hooks]       # workflow\
      \ — новый тег\nbody: черновик docs/migration/rule-session-start.md, секции Purpose / How it works\n\
      \      (включая The Frontier) / Children / Estimates / History\nestimate:\n  slug: estimate-session-start-context\n\
      \  kind: QA\n  criterion: >\n    In a session opened without /hi, a bare `- decision[...]` line\
      \ in a reply does not\n    reach raw/<date>/ledger.md and the reply the person sees names the cause.\
      \ In a session\n    opened with /hi, the same line does reach it. Both readings taken end-to-end.\n\
      \  method: two session starts, by hand, one reading each, recorded in the estimate line\n```\n\n\
      Файлы: `vault/wiki/rules/rule-session-start.md`,\n`vault/wiki/estimates/estimate-session-start-context.md`.\
      \ Черновик в `docs/migration/`\nостаётся до Slice 5 (spec C6).\n\nLedger:\n```\n- decision[case\
      \ 12][create][rule-session-start]\n- decision[case 12][create][estimate-session-start-context]{ref:rule-session-start}\n\
      ```\n\n**ratification.** Ратифицирован владельцем 2026-09-09, как предложено.\n\n---"
