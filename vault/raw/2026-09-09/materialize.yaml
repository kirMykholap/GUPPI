  tags: []
  case_text:
    then: "`uv run guppi render` пишет; `uv run guppi render --check` сравнивает, exit 1, не пишет.\n\
      Маркеры: `partial` оставляет их в файле, `full` пишет тело без внешних маркеров.\n`SKILL.md` теряет\
      \ две строки комментариев. Новый тег `render`.\n\n```\ncreate:\n  slug: rule-render-harness\n  type:\
      \ rule\n  kind: Leaf\n  purpose: Prevents a Rule page and the harness file it governs from becoming\
      \ two copies of one text\n  enforcement: check\n  implementation_ref: [guppi/render.py, tests/test_render.py]\n\
      \  parent: rule-documentation        # dangles until Slice 3, like rule-plan-mode did\n  tags: [harness,\
      \ render]\n  estimate:\n    slug: estimate-render-harness-reproduces\n    kind: QA\n    criterion:\
      \ against a temp vault — a full MOC with two partial children renders to the MOC's Render text with\
      \ each child marker replaced by the child's block, in child order, outer markers dropped; a partial\
      \ page splices between its markers in an existing file and leaves the markers; a partial target\
      \ without markers exits 1 with nothing written; --check on a differing file exits 1, names it, writes\
      \ nothing, and exits 0 on an identical one. Against the live vault — after `uv run guppi render`,\
      \ `git diff --stat` shows only the two dropped marker lines of .claude/skills/hi/SKILL.md and no\
      \ change to CLAUDE.md; `guppi render --check` then exits 0\n    method: pytest in tests/test_render.py\
      \ against a temp vault; the live reading once by hand\n```\n\nСемантика `guppi render`: обходит\
      \ `vault/wiki/rules/`, берёт страницы с\n`enforcement: render` и текст `## Render` между собственными\
      \ маркерами. `full` пишет этот\nтекст как весь файл `governs`, без внешних маркеров; одиночная строка\
      \ `<!-- child -->`\nв нём заменяется Render-текстом ребёнка вместе с его маркерами, в порядке `children`,\n\
      блоки детей разделены одной пустой строкой. `partial`, чью цель не держит ни одна\n`full`-страница,\
      \ вклеивается в существующий файл между его маркерами, маркеры остаются.\nОшибки — на stderr, exit\
      \ 1, ничего не записано: `partial` без маркеров в цели; `full`\nназывает ребёнка, который не render-страница;\
      \ две `full` на один файл."
