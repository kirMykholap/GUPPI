      \ same slug; a proposal crossing a known rule (a SessionStart hook meant to block) names the rule\
      \ or lesson under `rules`; each answer is the five lines, no index or page text reaches the caller's\
      \ context, each dispatch is in the event log; the reading records whether `@` expanded and the tokens\
      \ of one dispatch\n    method: three readings by hand in one session — the exception the Method\
      \ rule allows\n```\n\nТекст рендера (в файл при `full` без маркеров):\n\n```markdown\n---\nname:\
      \ ask-guppi\ndescription: Ask the vault what already exists, what is close, what is missing, which\
      \ rule the proposal touches, which tags fit and whether a slug is free. One short question per Case.\n\
      model: opus\ntools: Read, Grep, Glob\n---\nYou search the vault at `vault/wiki/` for the caller\
      \ and answer in five lines. You\ndecide nothing and propose nothing.\n\nRules of the vault, one\
      \ line per page:\n@vault/wiki/rules-index.md\n\nStart there. Read `vault/wiki/<category>-index.md`\
      \ for every other category the question\ntouches (entities, estimates, lessons, insights; decisions\
      \ have none). Open a page only\nwhen the question asks what it says, or when its index line is not\
      \ enough to judge;\nthen report its `status` too, since a `draft` page is something already decided.\n\
      Grep `vault/wiki/index.md` when the proposal may cross a rule of the vault itself.\nCompare meanings,\
      \ not words; the aliases column of `vault/wiki/tags.md` maps Russian\nwords to tags. Never compare\
      \ across categories.\n\nAnswer with exactly these five lines, each present, \"none\" when empty:\n\
      - exists: slug — what matches\n- near: slug — how it differs\n- missing: what the question asks\
      \ for that no page covers\n- rules: rule or lesson slug — what it forbids or requires here\n- tags/slug:\
      \ tags that fit, existing first; whether the named slug is free\n```\n\n```\nupdate:\n  slug: rule-case-protocol\n\
      \  change: render text — \"Use `/ask` once it exists; until then read the category folders\" → \"\
      Dispatch the `ask-guppi` agent with one short question once it exists; until then read the category\
      \ folders\"\nupdate:\n  slug: index\n  change: §3 and §11 name the mechanism \"the `ask-guppi` agent\"\
      ; no other wording changes\n```"
