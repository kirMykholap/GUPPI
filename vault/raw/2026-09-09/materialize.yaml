  case_text:
    then: "**context.** Хук, который снимает `- decision[...]`, `- estimate[...]` и `- lesson[...]`\n\
      строки из только что законченного ответа и дописывает их в `raw/<date>/ledger.md`\nдословно, ничего\
      \ не интерпретируя. Отказывает с причиной, если сессия не рабочая\n(Case 9, пункт в). Это механизм,\
      \ ради которого «ledger пишется вручную до Slice 1».\n\n**now.** Хука нет; ledger сегодняшнего дня\
      \ — девять строк руками (Slice 0). Старый\n`catch-the-feedback.ps1` на `MessageDisplay` снимал fenced-блоки\
      \ из ответа — удалён с\nвердиктом rework, идея «хук снимает строки из ответа» сохранена. Урок 2026-08-29:\n\
      `MessageDisplay` не может ни говорить, ни блокировать; C7 переносит хук на `Stop`.\nДокументация\
      \ (справка read-only агента по docs) говорит, что `Stop` получает\n`session_id`, `hook_event_name`,\
      \ `last_assistant_message`, `permission_mode`, блокирует\nчерез exit 2 + stderr; видит ли модель\
      \ причину, и есть ли `stop_hook_active` — не\nзадокументировано. Brief велит не верить, а пробовать.\
      \ Формат строк — index §4 и\ncase-schema.\n\n**problem.** (а) откуда брать текст ответа; (б) какие\
      \ строки считаются — в частности,\nстроки внутри fenced-блока: Case показывает будущие ledger-строки\
      \ в `then` **до**\nратификации, и хук, снявший их с этого же ответа, записал бы нератифицированное;\n\
      (в) что делать без `/hi`; (г) повторный запуск хука на том же ответе; (д) первая проба.\n\n**recommend.**\n\
      \n(д) сначала — **проба**, первый шаг Work Mode: throwaway-команда `guppi probe`,\nзарегистрированная\
      \ на `Stop` и на `PostToolUse` с matcher `ExitPlanMode`, пишет сырой\nstdin в `vault/raw/2026-09-09/probe-<event>-<n>.json`;\
      \ в тело `/hi`-заглушки временно\nкладётся `!`-подстановка `echo $CLAUDE_SESSION_ID`. Снимается\
      \ за одну новую сессию (хуки\nчитаются при старте — тоже показание пробы). Показания идут в ledger\
      \ как\n`- lesson[knowledge][lesson-hooks-stop-payload] trigger: … root_cause: …` (и второй\nlesson\
      \ для `ExitPlanMode`), проба и её файлы удаляются в том же коммите. Ветка кода,\nкоторую проба не\
      \ подтвердила, не пишется.\n\n(а) текст — `last_assistant_message`; если проба покажет только `transcript_path`,\n\
      читается последняя assistant-запись транскрипта. Пишется одна ветка, не обе.\n\n(б) считается строка,\
      \ которая начинается с `- decision[`, `- estimate[` или\n`- lesson[` в нулевой колонке **и не лежит\
      \ внутри fenced-блока**. Правило для агента,\nвойдёт в `rule-case-protocol` (Case 13): в fence —\
      \ предпросмотр, голой строкой — запись;\nголую строку агент пишет только в ответе, который признаёт\
      \ ратификацию.\n\n(в) строки есть, `/hi` не записан → exit 2, stderr:\n`ledger: 2 line(s) not written\
      \ — no /hi recorded for session a1b2c3d4. Tell the person; run /hi, then repeat the lines.`\nСтрок\
      \ нет → exit 0, ledger не трогается (создаётся лениво, при первой строке).\n\n(г) `stop_hook_active:\
      \ true` (повторный Stop после блокировки) → exit 0, ничего не\nпишет и не блокирует, чтобы не зациклиться.\
      \ Дополнительно строка, дословно уже\nприсутствующая в сегодняшнем ledger, не дописывается второй\
      \ раз — это покрывает и\nповтор хука, и агента, повторившего строку в следующем ответе.\n\nПапка\
      \ — `raw/<сегодня>/`, та же, что у event log. Регистрация: `Stop` →\n`uv run guppi ledger`, timeout\
      \ 30 с. Строки Case 9–13 этой сессии пишутся руками при\nратификации (хука ещё нет); всё, что родится\
      \ в Work Mode после запуска хука — строки\n`estimate[...]` с результатами и `lesson[...]` пробы\
      \ — пишет хук. Это репетиция пункта 5\nDefinition of done.\n\n**then.**\n\n```\nslug: rule-ledger-write\n\
      type: rule\nkind: Leaf\npurpose: Prevents a ratified line from existing only in a chat reply, or\
      \ landing in a session no /hi opened\nenforcement: hook\nimplementation_ref: [guppi/ledger.py, .claude/settings.json]\n\
      parent: rule-session-start\nsprint: migration\ntags: [session, hooks, harness, ledger]        #\
      \ ledger — новый тег\nestimate:\n  slug: estimate-ledger-write-lifts\n  kind: QA\n  criterion: >\n\
      \    Given a Stop payload whose reply carries one bare decision line, the same line inside a\n \
      \   fence, and one bare estimate line, with a `hi` recorded for the session: the ledger\n    gains\
      \ exactly the two bare lines, verbatim, once, even when the hook runs twice on the\n    same payload.\
      \ Without `hi` the hook exits 2 with a reason naming the count and the\n    session, and the ledger\
      \ is untouched. With `stop_hook_active` true it exits 0 and\n    writes nothing. In a live session,\
      \ the last lines of this slice reach\n    raw/2026-09-09/ledger.md written by the hook, not by hand.\n\
      \  method: >\n    pytest in tests/test_ledger.py with piped payloads against a temp vault; the live\n\
      \    reading is taken once by hand and written into the estimate line.\n```\n\nКод: `guppi/ledger.py`,\
      \ `guppi/probe.py` (временно), `tests/test_ledger.py`,\n`.claude/settings.json` (хук `Stop`).\n\n\
      Ledger:\n```\n- decision[case 10][create][rule-ledger-write]{ref:rule-session-start}\n- decision[case\
      \ 10][create][estimate-ledger-write-lifts]{ref:rule-ledger-write}\n```\n\n**ratification.** Ратифицирован\
      \ владельцем 2026-09-09, как предложено.\n\n---"
