  case_text:
    then: "**context.** `/hi` открывает рабочую сессию. Bash-подстановки в теле скилла исполняются\nдо\
      \ первого хода агента, поэтому sprint, brief, git-состояние и issues просто присутствуют\nв контексте\
      \ — нет шага, который агент мог бы забыть. Скилл сам оставляет отметку `hi` в\nevent log (C8). Без\
      \ `/hi` сессия обычная: ничего не загружено, ledger не пишется.\n\n**now.** Скилла нет; `.claude/skills/`\
      \ содержит только `grill-me`. Старый\n`session-brief.ps1` (SessionStart, печатал brief) удалён с\
      \ вердиктом rework. Черновик\n`docs/migration/rule-session-start.md` задаёт структуру: MOC `rule-skill-hi`\n\
      (`render: full`) и три Leaf с `render: partial` — internal context, git context, github\nissues;\
      \ разбиение обосновано там же (четыре `@`-импорта падают одинаково — один Leaf;\n`git pull` и `gh\
      \ issue list` падают по-разному — отдельные). До Slice 2 renderer'а нет:\nфайл скилла и страницы\
      \ правил — две копии на одну сессию, brief это принимает.\nДва факта среды, которых черновик не\
      \ знал: `origin` → `c:/PROJECTS/job hunt ai`\n(репозиторий продукта), у `migration` нет upstream;\
      \ `gh` не залогинен.\n\n**problem.** (а) текст скилла — он же тело четырёх страниц; (б) `git pull`\
      \ в `/hi` при\nтаком `origin`; (в) `gh issue list` без авторизации; (г) Estimates на каждую страницу.\n\
      \n**recommend.**\n\n(а) Файл `.claude/skills/hi/SKILL.md`, frontmatter `name: hi`,\n`disable-model-invocation:\
      \ true` (вызывает только человек — иначе агент мог бы «открыть»\nсессию сам). Тело — рендер MOC\
      \ с маркерами трёх детей:\n\n```markdown\n---\nname: hi\ndescription: Open a working session — sprint,\
      \ brief, git state, open issues, then the Frontier.\ndisable-model-invocation: true\n---\n<!-- rule-skill-hi\
      \ -->\nRecorded: !`uv run guppi event hi --session \"${CLAUDE_SESSION_ID:-}\"`\n\n<!-- rule-internal-context\
      \ -->\n@vault/wiki/sprint.md\n@vault/wiki/brief.md\n<!-- /rule-internal-context -->\n\n<!-- rule-git-context\
      \ -->\nPull: !`git pull --ff-only 2>&1 || true`\nBranch: !`git branch --show-current`\nStatus: !`git\
      \ status --short`\n<!-- /rule-git-context -->\n\n<!-- rule-github-issues -->\nOpen issues: !`gh\
      \ issue list --limit 5 2>&1 || true`\n<!-- /rule-github-issues -->\n\nAssemble the Frontier from\
      \ the above and present it as a list: tasks, problems, debt\ncarried over, where the sprint stands;\
      \ on a plan branch the unfinished plan comes first.\nA failed pull or an unavailable `gh` is an\
      \ item on that list, not a reason to stop. Wait\nfor the human to pick the order or defer items.\
      \ Before any `create`, ask the vault first\n(§3 of `vault/wiki/index.md`).\n<!-- /rule-skill-hi\
      \ -->\n```\n\n`${CLAUDE_SESSION_ID:-}` — если проба Case 10 покажет переменную, `hi` получит настоящий\n\
      id; если нет — пустая строка, `--------`, текст скилла не меняется.\n\n(б) `git pull --ff-only`\
      \ остаётся в скилле: правило «pull здесь и только здесь» — про\nместо, не про сегодняшний remote.\
      \ Падение печатается в контекст и становится пунктом\nFrontier. Сам `origin` — вопрос владельцу\
      \ (11.1): оставить как есть до Slice 5 (merge в\n`main`), или снять/переназначить сейчас. Рекомендую\
      \ оставить: репозиторий сейчас\nлокальный, а `git pull` с `|| true` безвреден.\n\n(в) `gh issue\
      \ list` остаётся; без авторизации в контекст попадает `gh`'s own message.\nВопрос владельцу (11.2):\
      \ логиниться ли в `gh` для этого репозитория (нужен GitHub-remote,\nкоторого нет). Рекомендую: не\
      \ сейчас; правило страницы — «список или названная причина\nего отсутствия».\n\n(г) Четыре Estimate,\
      \ все QA, метод — ручное показание при старте сессии, записанное в\nстроку `estimate[...]`; автоматической\
      \ проверки у markdown-скилла нет до Slice 2.\n\n**then.**\n\n```\nslug: rule-skill-hi\ntype: rule\n\
      kind: MOC\npurpose: Prevents a session from being loaded piecemeal by read-tool calls\nenforcement:\
      \ render\ngoverns: .claude/skills/hi/SKILL.md\nrender_mode: full\nparent: rule-session-start\nchildren:\
      \ [rule-internal-context, rule-git-context, rule-github-issues]   # порядок — содержание\nsprint:\
      \ migration\ntags: [session, harness]\nestimate:\n  slug: estimate-hi-no-read-calls\n  kind: QA\n\
      \  criterion: >\n    After /hi the context holds sprint.md, brief.md, the current branch, git status\
      \ and the\n    issue list (or gh's message) with no read-tool call having occurred, and\n    raw/<date>/event_log.md\
      \ carries a `hi` line.\n  method: one reading at a session start, by hand, recorded in the estimate\
      \ line\n\nslug: rule-internal-context\ntype: rule\nkind: Leaf\npurpose: Prevents work starting without\
      \ the current sprint and the previous session's handover\nenforcement: render\ngoverns: .claude/skills/hi/SKILL.md\n\
      render_mode: partial\nparent: rule-skill-hi\nsprint: migration\ntags: [session, harness]\nestimate:\n\
      \  slug: estimate-internal-context-loaded\n  kind: QA\n  criterion: the text of sprint.md and brief.md\
      \ is present in the first turn's context\n  method: one reading at a session start, by hand\n\n\
      slug: rule-git-context\ntype: rule\nkind: Leaf\npurpose: Prevents a session from starting on a branch\
      \ it does not know, or pulling mid-session\nenforcement: render\ngoverns: .claude/skills/hi/SKILL.md\n\
      render_mode: partial\nparent: rule-skill-hi\nsprint: migration\ntags: [session, harness, git]  \
      \        # git — новый тег\nestimate:\n  slug: estimate-git-context-current\n  kind: QA\n  criterion:\
      \ >\n    branch and short status are in context; a failing pull shows its message there and the\n\
      \    skill still completes; no pull happens later in the session\n  method: one reading at a session\
      \ start, by hand, on the current remote\n\nslug: rule-github-issues\ntype: rule\nkind: Leaf\npurpose:\
      \ Prevents deferred bugs, tracked outside the vault, from being forgotten at session start\nenforcement:\
      \ render\ngoverns: .claude/skills/hi/SKILL.md\nrender_mode: partial\nparent: rule-skill-hi\nsprint:\
      \ migration\ntags: [session, harness, github]       # github — новый тег\nestimate:\n  slug: estimate-github-issues-listed\n\
      \  kind: QA\n  criterion: >\n    the open-issue list, or gh's own message naming why there is none,\
      \ is in context and\n    the skill completes either way\n  method: one reading at a session start,\
      \ by hand, in the current gh state\n```\n\nКод: `.claude/skills/hi/SKILL.md`; страницы `vault/wiki/rules/rule-skill-hi.md`,\n\
      `rule-internal-context.md`, `rule-git-context.md`, `rule-github-issues.md`; четыре\nстраницы в `vault/wiki/estimates/`.\n\
      \nLedger:\n```\n- decision[case 11][create][rule-skill-hi]{ref:rule-session-start}\n- decision[case\
      \ 11][create][estimate-hi-no-read-calls]{ref:rule-skill-hi}\n- decision[case 11][create][rule-internal-context]{ref:rule-skill-hi}\n\
      - decision[case 11][create][estimate-internal-context-loaded]{ref:rule-internal-context}\n- decision[case\
      \ 11][create][rule-git-context]{ref:rule-skill-hi}\n- decision[case 11][create][estimate-git-context-current]{ref:rule-git-context}\n\
      - decision[case 11][create][rule-github-issues]{ref:rule-skill-hi}\n- decision[case 11][create][estimate-github-issues-listed]{ref:rule-github-issues}\n\
      ```\n\n**ratification.** Ратифицирован владельцем 2026-09-09, как предложено. 11.1: `origin`\nостаётся\
      \ как есть до Slice 5. 11.2: в `gh` не логинимся; Estimate снимается по ветке\n«причина названа».\n\
      \n---"
