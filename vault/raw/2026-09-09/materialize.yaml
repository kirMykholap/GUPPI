  text: 'lesson[error][lesson-hooks-windows-stdin-encoding] trigger: `probe-Stop-1.json` and `-2.json`
    were 0 bytes although the `Stop` hook had fired, and `event_log.md` carried mojibake (`â€”`) in tool
    details root_cause: a hook''s stdin on Windows is a cp1252 text wrapper with `surrogateescape`; a
    UTF-8 payload becomes lone surrogates, `write_text(encoding="utf-8")` raises after creating the file;
    fixed by reading `stdin.buffer` and decoding UTF-8 (`read_text` in `guppi/event.py`), stderr reconfigured
    to UTF-8 in `cli.py`, covered by tests'
  kind: lesson
  category: lessons
  slug: lesson-hooks-windows-stdin-encoding
  origin: raw/2026-09-09/ledger.md#L31
  fields:
    type: lesson
    kind: error
    root_cause: a hook's stdin on Windows is a cp1252 text wrapper with `surrogateescape`; a UTF-8 payload
      becomes lone surrogates, `write_text(encoding="utf-8")` raises after creating the file; fixed by
      reading `stdin.buffer` and decoding UTF-8 (`read_text` in `guppi/event.py`), stderr reconfigured
      to UTF-8 in `cli.py`, covered by tests
  sections:
    Trigger: '`probe-Stop-1.json` and `-2.json` were 0 bytes although the `Stop` hook had fired, and `event_log.md`
      carried mojibake (`â€”`) in tool details'
    Root cause: a hook's stdin on Windows is a cp1252 text wrapper with `surrogateescape`; a UTF-8 payload
      becomes lone surrogates, `write_text(encoding="utf-8")` raises after creating the file; fixed by
      reading `stdin.buffer` and decoding UTF-8 (`read_text` in `guppi/event.py`), stderr reconfigured
      to UTF-8 in `cli.py`, covered by tests
