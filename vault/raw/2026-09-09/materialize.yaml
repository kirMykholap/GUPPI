    ref: rule-session-start
  - kind: create
    category: estimates
    slug: estimate-event-log-records
    ref: rule-event-log
  tags: []
  case_text:
    then: "**context.** Event log — шумная запись сессии: старты, вызовы инструментов, диспатчи,\nкоммиты,\
      \ прогоны тестов. Пишется хуками, не инструкциями, поэтому фиксирует и отклонения\nагента. Не коммитится.\
      \ Это первый механизм слайса, и вместе с ним рождается пакет `guppi/`,\nв котором живут все хуки\
      \ и скрипты модели (D3).\n\n**now.** Python в репозитории нет. `pyproject.toml` объявляет пакет\
      \ `guppi`, зависимость\n`pyyaml`, dev-группу с `ruff`; `[project.scripts]` не задан (Slice 0 отложил\
      \ на Slice 1).\n`.claude/settings.json` — только `defaultMode: plan`, хуков нет. `.gitignore` не\
      \ знает\n`event_log.md`. Старый аналог — `pre-task-ledger.tsv` и четыре хука на PowerShell —\nудалён\
      \ в Slice 0 с вердиктом rework. Два урока старого vault держат: хук всегда получает\npayload на\
      \ stdin, и мерить его надо через pipe; процесс, читающий stdin, вешается при\nфоновом запуске —\
      \ каждый вызов в Makefile закрывает stdin. `tags.md` пуст: любой тег\nздесь — новый. `wiki/` не\
      \ содержит страниц, pre-task по индексам невозможен (индексов\nнет); проверено чтением `wiki/` и\
      \ `parked/` — дубликатов нет.\n\n**problem.** Три решения: (а) форма пакета и тестов — в частности\
      \ pytest как новая\ndev-зависимость; (б) контракт event log — путь, формат строки, какие события;\
      \ (в) как\nскилл `/hi` оставляет свою отметку без session id, и как `Stop`-хук потом её находит.\n\
      \n**recommend.**\n\n(а) `guppi/` — пакет на stdlib + pyyaml: `guppi/cli.py` (`main`, argparse, субкоманды),\n\
      `guppi/event.py`, позже `ledger.py`. `[project.scripts] guppi = \"guppi.cli:main\"`, вызов\nвсюду\
      \ `uv run guppi …`. Тесты в `tests/` на **pytest**: roadmap в spec.md уже называет\n«`guppi lint`\
      \ + pytest», brief — «the pytest suite beside it»; это одна dev-зависимость\nрядом с `ruff`, runtime-зависимостей\
      \ не прибавляется. `Makefile` получает `test`\n(`uv run pytest -q < /dev/null`); `style` остаётся\
      \ `ruff check .`.\n\n(б) `guppi event <name> [detail]`. Читает JSON хука со stdin, если он есть\
      \ (не tty, не\nпуст): берёт `session_id`, `hook_event_name`, `tool_name`, для `Bash` — первые 80\
      \ символов\n`command`, для `Agent`/`Skill` — тип агента или имя скилла. Дописывает одну строку в\n\
      `vault/raw/<сегодня>/event_log.md`, создавая папку и файл:\n\n```\n- 15:02:11 a1b2c3d4 session-start\
      \ startup\n- 15:02:40 -------- hi\n- 15:03:05 a1b2c3d4 tool Bash: git status --short\n- 15:04:12\
      \ a1b2c3d4 tool Agent: Explore\n```\n\nФормат: `- HH:MM:SS <8 знаков session_id | -------- > <event>\
      \ <detail>`. Никогда не\nроняет сессию: любая ошибка — в stderr, exit 0. Регистрация в `settings.json`:\n\
      `SessionStart` → `uv run guppi event session-start`; `PostToolUse` без matcher'а →\n`uv run guppi\
      \ event tool`. Пишутся все вызовы инструментов, не только Bash/Agent: это\nзапись для отладки, и\
      \ фильтр — лишнее решение, которое потом придётся менять.\n`.gitignore` получает `vault/raw/*/event_log.md`.\n\
      \n(в) `/hi` пишет `hi` через `!`-подстановку `uv run guppi event hi` — там нет payload'а,\nsession\
      \ id неизвестен, в строке `--------`. `Stop`-хук (Case 10) считает сессию рабочей,\nесли в сегодняшнем\
      \ `event_log.md` после **последней** строки `session-start` с его\nsession_id есть строка `hi`,\
      \ и между ними нет `session-start` другой сессии. Две\nодновременные сессии в одном репозитории\
      \ этот способ не различает — фиксируется в\n`How it works` как известное ограничение. Проба Case\
      \ 10 заодно проверит, доступна ли\n`$CLAUDE_SESSION_ID` внутри `!`-подстановки; если да, `hi` получит\
      \ настоящий id и\nограничение снимается.\n\n**then.**\n\n```\nslug: rule-event-log\ntype: rule\n\
      kind: Leaf\npurpose: Prevents the ledger from being written into a session nothing recorded\nenforcement:\
      \ hook\nimplementation_ref: [guppi/event.py, guppi/cli.py, .claude/settings.json]\nparent: rule-session-start\n\
      sprint: migration\ntags: [session, hooks, harness]        # все три — новые, tags.md пуст\nestimate:\n\
      \  slug: estimate-event-log-records\n  kind: QA\n  criterion: >\n    After a session starts and\
      \ one tool call completes, raw/<date>/event_log.md carries a\n    `session-start` line with this\
      \ session's id and a `tool` line after it; after `/hi`\n    it carries a `hi` line; `git check-ignore`\
      \ reports the file ignored; and a hook\n    invocation with piped stdin exits 0 and finishes under\
      \ 2 s.\n  method: >\n    pytest in tests/test_event.py drives guppi.event with piped JSON payloads\
      \ against a\n    temp vault; the git-ignore and timing readings are taken once by hand, through\
      \ a pipe,\n    and written into the estimate line.\n```\n\nКод: `guppi/__init__.py`, `guppi/cli.py`,\
      \ `guppi/event.py`, `tests/test_event.py`,\nправки `pyproject.toml` (scripts, pytest в dev), `Makefile`\
      \ (`test`), `.gitignore`,\n`.claude/settings.json` (два хука).\n\nLedger:\n```\n- decision[case\
      \ 9][create][rule-event-log]{ref:rule-session-start}\n- decision[case 9][create][estimate-event-log-records]{ref:rule-event-log}\n\
      ```\n\n**ratification.** Ратифицирован владельцем 2026-09-09, как предложено.\n\n---"
  incomplete:
  - context
  - problem
