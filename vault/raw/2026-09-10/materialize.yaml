    kind: Leaf
    purpose: Prevents a session from closing on work nobody reviewed, or on a change that traces to no
      decision
    enforcement: render
    governs: .claude/skills/retro/SKILL.md
    render_mode: full
    parent: rule-end-of-work
    tags:
    - session
    - workflow
    - harness
