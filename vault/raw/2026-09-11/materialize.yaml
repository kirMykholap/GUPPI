  - kind: update
    category: estimates
    slug: estimate-synthesis-clusters
  tags: []
  case_text:
    context: 'Case 44 разрешил библиотекарю открывать страницу `wiki/` в трёх случаях: строка индекса
      не решает «то же или рядом»; он пишет Insight и ему нужны Trigger и Root cause его уроков; скрипт
      назвал страницу в ошибке. Прогон G нарушил это дважды, и оба чтения были нужны: два урока, чтобы
      решить, кластеризуется ли третий (Insight не родился); свой Insight и статусы Estimate для брифа.
      Оба чтения снова `failed`, Slice 3 не закрывается.'
    problem: Фрейм называет чтения по итогу, а не по вопросу; у брифа нет входа со статусом Estimate и
      severity Insight.
    recommend: Четыре причины, каждая по вопросу; каждое чтение названо с причиной и исходом; критерии
      переписаны; «five indexes» → «four» после 53.4.
    given: '`rule-documentation` Render 43–47: «the five index files», три случая. `rule-synthesis` Render
      39: «the lessons you cluster». `rule-brief`: нужны failed Estimates, severity, счёт страниц; входа
      нет.

      **＋** `estimate-documentation-completes`: «five indexes», «three reasons». `estimate-synthesis-clusters`:
      «named as a child of the Insight written». Оба `failed` 16:15:34 на этих чтениях; урок `lesson-frame-read-clauses-omit-candidate-check-and-brief`.

      **＋** Event log G: 16:06:54 два урока; 16:09:57 свой Insight; 16:10:41 grep статусов.

      **－** `rule-index-check` не меняется. Чтение снимается после прогона библиотекаря этой сессии, в
      хвост ledger.'
    when: Библиотекарь запускается по агент-файлу из `rule-documentation`; после прогона снимаются `estimate-documentation-completes`
      и `estimate-synthesis-clusters`.
    then: 'Входов четыре: `handoff.md`, yaml-ы из stdout `materialize`, четыре индекса, `tags.md`. Страницу
      `wiki/` библиотекарь открывает по четырём причинам: строка индекса не решает «то же или рядом»;
      строка индекса не решает, делит ли урок root cause с другим уроком или Insight; скрипт назвал страницу
