      **－** The librarian never invents a tag (`rule-documentation`); it reported and left it.'
    when: '`guppi materialize` reads a Spec; `guppi generate` runs after it.'
    then: 'Every `## Case` and `### Case` block of the Spec contributes its `new_tags`, lines or

      none; duplicates are kept once.

