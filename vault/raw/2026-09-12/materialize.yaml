      rendered section, and a ratified sentence went into the file instead of the page

      (case 56). Now the file is the Render of this page, whole, with the Case protocol

      spliced from `rule-case-protocol`; a change to it is an `update` of one of the two.

      '
    Render: "<!-- rule-claude-md -->\n# GUPPI\n\nA Claude Code harness governed by ratified decisions,\
      \ and the Obsidian vault it compiles into.\nThe vault is `vault/`; its map is `vault/wiki/index.md`.\
      \ Nothing in the vault or the codebase\nchanges without a Decision ratified by the human. You have\
      \ full autonomy over *how* to\nimplement something once its contract is ratified, and none over\
      \ the contract itself. When you\nare unsure whether something needs ratification: it does.\n\n##\
      \ What is loaded here\n\nThe glossary and the Case schema arrive through the imports below, so the\
      \ terms and the shape\nof a Case are present from the first turn without a read.\n\n@vault/wiki/glossary.md\n\
      \n@vault/wiki/case-schema.md\n\n`vault/wiki/index.md` is not imported: it is the map of the vault\
      \ and the rules that hold in\nevery phase, read section by section when a section is needed (§0\
      \ the one rule, §1 layout,\n§2 Case protocol, §3 decisions, §4 ledger, §5 routing, §6 splitting,\
      \ §7 estimates, §8 lessons\nand insights, §10 librarian, §11 indexes, §12 where content comes from).\n\
      \n## Migration mode, since 2026-09-09\n\nThis repository is being moved from its earlier model onto\
      \ the one in `index.md`. Until the\nmove closes:\n\n- **The state a session starts from is `vault/wiki/brief.md`.**\
      \ Read it first; nothing prints\n  it yet. `vault/wiki/sprint.md` names the slices and what closes\
      \ the sprint.\n- **The ledger hook exists since Slice 1.** Lines are emitted in a ```` ```LEDGER\
      \ ```` block\n  in the reply and the `Stop` hook writes them into `vault/raw/<date>/ledger.md`,\
      \ each\n  prefixed with the time of writing. The lines of 2026-09-09 written by hand before it\n\
      \  carry no time; that is how the two are told apart.\n- **The rituals of the new model exist since\
      \ Slice 3.** `/retro` (the person), `/handoff` (the\n  agent, refused by `guppi gate` while the\
      \ tree is dirty), then the `librarian-guppi` agent:\n  `materialize`, index check, synthesis, `generate`,\
      \ `cleanup`, brief, commit. Pages are no\n  longer written by hand; `brief.md` is written by the\
      \ librarian. `docs/migration/` still\n  holds the drafts of Work Mode and the plan of the move.\n\
      - **Each slice is its own Plan Mode and its own approval.** The approved plan is copied to\n  `vault/raw/<date>/spec.md`\
      \ by the `PostToolUse ExitPlanMode` hook `guppi spec` since\n  Slice 2; the Specs of Slices 0–2\
      \ were copied by hand.\n\n<!-- rule-case-protocol -->\n\n## Language\n\nEnglish for everything written\
      \ into the repository: code, identifiers, comments, pages,\ncommit messages, documents. Russian\
      \ for chat with the owner, and for the plan he reads in\norder to approve it. English technical\
      \ terms are not transliterated into Cyrillic.\n\n## Style\n\nKeep the facts and remove the sales\
      \ pitch. Name a real source or remove the claim. Short\nsentences, active voice, a common word over\
      \ a term. Give the answer first. Say what is done\nand what is not done; never leave the not-done\
      \ implied.\n\n## Commands\n\n`make help` lists the targets. `make style` must be clean before every\
      \ commit. Add no new\ndependencies, Python or otherwise.\n<!-- /rule-claude-md -->\n"
    How it works: 'Rendered in full into `CLAUDE.md`; `rule-case-protocol` splices into its marker. The

      `@` lines are text here and imports for Claude Code. The section "Migration mode"

      is carried from the hand-written file as it stood on 2026-09-12 and leaves with the

      migration, by an `update` of this page. `rule-case-protocol` keeps its parent

      `rule-plan-mode`; it is listed here for the renderer only.

      '
