- line: 5
  text: decision[case 111.1][update][rule-event-log]{ref:rule-event-log}
  case: '111.1'
  kind: update
  slug: estimate-event-log-records
  category: estimates
  origin: raw/2026-09-14/0747/ledger.md#case-111.1
  decision: decision-case-111.1
  derived: true
  criterion_block: '### case 111.1


    When:

    The person submits a prompt and the `UserPromptSubmit` hook `uv run guppi event prompt` runs.


    Then:

    When the prompt, trimmed, is `/hi` or starts with `/hi `, and no `hi` of this session''s stamp follows
    its first `session-start` in the logs walked, the log gains `- HH:MM:SS <stamp> hi`, the stamp from
    the payload''s `session_id`.

    **＋** A second `/hi` of the same session writes nothing: one session, one `hi` line.

    **＋** Any other prompt writes nothing; exit 0 either way, an error on stderr only.

    **＋** The "Known limit" paragraph of the page says the limit is lifted by this Case; a `hi` of one
    session no longer belongs to another.

    **＋** `estimate-event-log-records` gets a `### case 111.1` block, `pending`; read at the next `/hi`:
    the log carries `<stamp> hi` for that session, and a repeated `/hi` adds no line.'
  set:
    status: pending
  change: 'criterion: case 111.1 added'
  applied: 09:59:51
