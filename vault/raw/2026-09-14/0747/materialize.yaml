  ref: rule-event-log
  category: rules
  replace:
  - old: '`/hi` writes its own `hi` line through a `!` substitution, with the session id when `CLAUDE_SESSION_ID`
      reaches a substitution and `--------` when it does not.'
    new: 'The `hi` line is written by `guppi event prompt` on `UserPromptSubmit`: when the prompt, trimmed,
      is `/hi` or starts with `/hi `, and no `hi` of this session''s stamp follows its first `session-start`
      in the logs the ledger hook walks, the log gains `- HH:MM:SS <stamp> hi`, the stamp from the payload''s
      `session_id`; a second `/hi` of the same session and any other prompt write nothing (case 111.1).
      Until case 111.4 the skill''s `!` substitution writes a second, unstamped `hi` line, which the ledger
      hook ignores.'
  - old: '**Known limit.** With `--------` on the `hi` line, two sessions open at once in one repository
      cannot be told apart by the ledger hook, which looks for a `hi` after the last `session-start` of
      its own session. Sequential sessions are fine.'
    new: '**A limit lifted.** Until case 111 the `hi` line carried `--------` and the ledger hook looked
      for a `hi` after the last `session-start` of its own session, so two sessions open at once could
      not be told apart; on 2026-09-14 a session restored by `resume` in the same second took the `hi`
      of the session that typed it. With the stamp on the `hi` line a `hi` of one session never belongs
      to another (case 111.1).'
  change: the hi line is written by guppi event prompt on UserPromptSubmit with the session's stamp, once
    per session; the known limit is lifted (case 111.1)
