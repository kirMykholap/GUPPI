  criterion_block: '### case 111.3


    When:

    The `Stop` hook has lines to write, or a script asks `session_dir` for the session''s folder.


    Then:

    The session is a working one when a `hi` line of this session''s stamp follows its first `session-start`
    in the logs walked; the folder is the first such `hi`.

    **＋** A `session-start` of another session, before or after, changes nothing; a `resume` or `compact`
    of our own still does not close the window (case 14).

    **－** A `hi` with `--------` or another stamp does not count.

    **＋** `estimate-ledger-write-lifts` gets a `### case 111.3` block, `pending`; the test seeds our start,
    a foreign `resume` and a stamped `hi` and expects the window open, and a `--------` `hi` alone and
    expects it refused.'
  set:
    status: pending
  change: 'criterion: case 111.3 added'
  applied: 09:59:51
