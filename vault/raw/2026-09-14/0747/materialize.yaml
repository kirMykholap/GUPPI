- case: '111.1'
  decision: decision-case-111.1
  origin: raw/2026-09-14/0747/ledger.md#case-111.1
  targets:
  - kind: update
    category: rules
    slug: rule-event-log
    ref: rule-event-log
  tags: []
  case_text:
    given: '`UserPromptSubmit` fires on every prompt; there is no matcher on the prompt text, so the filter
      is the script''s. The payload carries `session_id` and `prompt`. The `!` substitution of the skill
      sees no session id (`--------` on every `hi` line today); a `PreToolUse Skill` hook does not see
      a command the person types (`rule-skill-hi`, Purpose). `guppi event tool` already runs once per
      tool call, on `PostToolUse` with no matcher.

      **＋** `hi_moment` takes the first `hi` of the window; a second `hi` line of the same session changes
      nothing there, it is log noise.

      **＋** The `hi` of this session in the logs walked: `session_event_logs` from today back to the first
      date holding this session''s `session-start` (case 55.1).'
    when: The person submits a prompt and the `UserPromptSubmit` hook `uv run guppi event prompt` runs.
    then: 'When the prompt, trimmed, is `/hi` or starts with `/hi `, and no `hi` of this session''s stamp
      follows its first `session-start` in the logs walked, the log gains `- HH:MM:SS <stamp> hi`, the
      stamp from the payload''s `session_id`.

      **＋** A second `/hi` of the same session writes nothing: one session, one `hi` line.

      **＋** Any other prompt writes nothing; exit 0 either way, an error on stderr only.

      **＋** The "Known limit" paragraph of the page says the limit is lifted by this Case; a `hi` of one
      session no longer belongs to another.

      **＋** `estimate-event-log-records` gets a `### case 111.1` block, `pending`; read at the next `/hi`:
      the log carries `<stamp> hi` for that session, and a repeated `/hi` adds no line.'
