  derived: true
  criterion_block: '### case 124.2


    When:

    `guppi generate` applies a yaml entry whose target is a page of `insights/`.


    Then:

    A `defer` with an Insight as its target appends the decision slug to its `deferred_by`, as for a Rule;
    `KEY_ORDER["insights"]` gains `deferred_by` after `addressed_by`; a `supersedes` removes it through
    the same `clear_deferred_by`.

    **＋** An `update` with `set: {addressed_by: decision-case-N}` writes the field, and on every write
    of an Insight page the `## Addressed by` section is derived from the field — `- [[decision-case-N]]`
    — as a lesson''s `## Insight` is from `insight` (114); without the field there is no section.

    **＋** An `update` with `set: {status: actioned}` goes as any `update`; the cascade of the same run
    archives the `clustered` children (104.2) and recounts `severity`.

    **＋** `estimate-generate-writes` gets a `### case 124.2` block, `pending`; the test: a `defer` on
    an insight → `deferred_by` written and shown in `insights-index.md`; an `update` with `addressed_by`
    and `status: actioned` → `## Addressed by` with the link, the children `archived`; a `supersedes`
    clears `deferred_by`.

    **－** An Insight is neither created nor deleted through the yaml: a `create` or `delete` with an Insight
    as its target is a `generate` error, as today.'
  set:
    status: pending
  change: 'criterion: case 124.2 added'
  applied: '12:13:27'
