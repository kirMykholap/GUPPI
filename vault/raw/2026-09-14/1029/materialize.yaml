  case_text:
    context: '`ask-guppi` read the plan whole (the dispatch of case 128). Its findings: (1) `sections:
      Language` in 123 — `## Language` lies inside the Render markers of `rule-claude-md`; `split_sections`
      gives it to the Render block, a `sections` entry would add a second section and `CLAUDE.md` would
      not change. (2) The `old` of 124.2, "a `defer` marks its target `deferred_by`", came from the docstring
      of `generate.py`; the page has no such phrase; the whole 124.2 entry would fail. (3) `sections:
      Addressed by` in 124.2 is an Insight section, not a Rule one; the Rule page would gain a stray section.
      (4) 122 leaves `rule-retro-commit` false: "Any other skill or tool: exit 0". (5) 122 and 125 give
      the event log a second job while `rule-event-log` says "Its one governance job is to carry the `hi`
      mark". (6) 130.1 said "`generate` takes it no more" — wrong: `generate` skips `applied` only; 112.6
      fails once more in the librarian''s run (a flag), then `archive` moves `0747` on `superseded_by`.
      (7) `rule-harness` Purpose: "Two more belong here and run in no pipeline" — three after 127. (8)
      `rule-retro` Purpose: "a line of today''s ledger" — 109.1 promised "this session''s", the page did
      not change. (9) `rule-brief` Purpose: "every deferred item lives on as a draft page" — an Insight
      in Deferred is no draft page. (10) `rule-ledger-tail` names `/hi` alone; 126 adds `/retro`.'
    problem: 'Four amendments touch blocks already signed; they cannot change silently. Six pages need
      new `update` entries, all `contract: same`: no contract changes, the text that became false does.'
    given: 'Every `old` text below was checked on its page (`rule-retro-commit` 28, `rule-event-log` 22–23,
      `rule-harness` 20–22, `rule-retro` 24, `rule-brief` 21–22, `rule-ledger-tail` 19, `rule-claude-md`
      73–75, `rule-page-generation` 44 and 51).

      **＋** `rule-retro-commit`: `estimate-retro-commit-gates` says "another skill or another tool, exit
      0 whatever the tree" — on the tree that stays true; the refusal of 122 is on another ground; `contract:
      same`.

      **＋** `rule-event-log`, `rule-retro`, `rule-brief` already get an `update` in this session (125,
      126, 124.1) — a second entry on a page in ledger order, allowed; `rule-page-generation` gets a block
      amendment, not a new entry.

      **－** No new Estimate block: no `when` or `then` changes.'
    when: '`generate` applies the entries of this Case; the librarian reads `materialize.yaml`.'
    then: 'The blocks of 123, 124.2 and 130.1 in the Spec are amended as the context says, before Plan
      Mode ends: 123 a `replace` of the three sentences; 124.2 the `old` of line 51 and the `## Addressed
      by` text as a second `replace` into `How it works`; 130.1 the `－` line stating the retry.

      **＋** `rule-retro-commit`: "Any other skill or tool: exit 0." → "Any other tool: exit 0; any other
      skill: exit 0 on the tree — the same hook refuses any skill while a `then` item of the session''s
      Spec has no ledger line (`rule-ledger-write`, case 122)."

      **＋** `rule-event-log`: "Its one governance job is to carry the `hi` mark that tells the ledger
      hook a working session is open." → "Its governance jobs: to carry the `hi` mark that tells the ledger
      hook a working session is open, and to name the session''s plan file by its `tool Write:` and `tool
      Edit:` lines for `guppi gate` (case 122)."

      **＋** `rule-harness`: "Two more belong here and run in no pipeline: the hook that refuses a hand
      edit of a rendered file, and the page `CLAUDE.md` is rendered from (cases 59.6, 59.8)." → "Three
      more belong here and run in no pipeline: the hook that refuses a hand edit of a rendered file, the
      hook that refuses a heredoc with a backslash or a file write, and the page `CLAUDE.md` is rendered
      from (cases 59.6, 59.8, 127)."

      **＋** `rule-retro`: "work a line of today''s ledger ratified" → "work a line of this session''s
      ledger ratified".

      **＋** `rule-brief`: "every deferred item lives on as a draft page and pre-task finds it there" →
      "every deferred item lives on as a page — a draft placeholder, or the open Insight itself — and
      pre-task finds it there".

      **＋** `rule-ledger-tail`: "Shows at `/hi` every ledger line that no vault page holds yet." → "Shows
      at `/hi`, and at `/retro` since case 126, every ledger line that no vault page holds yet."

      **－** Finding 6 is no page: the `－` line of 130.1 is corrected; the librarian''s flag is expected.'
