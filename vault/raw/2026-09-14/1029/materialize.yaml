  tags: []
  case_text:
    context: '`## Language` of `CLAUDE.md` (the Render of `rule-claude-md`, lines 71–75) says: English
      for everything written into the repository; Russian for chat with the owner "and for the plan he
      reads in order to approve it". `case-schema.md` `## Language` says: Russian in the chat with the
      owner, English in everything that lands in the vault. In session M Case 115 was discussed in the
      chat in English and the Spec was written in English. Today Case 122 went the same way.'
    problem: 'The rule does not say in which language a Case is discussed in the chat. The agent reads
      "the plan in Russian" as leave to write the Case in English, because the Case is the plan to come.
      The Spec is English in practice, and that is right: it lands in `raw/` and in the vault.'
    given: '`rule-claude-md` (`MOC`, `built`, `render_mode: full`, `governs: CLAUDE.md`, `estimate-claude-md-rendered`
      `passed`): the `## Language` section is three sentences inside the Render markers, so the change
      is a `replace` of the three (a `sections` entry would add a second `## Language` outside the Render
      — pre-task finding 1 of case 132), and `guppi render` carries it into `CLAUDE.md`.

      **＋** `case-schema.md` is a Rule-class file: an `update` with `file` and `change`, applied by hand
      in Work Mode; its `## Language` (line 29) is one sentence.

      **＋** `rule-case-protocol` is not touched: the form of a Case does not change, only its language.

      **＋** The Spec of session M (`raw/2026-09-14/0747/spec.md`) is already English; the practice of
      the Spec does not change.

      **－** Ledger lines, slugs, field and section names (`context`, `given`, `then`), paths and quotations
      from pages stay English in either language.

      **－** The Frontier line F13 closes on this Case.'
    when: The agent writes a Case in the chat, or carries a ratified Case into the Spec, or reads `CLAUDE.md`
      and `case-schema.md`.
    then: '`## Language` of `rule-claude-md` reads: "English for everything written into the repository:
      code, identifiers, comments, pages, commit messages, documents — the Spec included. Russian for
      chat with the owner: a Case is discussed in the chat in Russian, all its sections, and enters the
      Spec translated into English. Slugs, field names, ledger lines, paths and quotations from pages
      stay as they are in either language. English technical terms are not transliterated into Cyrillic."

      **＋** `## Language` of `case-schema.md` reads: "Short sentences. One idea per sentence. Active voice.
      A common word over a term. Russian in the chat with the owner: a Case is discussed there in Russian,
      all its sections. English, in the manner of ASD-STE100 Simplified Technical English, in everything
      that lands in the vault: the Case enters the Spec translated, its slugs, field names and ledger
      lines unchanged."

      **＋** `CLAUDE.md` after `guppi render` carries the new section; the reading of `estimate-claude-md-rendered`
      is a Work Mode task.

      **－** `rule-claude-md` is a MOC with no Estimate of its own behaviour; no `contract` is written.'
  spec: vault/raw/2026-09-14/1029/spec.md
  applied: '12:13:27'
- case: '122'
  decision: decision-case-122
  origin: raw/2026-09-14/1029/ledger.md#case-122
  targets:
  - kind: update
    category: rules
    slug: rule-ledger-write
    ref: rule-ledger-write
  - kind: update
    category: rules
    slug: rule-case-protocol
    ref: rule-case-protocol
  tags: []
  case_text:
    context: 'Four lessons on one writer: `lesson-ledger-hook-misses-a-reply-ending-in-a-tool-call` (F),
      `lesson-ledger-hook-drops-a-block-followed-by-tool-calls-in-the-turn` (I, archived), `lesson-transcript-omits-text-emitted-before-tool-calls`
      (L) and `lesson-ledger-lines-lost-in-a-reply-ending-in-a-skill-call-with-the-insight-live` (M).
      The `Stop` hook reads the final text of a turn; a reply that ends in `Skill`, `ExitPlanMode` or
      any tool call has no `Stop` and its text is not in the transcript. The Insight''s Proposal has stood
      unactioned since session I. (Case 117 as it stands.)'
    problem: 'The rule "a reply with ledger lines ends in text" lives in the agent''s memory only, and
      the agent broke it with the lesson live. Either the hook reaches those lines — a `PreToolUse` hook
      on `Skill|ExitPlanMode` that reads the reply under way, if the payload carries it — or the harness
      makes the agent''s rule mechanical: `CLAUDE.md` says it, and `guppi gate` refuses a `Skill` call
      while the reply holds an unwritten `LEDGER` block. Which of the two is measurable is a Plan Mode
      of its own. (Case 117 as it stands.)'
    given: 'Measured in session N at 10:4x: a text emitted before a `Bash` call in the same reply is absent
      from `~/.claude/projects/…/19037d1c….jsonl` — the assistant records around it are `thinking` and
      `tool_use` only — and session M''s transcript holds no assistant text between the owner''s «ратифицирую»
      (record 650) and the `Skill` call of `/pre-task` (679): the block of 115 and 116 was never persisted.
      A `PreToolUse` payload carries `tool_name`, `tool_input`, `transcript_path`, no reply text. The
      question of the Insight''s Proposal is settled: absent, not dropped.

      **＋** `rule-ledger-write` (`Leaf`, `draft`, `estimate-ledger-write-lifts` `pending` on blocks 111.3,
      111.6): "a reply that ended in a tool call reaches the ledger at the next `Stop` of the session"
      — true only when the agent repeats the block. `deferred_by: [decision-case-117]`.

      **＋** `guppi gate` (`rule-retro-commit`, `built`) already runs on `PreToolUse` with the matcher
      `Skill` and refuses `/handoff` on a dirty tree; `.claude/settings.json` needs no change, `rule-hook-registry`
      is not touched.

      **＋** `guppi pretask --check` already finds "item […] has no decision line" (`pretask.check_lines`,
      `window_lines`, `session_decisions`, `split_cases`, `then_blocks`); the gate reuses them and reports
      only that half. `rule-pretask` is not changed: the check at `/pre-task` stays as it is.

      **＋** The plan file is in no payload; the event log holds `tool Write:` / `tool Edit:` lines with
      the full path (`- 07:52:53 fde37e7c tool Write: C:\Users\kir\.claude\plans\async-sauteeing-moon.md`).
      The gate takes the last such path of this session''s stamp under `.claude/plans/`. Retro''s defers
      go to `spec.md` only, so the gate reads that file too; `/handoff` after a Retro reply with defer
      lines is refused the same way.

      **＋** `rule-case-protocol` (`Leaf`, `built`, `render` into `CLAUDE.md`, `estimate-case-protocol-loaded`
      `passed`): the paragraph "Ledger lines are written by the `Stop` hook, from the reply, verbatim"
      says nothing about where in the reply.

      **－** `estimate[...]` and `lesson[...]` lines have no source but the text; the gate does not see
      them. The sentence in `CLAUDE.md` covers them; a loss of one is still a Retro finding, as today.

      **－** `ExitPlanMode` is not gated here: `/pre-task` precedes it and is a `Skill` call, so a reply
      that ratifies and closes Plan Mode at once is refused at the `/pre-task` step.

      **－** Without a `hi`, without a Spec and without a plan path in the log the gate has nothing to
      check and exits 0; the `/handoff` refusal of `rule-retro-commit` stays as it is.

      **－** The Frontier line F1 closes on this Case.'
    when: The agent calls a skill through the `Skill` tool and `guppi gate` runs.
    then: 'The gate reads the `then` items of every Case in the session''s `spec.md` and in the plan file
      the session''s event log names last under `.claude/plans/`, and the decision lines of the session''s
      window as `guppi pretask --check` reads them.

      **＋** When an item has no decision line of its Case, the gate exits 2 and writes nothing: `gate:
      /<skill> refused — N item(s) of the Spec have no ledger line (case A, case B). The text before a
      tool call is never kept: end this reply in text with the LEDGER block, then call /<skill> in the
      next reply.`

      **＋** Every item with its line, or no source found: exit 0, silent; the `/handoff` check of the
      dirty tree runs as before.

      **＋** `rule-ledger-write` gains `guppi/gate.py` and `tests/test_gate.py` in `implementation_ref`;
      its "How it works" says the gate, not the agent''s memory, holds the reply back.

      **＋** `rule-case-protocol` says, after the paragraph on the `Stop` hook: "A reply that carries a
      `LEDGER` block ends in that text. No tool call follows it in the same reply: the text before a tool
      call is never kept, and the hook reads nothing." — rendered into `CLAUDE.md`, `contract: same`.

      **＋** `estimate-ledger-write-lifts` gets a `### case 122` block, `pending`; the test seeds a plan
      with one item and an empty ledger and expects exit 2 with the case named, then the item''s line
      and expects 0, then no plan path and no `spec.md` and expects 0; the live half is read at the first
      `/pre-task` of this session after its lines are written: the call passes.

      **－** `{supersedes:case 117}`: `decision-case-117` is superseded, `rule-ledger-write` loses `deferred_by`.'
