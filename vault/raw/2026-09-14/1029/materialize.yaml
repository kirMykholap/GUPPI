  criterion_block: '### case 122


    When:

    The agent calls a skill through the `Skill` tool and `guppi gate` runs.


    Then:

    The gate reads the `then` items of every Case in the session''s `spec.md` and in the plan file the
    session''s event log names last under `.claude/plans/`, and the decision lines of the session''s window
    as `guppi pretask --check` reads them.

    **＋** When an item has no decision line of its Case, the gate exits 2 and writes nothing: `gate: /<skill>
    refused — N item(s) of the Spec have no ledger line (case A, case B). The text before a tool call
    is never kept: end this reply in text with the LEDGER block, then call /<skill> in the next reply.`

    **＋** Every item with its line, or no source found: exit 0, silent; the `/handoff` check of the dirty
    tree runs as before.

    **＋** `rule-ledger-write` gains `guppi/gate.py` and `tests/test_gate.py` in `implementation_ref`;
    its "How it works" says the gate, not the agent''s memory, holds the reply back.

    **＋** `rule-case-protocol` says, after the paragraph on the `Stop` hook: "A reply that carries a `LEDGER`
    block ends in that text. No tool call follows it in the same reply: the text before a tool call is
    never kept, and the hook reads nothing." — rendered into `CLAUDE.md`, `contract: same`.

    **＋** `estimate-ledger-write-lifts` gets a `### case 122` block, `pending`; the test seeds a plan
    with one item and an empty ledger and expects exit 2 with the case named, then the item''s line and
    expects 0, then no plan path and no `spec.md` and expects 0; the live half is read at the first `/pre-task`
    of this session after its lines are written: the call passes.

    **－** `{supersedes:case 117}`: `decision-case-117` is superseded, `rule-ledger-write` loses `deferred_by`.'
  set:
    status: pending
  change: 'criterion: case 122 added'
  applied: '12:13:27'
