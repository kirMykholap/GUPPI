      as it stands.)
    given: '`rule-bash-guard` is a placeholder (`draft`, `deferred_by: [decision-case-120]`, no `kind`,
      `estimates` or `tags`: 4 `schema` and 1 `orphan` lint findings). `generate` fills a placeholder
      on a `create` and keeps its `deferred_by` (`generate.py:400`); a `supersedes` clears it. The slug
      is taken by the placeholder itself — that is the target.

      **＋** `rule-harness` (`MOC`): children `rule-render-harness, rule-settings, rule-lint, rule-index,
      rule-governed-files-hook, rule-claude-md`; `rule-governed-files-hook` (`guppi/guard.py`) is the
      model: `PreToolUse` on `Edit|Write|MultiEdit`, a line in the event log before the refusal, exit
      2 with the reason, never raises, exit 0 on an unreadable payload.

      **＋** `rule-hook-registry` (`Leaf`, `built`, `estimate-hook-registry-rendered`): the Render''s `PreToolUse`
      holds three matchers; a new matcher `Bash` is `contract: same`, as 111.2 was: the Estimate checks
      that the render reproduces the file, not which hooks it holds.

      **＋** Today''s case: `cat >> plan.md <<''EOF''` with the body of a Case failed with "unexpected
      EOF while looking for matching quote" — the second face of the same trap, a file written by a heredoc;
      Edit worked.

      **－** Tags `hooks`, `harness`; no new tag.

      **－** Not refused: a `<<<` here-string; a heredoc without a backslash whose output goes to a pipe
      or the screen; `python - <<''EOF''` with a clean body.

      **－** The Frontier line F6 closes on this Case.'
    when: The agent calls the `Bash` tool and the hook `uv run guppi bashguard` runs on `PreToolUse`.
    then: 'The hook reads `tool_input.command`, finds every heredoc (`<<` or `<<-`, the marker quoted
      or not) and its body up to the closing line. A body with a backslash, or a marker line that redirects
      into a file (`>` / `>>` not to `/dev/null`, `tee`) — exit 2, the reason on stderr: `bashguard: heredoc
      refused — <a backslash in its body | it writes <path>>. Write the script with the Write tool into
      the scratchpad and run it by path; change a file with Edit.`

      **＋** Before the refusal one line `- HH:MM:SS <stamp> bashguard: <reason>` goes to `raw/<date>/event_log.md`
