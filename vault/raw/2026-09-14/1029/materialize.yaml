    Criterion: '### case 127


      When:

      The agent calls the `Bash` tool and the hook `uv run guppi bashguard` runs on `PreToolUse`.


      Then:

      The hook reads `tool_input.command`, finds every heredoc (`<<` or `<<-`, the marker quoted or not)
      and its body up to the closing line. A body with a backslash, or a marker line that redirects into
      a file (`>` / `>>` not to `/dev/null`, `tee`) — exit 2, the reason on stderr: `bashguard: heredoc
      refused — <a backslash in its body | it writes <path>>. Write the script with the Write tool into
      the scratchpad and run it by path; change a file with Edit.`

      **＋** Before the refusal one line `- HH:MM:SS <stamp> bashguard: <reason>` goes to `raw/<date>/event_log.md`
      (case 91).

      **＋** Any other tool, a command without a heredoc, a heredoc without a backslash and without a file
      write, an unreadable payload — exit 0, the last with a line on stderr; the hook never raises.

      **＋** `rule-bash-guard` is a `Leaf`, `enforcement: hook`, `implementation_ref: [guppi/bashguard.py,
      tests/test_bashguard.py, .claude/settings.json]`, `parent: rule-harness`, `tags: [hooks, harness]`;
      `estimate-bash-guard` (`QA`), `pending`: the test on `python - <<''EOF''` with `\n` in the body
      → 2; `cat > f <<EOF` → 2; a heredoc with a clean body into a pipe → 0; a command without a heredoc
      → 0; an unreadable payload → 0; the live reading is the first refusal in Work Mode or, without one,
      the test.

      **＋** `rule-hook-registry`: in `PreToolUse` after the matcher `Edit|Write|MultiEdit` — `{ "matcher":
