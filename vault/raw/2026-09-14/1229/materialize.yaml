- case: '133'
  decision: decision-case-133
  origin: raw/2026-09-14/1229/ledger.md#case-133
  targets:
  - kind: update
    category: file
    slug: insights-schema-yaml
    path: vault/wiki/insights/schema.yaml
    ref: insights-schema-yaml
  tags: []
  case_text:
    context: 'Case 124.3 added a `deferred_by` row to `insights/schema.md` (no; a list of decision slugs;
      the `defer` decisions that postponed the Insight, set by `generate`, cleared by a `supersedes`).
      Lint requires `schema.md` and `schema.yaml` to agree, so Work Mode of session N added `deferred_by`
      to `optional` of `schema.yaml` with a two-line comment — commit `a5dc64e`, outside every `then`
      block. The brief raised it as a Flag: ratify or revert.'
    problem: The line lives in a Rule-class file and nobody signed it. A revert breaks lint and `generate`
      (124.2 writes `deferred_by` on an Insight at a `defer`; Case 129 already did). A signature after
      the fact is the one path on which the chain 124.2 → 124.3 → yaml agrees.
    given: '`vault/wiki/insights/schema.yaml` at HEAD: `optional: [addressed_by, deferred_by]` and the
      comment "`deferred_by`: the `defer` decisions that postponed the Insight; set by `generate`, cleared
      by a `supersedes` (case 124.2)".

      **＋** `rules/schema.yaml` and `entities/schema.yaml` carry the same line with the same comment,
      signed by Case 52.3.

      **＋** `guppi lint` today: 74 findings, none on `insights/schema` — md and yaml agree.

      **＋** Slug precedent: `decisions-schema-yaml`, `rules-schema-yaml`, `estimates-schema-yaml` (Cases
      31.1, 52.3, 72.2) — here `insights-schema-yaml`.

      **－** `generate` already leans on the line: `decision-case-129` stands in `deferred_by` of two Rule
      pages, and any future `defer` with an Insight as target writes the field on the Insight.'
    when: Someone reads `vault/wiki/insights/schema.yaml`, or `guppi lint` compares it with `insights/schema.md`.
    then: '`optional` holds `deferred_by`, with the comment below it as in `a5dc64e`; lint gives no finding
      on the Insight md/yaml pair.

      **＋** The file does not change: the `update` signs the text that already stands at HEAD.

      **－** Rule-class file: no Estimate, applied by hand (here — already applied).

      **－** The Frontier line F3 closes on this Case.'
  spec: vault/raw/2026-09-14/1229/spec.md
  applied: '15:01:46'
- case: '134'
  decision: decision-case-134
  origin: raw/2026-09-14/1229/ledger.md#case-134
  targets:
  - kind: update
    category: insights
    slug: insight-session-vault-knowledge-not-loaded
    ref: insight-session-vault-knowledge-not-loaded
  tags: []
  case_text:
    context: 'An Insight of severity 5, `open` since 2026-09-12, five children. Pattern: a fact the vault
      holds does not reach the session that needs it — only `brief.md`, `CLAUDE.md`, the skills and the
      agent frames are loaded, and everything else waits for a read the agent must first think to make.
      The page''s Proposal: a second channel beside the brief — the ledger tail at `/hi`, and a way for
      a Rule page to name the lessons that bear on it; prompt or hook, a Case of its own.'
    problem: 'The children fall into two groups, and each has a mechanical answer already. The first child
      (readings after the librarian invisible to the next `/hi`) is closed by `rule-ledger-tail` (101.2,
      `built`, `estimate-ledger-tail` `passed`; the `Tail:` line of `/hi`). The four heredoc children
      are closed by `rule-bash-guard` (127): the hook refuses instead of the agent remembering a lesson;
      the first live refusal today at 12:34. What stays open is the second half of the Proposal — "a Rule
      page names its lessons". Decide: is the Insight actioned, and what becomes of that half.'
    given: '`insight-session-vault-knowledge-not-loaded`: `open`, `severity: 5`, children `lesson-readings-after-librarian-invisible-to-next-hi`,
      `lesson-vault-lesson-absent-at-the-moment-it-applies`, `lesson-heredoc-trap-hit-twice-with-its-lesson-live`,
      `lesson-heredoc-trap-hit-a-third-time-in-work-mode`, `lesson-heredoc-trap-hit-a-fourth-time-in-the-session-that-ratified-its-hook`;
      all `clustered`.

      **＋** `rule-ledger-tail` `built`, `estimate-ledger-tail` `passed`: `/hi` prints the unmaterialized
      ledger tail — the answer to the first child.

      **＋** `rule-bash-guard` `built`, `estimate-bash-guard` `passed` (the test of 127, the live refusal
      at 12:34 today) — the answer to the four heredoc children.

      **＋** `insights/schema.md`: `addressed_by` is one decision slug, "the ratified decision that fixed
      the pattern, or rejected it (case 124)"; `## Addressed by` is derived by `generate` from the field
      (124.2).

      **＋** The cascade of `generate` (104.2): the children of an actioned Insight go `archived`; `cleanup`
      moves the five lesson pages to the archive; `severity` is recomputed over the live children.

      **＋** `actioned` is not an end state: a new lesson with the same root cause returns the Insight
      to `open`, the old children stay archived (schema.md).

      **－** An Insight is not a Leaf: no `contract`, no Estimate; `generate` accepts an `update` of an
      Insight, not a `create` or `delete` (124.2).

      **－** The first `update` of an Insight under 124: the `then` block carries `set` with `status` and
      `addressed_by`, and `change` for History.'
    when: '`guppi generate` applies the entry; then someone reads the Insight page or the brief.'
    then: '`insight-session-vault-knowledge-not-loaded`: `status: actioned`, `addressed_by: decision-case-134`;
      `## Addressed by` derived from the field; History carries the line `open → actioned`.

      **＋** The five children are `archived` by the cascade and moved by `cleanup`; `severity` recomputed.

      **＋** The Insight leaves the Deferred list of the next brief; it returns when the librarian puts
      a new lesson into it.

      **－** The half of the Proposal "a Rule page names its lessons" is rejected by this same decision:
      a list of lessons on a page is one more text the agent must remember to read, the class of channel
      that failed four times; the channel that worked is lesson → Insight → brief (124.1) → Case (124)
      → hook (127). No new Rule, no new field.

      **－** The Frontier line F4 closes on this Case.'
  spec: vault/raw/2026-09-14/1229/spec.md
  applied: '15:01:46'
- case: '135'
  decision: decision-case-135
  origin: raw/2026-09-14/1229/ledger.md#case-135
  targets:
  - kind: update
    category: insights
    slug: insight-ledger-line-written-unchecked
    ref: insight-ledger-line-written-unchecked
  tags: []
  case_text:
    context: 'An Insight of severity 4, `open` since 2026-09-12, four children. Pattern: a ledger line
      is written verbatim and nothing reads it back until `materialize`, so a line that does not parse
      or does not match the Spec costs a session. The page''s Proposal: (a) `guppi pretask --check` already
      reads the ledger for the `then`-item comparison (59.1) — put every line through `materialize.parse_line`
      in the same pass; (b) the table of `case-schema.md` should show `decision[case N]`, not `decision[case_id]`
      (Case 67 deferred it).'
    problem: 'Both halves of the Proposal were ratified on the day the Insight was created — session I,
      2026-09-12: 75.2 (the grammar of the lines at pre-task) and 75.1 (the table of `case-schema.md`,
      `index.md`, `rule-case-protocol`). The Insight was not updated because an Insight could not be a
      Decision target then (124 made it one). The other children were closed on the way: 59.1 (every line
      to its `then` item and back), 72.5 (no nested Estimates any more — the Estimate is derived from
      a Leaf `create`, pre-task checks `method` and the slug), 122 (`guppi gate` refuses a Skill call
      while a `then` item has no line — a preview in `ratification` no longer passes for the record).
      Decide: is the Insight actioned.'
    given: '`insight-ledger-line-written-unchecked`: `open`, `severity: 4`, children `lesson-spec-then-items-unchecked-against-ledger-lines`,
      `lesson-ledger-decision-line-written-without-the-case-word`, `lesson-ledger-preview-in-ratification-taken-for-the-record`,
      `lesson-pretask-nested-estimate-exempt-from-the-line-check`; all `clustered`.

      **＋** `rule-pretask` `built`, `estimate-pretask-reconciles` `passed`: the `### case 75.2` block
      — every record line of the window through `materialize.parse_line`, one that does not read is a
      finding with its date and line number, exit 1; `check_grammar` in `guppi/pretask.py`; the blocks
      of 59.1 and 72.5 on the same page.

      **＋** `case-schema.md`, the table "What a Case produces": `- decision[case 12][update][rule-x]{ref:rule-x}`;
      "The id is `case N` — the word and a space … (case 75.1)".

      **＋** `rule-ledger-write` `built`, `estimate-ledger-write-lifts` `passed` with the block of 122:
      `guppi gate` on `PreToolUse Skill` refuses while a `then` item of the Spec has no decision line.

      **＋** `CLAUDE.md` (Case protocol): a line outside a `LEDGER` fence is a preview, never a record.

      **＋** The cascade of 104.2: the four children go `archived`, `cleanup` moves them; `actioned` is
      not an end state.

      **－** An Insight is not a Leaf: no `contract`, no Estimate.

      **－** The `Stop` moment stays verbatim: the hook does not validate the grammar — signed so in 75.2,
      not changed here.'
    when: '`guppi generate` applies the entry; then someone reads the Insight page or the brief.'
    then: '`insight-ledger-line-written-unchecked`: `status: actioned`, `addressed_by: decision-case-135`;
      `## Addressed by` derived from the field; History carries `open → actioned`.

      **＋** The four children are `archived` by the cascade and moved by `cleanup`; `severity` recomputed.

      **＋** The Insight leaves the Deferred list of the next brief; it returns with a new lesson of the
      same cause.

      **－** No new code, no change to `rule-ledger-write` or `rule-pretask`.

      **－** The Frontier line F5 closes on this Case.'
  spec: vault/raw/2026-09-14/1229/spec.md
  applied: '15:01:46'
