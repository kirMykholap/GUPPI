  criterion_block: '### case 136.1


    When:

    The agent calls the Skill tool with `pre-task`, `retro` or `handoff`, and `guppi gate` on `PreToolUse`
    lets the call through.


    Then:

    The gate appends one line `- HH:MM:SS <stamp> <mark>` to `raw/<date>/event_log.md` — `pretask`, `retro`
    or `handoff`, the stamp from the payload''s `session_id` — in the form `guppi event` writes; on a
    refusal there is no line.

    **＋** The Render of `rule-pretask`, `rule-retro`, `rule-handoff` loses its `Recorded:` line; `guppi
    event <name>` stays as a CLI, the skills do not call it.

    **＋** `rule-event-log`: `implementation_ref` gains `guppi/gate.py`, `tests/test_gate.py`; the paragraph
    on the marks says who writes them; `contract: changed`; `estimate-event-log-records` gets a `### case
    136.1` block, `pending`: the test — a Skill payload `pre-task` → the line `<stamp> pretask`; `handoff`
    on a dirty tree → refused and no line; the live reading — the `/pre-task` of this session with the
    stamp `07a95bd2`.

    **＋** `rule-pretask`, `rule-retro`, `rule-handoff`: `contract: same`.

    **－** Other skills (`hi`, `grill-me`) get no mark.

    **－** The Frontier line F12 closes on this sub-case.'
  set:
    status: pending
  change: 'criterion: case 136.1 added'
  applied: '15:01:46'
