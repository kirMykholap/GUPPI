  case_text:
    when: The agent calls the Skill tool with `pre-task`, `retro` or `handoff`, and `guppi gate` on `PreToolUse`
      lets the call through.
    then: 'The gate appends one line `- HH:MM:SS <stamp> <mark>` to `raw/<date>/event_log.md` — `pretask`,
      `retro` or `handoff`, the stamp from the payload''s `session_id` — in the form `guppi event` writes;
      on a refusal there is no line.

      **＋** The Render of `rule-pretask`, `rule-retro`, `rule-handoff` loses its `Recorded:` line; `guppi
      event <name>` stays as a CLI, the skills do not call it.

      **＋** `rule-event-log`: `implementation_ref` gains `guppi/gate.py`, `tests/test_gate.py`; the paragraph
      on the marks says who writes them; `contract: changed`; `estimate-event-log-records` gets a `###
      case 136.1` block, `pending`: the test — a Skill payload `pre-task` → the line `<stamp> pretask`;
      `handoff` on a dirty tree → refused and no line; the live reading — the `/pre-task` of this session
      with the stamp `07a95bd2`.

      **＋** `rule-pretask`, `rule-retro`, `rule-handoff`: `contract: same`.

      **－** Other skills (`hi`, `grill-me`) get no mark.

      **－** The Frontier line F12 closes on this sub-case.'
    context: 'An Insight of severity 3, three children: the `hi` lost at midnight (session H), the `hi`
      taken by a session started in the same second (M), and the `pretask` line unstamped and bound by
      position (N). One cause: a mark in the event log without a session id, and a reader that binds it
      to a session by the `session-start` lines around it. The `hi` half is closed by Case 111: the `UserPromptSubmit`
      hook writes `<stamp> hi`, the readings 111.1/111.3/111.6 and 125 passed — today `12:29:47 07a95bd2
      hi`. What remains: (1) the marks `pretask`, `retro`, `handoff` are still written through a `!` substitution
      with an empty `CLAUDE_SESSION_ID` — `--------` — and `pretask.window` counts any `pretask` after
      our `hi`; (2) `ledger.py` keeps the fallback of 111.6 — a `--------` `hi` by position, kept for
