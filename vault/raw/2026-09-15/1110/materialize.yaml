  criterion_block: '### case 159


    When:

    The agent writes a Case in the chat — at its first showing, when shown again after the owner''s change,
    and with sub-cases.


    Then:

    `context`, `problem`, `recommend` are blockquotes without operands, the slug of the thing described
    only, up to seven sentences each: `context` — what the thing is and how it works today, for a reader
    who has not opened the pages, no line numbers and no quotation unless the Case is about one; `problem`
    — what is wrong, or the question answered, one paragraph; `recommend` — the choice and why, the rejected
    option in one sentence.

    **＋** `given` — one fact per line, only those a line of `then` depends on: the state of the pages
    changed; the rule that constrains; the vault''s answer; the test that fixes the behaviour. The first
    line bare, then **＋** "and also", **－** "but not / does not apply here". No history, no quotation
    for its own sake.

    **＋** `then` — behaviour only: **＋** what also holds, **－** what does not happen; no `contract`, Estimate
    blocks, readings or `supersedes`.

    **＋** A new section `tasks` between `then` and `ratification`: a blockquote with a checklist, one
    line per page `update` with its `contract`, Estimate block, file, test, command, reading — the same
    lines that go into the Spec''s `tasks` block.

    **＋** Slugs, file names and field values in code spans; bold only for section labels and operands.

    **＋** Sub-cases: the story and the shared `given` on the parent; each `### Case N.M` has its own `when`,
    `then`, `tasks`, `ratification`.

    **＋** One horizontal rule, after the Case or its last sub-case, and only when the agent''s own text
    follows.

    **－** The Spec as today: `context`, `problem`, `given`, `when`, `then` as blockquotes in English,
    the `then` and `tasks` blocks; the `tasks` section of the chat is its `tasks` block.

    **－** The acknowledging reply (157) and the short form of a defer do not change.'
  set:
    status: pending
  change: 'criterion: case 159 added'
  applied: '14:39:28'
