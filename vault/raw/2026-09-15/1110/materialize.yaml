- case: '155'
  decision: decision-case-155
  origin: raw/2026-09-15/1110/ledger.md#case-155
  targets:
  - kind: update
    category: rules
    slug: rule-ask
    ref: rule-ask
  - kind: update
    category: rules
    slug: rule-pretask
    ref: rule-pretask
  tags: []
  case_text:
    context: 'The description line of the Render of `rule-ask` says "One short question per Case". `CLAUDE.md`
      (the Render of `rule-case-protocol`) already says otherwise: a question before a `create` without
      a `ref`, and `/pre-task` asks once for the set. Session P dispatched `ask-guppi` six times, four
      of them before an `update` with a `ref`, about 355k tokens in subagents; there the page itself and
      two Greps would have given the `given`. Case 154 deferred the decision to this Plan Mode.'
    problem: 'Whether the text of `rule-ask` follows the practice: one question before a `create` without
      a `ref`, one at pre-task, an `update` with a `ref` reads the page itself. The Purpose of `rule-pretask`
      carries the same phrase, "The per-Case question to `ask-guppi`".'
    given: '`rule-ask` (`draft`, `deferred_by: [[decision-case-154]]`, `render`, governs `.claude/agents/ask-guppi.md`):
      description "… One short question per Case."; its Purpose names the callers — the agent at pre-task,
      the librarian, the person — and does not say "per Case".

      **＋** `rule-case-protocol` → `CLAUDE.md` line 88: "Before a `create` without a `ref`, ask the vault
      first … Dispatch the `ask-guppi` agent with one short question." — the `create` moment is ratified
      there already.

      **＋** `rule-pretask` Purpose, line 20: "The per-Case question to `ask-guppi` asks "does this exist";
      this one asks, once, "does this set hold together"."

      **＋** `index.md` §11: "One tool, two moments: pre-task queries by intent before a decision exists;
      the librarian queries by finished content afterwards" — no conflict, unchanged.

      **＋** An `update` with a `ref`: by this decision itself, the pages were read and `ask-guppi` was
      not dispatched.

      **－** `estimate-ask-finds` `passed` at 11:1x today (147.2); `contract: same` does not touch it.'
    when: '`guppi render` writes `.claude/agents/ask-guppi.md`; someone reads the Purpose of `rule-ask`
      or of `rule-pretask`.'
    then: 'The description line of the Render: "Ask the vault what already exists, what is close, what
      is missing, which rule the proposal touches, which tags fit and whether a slug is free. One question
      before a `create` without a `ref`, and one at pre-task for the whole set; an `update` with a `ref`
      reads the page itself."

      **＋** The Purpose of `rule-ask`, after "…so the event log records each call.": "The main agent asks
      at two moments: before a `create` without a `ref`, and once at pre-task for the set of ratified
      Cases; the librarian asks by finished content afterwards, as §11 of the map says. An `update` with
      a `ref` does not ask: the page itself and a Grep give the `given` (case 154)."

      **＋** The Purpose of `rule-pretask`: "The per-Case question to `ask-guppi` asks "does this exist""
      → "The question to `ask-guppi` before a `create` without a `ref` asks "does this exist"".

      **＋** `rule-ask` and `rule-pretask` `contract: same`; `decision-case-154` superseded, `rule-ask`
      loses `deferred_by`.

      **－** `rule-case-protocol`, `CLAUDE.md`, `index.md` §11 do not change: they say this already.

      **－** No line of code, no reading.'
  spec: vault/raw/2026-09-15/1110/spec.md
