  case_text:
    context: '`rule-synthesis` tells the librarian, on the second lesson with the same root cause, to
      append to `materialize.yaml` a `create` in `insights` marked `librarian: synthesis` and one `update`
      per lesson. `guppi generate` lays the yaml entries into pages. Case 124.2 made an Insight the target
      of `update` and `defer` and fixed: "an Insight is neither created nor deleted through the yaml:
      a `create` or `delete` with an Insight as its target is a `generate` error". The code refuses every
      `create` in `insights` before it looks at the `librarian` mark. The last synthesis that applied
      — `insight-ledger-hi-tied-to-its-session-by-position` in `0747` — ran before 124.2. In the run of
      session Q the entry `insight-retro-typed-command-is-never-a-tool-call` was refused, and the two
      lesson `update`s applied before the refusal.'
    problem: '`rule-synthesis` and block 124.2 contradict each other: the rule tells the librarian to
      create an Insight by a yaml entry, the contract of `generate` forbids it; two retro lessons stand
      `clustered` with an `insight` that names no page — 2 `ref` findings.'
    given: '`rule-page-generation` (`built`, `check`, `estimates: [estimate-generate-writes, estimate-generate-walks-dates]`,
      both `passed`): the text of the rule does not name the Insight refusal; it lives only in the code
      and in block 124.2 of `estimate-generate-writes`.

      **＋** `generate.create` refuses the whole category `insights` with the line `LIBRARIAN_ONLY`; `generate.delete`
      too; `generate` reads the `librarian` mark nowhere.

      **＋** A synthesis entry: `kind: create`, `category: insights`, `origin` the lesson''s ledger line,
      `librarian: synthesis`, no `line` and no `case`; a decision entry carries `line`, `case`, `decision`.

      **＋** `tests/test_generate.py`: the test of 124.2 refuses a `create` of an Insight with `line` and
      `case`; no test seeds an entry with `librarian`.

      **＋** An entry with `failed` and `kind` is retried by the next run of `generate`; the mark is dropped
      on apply (53.3).

      **＋** `rule-synthesis` Render: "append to the yaml a `create` in `insights`…"; `insights/schema.md`:
      "Created by the librarian, never by a decision".

      **－** `decision-case-124.2` is an `update` of one page, no `defer`; the supersedes clears nothing
      from `deferred_by`.'
    when: '`guppi generate` applies a yaml entry whose target is a page of `insights/`.'
    then: 'A `create` in `insights` marked `librarian` writes the page as any `create`: `status: open`,
      `severity` from the count of `children`, the entry''s `origin`, `## Pattern`, `## Proposal`, `##
      Children` from the fields; History `created · <origin>`.

      **＋** A `defer` with an Insight as its target appends the decision slug to its `deferred_by`, as
      for a Rule; a `supersedes` removes it through `clear_deferred_by`.

      **＋** An `update` with `set: {addressed_by: decision-case-N}` writes the field, and on every write
      of an Insight page the `## Addressed by` section is derived from the field; without the field there
      is no section.

      **＋** An `update` with `set: {status: actioned}` goes as any `update`; the cascade of the same run
      archives the `clustered` children and recounts `severity`.

      **－** A `create` in `insights` without the `librarian` mark — from a ledger line — is refused as
      today; a `delete` of an Insight is refused always: an Insight goes to the archive by the cascade.'
