  derived: true
  criterion_block: '### case 164


    When:

    `guppi generate` applies a yaml entry whose target is a page of `insights/`.


    Then:

    A `create` in `insights` marked `librarian` writes the page as any `create`: `status: open`, `severity`
    from the count of `children`, the entry''s `origin`, `## Pattern`, `## Proposal`, `## Children` from
    the fields; History `created · <origin>`.

    **＋** A `defer` with an Insight as its target appends the decision slug to its `deferred_by`, as for
    a Rule; a `supersedes` removes it through `clear_deferred_by`.

    **＋** An `update` with `set: {addressed_by: decision-case-N}` writes the field, and on every write
    of an Insight page the `## Addressed by` section is derived from the field; without the field there
    is no section.

    **＋** An `update` with `set: {status: actioned}` goes as any `update`; the cascade of the same run
    archives the `clustered` children and recounts `severity`.

    **－** A `create` in `insights` without the `librarian` mark — from a ledger line — is refused as today;
    a `delete` of an Insight is refused always: an Insight goes to the archive by the cascade.'
  set:
    status: pending
  change: 'criterion: case 164 added'
  superseded_by: '166.2'
