  case_text:
    context: 'The reply that acknowledges a ratification has four parts in a fixed order (157): the heading
      `## Case N — ratified` with a **Changes** paragraph, a **Notes** paragraph, the heading `## Frontier`
      with the checklist and the question, and the `LEDGER` block last. The `Stop` hook reads the whole
      text of the reply and takes the record lines from any fenced block tagged `LEDGER`, wherever it
      stands; its one demand is that no tool call follows the text (122). The place of the block in the
      text does not matter to the hook: "last" was a choice of form in 157, not a technical need. For
      the reader the block at the bottom sits after the question "which item is next", so the record comes
      after the conversation.'
    problem: 'The order of the parts: the record block at the bottom, after the question, or at the top,
      before the account of the changes.'
    given: '`rule-case-protocol` (`draft`, `render` → `CLAUDE.md`, `estimates: [estimate-case-protocol-loaded]`;
      blocks 157 and 159 read `passed` today): the paragraph "The reply that acknowledges a ratification
      has four parts…" ends "the `LEDGER` block, last".

      **＋** `guppi/ledger.py`: the record lines are taken from a fenced block tagged `LEDGER` anywhere
      in the text; `last_assistant_message` and the transcript of the window are read.

      **＋** `rule-ledger-write` (122): the text before a tool call is never kept; a reply with a block
      ends in text — a block at the top does not break this.

      **－** `rule-ledger-write`, `guppi gate`, the form of a Case (159) and the short form of a defer
      do not change.'
    when: The owner answers a Case with a ratification; the agent writes the reply that acknowledges it.
    then: 'The reply has four parts, in this order: the `LEDGER` block first; the heading `## Case N —
      ratified` and a paragraph **Changes:** — what changes, in one or two sentences; a paragraph **Notes:**
      — facts that did not enter the Case, omitted when there are none; the heading `## Frontier` and
      the lines of `frontier.md` as a checklist — the closed lines folded into one, the open ones one
      per line with a short title, the deferred as `[-] … · defer case N` — and the question which item
      is next, last.

      **＋** The headings and labels are in the language of the chat.

      **－** The replies on readings and lessons, the reply that carries a Case and the short form of a
      defer stay as today; no tool call follows the block in the same reply.'
