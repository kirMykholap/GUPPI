  criterion_block: '### case 166.2


    When:

    `guppi generate` writes a page of any category, or applies a yaml entry whose target is a page of
    `insights/`.


    Then:

    Neither at `create`, nor at `update`, nor in `save` does `generate` write `## Estimates`, `## Children`,
    `## Parent`, `## Implementation`, `## Code`, `## Insight` or `## Addressed by`; a section a page still
    carries is neither touched nor derived again on a write; `SECTION_ORDER` does not know them.

    **＋** A `create` with `ref` still appends the slug to the parent''s `children` or to the target''s
    `estimates`, History `child <slug> added` / `estimate <slug> added`; an `update` with `set` on a field
    writes the field.

    **＋** A `create` in `insights` marked `librarian` writes the page as any `create`: `status: open`,
    `severity` from the count of `children`, the entry''s `origin`, `## Pattern` and `## Proposal` from
    the fields; History `created · <origin>`.

    **＋** A `defer` with an Insight as its target appends the decision slug to its `deferred_by`; a `supersedes`
    removes it through `clear_deferred_by`.

    **＋** An `update` with `set: {addressed_by: decision-case-N}` writes the field — and only the field.

    **＋** An `update` with `set: {status: actioned}` goes as any `update`; the cascade of the same run
    archives the `clustered` children and recounts `severity`.

    **－** A `create` in `insights` without the `librarian` mark is refused; a `delete` of an Insight is
    refused always.'
  set:
    status: pending
  change: 'criterion: case 166.2 added'
  applied: '17:58:17'
