    a list `["[[a]]", "[[b]]"]`; the fields: `parent`, `children`, `estimates`, `target`, `insight`, `addressed_by`,
    `deferred_by`, `create`, `update`, `delete`, `defer`, `supersedes`, `superseded_by`; a slug without
    a category prefix stays as it was.

    **＋** `read_page` and `page_estimates` strip `[[`/`]]` from these fields; a page without brackets
    reads the same.

    **＋** In Obsidian the backlinks of an Insight are its lessons and its Decision; the backlinks of a
    Rule are its children, Estimates and Decisions; `unresolved` is empty.

    **－** No CLI probe.'
