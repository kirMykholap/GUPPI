  case_text:
    context: '`estimate-generate-writes` and `estimate-cleanup-moves` are the Estimate pages of `rule-page-generation`
      and `rule-cleanup`. Their Criterion is a head text — the criterion signed at creation (cases 32,
      33) and edited directly in case 57 — and `### case N` blocks, one per contract change. A `supersedes`
      removes a block only; nobody touches the head. `rule-ledger-write` describes the second refusal
      of `guppi gate` — a Spec item without its ledger line — and quotes its text whole. Since 169.1 the
      gate has two texts: for the agent "end this reply in text with the LEDGER block, then call /<skill>
      in the next reply", for the person "Ask the agent to end its reply with the LEDGER block, then type
      /<skill> again".'
    problem: Three texts contradict ratified contracts. The head of `estimate-generate-writes` asks for
      `## Children` and `## Estimates`, which 166.2 removed. The head of `estimate-cleanup-moves` asks
      for "their sections" when a slug leaves (removed by 166.4) and "the four category indexes are rewritten"
      (removed by 147.6). `rule-ledger-write` quotes one refusal text where the gate has two. The readings
      of 166.2 and 166.4 stand in F1 and read the whole page; the reader meets a head that says one thing
      and a block that says the opposite. This is the pattern of `insight-workflow-contract-change-leaves-its-derived-text-stale`
      (`actioned`), left in the handoff of session R as F17.
    given: '`estimate-generate-writes`, head Criterion: "the parent''s children and ## Children in order,
      the target''s estimates and ## Estimates" — once on the page; block 166.2 says no section is derived
      from a ref field.

      **＋** `estimate-cleanup-moves`, head Criterion: "its slug leaves the children lists of live pages
      and the estimates lists of entities and rules, and their sections, with a History line there" and
      "the four category indexes are rewritten without the moved page, and an archived Estimate leaves
      no line anywhere" — once each; block 147.6: no index is written; block 166.4: the field only, no
      section rebuilt.

      **＋** `rule-ledger-write`, How it works: one quoted refusal text — the advice to the agent; `guppi/gate.py`
      prints `gate: /<skill> refused — N item(s) of the Spec have no ledger line (case A, case B).` and
