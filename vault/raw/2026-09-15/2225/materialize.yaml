  tags: []
  case_text:
    context: '`rule-retro-commit` is the hook `guppi gate`. It runs on `PreToolUse` for the agent''s `Skill`
      call and on `UserPromptSubmit` for the person''s typed `/pre-task`, `/retro` and `/handoff`. It
      has two refusals: a `then` item of the Spec without its ledger line (case 122), and a dirty tree
      for `/handoff`. It looks for the Spec in `spec.md` of the session''s folder and in the plan file
      the event log named last. No `hi`, no Spec, no plan file: nothing to check, exit 0, the mark is
      written.'
    problem: 'Retro is the analysis of what the session did: Cases, readings, lessons. A session with
      no Spec and no ledger line did nothing, and its Retro is empty — as at 22:34 today. The gate lets
      it through. Must the gate refuse, and on which condition?'
    given: '`rule-retro-commit` is `draft`; `estimate-retro-commit-gates` was `pending` on block 169.1,
      read `passed` at 22:34 (a line of this session''s ledger).

      **＋** `guppi/gate.py`: `spec_check` returns an empty list without `hi`, without `spec.md` and without
      a plan file; `run` then goes on to the tree check and the mark.

      **＋** `session_decisions(window_lines(...))` reads the lines of the session''s ledger window; `window_lines`
      returns every line of the window, not only `decision`.

      **＋** `tests/test_gate.py`: piped payloads against a temp repository; 6 tests on the head block,
      the tests of 169.1 on the typed path.

      **＋** An `estimate[...]` line is written the moment the measurement exists, in Plan Mode too (`rule-ledger-write`):
      a session of readings has a ledger line before `/retro`.

      **－** `/handoff` and `/pre-task` are not changed by this Case; their contract stays.'
    when: '`guppi gate` receives `/retro` — typed by the person, a `UserPromptSubmit` payload whose `prompt`,
      trimmed, is `/retro` with or without arguments, or called by the agent through `Skill` with `skill:
      retro` on `PreToolUse`.'
    then: 'When the session has a `hi` but its folder holds no `spec.md`, the event log names no plan
      file, and the session''s ledger window holds no `- decision[`, `- estimate[` or `- lesson[` line,
      the gate refuses: exit 2, the reason on stderr: `gate: /retro refused — nothing to review: no Spec
      and no ledger line in raw/<date>/<HHMM>/. Ratify a Case or write a reading or a lesson first, then
      type /retro again.`; on the `Skill` path the same advice for the agent: `…then call /retro in the
      next reply.`; the client blocks the prompt, no mark is written.

      **＋** With at least one of the three ledger lines, or a Spec, or a plan file — the check of 122
      and the mark as today.

      **＋** Without `hi` — as today: nothing to check, exit 0.

      **－** `/pre-task` and `/handoff` are unchanged; `/handoff` in an empty session still checks the
      tree only.'
