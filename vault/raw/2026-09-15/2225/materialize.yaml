  criterion_block: '### case 180


    When:

    `guppi gate` receives `/retro` — typed by the person, a `UserPromptSubmit` payload whose `prompt`,
    trimmed, is `/retro` with or without arguments, or called by the agent through `Skill` with `skill:
    retro` on `PreToolUse`.


    Then:

    When the session has a `hi` but its folder holds no `spec.md`, the event log names no plan file, and
    the session''s ledger window holds no `- decision[`, `- estimate[` or `- lesson[` line, the gate refuses:
    exit 2, the reason on stderr: `gate: /retro refused — nothing to review: no Spec and no ledger line
    in raw/<date>/<HHMM>/. Ratify a Case or write a reading or a lesson first, then type /retro again.`;
    on the `Skill` path the same advice for the agent: `…then call /retro in the next reply.`; the client
    blocks the prompt, no mark is written.

    **＋** With at least one of the three ledger lines, or a Spec, or a plan file — the check of 122 and
    the mark as today.

    **＋** Without `hi` — as today: nothing to check, exit 0.

    **－** `/pre-task` and `/handoff` are unchanged; `/handoff` in an empty session still checks the tree
    only.'
