      **＋** A Decision page with `status: superseded` becomes `archived` with History `archived · superseded`;
      `superseded_by` and `deferred_by` are not touched.

      **＋** Every `clustered` child of an Insight with `status: actioned` becomes `archived` with History
      `archived · insight actioned`; the Insight''s `children` does not change.

      **＋** The `severity` of every Insight is recounted: a child''s status is read under `wiki/lessons/`,
      else in the archive; a child with no page counts live; an `open` Insight at 0 becomes `archived`
      with History `archived · no live child`, `children` kept; an `actioned` one at 0 stays.

      **－** A page without Estimates keeps its status; no section of any page is derived or touched by
      the cascade.'
