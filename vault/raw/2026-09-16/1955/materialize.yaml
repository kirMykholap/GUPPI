      the target `make lint` after `render --check`. The page carries `## Purpose` and a long `## How
      it works`; one Estimate — `estimate-lint-catches`: a head plus four blocks (103.5, 112.1, 149.3,
      156), `passed`. The Estimate schemas are already in the new shape (193): `purpose`, `method`, `checked`
      optional fields, `## Context` and `## Method` optional sections. The code does not know it: `check_method`
      reads the `## Method` section only and says nothing of the `method` field on the thirteen new pages;
      `check_criterion` accepts `### case N` blocks; a `pending` Estimate is invisible to lint — ten today,
      known to the brief alone. Decision 191 deferred the page with the text: the finding `unread` on
      every `pending` and `failed`; the schema without `## Context` and `## Method`; the `unmigrated`
      counter for the transition and the removal of the old shape at zero; the change of 186.3 (`deferred`)
      stands. The Case touches the one Estimate of the rule.'
    problem: 'The model of 182 says: a rule changes → the Estimate `pending` → lint red → the reading
      → `passed` → lint clean. Today the chain is broken in the middle: lint does not see `pending`, and
      an Estimate can stand unread for any length of time. Nobody checks the `method` field on the new
      pages, and the 42 pages of the old shape are not visible as a remainder. The question: how lint
      sees an unread promise and the remainder of the migration, and what it checks in `method` once it
      is a line, not a section.'
    given: '`guppi lint` reads every live page of `wiki/<category>/` against the category''s `schema.yaml`
      and writes nothing.

      **＋** `estimates/schema.yaml` (193): `purpose`, `method`, `checked` are optional fields; `## Context`,
      `## Method` optional sections; `## Result` required on `passed` and `failed`.

      **＋** The tests in `tests/test_lint.py` fix the behaviour, one per class; the live reading is `make
      lint` in the librarian''s run of this session.

      **－** `render --check` and the Makefile do not change.'
    when: '`uv run guppi lint` reads the live pages of the vault.'
    then: 'Every live page is checked against the `schema.yaml` of its category; one line per finding,
      `<category>/<slug>: <class>: <what>`; exit 1 on any finding, 0 and no output on a clean vault; nothing
      is written.

      **＋** `schema`: a missing required field or section, a value outside the list, a conditional not
      met; `## When` is never required on a Decision page; `schema-prose`: `schema.md` and `schema.yaml`
      naming different fields or sections.

      **＋** `ref`: a slug in `parent`, `children`, `estimates`, `target`, `insight`, `addressed_by`, `deferred_by`
      or in a History wikilink that no live or archived page carries; a `[[…]]` in a body may name a hub
      file under `wiki/` by stem or path; a `[[slug]]` under a Decision page''s `## Criterion` that is
      no Estimate; a `### case N` block of an Estimate with no decision page.

      **＋** `origin`: both forms resolve in `raw/` or in `vault/archive/`; in neither, or in both, a finding.

      **＋** `path`: a file of `implementation_ref` or `governs` that does not exist.

