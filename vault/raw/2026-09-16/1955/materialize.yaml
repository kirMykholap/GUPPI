  case_text:
    context: '`/carry` (`rule-carry-over`, `draft`) conserves a Spec whose work is not done: `carry.md`
      in `raw/<date>/<HHMM>/`, the brief rewritten, a commit; `materialize` passes the unit by; "the session
      that finishes the Spec deletes `carry.md`" — where and how that session runs is unsaid. `rule-end-of-work`
      knows two ends of a session, the ordinary one and `/carry`. `rule-documentation` and `rule-close`:
      the librarian is the only writer to `wiki/` and ends in its own commit; `guppi gate` refuses `/handoff`
      on a dirty tree; the ledger hook refuses without a `hi` in the session''s window. `rule-work-mode`
      and `rule-subagent-guppi` are placeholders (case 206). The vault was asked: `rule-spec-box` is free
      in `wiki/` and in the archive; no page speaks of a worktree or of a session started from a conserved
      folder; `lesson-subagents-parallel-on-one-tree-red-mid-flight` says two writers on one tree make
      readings meaningless. The wider question was named in session 1651 and left without a defer.'
    problem: 'A session ends in a brief that the next session must work off, so the sessions run one after
      another even when the work of a Spec has no decision left in it. Work Mode is where the time goes
      and where nothing is decided; it could run in parallel — one conserved Spec per session, each in
      a git worktree. What keeps it from racing is already the rule: the librarian alone writes `wiki/`,
      each session writes its own `raw/` folder, `generate` applies only what is unapplied, a superseded
      Case is skipped. What is missing is the session itself: how it opens a box, where its hook writes,
      how it ends, and who runs the librarian after the merge. This leans on Work Mode (Slice 3b) and
      is discussed after it.'
