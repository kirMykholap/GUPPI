  sections:
    Criterion: 'Given:

      `guppi generate` applies the entries of a `materialize.yaml` in order; the `sections` of an `update`
      entry are whole replacements, `set` writes fields.

      **＋** An `update` entry for an Estimate carries `sections.Criterion` and `set: {status: pending}`;
      a `create` entry carries `kind`, `purpose`, `method`, `tags` as fields (194.1).

      **＋** An `estimate` entry carries `status` and `result`; the `result` opens with the date of the
      reading and the command (199).

      **＋** The tests in `tests/test_generate.py` fix the behaviour; the live reading is the librarian''s
      run of this session.

      **－** `materialize`, `cleanup` and `lint` do not change here.


      When:

      `guppi generate` applies one entry of a yaml to a page.


      Then:

      A `create` becomes a page: `type`, the fields of the entry, `status` by category (entity and rule
      `draft`, estimate `pending`, lesson `new`, insight `open`), `origin`, `sprint` — the first `## <id>`
      of `sprint.md`, `created` — the yaml''s date, `tags`; the body sections from `sections`, `## Purpose`
      from `purpose` on a rule or an entity; a `ref` lands in the parent''s `children` or the target''s
      `estimates` with History `child <slug> added` / `estimate <slug> added`, at the end of the run when
      the parent comes later in the yaml.

      **＋** An Estimate page carries `purpose`, `method` and `checked` as fields, in that order after
      `target`; `## Criterion` from `sections`; neither `## Context` nor `## Method` is written.

      **＋** A `create` whose slug is a placeholder (`draft`, no `kind`) fills it: `created` and `deferred_by`
      kept, History `created over placeholder`; any other existing page is a collision, not a rename.

      **＋** An `update` applies `set` to the frontmatter, `sections` as whole replacements, `replace`
      inside the body (whitespace collapsed, exactly one occurrence), History `updated: <change>`; an
      `update` of an Estimate with `sections.Criterion` replaces the section whole.

      **＋** An `update`, `estimate`, `delete` or `defer` whose slug is not under `wiki/` finds the page
      under `vault/archive/` (`raw/` folders excluded) and edits it there.

      **＋** An `estimate` sets `status`, overwrites `## Result`, writes `checked` — the date the `result`
      opens with, else the yaml''s date — and appends History `status: a → b · <ledger pointer>`.

      **＋** A `delete` sets `archived` with History `deleted`; a `delete` outside the vault is a line
      on stdout, the entry applied, no page written.

      **＋** A `defer` with a page appends the decision slug to `deferred_by` (rule, entity, insight) with
      History `deferred`; without a page it writes a placeholder `draft` with the Case''s fields and `deferred_by`.

      **＋** A `lesson` writes the lesson only, `source` when the line carries it; no Estimate is created.

      **＋** Every ref field is written as `"[[slug]]"`, a list as `["[[a]]", "[[b]]"]`; a slug without
      a category prefix stays bare; read through the brackets.

      **＋** A `create` in `insights` applies only with the mark `librarian`; a `delete` of an Insight
      is refused always.

      **＋** History lines and `log.md` lines carry the date of the run and end with `[[decision-case-N]]`
      or the ledger pointer; `log.md` is appended after each entry; a tag of `new_tags` lands in `tags.md`,
      a used and undeclared one goes to stderr.

      **－** No body section is derived from a ref field; a section a page still carries is not touched.

      **－** `criterion_block` on an `update` and an entry of kind `remove_criterion` are not applied:
      a shape the script does not know — the entry fails alone (`estimate-generate-fails-alone`).

      **－** The Decision page, the failure of an entry and the cascade are three other Estimates.'
