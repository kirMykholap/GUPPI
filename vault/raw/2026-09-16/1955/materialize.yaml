- case: '204'
  decision: decision-case-204
  origin: raw/2026-09-16/1955/ledger.md#case-204
  targets:
  - kind: update
    category: rules
    slug: rule-materialize
    ref: rule-materialize
  - kind: update
    category: estimates
    slug: estimate-materialize-assembles
    ref: estimate-materialize-assembles
  tags: []
  case_text:
    context: '`rule-materialize` is a Leaf, `enforcement: check`, its code `guppi/materialize.py`; nine
      Estimates, among them `estimate-materialize-assembles` — `pending` with the Criterion of 194.1,
      its reading not yet taken. The Purpose of the rule says: the Criterion of an Estimate is the `given`,
      `when`, `then` of the Case, lifted verbatim into the entry''s `sections`. The Criterion of `-assembles`
      says the same for an `update` and allows a written text for a `create` only: "from the block''s
      `sections` when one is written, else from the Case". The code (`lift_criterion`) keeps a written
      `sections.Criterion` in both cases — on a `create` and on an `update` — and sets `pending` unless
      the item set a status itself. The handoff of 1651 named the divergence: 188 updated `estimate-case-protocol-loaded`
      with a written Criterion and the text stayed, although the `then` of 194.1 says the entry carries
      the Case''s text. `case-schema.md` already allows both paths for a `create` (194.1), and Case 203.1
      of this session leans on a written Criterion as the signature of a separate promise. The Case touches
      one Estimate — `-assembles`; the other eight it does not touch.'
    problem: 'Two texts speak of an Estimate `update` differently: the rule and the Criterion say "the
      Case''s text replaces", the code says "the written text stands". Until this is signed, `estimate-case-protocol-loaded`
      carries a Criterion that by the letter of the rule should not have stayed, and 203.1 treats an item
      with a written Criterion as a separately signed promise without a rule that says so. The question:
      which of the two texts is the signature when the item wrote `sections: Criterion` itself.'
    given: 'A unit `raw/<date>/<HHMM>/` holds `ledger.md` and `spec.md`; a Case in the Spec has a heading,
      the sections `given`, `when`, `then` and a `then` block.

      **＋** `guppi generate` applies the `sections` of an `update` entry as whole replacements and writes
      every field of a `create` entry''s `fields` into the frontmatter.

      **＋** The tests in `tests/test_materialize.py` fix the behaviour; the live reading is the librarian''s
      run.'
    when: '`guppi materialize` lifts a record line of a ledger against its Spec.'
    then: 'One entry per record line, in ledger order: `case`, `kind`, `category` from the slug prefix,
      `slug`, `ref`, `source`, `supersedes`, `tags`, `origin`, `line`, `text`, `decision`; from the `then`
      block — `fields`, `sections`, `replace`, `change`, `impact`; what the block lacks is `incomplete`,
      never invented.

      **＋** An Estimate has its own line and its own entry; the `ref` of the line is the Estimate itself.

      **＋** An `update` entry for an Estimate carries `sections.Criterion` — the text the item wrote under
      `sections: Criterion` itself, else the `given`, `when` and `then` of its Case verbatim with their
      operands as `Given:`, `When:`, `Then:` — replacing what stood there, and `set: {status: pending}`
      unless the item set a status itself; the `given` of a sub-case is its parent''s when it has none
      of its own.

      **＋** A `create` entry for an Estimate keeps `kind`, `purpose`, `method`, `tags` as fields; its
      Criterion the same way: the written text when there is one, else the Case''s; `## Context` and `##
      Method` are not written.

      **＋** One decision entry per Case: `decision`, `case_text`, `targets`; a sub-case inherits `context`,
      `problem`, `recommend`, `given`, never `when`.

      **＋** An `estimate` line for a page of the same ledger is folded into its `create`; for an earlier
      page it is an `estimate` entry. The `new_tags` of any Case reach the yaml once. An existing yaml
      is extended, never rewritten.

      **－** An `update` entry carries no `contract`, and no Estimate is derived from it; a `create` carries
      no `method`, `estimate_kind` or `estimate_slug`; neither `criterion_block`, `case_removed` nor `remove_criterion`
      is derived.

      **－** The keys `contract`, `estimate_slug`, `estimate_kind` and `method` on a rule''s item are ignored:
      they reach neither the page nor `incomplete`.

      **－** A line the grammar does not parse goes under `unparsed`; the run goes on.'
