      `passed` or `failed` without `## Result`; an Estimate whose target is not an entity or a rule, or
      does not list it in `estimates`.

      **＋** `unread`: every Estimate `pending` or `failed` — one finding each, `unread: <status>`; red
      between a change of a promise and its reading, by design.

      **＋** `method`: the `method` field, or on a page of the old shape the `## Method` section; for a
      MOC''s Estimate a named `make <target>` of the Makefile passes whatever stands beside it, without
      one `by hand` passes only when the Estimates of every child are by hand; for a Leaf''s Estimate
      a `tests/` file that exists, the word `pytest`, a `make <target>` of the Makefile or a reading (`by
      hand`, `reading`); else a finding.

      **＋** `decision`: a decision page with none of the four lists, or with `kind`/`target_slug`; a listed
      slug with a category prefix and no page.

      **＋** `deferred`: a placeholder earns one finding `deferred: <N> times since case <M>` in place
      of its `schema` and `orphan` findings; a page with `deferred_by` whose fields are in place earns
      none.

      **＋** `unmigrated`: one line, `estimates: unmigrated: <N> pages in the shape before case 193` —
      the live Estimates without a `method` field, or with `## Context`, `## Method` or a `### case N`
      block; no line at zero.

      **－** `make lint` runs it after `render --check`; neither writes.

      **－** The checks of the old shape — `## Method` as a section, the `### case N` blocks — leave by
      a separate `update` of this rule once the counter reads zero; not this Case.'
