    category: rules
    slug: rule-page-generation
    ref: rule-page-generation
  - kind: update
    category: estimates
    slug: estimate-generate-writes
    ref: estimate-generate-writes
  tags: []
  case_text:
    when: '`guppi generate` applies one entry of a yaml to a page.'
    then: 'A `create` becomes a page: `type`, the fields of the entry, `status` by category (entity and
      rule `draft`, estimate `pending`, lesson `new`, insight `open`), `origin`, `sprint` — the first
      `## <id>` of `sprint.md`, `created` — the yaml''s date, `tags`; the body sections from `sections`,
      `## Purpose` from `purpose` on a rule or an entity; a `ref` lands in the parent''s `children` or
      the target''s `estimates` with History `child <slug> added` / `estimate <slug> added`, at the end
      of the run when the parent comes later in the yaml.

      **＋** An Estimate page carries `purpose`, `method` and `checked` as fields, in that order after
      `target`; `## Criterion` from `sections`; neither `## Context` nor `## Method` is written.

      **＋** A `create` whose slug is a placeholder (`draft`, no `kind`) fills it: `created` and `deferred_by`
      kept, History `created over placeholder`; any other existing page is a collision, not a rename.

      **＋** An `update` applies `set` to the frontmatter, `sections` as whole replacements, `replace`
      inside the body (whitespace collapsed, exactly one occurrence), History `updated: <change>`; an
      `update` of an Estimate with `sections.Criterion` replaces the section whole.

      **＋** An `update`, `estimate`, `delete` or `defer` whose slug is not under `wiki/` finds the page
      under `vault/archive/` (`raw/` folders excluded) and edits it there.

      **＋** An `estimate` sets `status`, overwrites `## Result`, writes `checked` — the date the `result`
      opens with, else the yaml''s date — and appends History `status: a → b · <ledger pointer>`.

      **＋** A `delete` sets `archived` with History `deleted`; a `delete` outside the vault is a line
      on stdout, the entry applied, no page written.

      **＋** A `defer` with a page appends the decision slug to `deferred_by` (rule, entity, insight) with
      History `deferred`; without a page it writes a placeholder `draft` with the Case''s fields and `deferred_by`.

      **＋** A `lesson` writes the lesson only, `source` when the line carries it; no Estimate is created.

      **＋** Every ref field is written as `"[[slug]]"`, a list as `["[[a]]", "[[b]]"]`; a slug without
      a category prefix stays bare; read through the brackets.

      **＋** A `create` in `insights` applies only with the mark `librarian`; a `delete` of an Insight
      is refused always.

      **＋** History lines and `log.md` lines carry the date of the run and end with `[[decision-case-N]]`
      or the ledger pointer; `log.md` is appended after each entry; a tag of `new_tags` lands in `tags.md`,
      a used and undeclared one goes to stderr.

      **－** No body section is derived from a ref field; a section a page still carries is not touched.

      **－** `criterion_block` on an `update` and an entry of kind `remove_criterion` are not applied:
      a shape the script does not know — the entry fails alone (`estimate-generate-fails-alone`).

      **－** The Decision page, the failure of an entry and the cascade are three other Estimates.'
    context: '`rule-page-generation` is a Leaf, `enforcement: check`, its code `guppi/generate.py`, its
      tests `tests/test_generate.py`. The page carries `## Purpose` and a long `## How it works`; two
      Estimates: `estimate-generate-writes` — a head plus ten `### case N` blocks (101.1, 104.1–104.3,
      105.3, 142.2, 151, 166.2, 166.3, 172) — and `estimate-generate-walks-dates` — a head plus block
      103.3; both `passed`. The replacement of a Criterion whole already works through `sections` (194.1),
      but the code still applies `criterion_block` and `remove_criterion`, writes no `checked`, and the
      key order of an Estimate does not know `purpose`, `method`, `checked`; the Decision page still gets
      `## Given` and a `## Criterion` list of `[[estimate-x]] § case N`, which died with the blocks (point
      10 of the model of 182, deferred here by 193). Decision 191 deferred the page with the text: generate
      without blocks and `remove_criterion`, the Criterion whole, the fields `purpose`, `method`, `checked`,
      the recut of both Estimates; the change of 186.1 (`## Deferred`) stands ratified. The vault was
      asked for the slugs: `estimate-generate-writes-the-decision-page`, `estimate-generate-fails-alone`,
      `estimate-generate-cascades` are free in the vault and in the archive (the archive holds seven other
      `estimate-generate-*`, among them `-rejects-shape-alone` and `-logs-per-entry`, folded into `-writes`
      by 53.2). The Case touches both Estimate pages and creates three.'
    problem: '`estimate-generate-writes` is ten deltas without a whole: what generate promises now is
      written nowhere, and lint finds a `[[slug]]` in its body that no page carries. The code keeps two
      paths of the old model that materialize no longer produces, and writes no `checked`, although the
      schema (193) and the reading line (199) already carry the date. The Decision page writes a Criterion
      list that points at nothing after a recut. The question: how to recut the two Estimates into promises
      that read whole, and take the old model out of the code without losing one signed line.'
    given: '`guppi generate` applies the entries of a `materialize.yaml` in order; the `sections` of an
      `update` entry are whole replacements, `set` writes fields.

      **＋** An `update` entry for an Estimate carries `sections.Criterion` and `set: {status: pending}`;
      a `create` entry carries `kind`, `purpose`, `method`, `tags` as fields (194.1).

      **＋** An `estimate` entry carries `status` and `result`; the `result` opens with the date of the
      reading and the command (199).

      **＋** The tests in `tests/test_generate.py` fix the behaviour; the live reading is the librarian''s
      run of this session.

      **－** `materialize`, `cleanup` and `lint` do not change here.'
  spec: vault/raw/2026-09-16/1955/spec.md
  applied: '22:22:18'
