  case_text:
    when: '`guppi generate` applies an `update` whose item carries `rename`.'
    then: 'The file `wiki/<category>/<old>.md` becomes `<new>.md`; the page''s History gets "renamed from
      `<old>` · [[decision-case-N]]"; the item''s `set`, `sections` and `replace` apply to the new file.

      **＋** In every live page of `wiki/` — Decision pages included — every `[[old]]` becomes `[[new]]`,
      every `REF_FIELDS` value holding the old slug becomes the new one, and the old slug as a whole word
      in the body outside `## History` and `## Result` becomes the new one; every page touched, Decision
      pages excepted, gets the History line "ref `<old>` → `<new>` · [[decision-case-N]]".

      **＋** The Decision page of the Case is written as today — by the slug of the ledger line, before
      the entries; the walk retargets its link like any other.

      **＋** The order of application is the order of the yaml: an `update` of the same page from an earlier
      Case lands on the old file, and the `rename` moves it with the page.

      **－** A taken slug or a foreign prefix: the entry is `failed`, nothing is moved.

      **－** `origin`, `## History` and `## Result` of any page, the archive, `raw/`, `log.md` and `brief.md`
      are untouched; `guppi sprint` redraws `sprint.md` from the sprint page.'
    context: 'A decision is a `create`, `update`, `delete` or `defer`; the id of a page is its filename;
      `origin` is never rewritten. An `update` in a `then` block carries `set`, `sections`, `replace`,
      `change`; `guppi materialize` copies these keys from the item into the yaml, `guppi generate` (`rule-page-generation`,
      `guppi/generate.py`) applies them to the page found by its slug and writes a History line; a `create`
      on a taken slug it refuses with an error, never renaming. The links to a page live in the `[[slug]]`
      of bodies and in the `REF_FIELDS` — `parent`, `children`, `estimates`, `target`, `deferred_by`,
      `addressed_by`; lint checks them against live and archived pages; `log.md`, `brief.md` and `raw/`
      are not pages. `rule-page-generation` carries six Estimates, none about moving a file: the Case
      creates a seventh, `estimate-generate-renames`, the slug free. `rule-materialize` carries nine;
      `estimate-materialize-assembles` — the assembly of the yaml from ledger and Spec — keeps its Criterion:
      the key is added in code, the reading is pytest. The Rule-class files that describe `update`: `index.md`
      §3 and §5, `case-schema.md`, `decisions/schema.md`, `glossary.md`.'
    problem: A page cannot be renamed today except as a `create` of a new one and a `delete` of the old
      — losing History on the live page, signing Criteria twice, and leaving two pages for one thing.
      One decision has to change a slug so that the page stays the same page and every link to it in the
      vault names the new slug.
    given: 'An `update` item may carry `rename: <new slug>` beside `set`, `sections`, `replace`, `change`;
      the ledger line names the old slug.

      **＋** The id of a page is its filename; the new slug carries the same category prefix.

      **＋** `origin` is never rewritten; the archive, `raw/`, `log.md` and `brief.md` are not pages.

      **－** A taken slug — live or archived — and a foreign prefix: an error on a `create`, the same on
      a `rename`.'
  spec: vault/raw/2026-09-20/0527/spec.md
  applied: 07:30:56
