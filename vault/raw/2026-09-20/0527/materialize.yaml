- case: '255'
  decision: decision-case-255
  origin: raw/2026-09-20/0527/ledger.md#case-255
  targets:
  - kind: update
    category: rules
    slug: rule-spec-capture
    ref: rule-spec-capture
  - kind: update
    category: estimates
    slug: estimate-spec-capture-offers-the-fork
    ref: estimate-spec-capture-offers-the-fork
  tags: []
  case_text:
    context: '`rule-spec-capture` is a Leaf, `enforcement: hook`, code `guppi/spec.py`, the `PostToolUse`
      hook on `ExitPlanMode`. It appends the approved plan to `raw/<date>/<hi HHMM>/spec.md` and then
      prints one line on stdout with exit 0 — the fork: Work Mode on the Spec or `/carry`, with the session
      folder and the Spec file (case 190.5). The page says the hook "prints the fork into the context".
      Two Estimates: `estimate-spec-capture-appends` — the writing of the Spec, untouched by this Case;
      `estimate-spec-capture-offers-the-fork` — `passed` 2026-09-16 on one pytest, "the live print in
      the client is read at the next ExitPlanMode", a reading nobody took. Twice, in sessions 2054 and
      2253, the line was not in the `ExitPlanMode` result; the agent asked the fork from memory of the
      rule. The Claude Code documentation: for `PostToolUse` the exit-0 stdout of a hook goes to the debug
      log and not to the context; a JSON `hookSpecificOutput.additionalContext` reaches the context; exit
      2 shows stderr as a warning. The lesson `lesson-hooks-posttooluse-stdout-not-in-context` is written.'
    problem: 'The promise of 190.5 — the hook prints the fork into the agent''s context — was never kept
      live: the line goes where the agent does not see it. The test checks the text of stdout, not the
      shape the client reads, so the Estimate passed on a mechanism that does not work. The Case chooses
      how the line reaches the agent and rewrites the Criterion so that a live reading closes it.'
    given: 'For `PostToolUse` Claude Code adds to the agent''s context only `hookSpecificOutput.additionalContext`
      from a JSON object on stdout; plain stdout with exit 0 goes to the debug log.

      **＋** A `PostToolUse` hook blocks nothing: the tool has run.

      **－** The path "no `/hi` for this session" — stderr, exit 2 — does not change.'
    when: '`guppi spec` has run on `PostToolUse` of `ExitPlanMode` and written the Spec, or found it already
      there.'
    then: 'The stdout of the hook is one JSON object: `hookSpecificOutput` with `hookEventName: PostToolUse`
      and `additionalContext`, holding the fork line — Work Mode on the Spec or `/carry` — with the session
      folder and the Spec file, and that nothing starts until the person answers.

      **＋** The agent sees this line in the `ExitPlanMode` result.

      **－** Without a Spec, nothing, as before.

      **－** The writing of the Spec does not change: that is the promise of `estimate-spec-capture-appends`.'
  spec: vault/raw/2026-09-20/0527/spec.md
  applied: 07:30:56
- case: '256'
  decision: decision-case-256
  origin: raw/2026-09-20/0527/ledger.md#case-256
  targets:
  - kind: update
    category: rules
    slug: rule-pretask
    ref: rule-pretask
  - kind: update
    category: estimates
    slug: estimate-pretask-reconciles
    ref: estimate-pretask-reconciles
  - kind: update
    category: insights
    slug: insight-pretask-session-flag-takes-the-id-not-the-hi-line
    ref: insight-pretask-session-flag-takes-the-id-not-the-hi-line
  tags: []
  case_text:
    context: '`rule-pretask` is a Leaf, `enforcement: render`, governing `.claude/skills/pre-task/SKILL.md`.
      Its Render says: run `guppi pretask --check <plan> --session <stamp>`, "the stamp from the `hi:`
      line". The `hi:` line carries three tokens — the time, the eight-character session id, the folder
      — and `--session` takes the id alone; `session_stamp` cuts the value to eight characters, so a wrong
      token answers "no hi recorded for session <8 characters>; nothing checked" on stderr with exit 0,
      the design of case 213: a check without a `hi` blocks nothing. Twice the agent passed the wrong
      token: the whole line in 1252, the folder in 2253; both times the check did not run and the run
      looked clean. The librarian clustered the two lessons into `insight-pretask-session-flag-takes-the-id-not-the-hi-line`,
      severity 2, `open`, with the proposal: the Render names the id, the second token, and one line on
      reading the output — its first line, not the exit code. Two Estimates: `estimate-pretask-reconciles`
      — the live reading of the Render, its Criterion opens with the same phrase "the stamp from the `hi:`
      line" and is replaced whole; `estimate-pretask-checks-the-plan` — the tests of `--check`, untouched:
      the code does not change.'
    problem: The text of the rule names the value of the flag with the word "stamp", which in the context
      also names the whole `hi:` line; the code takes one token of three and answers a wrong one with
      a silent exit 0. The agent read the text two different ways, and both times `/pre-task` checked
      nothing. The Render has to name the token exactly and tell the agent to read the first line of the
      output, not the exit code.
    given: '`guppi pretask --check <plan>` reads the Cases of the plan by their headings, the `then` blocks,
      the session''s `frontier.md` and the session''s ledger window; `guppi gate` writes the `pretask`
      line with the session''s stamp on the Skill call.

      **＋** `--session` takes the eight-character session id — the second token of the `hi:` line, between
      the time and the folder; `session_stamp` cuts any value to eight characters, so a wrong token answers
      "no hi recorded for session <8 characters>; nothing checked" on stderr with exit 0, and nothing
      was checked.

      **＋** An Estimate item of a `then` block is a `create` with `ref`, or an `update` with `set: {status:
      pending}`; its Criterion is the Case''s `given`, `when` and `then` unless the item wrote `sections:
      Criterion` itself (194.1).

      **＋** The tests in `tests/test_pretask.py` fix `--check`; the live reading is the `/pre-task` of
      this session.

      **－** The `PreToolUse ExitPlanMode` hook (`rule-pretask-hook`) does not change here.

      **－** The code of `guppi pretask` does not change: the exit 0 without a `hi` is the design of case
      213.'
    when: The person invokes `/pre-task`, or the agent calls the skill, before the Spec is approved.
    then: 'The agent runs `guppi pretask --check` on the plan file with `--session <id>`, the eight-character
      session id — the second token of the `hi:` line the `UserPromptSubmit` hook put in the context at
      `/hi`, between the time and the folder (cases 213.3, 256) — and reads the first line of the output
      before the exit code: "no hi recorded for session …; nothing checked" means the wrong value, and
      the check did not run; it fixes the plan, the frontier or the line for every finding until the command
      prints nothing; `guppi gate` writes the stamped `pretask` line into the event log on the Skill call.

      **＋** The agent lists every decision of this Plan Mode, one line each: slug — kind — `purpose` for
      a `create`, an `update`, a `delete`; a `defer` by its slug and the word `defer`; for an `update`
      of a rule or an entity, the page''s `estimates` and which of them the Case names by slug.

      **＋** `ask-guppi` is dispatched once with the list, the absolute path of the plan file, the instruction
      to read every Case outside `## Deferred` — `when`, `then`, the `then` block — and two questions:
      which decisions contradict a page, `index.md` or each other; whether an Estimate the Case does not
      name speaks of the thing the Case changes.

      **＋** Every finding returned is raised as a Case or named in one line as already known; then Plan
      Mode exits again.

      **＋** The Insight `insight-pretask-session-flag-takes-the-id-not-the-hi-line` is `actioned`; its
      two lessons go to the archive by the cascade; a third lesson with the same cause reopens it.

      **－** The body of a deferred decision is not read; a Case that changes a page another Case of the
      plan defers is still a finding.'
  spec: vault/raw/2026-09-20/0527/spec.md
  applied: 07:30:56
