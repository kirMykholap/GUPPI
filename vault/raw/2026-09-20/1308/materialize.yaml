  sections:
    Criterion: 'Given:

      A unit `raw/<date>/<HHMM>/` holds `ledger.md` and `spec.md`; a Case in the Spec has a heading, the
      sections `given`, `when`, `then` and a `then` block.

      **＋** `guppi generate` applies the `sections` of an `update` entry as whole replacements, `replace`
      and `reword` as pairs, and writes every field of a `create` entry''s `fields` into the frontmatter.

      **＋** The `schema.yaml` of each category lists the fields of its page: `required` and `optional`
      (case 214).

      **＋** The tests in `tests/test_materialize.py` fix the behaviour; the live reading is the librarian''s
      run.


      When:

      `guppi materialize` lifts a record line of a ledger against its Spec.


      Then:

      One entry per record line, in ledger order: `case`, `kind`, `category` from the slug prefix, `slug`,
      `ref`, `source`, `supersedes`, `tags`, `origin`, `line`, `text`, `decision`; from the `then` block
      — `fields`, `sections`, `replace`, `reword`, `change`, `rename`, `impact`; what the block lacks
      is `incomplete`, never invented (case 258.3).

      **＋** `reword` is a list of `{old, new}` pairs, carried as written; a mapping or a scalar under
      `reword` is `incomplete: [reword]` (case 274.3).

      **＋** Only the keys the category''s `schema.yaml` names as fields reach `fields` of a `create` entry,
      and of a `defer` entry but for `type` and `purpose` — the defer''s own keys, which reach `fields`
      whatever the target''s category, for the placeholder page and for the `## Deferred` of the Decision
      page; the structural keys of the item go where they go — `ref` to the entry, `sections`, `tags`,
      `file`; a key that is neither is marked `unknown: [key]` on the entry, printed by `--show`, never
      written to the page, and the entry applies; `incomplete` is counted by `REQUIRED` as before, and
      a `defer` without `purpose` is `incomplete: [purpose]` (cases 214.1, 266).

      **＋** An Estimate has its own line and its own entry; the `ref` of the line is the Estimate itself.

      **＋** An `update` entry for an Estimate carries `sections.Criterion` — the text the item wrote under
      `sections: Criterion` itself, else the `given`, `when` and `then` of its Case verbatim with their
      operands as `Given:`, `When:`, `Then:` — replacing what stood there, and `set: {status: pending}`
      unless the item set a status itself; the `given` of a sub-case is its parent''s when it has none
      of its own.

      **＋** A `create` entry for an Estimate keeps `kind`, `purpose`, `method`, `tags` as fields; its
      Criterion the same way: the written text when there is one, else the Case''s; `## Context` and `##
      Method` are not written.

      **＋** One decision entry per Case: `decision`, `case_text`, `targets`; a sub-case inherits `context`,
      `problem`, `recommend`, `given`, never `when`.

      **＋** An `estimate` line for a page of the same ledger is folded into its `create`; for an earlier
      page it is an `estimate` entry. The `new_tags` of any Case reach the yaml once. An existing yaml
      is extended, never rewritten.

      **－** An `update` entry carries no `contract`, and no Estimate is derived from it; a `create` carries
      no `method`, `estimate_kind` or `estimate_slug`; neither `criterion_block`, `case_removed` nor `remove_criterion`
      is derived.

      **－** The keys `contract`, `estimate_slug`, `estimate_kind` and `method` on a rule''s item are ignored:
      they reach neither the page, nor `incomplete`, nor `unknown`.

      **－** A line the grammar does not parse goes under `unparsed`; the run goes on.'
