  - kind: update
    category: rules
    slug: rule-retro
    ref: rule-retro
  - kind: update
    category: estimates
    slug: estimate-retro-loads
    ref: estimate-retro-loads
  tags: []
  case_text:
    given: Retro runs before the librarian; `generate` after it ticks the page lines and the `read` lines
      whose reading stands in the ledger, `render` and `sprint` the render and sprint lines (cases 226,
      250, 270.1).
    when: The person invokes `/retro`, and the agent counts the unticked `tasks` of the Spec.
    then: 'A `create`, `update` or `defer` line of a page, a `guppi render` line, a `guppi sprint` line
      and a `read` line whose `estimate[...]` stands in the ledger of this session are listed as waiting
      for the librarian and end in none of the four ways; every other unticked line is debt, as today.

      **－** A `read` line without its line in the ledger is debt: the reading was not done.

      **－** Nothing else in Retro changes.'
    context: 'Today `generate`, once it applied a `create`, `update`, `delete` or `defer` entry of `materialize.yaml`,
      ticks the page line of the Spec of the same session, in the section of the entry''s Case (case 226.1).
      An `estimate` entry — the reading of an Estimate — ticks nothing: the Criterion of `estimate-generate-ticks-the-spec`
      says the `read` lines are the agent''s. The agent writes the `estimate[...]` line into the ledger
      and must tick the `read` line of `spec.md` in the same reply; two actions of one event, and the
      second one is forgotten — three lines of the Specs 0958 and 0740 stand unticked with their readings
      `passed`. The librarian sees it and cannot repair it: the librarian writes only to `wiki/`. An `estimate`
      entry of the yaml carries no Case number, and a reading often lands in the Spec of another session
      (line 172 of session 0740 was read in 0958; the readings W1–W3 of this session are lines of the
      Spec 0958); a reading of the same session as the `create` folds into the `create` entry (`folded`).

      State of the pages: `rule-page-generation` `built`, `estimate-generate-ticks-the-spec` `passed`,
      its Criterion excludes `estimate`; `rule-case-protocol` `built`, `estimate-case-protocol-loaded`
      `passed` and names the sentence "Work Mode ticks … readings" in its Then, the same sentence stands
      in `case-schema.md`; `rule-retro` `built`, `estimate-retro-loads` `passed` and counts every unticked
      `read` line as debt; `rule-work-mode` `draft` (Slice 3b) untouched; the other six Estimates of `rule-page-generation`
      untouched; every `update` carries a `ref`, no vault query due.'
    problem: 'The ledger line and the tick in the Spec are one event held by two agents: one has no right
      to write into the Spec, the other forgets. Who ticks the `read` line, and what the protocol and
      Retro say about Work Mode then.'
