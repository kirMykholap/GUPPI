decisions:
- case: '270.1'
  decision: decision-case-270.1
  origin: raw/2026-09-20/1308/ledger.md#case-270.1
  targets:
  - kind: update
    category: rules
    slug: rule-page-generation
    ref: rule-page-generation
  - kind: update
    category: estimates
    slug: estimate-generate-ticks-the-spec
    ref: estimate-generate-ticks-the-spec
  tags: []
  case_text:
    given: 'A yaml entry of kind `estimate` carries `slug`, `status`, `result` and no `case`; a `create`
      entry with `folded` carries the reading of the same session.

      **＋** The Spec of the unit lies beside the yaml — `raw/<date>/<HHMM>/spec.md`; the Specs of the
      other sessions are the `spec.md` of their folders under `raw/`.

      **＋** A Case heading in the Spec is `## Case N — …` or `### Case N.M — …`; its section runs to the
      next such heading.

      **＋** A reading line of the Spec is `- [ ] read `<slug>`` with text after it, in any Case.

      **＋** `tests/test_generate.py` fixes the behaviour on a temp vault with a Spec beside the yaml and
      a second Spec in another session folder.

      **－** A Rule-class file entry `generate` does not apply — "applied by hand".'
    when: '`guppi generate` applied an entry and marked it `applied`.'
    then: 'For a `create`, `update`, `delete` or `defer` entry, in the `spec.md` of the same unit the
      first unticked line `- [ ] <kind> `<slug>`` in the section of the entry''s Case becomes `- [x]`;
      nothing else in the file changes.

      **＋** Two entries of one kind and slug in one Case tick two lines, in order.

      **＋** For an `estimate` entry, and for a `create` entry with `folded`, the first unticked line `-
      [ ] read `<slug>`` becomes `- [x]` — in the Spec beside the yaml first, then in the `spec.md` of
      the other session folders of `raw/`, oldest first; one line per entry.

      **＋** A `create` entry with `folded` ticks both lines: the page line and the reading line.

      **－** A line not found, a section not found, no Spec — no error and no stderr line; the entry is
      `applied` all the same.

      **－** `lesson` and Rule-class file entries, and an entry marked `failed`, tick no line; the lines
      on code, tests, migrations and `by hand` are the agent''s.

      **－** A Spec under `vault/archive/` is not read.'
    context: 'Today `generate`, once it applied a `create`, `update`, `delete` or `defer` entry of `materialize.yaml`,
      ticks the page line of the Spec of the same session, in the section of the entry''s Case (case 226.1).
      An `estimate` entry — the reading of an Estimate — ticks nothing: the Criterion of `estimate-generate-ticks-the-spec`
      says the `read` lines are the agent''s. The agent writes the `estimate[...]` line into the ledger
      and must tick the `read` line of `spec.md` in the same reply; two actions of one event, and the
      second one is forgotten — three lines of the Specs 0958 and 0740 stand unticked with their readings
      `passed`. The librarian sees it and cannot repair it: the librarian writes only to `wiki/`. An `estimate`
      entry of the yaml carries no Case number, and a reading often lands in the Spec of another session
      (line 172 of session 0740 was read in 0958; the readings W1–W3 of this session are lines of the
      Spec 0958); a reading of the same session as the `create` folds into the `create` entry (`folded`).

      State of the pages: `rule-page-generation` `built`, `estimate-generate-ticks-the-spec` `passed`,
      its Criterion excludes `estimate`; `rule-case-protocol` `built`, `estimate-case-protocol-loaded`
      `passed` and names the sentence "Work Mode ticks … readings" in its Then, the same sentence stands
      in `case-schema.md`; `rule-retro` `built`, `estimate-retro-loads` `passed` and counts every unticked
      `read` line as debt; `rule-work-mode` `draft` (Slice 3b) untouched; the other six Estimates of `rule-page-generation`
      untouched; every `update` carries a `ref`, no vault query due.'
    problem: 'The ledger line and the tick in the Spec are one event held by two agents: one has no right
      to write into the Spec, the other forgets. Who ticks the `read` line, and what the protocol and
      Retro say about Work Mode then.'
  spec: vault/raw/2026-09-20/1308/spec.md
  applied: '17:36:05'
