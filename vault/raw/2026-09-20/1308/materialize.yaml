      the text before a tool call waits for the next `Stop` of the session, and the last reply of a session
      has none.

      **＋** A block a tool call did follow the agent does not call lost before the `Stop` of that turn;
      at the next `Stop` it checks the ledger, and only a line missing there is a lesson.

      **＋** The Case protocol says Work Mode ticks the boxes on code, tests, migrations and `by hand`
      checks; `generate` ticks the page lines and the `read` lines whose reading stands in the ledger;
      `render` and `sprint` tick the render and sprint lines (cases 226, 250, 270).

      **－** A reply whose ledger lines sit outside a `LEDGER` block — bare, or in a fence with another
      tag or none — adds nothing to the session''s ledger.'
    context: 'Today `generate`, once it applied a `create`, `update`, `delete` or `defer` entry of `materialize.yaml`,
