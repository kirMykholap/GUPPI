      **＋** An `update` of the Render of `rule-case-protocol` touches the Estimate of the live reading
      of that Render (187).

      **＋** The reading of `estimate-case-protocol-case-form` is the Cases of this session at its close,
      by hand.


      When:

      The agent writes a Case in the chat — at its first showing, when shown again after the owner''s
      change, and with sub-cases.


      Then:

      `given` holds the conditions of the behaviour; the state of the pages the Case changes goes to `context`.

      **＋** `context` opens with the mechanism in plain words — what the thing does today and where it
      goes wrong — and closes with one sentence of bookkeeping: the state of the pages, the vault''s answer,
      the Estimates of the rule the Case touches and the ones it does not; a case number stands in `context`
      or `problem` only when the Case is about that case; no count of sentences — the shape of each story
      section bounds it (case 267).

      **＋** `given`, `when` and `then` together are the Criterion of the Estimate, copied whole and replacing
      what stood there.

      **＋** An item that writes `sections: Criterion` itself signs that text, on a `create` and on an
      `update` alike; the Case''s `given`, `when`, `then` are the Criterion of the one Estimate that writes
      none; that is how one Case touches two Estimates.

      **＋** The Case names by slug the Estimate it changes.

      **＋** `tasks` carries no `contract` line and no "block N" line.

      **－** A `create` carries no `method`, `estimate_kind` or `estimate_slug`: a new promise is an explicit
      `create` of an Estimate with its own slug.

      **－** The eight sections of the chat form do not change.'
