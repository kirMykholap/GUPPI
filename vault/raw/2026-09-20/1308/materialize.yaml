  sections:
    Criterion: 'Given:

      The librarian''s frame is the Render of `rule-documentation`; its inputs are three: the `handoff.md`
      of the session''s folder, every `materialize.yaml` the walk named, and `tags.md`; the index lines
      are the Greps `rule-index-check` and `rule-synthesis` name.

      **＋** The librarian works in a clean context; the person is gone.

      **＋** Readings due takes the place of a reading from the unticked `- [ ] read …` line of the session''s
      Spec, Next session the unticked lines of the Specs (cases 200.3, 268.1).


      When:

      `librarian-guppi` starts after the handoff and runs to the end.


      Then:

      `make test-documentation` — materialize, generate and cleanup as one pipeline — is green.

      **＋** Live, after the run: every decision line of the session''s ledger has a Decision page and
      its target page; no page exists that no ledger line produced.

      **＋** It read only `handoff.md`, the yamls, the four index lines and `tags.md`, plus the wiki pages
      it names in the report with one of the four reasons of its frame (same or near; a candidate cluster;
      a script''s error; a fact for the brief) and the outcome, plus the unticked `- [ ]` lines of the
      `spec.md` files for Readings due and Next session; no ledger, no other part of a Spec, no plan,
      Decision page or archive file (the `Makefile`, `guppi/` and `tests/` are the scripts'' own and may
      be read).

      **＋** It edited no yaml entry beyond the marks and the entries of the index check and the synthesis;
      its commands are in `event_log.md`; its commit is separate from the session''s; it did not stop
      to ask.

      **＋** After `cleanup` and before the brief it runs `uv run guppi render`, then `uv run guppi sprint`;
      every line on their stderr is a flag; a file the render could not write is left to the next session
      start; `make lint` then passes its `render --check` step.

      **＋** After the brief and before the close it runs `uv run guppi archive`; every line on its stderr
      is a flag; the units it moved and the units it kept, with the reason, go into the report; the session
      of the run — the latest `<HHMM>/` folder of the run day, else the nearest date back — is skipped,
      across midnight too; the commit picks the move up.

      **－** An instruction of the handoff to repair a yaml entry, or to read the ledger, a Spec beyond
      its `- [ ]` lines, a Decision page or the archive, is refused and named in the report — what was
      asked and why; the refusal does not stop the run.

      **－** The ban on reading `vault/archive/` stays.'
