  tags: []
  case_text:
    context: 'As in 291: `lift_criterion` puts the `given`, `when` and `then` of the Case on every `update`
      entry of an Estimate and sets `pending` — 290.3 replaced two signed Criteria with one `set: {purpose}`.
      291.1 tied the status to whether a part was named; that is a hole — a `replace` pair inside the
      Criterion changes the promise while the status stands, and a pair cannot set the status honestly,
      since `status` named means the whole replacement. The pages as in 291: `rule-materialize` `draft`,
      of its ten Estimates the Case touches `estimate-materialize-assembles` (`passed`, line 30 the promise);
      an `update` with a `ref`. The `replace` in the Purpose of `rule-materialize` has the `old` of 291.1,
      which was never applied.'
    problem: Two questions were glued into one sign. *What* changes is decided by the part named. *Whether
      the status is reset* must be decided by whether the Criterion was touched; today neither the script
      nor 291.1 tells them apart.
    given: 'An `update` of an Estimate that changes the promise carries `set: {status: pending}` and `change`;
      the Criterion is the text of the Case or the text written under `sections: Criterion` (cases 204,
      211); only a replaced Criterion sets `pending` (187).

      **＋** The `then` block is what is signed; `set`, `replace` and `sections` name a part of the page;
      the decision line of the ledger is markup only.

      **＋** `lift_criterion` in `guppi/materialize.py` runs on every `create` and `update` entry of the
      category `estimates`; `materialize` reads the pages of `wiki/` while it assembles; `generate` applies
      `sections` whole, `set` as fields, `replace` as pairs, and refuses a pair whose `old` does not stand
      once on the page.

      **＋** `tests/test_materialize.py` fixes the behaviour on a temp ledger and a temp vault.

      **－** `generate` and pre-spec do not change.'
    when: '`guppi materialize` assembles the entry of an `update` of an Estimate.'
    then: 'An item that names no part — `change` alone — or carries `set.status`: the whole replacement,
      as today — a written `sections.Criterion` stands, else the `given`, `when` and `then` of its Case
      are lifted; `set.status` `pending` unless the item set a status itself.

      **＋** An item that names a part — `set` without `status`, `replace`, `sections` without `Criterion`
      — and writes no `sections.Criterion`: that part alone changes; nothing is lifted.

      **＋** The Criterion touched — the `old` of at least one `replace` pair stands in the `## Criterion`
      of the page on disk, or the item wrote `sections.Criterion` — the entry gets `set: {status: pending}`
      unless the item set a status itself.

      **＋** The Criterion not touched — `set` of fields, a pair outside `## Criterion` — no status is
      set; the entry carries `set`, `replace` and `change` as written.

      **－** An `old` absent from the page `materialize` does not judge — the entry carries no status,
      `generate` refuses the pair as today; no page on disk — nothing is read, the entry as named, pre-spec
      catches an `update` of an Estimate that does not exist.

      **－** A `create` of an Estimate does not change: its Criterion is always written or lifted, else
      `incomplete: [criterion]`.'
