  - kind: update
    category: estimates
    slug: estimate-materialize-assembles
    ref: estimate-materialize-assembles
  tags: []
  case_text:
    given: 'An `update` of an Estimate that changes the promise carries `set: {status: pending}` and `change`;
      the Criterion is replaced whole — by the text of the Case or by the text written under `sections:
      Criterion` (cases 204, 211); only a replaced Criterion sets `pending`.

      **＋** The `then` block is what is signed; its keys `set`, `replace` and `sections` name a part of
      the page; the decision line of the ledger is markup only.

      **＋** `lift_criterion` in `guppi/materialize.py` runs on every `create` and `update` entry of the
      category `estimates`; `generate` applies `sections` whole, `set` as fields, `replace` as pairs.

      **＋** `tests/test_materialize.py` fixes the behaviour on a temp ledger.

      **－** `generate` and pre-spec do not change.'
    when: '`guppi materialize` assembles the entry of an `update` of an Estimate.'
    then: 'An item that names no part — `change` alone — or names `status`: the whole replacement, as
      today — a written `sections.Criterion` stands, else the `given`, `when` and `then` of its Case are
      lifted; `set.status` `pending` unless the item set a status itself.

      **＋** An item that names a part — `set` without `status`, `replace`, `sections` without `Criterion`
      — and writes no `sections.Criterion`: that part alone changes; nothing is lifted, no status is set,
      the Criterion of the page stands.

      **＋** An item with `sections.Criterion` and any other part: the written Criterion, the part as named,
      `pending` unless a status is set.

      **－** A `create` of an Estimate does not change: its Criterion is always written or lifted, else
      `incomplete: [criterion]`.'
    context: '`materialize` assembles one entry per ledger line. For an `update` of an Estimate, `lift_criterion`
      in `guppi/materialize.py` always puts `sections.Criterion` on the entry — the `given`, `when` and
      `then` of the Case — and sets `set.status: pending`, unless the item wrote a Criterion or a status
      itself. That is right for a change of the promise: the Case schema says such an `update` carries
      `set: {status: pending}` and `change`, and the Criterion is replaced whole (cases 204, 211). But
      an `update` that sets one field takes the same path: 290.3 set `purpose` on two Estimates, and the
      Criterion of 286 on `estimate-generate-ticks-the-spec` and of 288.1 on `estimate-internal-context-loaded`
      were replaced by the text of 290.3, whose own `then` said the Criterion does not change. Neither
      pre-spec nor the librarian caught it. The first case of the same root cause is `lesson-estimate-update-must-carry-its-criterion-whole`
      (session 0958); the second is the lesson of this session.

      The pages: `rule-materialize` `draft` (`estimate-materialize-carries-addresses` pending), an `update`
      with a `ref`, no vault query; of the ten Estimates of the rule the Case touches one, `estimate-materialize-assembles`
      (`passed`; its line "`set: {status: pending}` unless the item set a status itself" is the promise),
      the other nine not. `rule-case-protocol` is not touched: the schema already says only a replaced
      Criterion sets `pending`, and the `update` form of a promise change already carries `set: {status:
      pending}` — that is the signal.'
    problem: The script knows one kind of `update` of an Estimate — the change of the promise — and replaces
      the signed Criterion on every `update`. The two Criteria signed in 286 and 288.1 do not stand on
      their pages; the reading of `estimate-internal-context-loaded` has nowhere to land.
  spec: vault/raw/2026-09-21/1315/spec.md
  superseded_by:
  - decision-case-296
  applied: '18:37:05'
