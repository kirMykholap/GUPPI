      yaml of any unit (175, 177); `generate` applies none of them and ticks none of their lines (151,
      286); Retro does not count them (282).

      **＋** The Spec of a session is the plan approved at the end of Plan Mode, copied to `raw/<date>/<hi
      HHMM>/spec.md` (73.1); `## Case N — …` or `### Case N.M — …` is a heading, its section runs to the
      next such heading.

      **＋** `case-schema.md` is the Render of `rule-case-protocol`; an `update` of the Render touches
      the Estimate of its live reading (187); `index.md` §7 is a Rule-class file, by hand.'
    when: The agent in Plan Mode supersedes a Case of the same session, before the Spec is approved; the
      person reads the schema.
    then: 'The Spec holds no section of the superseded Case — no heading, no blockquote, no `then` or
      `tasks` block; the superseding Case is written whole, with its own `tasks`; the text of the superseded
      Case is not kept — its ledger lines name its targets, and the `context` of the superseding Case
      says what it replaced.

      **＋** A Frontier line closed by the superseded Case is closed again by the superseding one.

      **＋** The paragraph of the schema on the Criterion and §7 of `index.md` say it in one sentence beside
      "the replaced text stays in the Spec of its session".

      **－** A supersede from a later session does not change: the earlier Spec keeps the text, as today.'
    context: 'The Spec is the plan the person approves at the end of Plan Mode. In session 1315 Case 296
      superseded 291.1 before the approval, and the Spec of 1315 still holds 291.1 whole: its sections,
      its `then` block, its five task lines. Nothing ticks or removes them: `generate` neither applies
      nor ticks the entries of a superseded Case (151, 286), Retro does not count them (282). The lines
      stay `[ ]` for good and read like debt. The sentence of the schema, "the replaced text stays in
      the Spec of its session and in History", is right for a supersede from a later session, whose Spec
      is archived history; inside one session the superseded Case was never the plan. Three scripts lean
      on the Case being in the Spec: `prespec --check` (`check_lines`) prints "no Case N heading in the
      plan" for a ledger line whose Case left the plan — so today removing 291.1 from the plan would be
