  sections:
    Milestones: '### Slice 3f — the Rule-class files into the graph


      The vault is a graph of pages; fourteen files stand outside it — `index.md`, `glossary.md`, six
      `schema.md` and six `schema.yaml` — changed by hand, without `purpose`, History or Estimates, and
      kept by a route of their own in the scripts. The Slice brings each into the graph by its nature
      and removes the "by hand" route: a developer''s vault changes only by the scripts, from decisions
      (case 301).


      - [[estimate-sprint-migration-rule-class-files-dissolved]] — no Rule-class file: the schemas rendered
      from rule pages, the glossary from `terms`, `index.md` gone, the `file` route out of the scripts

      - 1. schemas — six Leaves `rule-<category>-schema`, `enforcement: render`, the Render the `schema.yaml`
      with the description of its fields as yaml data; `schema.md` gone; one rule per category, never
      two

      - 2. audit of the rules — the parent of every rule: under a category''s MOC a rule that holds for
      that category alone, the MOC made at two or more such rules, else the schemas under `rule-page-schemas`;
      `applies_to` on a Rule and `rules` on an Entity, the edge Rule → Entity, `rule-sprint` → `entity-sprint`
      the first (from the Backlog, session 1119)

      - 3. glossary — `terms` on the page that defines a term; `guppi glossary` writes `glossary.md`,
      grouped by the parent MOC, under `rule-glossary` with `governs`, `implementation_ref` and `--check`,
      the pattern of `rule-sprint`; the rows on `§N` resolved as the index dissolves, "Retired terms"
      into the history of decisions

      - 4. `index.md` — one Case per §: covered by a rule page, the § leaves; not covered, a rule is made;
      the last Case removes the file and every `§N` pointer in the vault

      - 5. scripts — the audit "script — what it assumes — what changes"; the `file` route and "applied
      by hand" removed from `materialize`, `generate`, `prespec`, `lint`; the grep of `index.md` out of
      `rule-ask`; `rule-morph` (Slice 5) kept compatible with six schema rules

      - 6. close — "Rule-class" retired in the Case schema and the glossary; the Estimate read; the Slice
      moved to Closed


      ### Slice 3b — Work Mode


      - [[rule-work-mode]] — Work Mode: the Spec as tasks with code, the ticked boxes in `spec.md`, the
      test of each Estimate written first and turned green; the sentence of [[insight-workflow-code-live-before-the-page-it-reads]]
      on a check that reads a page the same Spec changes; cases 183, 206, 238

      - [[rule-subagent-guppi]] — what a subagent may do in Work Mode, and the fork that comes back to
      the main agent as a Case; cases 183, 206


      ### Slice 4 — conversion of the parked pages by group


      - [[estimate-sprint-migration-leftovers-gone]] — every page of `vault/parked/` and every document
      of 2026-08 under `docs/` converted, archived or deleted by a decision


      ### Slice 5 — closing


      - [[estimate-sprint-migration-lint-clean]] — `make lint` exit 0: the 31 Decision pages of Cases
      1–28 decided, `unmigrated` at zero

      - [[estimate-sprint-migration-merges]] — `make test` green, `migration` merged into `main`; at the
      close [[rule-git-context]] and [[rule-github-issues]] — the upstream of the branch and the GitHub
      remote, decisions 11.1, 11.2, defers 220, 243 — read by [[estimate-sprint-migration-leftovers-gone]]

