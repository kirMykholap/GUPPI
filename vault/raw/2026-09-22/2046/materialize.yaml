  case_text:
    context: 'Case 338.1 of the conserved Spec brings the Criterion of `estimate-prespec-binds-a-sprint-line`
      to what the code does after case 335: the test runs on the source segment of a Frontier line — the
      one before the closer — and not on every segment. It changes the `When` and the `－` line and leaves
      the `method` field in the old wording: the last case of the run there still reads "a line without
      sprint among its segments". After 335 that case distinguishes nothing. The case that does is a line
      where the word `sprint` stands inside the slug of a title while the source segment is another word
      — the false positive `prespec --check` prints today on line C6 of session 1724, whose source is
      `brief` and whose title holds `estimate-sprint-migration-index-dissolved`.

      The page stands `passed`, its target is `rule-prespec`. Case 335 of the same Spec changes `prespec.check_frontier`
      and `estimate-prespec-checks-the-plan`, not this page. The page carries no `estimates` field of
      its own.'
    problem: The Criterion moves to the source segment while the `method` still tells the reader to run
      the old case; a reading taken by that method measures what the code no longer distinguishes.
    given: 'The `When` of the Criterion reads "a Frontier line whose segments hold `sprint`", its `－`
      line "A line without `sprint` among its segments is read as today".

      **＋** Its `method` ends with the words "a line without sprint among its segments".

      **＋** Case 335 narrows the test to the segment standing before the closer.

      **＋** A `replace` pair whose `old` stands in `## Criterion` changes a part and sets the page `pending`
      (296); a `set` of a field other than `status` changes that field alone (296).

      **＋** The command of the method stays `uv run pytest tests/test_prespec.py -k sprint`, so the form
      of `method` holds for lint.'
    when: '`uv run guppi prespec --check` reads a Frontier line closed `· case N`.

      **＋** The next reading of the page is taken by its `method` field.'
    then: 'The `When` of the Criterion speaks of the source segment — the one before the closer — and
      not of every segment.

      **＋** The `－` line says: a line whose source segment is not `sprint` is read as today; the word
      inside the slug of a title is not the source.

      **＋** The `method` names as the last case of its run a line whose source segment is not `sprint`
      while the word stands inside the slug of its title.

      **＋** The `method` keeps its command, `uv run pytest tests/test_prespec.py -k sprint`.

      **－** The rest of the Criterion does not change; the page goes to `pending` and is read again.'
