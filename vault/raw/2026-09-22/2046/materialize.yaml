  origin: raw/2026-09-22/2046/ledger.md#case-350
  decision: decision-case-350
  ref: rule-estimates-schema
  supersedes: '343'
  category: rules
  replace:
  - old: 'optional; one line. How the promise is checked: the test command (`make test-x`, `pytest tests/test_x.py`);
      or where and when it is read by hand — a live reading of a session start, the brief of a librarian''s
      run; or, for Research, what is measured. Written from the Case since case 193.'
    new: 'optional; one line. How the promise is checked, in one of the four forms lint classifies: a
      `make <target>` of the Makefile; the word `pytest`; a path under `tests/`; or the words `by hand`
      — the one spelling of a reading — with where and when it is taken, a session start, the brief of
      a librarian''s run. Naming a form is not enough by itself: a path under `tests/` must exist and
      a `make <target>` must stand in the Makefile. On the Estimate of a MOC the form is a `make <target>`
      of the Makefile alone — there `pytest` or a path by itself earns a finding, and `by hand` passes
      only when every child''s Estimate is a reading or a sibling Estimate of the MOC names such a target.
      A `method` that names none of the forms earns a finding of the class `method`. A page counts as
      the shape before case 193 on any of four triggers — no `method` field, a `## Context` section, a
      `## Method` section, a `### case N` block in the Criterion — and goes into the line `unmigrated`;
      one with no field that keeps a `## Method` section has that section read as its `method`, so it
      can earn a `method` finding as well. For `Research` what is measured stands beside one of the forms,
      never instead of one. Written from the Case since case 193 (case 350).'
  change: the description of method names the four forms, what lint checks besides naming one, and the
    four triggers of the old shape (case 350, supersedes 330.2, 336 and 343)
