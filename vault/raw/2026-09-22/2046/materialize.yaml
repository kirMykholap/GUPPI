- case: '350'
  decision: decision-case-350
  origin: raw/2026-09-22/2046/ledger.md#case-350
  targets:
  - kind: update
    category: rules
    slug: rule-estimates-schema
    ref: rule-estimates-schema
  - kind: update
    category: estimates
    slug: estimate-estimates-schema-checked
    ref: estimate-estimates-schema-checked
  tags: []
  case_text:
    context: 'Case 343 set out to repair the promise that a `method` naming one of the four forms earns
      no finding, and repaired half of it. It made the exception for the Estimate of a MOC and none for
      the Estimate of a Leaf: `check_method` earns a finding on a `tests/…` path that is not on disk,
      and on a `make <target>` the Makefile does not hold. A reader of the schema signs `pytest tests/test_x.py`
      for a file that does not exist and believes it clean. Its second error: the text says a page of
      the old shape is one with no `method` field, while `is_old_shape` counts a page as old-shaped on
      any of four triggers — no `method` field, a `## Context` section, a `## Method` section, or a `###
      case N` block in the Criterion; three of the four hold for pages that do carry the field.

      `rule-estimates-schema` renders `vault/wiki/estimates/schema.yaml`; the live reading is `estimate-estimates-schema-checked`,
      `passed`, whose Criterion covers the prose as data and does not itself change. The words "the one
      spelling of a reading" hold once the code task of case 330.1 of the conserved Spec lands: `READING`
      still stands in `guppi/lint.py`.'
    problem: 'The text that is to bring the schema into agreement with lint disagrees with it in two more
      places: what the Estimate of a Leaf may name, and what makes a page old-shaped.'
    given: '`vault/wiki/estimates/schema.yaml` is the Render of `rule-estimates-schema`; the agent reads
      it before a `create` of an Estimate.

      **＋** `check_method` on the Estimate of a Leaf: a path under `tests/` that does not exist earns
      a finding; a `make <target>` the Makefile does not hold earns a finding; `by hand` is clean; no
      path, no `pytest` and no target earns a finding.

      **＋** `check_method` on the Estimate of a MOC: a `make <target>` of the Makefile is required; without
      one `by hand` passes when every child''s Estimate is a reading (112.1) or a sibling Estimate of
      the MOC names such a target (212); `pytest` or a path alone earns a finding.

      **＋** `is_old_shape` counts a page as old-shaped on any of four triggers: no `method` field, a `##
      Context` section, a `## Method` section, a `### case N` block in the Criterion.

      **＋** `method_of` takes the `method` field, and without it the `## Method` section; 23 live Estimates
      carry no field and keep the section.

      **＋** An `update` of an Estimate with `sections: Criterion` keeps the written text and does not
      take the Criterion from the Case (204); the page carries a `method` field, so case 211.2 does not
      refuse it.'
    when: The agent reads `vault/wiki/estimates/schema.yaml` before writing a `create` of an Estimate.
    then: 'The description of `method` names the four forms as a list: a `make <target>` of the Makefile;
      the word `pytest`; a path under `tests/`; or the words `by hand` — the one spelling of a reading
      — with where and when it is taken.

      **＋** It says that naming a form is not enough by itself: a path under `tests/` must exist and a
      `make <target>` must stand in the Makefile.

      **＋** It says that on the Estimate of a MOC the form is a `make <target>` of the Makefile alone;
      there `pytest` or a path by itself earns a finding, and `by hand` passes only when every child''s
      Estimate is a reading or a sibling Estimate of the MOC names such a target.

      **＋** It says that a page counts as the shape before case 193 on any of four triggers — no `method`
      field, a `## Context` section, a `## Method` section, a `### case N` block in the Criterion — and
      goes into the line `unmigrated`; and that a page with no field which keeps a `## Method` section
      has that section read as its `method`, so it can earn a `method` finding as well.

      **＋** A `method` that names none of the forms earns a finding of the class `method`.

      **＋** For `Research` what is measured stands beside one of the forms, never instead of one.

      **＋** `estimate-estimates-schema-checked` goes to `pending` with its Criterion unchanged, and is
      read again after the render.

      **－** The field stays `optional`.'
  spec: vault/raw/2026-09-22/2046/spec.md
  supersedes:
  - decision-case-343
  applied: 00:11:21
- case: '351'
  decision: decision-case-351
  origin: raw/2026-09-22/2046/ledger.md#case-351
  targets:
  - kind: create
    category: estimates
    slug: estimate-prespec-simulates-the-pairs
    ref: rule-prespec
  - kind: update
    category: rules
    slug: rule-prespec
