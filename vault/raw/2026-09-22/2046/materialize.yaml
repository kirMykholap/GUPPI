  case_text:
    context: 'Step 1 of the `/carry` skill — the Render of `rule-carry-over` — tells the agent to rewrite
      `vault/wiki/brief.md` "by the frame of `rule-brief` (the Render in `.claude/agents/librarian-guppi.md`)".
      It names the file and not the place in it. The frame stands between the `rule-brief` markers of
      that file, lines 77–93 today, and nothing in the instruction says so. The event log of the day records
      what follows: at 20:43:03, five seconds after `Skill: carry`, `grep -n -i "brief" .claude/agents/librarian-guppi.md`,
      and at 20:43:05 `sed -n ''77,92p''` of the same file — the search for the frame and then the read
      of the marker range. The path of the brief itself is not the defect: step 1 names `vault/wiki/brief.md`
      in full, and step 3 commits it by name.

      `rule-carry-over` stands `built`, a Leaf, `render_mode: full` over `.claude/skills/carry/SKILL.md`.
      Its one Estimate is `estimate-carry-over-writes`, `passed`, whose Criterion ends with a `－` line
      that the skill file equals the Render of the page; case 233.4 handled a change of this Render the
      same way — the page set `pending`, the Criterion kept. The reading of that Estimate needs a live
      `/carry`, so it falls to the next conserved session unless this one conserves again.'
    problem: The instruction names the file that holds the frame and not the place in it, so the agent
      searches for what the instruction could have pointed at.
    given: 'The Render of `rule-carry-over` becomes `.claude/skills/carry/SKILL.md` whole; the file is
      not edited by hand.

      **＋** The frame of `rule-brief` stands between its markers in `.claude/agents/librarian-guppi.md`,
      which is itself a Render.

      **＋** `guppi render` replaces a line that is exactly `<!-- slug -->` inside a Render with that child''s
      text, so a marker written on a line of its own inside this Render would become an inclusion.

      **＋** An `update` of a rule''s `Render` touches the Estimate of the live reading of that Render
      (187); the live reading here is `estimate-carry-over-writes`, `passed`.'
    when: The agent calls the skill `carry` after the person's answer at the fork and reads step 1.
    then: 'Step 1 of the skill names the frame by its place: the text between the `rule-brief` markers
      of `.claude/agents/librarian-guppi.md`.

      **＋** The markers are named in words, not written as markers, so the renderer does not read the
      line as an inclusion.

      **＋** `estimate-carry-over-writes` goes to `pending` with its Criterion unchanged, and is read again.

      **－** Nothing else of step 1 changes: the short shape, the omitted sections, the rule for Deferred
      and the Flags stand as they are.

      **－** `rule-brief` does not change.'
