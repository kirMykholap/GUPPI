  tags: []
  case_text:
    context: 'Case 348 wrote into the ban of the librarian''s frame that every ledger line already stands
      in `materialize.yaml` with its `line`, `text` and `origin`, so the file is never needed. That is
      false. The ledger of session 0014 holds 64 lines; the yaml''s entries cover 1–51, 58 and 60, and
      `unparsed` is empty. Lines 52–57, 59 and 61–64 have no entry: they are `estimate[...]` readings
      that folded into entries the run skipped. So the librarian went to the file not because the frame
      invited it but because the fact was nowhere else — "a ledger line this run did not apply" is the
      one fact the yaml lacks. A second inaccuracy: the entries the librarian appends at the synthesis
      carry no `line`, `text` or `origin`, and the frame reads those too.

      `rule-documentation` stands `draft`, a MOC; `estimate-documentation-completes` stands `failed` on
      this very reading. The gap in `materialize` is recorded as a lesson of this session and is not repaired
      here.'
    problem: The ban sends the librarian to a place that does not answer the question the brief asks,
      which makes breaching the frame the only way to obey it.
    given: 'The frame of `rule-documentation` bans reading `ledger.md`, `plan.md`, `wiki/decisions/` and
      `vault/archive/`, and `spec.md` beyond its unticked `- [ ]` lines.

      **＋** The `Work` line of the brief requires the ledger line this run did not apply to be named.

      **＋** `materialize.yaml` holds no entry for a line whose reading folded into an entry the run skipped,
      and `unparsed` stays empty.

      **＋** A part inside a Criterion sets the page `pending` with no `set.status` (296).

      **＋** An `update` of a rule''s `Render` touches the Estimate of the live reading of that Render
      (187); here it is `estimate-documentation-completes`.'
    when: The librarian writes the `Work` line of the brief and must name the ledger line this run did
      not apply.
    then: 'The ban allows one read of `ledger.md` and no other: the count of its lines and the lines the
      yaml does not account for; the read is named in the report.

      **＋** The frame says why: a reading that folded into an entry the run skipped gets no entry of its
      own, so the yaml does not hold every line.

      **＋** Everything else in the ban stands: `plan.md`, `wiki/decisions/`, `vault/archive/`, a Spec
      beyond its unticked lines, and the ledger for any other purpose stay closed.

      **＋** The Criterion of `estimate-documentation-completes` names that one carve-out in place of its
      bare "no ledger"; the page goes to `pending`.

      **－** `rule-brief` does not change.

      **－** `rule-materialize` is not repaired here: the gap stands as a lesson.'
