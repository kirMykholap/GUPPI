  - workflow
  case_text:
    context: 'Case 345 gives `pre-spec` a check of the anchors and leaves two defects. First: it changes
      the Render of `rule-prespec` and does not name `estimate-prespec-reconciles`, the live reading of
      that Render, `passed`, whose method is one reading by hand of the first `/pre-spec` after the render.
      That is the breach of case 187 which 341 and 342 exist to repair and which 347, 349 and 350 of this
      plan all observe. Second: it gives the Insight `addressed_by` as a list of two links, while the
      schema of an Insight requires one quoted wikilink — unlike `deferred_by`, which the same schema
      calls a list; all nine live Insights carry one.

      `rule-prespec` stands `built`, a Leaf; the anchor of the pair stands once in it; the pair of case
      335 of the conserved Spec touches another span. Two Estimate items in one `then` block each need
      a written `sections: Criterion`, or one wording is signed twice, so the Criterion of the created
      Estimate is written out. `estimate-prespec-checks-the-plan` is not named: a new check of `--check`
      has its own Estimate, as in cases 327 and 331.'
    problem: The Case changes a Render without naming its live reading, and writes `addressed_by` in a
      form the schema does not know.
    given: '`prespec --check` reads the plan and the live pages of the vault; it has no check of an anchor
      at all.

      **＋** `generate` applies the pairs in entry order and matches with whitespace collapsed, exactly
      one occurrence.

      **＋** The pairs of one Spec can touch one span: 314.2 against 310.6.

      **＋** An Insight is the target of the `update` that closes or rejects it; `actioned` sends its `clustered`
      children to the archive by the cascade.'
    when: '`uv run guppi prespec --check <plan> --session <id>` reads the plan before the Spec is approved.'
    then: 'The `replace` and `reword` pairs of every Case of the plan are applied in entry order to copies
      of the pages in memory, whitespace collapsed as `generate` collapses it; nothing is written to disk.

      **＋** An anchor that misses, or hits more than once, gives one line with its Case, the page''s slug
      and the opening of its `old`.

      **＋** The anchor is judged against the page as the Spec leaves it, not as it stands today.

      **＋** The Insight moves to `actioned`, its `addressed_by` naming the Decision of this Case.

      **＋** `estimate-prespec-reconciles` goes to `pending` with its Criterion unchanged, and is read
      again after the render.

      **－** The meaning of the words in their place is not judged by a machine: that half is the requirement
      for signing a pair in `case-schema.md`.'
  spec: vault/raw/2026-09-22/2046/spec.md
  supersedes:
  - decision-case-345
  applied: 00:11:21
- case: '352'
  decision: decision-case-352
  origin: raw/2026-09-22/2046/ledger.md#case-352
  targets:
  - kind: defer
    category: rules
    slug: rule-skill-hi
    ref: rule-skill-hi
  tags: []
  case_text:
    context: 'Case 346 of this plan defers `rule-skill-hi` and `rule-prespec` with one question — what
      a Frontier closer must tell apart. Case 351 of the same plan changes the Render of `rule-prespec`.
      Case 186.2 stands in the Render of `rule-prespec` itself and in the Criterion of `estimate-prespec-reconciles`:
      a Case that changes a page another Case of the same plan defers is a finding, with no exception
      for disjoint spans. The mechanism is the reason — a defer writes `deferred_by` and the cascade takes
      the page from `built` to `draft`, so the text 351 ratifies would land on a page marked as carrying
      an open question.

      `rule-skill-hi` stands `draft`, a MOC; `rule-prespec` stands `built`, a Leaf, and this plan changes
      it in 351 while the conserved Spec changes it in 331 and 335. Case 334 was superseded by 339, 339
      by 346; this Case supersedes 346. The `purpose` carries what neither 339 nor 346 said: a session
      that passes over an item of the sprint leaves no trace anywhere but the Frontier, which dies with
      the session.'
    problem: The defer of a page and the change of that page stand in one plan. Either the question loses
      its second page, or the change waits a session.
  spec: vault/raw/2026-09-22/2046/spec.md
  supersedes:
  - decision-case-346
  applied: 00:11:21
- case: '353'
  decision: decision-case-353
  origin: raw/2026-09-22/2046/ledger.md#case-353
  targets:
  - kind: update
    category: rules
    slug: rule-case-protocol
    ref: rule-case-protocol
  - kind: update
    category: estimates
    slug: estimate-case-protocol-loaded
    ref: estimate-case-protocol-loaded
  tags: []
  case_text:
    context: 'Cases 341 and 342 of this plan both change one paragraph of the Render of `rule-case-protocol`
      — the one that describes an `update` — and both add a line to the Criterion of `estimate-case-protocol-loaded`.
      As a pair they carry three faults. Each writes into the live text the number of the Case it replaced,
      337 and 340, whose edits never land and whose Decision pages go to the archive marked superseded,
      so a reader of `case-schema.md` is sent to a Case that did nothing. They judge one position by opposite
      standards: 341 puts the requirement for signing a pair — a step of the author — right after the
      words "it carries no `contract`.", while the `context` of 342 argues that text at that anchor reads
      as a condition on the shape of an `update` and not as a step of the author. And two `given` lines
      carry traces: 342''s says the paragraph turns to `delete` and `defer` after the anchor, while the
      next sentence is the one on one promise per Case; 341''s names the anchor of case 340, which is
      gone.

      `rule-case-protocol` stands `draft`; the live reading of its Render is `estimate-case-protocol-loaded`,
      `passed`; the page''s three other Estimates are not touched. `estimate-case-protocol-case-form`
      stands `pending` and its Criterion already says that a Case names by slug the Estimate it changes;
      this Case does not change that Criterion, and its reading over the Cases of a session will meet
      the new step when it is taken.'
    problem: Two Cases divide one paragraph between them, cite the Cases they replaced, and disagree on
      where a step of the author belongs.
    given: '`case-schema.md` is the Render of `rule-case-protocol`, loaded by `/hi` in every working session;
      its sentence on the keys of an `update` runs "`set` … `sections` … `replace` (…), `change` (one
      line for History) and, when the page changes its slug, `rename` (… case 258.1); it carries no `contract`."

      **＋** The description of an `update` ends with the words "unless the part is inside the Criterion,
      which sets `pending` (case 296)."; the next sentence is the one on one promise per Case.

      **＋** `reword` is a key of a `then` block: `materialize` carries it into the entry (274.3), `generate`
      replaces the pairs as whole words over every live page, checks the owner and refuses the entry on
      a pair with no hit (274.1); a slug changes through `rename` (274.1).

      **＋** An `update` of a rule''s `Render` touches the Estimate of the live reading of that Render
      (187); a part inside a Criterion sets the page `pending` with no `set.status` (296).

      **＋** Both anchors stand once each in the page and do not overlap.'
    when: The agent writes the `then` block of a Case that changes an existing page, and reads the description
