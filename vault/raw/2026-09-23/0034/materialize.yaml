decisions:
- case: '354.1'
  decision: decision-case-354.1
  origin: raw/2026-09-23/0034/ledger.md#case-354.1
  targets:
  - kind: update
    category: rules
    slug: rule-sprint
    ref: rule-sprint
  - kind: update
    category: rules
    slug: rule-page-generation
    ref: rule-page-generation
  - kind: create
    category: estimates
    slug: estimate-sprint-moves-a-passed-over-item
    ref: rule-sprint
  tags:
  - sprint
  - harness
  case_text:
    given: '`generate` is the only writer to `wiki/`, the sprint page `entity-sprint-<id>` included.

      **＋** A milestone item is a line under `### <name>` in `## Milestones`; its pages are every `[[slug]]`
      before the first ` — `, by `sprint.item_slugs` (case 313).

      **＋** Every session writes `frontier.md` into its folder; `guppi archive` moves the folder whole
      to `vault/archive/<sprint>/<date>/<HHMM>/raw/`.

      **＋** A Frontier line is closed `[-]` when its item was put off (`· sprint`, `· defer case N`),
      and `[x]` when it was taken up (`· case N`, `· work`).

      **＋** `tests/test_generate.py` fixes the behaviour on a temp vault.'
    when: '`guppi generate` has applied every entry of the run and run the cascade.'
    then: 'For every item under `## Milestones`, the script reads the `frontier.md` of `raw/` and of the
      archive, from the newest session to the oldest by date and `HHMM`, and counts the lines whose title
      — the text before the first ` · ` — holds one of the item''s slugs in a code span.

      **＋** A `[-]` line adds one; an `[x]` line stops the count; a session without such a line is passed
      by.

      **＋** At a count of 3 or more, the item''s line leaves its milestone, unchanged, for the end of
      `## Backlog`.

      **＋** The History of the sprint page gets the line `moved to the Backlog: <slug> passed over in
      <N> sessions in a row — <HHMM>, … · generate`, and stdout one line on the move.

      **－** An open `[ ]` line is not counted.

      **－** A note — a line with no `[[slug]]` before the ` — ` — is not counted and not moved; the items
      of `## Backlog` and `## Closed` are not counted.'
    context: 'A session that passes over a milestone item closes its Frontier line `[-] … · sprint` (case
      310.5). No page keeps a trace of it: `deferred_by` does not grow, and `frontier.md` goes to the
      archive with its session. `rule-work-mode` and `rule-subagent-guppi` have stood in Slice 3b since
      2026-09-12: 19 defers before 310.5 and one pass by `· sprint` after it. The trace of these passes
      is only in the 33 archived `frontier.md` files.

      `rule-sprint` stands `built` and changes Milestones and Backlog only by the `update` of a Case;
      `rule-page-generation` stands `draft`, and `generate` is the only writer to `wiki/`; the vault answers
      that no page sets a threshold or moves an item by itself, and that the three counts of today are
      separate. The Estimates of `rule-sprint` — `estimate-sprint-renders-the-backlog` on the render,
      `estimate-sprint-checks-the-file` on `--check`, `estimate-sprint-ticks-the-spec` on the ticks —
      do not speak of a move and are not touched; the move is a step after the cascade, so `estimate-generate-cascades`
      is not touched.'
    problem: A sprint item can be passed over without end, and nothing takes it off the agenda. A script
      must count the passes in a row and move the item to the Backlog at three, with no judgment of the
      agent.
  spec: vault/raw/2026-09-23/0034/spec.md
  applied: 02:24:51
