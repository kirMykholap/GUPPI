      '
    Render: '<!-- rule-one-judgment-one-implementation -->

      ## One judgment, one implementation


      Where code judges the same text in two places — a check and a writer, a ticker or another check
      — the pattern or the predicate lives in one module and both sides import it; a second copy of one
      judgment is a defect on the day it is written. Where the two sides cannot share the code, one test
      runs both over the same input and asserts they answer alike.

      <!-- /rule-one-judgment-one-implementation -->

      '
