- case: '355.1'
  decision: decision-case-355.1
  origin: raw/2026-09-23/0034/ledger.md#case-355.1
  targets:
  - kind: update
    category: rules
    slug: rule-case-protocol
    ref: rule-case-protocol
  - kind: update
    category: estimates
    slug: estimate-case-protocol-loaded
    ref: estimate-case-protocol-loaded
  - kind: update
    category: estimates
    slug: estimate-case-protocol-case-form
    ref: estimate-case-protocol-case-form
  tags: []
  case_text:
    given: '`case-schema.md` is the Render of `rule-case-protocol`, loaded by `/hi`; the agent takes the
      form of a Case from it.

      **＋** The `Stop` hook writes only the lines inside a fence tagged `LEDGER`; the same lines in an
      untagged fence are a preview.

      **＋** The section Language allows one horizontal rule in the chat, after the Case or its last sub-case,
      only when the agent''s own text follows.'
    when: The agent shows a Case in the chat.
    then: '`ratification` holds the preview of the ledger lines in an untagged fence, and nothing else.

      **＋** The agent''s own text — a note, an effect, a caveat — stands after the Case, after one horizontal
      rule; the turn ends with a plain question.

      **＋** A fact the Case depends on — the effect of a first run, the state of a page — goes to `context`.

      **－** The human''s sign-off, question or alternative is their reply; the section keeps its place
      among the eight.'
    context: '`case-schema.md` describes `ratification` as the human''s sign-off, question or own alternative,
      ending with a preview of the ledger lines. It does not forbid the agent''s text there, and in Case
