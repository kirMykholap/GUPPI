      a render that refuses the drift of a text is such a guard (`rule-rules-schema`).

      **＋** A render puts a rule''s text into a file the agent reads — `CLAUDE.md` in every context, `case-schema.md`
      in a working session; `render --check` and a hook keep it there.'
