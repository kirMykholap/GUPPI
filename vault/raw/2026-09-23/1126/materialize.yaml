  - kind: update
    category: estimates
    slug: estimate-hi-writes-frontier
    ref: estimate-hi-writes-frontier
  tags: []
  case_text:
    context: '`/hi` writes `frontier.md`, and its lines are closed in the replies of Plan Mode, all inside
      Claude Code''s plan mode, whose text forbids any edit but the plan file. The leave exists already:
      `rule-permissions` counts the Frontier among the session''s own working files, and `settings.json`
      allows `Write` of `vault/raw/**/frontier.md`; the lesson `lesson-plan-mode-frontier-refused-on-the-client-text`
      (2026-09-16) recorded the same refusal. Neither the page nor the lesson is in the agent''s context
      at `/hi`, and in this session the refusal came again. The rule must stand in the text of the skill
      itself.

      `rule-skill-hi` stands `draft`; the Case touches `estimate-hi-writes-frontier`, not `estimate-hi-no-read-calls`;
      the lesson is of another session, so no `{addresses:…}` mark; no `create`.'
    problem: The text of `/hi` says to write `frontier.md`; Claude Code's plan mode says to write nothing
      but the plan file. The agent resolves the conflict for plan mode and refuses. The rule must say
      that plan mode does not stop the write and the closing of the lines of `frontier.md`.
    given: 'The system text of Claude Code''s plan mode forbids any edit but the plan file.

      **＋** The agent follows the Render of `rule-skill-hi`: it writes `frontier.md` at `/hi` and closes
      its lines in the replies of Plan Mode.

      **＋** `rule-permissions` counts `frontier.md` among the session''s working files; the client may
      still show its approval prompt (case 237).'
    when: The person types `/hi` with plan mode on, and the agent assembles the Frontier.
    then: 'The agent writes `frontier.md` into the session''s folder; it does not ask in the chat and
      does not say that it cannot.

      **＋** In the replies of Plan Mode the agent closes the lines of `frontier.md` the same way.

      **－** The client''s approval prompt, if it shows, is the person''s; the leave covers `frontier.md`
      alone.'
  spec: vault/raw/2026-09-23/1126/spec.md
  applied: '13:44:45'
