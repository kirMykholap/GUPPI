    slug: rule-case-protocol
    ref: rule-case-protocol
  - kind: update
    category: estimates
    slug: estimate-case-protocol-acknowledging-reply
    ref: estimate-case-protocol-acknowledging-reply
  tags: []
  case_text:
    context: 'Since Case 387.2 the `Stop` hook of `rule-spec-write` writes a Case into the Spec only after
      a reply whose `LEDGER` block holds that Case''s decision lines. When a Case is shown again and ratified
      again, its lines are the same as the ones already written. The ledger hook skips a line that already
      stands in any `ledger.md` under `raw/` (`guppi/ledger.py`, docstring). So in session 1859 the agent
      acknowledged the re-ratification of 384–388 without the block, and with the hook live those texts
      would not have reached the Spec. The schema does not forbid it: the section `## The acknowledging
      reply` of `rule-case-protocol` is silent on a re-ratification. The code needs no change: `stop()`
      in `guppi/ratified.py` takes the lines from the reply itself, not from the ledger, finds the last
      showing of the Case and replaces its section in the plan and in the ratified copy. Repeating the
      lines does no harm: the ledger does not write them twice. `rule-case-protocol` stands `draft`. No
      vault query: every item is an `update` with a `ref`. Read against the Case: `rule-spec-write`, `estimate-spec-write-copies-the-ratified-case`
      and `guppi/ledger.py`; no contradiction. `estimate-case-protocol-acknowledging-reply` speaks of
      the form of the acknowledging reply, so its Criterion is replaced whole, written in the model of
      Case 378: no `Given:` and no `－` line on the bounds of the measurement. `estimate-case-protocol-loaded`
      is not touched: its Criterion, still in the old model, lists the paragraphs of the Render, and the
      one pass of Slice 3g rewrites it whole (378.1); it is not read before that. `estimate-spec-write-copies-the-ratified-case`
      already asks for a reply with the `LEDGER` block and is not touched either.'
    problem: 'A re-ratified Case can stay out of the Spec: the schema lets the reply that acknowledges
      a re-ratification go without its `LEDGER` block.'
    given: '`rule-case-protocol` — the section `## The acknowledging reply` of its Render.

      **＋** `vault/wiki/case-schema.md` — the Render, written by `uv run guppi render`.

      **＋** `estimate-case-protocol-acknowledging-reply` — the Estimate of the acknowledging reply.

      **＋** `rule-spec-write` — its `Stop` hook writes a Case into the Spec after a reply whose `LEDGER`
      block holds the Case''s decision lines.

      **＋** `rule-ledger-write` — the ledger hook, which appends each line once.'
    when: The person ratifies a Case, or ratifies again a Case shown again after its ratification, and
      the agent writes the reply that acknowledges it.
    then: 'The reply has four parts, in this order: the `LEDGER` block first; the heading `## Case N —
      ratified` and a paragraph `Changes:` — what changes, in one or two sentences; a paragraph `Notes:`
      — facts that did not enter the Case, omitted when there are none; the heading `## Frontier` and
      the lines of `frontier.md` as a checklist — the closed lines folded into one, the open ones one
      per line with a short title, the deferred as `[-] … · defer case N` — and the question which item
      is next, last.

      **＋** For a Case with sub-cases, one reply acknowledges every sub-case ratified: one `LEDGER` block
      with all their lines, one heading `## Case N — ratified` naming the ids, one Frontier.

      **＋** The reply that acknowledges a re-ratification carries the `LEDGER` block with the decision
      lines of each Case ratified again, as at its first ratification.

      **＋** The headings and labels are in the language of the chat.

      **＋** No tool call follows the `LEDGER` block in the same reply.

      **－** The ledger hook of `rule-ledger-write` does not append a repeated decision line a second time.'
