- case: '392.1'
  decision: decision-case-392.1
  origin: raw/2026-09-24/1303/ledger.md#case-392.1
  targets:
  - kind: create
    category: rules
    slug: rule-context-size
    ref: rule-harness
  - kind: create
    category: estimates
    slug: estimate-context-size-shown-after-each-reply
    ref: rule-context-size
  - kind: update
    category: rules
    slug: rule-hook-registry
    ref: rule-hook-registry
  tags:
  - hooks
  - harness
  - session
  case_text:
    given: '`rule-context-size` — the new hook rule, a child of `rule-harness`.

      **＋** `estimate-context-size-shown-after-each-reply` — its Estimate.

      **＋** `guppi/context.py` — the count from the transcript; `guppi/cli.py` — the command `guppi context`.

      **＋** `tests/test_context.py` — its tests, on a transcript written by the test.

      **＋** `guppi/ledger.py` — the predicate of a main-agent record, taken out of `transcript_texts`
      and imported by `guppi/context.py`.

      **＋** `rule-hook-registry` — the `"Stop"` key of its Render.

      **＋** `.claude/settings.json` — the rendered hooks, where `guppi ratified` may exit 2 and fire `Stop`
      again.'
    when: The `Stop` hook `uv run guppi context` runs after a reply of the main agent and reads the transcript
      at `transcript_path`.
    then: 'The hook prints JSON with a `systemMessage` of one line that opens with `context: <N> tokens
      (<+D> since the last reply)`.

      **＋** N is the sum of the input, cache read, cache creation and output tokens of the last main-agent
      API call the transcript holds; D is N less the same sum at the last main-agent call before the person''s
      last prompt.

      **＋** The records of a subagent (`isSidechain`) are not counted.

      **＋** On the re-fire (`stop_hook_active`), with a transcript it cannot read, or with no call that
      carries `usage`, the hook prints nothing.

      **－** The hook never blocks: it exits 0 in every case.'
    context: 'Today the person does not see how full the context window is. In VS Code the indicator in
      the prompt box shows only past 50%, and `/context` is typed by hand. A hook gets only `transcript_path`,
      not the size of the context: the answer of the Claude Code documentation (`hooks-guide.md`), brought
      by the agent `claude-code-guide`. The size can be counted from the transcript: every reply of the
      model carries `usage` there, and the sum of input, cache read, cache creation and output is the
      size of the context; the measurement of this session was taken that way. The stdout of a `UserPromptSubmit`
      hook reaches only the agent: the person did not see the line `hi: 13:03:25 …` after `/hi`. For the
      person there is the `systemMessage` of a `Stop` hook; the documentation says it is shown to the
      user, and is silent on `Stop` in VS Code. So the first reading is live: if the line is not seen,
