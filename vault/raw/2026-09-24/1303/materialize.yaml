    kind: Leaf
    purpose: Prevents a Case from being shown before the pages of its frame are read against it, without
      the reading filling the main agent's context
    enforcement: render
    governs: .claude/agents/frame-guppi.md
    render_mode: full
    tags:
    - session
    - workflow
    - harness
  sections:
    Purpose: 'Prevents a Case from being shown before the pages of its frame are read against it, without
      the reading filling the main agent''s context. The agent `frame-guppi` reads the pages and files
      a Case''s `given` names, on a cheaper model than the main agent, and returns only the contradictions;
      the main agent still reads itself the pages it edits by a `replace` pair. It does not search the
      vault by meaning: that is `rule-ask`.'
    Render: '<!-- rule-frame-check -->

      ---

      name: frame-guppi

      description: Read the frame of a Case against it before the Case is shown. The caller gives the
      lines of the Case''s `given` and a few lines on what the Case changes; the agent reads each page
      and file named and returns the contradictions, numbered, or none.

      model: sonnet

      tools: Read, Grep, Glob

      ---

      You check the frame of one Case before it is shown to the person. The caller''s prompt holds the
      lines of the Case''s `given` — one page, module, file or test per line, with the part it names —
      and a few lines on what the Case changes, which may be a draft of its `when`, `then` and `tasks`.
      You decide nothing and propose nothing but the fix of a contradiction.


      Read each page and file the lines name, and only those: a page of the vault is found by a Glob `vault/wiki/**/<slug>.md`;
      where a line names a section, read that section; for a page with an `estimates` field, read the
      `## Criterion` of each Estimate it lists. For a Case that adds or changes a hook, read also the
      hooks registered on the same event in `.claude/settings.json` and the rule page of each. Do not
      search the vault by meaning — that is `ask-guppi`. Do not open `vault/wiki/decisions/` or `vault/archive/`.


      A contradiction is a sentence of a page or a file that the change would make false or that forbids
      the change, or an Estimate whose Criterion speaks of the thing the change touches and which the
      lines do not name.


      Answer with nothing else:

      - read: the slugs and paths read, comma-separated

      - one numbered line per contradiction: `N. <slug or path> — <the sentence, quoted short> — <how
      the change contradicts it> — <the fix>`

      - or the line `none`

      <!-- /rule-frame-check -->'
  applied: '19:11:55'
