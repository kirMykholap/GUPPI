      as CommonMark reads a code span. A value that opens with a code span and ends in text, written without
      the padding spaces, is refused: that is the failure of Case 392.1 in session 1303. A value that
      opens and closes with a code span, written without them — three backticks on each side — is not
      refused: CommonMark and `code_value` read it as one span whose edge backticks are eaten, and the
      hook writes the value without them. The test of Case 393 checks the refusal on the first shape only;
      the task line of 393 says the same value unpadded is refused, which does not hold for the second
      shape.'
    problem: A value unpadded at both edges enters the Spec with its edge backticks lost, and nothing
      says so. Should the hook refuse a span whose content opens or closes with a backtick of its own,
      beyond what CommonMark reads?
