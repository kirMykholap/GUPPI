  sections:
    Criterion: 'When:

      The person ratifies a Case, or ratifies again a Case shown again after its ratification, and the
      agent writes the reply that acknowledges it.


      Then:

      The reply has four parts, in this order: the `LEDGER` block first; the heading `## Case N — ratified`
      and a paragraph `Changes:` — what changes, in one or two sentences; a paragraph `Notes:` — facts
      that did not enter the Case, omitted when there are none; the heading `## Frontier` and the lines
      of `frontier.md` as a checklist — the closed lines folded into one, the open ones one per line with
      a short title, the deferred as `[-] … · defer case N` — and the question which item is next, last.

      **＋** For a Case with sub-cases, one reply acknowledges every sub-case ratified: one `LEDGER` block
      with all their lines, one heading `## Case N — ratified` naming the ids, one Frontier.

      **＋** The reply that acknowledges a re-ratification carries the `LEDGER` block with the decision
      lines of each Case ratified again, as at its first ratification.

      **＋** The headings and labels are in the language of the chat.

      **＋** No tool call follows the `LEDGER` block in the same reply.

      **－** The ledger hook of `rule-ledger-write` does not append a repeated decision line a second time.'
  applied: '19:11:55'
