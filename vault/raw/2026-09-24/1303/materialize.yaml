  sections:
    Purpose: Prevents a session from running on while the person cannot see how full the context window
      is. In the VS Code extension the context indicator shows only past half of the window, and `/context`
      is typed by hand; no hook payload carries the size, only `transcript_path`. The size is counted
      from the transcript, where every API call of the model carries its `usage`.
    How it works: '`uv run guppi context` on `Stop`. It reads the transcript at `transcript_path`, skips
      the records of a subagent (`isSidechain`), and takes N, the sum of the input, cache read, cache
      creation and output tokens of the last main-agent call the transcript holds — at `Stop` the last
      call may not be there yet, so N may lag one call — and D, N less the same sum at the last call before
      the person''s last prompt. It prints JSON with a `systemMessage`: `context: <N> tokens (<+D> since
      the last reply)`. On the re-fire (`stop_hook_active`), with a transcript it cannot read, or with
      no call carrying `usage`, it prints nothing; it exits 0 always.'
  applied: '19:11:55'
