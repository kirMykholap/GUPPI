  sections:
    Criterion: 'When:

      The `Stop` hook `uv run guppi context` runs after a reply of the main agent and reads the transcript
      at `transcript_path`.


      Then:

      The hook prints JSON with a `systemMessage` of one line that opens with `context: <N> tokens (<+D>
      since the last reply)`.

      **＋** N is the sum of the input, cache read, cache creation and output tokens of the last main-agent
      API call the transcript holds; D is N less the same sum at the last main-agent call before the person''s
      last prompt.

      **＋** The records of a subagent (`isSidechain`) are not counted.

      **＋** On the re-fire (`stop_hook_active`), with a transcript it cannot read, or with no call that
      carries `usage`, the hook prints nothing.

      **－** The hook never blocks: it exits 0 in every case.'
  applied: '19:11:55'
