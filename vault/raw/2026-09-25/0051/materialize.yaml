  case_text:
    given: '`rule-spec-write` — the `Stop` hook that writes a ratified Case into the plan; its `How it
      works`.

      **＋** `estimate-spec-write-checks-the-written-case` — the new promise.

      **＋** `rule-prespec` — the checks of `prespec --check`, which the hook runs.

      **＋** `guppi/ratified.py` — `stop`, which writes the Cases of a reply.

      **＋** `guppi/prespec.py` — the checks, run for one Case.

      **＋** `tests/test_ratified.py` — fixes the check after the write.

      **＋** `raw/<hi date>/<hi HHMM>/frontier.md` — the Frontier, which the check after the write skips.'
    when: The `Stop` hook `uv run guppi ratified` has written Case N into the plan file and its ratified
      copy after a reply whose `LEDGER` block holds the decision lines of Case N.
    then: 'The hook runs the checks of `prespec --check`, imported from `guppi/prespec.py`, on each Case
      it wrote in this run and its sub-cases, with the decision lines of the reply added to those of the
      session''s ledger, each line once.

      **＋** The `replace` and `reword` pairs of every Case of the plan are applied in entry order, and
      only an anchor of a Case written in this run that misses or hits more than once is a finding.

      **＋** On a finding: exit 2, the findings on stderr after `ratified:`, each naming its Case; the
      written Case stays in the plan and in its ratified copy.

      **＋** A finding of a Case not written in this run is not reported.

      **－** On the re-fire (`stop_hook_active`) nothing is checked: exit 0.

      **－** A Case not written in this run — a last showing that is a `DIFF` block, a defer-only Case
      — is not checked.

      **－** The Frontier `raw/<hi date>/<hi HHMM>/frontier.md` is not read.

      **－** The plan is not compared with its ratified copy, and a name, `context` or `problem` that holds
      a Cyrillic letter is no finding.

      **－** A ledger line of the window that does not parse is no finding of this check.'
    context: 'Today the plan is checked once, at `/pre-spec`. The findings pile up until the end of Plan
      Mode, and a Case written with a fault is found late. Case 407 proposed to check each Case right
      after it is written and to close the plan to the agent''s edits by a guard and a fragment. The pre-spec
      of session 2214 found contradictions in it, and Case 412 deferred it together with the question
      of Case 410. This Case takes 412 up and keeps of 407 only the check at once: the `Stop` hook of
      `rule-spec-write` writes a Case, runs the checks of `prespec --check` on it and gives the findings
      back to the agent. The guard, the fragment and the comparison without `given` are withdrawn; most
      findings fell on them. `ratified --edit` on `PostToolUse` still guards the plan.


      The other findings are answered so:

      - **The grammar of the ledger lines.** The check of one Case does not read it. A finding on a line
      that does not parse names no Case, and `/pre-spec` keeps it.

      - **The order of the hooks.** The Claude Code hooks documentation says: "All matching hooks run
      in parallel". So the hook takes the decision lines from the reply itself and does not wait for `ledger.md`.

      - **Exit 2 after the acknowledging reply.** The agent goes on after its `LEDGER` block. Sub-case
      414.2 says that this is a reply of its own.


      There is no separate option `prespec --check --case N`: the hook imports the checks, and with the
      option the Criterion of the Estimates of `prespec --check` that promise to read the Frontier, the
      ratified copy and the grammar of the window would have to change.


      This Case does not decide the question of Case 410, when the prose of a Case is translated. But
      `{supersedes:case 412}` also lifts the defer of `rule-spec-reconcile`, so the question stays a Frontier
      item, and a new defer is due at the close of Plan Mode if this session does not decide it.


      `frame-guppi` found:

      - the option `--case` contradicted the Estimates of `prespec --check`, so the option is dropped;

      - the sentence on the answer after a refusal was wider than the truth when the ledger hook itself
      refuses, so it is narrowed to another `Stop` hook;

      - it took the order of the hooks for sequential, which the documentation refutes.


      `estimate-spec-write-copies-the-ratified-case` is not touched: its list of refusals is not closed,
      and the new refusal does not contradict it. Every `create` here is an Estimate with a `ref`, so
      no vault query is needed.'
    problem: The agent learns of a fault in a written Case only at `/pre-spec`, when the Cases are already
      many. Each Case should be checked right after it is written, by the same checks as at pre-spec,
      and the result should not depend on the order of the hooks on one `Stop`.
  spec: vault/raw/2026-09-25/0051/spec.md
  supersedes:
  - decision-case-412
  applied: 03:50:34
