- case: '417'
  decision: decision-case-417
  origin: raw/2026-09-25/0051/ledger.md#case-417
  targets:
  - kind: update
    category: rules
    slug: rule-prespec
    ref: rule-prespec
  - kind: update
    category: estimates
    slug: estimate-prespec-checks-the-ratified-copy
    ref: estimate-prespec-checks-the-ratified-copy
  tags: []
  case_text:
    context: '`prespec --check` compares the plan with its ratified copy. A section of the copy with no
      Case in the plan is a finding. There is one exception: a Case a `{supersedes:case N}` of the session''s
      window names. It breaks on a parent. A parent has no ledger lines of its own; its sub-cases carry
      them. When every sub-case is superseded, the parent leaves the plan with them, but its heading stays
      in the copy, and no `supersedes` line names it. In session 2214 this happened to Case 407: 412 superseded
      407.1–407.5, and pre-spec still printed `case 407: in the ratified copy, not in the plan`. This
      is `lesson-prespec-parent-of-superseded-sub-cases`. The change touches one sentence of the Render
      of `rule-prespec` and the Criterion of `estimate-prespec-checks-the-ratified-copy`, and no other
      Estimate. `frame-guppi` found no contradiction. The lesson gets no mark: it was written in another
      session. No vault query: both items are an `update` with a `ref`.'
    problem: A parent whose sub-cases are all superseded gives a false finding at every `/pre-spec` of
      its session, and the agent has to explain it by hand.
    given: '`rule-prespec` — its Render `.claude/skills/pre-spec/SKILL.md`: the sentence on the ratified
      copy.

      **＋** `estimate-prespec-checks-the-ratified-copy` — the Estimate whose Criterion is replaced.

      **＋** `guppi/prespec.py` — `check_ratified`, the sections of the copy with no Case in the plan.

      **＋** `tests/test_prespec.py` — fixes the comparison with the ratified copy.'
    when: '`guppi prespec --check <plan>` runs at `/pre-spec`, after the agent translated the names, `context`
      and `problem` of the plan, and reads the plan and its ratified copy `<plan>.ratified.md`.'
    then: 'A Case of the plan whose ids, `given`, `when`, `then`, `then` block or `tasks` differ from
      its section in the ratified copy: one finding naming the Case and the parts.

      **＋** A Case of the plan with no section in the copy, and a section of the copy with no Case in
      the plan: one finding each.

      **＋** A name, `context` or `problem` that still holds a Cyrillic letter: one finding.

      **－** The section of a Case a `{supersedes:case N}` of the session''s window names is no finding:
      that Case left the plan (case 299.1).

      **－** The section of a parent with sub-cases in the copy, every one of them named by such a line,
      is no finding: the parent left the plan with them.

      **－** A Case under `## Deferred` is not compared.'
  spec: vault/raw/2026-09-25/0051/spec.md
