  sections:
    Criterion: 'When:

      The `Stop` hook `uv run guppi ratified` has written Case N into the plan file and its ratified copy
      after a reply whose `LEDGER` block holds the decision lines of Case N.


      Then:

      The hook runs the checks of `prespec --check`, imported from `guppi/prespec.py`, on each Case it
      wrote in this run and its sub-cases, with the decision lines of the reply added to those of the
      session''s ledger, each line once.

      **＋** The `replace` and `reword` pairs of every Case of the plan are applied in entry order, and
      only an anchor of a Case written in this run that misses or hits more than once is a finding.

      **＋** On a finding: exit 2, the findings on stderr after `ratified:`, each naming its Case; the
      written Case stays in the plan and in its ratified copy.

      **＋** A finding of a Case not written in this run is not reported.

      **－** On the re-fire (`stop_hook_active`) nothing is checked: exit 0.

      **－** A Case not written in this run — a last showing that is a `DIFF` block, a defer-only Case
      — is not checked.

      **－** The Frontier `raw/<hi date>/<hi HHMM>/frontier.md` is not read.

      **－** The plan is not compared with its ratified copy, and a name, `context` or `problem` that holds
      a Cyrillic letter is no finding.

      **－** A ledger line of the window that does not parse is no finding of this check.'
  applied: 03:50:34
