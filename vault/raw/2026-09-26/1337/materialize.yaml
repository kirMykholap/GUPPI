      re-fire (`stop_hook_active`) exit 0.

      **＋** A key of a `defer` item that `item_keys` of `guppi/materialize.py` does not give a `defer`
      of its category: exit 2 with `` `<key>`: not a key of defer <slug> `` on stderr, and nothing of
      the Case is written.

      **－** A `defer` of a category with no schema file, or of one whose schema rule a decision line of
      the session or of the reply creates or updates, is not judged by its keys (case 308.2).

      **－** The ratified copy `<plan>.ratified.md` gets no defer, and the check after the write does not
      run on it.'
