      The `Stop` hook `uv run guppi ratified` runs after a reply whose `LEDGER` block holds lines of a
      Case N that are all `defer` — beside the lines of other Cases or alone — and the same reply shows
      `## Case N —` in the short form: `context`, `problem` and a fence tagged `then` with its `defer`
