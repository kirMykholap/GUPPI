  replace:
  - old: For an answer of `case-guppi` (`agent_type`), it reads the Cases of `last_assistant_message`
      by the functions of `guppi/ratified.py` that read the chat form,
    new: For an answer of `case-guppi` (`agent_type`), it takes as the answer the newest output of the
      subagent in `agent_transcript_path` that holds a Case heading — the `message` of a `SubagentHandback`
      call or the text of an assistant message, whichever stands later — or `last_assistant_message` when
      the transcript is not readable or holds none, and reads the Cases of the answer by the functions
      of `guppi/ratified.py` that read the chat form,
  - old: A finding exits 2 with the findings on stderr, and the agent answers again; on the re-fire (`stop_hook_active`)
      the hook stores and exits 0.
    new: 'A finding exits 2 with the findings on stderr, and the agent answers again, whatever `stop_hook_active`
      says: Claude Code sets it on the second fire after a handback with no exit 2 of the hook. A finding
      for a Case whose text the store already holds with findings is stored and exits 0, so an unchanged
      answer is not sent back twice.'
  - old: An answer with no Case heading is a question and is neither checked nor stored;
    new: An answer with no Case heading, where no earlier output holds one either, is neither checked
      nor stored;
  change: the check reads the newest output of the subagent that holds a Case, a handback or a text, else
    last_assistant_message; the loop guard is the store, not stop_hook_active
  applied: '17:02:12'
- line: 4
  text: decision[case 434][update][estimate-case-check-sends-back-a-faulty-case]{ref:rule-case-check}
  case: '434'
  kind: update
  slug: estimate-case-check-sends-back-a-faulty-case
  origin: raw/2026-09-26/1337/ledger.md#case-434
  decision: decision-case-434
  ref: rule-case-check
  category: estimates
  set:
    status: pending
  change: the Criterion replaced whole — the answer is the newest output of the subagent that holds a
    Case, else last_assistant_message; an unchanged answer is not sent back twice
  sections:
    Criterion: 'When:

      `SubagentStop` fires when `case-guppi` answers; its payload carries `last_assistant_message`, `agent_transcript_path`
      and `stop_hook_active`, and it may fire twice after one message to the subagent, the second time
      after a `SubagentHandback` call, with `stop_hook_active` true though no hook exited 2.


      Then:

      `uv run guppi casecheck --subagent` takes as the answer the newest output of the subagent in `agent_transcript_path`
      that holds a Case heading: the `message` input of a `SubagentHandback` tool call or the text of
      an assistant message, whichever stands later.

      **＋** When `agent_transcript_path` is not readable or holds no such output, the answer is `last_assistant_message`.

      **＋** It reads each Case of the answer in the chat form, by the functions of `guppi/ratified.py`,
      builds each Case''s section of the Spec in memory, as the Spec hook writes it, and runs `judge`
      of `guppi/prespec.py` over them, the decision lines of the `ratification` fence standing for the
      ledger.

      **＋** It checks the chat form besides: the sections in the order of the schema, none missing that
      the schema requires, and a `ratification` that holds one untagged fence of ledger lines and nothing
      else.

      **＋** Each Case of the answer is stored, its text as the answer holds it, with its findings in `<plan>.checked.json`
      beside the plan file of the session.

      **＋** A finding exits 2 with the findings on stderr, each naming its Case, and `case-guppi` answers
      again, whatever `stop_hook_active` says.

      **－** A finding for a Case whose text the store already holds with findings is stored again and
      exits 0, so an unchanged answer is not sent back twice.

      **－** An answer with no Case heading, an answer of another agent, or a session with no plan file
      is not sent back and exits 0; the first two are not checked or stored.'
  applied: '17:02:12'
