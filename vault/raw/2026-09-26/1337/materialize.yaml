  slug: estimate-case-protocol-shows-the-built-case
  origin: raw/2026-09-26/1337/ledger.md#case-435
  decision: decision-case-435
  ref: estimate-case-protocol-shows-the-built-case
  category: estimates
  set:
    status: pending
  change: the Criterion replaced whole — the Case the person answers is the answer unchanged; a showing
    the Stop comparison refuses is followed by the answer shown unchanged (case 435)
  sections:
    Criterion: 'When:

      The main agent takes up a Frontier item that needs a Case, the person answers a shown Case with
      a question or a change, or a ratified Case changes and is shown again, in Plan Mode or in Work Mode.


      Then:

      The main agent dispatches `case-guppi` with the Case id, the Frontier item and its source, and the
      person''s words on it, in the prompt of the call; nothing of the Case stands in the chat before
      the answer.

      **＋** A question or a change of the person on a shown Case goes to the same `case-guppi` by `SendMessage`.

      **＋** The main agent shows the Case of the answer, and its own text stands after one horizontal
      rule.

      **＋** The Case the person answers is the Case of the answer, whole and unchanged.

      **＋** A showing that the `Stop` comparison of `uv run guppi casecheck` refuses as different from
      the answer is followed, before the person answers, by a reply that shows the answer whole and unchanged.

      **＋** An answer that holds no Case heading is a question the main agent puts to the person, and
      no Case is shown.

      **＋** The plan file stands with its title line before the first dispatch of the session.

      **＋** The main agent dispatches `ask-guppi` once, at pre-spec, and neither `ask-guppi` nor `frame-guppi`
      before a showing.

      **－** A deferred decision in the short form is written by the main agent, with no dispatch.'
  applied: '17:02:12'
