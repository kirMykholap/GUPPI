  sections:
    Pattern: The main agent writes the Case that case-guppi built out again by hand instead of copying
      the answer. In session 1654 the last ratification block of a sub-case repeated the one before; in
      session 1337 a ref of a ratification line was changed because the agent took it for a slip. A showing
      retyped by hand can differ from the answer in any line, and only the comparison on Stop, which refuses
      a reply the person already sees and lets the re-fire through, stands between the retyped Case and
      the person.
