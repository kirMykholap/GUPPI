      the prose into Russian only for the chat. The hook of `rule-spec-write` writes the stored English
      answer into the Spec. So nobody translates anything into English before approval.

      Case 441 also made the main agent write a short-form defer in English in the chat, and the hook
      writes it as shown. This makes a second part of the same sentence false. The Render and the Criterion
      both say that the name, `context` and `problem` of every Case are Russian in the chat, but a short-form
      Case is English there.

