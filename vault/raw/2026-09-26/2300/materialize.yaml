- case: '444.1'
  decision: decision-case-444.1
  origin: raw/2026-09-26/2300/ledger.md#case-444.1
  targets:
  - kind: create
    category: estimates
    slug: estimate-materialize-judges-a-fence
    ref: rule-materialize
  tags:
  - harness
  - workflow
  - tests
  case_text:
    given: '`guppi/materialize.py` — holds the one judgment of a fence and reads the blocks and sections
      of a Case by it

      **＋** `guppi/ratified.py` — reads the sections and the fenced values of the chat form

      **＋** `guppi/prespec.py` — reads the lines of a Case outside a fence

      **＋** `guppi/casecheck.py` — checks the fence of `ratification`

      **＋** `guppi/ledger.py` — reads the lines of a `LEDGER` fence

      **＋** `tests/test_materialize.py` — runs every reader over the same texts

      **＋** `rule-materialize` — the rule that owns `guppi/materialize.py`, the `ref` of the new Estimate

      **＋** `estimate-materialize-judges-a-fence` — the promise of the one judgment

      **＋** `rule-one-judgment-one-implementation` — one judgment lives in one module'
    when: 'A hook or a script reads a text that holds a fence: `then_blocks`, `tagged_blocks`, `case_text`
      and `criterion_text` of `guppi/materialize.py`, `quoted_sections` and `fenced_value` of `guppi/ratified.py`,
      `plan_prose` of `guppi/prespec.py`, the check of `ratification` in `guppi/casecheck.py`, or `ledger_lines`
      of `guppi/ledger.py`.'
    then: 'A line opens a fence when, after at most three spaces of indent inside the block it stands
      in (a quote, a sub-point of `tasks`), it starts with a run of three or more backticks or three or
      more tildes.

      **＋** The fence closes only on a line of the same character whose run is at least as long as the
      opening run, with nothing after the run but spaces.

      **＋** A line with a shorter run, a run of the other character, or a word after its run stays inside
      the fence as content.

      **＋** A fenced value under a sub-point of `tasks` that holds a shorter fence of the same character
      is read whole, together with the inner fence.

      **＋** Every one of these readers takes the judgment from the functions of `guppi/materialize.py`,
      and they all give the same answer for the same text.

      **－** No reader keeps a fence pattern of its own: the `FENCE` of `guppi/ledger.py`, the `OPEN_FENCE`
      of `guppi/ratified.py`, and the tests on three backticks in `guppi/ratified.py` and `guppi/casecheck.py`
      are removed.'
    context: 'Several readers in the pipeline decide where a fenced block opens and where it closes, and
      each one uses its own pattern. `guppi/materialize.py` knows only backtick fences and closes a block
      on the next line of backticks. `guppi/ratified.py` reads a fenced value under a sub-point and ends
      it at the first line of three backticks. `guppi/casecheck.py` requires that `ratification` opens
      and closes with exactly three backticks. `guppi/prespec.py` imports the pattern of `materialize`.
      `guppi/ledger.py` has a pattern of its own, and it is the only reader that knows tildes. None of
      them knows the length of a fence. So a sub-point value that holds its own fence, such as a template
      of questions with a code block in it, is cut at the inner fence. For this reason, a Case ratified
      earlier in this session moves the template in `.claude/skills/grill-me/SKILL.md` into an indented
      block. Today the file still holds a fenced block, and this Case does not change what that Case does.
      The Spec hook writes the `then` and `tasks` blocks with a fixed fence of three backticks, so a value
      with a fence inside would break the block it is written into. One judgment in several copies is
      what `rule-one-judgment-one-implementation` forbids.

      No rule page describes a fence. `rule-spec-write` describes the blocks it writes but not their fence.
      The Render of `rule-case-protocol` allows a fenced block under a sub-point and says nothing about
      a fence inside it. `rule-ledger-write` stays deferred on another question. Only the code of `guppi/ledger.py`
      changes, and its `How it works` stays true, because a `LEDGER` block is still a fence opened with
      that tag. Case 445 of this session takes up `rule-spec-reconcile`: a guard replaces the comparison
      of the plan with a ratified copy, and the Spec hook no longer writes that copy. Neither the guard
      nor this Case changes the other. The one `create` has a `ref`, so the vault query was not run. The
      slug `estimate-materialize-judges-a-fence` is free in `wiki/` and in `archive/`.

      `guppi/ledger.py` cannot import `guppi/materialize.py` at the top of the module, because `materialize`
      imports `ledger`. It imports inside the function, as it already does for `parse_line`. The writer
      depends on the readers: today a fence of four backticks is read as a fence tagged with a backtick.
      So 444.2 depends on 444.1. Case 445 changes `rule-spec-write` with its own `replace` pairs. Its
      first pair and the pair of 444.2 stand in one sentence of `How it works`, the one that ends in "appended
      otherwise". Their anchors do not overlap, so both apply. The other pairs of Case 445 stand in other
      sentences. The pair of 444.3 and the pairs of Case 445 on `rule-case-protocol` stand in different
      sentences.

      The Criterion of `estimate-spec-write-copies-the-ratified-case` describes the blocks the hook writes,
      so 444.2 replaces it whole, and Case 445 leaves that Estimate to 444.2. The new Criterion does not
      mention the ratified copy, because Case 445 removes it. It covers the blocks written into the Spec
      of the session and the block of a short-form defer, because the `when` of 444.2 names both. The
      `purpose` and the `method` also mention the copy, so 444.2 sets both. The slug stays: it names the
      Case that was ratified, not the copy. The Criterion''s line on a fenced block under a sub-point
      stays true under 444.1 and is kept; the new Estimate holds the reading. `estimate-spec-write-writes-a-defer`
      writes the `then` block as the reply shows it. The content is kept and only the fence is chosen,
      so it stands. Several Criteria mention a fence, a `LEDGER` block or the blocks of the Spec in words
      that stay true when a fence is judged by CommonMark, so they stand: `estimate-prespec-catches-bare-wikilinks`,
      `estimate-prespec-matches-lines-and-items`, `estimate-case-check-sends-back-a-faulty-case`, `estimate-case-check-shows-only-the-checked-case`,
      `estimate-case-protocol-case-form`, `estimate-case-protocol-defers-in-one-reply`, `estimate-ledger-write-lifts`,
      `estimate-ledger-write-refuses-a-reading-of-a-change-of-the-session` and `estimate-spec-write-reaches-the-approved-spec`.
      This Case follows `estimate-one-judgment-one-implementation-followed` and does not change it.'
    problem: 'The pipeline has no single standard for a fence. The readers disagree on where a block ends,
      a value with a fence inside is cut, and the writer cannot fence such a value safely. The questions
      are: which standard holds, where its one judgment lives, how the Spec hook fences a block, and what
      the schema tells the writer of a Case.'
