  text: decision[case 445.1][update][rule-spec-reconcile]{ref:rule-spec-reconcile}{supersedes:case 423}
  case: '445.1'
  kind: update
  slug: rule-spec-reconcile
  origin: raw/2026-09-26/2300/ledger.md#case-445.1
  decision: decision-case-445.1
  ref: rule-spec-reconcile
  supersedes:
  - '423'
  category: rules
  set:
    implementation_ref:
    - guppi/ratified.py
    - guppi/ledger.py
    - tests/test_ratified.py
    - .claude/settings.json
  sections:
    How it works: '`uv run guppi ratified --guard` on `PreToolUse` of `Edit`, `Write` and `MultiEdit`.
      A plan file is a `.md` file under `.claude/plans/`, judged by one function of `guppi/ledger.py`
      that `plan_path` also uses; the store `<plan>.checked.json` of `rule-case-check` lies beside it.
      The hook refuses every `Edit` and `MultiEdit` of a plan file or a store, every `Write` of a store,
      and every `Write` of a plan file that exists: exit 2 with the reason on stderr, which Claude Code
      shows the agent, and the call does not run. The one exception is a `Write` of a plan file that does
      not exist whose content, trimmed, is one line that opens with `# ` — the title line the agent writes
      before the first dispatch of `case-guppi`; the hooks find the plan by that write in the event log,
      so no hook can create it. A refusal writes one line to the day''s event log; a refused call has
      no `PostToolUse`, so it leaves no `tool` line and does not move `plan_path`. The hooks of `rule-spec-write`
      and `rule-case-check` write the plan and the store with no tool call, and this hook does not judge
      them. A payload the hook cannot read: exit 0 with one line on stderr; it never raises. Until case
      445.1 the rule was a comparison: `guppi ratified --edit` on `PostToolUse` compared an edited plan
      with a ratified copy `<plan>.ratified.md` and marked a changed Case in `<plan>.waiting.json` for
      its showing; the copy, the marks and that hook are gone.'
  replace:
