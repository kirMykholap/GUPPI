      of `vault/wiki/case-schema.md` already states the English answer and the English short form, so
      it stays true and does not change. The `Purpose` of `rule-language` and its `purpose` field also
      stay true. `estimate-claude-md-rendered` only promises that the file equals the Render and is loaded,
      so this Case does not touch it (case 378.5).

      `estimate-language-followed` stands `failed` from session 1745. This Case replaces its Criterion
      whole and sets it `pending`. After that, the ledger hook refuses a reading of it in this session
      (case 428.1). So Frontier line W32 cannot close by a reading this session.'
    problem: 'The Render of `rule-language`, which is `CLAUDE.md`, and the Criterion of `estimate-language-followed`
      describe a step that is gone: an English translation of the prose of a Case before approval. They
      also say that a short-form Case is Russian in the chat, but it is English there. A session reads
      a false rule on its first turn, and a reading of the Estimate checks a step nobody takes.'
    given: '`rule-language` — its Render is the `## Language` section of `CLAUDE.md`

      **＋** `CLAUDE.md` — the `## Language` section, rendered from `rule-language`

      **＋** `estimate-language-followed` — the Estimate of `rule-language`

