  fields:
    type: insight
    pattern: case-guppi writes the promise lines of a Case against the lines beside them — the Criterion
      it replaces, the then of a sibling sub-case — and no check of its answer compares them, so a dropped
      or doubled promise is found only by ask-guppi at pre-spec.
    children:
    - lesson-case-build-a-criterion-replaced-whole-drops-a-line
    - lesson-case-build-one-promise-signed-in-two-sub-cases
  tags:
  - harness
  - workflow
  - session
  sections:
    Pattern: case-guppi writes the promise lines of a Case against the lines beside them, and no check
      of its answer compares them. In session 1745 the first build of Case 441.2 replaced the Criterion
      of estimate-case-protocol-shows-the-built-case whole and dropped one of its lines (lesson-case-build-a-criterion-replaced-whole-drops-a-line).
      In session 2300 Case 445 signed the refusal of /hi outside plan mode in 445.5 and in 445.6, two
      Estimates in two wordings, because the Case was split by the page it changes (lesson-case-build-one-promise-signed-in-two-sub-cases).
      Both were found by ask-guppi at pre-spec.
    Proposal: 'A suggestion, not a decision: let a check of the answer of case-guppi compare the old lines
      of a Criterion replaced whole with the new ones, and the then lines of sibling sub-cases with each
      other, before the Case is shown.'
  librarian: synthesis
