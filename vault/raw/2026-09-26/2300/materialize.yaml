  sections:
    Purpose: 'Prevents an interview from acting on a plan before each of its decisions is put to the person
      and settled, and the skill that runs it from being a file no rule page governs. `/grill-me` asks
      in rounds: the frontier of a design tree, the questions whose prerequisites are settled, each with
      a recommended answer. It served the person''s own interviews without a page until case 443.1. The
      same text serves `case-guppi`, which loads it through the `skills` field of its frontmatter ([[rule-case-build]]),
      so two of its sentences name no one agent: a fact is found by the agent itself, or by a sub-agent
      when the agent can dispatch one; the shared understanding is confirmed by the user''s word unless
      the instructions that started the grill name another confirmation. The question template is an indented
      code block, the form it took when case 443.1 was written, before case 444 let a fenced value carry
      a shorter fence.'
    Render: "<!-- rule-skill-grill-me -->\n---\nname: grill-me\ndescription: Grill the user relentlessly\
      \ about a plan, decision, or idea. Use when the user wants to stress-test their thinking, or uses\
      \ any 'grill' trigger phrases.\n---\n\nInterview the user relentlessly until you reach a shared\
      \ understanding. Map this as a **design tree**: every decision branches into the decisions that\
      \ hang off it.\n\nWork the tree in **rounds**. The **frontier** is every decision whose prerequisites\
      \ are already settled: the questions you can ask _now_ without guessing at answers you haven't heard\
      \ yet. Ask the whole frontier in one round: number each question and give your recommended answer.\
      \ Then wait for the user's answers before the next round.\n\nEach question should be formatted like\
      \ so:\n\n    ❓ **Q1** - **<question title>**: <question body, might be multiple paragraphs, including\
      \ multiple choices>\n\n    ➡️ <your recommended answer>\n\nEach round the user answers reshapes\
      \ the tree: settled decisions push the frontier outward and unblock questions that depended on them.\
      \ Recompute the frontier and ask the next round. A question whose answer depends on another question\
      \ still open in this round belongs to a _later_ round, not this one.\n\nFinding _facts_ is your\
      \ job, never the user's. When a frontier question needs a fact from the environment (filesystem,\
      \ tools, etc.), find it yourself, or dispatch a sub-agent when you can dispatch one; don't ask the\
      \ user for anything you could look up yourself. Don't block on it: a running exploration is an unsettled\
      \ prerequisite, so only the questions downstream of it wait for the sub-agent to report; ask the\
      \ rest of the frontier now. The _decisions_ are the user's: put each to them and wait.\n\nThe session\
      \ is done when the frontier is empty: every branch of the design tree visited, nothing left silently\
      \ assumed. Do not act on it until the shared understanding is confirmed: by the user's word, unless\
      \ the instructions that started the grill name another confirmation.\n<!-- /rule-skill-grill-me\
      \ -->"
  applied: 04:21:13
