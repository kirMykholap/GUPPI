      **＋** `vault/wiki/case-schema.md` — its `## Language` section and the short form constrain the wording'
    when: A session starts with `CLAUDE.md`, and the agent writes into the repository or into the chat.
    then: 'Everything written into the repository — code, identifiers, comments, pages, commit messages,
      documents, the approved Spec in `raw/<date>/<hi HHMM>/spec.md` — is English.

      **＋** The chat with the owner is Russian: the name of a Case, its `context`, `problem` and `recommend`,
      and the agent''s own text.

      **＋** The name, `context` and `problem` of a Case are English in `raw/<date>/<hi HHMM>/spec.md`.

      **＋** A Case''s `given`, `when`, `then` and `tasks` — lines and sub-points — are English in the
      chat and enter `raw/<date>/<hi HHMM>/spec.md` unchanged.

      **＋** Slugs, field names, ledger lines, paths and quotations from pages stay as they are in either
      language; English technical terms are not transliterated into Cyrillic.

      **－** A short-form Case of `vault/wiki/case-schema.md` is not Russian in the chat: it stands there
      in English, as `raw/<date>/<hi HHMM>/spec.md` holds it.

      **－** The rule speaks of the language, not of the Case form — the form is `vault/wiki/case-schema.md`.'
