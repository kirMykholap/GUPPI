      pages of Case 441 record that the person kept the sentence then because the result still held. They
      also name the smallest wording: "are Russian in the chat and English in the Spec".

      The vault''s answer: this Case creates no page, so there was no slug to ask about. Among the live
      pages and the files of the repository, the sentence stands in three places only: `CLAUDE.md`, the
      Render of `rule-language` and the Criterion of `estimate-language-followed`. Decision pages are
      not counted in that search. No code tests the sentence. The sentence also stands in records under
      `raw/` and `archive/`: the Spec and `materialize.yaml` of session 1745, the Spec and `materialize.yaml`
      of the archived session 1859 of 2026-09-23, and the Frontier of this session. Those files keep it
      as records, and this Case does not change them.

