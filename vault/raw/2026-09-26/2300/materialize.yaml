      will load the skill. `rule-orchestration`, deferred by its decision, would move the triage of a
      Frontier item and the dispatch out of `case-schema.md` into a rule of its own. This Case does not
      take that defer up: it changes the triage text where it stands today. Missing: a page that governs
      `.claude/skills/grill-me/SKILL.md`. Rules: `rule-rules-schema` requires `governs`, `render_mode`,
      a `## Render` and an Estimate on a render rule. `rule-render-harness` and `rule-governed-files-hook`
      make the page the one source of the file. Tags: `harness`, `workflow`. The slug `rule-skill-grill-me`
      is free, and no archived page carries it.


