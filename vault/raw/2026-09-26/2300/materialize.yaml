  change: the Criterion replaced whole — a round shown translated, the answers passed verbatim, no step
    of confirmation (case 443.3)
  sections:
    Criterion: 'When:

      The main agent takes up a Frontier item, the person answers a round of questions or answers a shown
      Case with a question or a change, or a ratified Case changes and is shown again, in Plan Mode or
      in Work Mode.


      Then:

      The main agent dispatches `case-guppi` with the Case id, the Frontier item and its source, and the
      person''s words on it, in the prompt of the call, after the plan file stands with its title line;
      nothing of the Case stands in the chat before the answer.

      **＋** The person''s answers to a round go to the same `case-guppi` by `SendMessage`, verbatim and
      untranslated, and so does a question or a change of the person on a shown Case.

      **＋** An answer with no Case heading is a round of questions: the main agent shows it translated
      into Russian, slugs, paths and quotations unchanged, and no Case is shown.

      **＋** No step of confirmation follows the last round: the next showing is the Case.

      **＋** The main agent shows the Case of the answer whole at every showing — its name, `context`,
      `problem` and `recommend` translated into Russian, its `given`, `when`, `then`, `tasks` and `ratification`
      as the answer holds them — and its own text after one horizontal rule; a showing that the `Stop`
      comparison of `rule-case-check` refuses is followed, before the person answers, by a reply that
      shows the answer whole, translated the same way.

      **＋** A ratified Case that changes — in its prose or in its body — changes through its `case-guppi`,
      and its new answer is shown and ratified again; the main agent edits no Case in the plan file.

      **＋** An item that needs no decision the main agent closes alone, with no dispatch; it dispatches
      `ask-guppi` once, at pre-spec, and not before a showing.

      **－** A deferred decision in the short form is written by the main agent in English in the chat,
      with no dispatch.'
  applied: 04:21:13
