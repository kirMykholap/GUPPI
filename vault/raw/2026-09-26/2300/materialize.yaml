  sections:
    Criterion: 'When:

      The `Stop` hook `uv run guppi ratified` runs after a reply whose `LEDGER` block holds `- decision[case
      N]` lines of a kind other than `defer`; it reads the session''s transcript for the last earlier
      reply that shows `## Case N —` whole, and `<plan>.checked.json` beside the plan file for the answer
      of `case-guppi` stored under Case N.


      Then:

      The hook writes the stored answer of Case N into the plan file `plan_path` finds, the section of
      Case N replaced when it stands, appended otherwise: the heading, `context`, `problem`, `given`,
      `when` and `then` as the answer holds them; a block tagged `then` built from the sub-points of `tasks`;
      a block tagged `tasks` of the task lines without their sub-points; `recommend` and `ratification`
      are not written.

      **＋** Each of the two blocks opens and closes with a fence of backticks one longer than the longest
      run of backticks that opens a line inside it, three at the least; `tagged_blocks` of `guppi/materialize.py`
      reads it back whole.

      **＋** The same fence rule holds for the blocks the hook writes into `raw/<date>/<hi HHMM>/spec.md`
      once it stands, and for the `then` block of a short-form defer it writes under `## Deferred`.

      **＋** A last showing of Case N that differs from the stored answer — by the one comparison `uv run
      guppi casecheck` makes on `Stop`, imported from `guppi/casecheck.py` — a store with no Case N, or
      a Case N stored with findings: exit 2 with the reason on stderr, and nothing of Case N is written.

      **＋** A task line opening with `create`, `update`, `delete` or `defer` and the slug in its first
      code span is an item of the `then` block; its sub-points are its keys — `old` and `new` in pairs
      under `replace`, `reword old` and `reword new` under `reword`, `set`, `change`, `rename`, `sections.<Name>`,
      the fields of a `create` — each value one code span, padded by one space on each side when the value
      holds a backtick, or a fenced block under the sub-point.

      **＋** A sub-point that reads into no key `item_keys` of `guppi/materialize.py` gives the kind and
      the category of its item — the one judgment `guppi/materialize.py` lifts by and `guppi/generate.py`
      applies by — is refused: exit 2 with `` `<key>`: not a key of <kind> <slug> `` on stderr, and nothing
      of the Case is written.

      **＋** A value that holds a backtick in an outer span not padded on both sides is refused: exit 2
      with `` `<key>`: a value holding a backtick takes its outer span padded by one space `` on stderr,
      and nothing of the Case is written.

      **＋** No plan file in the event log, no showing of Case N whole, or a sub-point it cannot read:
      exit 2 with the reason on stderr; on the re-fire (`stop_hook_active`) exit 0.

      **－** A `create` or a `defer` of a category with no schema file, or of one whose schema rule a decision
      line of the session or of the reply creates or updates, is not judged by its keys (case 308.2).'
  change: the Criterion replaced whole — the fence of each written block is one longer than the longest
    fence inside it; the ratified copy no longer named (cases 444.2, 445.2)
  applied: 04:21:13
