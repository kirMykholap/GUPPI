- case: '445.1'
  decision: decision-case-445.1
  origin: raw/2026-09-26/2300/ledger.md#case-445.1
  targets:
  - kind: update
    category: rules
    slug: rule-spec-reconcile
    ref: rule-spec-reconcile
  - kind: update
    category: estimates
    slug: estimate-spec-reconcile-shows-a-changed-case
    ref: estimate-spec-reconcile-shows-a-changed-case
  - kind: update
    category: rules
    slug: rule-hook-registry
    ref: rule-hook-registry
  tags: []
  case_text:
    given: '`rule-spec-reconcile` — the rule whose guard this is

      **＋** `estimate-spec-reconcile-shows-a-changed-case` — the promise of the rule

      **＋** `guppi/ratified.py` — the hook `uv run guppi ratified --guard`, and the `--edit` hook it replaces

      **＋** `guppi/ledger.py` — `plan_path`, and the one function that judges a plan path

      **＋** `tests/test_ratified.py` — the tests of the guard

      **＋** `.claude/plans/` — the folder of the plan files and of their stores `<plan>.checked.json`

      **＋** `rule-hook-registry` — the registrations of `.claude/settings.json`

      **＋** `.claude/settings.json` — the file rendered from it'
    when: The agent calls `Edit`, `Write` or `MultiEdit` on a file under `.claude/plans/`, and `uv run
      guppi ratified --guard` on `PreToolUse` reads the path and the content of the call.
    then: 'The hook refuses every `Edit` and `MultiEdit` of a plan file, and every `Write` of a plan file
      that exists: exit 2 with the reason on stderr, which Claude Code shows the agent, and the call does
      not run.

      **＋** A `Write` of a plan file that does not exist is let through when its content, trimmed, is
      one line that opens with `# `; a `Write` with any other content is refused the same way.

      **＋** Every `Edit`, `Write` or `MultiEdit` of a store `<plan>.checked.json` is refused the same
      way.

      **＋** A refusal writes one line of the refusal to the day''s event log and no `tool` line, so `plan_path`
      of `guppi/ledger.py` still names the plan file.

      **＋** A plan file is a `.md` file under `.claude/plans/`, judged by one function of `guppi/ledger.py`
      that `plan_path` uses too.

      **－** An edit of a file outside `.claude/plans/` is not judged by this hook.

      **－** A payload the hook cannot read: exit 0 with one line on stderr.

      **－** No `PostToolUse` hook compares an edit of the plan: `uv run guppi ratified --edit` and the
      marks `<plan>.waiting.json` are gone.'
    context: 'Today the hooks write each Case into the plan file. The `Stop` hook of `rule-spec-write`
      writes the stored English answer of `case-guppi`, and it writes a short-form defer from the reply.
      The agent can still edit the plan by hand. `uv run guppi ratified --edit` on `PostToolUse` compares
      an edited plan with the ratified copy `<plan>.ratified.md`, which the same hook function writes
      beside it. The comparison covers only what the scripts apply, so a change of a name, `context` or
      `problem` passes without a word. In session 1745 the agent showed the short-form defer of Case 442.
      It then edited the plan to translate its heading, `context` and `problem`, and `estimate-case-protocol-defers-in-one-reply`
      failed on that edit. Case 423 deferred this question to `rule-spec-reconcile`. Case 441 answered
      its second half. `case-guppi` answers in English, the main agent translates only for the chat, and
      a short form is written in English as it is shown. After that, no step needs the agent to edit the
      plan. Once nothing but the hook writes the Cases, the copy only compares the plan with itself.


      The person decided the following. Every edit of a plan file that exists is refused for the whole
      session, not only while a line under `## Cases` is open. The one exception is a `Write` that creates
      a plan file with one title line. The agent''s edits of the stores `<plan>.checked.json` are refused
      too. The ratified copy goes, and with it the `--edit` hook, the marks `<plan>.waiting.json` and
      the comparison of pre-spec with the copy. The Cyrillic finding of pre-spec stays, and its Estimate
      moves to `rule-language`. `/hi` opens a session only in plan mode, and a payload with no `permission_mode`
      is refused. A session repaired without `/hi` is a known path, since the fix of session 1745 was
      made that way. The refusal is the promise of `rule-event-log`, whose hook writes the `hi` line.
      `rule-skill-hi` only describes it. In session 1337 a session that began outside plan mode wrote
      a second plan file under another name. With `/hi` refused outside plan mode, that path needs no
