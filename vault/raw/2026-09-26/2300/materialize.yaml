      into the subagent''s context at startup. It works with `tools: Read, Grep, Glob` and needs no Skill
      tool. It does not work for a skill with `disable-model-invocation: true`, and `grill-me` has none
      (https://code.claude.com/docs/en/sub-agents.md, as the person gave it). The sentence of the sprint''s
      Closed section on `/grill-me` would become false, so 443.1 replaces it on `entity-sprint-migration`,
      and `vault/wiki/sprint.md` is rendered again. The `SubagentStop` check of `rule-case-check` does
      not check or store an answer with no Case heading. If a round follows a Case the agent already built,
      the check takes that earlier Case again and stores the same text, so a round breaks nothing there.
