      The frontier is one numbered list of what needs an end in this Retro: each unticked box that is
      debt, and what the agent noticed during Work Mode.

      **＋** A `read` line without its line in the Tail, whose slug this session neither creates nor updates,
      is debt, and so is a box of code, a test, a command or a migration left unticked.

      **＋** Under the list stand two lines, not numbered: the count of the boxes that wait for the librarian,
      and the slugs of the `read` lines whose slug this session creates or updates, by a decision line
      of that slug or by an `update` that renames a page to it.

      **－** The frontier names no box that waits for the librarian one by one, and holds no list of the
      ratifications.

