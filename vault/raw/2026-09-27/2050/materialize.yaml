  sections:
    Criterion: 'When:

      `generate` applies a `materialize.yaml` that holds an entry lifted from a ledger line whose slug
      has no category prefix.

      **＋** `make test` and `make lint` run on the tree.


      Then:

      No file under `guppi/` holds `RULE_CLASS`, `rule_class`, `applied by hand` or `prose_names`.

      **＋** An `update` item that carries `file` is a `pre-spec` finding: `check_governed` refuses any
      such item, not only one on a governed path.

      **＋** The entry of a ledger line whose slug has no category prefix lands `category: unknown`.

      **＋** `generate` fails a `create` of that entry, and a `defer` of it with no page, with `category
      ''unknown'' is not a vault folder`.

      **＋** `generate` applies an `update` of that entry to the page of that slug in any folder, and ticks
      its line.

      **＋** `generate` applies a `delete` of that entry with the stdout line `outside the vault, nothing
      to archive`, and ticks its line.

      **＋** `make test` is green, and `make lint` has no finding on a schema.

      **－** `generate` prints "applied by hand" for no entry.'
  applied: '23:54:54'
