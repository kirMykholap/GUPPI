  sections:
    Criterion: 'When:

      `uv run guppi generate` reaches the first entry of a Case in `materialize.yaml`, or a `decisions`
      record with no page yet.


      Then:

      One page `vault/wiki/decisions/decision-case-<N>.md` is written: `case`, `status: current`, one
      list per kind present — `create`, `update`, `delete`, `defer` — the slugs in ledger order; `source`
      when a line carries one; `supersedes`; `origin`, `sprint`, `created`; `tags`, the union of the targets''
      tags; the body `## Context` and `## Problem` from `case_text`, and `## Deferred` with one `### [[slug]]`
      per target of a `defer` line and its `purpose` verbatim.

      **＋** The page is written before the first entry of its lines, so their History lines name it.

      **＋** A `supersedes` sets the earlier page `superseded` and appends to its `superseded_by`. It removes
      the earlier slug from the `deferred_by` of each target of its `defer` list that a decision line
      of the superseding Case names; an empty `deferred_by` is dropped.

      **＋** A target of the earlier page''s `defer` list that no decision line of the superseding Case
      names keeps the earlier slug in its `deferred_by`.

      **＋** An existing page is skipped; a `create` marked `exists` writes no page, but the Decision page
      of its Case is written.

      **＋** A record with `superseded_by` and no `case_text` gets a two-line body: `## Context` `Superseded
      by [[decision-case-M]] in its own session, before the Spec was approved; the Case left the Spec
      (case 299).`, `## Problem` `Decided under [[decision-case-M]].`

      **－** The page holds no `## When` and no `## Criterion`: the promise lives on the Estimate.'
  change: the Criterion replaced whole — a supersedes clears deferred_by only on the pages the superseding
