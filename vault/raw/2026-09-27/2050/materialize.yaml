      run guppi tail`, this session''s folder first, a Case that a `{supersedes:case N}` line names not
      counted, and no page.

      **＋** What got done holds the commit, the code files and tests changed, the result of `make test`
      and `make style`, and the readings and lessons written by their ledger line numbers, except a reading
      or a lesson that is the end of an item of the frontier.

      **＋** What is not done holds each number of the frontier with the end it took, and its ledger line
      number where it has one, with no text of the item and no repeat of the two lines under the frontier.

      **－** No Case, box, reading or lesson is named in two parts of the report.'
