decisions:
- case: '464'
  decision: decision-case-464
  origin: raw/2026-09-27/2050/ledger.md#case-464
  targets:
  - kind: update
    category: estimates
    slug: estimate-sprint-migration-file-route-gone
    ref: estimate-sprint-migration-file-route-gone
  tags: []
  case_text:
    context: '`materialize` gives `category: unknown` to the entry of a ledger line whose slug has no
      category prefix (case 320). `generate` then treats that entry in one of four ways, by its kind.
      A `create` fails with `category ''unknown'' is not a vault folder`. A `defer` with no page fails
      the same way. An `update` applies to the page of that slug, in whatever folder it is in. A `delete`
      prints `outside the vault, nothing to archive`, applies and ticks its line (case 48). Case 460.1
      relied on the `update` road: it renamed `harness-senduserfile-renders-a-markdown-file-on-the-phone`,
      and that entry was `category: unknown`.

      The Criterion of `estimate-sprint-migration-file-route-gone` (status `passed`, from case 320) says
      the entry "lands `category: unknown`, and `generate` reports an error instead of ''applied by hand''".
      That is true for a `create` and a page-less `defer`. It is false for an `update` and a `delete`.
      The docstring of `guppi/generate.py` already describes both roads that apply (cases 460.1, 463).
      In session 1819 the person left the Estimate as it stood (Q7), and the brief flagged the contradiction
      again.

      The Criterion also keeps the old shape: a `Given:` block, and a `－` line that only bounds the edit
      ("`rule-morph` is untouched"). Its `method` still reads "at the close of theme 5", and theme 5 is
      closed. `tests/test_generate.py` covers the unknown-category `delete` (`test_a_delete_outside_the_vault_applies_and_a_delete_of_a_missing_page_fails`,
      `test_a_delete_of_an_unknown_category_is_outside_the_vault`). No test covers the `update`, the `create`
      or the page-less `defer` of that category.

