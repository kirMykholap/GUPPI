  sections:
    Criterion: 'When:

      `guppi render` writes `vault/wiki/estimates/schema.yaml` from `rule-estimates-schema`, and `guppi
      lint` reads a page of `vault/wiki/estimates/`.


      Then:

      The file equals the Render. Lint reads from it: required `type, kind, status, target, method, origin,
      sprint, created, tags`; optional `purpose, checked`; values `kind: QA | Research`, `status: pending
      | passed | failed`; the sections `## Criterion` and `## History` required, `## Result` optional,
      `## Result` required on `passed` and on `failed`.

      **＋** An Estimate page with these fields, values and sections has no `schema` finding; one lacking
      a required field, with a value outside the list, with a conditional not met or lacking a required
      section has one finding per defect.

      **＋** An Estimate page without a `method` field has the finding `schema: missing field method`.

      **＋** `fields` and `sections` describe each name of these lists; `description` holds, among its
      paragraphs, the introduction, the `failed` paragraph, the fields deliberately absent, the two kinds,
      and the Result and Criterion paragraph; `examples` holds the example pages.

      **－** `description`, `fields` and `sections` name no `unmigrated` count, no recut of an older page,
      no `## Context` or `## Method` section, and no `Given:` kept on an older page.'
  applied: '14:25:49'
