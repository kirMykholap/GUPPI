      ledger. At `/hi` each `pending` reading becomes a `W` line of the Frontier. Only `/retro` says "take
      the readings". By then some readings are blocked, because the ledger hook refuses a reading of an
      Estimate that the same session creates or updates (case 428.1). Other readings are tied to a moment
      that has already passed. For example, the `method` of `estimate-hi-no-read-calls` names "the /hi
