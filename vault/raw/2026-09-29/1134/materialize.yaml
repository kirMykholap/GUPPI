- case: '506.4'
  decision: decision-case-506.4
  origin: raw/2026-09-29/1134/ledger.md#case-506.4
  targets:
  - kind: update
    category: estimates
    slug: estimate-lint-finds-a-broken-link
    ref: estimate-lint-finds-a-broken-link
  tags: []
  case_text:
    given: '`guppi/lint.py` — `check_criterion`, `CASE_BLOCK` and the docstring of the class `ref`

      **＋** `tests/test_lint.py` — the tests of the class `ref`

      **＋** `estimate-lint-finds-a-broken-link` — the promise, its Criterion replaced whole

      **＋** `guppi/materialize.py` — `category_of`, which gives a slug its category by its prefix, `decision-`
      included

      **＋** `raw/<date>[/<HHMM>]/ledger.md#case-N` — the form of an `origin` that lint resolves

      **＋** `vault/wiki/` — the live pages whose links are followed

      **＋** `vault/raw/` — where an `origin` ledger stands

      **＋** `vault/archive/` — where an archived page or ledger stands'
    when: '`uv run guppi lint` follows the links of the live pages under `vault/wiki/`.'
    then: '`ref`: a slug in `parent`, `children`, `estimates`, `target`, `insight`, `addressed_by`, `deferred_by`,
      `applies_to`, `rules` or in a body `[[…]]` that no live or archived page carries; a body `[[…]]`
      may name a file under `vault/wiki/` by stem or path; a `[[…]]` inside a code span is no link.

      **＋** `ref`: an `applies_to` naming a page that is not an Entity; an Entity whose `rules` differs
      from the live rules whose `applies_to` names it, the difference as `+slug` and `-slug`.

      **＋** `ref`: a `[[slug]]` under a Decision page''s `## Criterion` that is no live or archived Estimate.

      **＋** `origin`: an `origin` `raw/<date>[/<HHMM>]/ledger.md#case-N` or `#L<n>` whose ledger stands
      in neither `vault/raw/` nor `vault/archive/`, or in both, or holds no such case or line; an `origin`
      of another form on a page that is not an Insight.

