    context: 'Until case 193, an Estimate page kept its check method in a `## Method` section and the
      Case''s problem in a `## Context` section, and its Criterion could hold `### case N` blocks. Since
      then `method` is a one-line field and the Criterion is one text. Old pages were converted one at
