      the session. So the readings pile up: this session''s Frontier opened with 89 reading lines under
      `## Work`. The librarian is a helper agent and writes no ledger line. Yet the `method` of 32 Estimates
      names the librarian, counted by a Grep of the `method` lines. The librarian lists these Estimates
