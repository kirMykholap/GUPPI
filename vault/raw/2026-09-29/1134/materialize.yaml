      - The Render of `rule-skill-hi` and the Criterion of `estimate-hi-writes-frontier` both say a `W`
      line closes "in Work Mode". Closing at `/hi` makes both false, so sub-case 508.2 changes both. A
      reading taken by `/retro` closes its line at Retro, so the new wording names all three places.


      Case 507 and why 508.2 supersedes it:

      - Case 507 of this session replaced the same Criterion whole: at `/hi` the chat shows the Cases
      as the checklist of `frontier.md`, the detail on an indented line, never as a bold line with a paragraph.
      The person chose that look from four, and kept `rule-orchestration` out of it.

      - Two whole replacements of one Criterion would sign it twice. So 508.2 supersedes 507 and carries
      both of its changes: 507''s pair on `rule-skill-hi` for the chat look, and its own pair for closing
      a `W` line.

      - The one Criterion of 508.2 is 507''s with two changes. The chat look is described on its own and
      no longer called the form of the acknowledging reply, since that form folds closed lines and shows
      no detail line. The `W` closing line is changed.

      - 507 leaves the Spec.

      - Against the Criterion on the page today, two lines are not carried: the old chat line and the
      old `W` closing line.


      Other frame facts:

      - The Render of `rule-skill-hi` assembles the Frontier with "no page opened". That stays: only the
      new reading step opens the pages of the Estimates it reads.

      - The `W` lines are closed in `frontier.md` before the reply that carries the `LEDGER` block, since
      that reply ends in text with no tool call after it.


      Why some `then` lines look alike:

      - The reading steps of 508.1 at `/hi` and 508.3 in `/work` use similar words on purpose. They are
      one kind of step at two moments, each with its own promise, and each can fail apart from the other.

      - The line of 508.3 that closes the `W` line before the `LEDGER` reply repeats the matching line
      of 508.1 on purpose, so that each Estimate reads whole without the other.

      - Some lines of 508.2 share words with 508.1 because both describe `frontier.md`.


      These Estimates stand, and why:

      - `estimate-hi-no-read-calls`: the reading calls come after the skill''s output is already in context,
      so they are not calls "to get any of them".

      - `estimate-work-mode-runs-the-spec-on-a-branch-from-a-baseline`: it promises the tasks in order,
      and its `－` line about ticking no `read` box stays true.

      - `estimate-brief-written`: its Criterion promises the sections, their order and their sources.
      Each Readings due line keeps its three parts, the Estimate, its `draft` rule and where it is read,
      one line per Estimate. The facts added at the end of the line are promised by the new Estimate of
      508.4.

      - `estimate-documentation-completes`: the librarian opens an Estimate page for "a fact for the brief",
      which its frame already lists, and the archive output still goes into the report.


      What does not change:

      - `rule-retro` keeps its reading paragraph and takes whatever is left.

      - The sentence of `rule-case-protocol`, "a `W` line closes when its work is done", names no phase
      and stays true.


