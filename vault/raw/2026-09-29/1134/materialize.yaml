      the three new slugs free.


      Timing: no hook changes. The skills are rendered at the librarian''s run. `/hi` and `/work` act
      on the new text from the next session. The librarian of this session runs on the frame it loaded
      at dispatch, so the new brief facts first appear one run later.'
    problem: A Work reading has no trigger before Retro. Readings tied to `/hi` or to the librarian's
      run pass without being taken, and the other readings pile up until some are blocked.
