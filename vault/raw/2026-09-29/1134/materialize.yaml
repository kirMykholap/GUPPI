      can be done at that moment.

      **＋** It reads what the method names from `vault/wiki/brief.md`, `git log`, `git status` and the
      commands of the method, and reads the librarian''s report from the transcript of the previous session.

      **＋** It opens the page of each Estimate it reads and judges the reading against its `## Criterion`.

      **＋** It closes the `W` line of each reading taken as `[x] … · work` in `raw/<date>/<hi HHMM>/frontier.md`,
      then writes one `estimate[...]` line per reading in a `LEDGER` block of the reply, which ends in
      text.

      **－** The Frontier is still assembled with no page opened. Only the reading step opens the pages
      of the Estimates it reads.

      **－** A reading whose `method` also names a later moment is not taken at `/hi`. It is taken at that
      moment, and its `/hi` part is read then from the session''s first turn.

      **－** A reading whose `method` asks for a `/hi` run of its own, such as one outside plan mode, is
      not taken at `/hi`.

