    - workflow
  sections:
    Criterion: 'When:

      The person types `/hi` on `UserPromptSubmit`, and the agent writes `raw/<date>/<hi HHMM>/frontier.md`,
      whose `## Work` holds the `pending` readings of `vault/wiki/brief.md`.


      Then:

      In its first reply, before the question on the order, the agent takes each reading of an open `W`
      line whose `method` names the `/hi` of a session or the librarian''s run and whose whole method
      can be done at that moment.

