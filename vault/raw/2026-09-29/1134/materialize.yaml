  change: the Criterion replaced whole — the Cases shown in the chat at /hi as a checklist, no bold line;
    a W line closes where its work is done (case 508.2, supersedes 507)
  sections:
    Criterion: 'When:

      The person invokes `/hi`. The agent assembles the Frontier from `vault/wiki/sprint.md`, `vault/wiki/brief.md`,
      `vault/wiki/backlog.md` and the output of the skill''s commands, and closes its lines in Plan Mode.


      Then:

      The Frontier is written to `raw/<date>/<hi HHMM>/frontier.md` in the lists `## Cases`, with lines
      `- [ ] C<n> — <title> · <source>`, and `## Work`, with lines `- [ ] W<n> — <title> · <source>`.
      The title of a line of the current milestone or of the backlog opens with the slug of each of its
      pages in a code span.

      **＋** The kind comes from the source. Cases: first, on a plan branch, the unfinished plan and each
      conserved Spec of `vault/wiki/backlog.md`, with the source `backlog`; then the items of the current
      milestone; the `Cases` list of the brief''s Next session; a hand edit shown by `Render:`; a `failed`
      reading or a lesson of the ledger''s Tail; an item the person adds. Work: the `Work` list of the
      brief''s Next session; a dirty tree by `git status`.

      **＋** The other items of the backlog are not lines. `## Cases` ends with the line `Backlog: N items`,
      where N is the count in `vault/wiki/backlog.md`. Under a Cases line, an indented line `- near` names
      by slug each backlog item whose `purpose` is near that line in meaning. The agent judges this from
      the loaded file, with no `ask-guppi`. An item the person brings onto the Frontier becomes a Cases
      line with the source `backlog`.

      **＋** A line closes by appending the closer and keeping the source. An item ended closes `[x] …
      · case N` when decided, or `[x] … · work` when done with no decision. A line of the sprint page
      left for a later session closes `[-] … · sprint · defer`. An item of the backlog left as it stands
      closes `[-] … · backlog · kept`. A decision of any other source put off closes `[-] … · defer case
      N`.

      **＋** An item closed `defer` or `kept` has no short Case and no ledger line. A sprint item never
      closes `· defer case N`.

      **＋** Only the current milestone gives items. A later milestone and Closed give none, and the sprint
      page''s Backlog reaches the Frontier only through the backlog. A decision line of the Tail is not
      an item.

      **＋** In the chat the Cases are shown as a checklist. Each line stands as `raw/<date>/<hi HHMM>/frontier.md`
      holds it, `- [ ] C<n> — <title> · <source>`, with its detail on an indented line under it and the
      `- near` line under that, and the line `Backlog: N items` comes last. The Work is shown as one block.
      Only Cases are cut into sub-cases. A `W` that turns out to need a decision closes `· case N`. A
      `C` that needs none closes `· work`.

      **－** At `/hi` no Case stands in the chat as a bold line, and no Case has its detail as a paragraph.

      **－** `Pull:` and `Open issues:` are a Cases item only when `vault/wiki/sprint.md` names no decision
      on them.

      **－** Pre-spec finds an open line under `## Cases`. A `W` line stands open until its work is done
      and closes `· work` where that work is done: at `/hi`, in Work Mode or at Retro. Claude Code''s
      plan mode does not stop the agent from writing `frontier.md`.'
