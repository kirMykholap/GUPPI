- line: 7
  text: 'lesson[knowledge][lesson-permissions-auto-mode-refuses-a-remote-change-despite-the-chat]{tags:harness,workflow}{source:Claude
    Code auto mode classifier, session 2026-09-30/0138, reason Remote Repoint} trigger: in Work Mode the
    by-hand task of case 528.1, git remote remove origin, was refused by the auto mode classifier twice
    — the second time after the person wrote in the chat that they allowed it — and a plain sed -n read
    of the Spec run right after the first refusal was refused with the same reason; the person ran the
    command by hand with ! in the prompt. root_cause: the classifier judges the action against the settings''
    permission rules, not against the person''s word in the chat, and a denial covers the outcome, not
    only the command; a task that changes a git remote can be done in Work Mode only by the person or
    under a permission rule in settings.'
  kind: lesson
  category: lessons
  slug: lesson-permissions-auto-mode-refuses-a-remote-change-despite-the-chat
  origin: raw/2026-09-30/0138/ledger.md#L7
  fields:
