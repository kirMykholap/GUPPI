      **＋** It puts `carry.md` into the session folder: one line, a flag for `materialize` and `guppi
      backlog`, not a document. The session that finishes the work deletes it.

      **＋** It runs `uv run guppi backlog`, and `vault/wiki/backlog.md` then shows the conserved Spec
      with its targets.

