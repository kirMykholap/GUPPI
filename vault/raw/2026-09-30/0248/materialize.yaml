      The skill reads the tree. When the tree holds changes outside the session folder and `vault/wiki/brief.md`,
      the skill stops and says that work was done and the ordinary exit applies.

      **＋** Otherwise it rewrites `vault/wiki/brief.md` in the short shape, with no Deferred list.

