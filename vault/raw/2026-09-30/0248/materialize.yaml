- case: '537'
  decision: decision-case-537
  origin: raw/2026-09-30/0248/ledger.md#case-537
  targets:
  - kind: update
    category: rules
    slug: rule-case-check
    ref: rule-case-check
  - kind: create
    category: estimates
    slug: estimate-case-check-refuses-a-letter-outside-the-script
