  - kind: update
    category: rules
    slug: rule-hook-registry
    ref: rule-hook-registry
  tags:
  - harness
  - session
  case_text:
    given: '`rule-python-utf8` — the new rule; its Render is the `env` block of the settings file

      **＋** `estimate-python-utf8-output-intact` — the promise of the new rule

      **＋** `rule-settings` — the frame of `.claude/settings.json`; takes the marker line of the new child

      **＋** `rule-hook-registry` — a sibling child; its Purpose names the rules that share the file

      **＋** `.claude/settings.json` — the rendered file; its `env` reaches the processes of the session

      **＋** `rule-render-harness` — the renderer; a `.json` target takes a child''s text bare

      **＋** the Bash tool of Claude Code — runs the agent''s commands in the environment of the session'
    when: 'A session starts with `.claude/settings.json` as `uv run guppi render` wrote it from `rule-settings`,
      and the agent runs a Python script through the Bash tool, with no encoding set in the command, that
      prints a dash and a character outside cp1252.

      **＋** The hooks of `.claude/settings.json` run in the same session.'
    then: '`.claude/settings.json` carries `"PYTHONUTF8": "1"` under `env`, the text of `rule-python-utf8`.

      **＋** The script runs in UTF-8 mode, and the dash reaches the agent in the output of the Bash tool
      as the dash, not as U+FFFD.

      **＋** The character outside cp1252 prints, and the script does not stop at the print.

      **＋** The output of a hook of `.claude/settings.json` reaches the agent as before, its dashes kept.

      **－** The Render of `rule-python-utf8` holds no key other than `PYTHONUTF8`.'
    context: 'The agent often runs its own Python scripts through the Bash tool. On Windows, Python writes
      console output in the locale''s code page. `guppi/cli.py` measured that code page as cp1252 on 2026-09-09.
      The Bash tool reads those bytes as UTF-8. So a character outside cp1252 stops the script at the
      print, which is the case `lesson-bash-tool-heredoc-escapes-interpreted` records. A character inside
      cp1252, such as the dash, goes through without an error and reaches the agent as U+FFFD. Here that
      happened at the reading of `estimate-context-size-warns-past-the-limit` (reading L4 of `raw/2026-09-30/0138/ledger.md`).
      The script ran with no encoding set, printed the dash of `guppi context --prompt` as U+FFFD, and
      the handoff called it a defect of the hook. The transcript of session 876c4080 holds the correct
      dash in the hook''s stdout and in the text the agent received, and no U+FFFD at all. A second run
      of the same script with `PYTHONIOENCODING=utf-8` printed the dash. The hook needs no fix. The main
      agent reads that Estimate again and writes a lesson line; neither is part of this Case. Today `.claude/settings.json`
      has no `env` block. `rule-settings` is its frame, with three children: `rule-default-mode`, `rule-permissions`
      and `rule-hook-registry`. None of the three owns an environment. The renderer takes a child''s text
      bare into a `.json` target and finds each child by its marker line in the frame. The vault''s answer:
      no page covers the environment of a session. The near pages are `rule-settings`, the frame that
      gets the new marker line; `lesson-bash-tool-heredoc-escapes-interpreted`, the manual workaround
      of setting `PYTHONIOENCODING` in each command; and `lesson-hooks-windows-stdin-encoding`, the hook
      side, already fixed in code. The tags `harness` and `session` fit. The slugs `rule-python-utf8`
      and `estimate-python-utf8-output-intact` are free. In the frame, four texts contradict the change.
      The Purpose and the `purpose` of `rule-settings` both say three rules share the file. The Purpose
      of `rule-hook-registry` says the file is one text of three rules. The Criterion of `estimate-settings`
      lists the three children and their key order. This Case changes all four. The sentence of `rule-hook-registry`
      says "several rules" in place of a number, so a later child leaves it true. That page''s `estimate-hook-registry-rendered`
      speaks of the hooks, so a pair in its Purpose leaves it alone. Sub-case 534.2 replaces the Criterion
      of `estimate-settings` whole. Two of its lines change on purpose: the line on the order of the children
      now names the fourth child and the key order, and the line on what `rule-settings` holds now names
      a variable of the environment too. The lesson stands as it is: it records what was true when it
      was written. `estimate-default-mode` and `estimate-permissions` speak of the `permissions` keys,
      which do not change. `rule-harness` stays as it is, since the new rule''s parent is `rule-settings`.'
    problem: The Bash tool starts each Python process of a session in the locale's code page. Unless each
      command sets the encoding, a dash reaches the agent as U+FFFD and other characters stop the script.
      That already produced one false reading and one false Frontier item. The harness should set UTF-8
      once, for every Python process of the session, through a ratified rule.
  spec: vault/raw/2026-09-30/0248/spec.md
  applied: 04:55:08
