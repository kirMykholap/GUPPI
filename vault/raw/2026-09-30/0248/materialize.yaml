      line in the order of `children`: `rule-default-mode`, `rule-permissions`, `rule-hook-registry`,
      `rule-python-utf8`. That order gives the order of the top-level keys of the file: `permissions`,
      `hooks`, `env`.

      **＋** The file parses as JSON, and `uv run guppi render --check` exits 0.

      **＋** The next session start writes its `session-start` line into `vault/raw/<date>/event_log.md`,
      from the hooks of the rendered file.

      **－** `rule-settings` holds no rule of its own about what a hook, a permission or a variable of
      the environment may be.'
