- case: '535'
  decision: decision-case-535
  origin: raw/2026-09-30/0248/ledger.md#case-535
  targets:
  - kind: update
    category: entities
    slug: entity-glossary
    ref: entity-glossary
  tags: []
  case_text:
    context: 'The table in the `## Terms` section of `entity-glossary` gives one row per term: the term,
      its meaning in one line, and the page that defines it. `uv run guppi glossary` writes `vault/wiki/glossary.md`
      from this table at the librarian''s run, and `/hi` loads that file into every working session. At
      the `/hi` of this session, a reading of `estimate-glossary-terms-defined` came back failed. Its
      ledger line counts three rows that contradict the page they point to. First, the `Decision page`
      row gives `## Context` only to a Case without `given`, but `rule-decisions-schema` also gives it
      to the two-line body of a Case superseded in its own session (case 299.4). Second, the `Main agent,
      Subagent` row has the main agent write ledger lines "until the Retro commit", but `rule-retro` ends
      Retro with one `LEDGER` block in the reply after that commit (case 531.8). Third, the `Plan Mode`
      row covers only Cases ratified or deferred. But `rule-case-protocol` also closes an item that needs
      no decision without a Case, leaves an item of the sprint for later, and keeps a backlog item as
      it stands (cases 356.1, 356.2, 421.4, 451.1). The subagent that took the reading also noted two
      more false rows, which the ledger line does not count, since neither contradicts its `where` page.
      The `Types` row says a `delete` sets `status: deleted`, but no page schema allows that status, and
      the docstring of `guppi/generate.py` sets `archived` with a History line `deleted`. The `CLAUDE.md,
      case-schema.md` row names two of the rules spliced into `CLAUDE.md`, while `rule-claude-md` names
      three (case 360). The person chose to fix all five rows, to keep the promise as it stands, and to
      have the `Plan Mode` row name every way an item closes. This is an `update`, so no vault query was
      run. The frame holds no hook. The Estimates of `rule-glossary` promise the render, the check of
      the file and the ticks, not the content of the rows, so they are not touched. The Criterion of `estimate-glossary-terms-defined`
      still says what the rows must meet, so it is not replaced. Its next reading comes at a later `/hi`,
      after the librarian''s run writes the rows. For that reason the Case holds no `read` line, since
