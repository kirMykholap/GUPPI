    method: 'uv run guppi render --check and json.load of .claude/settings.json; then by hand at a later
      session start: a Python script run through the Bash tool with no encoding in the command prints
      a dash and a character outside cp1252, and the tool output shows both; the Stop line of guppi context
      shows its dash'
    tags:
    - harness
    - session
  sections:
    Criterion: 'When:

      A session starts with `.claude/settings.json` as `uv run guppi render` wrote it from `rule-settings`,
      and the agent runs a Python script through the Bash tool, with no encoding set in the command, that
      prints a dash and a character outside cp1252.

      **＋** The hooks of `.claude/settings.json` run in the same session.


      Then:

      `.claude/settings.json` carries `"PYTHONUTF8": "1"` under `env`, the text of `rule-python-utf8`.

      **＋** The script runs in UTF-8 mode, and the dash reaches the agent in the output of the Bash tool
      as the dash, not as U+FFFD.

      **＋** The character outside cp1252 prints, and the script does not stop at the print.

      **＋** The output of a hook of `.claude/settings.json` reaches the agent as before, its dashes kept.

      **－** The Render of `rule-python-utf8` holds no key other than `PYTHONUTF8`.'
  applied: 04:55:08
