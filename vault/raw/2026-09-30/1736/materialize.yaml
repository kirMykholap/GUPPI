  applied: '20:13:47'
- case: '549'
  decision: decision-case-549
  origin: raw/2026-09-30/1736/ledger.md#case-549
  targets:
  - kind: update
    category: entities
    slug: entity-glossary
    ref: entity-glossary
  - kind: update
    category: rules
    slug: rule-rules-schema
    ref: rule-rules-schema
  - kind: update
