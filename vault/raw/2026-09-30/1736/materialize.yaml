    slug: rule-prespec
    ref: rule-prespec
  - kind: update
    category: rules
    slug: rule-backlog
    ref: rule-backlog
  tags: []
  case_text:
    context: 'A page carries `deferred_by`, a list of the Decision pages whose `defer` put off work on
      it. While that list is not empty, the page stands in `backlog.md`. `guppi generate` adds a decision
      to the list on a `defer`. It takes the decision out only on the pages that a decision line of the
      later, superseding Case names (case 467.3). So when one earlier Case put off two pages and a later
      Case supersedes it but names one of them, the other page keeps the defer and stays in the backlog.
      Several texts describe this rule. Some say that any `supersedes` clears the field: the glossary
      row `deferred_by`, two sentences each in `rule-rules-schema` and `rule-entities-schema`, the field
      text of `rule-insights-schema`, and the module docstring of `guppi/materialize.py`. Others state
      the condition in full: `rule-case-protocol`, whose Render is `case-schema.md`; the glossary row
      `ref`, `slug`, `supersedes`, corrected by case 541; a clause of `rule-prespec`; and a sentence of
      `rule-backlog`. The schema texts are rendered into the `schema.yaml` file of each folder, the glossary
      into `glossary.md`, and `rule-prespec` into the skill file of `/pre-spec`. At case 541 the person
      chose to leave the looser texts. The handoff of session 1306 carried them on as an open item, and
      the person now takes them up. The person chose to keep the condition on one page only, `rule-case-protocol`,
      and to have every other vault text point to it instead of repeating it.

      The texts were found by Greps of `vault/wiki/`: for `clear` in any case, for `deferred_by`, and
      for the words of the condition (`only from the pages`, `names its page`, `both names the page`),
      plus a Grep of `guppi/` for `deferred_by`. History lines, `log.md`, `brief.md` and the Decision
      pages were not read. Some hits stand as they are. `rule-case-check`, the docstrings of `guppi/prespec.py`
      and `guppi/casecheck.py`, and the check that `rule-prespec` describes all say what a check reports,
      not when `generate` clears a defer. The Criteria of `estimate-generate-writes-the-decision-page`
      and `estimate-prespec-requires-a-backlog-item-decided-on-its-page` state the behaviour that their
      readings measure, and a promise must state what it checks. The docstrings of `guppi/generate.py`
      describe the code that clears the field. The docstring of `guppi/materialize.py` is wrong today,
      not made wrong by this Case: it says a `{supersedes}` takes the slug out of the target''s `deferred_by`,
      and it does not say that `generate` does this or on what condition. It enters the Case as a docstring
      fix, with no test.

      This Case holds only `update` items, so no vault query was run. It adds no hook and changes no reader
      of a text. No old form needs to be kept. The Estimates of the changed pages were read, and none
      is touched. `estimate-glossary-terms-defined` asks that no row contradict its `where` page. The
      row `deferred_by` and its page `rule-rules-schema` change the same way, and the row `ref`, `slug`,
      `supersedes` points to its own `where` page. The `-schema-checked` Estimates of the three schemas
      list what each file holds, not the words of the `deferred_by` text. In the Insight one, the rows
      of the tables stay whole, one text per field. The Estimates of `rule-prespec` and `rule-backlog`
      speak of what the check reports and of the render. They do not speak of the reason clause or of
      when an item leaves. The `given` holds more than seven lines because each changed page stands beside
      the file it renders into. The Case stays whole because one condition holds for every text: each
      one points to `rule-case-protocol`. A wrong text is fixed the same way in each place, and no promise
      is touched.'
    problem: The rule for when a supersede clears a defer is written in full on several pages. Some copies
      leave out the condition that the superseding Case names the page, so they contradict `rule-case-protocol`
      and the code. The fix must remove the copies that repeat the rule, so that the condition stands
      in one place and the other texts point to it.
    recommend: "- **Which texts change**\n  - Recommended: the three pages the item names and the Insight\
      \ schema too, so that every live text that describes clearing `deferred_by` is covered.\n  - Answer:\
      \ agreed.\n- **How the texts state the condition**\n  - Recommended: each text states the condition\
      \ in its own words.\n  - Answer: the person asked why the texts should not point to one place instead.\
      \ One judgment written in several places is several implementations of it. The next question settled\
      \ this.\n- **Where the condition stands, and what the other texts say**\n  - Recommended: the condition\
      \ stands on `rule-case-protocol`, and the texts point to it.\n  - Answer: agreed. The person also\
      \ asked to take in two remarks. First, the glossary row `ref`, `slug`, `supersedes`, which states\
      \ the condition in full, also becomes a pointer. Second, the other full copies are checked: each\
      \ vault text either points to `rule-case-protocol` or stands with a reason given in `context`."
    given: '`entity-glossary` — the table of terms whose rows `deferred_by` and `ref`, `slug`, `supersedes`
      this Case changes

      **＋** `vault/wiki/glossary.md` — the render of the table, loaded at the start of every working session

      **＋** `rule-rules-schema` — the Rule schema, which describes `deferred_by`

      **＋** `vault/wiki/rules/schema.yaml` — its render, read by lint and by the writer of a Rule page

      **＋** `rule-entities-schema` — the Entity schema, which describes `deferred_by`

      **＋** `vault/wiki/entities/schema.yaml` — its render, read by lint and by the writer of an Entity
      page

