    given: '`rule-retro-onward` — the rule of the `Stop` hook that sends the agent from the end of Retro
      to `/handoff`

      **＋** `guppi/onward.py` — `run`, its handler of an error, and the docstring

      **＋** `tests/test_onward.py` — the tests of the hook

      **＋** `estimate-retro-onward-exits-2-on-an-error` — the promise this sub-case creates

      **＋** `rule-where-to-stop` — the page that says the hook lets a reply that opens with `STOP:` end'
    when: 'The `Stop` hook `uv run guppi onward` fires, and an exception rises in `guppi/onward.py` after
      the hook has read the payload: while it reads the reply, the session folder or the event log.'
    then: '`guppi onward` exits 2. Its stderr holds `onward: not checked: <error>` and the advice: if
      Retro has ended and `handoff.md` does not stand, commit the session folder and call `/handoff`.

      **＋** While the cause stands, `guppi onward` blocks with the same error at every `Stop` of the session,
      before Retro too.

      **－** An empty payload of `guppi onward` exits 0 with nothing on stderr.

      **－** On the re-fire after a block (`stop_hook_active`), `guppi onward` exits 0 and prints nothing,
      so it fires at most once a turn.

      **－** With no error, `guppi onward` exits 2 or 0 by its own judgment, as before.'
    context: 'Three `Stop` hooks run after each reply of the main agent, beside the ledger hook and the
      Spec hook. `guppi casecheck` compares a shown Case with the answer of `case-guppi` that passed the
      checks. `guppi context` shows the person the size of the context window. `guppi onward` sends the
      agent from the end of Retro to `/handoff`. Each of the three wraps its whole run in one catch-all
      handler. When anything inside raises, the hook prints its error to stderr and exits 0. Claude Code
      does not show the agent the stderr of an exit 0, so nobody sees the error. For example, when the
      comparison of `guppi casecheck` raises, a Case that differs from the checked answer reaches the
      person unchecked, and nothing shows it. Case 552.4 gave the ledger hook exit 2 on its own error
      after the payload is read. Case 554 gave the `Stop` run of `guppi ratified` the same. This Case
      covers the other three hooks, one sub-case each, because each is its own rule and can fail and be
      fixed apart. `guppi casecheck` and `guppi onward` take exit 2. `guppi context` only informs, so
      it shows its error to the person in place of the size line and never blocks. Two more sub-cases
      add the exception of the hook''s own error to an existing promise that the change would make false.
      Case 555.4 does this for `guppi onward`, whose error now blocks a reply before Retro too. Case 555.5
      does it for `guppi context`, whose error now prints a line that does not open with the count. In
      555.4, the line of every other case and the line without a `hi` each gain the words "with no error
      of its own". In 555.5, the line of the size line gains the words "with no error of its own". The
      check of the answer notes such lines as not carried, and the change is on purpose. The other lines
      of both Criteria are carried as they stand. What this Case does not do: the `--subagent` run of
      `guppi casecheck` and the `--prompt` run of `guppi context` keep exit 0. The reason that the later
      `Stop` check gives, when an error of the `--subagent` run left no Case file, is not reworded. The
      main agent offered that rewording, and the person agreed to the recommendation without it. How the
      frame was read. `read_payload` of `guppi/event.py` catches its own errors and returns an empty payload.
      `read_records` of `guppi/ledger.py` returns nothing for a transcript it cannot read. So an error
      of `guppi context` rises only while it counts the tokens, and its page keeps its sentence that an
      unreadable transcript prints nothing. The three rule pages say nothing about a hook''s own error.
      Each sub-case adds that sentence at one anchor, and a Grep of `vault/wiki/` found each anchor once.
      For `rule-context-size`, the anchor is the end of its paragraph, after the page introduces `--prompt`.
      `rule-case-check` says the hooks never raise, and that stays true. A Grep of `vault/wiki/` for `rule-context-size|rule-retro-onward|guppi
      context|guppi onward`, with the hits under `decisions/` left aside, printed `brief.md`, `log.md`,
      `where-to-stop.md`, `rule-case-check`, `rule-context-size`, `rule-end-of-work`, `rule-harness`,
      `rule-hook-registry`, `rule-python-utf8`, `rule-retro`, `rule-where-to-stop`, `estimate-context-size-warns-past-the-limit`,
      `estimate-context-size-shown-after-each-reply`, `estimate-retro-onward-sends-the-agent-to-the-handoff`,
      `estimate-python-utf8-output-intact`, `estimate-page-read-cuts-the-history` and `lesson-bash-tool-python-cp1252-dash-shown-as-u-fffd`.
      The hits in `brief.md` and `log.md` were not read. Of the rest, only `estimate-retro-onward-sends-the-agent-to-the-handoff`
      and `estimate-context-size-shown-after-each-reply` state what a hook prints or how it exits in a
      way that its own error would make false, and Cases 555.4 and 555.5 replace their Criteria. `estimate-context-size-warns-past-the-limit`
      speaks of the text past the limit, which an error does not reach, so it stands. `rule-where-to-stop`
      and `where-to-stop.md` say that the hook lets a reply that opens with `STOP:` end. That stays true.
      The hook checks the first word before it reads any file, and even after an error the repeat run
