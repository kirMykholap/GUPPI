      **＋** A later question that replaced an earlier one is an item of its own, and the earlier item
      keeps its own recommendation and answer.

      **＋** A question asked in more than one round is one item, with the recommendation and the answer
      of the last round in which the person answered it.

      **＋** A question the person left unanswered is asked again in the next round under the same title;
      a question never answered has one item, whose `Answer:` sub-item says it was not answered and names
      the later question that replaced it, if one did.

