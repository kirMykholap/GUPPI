      read the payload — an exception while it reads the transcript, the event log or the store, or compares
      a shown Case or reads a sending — exits 2 with `casecheck: not checked: <error>` and the advice
      to show the Case again once the cause is fixed on stderr, so the agent sees it at the end of that
      reply. An empty or unreadable payload exits 0 with its line on stderr. The run of `--subagent` keeps
      exit 0 with its error on stderr, since a send-back to `case-guppi` is not ended by `stop_hook_active`
      and would loop; a Case its error left with no file is refused later by the `Stop` check (case 555.1).'
  change: the Stop run exits 2 on its own error after the payload is read; the --subagent run keeps exit
    0 (case 555.1)
