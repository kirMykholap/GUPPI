- case: '554'
  decision: decision-case-554
  origin: raw/2026-09-30/2042/ledger.md#case-554
  targets:
  - kind: update
    category: rules
    slug: rule-spec-write
    ref: rule-spec-write
  - kind: create
    category: estimates
    slug: estimate-spec-write-exits-2-on-an-error
    ref: rule-spec-write
  tags:
  - hooks
  - harness
  - workflow
  case_text:
    context: "The `Stop` hook `uv run guppi ratified` of `rule-spec-write` copies each ratified Case into\
      \ the plan file and into `spec.md`. Its whole run sits inside one catch-all handler. When anything\
      \ inside the run raises, the hook prints `ratified: not done: <error>` to stderr and exits 0. Claude\
      \ Code does not show the agent the stderr of an exit 0, so the error goes unseen and any Case still\
      \ waiting in that run is not written. In session 1736 a malformed estimate line in the same reply\
      \ as the defer of Case 551 made `parse_line` raise. The hook caught the error and exited 0, and\
      \ Case 551 landed only at its second showing. That is why `estimate-spec-write-writes-a-defer` is\
      \ `failed`. Case 552.1 fixed `parse_line`, so that line no longer raises, but any other fault in\
      \ the hook would still be silent. Case 552.4 gave the ledger hook `guppi/ledger.py` exit 2 on its\
      \ own error once the payload is read, and exit 0 on an error while it reads the payload. This Case\
      \ gives the `Stop` run of `guppi ratified` the same behaviour. The guard `guppi ratified --guard`\
      \ of `rule-spec-reconcile` keeps exit 0. The page of that rule says the guard never raises, and\
      \ that stays true, so the page is not changed. The other `Stop` hooks (`guppi casecheck`, `guppi\
      \ context`, `guppi onward`) are left to their own Frontier line. How the frame was read:\n- The\
      \ `How it works` section of `rule-spec-write` states the exit codes of the hook but not the handling\
      \ of its own error. The new sentence goes at the end of that section, after the sentence on removing\
      \ a superseded Case. There the refusals that say \"the same way\" still point to the refusal they\
      \ meant.\n- The docstring of `guppi/ratified.py` says the hook never raises, and it also describes\
      \ the guard. It is updated in code.\n- A Grep of `vault/wiki/` for \"own error\", \"swallow\" and\
      \ \"never raises\" printed hits outside `decisions/` in these places:\n  - `rule-bash-guard` and\
      \ `estimate-bash-guard` say that `guppi guard` never raises. That is another hook, so they stand.\n\
      \  - `rule-spec-reconcile` says that the guard of `guppi ratified` never raises. The guard is unchanged,\
      \ so it stands.\n  - `lesson-ledger-hook-swallows-a-parse-error` is a recorded fact about the ledger\
      \ hook, so it stands.\n  - The History of `rule-ledger-write`, `brief.md` and `log.md` are not read.\n\
      - No Criterion of the Estimates of `rule-spec-write` speaks of the hook's own error. They speak\
      \ of refusals and of the re-fire, and those stay.\n- The `create` carries a `ref`, so no query of\
      \ the vault was run. A Glob found no page at the slug `estimate-spec-write-exits-2-on-an-error`.\n\
      \n`estimate-spec-write-writes-a-defer` is not touched. Its Criterion is sound, and it failed only\
      \ because the error was swallowed. It stays `failed` until a later session reads it again by its\
      \ own method, on the first defer after this change. That reading is not a task of this Case."
    problem: The `Stop` run of `guppi ratified` swallows its own errors with exit 0. A Case due to be
      written is then lost, and no sign reaches the agent. This is how the first showing of Case 551 was
      lost. The question is what the hook does on its own error, whether the guard changes with it, whether
      the other `Stop` hooks join, and how the promise is recorded.
    recommend: "- **What the Stop run does when it raises**\n  Recommended: (a) exit 2, as the ledger\
      \ hook does. An error after the payload is read exits 2, the message names the error and says to\
      \ repeat the ledger lines. An error while reading the payload still exits 0. The re-fire still does\
      \ nothing.\n  Answer: (a) exit 2, as the ledger hook does.\n- **The edit guard of the same command**\n\
      \  Recommended: (a) only the Stop run changes. The guard keeps exit 0 on its own error.\n  Answer:\
      \ (a) only the Stop run changes.\n- **The other end-of-reply hooks**\n  Recommended: (a) this Case\
      \ covers `guppi ratified` alone. The other three hooks are decided under their own Frontier item.\n\
      \  Answer: (a). Those hooks have their own item in the Frontier and are taken separately.\n- **How\
      \ the promise is recorded**\n  Recommended: (a) a new Estimate for the error path. The failed Estimate\
      \ keeps its wording and is read again in a later session.\n  Answer: (a) a new Estimate for the\
      \ error path; the failed one is read again later."
    given: '`rule-spec-write` — the rule of the `Stop` hook that writes a ratified Case into the Spec

      **＋** `guppi/ratified.py` — `run`, its handler of an error, and the docstring

      **＋** `tests/test_ratified.py` — the tests of the hook

      **＋** `estimate-spec-write-exits-2-on-an-error` — the promise this Case creates

      **＋** `rule-spec-reconcile` — the rule of the guard `uv run guppi ratified --guard` in the same
      command, which stays as it is'
    when: 'The `Stop` hook `uv run guppi ratified` fires, and an exception rises in `guppi/ratified.py`
      after the hook has read the payload: while it reads the transcript, the store, the plan file or
      `spec.md`, or while it writes, removes or checks a Case.'
    then: 'The hook exits 2. Its stderr holds `ratified: not done: <error>` and the advice to repeat the
      ledger lines once the cause is fixed, so the agent sees the error at the end of that reply.

      **＋** A Case of the reply that was not written when the error rose is written at the reply that
      repeats its ledger lines.

      **＋** A Case written before the error stays written, and the repeat replaces its section.

      **－** An error while the hook reads the payload exits 0 with the error on stderr. The hook cannot
      tell a re-fire at that point, and exit 2 could loop.

      **－** With `stop_hook_active` (the re-fire after a block), the hook exits 0 and writes nothing,
      so it cannot loop.

      **－** The guard `uv run guppi ratified --guard` keeps exit 0 with its line on stderr on its own
      error.

      **－** A refusal of the hook with no error keeps its own reason on stderr and its own exit.'
  spec: vault/raw/2026-09-30/2042/spec.md
  applied: '23:48:35'
- case: '555.1'
  decision: decision-case-555.1
  origin: raw/2026-09-30/2042/ledger.md#case-555.1
  targets:
  - kind: update
    category: rules
    slug: rule-case-check
    ref: rule-case-check
  - kind: create
    category: estimates
    slug: estimate-case-check-exits-2-on-an-error
    ref: rule-case-check
  tags:
  - hooks
  - harness
  - workflow
  case_text:
    recommend: "- **The Case check at the end of a reply**\n  Recommended: (a) block on its own error,\
      \ as the ledger hook does.\n  Answer: (a), agreed.\n- **The Case check when `case-guppi` answers**\n\
      \  Recommended: (a) keep it quiet on its own error, since a send-back would loop and the later refusal\
      \ keeps a faulty Case from the person.\n  Answer: (a). The person asked why, the main agent explained\
      \ it, and the person agreed with the recommendation."
    given: '`rule-case-check` — the rule of the check of a Case, on `SubagentStop` and on `Stop`

      **＋** `guppi/casecheck.py` — `run`, its handlers of an error, and the docstring

      **＋** `tests/test_casecheck.py` — the tests of the hook

      **＋** `estimate-case-check-exits-2-on-an-error` — the promise this sub-case creates

      **＋** `rule-ledger-write` — the ledger hook, whose handling of its own error this follows'
    when: 'The `Stop` hook `uv run guppi casecheck` fires, and an exception rises in `guppi/casecheck.py`
      after the hook has read the payload: while it reads the transcript, the event log or the store,
      or while it compares a shown Case or reads a sending.'
    then: '`guppi casecheck` exits 2. Its stderr holds `casecheck: not checked: <error>` and the advice
      to show the Case again once the cause is fixed, so the agent sees the error at the end of that reply.

      **＋** While the cause stands, `guppi casecheck` blocks with the same error at every `Stop`.

      **－** An empty or unreadable payload of `guppi casecheck` exits 0 with its line on stderr.

      **－** On the re-fire after a block (`stop_hook_active`), `guppi casecheck` exits 0 and compares
      nothing, so it cannot loop.

      **－** The run `uv run guppi casecheck --subagent` on `SubagentStop` keeps exit 0 with its error
      on stderr, since a send-back to `case-guppi` is not ended by `stop_hook_active` and would loop.

      **－** A refusal of `guppi casecheck` with no error keeps its own reason on stderr and its exit 2.'
    context: 'Three `Stop` hooks run after each reply of the main agent, beside the ledger hook and the
      Spec hook. `guppi casecheck` compares a shown Case with the answer of `case-guppi` that passed the
      checks. `guppi context` shows the person the size of the context window. `guppi onward` sends the
      agent from the end of Retro to `/handoff`. Each of the three wraps its whole run in one catch-all
      handler. When anything inside raises, the hook prints its error to stderr and exits 0. Claude Code
      does not show the agent the stderr of an exit 0, so nobody sees the error. For example, when the
      comparison of `guppi casecheck` raises, a Case that differs from the checked answer reaches the
      person unchecked, and nothing shows it. Case 552.4 gave the ledger hook exit 2 on its own error
      after the payload is read. Case 554 gave the `Stop` run of `guppi ratified` the same. This Case
      covers the other three hooks, one sub-case each, because each is its own rule and can fail and be
      fixed apart. `guppi casecheck` and `guppi onward` take exit 2. `guppi context` only informs, so
      it shows its error to the person in place of the size line and never blocks. Two more sub-cases
      add the exception of the hook''s own error to an existing promise that the change would make false.
      Case 555.4 does this for `guppi onward`, whose error now blocks a reply before Retro too. Case 555.5
      does it for `guppi context`, whose error now prints a line that does not open with the count. In
      555.4, the line of every other case and the line without a `hi` each gain the words "with no error
      of its own". In 555.5, the line of the size line gains the words "with no error of its own". The
      check of the answer notes such lines as not carried, and the change is on purpose. The other lines
      of both Criteria are carried as they stand. What this Case does not do: the `--subagent` run of
      `guppi casecheck` and the `--prompt` run of `guppi context` keep exit 0. The reason that the later
      `Stop` check gives, when an error of the `--subagent` run left no Case file, is not reworded. The
      main agent offered that rewording, and the person agreed to the recommendation without it. How the
      frame was read. `read_payload` of `guppi/event.py` catches its own errors and returns an empty payload.
      `read_records` of `guppi/ledger.py` returns nothing for a transcript it cannot read. So an error
      of `guppi context` rises only while it counts the tokens, and its page keeps its sentence that an
      unreadable transcript prints nothing. The three rule pages say nothing about a hook''s own error.
      Each sub-case adds that sentence at one anchor, and a Grep of `vault/wiki/` found each anchor once.
      For `rule-context-size`, the anchor is the end of its paragraph, after the page introduces `--prompt`.
      `rule-case-check` says the hooks never raise, and that stays true. A Grep of `vault/wiki/` for `rule-context-size|rule-retro-onward|guppi
      context|guppi onward`, with the hits under `decisions/` left aside, printed `brief.md`, `log.md`,
      `where-to-stop.md`, `rule-case-check`, `rule-context-size`, `rule-end-of-work`, `rule-harness`,
      `rule-hook-registry`, `rule-python-utf8`, `rule-retro`, `rule-where-to-stop`, `estimate-context-size-warns-past-the-limit`,
      `estimate-context-size-shown-after-each-reply`, `estimate-retro-onward-sends-the-agent-to-the-handoff`,
      `estimate-python-utf8-output-intact`, `estimate-page-read-cuts-the-history` and `lesson-bash-tool-python-cp1252-dash-shown-as-u-fffd`.
      The hits in `brief.md` and `log.md` were not read. Of the rest, only `estimate-retro-onward-sends-the-agent-to-the-handoff`
      and `estimate-context-size-shown-after-each-reply` state what a hook prints or how it exits in a
      way that its own error would make false, and Cases 555.4 and 555.5 replace their Criteria. `estimate-context-size-warns-past-the-limit`
      speaks of the text past the limit, which an error does not reach, so it stands. `rule-where-to-stop`
      and `where-to-stop.md` say that the hook lets a reply that opens with `STOP:` end. That stays true.
      The hook checks the first word before it reads any file, and even after an error the repeat run
      ends the reply. A Grep of `vault/wiki/` for `rule-case-check` or `casecheck` near "exit 0", "own
      error", "swallow" or "never raise" printed `brief.md`, two Decision pages, `rule-spec-reconcile`
      (about the guard) and a reading line of `estimate-case-check-notes-a-criterion-line-not-carried`.
      None of them speaks of the `Stop` run''s own error, so all of them stand. No test in `tests/test_casecheck.py`,
      `tests/test_context.py` or `tests/test_onward.py` covers the error path. The Criteria of the Estimates
      of `rule-case-check` speak of findings, the comparison and the re-fire, not of an error of the hook.
      The `purpose` of the two reworded Estimates speaks of what the hook does with no error, and is left
      as it is. The check of the answer noted `then` lines of the sub-cases that share most of their words.
      They share a shape because the three hooks take one pattern, but each line is a promise of a different
      hook, and each line names its hook. Every `create` carries a `ref`, so no query of the vault was
      run. A Glob found no page at the three new slugs.'
  parent: decision-case-555
  spec: vault/raw/2026-09-30/2042/spec.md
  applied: '23:48:35'
