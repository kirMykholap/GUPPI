- kind: create
  category: insights
  slug: insight-prespec-after-findings-loop-unruled
  origin: raw/2026-09-30/2042/ledger.md#L36
  fields:
    type: insight
    pattern: The rules of pre-spec stop at its report; no rule sets what follows its findings — how the
      Cases built again, the rounds and the main agent's own questions reach the person, and what a second
      run checks — so the main agent improvises the loop after the findings, and the person loses track
      of what to answer and of what a run costs.
    children:
    - lesson-prespec-findings-relayed-piecemeal-lose-the-person
    - lesson-prespec-second-run-dispatches-ask-guppi-again
  tags:
  - workflow
  - session
  sections:
    Pattern: 'Two lessons of session 2042 share one cause: the loop after the findings of /pre-spec has
      no rule. After the first run the main agent sent the findings to four case-guppi agents at once
      and relayed each answer as it came, so rounds, Cases built again and its own question spread over
      four replies (lesson-prespec-findings-relayed-piecemeal-lose-the-person). The second run dispatched
      ask-guppi over the whole plan again for eight minutes, with no word to the person first (lesson-prespec-second-run-dispatches-ask-guppi-again).'
    Proposal: 'A suggestion, not a decision: one rule for the loop after pre-spec findings — the Cases
      built again and the questions they raise shown to the person as one list of what to answer, and
      a second run of pre-spec that says what it checks (the whole plan or only the Cases built again)
      and its cost before it starts. The deferred rule-orchestration in the backlog is a possible home.'
  librarian: synthesis
  applied: '23:48:35'
