  case_text:
    context: '`case-guppi` builds every Case from the instruction in `.claude/agents/case-guppi.md`, which
      is rendered from `rule-case-build`. Three readings of that instruction failed in session 1736, and
      the handoff carried each one on as a fix to decide. First, `estimate-case-build-checks-the-finished-case`:
      at `/pre-spec`, `ask-guppi` found three faults the builder''s own check had missed. Case 547 widened
      the Frontier rule to cover the first reply of `/hi`, whose form `rule-skill-hi` sets. The builder''s
      Grep for `Frontier` over `.claude/` printed `.claude/skills/hi/SKILL.md`, but only its passage on
      a later reply was judged, and the summary line of `rule-skill-hi` says nothing about the Frontier.
      Case 548 said a Grep found only the page and `brief.md`, while it printed `brief.md`, `log.md` and
      `rule-decisions-schema`. Case 552 listed the hits of `parse_line` without three of them. Second,
      `estimate-case-build-records-the-rounds-in-recommend`: the item of Case 549 on how the texts state
      the condition kept its first recommendation after the next question settled it the other way, which
      goes against the rule that asks for the latest one. Third, `estimate-case-build-writes-a-plain-round`:
      the sentence on what a first round decides ran parallel clauses inside one sentence on Cases 548
      and 550, and the Context of Case 547 named five examples in one sentence. `.claude/skills/grill-me/SKILL.md`
      sets such a series one item per line. Case 551 put `rule-case-build` off over that third fault,
      so the page carries `deferred_by` and stands in `backlog.md`. The Frontier of this session names
      the three faults as its items C4, C6 and C9, and the person took all three into this Case. Its sub-case
      557.3 decides the fault of Case 551 and carries `{supersedes:case 551}`, so the defer is retired
      and the page leaves the backlog. The Frontier lines come from the brief, not the backlog, so the
      check of `rule-case-check` on backlog lines does not apply. The rule stands `draft`.

      The Case was ratified, then built again after each of two reports of `ask-guppi` at `/pre-spec`.
      The first report raised four points. The new text of 557.1 had dropped the clause that a claim of
      `context` names the search it rests on, while its `then` kept it. The text now keeps it. The new
      text of 557.3 wrote a list shape of its own, against the line of `estimate-case-build-writes-a-plain-round`
      that asks the instruction to point each list to `.claude/skills/grill-me/SKILL.md` and word no shape
      of its own. The person chose to have the text name the two places and point to the template for
      the shape. `estimate-case-check-requires-each-question-of-the-rounds` asks that every question title
      of the rounds have an item in `recommend`, but 557.2 gave an item only to an answered question.
      The person chose that a question never answered still gets one item that says so, so that promise
      stands and is named in 557.2. The count of **＋** lines in the new Criterion of 557.1 was corrected.
      The second report found two more points. The `then` of 557.3 set every series of examples as a list,
      which is wider than `estimate-skill-grill-me-asks-in-rounds`, where a short series of words inside
      a sentence stays in it. That Estimate now stands in the `given` of 557.3, and the `then` says a
      series falls under the template''s list rule like any other series. The text also said "when it
      has two or more parts", while the same paragraph already uses "part" for the parts of the Context.
      It now says "when it names two or more decisions". The second point was the list of hits of one
      Grep below, which had left out `entity-glossary`.

      This Case holds only `update` items, so no vault query ran. It adds no hook and changes no code.
      The hook of `rule-case-check` reads only the bold title of each `recommend` item, by `recommend_titles`
      in `guppi/casecheck.py`, which reads the top level of the list. So the sub-items that 557.2 sets
      need no old form in any reader. `tests/test_casecheck.py`, `tests/test_ratified.py` and `tests/test_generate.py`
      already write `Recommended:` and `Answer:` as sub-items. All five Estimates of `rule-case-build`
      were read. Two have their Criterion replaced whole. The new Criterion of 557.1 carries each old
      line word for word and adds two, so it holds seven **＋** lines. The new Criterion of 557.2 rewrites
      its first line and drops the line on the latest recommendation, as the person''s choice sets, and
      carries its other lines word for word. `estimate-case-build-writes-a-plain-round` asks for a list
      one item per line in the Context, and for an instruction that points to the template, which the
      new text of 557.3 does. So it stands, stays `failed` until a reading after the render, and leaves
      what counts as a list to `estimate-skill-grill-me-asks-in-rounds`, which also stands. `estimate-case-build-writes-the-case`
      says the Context is one prose paragraph. That stays true, because a list inside it has been allowed
      since case 512. `estimate-case-build-keeps-the-old-form-until-the-writer-is-live` speaks of readers
      in code and is not touched.

      Searches, outside `vault/raw/` and `vault/archive/`. A Grep for `Recommended:|both the latest|the
      latest recommendation|latest answer` printed 20 files: `case-schema.md`, `decisions/schema.yaml`,
      `.claude/agents/case-guppi.md`, `log.md`, nine Decision pages from `decision-case-547` to `decision-case-552.4`,
