  ref: rule-spec-write
  category: rules
  replace:
  - old: a Case N none of them holds is no refusal (case 441).
    new: 'a Case N none of them holds is no refusal (case 441). An error of the hook itself after it has
      read the payload — an exception while it reads the transcript, the store, the plan file or `spec.md`,
      or writes, removes or checks a Case — exits 2 with `ratified: not done: <error>` and the advice
      to repeat the ledger lines once the cause is fixed on stderr, so the agent sees it at the end of
      that reply; a Case not yet written is written at the reply that repeats its lines, and one written
      before the error stays and is replaced then. An error while it reads the payload exits 0 with the
      error on stderr, since the hook cannot tell a re-fire then; the guard of `rule-spec-reconcile` keeps
      exit 0 on its own error (case 554).'
  change: the Stop hook exits 2 on its own error after the payload is read, and 0 on an error while it
    reads the payload (case 554)
  applied: '23:48:35'
- line: 2
  text: decision[case 554][create][estimate-spec-write-exits-2-on-an-error]{ref:rule-spec-write}{tags:hooks,harness,workflow}
  case: '554'
  kind: create
  slug: estimate-spec-write-exits-2-on-an-error
  origin: raw/2026-09-30/2042/ledger.md#case-554
  decision: decision-case-554
  ref: rule-spec-write
  tags:
  - hooks
  - harness
  - workflow
  category: estimates
  fields:
    kind: QA
    purpose: Whether the Spec hook exits 2 with the error on stderr when its Stop run raises after reading
      the payload, and exits 0 on an error while reading the payload, on the re-fire and in the guard
    method: uv run pytest tests/test_ratified.py — piped payloads, a function of the hook patched to raise
    tags:
    - hooks
    - harness
    - workflow
    type: estimate
  sections:
    Criterion: 'When:

      The `Stop` hook `uv run guppi ratified` fires, and an exception rises in `guppi/ratified.py` after
      the hook has read the payload: while it reads the transcript, the store, the plan file or `spec.md`,
      or while it writes, removes or checks a Case.


      Then:

      The hook exits 2. Its stderr holds `ratified: not done: <error>` and the advice to repeat the ledger
      lines once the cause is fixed, so the agent sees the error at the end of that reply.

      **＋** A Case of the reply that was not written when the error rose is written at the reply that
      repeats its ledger lines.

      **＋** A Case written before the error stays written, and the repeat replaces its section.

      **－** An error while the hook reads the payload exits 0 with the error on stderr. The hook cannot
      tell a re-fire at that point, and exit 2 could loop.

      **－** With `stop_hook_active` (the re-fire after a block), the hook exits 0 and writes nothing,
      so it cannot loop.

      **－** The guard `uv run guppi ratified --guard` keeps exit 0 with its line on stderr on its own
      error.

      **－** A refusal of the hook with no error keeps its own reason on stderr and its own exit.'
  applied: '23:48:35'
