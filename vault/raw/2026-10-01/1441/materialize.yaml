  sections:
    Criterion: 'When:

      `case-guppi`, with `.claude/agents/case-guppi.md` rendered from `rule-case-build`, has built a Case
      and is about to answer with it.


      Then:

      It puts each option the person chose in its rounds, or the person''s own words where they answered
      outside the options, beside the `then` and `recommend` of the Case, and the Case holds each one;
      where the frame shows after a round that a chosen option cannot hold as written, its answer is a
      round on that point, not a Case with another behaviour.

      **＋** For each page whose text the change makes false, it searches the live pages of the vault,
      leaving out the Decision pages, and the code, for the page''s slug, and reads each hit that `given`
      does not name around the line of the hit; for a fact that no slug marks, it reads the index lines
      of the recipe of `.claude/agents/ask-guppi.md` and judges them by meaning.

      **＋** When the change sets what happens at a moment — a reply, a hook event, a command — it searches
      `vault/wiki/rules/` and `.claude/` for the words that name that moment, reads each passage of each
      hit that sets a form or a behaviour at that moment, and the Case either does not cover that moment
      or names the other rule in `given`.

      **＋** It reads the case file `raw/<date>/<hi HHMM>/cases/case-<N>.md` of each Case of the session
      that the prompt of its call names, and no other Case of the session; where that Case changes a page
      the Case changes or sets what happens at the same moment, the Case does not cover that moment or
      names the case file in `given`, and its new text of that page does not contradict the text of that
      Case.

      **＋** When the Case replaces the Criterion of an Estimate, it reads the `purpose` and `method` of
      that Estimate, and the same `update` sets anew each one that states the old promise.

      **＋** Each hit that the change makes false enters the Case, or its `context` says why it stands.

      **＋** A claim of `context` about a text names the search it rests on: its pattern, the paths it
      ran over, and each file the search printed, a file it does not read included, or the count it printed;
      it claims nothing the search did not print.

      **＋** It reads side by side the finished new texts of all its sub-cases that change one page, and
      the Case holds no contradiction between them.

      **－** A hit in a History line, in `log.md` or in `brief.md` is not read.'
