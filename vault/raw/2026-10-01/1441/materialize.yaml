      `user` record whose `origin.kind` is `human` (records 524, 657). The other four hooks keep the flag
      as their guard: the size line is a small loss, and `ratified` and `casecheck` have nothing to do
      at the end of Retro, since a Case is ratified only by a message of the person, which clears the
      flag. `guppi onward --plan` keeps its guard too, and `rule-prespec-onward` and `estimate-prespec-onward-sends-the-agent-on`
      stand. The docstring of `guppi/casecheck.py` says that a refusal of a `Stop` hook adds no `user`
      record (measured 2026-09-27). The transcript of 1237 shows that it adds one, marked `isMeta`. Its
      judgment skips records marked `isMeta`, so its behaviour stands and this Case leaves it alone. The
      stale sentence is a note for the handoff. Each sub-case replaces the Criterion of one Estimate whose
      Criterion speaks of the flag: two of `rule-retro-onward` and six of `rule-ledger-write`. The four
      refusal Estimates of the ledger said that with the flag set the hook judges no line, and that sentence
      becomes false. The check of the answer noted Criterion lines that the new Criteria do not carry,
      and each change is on purpose. Each line that named the flag or the re-fire is rewritten for the
      stretch. The line on errors of `guppi onward` now names the transcript among its reads. The When
      of `estimate-ledger-write-lifts` says "a reply" in place of "a turn", since the hook fires at the
      end of each reply. Its four lines on the refusals are folded into one line that names `rule-ledger-write`,
      because each refusal has its own Estimate. In `estimate-ledger-write-exits-2-on-an-error`, four
      lines are rewritten for the stretch: the error coming back, an error while the hook reads the payload,
