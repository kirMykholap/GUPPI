  tags: []
  case_text:
    given: '`rule-retro-onward` — the rule of the hook that sends the agent from Retro to `/handoff`

      **＋** `estimate-retro-onward-sends-the-agent-to-the-handoff` — the promise whose Criterion this
      sub-case replaces

      **＋** `guppi/onward.py` — the hook

      **＋** `guppi/ledger.py` — the module that holds the one judgment of the stretch and of a hook''s
      own refusal

      **＋** `tests/test_onward.py` — the tests of the hook

      **＋** `.claude/settings.json` — the registration of the hook on `Stop`

      **＋** `vault/wiki/where-to-stop.md` — the conditions under which the agent stops for the person

      **＋** `raw/<date>/<hi HHMM>/handoff.md` — the file whose presence ends the hook''s work'
    when: The `Stop` hook `uv run guppi onward` receives the payload of the end of a reply of the main
      agent.
    then: 'It exits 2 when the event log of the session''s window holds the mark `retro` of this session,
      `raw/<date>/<hi HHMM>/handoff.md` does not stand, the reply that ended does not open with `STOP:`,
      and its own refusal does not stand in the stretch.

      **＋** The stretch is the records of the transcript at `transcript_path` after the last `user` record
      whose `origin.kind` is `human`. Its own refusal is a `user` record marked `isMeta` whose text opens
      with `Stop hook feedback:` and holds a line that opens with `[uv run guppi onward]: `.

      **＋** A refusal of another `Stop` hook in the stretch does not silence it, and neither does `stop_hook_active`.

      **＋** Its reason on stderr tells the agent to commit the session folder and call `/handoff`, and,
      when a condition of `vault/wiki/where-to-stop.md` holds, to open its reply with `STOP:` and ask
      the person instead.

      **＋** In every other case with no error of its own it exits 0 and prints nothing: before the mark
      `retro`, once `handoff.md` stands, once its own refusal stands in the stretch, on a reply that opens
      with `STOP:`, and with `stop_hook_active` set when it cannot read the transcript.

      **＋** It judges the stretch and its own refusal by the one function of `guppi/ledger.py` that the
      ledger hook calls.

      **＋** `.claude/settings.json` registers it on `Stop`, after `uv run guppi ledger`, `uv run guppi
      ratified`, `uv run guppi casecheck` and `uv run guppi context`.

      **－** It counts nothing, reads no test result and calls no model: its judgment is the mark, the
      file, its own refusal in the transcript and the first word of the reply.

      **－** Without a `hi` of the session in the event log, and with no error of its own, it exits 0.

      **－** It writes no file and no mark.

      **－** `uv run guppi onward --plan` keeps `stop_hook_active` as its guard.'
    context: 'Six checks run each time a reply of the main agent ends. They are the `Stop` hooks of `.claude/settings.json`:
      `guppi ledger`, `guppi ratified`, `guppi casecheck`, `guppi context`, `guppi onward` and `guppi
      onward --plan`. Claude Code gives each one the flag `stop_hook_active`. Each of the six returns
      at once when the flag is set, so that it cannot send the agent back again and again. The design
      read the flag as marking only the one reply after a refusal. The transcript of session 1237 (`dd5dac5e`)
      shows otherwise: the flag stays set until the person writes again. In record 529, `guppi onward
      --plan` refused the end of the reply that acknowledged the re-ratification of 567 and 569, and sent
      the agent on. In the same stretch, with no `user` record of `origin.kind` `human` until record 657,
      the agent left Plan Mode, ran `/work` and ended Retro. At the `Stop` of record 654, after the reply
      that ended Retro, all six hooks ran in about half a second each with no output (`hasOutput` false).
      So the ledger wrote none of the fourteen readings, no size line showed, and `guppi onward` did not
      send the agent to `/handoff`. The person had to ask what comes next. The readings landed at the
      next `Stop`, after the person''s message, and needed a second commit (`a9e58997`). The two other
      `Stop` records of that session with `hasOutput` false, 490 and 735, also follow a refusal of a `Stop`
      hook in the same stretch (records 457 and 700). The transcript does not hold the flag itself. The
      person took the transcript as enough evidence, and the live readings below confirm the fix. No lesson
      page records this behaviour of the flag. The person chose to fix the two checks on the path from
      Retro to `/handoff`, `guppi onward` and `guppi ledger`. Neither trusts the flag any more. Each judges
      by its own refusal in the stretch, which runs from the person''s last message to now. `guppi onward`
      exits 2 at most once in a stretch. The ledger writes and judges its lines whatever the flag says,
      since it never writes a line twice. `/pre-spec` found that a ledger refusal limited to once a stretch
      would lose a second faulty line of the same stretch without a word. The person chose that the ledger
      tells each refused line once in a stretch: it prints the stderr line of a refused line of the reply
      just finished only when that line does not already stand in its own refusals of the stretch. A repeat
      of the same faulty line stays silent, so the hook cannot loop. No `hi` and an error of its own stay
      once a stretch. The shape of the transcript records rests on the same transcript, on Claude Code
      2.1.282. A refusal is a `user` record marked `isMeta`, its text opening with `Stop hook feedback:`
      and holding a line `[<command>]: <stderr>` (records 457, 529, 700). A message of the person is a
      `user` record whose `origin.kind` is `human` (records 524, 657). The other four hooks keep the flag
      as their guard: the size line is a small loss, and `ratified` and `casecheck` have nothing to do
      at the end of Retro, since a Case is ratified only by a message of the person, which clears the
      flag. `guppi onward --plan` keeps its guard too, and `rule-prespec-onward` and `estimate-prespec-onward-sends-the-agent-on`
      stand. The docstring of `guppi/casecheck.py` says that a refusal of a `Stop` hook adds no `user`
      record (measured 2026-09-27). The transcript of 1237 shows that it adds one, marked `isMeta`. Its
      judgment skips records marked `isMeta`, so its behaviour stands and this Case leaves it alone. The
      stale sentence is a note for the handoff. Each sub-case replaces the Criterion of one Estimate whose
      Criterion speaks of the flag: two of `rule-retro-onward` and six of `rule-ledger-write`. The four
      refusal Estimates of the ledger said that with the flag set the hook judges no line, and that sentence
      becomes false. The check of the answer noted Criterion lines that the new Criteria do not carry,
      and each change is on purpose. Each line that named the flag or the re-fire is rewritten for the
      stretch. The line on errors of `guppi onward` now names the transcript among its reads. The When
      of `estimate-ledger-write-lifts` says "a reply" in place of "a turn", since the hook fires at the
      end of each reply. Its four lines on the refusals are folded into one line that names `rule-ledger-write`,
      because each refusal has its own Estimate. In `estimate-ledger-write-exits-2-on-an-error`, four
      lines are rewritten for the stretch: the error coming back, an error while the hook reads the payload,
      the re-fire, and a refusal with no error. The check also noted that sibling sub-cases share lines.
      That is on purpose too: each Estimate must read alone. So the definition of the stretch stands in
      both hooks'' Criteria, and the lines on silence and errors promise the same thing of each hook.
      The lines on a missing `hi` and the lines common to the four refusals also stand in each Criterion
      that needs them. `/pre-spec` also found two sentences of the rule pages that the change leaves stale,
      and each now has its own pair. 577.4 rewords the sentence of `rule-ledger-write` on an error while
      the hook reads the payload, which still spoke of a re-fire. 577.2 adds the transcript to the reads
      that `rule-retro-onward` lists for an error of the hook. `estimate-retro-runs-on-to-the-handoff`
      already promises that the agent commits the session folder and calls `/handoff` after the reply
      that ends Retro, in the same turn. This Case makes that hold after a long stretch, so its Criterion
      stands, and its pending reading checks the change too. No page is created, so no vault query was
      run. The rule texts change at the librarian''s run and the code in Work Mode. No reader refuses
      a text in between, since the hooks read only Claude Code''s transcript, so no old form is kept.
      Searches follow. A Grep for `stop_hook_active|re-fire|once a turn|follows a refusal` over `vault/wiki/rules/`,
      `vault/wiki/*.md`, `.claude/`, `guppi/`, `tests/` and `CLAUDE.md` printed 17 files: `tests/test_casecheck.py`,
      `log.md`, `rule-case-check`, `rule-context-size`, `guppi/ledger.py`, `guppi/context.py`, `guppi/casecheck.py`,
      `guppi/ratified.py`, `guppi/onward.py`, `rule-ledger-write`, `tests/test_ratified.py`, `rule-prespec-onward`,
      `tests/test_onward.py`, `tests/test_ledger.py`, `rule-retro-onward`, `rule-spec-write` and `tests/test_context.py`.
      The hits in `rule-case-check`, `rule-context-size`, `rule-spec-write`, `rule-prespec-onward` and
      their code and tests describe the hooks that keep the flag, so they stand. A Grep for `stop_hook_active|re-fire|refusal
      of a .Stop. hook` over the Estimates of `rule-ledger-write` and `rule-retro-onward` printed the
      eight Estimates this Case replaces. A Grep for `guppi onward|rule-retro-onward|fires at most` over
      `vault/wiki/` printed 20 files: `brief.md`, `log.md`, `where-to-stop.md`, `rule-where-to-stop`,
      `rule-end-of-work`, `rule-hook-registry`, `rule-retro`, `rule-retro-onward`, `rule-prespec-onward`,
      `estimate-retro-onward-sends-the-agent-to-the-handoff`, `estimate-retro-onward-exits-2-on-an-error`,
      `estimate-retro-runs-on-to-the-handoff`, `estimate-prespec-onward-sends-the-agent-on`, `estimate-case-protocol-defers-in-one-reply`,
      `estimate-python-utf8-output-intact`, `estimate-where-to-stop-stops-only-on-its-conditions`, `decision-case-531.9`,
      `decision-case-555`, `decision-case-555.3` and `decision-case-575`; the decision pages were not
      opened. In `rule-where-to-stop` and `where-to-stop.md`, a reply that opens with `STOP:` still ends.
      The hit in `rule-retro`, that the hook sends the agent on after the reply that ends Retro, becomes
      true after a long stretch. `rule-hook-registry` and `rule-end-of-work` name only the registration
      and the child, which do not change. The hits in the three other Estimates stand in their Results.
      A Grep for `guppi onward|fires at most` over `.claude/skills/` printed nothing.'
