  sections:
    Criterion: 'When:

      The `Stop` hook `uv run guppi ledger` finds a fresh `estimate[<slug>]` line in a `LEDGER` block
      of the session, and a decision line `create` or `update` of `<slug>` stands in the session''s ledger
      or among the lines the hook writes on the same `Stop`.


      Then:

      The line is not written: what a session changes, it does not measure, and the reading of `<slug>`
      waits for a later session.

      **＋** A reading of the old slug of a page that an `update` of this session renames is refused by
      the same rule: the decision line names the old slug.

      **＋** The other lines of the `Stop` are written as before.

      **＋** When the refused line stands in the reply just finished, the hook exits 2 with one stderr
      line per refused line: "ledger: estimate[<slug>] not written — case N creates or updates <slug>
      in this session; what a session changes it does not measure: take the reading in a later session
      and name it in the handoff."

      **＋** A refused line of an earlier text of the transcript is skipped at every later `Stop` without
      a word.

      **－** A reading of a slug that no decision line `create` or `update` of this session names is written
      as before; a `defer` line of the slug does not refuse it.

      **－** Without a `hi` the hook judges no line. With `stop_hook_active` set it judges the line the
      same, and its stderr line is told once a stretch, as `estimate-ledger-write-lifts` sets it.'
  applied: '17:15:02'
