  sections:
    Criterion: 'When:

      The `Stop` hook `uv run guppi onward` fires, and an exception rises in `guppi/onward.py` after the
      hook has read the payload: while it reads the reply, the session folder, the event log or the transcript.


      Then:

      `guppi onward` exits 2. Its stderr holds `onward: not checked: <error>` and the advice: if Retro
      has ended and `handoff.md` does not stand, commit the session folder and call `/handoff`.

      **＋** While the cause stands, `guppi onward` blocks with the same error at the first `Stop` of each
      stretch of the session, before Retro too.

      **－** An empty payload of `guppi onward` exits 0 with nothing on stderr.

      **－** It exits 0 and prints nothing when its own refusal stands in the stretch, as `estimate-retro-onward-sends-the-agent-to-the-handoff`
      judges it, or when `stop_hook_active` is set and it cannot tell whether one stands, so it fires
      at most once a stretch.

      **－** With no error, `guppi onward` exits 2 or 0 by its own judgment, as before.'
  applied: '17:15:02'
