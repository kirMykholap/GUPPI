      \ `rule-case-build`, `rule-prespec` and `rule-skill-wait-what`. The same Grep over `.claude/` printed\
      \ `.claude/agents/case-guppi.md`, `.claude/skills/wait-what/SKILL.md` and `.claude/skills/pre-spec/SKILL.md`.\n\
      - A Grep of `(?i)runs in one turn|in one turn` over the repository, leaving out `vault/raw/` and\
      \ `vault/archive/`, printed these files:\n  - `vault/wiki/where-to-stop.md`\n  - `.claude/skills/work/SKILL.md`\n\
      \  - `guppi/casecheck.py`\n  - `rule-case-check`\n  - `log.md`\n  - `rule-work-mode`\n  - `rule-where-to-stop`\n\
      \  - `estimate-case-check-refuses-text-before-a-round`\n  - `estimate-work-mode-takes-the-work-readings`\n\
