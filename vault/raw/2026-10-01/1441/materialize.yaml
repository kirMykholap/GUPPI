      **＋** `guppi/onward.py` — the other hook that calls the judgment

      **＋** `tests/test_ledger.py` — the tests of the hook

      **＋** `raw/<hi date>/<hi HHMM>/ledger.md` — the session''s ledger, which the hook appends to'
