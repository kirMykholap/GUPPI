      the hook reads the payload, which still spoke of a re-fire. 577.2 adds the transcript to the reads
      that `rule-retro-onward` lists for an error of the hook. `estimate-retro-runs-on-to-the-handoff`
      already promises that the agent commits the session folder and calls `/handoff` after the reply
      that ends Retro, in the same turn. This Case makes that hold after a long stretch, so its Criterion
      stands, and its pending reading checks the change too. No page is created, so no vault query was
      run. The rule texts change at the librarian''s run and the code in Work Mode. No reader refuses
      a text in between, since the hooks read only Claude Code''s transcript, so no old form is kept.
      Searches follow. A Grep for `stop_hook_active|re-fire|once a turn|follows a refusal` over `vault/wiki/rules/`,
      `vault/wiki/*.md`, `.claude/`, `guppi/`, `tests/` and `CLAUDE.md` printed 17 files: `tests/test_casecheck.py`,
      `log.md`, `rule-case-check`, `rule-context-size`, `guppi/ledger.py`, `guppi/context.py`, `guppi/casecheck.py`,
      `guppi/ratified.py`, `guppi/onward.py`, `rule-ledger-write`, `tests/test_ratified.py`, `rule-prespec-onward`,
      `tests/test_onward.py`, `tests/test_ledger.py`, `rule-retro-onward`, `rule-spec-write` and `tests/test_context.py`.
      The hits in `rule-case-check`, `rule-context-size`, `rule-spec-write`, `rule-prespec-onward` and
      their code and tests describe the hooks that keep the flag, so they stand. A Grep for `stop_hook_active|re-fire|refusal
      of a .Stop. hook` over the Estimates of `rule-ledger-write` and `rule-retro-onward` printed the
