  case_text:
    context: "This Case is Case 580 built again under a new id, its content unchanged. Case 580 was first\
      \ ratified with no sub-cases, then ratified again as 580.1 and 580.2. The plan file kept the old\
      \ body of 580 beside the two sub-cases. So `guppi prespec --check` found the `replace` of `rule-prespec`\
      \ and the Criterion of `estimate-prespec-gathers-the-answers-after-findings` signed twice. Per `rule-spec-write`,\
      \ a decision line that carries `{supersedes:case N}` removes the section of Case N, with its sub-cases,\
      \ from the plan file and from `spec.md`. So 581.1 carries `{supersedes:case 580}` and `{supersedes:case\
      \ 580.1}`, and 581.2 carries `{supersedes:case 580.2}`. Each Case superseded has its own block,\
      \ which retires all three sets of ledger lines. The Frontier line that Case 580 closed is closed\
      \ again by this Case.\n\nAfter `/pre-spec` reports findings, the main agent sends each fix to the\
      \ `case-guppi` that built the Case. It waits until every answer is back, then shows the person one\
      \ gathered list. Step 2 of the loop in `rule-prespec`, rendered into `.claude/skills/pre-spec/SKILL.md`,\
      \ forbids any text in the chat while an answer is still out. An answer to `SendMessage` does not\
      \ come back inside the turn, though. It arrives later as a notice, and that notice opens a turn\
      \ of its own, as `lesson-sendmessage-answers-open-a-turn-of-their-own` records. Every turn ends\
      \ with a reply. So the reading of `estimate-prespec-gathers-the-answers-after-findings` in session\
      \ 1237, ledger line 37, failed: the main agent wrote in the chat twice while answers were out. Once\
      \ was at the end of the turn that sent the fixes. The other was in the turn opened by the answer\
      \ for 567, while the answer for 569 was still out. The handoff of that session asked whether the\
      \ clause should allow one short line per such turn.\n\nThe person chose three things. First, one\
      \ short line closes each turn that sends to a `case-guppi` and each turn an answer opens while another\
      \ answer is still out. The line names the Cases that have answered and the Cases still out, and\
      \ holds nothing of an answer and no question. Second, the line opens with a fixed bold label that\
      \ ends in a colon. Third, only the loop after the findings changes. The label matters because of\
      \ `uv run guppi casecheck` on `Stop`. After `/pre-spec`, when the turn brought back a round of questions,\
      \ it refuses a reply whose first line opens neither with `❓ ` nor with a bold label that ends in\
      \ a colon. The pattern `LABEL_LINE` in `guppi/casecheck.py` accepts any such label. So if one answer\
      \ brings a round while another answer is still out, a plain waiting line would be refused, and the\
      \ labelled line passes with no change to the logic of the check. Session 1237 brought back no round\
      \ in the loop, so this was not seen live.\n\n`/pre-spec` then found that the same check states a\
      \ false reason for its exemption after `/pre-spec`. It says that the loop after the findings runs\
      \ in one turn. This Case puts the opposite into the skill. The reason stands in three places:\n\
      - the passage of `rule-case-check` on how a round opens\n- the module docstring of `guppi/casecheck.py`\
      \ and the docstring of its function `round_opening`\n- the `－` line on the exemption after `/pre-spec`\
      \ in the Criterion of `estimate-case-check-refuses-text-before-a-round`\n\nThe person chose to correct\
      \ the reason in all three with the behaviour unchanged. That is 581.2. A promise changes only whole,\
      \ so 581.2 replaces that Criterion whole and sets the Estimate `pending`. Its `purpose` and `method`\
      \ do not state the reason, so they stand. The change to `guppi/casecheck.py` is to its docstrings\
      \ only, so the person's choice of no code change still holds for the logic. 581.1 changes `rule-prespec`\
      \ and replaces the Criterion of `estimate-prespec-gathers-the-answers-after-findings` whole. 581.1\
      \ also sets a new `purpose`, because the old one says the agent stays quiet, and a new `method`,\
      \ so that the reading looks for refusals of `guppi casecheck` in the loop.\n\nThe check of the answer\
      \ noted lines of the old Criteria that are not carried word for word. All of these changes are on\
      \ purpose:\n- The `when` of 581.1 now also names `.claude/skills/pre-spec/SKILL.md`, rendered from\
      \ `rule-prespec`. The trigger is the same.\n- In 581.1, the line that the agent writes nothing in\
      \ the chat while an answer is out is the promise this Case changes. It becomes the two lines on\
      \ the labelled waiting line and on what that line may hold. Its clause that no answer of one `case-guppi`\
      \ is passed on alone is kept.\n- In 581.2, only the `－` line on the exemption after `/pre-spec`\
      \ changes: its reason. Every other line is carried word for word.\n\nFrame. These searches back\
      \ the claims above:\n- A Grep of `(?i)notification|while an answer|answers? (is|are) (still )?out|write\
      \ nothing in the chat` over `vault/wiki/`, leaving out `decisions/`, printed `rule-prespec`, `brief.md`,\
      \ `lesson-sendmessage-answers-open-a-turn-of-their-own` and `estimate-prespec-gathers-the-answers-after-findings`.\
      \ The `brief.md` hit is not read.\n- A Grep of `(?i)notification|while an answer|write nothing in\
      \ the chat` over `.claude/` printed only `.claude/skills/pre-spec/SKILL.md`, which the render rewrites.\n\
      - A Grep of `SendMessage` over `vault/wiki/rules/` printed `rule-case-protocol`, `rule-case-check`,\
      \ `rule-case-build`, `rule-prespec` and `rule-skill-wait-what`. The same Grep over `.claude/` printed\
      \ `.claude/agents/case-guppi.md`, `.claude/skills/wait-what/SKILL.md` and `.claude/skills/pre-spec/SKILL.md`.\n\
      - A Grep of `(?i)runs in one turn|in one turn` over the repository, leaving out `vault/raw/` and\
      \ `vault/archive/`, printed these files:\n  - `vault/wiki/where-to-stop.md`\n  - `.claude/skills/work/SKILL.md`\n\
      \  - `guppi/casecheck.py`\n  - `rule-case-check`\n  - `log.md`\n  - `rule-work-mode`\n  - `rule-where-to-stop`\n\
      \  - `estimate-case-check-refuses-text-before-a-round`\n  - `estimate-work-mode-takes-the-work-readings`\n\
      \  - `decision-case-562`\n- A Grep of `(?i)in the chat|SendMessage|loop` over the Estimates `estimate-prespec-*`\
      \ printed three files: the target, `estimate-prespec-reconciles` and `estimate-prespec-notes-a-long-chain`.\n\
      \nWhat the hits mean:\n- Of the `SendMessage` hits, the `rule-case-protocol` passage on who builds\
      \ a Case sets what goes by `SendMessage`, not what the agent writes while it waits. `rule-skill-wait-what`\
      \ uses `SendMessage` to ask for a fact. `rule-case-build` and its render describe how `case-guppi`\
      \ is asked again. None of them sets a form for the waiting reply. The `rule-case-check` hit is the\
      \ passage that 581.2 corrects.\n- Of the one-turn hits, the Work Mode files speak of the run from\
      \ `/work` to the handoff, another moment. `log.md` is not read, and the Decision page is history.\n\
      - Of the Estimates, `estimate-prespec-reconciles` speaks of sending a finding to its `case-guppi`,\
      \ and `estimate-prespec-notes-a-long-chain` speaks of a one-line answer to a `note:` line. Neither\
      \ speaks of what is written while an answer is out, so both stand.\n- `case-schema.md` says the\
      \ Cases built again in the loop go out together and come back together. That stays true.\n\nThe\
      \ comparison of `guppi casecheck` judges only a reply that shows a Case heading, and the waiting\
      \ line shows none. That reply also carries no `LEDGER` block, so the hooks that Case 577 changes\
      \ do not act on it. Case 579 sets the dispatch prompt, which this Case does not touch.\n\nNo code\
      \ reads the changed texts, so no old form is kept. Not done here: waits on a `case-guppi` outside\
      \ this loop, where no rule sets anything. `insight-prespec-after-findings-loop-unruled` stays open."
