  change: the Criterion replaced whole — the open W lines are folded into one line that lists their ids;
    each other open line stands on its own line (case 578.2)
  sections:
    Criterion: 'When:

      The person ratifies a Case, or ratifies again a Case shown again after its ratification, and the
      agent writes the reply that acknowledges it, with `vault/wiki/case-schema.md` rendered from `rule-case-protocol`.


      Then:

      The reply has four parts, in this order. First, the `LEDGER` block. Second, the heading `## Case
      N — ratified` and a paragraph `Changes:` that says what changes, in one or two sentences. Third,
      a paragraph `Notes:` with facts that did not enter the Case, left out when there are none. Last,
      the heading `## Frontier` and the lines of `raw/<date>/<hi HHMM>/frontier.md` as a checklist.

      **＋** In the checklist the closed lines are folded into one line, and the lines put off stand as
      `[-] … · sprint · defer`, `[-] … · backlog · kept` or `[-] … · defer case N`.

      **＋** The open `W` lines are folded into one line that lists their ids, and each other open line
      stands on its own line with a short title.

      **＋** While a line under `## Cases` is open, the question which item is next ends the reply; when
      none is open, the reply ends with the Frontier and asks nothing, and the hook of `rule-prespec-onward`
      sends the agent on.

      **＋** For a Case with sub-cases, one reply acknowledges every sub-case ratified: one `LEDGER` block
      with all their lines, one heading `## Case N — ratified` that names the ids, one Frontier.

      **＋** The reply that acknowledges a re-ratification carries the `LEDGER` block with the decision
      lines of each Case ratified again, as at its first ratification.

      **＋** The headings and labels are in the language of the chat.

      **＋** No tool call follows the `LEDGER` block in the same reply.

      **－** The ledger hook of `rule-ledger-write` does not append a repeated decision line a second time.

      **－** When a `Stop` hook other than the ledger hook of `rule-ledger-write` refuses the reply with
      exit 2, the agent''s answer to the refusal is a reply of its own and may call tools. The `LEDGER`
      block stands written.'
  applied: '17:15:02'
