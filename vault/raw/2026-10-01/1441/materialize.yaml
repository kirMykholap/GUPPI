    purpose: Whether guppi onward refuses the end of a reply after the retro mark while handoff.md does
      not stand, once a stretch by its own refusal in the transcript whatever stop_hook_active says, not
      on a reply that opens with STOP:, and is silent otherwise, counting nothing
    method: 'uv run pytest tests/test_onward.py; by hand at the first end of Retro after the render that
