  sections:
    Criterion: 'When:

      `/pre-spec` has reported findings in Cases of the plan, and the main agent sends them to the `case-guppi`
      of those Cases, with `.claude/skills/pre-spec/SKILL.md` rendered from `rule-prespec`.


      Then:

      The main agent sends each finding in a Case that needs no word of the person to the `case-guppi`
      of that Case by `SendMessage`, all of them in one message, and holds back a finding whose fix waits
      for the person''s answer.

      **＋** It ends each turn that sends to a `case-guppi`, and each turn that an answer opens while another
      answer it sent is still out, with one line that opens with a bold label ending in a colon and names
      the Cases that have answered and the Cases still out.

      **＋** That line holds nothing of what an answer says and no question, and the main agent writes
      nothing else in the chat while an answer is out and passes on no answer of one `case-guppi` alone.

      **＋** It then shows the person one list of what to answer: its own questions still open and every
      round that came back, each question in the shape of `.claude/skills/grill-me/SKILL.md` and numbered
      `<Case id>.Q<n>` by the Case it belongs to.

      **＋** It sends each answer, with each finding held back for it, to the `case-guppi` of its Case
      in one message, and repeats the wait and the list until every `case-guppi` it sent has answered
      with its Case.

      **＋** It then shows every Case built again in one reply, for one ratification.

      **－** When an answer brings back a round while another answer is still out, the round is not shown
      in that turn, and `uv run guppi casecheck` does not refuse the reply that opens with the labelled
      line.

      **－** Outside this loop no Case is taken up before the current one is ratified or deferred.

      **－** A question that no answer settles stays in the next list under its number.'
