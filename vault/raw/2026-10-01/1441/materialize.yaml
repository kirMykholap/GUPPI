      `vault/wiki/` printed 20 files: `brief.md`, `log.md`, `where-to-stop.md`, `rule-where-to-stop`,
      `rule-end-of-work`, `rule-hook-registry`, `rule-retro`, `rule-retro-onward`, `rule-prespec-onward`,
      `estimate-retro-onward-sends-the-agent-to-the-handoff`, `estimate-retro-onward-exits-2-on-an-error`,
      `estimate-retro-runs-on-to-the-handoff`, `estimate-prespec-onward-sends-the-agent-on`, `estimate-case-protocol-defers-in-one-reply`,
      `estimate-python-utf8-output-intact`, `estimate-where-to-stop-stops-only-on-its-conditions`, `decision-case-531.9`,
      `decision-case-555`, `decision-case-555.3` and `decision-case-575`; the decision pages were not
      opened. In `rule-where-to-stop` and `where-to-stop.md`, a reply that opens with `STOP:` still ends.
      The hit in `rule-retro`, that the hook sends the agent on after the reply that ends Retro, becomes
