  sections:
    Criterion: 'When:

      The `Stop` hook `uv run guppi ledger` finds a fresh `lesson[<slug>]` line in a `LEDGER` block of
      the session, and the line carries `{addressed_by:case N}`.


      Then:

      When no decision line of Case N stands before the lesson line — in the session''s ledger, or earlier
      among the lines of the same `Stop` — the line is not written.

      **＋** The other lines of the `Stop` are written as before.

      **＋** When the refused line stands in the reply just finished, the hook exits 2 with one stderr
      line per refused line: "ledger: lesson[<slug>] not written — {addressed_by:case <N>} names no decision
      line before it in this session; its sub-cases have case <N.1>, case <N.2>: write the line again
      after the decision line of the Case that closed the cause, naming that Case." The part on the sub-cases
      stands only when a decision line of a sub-case of N stands in the session.

      **＋** A refused line from an earlier text of the transcript is judged again at every `Stop` until
      it stands in the ledger. It is written at the first `Stop` where a decision line of Case N stands
      in the ledger before it. The hook says nothing about it.

      **＋** The hook and `guppi materialize` judge the mark by one function of `guppi/materialize.py`,
      over the ledger lines in their order, and give the same answer for the same lines.

      **－** A line that `estimate-ledger-write-refuses-a-lesson-without-its-prefix` refuses is not judged
      for its mark, and gets that refusal''s stderr line alone.

      **－** A lesson line whose mark has a decision line of Case N before it is written as before, and
      so is a lesson line with no mark. A line already in the ledger of any session is not judged again.

      **－** Without a `hi` the hook judges no line. With `stop_hook_active` set it judges the line the
      same, and its stderr line is told once a stretch, as `estimate-ledger-write-lifts` sets it.'
