      `rule-spec-reconcile` names the title line of the plan, written before the first dispatch. `rule-orchestration`
      lists the dispatch among what moves to a file of its own in a later session, and the new clause
      moves with it. All three stay true. A Grep of `SubagentStop` over `vault/wiki/rules/` printed `rule-case-rebuild-cost`,
      `rule-case-protocol`, `rule-case-check`, `rule-hook-registry` and `rule-spec-reconcile`. Over `.claude/`
      it printed `.claude/settings.json`. The `set` of 579.2 carries `status`, `purpose` and `method`
      together, and the scripts foresee that form:

      - `guppi/prespec.py`, lines 906 to 917, reads the `method` under `set` of an Estimate `update`.
      It judges that `method` by `names_a_form` of `guppi/lint.py`, which accepts the words `by hand`,
      and the `method` here opens with them.

      - `guppi/generate.py`, lines 793 to 796, writes each key under `set` onto the page.

      - The hook of `rule-case-check` checked the earlier answer of this Case with this same `set`, and
      none of its notes spoke of it.


      Case 568 set `status` and `purpose` alone, so it is a precedent for `purpose` only. The Purpose
      of `rule-case-build` says that the agent gets an item and the person''s words. It stays true and
      is not reworded. I read the Criteria of the other Estimates of `rule-case-build`: the ones on the
      plain round, the record of rounds in `recommend`, the old form and what done means. None speaks
      of the frame check, so each stands. A Glob of `vault/**/estimate-case-protocol-names-*` printed
      no file, so the slug is free. The `create` carries a `ref`, so no vault query ran. No code reads
      the prompt or these texts, so no old form is kept. The main agent''s own Cases with too many sub-cases
      are not addressed here. A Case ratified after the dispatch, while `case-guppi` is still in its rounds,
      is not covered either, because the prompt is the dispatch alone.'
