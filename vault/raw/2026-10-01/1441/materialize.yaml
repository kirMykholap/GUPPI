      `Stop` records of that session with `hasOutput` false, 490 and 735, also follow a refusal of a `Stop`
      hook in the same stretch (records 457 and 700). The transcript does not hold the flag itself. The
      person took the transcript as enough evidence, and the live readings below confirm the fix. No lesson
      page records this behaviour of the flag. The person chose to fix the two checks on the path from
      Retro to `/handoff`, `guppi onward` and `guppi ledger`. Neither trusts the flag any more. Each judges
      by its own refusal in the stretch, which runs from the person''s last message to now. `guppi onward`
      exits 2 at most once in a stretch. The ledger writes and judges its lines whatever the flag says,
      since it never writes a line twice. `/pre-spec` found that a ledger refusal limited to once a stretch
      would lose a second faulty line of the same stretch without a word. The person chose that the ledger
      tells each refused line once in a stretch: it prints the stderr line of a refused line of the reply
      just finished only when that line does not already stand in its own refusals of the stretch. A repeat
      of the same faulty line stays silent, so the hook cannot loop. No `hi` and an error of its own stay
      once a stretch. The shape of the transcript records rests on the same transcript, on Claude Code
      2.1.282. A refusal is a `user` record marked `isMeta`, its text opening with `Stop hook feedback:`
      and holding a line `[<command>]: <stderr>` (records 457, 529, 700). A message of the person is a
      `user` record whose `origin.kind` is `human` (records 524, 657). The other four hooks keep the flag
