      **＋** At every later `Stop`, a refused line from an earlier text of the transcript is skipped without
      a word.

      **－** A lesson line whose slug starts with the lesson prefix is not refused for its prefix; its
      mark is judged by `estimate-ledger-write-refuses-a-mark-with-no-decision-line`. A line already in
      the ledger of any session is not judged again.

      **－** `estimate[...]` and `decision[...]` lines are not judged by their prefix.

      **－** Without a `hi` the hook judges no line. With `stop_hook_active` set it judges the line the
      same, and its stderr line is told once a stretch, as `estimate-ledger-write-lifts` sets it.'
