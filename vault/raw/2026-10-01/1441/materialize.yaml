  sections:
    Criterion: 'When:

      After the first reply of `/hi` and before the end of Plan Mode, with `vault/wiki/case-schema.md`
      rendered from `rule-case-protocol`, the agent closes a line of `raw/<date>/<hi HHMM>/frontier.md`
      in a reply that carries no ratification and no defer. Examples are an `A` line closed by the person''s
      answer, a `W` line closed by a reading, a `C` line that needs no decision, or an item closed `[-]
      … · sprint · defer` or `[-] … · backlog · kept`.


      Then:

      The reply ends with the heading `## Frontier` and the lines of `raw/<date>/<hi HHMM>/frontier.md`
      as a checklist, in the form that `estimate-case-protocol-acknowledging-reply` sets.

      **＋** In the checklist the closed lines are folded into one line, and the lines put off stand as
      they are closed.

      **＋** The open `W` lines are folded into one line that lists their ids.

      **＋** Each other open line stands on its own line with a short title.

      **＋** While a line under `## Cases` of `raw/<date>/<hi HHMM>/frontier.md` is open, a question follows
      the Frontier and ends the reply: which open item is next.

      **＋** When no line under `## Cases` is open, no question follows the Frontier: a reply with no `LEDGER`
      block calls `/pre-spec` after it, and a reply with a `LEDGER` block ends with the Frontier, for
      the hook of `rule-prespec-onward` to send the agent on.

      **＋** A reply that closes several lines shows one Frontier, after its `LEDGER` block when it carries
      one.

      **－** The first reply of `/hi` keeps the form that `rule-skill-hi` sets, the lines it closes included.

      **－** A line closed in Work Mode or at Retro shows no Frontier.

      **－** The reply that acknowledges a ratification and the reply that carries a defer keep their own
      form, as `estimate-case-protocol-acknowledging-reply` sets it.'
  applied: '17:15:02'
