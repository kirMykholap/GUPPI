  case_text:
    context: 'Before it answers, `case-guppi` checks its finished Case. It looks for the pages the change
      makes false and for the rules that act at the moment the change sets. For the second part it searches
      `vault/wiki/rules/` and `.claude/`. `estimate-case-build-checks-the-finished-case` measures this
      check by what `ask-guppi` still finds at `/pre-spec`. The reading of session 2356, ledger line 44,
      failed with three misses over Cases 561 and 562, which were built after the render that carried
      case 557.1.


      In the first miss, 561.13 changed the shape of the main agent''s own questions and missed `rule-skill-hi`
      and `estimate-hi-takes-its-readings`, which set the question about an open reading at `/hi`. That
      miss happened under the current text. The handoff of session 2356 puts it down to the size of Case
      561, which the backlog page `rule-case-rebuild-cost` holds. In the second miss, 561.3 replaced the
      Criterion of `estimate-prespec-hook-gates` but left its `purpose` stating the old promise. The rule
      never names the `purpose` and `method` fields of a replaced Estimate. In the third miss, Case 562
      added an end-of-reply check that refused the gathered list of the loop that 561.1 and 561.2 had
      set earlier in the same session. That loop stood only in the Cases of the session, which are not
      in `vault/wiki/rules/` or `.claude/` until the librarian''s run. Case 571 put the item off.


      The person decided that `case-guppi` does not search the Cases of the session. The main agent knows
      them, so it names each related Case in its prompt to `case-guppi`. That is a Case of the session,
      ratified or already shown, that changes a page the item names or sets what happens at the same moment.
      The prompt gives its id, one sentence on what it sets and which pages it changes, and the path of
      its case file. `case-guppi` reads only the case files the prompt names. The person also decided
      that, when `case-guppi` replaces an Estimate''s Criterion, it rewrites that Estimate''s `purpose`
      and `method` where they state the old promise. The dispatch is a promise of its own, so 579.1 changes
      `rule-case-protocol` and creates `estimate-case-protocol-names-related-cases-in-the-dispatch`. 579.2
      changes `rule-case-build` and replaces the Criterion of `estimate-case-build-checks-the-finished-case`,
      with a new `purpose` and `method`, and carries `{supersedes:case 571}` on that line. An Estimate
      carries no `deferred_by`, so only the Decision page of 571 is superseded, as with case 560 in session
      2356. The dispatch of this Case already named Cases 577 and 578. Case 578 changes `rule-case-protocol`
      in the acknowledging-reply paragraph of its Render. The pair of 579.1 stands in the paragraph on
      who builds a Case, in the same Render section, and the two anchors do not overlap. Case 577 touches
      neither page nor moment.


      The check of the answer noted that six lines of the old Criterion are not carried word for word,
      and that one `then` line of 579.2 shares most of its words with the `then` of 579.1. Both are on
      purpose:

      - The old Criterion had seven `＋` lines, and this Case adds two. To stay within seven `＋` lines,
      the line on a chosen option that cannot hold joins the line on the chosen options. The line on a
      fact that no slug marks joins the line on the slug search. The part of the hit line on a claim of
      `context` moves into the line on a claim about a search. Each old promise stands, in the merged
      line.

      - The shared words describe one thing from two sides: 579.1 says what the main agent puts in its
      prompt, and 579.2 says what `case-guppi` does with it. Each Criterion reads without the other.


      Frame. A Grep of `dispatches it with|the Case id, the Frontier item` over the repository outside
      `vault/raw/` and `vault/archive/` printed five files: `.claude/agents/case-guppi.md`, `vault/wiki/case-schema.md`,
      `estimate-case-protocol-shows-the-built-case`, `rule-case-protocol` and `rule-case-build`. The two
      rendered files follow their rules. `estimate-case-protocol-shows-the-built-case` lists what the
      dispatch carries and does not say it carries nothing else, so its Criterion stays true and stands.
      The person chose a new Estimate over replacing that wide promise. `estimate-case-build-writes-the-case`
      words its `when` the same way and stands for the same reason. A Grep of `dispatch\w*[^.]{0,60}case-guppi|case-guppi[^.]{0,60}dispatch`
      over `vault/wiki/rules/` printed `rule-orchestration`, `rule-case-protocol`, `rule-ask` and `rule-spec-reconcile`.
