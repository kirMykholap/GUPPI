  set:
    status: pending
    purpose: ask-guppi finds a page by meaning in either language, names the rule a proposal crosses and
      the state of a named slug, and answers in five lines, a list of the paths of the files it read allowed
      after them
  change: the Criterion replaced whole — a list of file paths may follow the five lines, as the general
    note of Claude Code asks of a sub-agent; nothing else follows them (case 582)
  sections:
    Criterion: 'When:

      The main agent dispatches `ask-guppi` through the `Agent` tool with a question, and the agent follows
      `.claude/agents/ask-guppi.md` as rendered from `rule-ask`.


      Then:

      The answer opens with exactly five lines: `exists`, `near`, `missing`, `rules` and the tags/slug
      line, each present, "none" when empty.

      **＋** After the five lines a list of the paths of files the agent read may stand, as the general
      note of Claude Code asks of a sub-agent.

      **＋** The agent starts with the Grep `^(purpose|deferred_by):` over `vault/wiki/rules/`, then runs
      one Grep per other category the question touches.

      **＋** A question about an existing page names its slug under `exists`, whether it is asked in English
      or in Russian.

      **＋** A proposal that crosses a rule or a lesson, such as a `SessionStart` hook meant to block,
      names it on the `rules` line.

      **＋** A named slug gets on the tags/slug line `free`, `live` with its category, or `archived at
      <path> by [[decision-case-N]]`, found by a Glob over `vault/archive/`, N from the `origin` of the
      archived page.

      **＋** The agent opens an archived page only when the question names its slug and asks what it said
      or why it was withdrawn.

      **＋** Each dispatch stands in `vault/raw/<date>/event_log.md`.

      **－** No index line, page text or other note reaches the caller beyond the five lines and that list
      of paths.

      **－** An answer with no list after the five lines holds the promise as well.

      **－** The archive is not searched by meaning: the `exists` and `near` lines name live pages only.'
  applied: '18:41:19'
