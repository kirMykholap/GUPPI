      compete with the note. The main agent sees only the helper''s final answer, so the list is not otherwise
      in its context. Still, the list mostly repeats the pages the five lines name, and a slug gives its
      path. No rule reads the list, and no parser or hook reads the answer of `ask-guppi`, so nothing
