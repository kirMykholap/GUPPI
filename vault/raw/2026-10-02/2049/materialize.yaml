      **＋** `estimate-prespec-onward-sends-the-agent-on` — the promise of the hook, its Criterion, `purpose`
      and `method` replaced

      **＋** `guppi/onward.py` and `tests/test_onward.py` — the hook, its run with `--plan` changed, and
      its tests

      **＋** `guppi/ledger.py` — the function of the refusals of a `Stop` hook in the stretch, each with
      the reply it follows; the ledger hook tells each refused line once a stretch

      **＋** `raw/2026-10-02/2049/cases/case-596.md` — the Retro fix, which adds that function and sets
      the same judgment for the run without `--plan`

      **＋** `.claude/settings.json` — registers the hook on `Stop` after `uv run guppi onward`; unchanged

      **＋** `raw/<date>/<hi HHMM>/spec.md` — the Spec of the session, whose presence silences the hook

      **＋** `raw/<date>/<hi HHMM>/frontier.md` — the Frontier, whose open lines under `## Cases` silence
      the hook

      **＋** `/pre-spec`, `uv run guppi prespec --check` and `ExitPlanMode` — the steps the reasons of
      the hook name'
    when: The `Stop` hook `uv run guppi onward --plan` receives the payload of the end of a reply of the
      main agent.
    then: 'It exits 2 when all of these hold: the event log of the session''s window holds a `hi` of this
      session; `raw/<date>/<hi HHMM>/spec.md` does not stand; `raw/<date>/<hi HHMM>/frontier.md` holds
      no open line under `## Cases`; the reply carries a `LEDGER` block; no Case is still out, as `rule-prespec-onward`
      judges it; its own refusal is not spent; and the reply does not open with `STOP:`.

      **＋** The stretch is the records of the transcript at `transcript_path` after the last `user` record
      whose `origin.kind` is `human`. A refusal of a `Stop` hook is a `user` record marked `isMeta` whose
      text opens with `Stop hook feedback:` and holds a line that opens with `[<command>]: `. Its own
      command is `uv run guppi onward --plan`, and the command of the ledger hook is `uv run guppi ledger`.

      **＋** Its own refusal is spent when its last refusal stands in the stretch and no refusal of the
      ledger hook follows the same reply of the agent or a later one, judged by `guppi/ledger.py`. So
      after a reply that the ledger hook refused, it sends the agent on again at the end of the next reply,
      the one that writes the refused lines again.

      **＋** A refusal of another `Stop` hook in the stretch neither silences it nor sends it on again,
      and neither does `stop_hook_active`.

      **＋** With no `prespec` line of this session after its `hi` in the event log, its reason on stderr
      tells the agent to call `/pre-spec` now. With that line, its reason tells the agent to run `uv run
      guppi prespec --check` on the plan file with `--session <id>`, to fix what it prints, and to call
      `ExitPlanMode` when it prints no finding.

      **＋** Each reason adds that, when only the person can go on — a Case still out with its `case-guppi`,
      or a question the person must answer — the agent opens its reply with `STOP:` and asks the person
      instead.

      **＋** In every other case with no error of its own, it exits 0 and prints nothing. This holds once
      its own refusal is spent, on a reply that opens with `STOP:`, and with `stop_hook_active` set when
      it cannot read the transcript.

      **＋** `.claude/settings.json` registers it on `Stop`, after `uv run guppi onward`.

      **－** An error of its own after it has read the payload exits 2 with `onward: not checked: <error>`
      on stderr and the advice to call `/pre-spec`, or to run the check and exit Plan Mode, when no Case
      is left open. It does so at most once a stretch, judged by its own refusal in the stretch alone.
      An empty payload exits 0.

      **－** It counts nothing, calls no model and writes no file and no mark. Its judgment is the marks,
      the files and their times, the refusals in the transcript and the first word of the reply.

      **－** `uv run guppi onward` without `--plan` keeps its own judgment.'
    context: "The Plan Mode run of the onward hook, `uv run guppi onward --plan` on `Stop`, sends the\
      \ agent on where no person is needed. After the reply that acknowledges the last ratification, it\
      \ sends the agent to `/pre-spec`. After the Cases rebuilt on its findings are ratified, it sends\
      \ the agent to the check and the exit. A reply with a `LEDGER` block must end, so the agent cannot\
      \ go on in it. To stay out of a loop, the run stays silent while `stop_hook_active` is set, and\
      \ Claude Code keeps that flag set from any `Stop` hook's refusal until the person's next message\
      \ (case 577.1). This goes wrong when the ledger hook refuses a line of the acknowledging reply.\
      \ The agent must answer with a reply that writes the line again in a `LEDGER` block, and that reply\
      \ ends. At its end the flag is set, the run stays silent, and Plan Mode stops with nobody needed.\
      \ The Retro run of the same hook stopped this way in session 1834, and Case 596 fixes it there.\n\
      \nThe page also carries the decision put off by case 575. It asks whether the run should judge a\
      \ Case still out by something other than the ledger's last decision line, because a re-ratification\
      \ with unchanged lines adds no line. Today the run counts the decision lines of the reply that just\
      \ ended as written now. The reading of session 1237 on `estimate-prespec-onward-sends-the-agent-on`\
      \ saw it fire after such a re-ratification. A gap remains. When the ledger hook refuses a line of\
      \ the reply that acknowledges a re-ratification, the next reply rewrites only that line. The ledger\
      \ then holds only the old times of the Case's lines, so the run judges the rebuilt Case still out.\
      \ Case 597.2 closes that gap and retires the defer of case 575.\n\nThe `Purpose` of `rule-prespec-onward`\
      \ says three things this Case changes:\n- the run judges only files and the payload, which 597.1\
      \ widens to the transcript, in the words of `rule-retro-onward`\n- it judges by the flag and fires\
      \ at most once a turn, which 597.1 changes, keeping the exit 0 with the flag set and a transcript\
      \ it cannot read\n- it reads the decision lines of `ledger.md` and of the reply, which 597.2 changes\n\
      \nThe page's `implementation_ref` lists only `guppi/onward.py`, `tests/test_onward.py` and `.claude/settings.json`.\
      \ 597.2 sets it whole, with the modules and tests both sub-cases use. The Criterion, `purpose` and\
      \ `method` of `estimate-prespec-onward-sends-the-agent-on` state the old guard, so 597.1 replaces\
      \ them whole. Each old line of that Criterion is carried with new words, with these exceptions:\n\
      - The line on the re-fire is dropped, because the flag is no longer the guard.\n- The clause on\
      \ the files under `cases/` is now the judgment of 597.2, named through `rule-prespec-onward`.\n\n\
      The `guppi/ledger.py` function that gives each refusal of a `Stop` hook in the stretch with the\
      \ reply it follows comes from Case 596.1. Work Mode builds it before 597.1 uses it. The time of\
      \ a transcript record is read by `moment` of `guppi/casecheck.py`, the one reading of that time.\
      \ Only Estimates with a `ref` are created, so the vault query was not run. The slug `estimate-prespec-onward-reads-the-decisions-of-the-stretch`\
      \ is free: a Glob of it over `vault/wiki/` and `vault/archive/` found no file. This Case was built\
      \ again on the findings of `/pre-spec`. They concerned the exception for the flag, the word \"transcript\"\
      \ in the `Purpose`, the `implementation_ref`, and the judgment of `rule-spec-write` below.\n\nFrame\
      \ checks:\n- A Grep of `onward --plan|prespec-onward` over `vault/wiki/` printed these files:\n\
      \  - `orchestration.md`, `backlog.md`, `log.md`\n  - `rule-prespec.md`, `rule-prespec-onward.md`,\
      \ `rule-orchestration.md`, `rule-plan-mode.md`, `rule-hook-registry.md`\n  - `estimate-orchestration-defers-in-one-reply.md`,\
      \ `estimate-orchestration-acknowledging-reply.md`, `estimate-orchestration-shows-the-frontier-after-a-closed-line.md`,\
      \ `estimate-prespec-onward-sends-the-agent-on.md`, `estimate-python-utf8-output-intact.md`, `estimate-retro-onward-sends-the-agent-to-the-handoff.md`\n\
      \  - `decision-case-575.md`, `decision-case-561.5.md`\n- The same Grep over the repository outside\
      \ `vault/` printed `.claude/settings.json`, `.claude/skills/pre-spec/SKILL.md`, `tests/test_ledger.py`,\
      \ `guppi/prespec.py`, `guppi/cli.py`, `tests/test_onward.py` and `guppi/onward.py`.\n- The hits\
      \ read outside History, `log.md` and `brief.md` stay true:\n  - `orchestration.md`, `rule-orchestration`\
      \ and its three Estimates say that a reply with a `LEDGER` block ends with the Frontier and the\
      \ hook sends the agent on.\n  - `rule-prespec` and `.claude/skills/pre-spec/SKILL.md` say the hook\
      \ sends the agent on after the acknowledging reply.\n  - `rule-plan-mode`, `rule-hook-registry`,\
      \ `settings.json` and `guppi/cli.py` give only its place and its registration.\n  - `guppi/prespec.py`\
      \ names the open lines the hook waits on.\n  - `tests/test_ledger.py` uses its refusal as another\
      \ hook's refusal.\n  - `estimate-python-utf8-output-intact` holds a past `Result`.\n- In `estimate-retro-onward-sends-the-agent-to-the-handoff`,\
      \ the line that keeps the flag as the guard of `--plan` is changed by Case 596, rebuilt by its own\
      \ `case-guppi` on the person's answer. This Case does not name that Estimate.\n- A Grep of ``stop_hook_active|writes?\
      \ (the|it|each) (line|lines) again|refused line`` over `.claude/`, `vault/wiki/rules/` and `vault/wiki/*.md`\
      \ printed `log.md`, `rule-ledger-write.md`, `rule-case-check.md`, `rule-retro-onward.md`, `rule-prespec-onward.md`\
      \ and `rule-spec-write.md`. All four other rules stay as they are:\n  - `rule-ledger-write` sets\
      \ the guard of its own hook by its own refusals.\n  - `rule-case-check` sets its guard by its store.\n\
      \  - `rule-retro-onward` sets the guard of the run without `--plan`.\n  - `rule-spec-write` exits\
      \ 0 on the re-fire of its own hook.\n\n  `orchestration.md` lets the agent's answer to a refusal\
      \ by a hook other than the ledger hook call tools, and that stands.\n\nEstimates:\n- `estimate-retro-onward-exits-2-on-an-error`\
      \ stands: `--plan` appears there only in a past `Result`.\n- The three Estimates of `rule-orchestration`\
      \ named above stand: they promise only that the reply ends with the Frontier.\n\nNot done:\n- `rule-ledger-write`,\
      \ with its defer by case 442, is not named. This Case only uses the `guppi/ledger.py` function set\
      \ by 596.1."
