  tags: []
  case_text:
    given: '`estimate-retro-onward-exits-2-on-an-error` — the promise of the error path of the hook, its
      Criterion replaced

      **＋** `estimate-retro-onward-sends-the-agent-to-the-handoff` — defines the stretch and the hook''s
      own refusal

      **＋** `rule-retro-onward` — the rule of the hook

      **＋** `guppi/onward.py` — the hook, its error path

      **＋** `tests/test_onward.py` — the tests of the hook

      **＋** `/handoff` — the skill that the advice of the error names'
    when: 'The `Stop` hook `uv run guppi onward` fires, and an exception rises in `guppi/onward.py` after
      the hook has read the payload: while it reads the reply, the session folder, the event log or the
      transcript.'
    then: '`guppi onward` exits 2. Its stderr holds `onward: not checked: <error>` and the advice: if
      Retro has ended and `handoff.md` does not stand, commit the session folder and call `/handoff`.

      **＋** While the cause stands, `guppi onward` blocks with the same error at the first `Stop` of each
      stretch of the session, before Retro too.

      **－** An empty payload of `guppi onward` exits 0 with nothing on stderr.

      **－** It exits 0 and prints nothing when its own refusal stands in the stretch, as `estimate-retro-onward-sends-the-agent-to-the-handoff`
      defines the stretch and its own refusal, whatever the ledger hook refused after it. It also exits
      0 when `stop_hook_active` is set and it cannot tell whether one stands, so it fires at most once
      a stretch.

      **－** With no error, `guppi onward` exits 2 or 0 by its own judgment, as before.'
    context: "At the end of Retro the agent sends one reply with the readings and lessons in a `LEDGER`\
      \ block. That reply must end, and the end of a reply hands the turn to the person. The hook of `rule-retro-onward`,\
      \ `uv run guppi onward` on `Stop`, refuses that ending and sends the agent on to commit the session\
      \ folder and call `/handoff`. To stay out of a loop, it speaks only once per stretch, from one message\
      \ of the person to the next. It judges this by its own refusal in the transcript (case 577.1). This\
      \ goes wrong when the ledger hook refuses a line of the same reply. In session 1834, at the ending\
      \ of 20:29:52, the transcript holds two refusals. The first is the ledger hook's: the lesson slug\
      \ lacked the `lesson-` prefix. The second is the onward hook's. The agent answered with a reply\
      \ that wrote the lesson line again in a `LEDGER` block, so that reply also had to end. At 20:29:58\
      \ all six `Stop` hooks were silent, because the onward hook had already used its one refusal. The\
      \ run then stopped with no condition of `where-to-stop.md` holding, until the person asked at 20:38:54.\
      \ The `Stop` hooks run side by side at one ending, so the onward hook cannot see a ledger refusal\
      \ of the same ending. It can see it at the next ending, in the transcript.\n\nThe pages and code\
      \ state the limit to one refusal in several places: the `Purpose` of `rule-retro-onward`, the docstring\
