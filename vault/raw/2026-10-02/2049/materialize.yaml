  category: estimates
  fields:
    type: estimate
    kind: QA
    purpose: Whether guppi onward --plan judges a Case out by the decision lines of ledger.md and of every
      reply since the person's last message, each at the time of its record, so that a re-ratification
      with lines the ledger already held counts at every later reply of the stretch
    method: 'uv run pytest tests/test_onward.py; by hand at the first re-ratification in Plan Mode after
      the change: the transcript, ledger.md and the times of the files under cases/, recorded in the estimate
      line'
    tags:
    - session
    - workflow
    - hooks
    - harness
  sections:
    Criterion: 'When:

      The `Stop` hook `uv run guppi onward --plan` judges, at the end of a reply of the main agent, whether
      a Case is still out.


      Then:

      A Case N is still out when a file `case-<N>.md` under `raw/<date>/<hi HHMM>/cases/` was written
      after the last decision line of Case N or of a sub-case of N.

      **＋** The decision lines it reads are the timed lines of `raw/<date>/<hi HHMM>/ledger.md`, the lines
      inside a `LEDGER` block of each reply of the main agent in the stretch, and those of the reply that
      ended.

      **＋** The stretch is the records of the transcript at `transcript_path` after the last `user` record
      whose `origin.kind` is `human`.

      **＋** A line of a reply in the stretch counts at the time of its record in the transcript, read
      by `moment` of `guppi/casecheck.py`. A line of the reply that ended counts as written now.

      **＋** A line of `ledger.md` counts at its time on the `hi` date, rolled to the next date when the
      time runs backwards.

      **＋** So a Case built again and ratified by a reply whose decision lines the ledger already held
      is not out after that reply, and not at any later reply of the stretch either. This includes the
      reply that writes again a line the ledger hook refused.

      **－** A file of a Case with no decision line is out.

      **－** A record whose time cannot be read counts none of its lines. A transcript that cannot be read
      leaves `ledger.md` and the reply that ended as the only sources.'
  applied: '22:44:22'
