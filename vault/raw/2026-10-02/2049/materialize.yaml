- case: '598.1'
  decision: decision-case-598.1
  origin: raw/2026-10-02/2049/ledger.md#case-598.1
  targets:
  - kind: update
    category: rules
    slug: rule-orchestration
    ref: rule-orchestration
  - kind: create
    category: estimates
    slug: estimate-orchestration-signs-a-batch-together
    ref: rule-orchestration
  tags:
  - session
  - workflow
  case_text:
    given: '`rule-orchestration` — the rule of the main agent''s work, its `Render` changed

      **＋** `vault/wiki/orchestration.md` — the render of `rule-orchestration`

      **＋** `estimate-orchestration-signs-a-batch-together` — the new promise

      **＋** `rule-prespec` and `/pre-spec` — the loop after the findings, whose steps the batch takes;
      unchanged

      **＋** `rule-case-check` — the `Stop` check, which lets a line under a bold label pass and asks for
      the file of each Case shown; unchanged

      **＋** `case-guppi` and `SendMessage` — the agent that builds each Case, and the call that sends
      a Case back to it

      **＋** `.claude/skills/grill-me/SKILL.md` — the shape of each question of the list

      **＋** `raw/<date>/<hi HHMM>/frontier.md` — the Frontier, whose items are taken one at a time'
    when: In Plan Mode before `/pre-spec`, the person's answer to a round of a `case-guppi`, or the person's
      word on a shown Case, asks that a Case already ratified in the session change, with `vault/wiki/orchestration.md`
      rendered from `rule-orchestration`.
    then: 'The main agent sends the ratified Case back to its `case-guppi` by `SendMessage`, and shows
      neither that Case nor the Case being built alone: the two are one batch.

      **＋** A Case that a Case of the batch asks to change in the same way joins the batch.

      **＋** While an answer of a `case-guppi` of the batch is out, the main agent ends each turn with
      one line that opens with the bold label `**Waiting:**`, translated, and names the Cases that have
      answered and those still out. It writes nothing else in the chat, and `rule-case-check` refuses
      no such reply.

      **＋** It shows one list of every round that came back, each question in the shape of `.claude/skills/grill-me/SKILL.md`
      and numbered `<Case id>.Q<n>`. It sends each answer to the `case-guppi` of its Case, all in one
      message, until every `case-guppi` of the batch has answered with its Case.

      **＋** It shows every Case of the batch in one reply, each in the showing that `vault/wiki/orchestration.md`
      sets, for one ratification.

      **＋** The person ratifies the batch at once or names the ids. A Case the person questions or changes
      goes back to its `case-guppi` and is shown again, alone or in a new batch with each Case it asks
      to change.

      **－** Outside a batch and the loop after the findings of `/pre-spec`, the main agent does not take
      up the next item of `raw/<date>/<hi HHMM>/frontier.md` before the shown Case is ratified or deferred.

      **－** The loop after the findings of `/pre-spec` stays as `rule-prespec` sets it.'
    context: "In Plan Mode the main agent takes Frontier items one at a time. It shows one Case per reply\
      \ and does not move to the next item until that Case is ratified or deferred. The one exception\
      \ is the loop after the findings of `/pre-spec`: there the Cases built again go out in one reply\
      \ and are ratified once (case 561.2). The rule goes wrong when a new Case shows that a Case already\
      \ ratified must change. In session 2049, the round on Case 597 found that a line of Case 596.1 would\
      \ become false. Case 596 was built again and ratified again in a reply of its own, and Case 597\
      \ was then shown and ratified in the next reply. That was two sign-offs for one connected change.\
      \ The person ruled that items stay one at a time and each Case is ratified after it is discussed.\
