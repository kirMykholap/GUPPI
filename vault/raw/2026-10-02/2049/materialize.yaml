      \ (the|it|each) (line|lines) again|no `?LEDGER`? block after|refused line`` over `vault/wiki/rules/`,\
      \ `.claude/` and `vault/wiki/*.md` printed `.claude/skills/retro/SKILL.md`, `vault/wiki/log.md`,\
      \ `rule-ledger-write.md` (a History line only) and `rule-retro.md`. The sentence in `rule-retro`\
