      \ `uv run guppi onward` on `Stop`, refuses that ending and sends the agent on to commit the session\
      \ folder and call `/handoff`. To stay out of a loop, it speaks only once per stretch, from one message\
      \ of the person to the next. It judges this by its own refusal in the transcript (case 577.1). This\
      \ goes wrong when the ledger hook refuses a line of the same reply. In session 1834, at the ending\
      \ of 20:29:52, the transcript holds two refusals. The first is the ledger hook's: the lesson slug\
      \ lacked the `lesson-` prefix. The second is the onward hook's. The agent answered with a reply\
      \ that wrote the lesson line again in a `LEDGER` block, so that reply also had to end. At 20:29:58\
      \ all six `Stop` hooks were silent, because the onward hook had already used its one refusal. The\
      \ run then stopped with no condition of `where-to-stop.md` holding, until the person asked at 20:38:54.\
      \ The `Stop` hooks run side by side at one ending, so the onward hook cannot see a ledger refusal\
      \ of the same ending. It can see it at the next ending, in the transcript.\n\nThe pages and code\
      \ state the limit to one refusal in several places: the `Purpose` of `rule-retro-onward`, the docstring\
      \ of `guppi/onward.py`, and the Criterion, `purpose` and `method` of `estimate-retro-onward-sends-the-agent-to-the-handoff`.\
      \ `rule-retro` and its render `.claude/skills/retro/SKILL.md` say that no `LEDGER` block follows\
      \ the reply that ends Retro. That sentence forbids the reply the ledger hook's refusal requires.\
      \ The ledger hook tells each refused line once a stretch (case 577.3), in `untold` of `guppi/ledger.py`.\
      \ Because of this, a hook that speaks again only after a ledger refusal cannot loop. No `create`\
      \ is made, so the vault query was not run.\n\nThis Case was built again on the findings of `/pre-spec`:\n\
      - `implementation_ref` of `rule-retro-onward` gains `tests/test_ledger.py`.\n- 596.2 replaces the\
      \ Criterion of `estimate-retro-runs-on-to-the-handoff`, since its line on the one reply that ends\
      \ Retro speaks of the moment the rewrite reply joins. Its `purpose` and `method`, which state the\
      \ old promise, are set anew.\n- 596.3 replaces the Criterion of `estimate-retro-onward-exits-2-on-an-error`.\
      \ Its silence pointed to the judgment of `estimate-retro-onward-sends-the-agent-to-the-handoff`,\
      \ which 596.1 rewrites to \"spent\". The error path keeps its own refusal in the stretch alone as\
      \ its guard. That is a second condition with its own fix, so it is a sub-case of its own. It still\
      \ takes the stretch and the hook's own refusal from that Estimate, whose definitions 596.1 keeps.\
      \ Its `purpose` and `method` still hold and stand.\n\nThe new Criterion of 596.1 changes the old\
      \ one in these places only:\n- when the hook speaks: its own refusal is now \"spent\" rather than\
      \ standing in the stretch\n- what a refusal is: a refusal of the ledger hook is defined beside the\
      \ hook's own\n- refusals of other hooks: they neither silence the hook nor send it on again\n- what\
      \ it judges: it judges the ledger hook's refusals as well as its own\n- the Plan Mode run: it keeps\
      \ its own judgment, which `rule-prespec-onward` sets\n\nIn 596.2 the new and changed lines are these:\n\
      - the rewrite reply that answers a refusal of the ledger hook\n- the run on to `/handoff` after\
      \ that reply\n- the note that this answer is no stop\n\nIn 596.3 the one changed line is the silence\
      \ after a later ledger refusal. Every other line of the three old Criteria is carried as it stood.\n\
      \nCase 597 of this session takes up `rule-prespec-onward`. Its case file was not written when this\
      \ Case was built, so it was not read. As the main agent reported it:\n- `uv run guppi onward --plan`\
      \ drops `stop_hook_active` as its guard.\n- It takes the judgment of 596.1, through the function\
      \ that 596.1 adds to `guppi/ledger.py`.\n- It leaves `estimate-retro-onward-sends-the-agent-to-the-handoff`\
      \ untouched.\n\nFrame checks:\n- A Grep of `rule-retro-onward|retro-onward` over the repository\
      \ outside `vault/archive/` and `vault/raw/` printed these files:\n  - `vault/wiki/where-to-stop.md`,\
      \ `.claude/skills/retro/SKILL.md`, `guppi/onward.py`, `vault/wiki/brief.md`, `tests/test_onward.py`\n\
      \  - `rule-where-to-stop.md`, `rule-retro.md`, `rule-retro-onward.md`, `rule-prespec-onward.md`,\
      \ `rule-hook-registry.md`, `rule-end-of-work.md`, `log.md`\n  - `estimate-end-of-work-order.md`,\
      \ both Estimates of the hook, `estimate-retro-loads.md`, `estimate-ask-finds.md`\n  - `decision-case-531.9.md`,\
      \ `decision-case-555.3.md`, `decision-case-555.4.md`, `decision-case-577.1.md`, `decision-case-577.2.md`\n\
      - The hits read outside History, `log.md` and `brief.md` stay true:\n  - `where-to-stop.md` and\
      \ the `Purpose` of `rule-where-to-stop` say that the hook lets a reply that opens with `STOP:` end,\
      \ and that its refusal names the file.\n  - `rule-prespec-onward` says that it does what `rule-retro-onward`\
