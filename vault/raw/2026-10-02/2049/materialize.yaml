  - old: a sub-case the person questions or changes is shown again alone (case 355.2).
    new: 'a sub-case the person questions or changes is shown again alone (case 355.2). When, before `/pre-spec`,
      the person''s answer to a round or the person''s word on a shown Case asks that a Case already ratified
      in the session change, the agent sends that Case back to its `case-guppi` by `SendMessage` and shows
      neither it nor the Case being built alone: the two are a batch, and a Case that a Case of the batch
