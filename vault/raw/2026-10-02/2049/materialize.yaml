    context: "In Plan Mode the main agent takes Frontier items one at a time. It shows one Case per reply\
      \ and does not move to the next item until that Case is ratified or deferred. The one exception\
      \ is the loop after the findings of `/pre-spec`: there the Cases built again go out in one reply\
      \ and are ratified once (case 561.2). The rule goes wrong when a new Case shows that a Case already\
      \ ratified must change. In session 2049, the round on Case 597 found that a line of Case 596.1 would\
      \ become false. Case 596 was built again and ratified again in a reply of its own, and Case 597\
      \ was then shown and ratified in the next reply. That was two sign-offs for one connected change.\
      \ The person ruled that items stay one at a time and each Case is ratified after it is discussed.\
      \ When Cases are handled side by side, the agent waits for the whole batch and shows them together\
      \ for one ratification. This covers the pre-spec loop and the case where an earlier Case must change\
      \ because of a new one.\n\n`orchestration.md` holds the rule in `## Plan Mode and the Frontier`.\
      \ Case 598.1 adds the batch there and in `## Showing and signing a Case`, and names both exceptions\
      \ to one Case per reply: the pre-spec loop and the batch. A batch runs the steps of the pre-spec\
      \ loop, so its tools already exist:\n- The docstring of `guppi/casecheck.py` lets a reply that opens\
      \ with a bold label ending in a colon pass the round check, and that is the `**Waiting:**` line.\n\
      - The same docstring compares each Case a reply shows under its heading and asks for the sending\
      \ of its file, so several top-level Cases in one reply pass when each file is sent.\n- The Result\
      \ of `estimate-prespec-gathers-the-answers-after-findings` (session 1202) shows four rebuilt Cases\
      \ in one reply, ratified once, with no refusal.\n\nThe sentence of `## Showing and signing a Case`\
      \ on sub-cases already says how one reply acknowledges sub-cases ratified together: one `LEDGER`\
      \ block, one heading that names the ids, one Frontier (case 355.2). 598.2 widens that sentence to\
      \ every Case ratified in one answer, so that the rule has one wording. The Criterion of `estimate-prespec-gathers-the-answers-after-findings`\
      \ has a line saying that outside its loop no Case is taken up before the current one is ratified.\
      \ A batch makes that line false, so 598.3 replaces it. The sentence of `rule-prespec` that lifts\
      \ the one-at-a-time rule inside its loop stays true and is not changed. The `purpose` of that Estimate\
      \ speaks only of the loop and stands, and so does its `method`. The `purpose` of `estimate-orchestration-acknowledging-reply`\
      \ stays true. Its `method` reads only the first acknowledging reply of a session, which may hold\
      \ no batch, so 598.2 adds to it the first reply that acknowledges Cases ratified together.\n\nThis\
      \ Case was built again on findings 4 and 5 of `/pre-spec`. Finding 4: the first replace of 598.1\
      \ named the batch as the only exception and left out the pre-spec loop. Finding 5: 598.2 added a\
      \ second wording of the sub-case sentence instead of widening it. 598.1 and 598.2 now change the\
      \ same paragraph of `## Showing and signing a Case` at two anchors that do not overlap. Read side\
      \ by side, the paragraph says that one reply acknowledges every Case ratified in one answer, and\
      \ that a Case the person questions goes back and is shown again.\n\nThe new Criteria change the\
      \ old ones in these places only:\n- In `estimate-orchestration-acknowledging-reply`, the `when`\
      \ adds Cases ratified together in one answer.\n- In the same Estimate, the line on a Case with sub-cases\
      \ now covers every Case ratified in one answer, with one paragraph `Changes:`.\n- In `estimate-prespec-gathers-the-answers-after-findings`,\
      \ the line on what holds outside the loop now points to the batch of `orchestration.md`.\n\nEvery\
      \ other line is carried as it stood. The `then` of 598.1 repeats the steps of the loop of 598.3\
      \ on purpose: the batch takes those steps, and each Estimate checks them at its own trigger. 598.1\
      \ checks them after the person's word on a ratified Case, and 598.3 checks them after the findings\
      \ of `/pre-spec`.\n\nCase 597 sets what the hook of `rule-prespec-onward` does after the acknowledging\
      \ reply, and this Case leaves that unchanged. In a batch the line of the new Case under `## Cases`\
      \ stays open until the batch is ratified, so that hook stays silent. Once the batch is ratified,\
      \ 597.2 counts the decision lines of the reply as written. Case 596 sets the Retro run and does\
      \ not touch this moment. A batch in Work Mode is not covered. The person spoke of the work on the\
      \ Frontier.\n\nThe one `create` has a `ref`, so the vault query was not run. A Glob of `vault/{wiki,archive}/**/estimate-orchestration-signs-a-batch-together.md`\
      \ found no file, so the slug is free.\n\nFrame checks:\n- A Grep of ``[Oo]ne reply shows one Case|one\
      \ Case at a time|next Case until|ratified or deferred|for one ratification|one ratification`` ran\
      \ over the repository outside `vault/archive/` and `vault/raw/`. It printed these files:\n  - `.claude/skills/pre-spec/SKILL.md`,\
      \ `rule-prespec.md`, `estimate-prespec-gathers-the-answers-after-findings.md`\n  - `orchestration.md`,\
      \ `rule-orchestration.md`, `estimate-orchestration-shows-the-built-case.md`\n  - `glossary.md`,\
      \ `entity-glossary.md`, `log.md`, `tests/test_ratified.py`\n  - `estimate-case-check-shows-only-the-checked-case.md`,\
      \ `rule-case-protocol.md` and `rule-case-check.md`, each a History line only\n  - `lesson-case-showing-ratification-fence-outside-the-blockquote.md`,\
      \ `decision-case-52.2.md`, `decision-case-561.md`\n- The hits read outside History and `log.md`\
      \ stay true:\n  - The glossary entry Plan Mode says items are worked one by one, and that stays\
      \ true.\n  - The pre-spec skill describes its own loop.\n  - The test and the lesson concern one\
      \ `ratification` under one heading.\n  - `estimate-orchestration-shows-the-built-case` describes\
      \ the showing that each Case of a batch keeps.\n  - The decision pages were not read.\n- A Grep\
      \ of ``ratified again|re-ratification|shown again|ratifies them all|names the ids`` over `vault/wiki/rules/`,\
      \ `.claude/` and `vault/wiki/*.md` printed these files:\n  - `brief.md`, `backlog.md`, `orchestration.md`,\
      \ `case-schema.md`, `log.md`\n  - `rule-prespec.md` (a History line), `rule-orchestration.md`, `rule-case-protocol.md`,\
      \ `rule-ledger-line-withdrawn-on-re-ratification.md`\n- The hits read outside History, `log.md`\
      \ and `brief.md` stay true. The backlog lines and `rule-ledger-line-withdrawn-on-re-ratification`\
      \ concern ledger lines of a re-ratification. `case-schema.md` and its rule say that `case-guppi`\
      \ builds a Case at every showing again.\n- A Grep of `rule-orchestration|orchestration\\.md` over\
      \ the repository outside `vault/archive/` and `vault/raw/` printed 49 files. A Grep of ``one Case|next\
      \ Case|item by item|one at a time|together`` then ran over the rule, estimate and skill pages among\
      \ them that are not named above:\n  - `rule-case-build`, `rule-plan-mode`, `rule-ratification`,\
      \ `rule-ledger-write`, `rule-internal-context`\n  - `.claude/skills/hi/SKILL.md`, the Estimates\
      \ of `rule-orchestration`\n  - `insight-prespec-main-agent-question-off-the-grill-me-shape`, `estimate-skill-grill-me-asks-in-rounds`\n\
      - That Grep printed `rule-case-build.md` and `estimate-skill-grill-me-asks-in-rounds.md`. Both speak\
      \ of building one Case and of the shape of a question, and both stay true.\n\nEstimates:\n- `estimate-orchestration-shows-the-built-case`\
      \ stands. Each Case of a batch keeps its showing. The number of each question keeps the number of\
      \ its answer, with the Case id before it, as in the pre-spec loop.\n- `estimate-orchestration-shows-the-frontier-after-a-closed-line`,\
      \ `estimate-orchestration-defers-in-one-reply` and `estimate-orchestration-names-related-cases-in-the-dispatch`\
      \ stand. Their Criteria speak of a line closed with no ratification, of a defer and of the dispatch,\
      \ which the batch does not change.\n\nNot done:\n- `insight-prespec-after-findings-loop-unruled`,\
      \ Frontier item C5, is not taken up.\n- `rule-case-rebuild-cost` is not touched."
    problem: Only the loop after the findings of `/pre-spec` lets Cases go out together for one ratification.
      When a new Case shows that a ratified Case must change, the changed Case is ratified again in a
      reply of its own, and the new Case in the next one. Nothing gathers the Cases handled side by side
      into one sign-off.
    recommend: "- **Which Cases can be signed together outside the pre-spec loop?**\n  - Recommended:\
      \ (a) one by one, with a batch only when Cases are handled side by side. Frontier items are taken\
      \ one at a time, and each Case is ratified once discussed. After the findings of `/pre-spec`, and\
      \ when a new Case shows that a ratified Case must change, the agent waits for the whole batch and\
      \ shows all of it in one reply for one ratification.\n  - Answer: agreed with the recommendation,\
      \ (a). In the first round the person had chosen (b), to hold every ratification for a batch, and\
      \ the person's own answer in the second round replaced it.\n- **What the reply that shows a Case\
      \ asks you**\n  - Recommended: (a) sign now or move on. The reply asks for the sign-off or lets\
      \ the Case wait for the batch.\n  - Answer: in the person's own words: items of the Frontier are\
      \ taken one after another and each Case is ratified after it is discussed. When several Cases are\
      \ considered side by side, the agent always waits for the batch and shows all the Cases together.\
      \ The cases are after the pre-spec check, or when it becomes clear that an earlier Case needs a\
      \ change because of new edits. The person asked whether this holds.\n- **When the agent asks for\
      \ the batch sign-off**\n  - Recommended: (a) when every open item under the Cases list is a waiting\
      \ Case, and whenever the person asks; the person may name the Cases they sign.\n  - Answer: not\
      \ answered; replaced by **How a batch runs in the middle of Plan Mode**.\n- **What the batch sign-off\
      \ reply shows**\n  - Recommended: (a) a short list with no files and no ledger lines.\n  - Answer:\
      \ not answered; replaced by **How a batch runs in the middle of Plan Mode**.\n- **How the Frontier\
      \ shows a waiting Case**\n  - Recommended: (a) the line stays open as it is.\n  - Answer: not answered;\
      \ replaced by **Which Cases can be signed together outside the pre-spec loop?**, under which no\
      \ Case waits unsigned.\n- **How a batch runs in the middle of Plan Mode**\n  - Recommended: (a)\
      \ the same steps as the pre-spec loop. The agent sends the ratified Case back to its `case-guppi`,\
      \ writes one `**Waiting:**` line while an answer is out, gathers the rounds into one list numbered\
      \ by Case, and shows all the Cases of the batch in one reply for one ratification.\n  - Answer:\
      \ agreed with the recommendation, (a).\n- **If you sign only part of a batch**\n  - Recommended:\
      \ (a) name the Cases you sign, as with sub-cases. A Case the person questions or changes goes back\
      \ to its `case-guppi` and is shown again, alone or with any Case it changes in turn.\n  - Answer:\
      \ agreed with the recommendation, (a).\n- **How the change is checked, and what else it changes**\n\
      \  - Recommended: (a) three sub-cases. The first changes `rule-orchestration` and creates an Estimate\
      \ for the batch. The second replaces the Criterion of `estimate-orchestration-acknowledging-reply`.\
      \ The third replaces the Criterion of `estimate-prespec-gathers-the-answers-after-findings` without\
      \ its line on what holds outside the loop.\n  - Answer: agreed with the recommendation, (a)."
