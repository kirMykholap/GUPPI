  sections:
    Criterion: 'When:

      The close of the sprint `entity-sprint-<id>` runs: the Estimates that `entity-sprint-<id>` lists
      are read in it first, and its pages move once each of them stands `passed`; someone reads the record
      of the close, `vault/wiki/estimates/` and `vault/archive/` after it.


      Then:

      Before any page of the close moves, the close lists to the person each Estimate under `vault/wiki/estimates/`
      that stands `pending` or `failed`.

