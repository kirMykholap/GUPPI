  sections:
    Criterion: 'When:

      The person types `/hi` on `UserPromptSubmit`, and the agent writes `raw/<date>/<hi HHMM>/frontier.md`,
      whose `## Work` holds the `pending` readings of `vault/wiki/brief.md` and whose `## Ask` holds its
      readings that only the person can take.


      Then:

      In its first reply, before the question on the order, the agent takes each reading of an open `W`
      line whose every moment, as its `method` names it, is this `/hi` or has come in an earlier session.

      **＋** It reads what the method names from `vault/wiki/brief.md`, `git log`, `git status` and the
      commands of the method.

      **＋** It reads each moment of an earlier session from the transcript of the latest session that
      held it, found by the session ids of `vault/raw/<date>/event_log.md`, and each part of the method
      from the session where its moment came.

      **＋** It opens the page of each Estimate it reads and judges the reading against its `## Criterion`.

      **＋** It closes the `W` line of each reading taken as `[x] … · work` in `raw/<date>/<hi HHMM>/frontier.md`,
      then writes one `estimate[...]` line per reading in a `LEDGER` block of the reply, which ends in
      text.

      **＋** In the same reply, before the question on the order, it puts each open `A` line to the person
      as a question: the Estimate by slug and its question.

      **＋** When the person answers one, the agent closes its `A` line `[x] … · work` in `raw/<date>/<hi
      HHMM>/frontier.md` first, then writes its `estimate[...]` line, the answer as its result, in a `LEDGER`
      block of the reply, which ends in text.

      **－** The Frontier is still assembled with no page opened. Only the reading step opens the pages
      of the Estimates it reads.

      **－** A reading with a moment that has come in no session yet, or whose transcript Claude Code no
      longer holds, is not taken, and its `W` line stays open.

      **－** A reading whose `method` asks for a `/hi` run of its own, such as one outside plan mode, is
      not taken at `/hi`.

      **－** At `/hi` the agent changes no page and no file except `raw/<date>/<hi HHMM>/frontier.md`.'
