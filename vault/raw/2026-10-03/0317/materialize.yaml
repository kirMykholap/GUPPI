- case: '612.1'
  decision: decision-case-612.1
  origin: raw/2026-10-03/0317/ledger.md#case-612.1
  targets:
  - kind: create
    category: rules
    slug: rule-sprint-close
  - kind: create
    category: estimates
    slug: estimate-sprint-close-archives-the-decisions
    ref: rule-sprint-close
  - kind: update
    category: entities
    slug: entity-sprint-migration
    ref: entity-sprint-migration
  tags:
  - sprint
  - workflow
  case_text:
    given: '`rule-sprint-close` — the new rule of what the close of a sprint archives and keeps

      **＋** `estimate-sprint-close-archives-the-decisions` — the promise on Decision pages

      **＋** `entity-sprint-<id>` — the sprint page that closes, with the Estimates it lists

      **＋** `vault/wiki/decisions/` — the Decision pages, each with its `sprint`

      **＋** `vault/archive/` — where an archived page stands, moved there by `rule-cleanup`

      **＋** `entity-sprint-migration` and `vault/wiki/sprint.md` — the current sprint page, whose closing
      milestone names the new rule and keeps a note, and its render by `guppi sprint`

      **＋** `rule-sprint` — the form of a milestone item and of a note'
    when: 'The close of the sprint `entity-sprint-<id>` runs: the Estimates that `entity-sprint-<id>`
      lists are read in it first, and its pages move once each of them stands `passed`; someone reads
      `vault/wiki/decisions/` and `vault/archive/` after it.'
    then: 'Each Decision page under `vault/wiki/decisions/` whose `sprint` is `<id>` stands under `vault/archive/`.

      **－** A Decision page that a live page names in `deferred_by` or `addressed_by` stays under `vault/wiki/decisions/`.

      **－** A Decision page whose `sprint` is another sprint does not move.'
    context: 'A sprint is an Entity Leaf, `entity-sprint-<id>`. Its `estimates` are the sprint''s done-conditions,
      and `guppi sprint` renders it into `vault/wiki/sprint.md`, which `/hi` loads. Nothing closes a sprint
      today. Under its closing milestone, the sprint page holds only an undecided note (case 478.2). It
      says the sprint page and its Estimates go to the archive once each has passed. A page leaves the
      live vault today only through an event of its own. A Decision page leaves when a later Case supersedes
      it. The lessons of an Insight leave once that Insight is `actioned`. An `open` Insight leaves when
      no live lesson is left under it. Any page leaves when a Case deletes it. The cascade of `guppi/generate.py`
      sets `archived`, and `guppi cleanup` (`rule-cleanup`) moves the page under `vault/archive/<sprint>/`.
      Everything else stays live. The main agent counted the live vault this session: 1003 Decision pages
      (2.7 MB), 74 lessons, 29 Insights and 195 Estimates, of which 37 are `pending` and 1 is `failed`.
      The person sees an endless loop of fixes, with readings that hang session after session, and wants
      the close of a sprint to clean the vault.


      In the rounds the person chose what the close does. It archives the sprint''s Decision pages, but
      keeps those that a live page names in `deferred_by` or `addressed_by`. It archives the sprint''s
      `actioned` Insights and its `error` lessons that joined no Insight, and keeps `knowledge` lessons
      and `open` Insights with their lessons. It archives the sprint page with its own Estimates, and
      keeps every other `passed` Estimate as the contract of its rule. Before anything moves, it puts
      each `pending` or `failed` Estimate to the person: read it, carry it into the next sprint, or archive
      it unread. The person did not decide where the close runs. They see it as a mode of work of its
      own, not a choice after Plan Mode, and left it for later. So this Case creates `rule-sprint-close`
      as a draft that holds these choices. The rule has no `enforcement` and no code. The rules schema
      keeps `enforcement` optional, and the Case that decides where the close runs gives the rule its
      guard. Not done: where the close runs, how the next sprint opens, and any code.


      The sprint page''s own Estimates are read at the close itself. Their methods say so:

      - `estimate-sprint-migration-leftovers-gone` reads the tree by hand at the close of the sprint.

      - `estimate-sprint-migration-lint-clean` reads `make lint` at the close.

      - `estimate-sprint-migration-merges` reads `git log` of `main` at the close, and its Criterion calls
      the cascade''s `built` on the sprint page the close of the sprint.


      So these Estimates cannot pass before the close runs. In this Case the close runs first and reads
      the sprint page''s own Estimates in it. Pages move only once each of those Estimates has passed,
      which is when the cascade sets the sprint page `built`. This matches the merge Estimate''s wording
      and the order of 612.4. All three Criteria therefore stand.


      The person chose that this sprint closes with a clean lint, so the Criterion of `estimate-sprint-migration-lint-clean`
      stands. At this sprint''s first close, carrying an Estimate forward would leave an `unread` line
      that fails that Criterion.


      The rule''s four parts can fail separately and need different fixes, so each part is a sub-case
      with an Estimate of its own. Each Estimate is read by hand after the first close of a sprint. The
      four sub-cases share the same trigger and the same shape of result, and each one names a different
      set of pages. The check of the answer noted that their `then` lines share words, and that is why.


      The closing milestone of `entity-sprint-migration` names the new rule as its item, and a plain note
      there says that where the close runs is not decided. A note keeps the milestone open (`rule-sprint`),
      and every session sees it in `sprint.md`. No put-off decision is written. That would add a `deferred`
      line to `make lint`, which the current sprint''s clean-lint condition would have to clear.


      The vault query of `.claude/agents/ask-guppi.md` ran for the `create` without a `ref`. These are
      its findings:

      - exists: none. A Glob of `vault/wiki/**/rule-sprint-close*.md` and one of `vault/archive/**/*sprint-close*.md`
      printed no file, so the slug is free.

      - near: `rule-cleanup` moves a page that already stands `archived` but chooses none; `rule-sprint`
      renders the sprint page and does not close it; `entity-sprint` is the kind, which carries no Estimate.

      - rules: `lesson-case-build-closes-a-sprint-item-without-the-sprint-page` requires a Case that closes
      a sprint item to update the sprint page, which 612.1 does.

      - tags: `sprint` and `workflow`, both existing.


      `rule-morph` is a line under the `## Backlog` of the sprint page, about the category set, and this
      Case does not touch it. `applies_to: [entity-sprint]` makes the cascade add the new rule to the
      `rules` of `entity-sprint`. Its Purpose sentence that the page carries no Estimate stays true, because
      the new Estimates target the rule.


      Some texts say today that a lesson or an Insight leaves only through its Insight, or that an `actioned`
      Insight stays live for a later lesson to join. These texts become false only when a close first
      runs, and nothing runs one until the Case that decides where it runs. That Case changes them, and
      the Purpose of the new rule names them. A Grep of `archived only when|kept for the recurrence|stays
      live with its|never archived` over the repository outside `vault/wiki/decisions/`, `vault/archive/`
      and `vault/raw/` printed 5 files:

      - `.claude/agents/librarian-guppi.md`

      - `vault/wiki/insights/schema.yaml`

      - `vault/wiki/rules/rule-synthesis.md`

      - `vault/wiki/rules/rule-insights-schema.md`

      - `vault/wiki/estimates/estimate-synthesis-clusters.md`


      The first two are the renders of `rule-synthesis` and `rule-insights-schema`. The pre-spec check
      named `estimate-synthesis-keeps-actioned-by-the-mark` as well. Its Criterion has a later lesson
      join an existing `actioned` Insight, which keeps its status. That Insight is no longer live once
      a close has archived it. A Grep of `archived` over `rule-lessons-schema.md` and `rule-decisions-schema.md`
      printed the `status` field of each. One says a lesson is archived when its Insight is `actioned`.
      The other says a Decision page is archived when superseded. These stand until that Case too.


      A Grep of `close of (the|a) sprint|sprint clos|closes? the sprint` over `vault/wiki/rules/` and
      `.claude/` printed one file, `rule-prespec.md`, and the hit is a History line. A Grep of `478\.2|Slice
      5` over the repository outside `vault/wiki/decisions/`, `vault/archive/` and `vault/raw/` printed
      9 files:

      - `brief.md`

      - `backlog.md`

      - `sprint.md`

      - `log.md`

      - `entity-sprint-migration.md`

      - `estimate-sprint-items-move-only-by-a-case.md`

      - `estimate-hi-writes-frontier.md`

      - `tests/test_sprint.py`

      - `rule-morph.md`


      `brief.md` and `log.md` were not read. `sprint.md` is rendered again. The hits in `backlog.md` and
      `rule-morph.md` are the line of `rule-morph`. The hits in the two Estimates are Results of past
      readings. The hits in `tests/test_sprint.py` are test fixtures. All of these stay true. The Estimates
      of `rule-sprint` and `rule-cleanup` speak of the render, of moves by a Case and of the moves of
      `cleanup`, none of which this Case changes. Case 611 changes `rule-case-check` and an Insight, and
      sets nothing about a sprint.'
