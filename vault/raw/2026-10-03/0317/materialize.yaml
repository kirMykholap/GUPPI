- case: '613.1'
  decision: decision-case-613.1
  origin: raw/2026-10-03/0317/ledger.md#case-613.1
  targets:
  - kind: update
    category: rules
    slug: rule-estimates-schema
    ref: rule-estimates-schema
  - kind: create
    category: estimates
    slug: estimate-lint-reports-a-method-tied-to-a-one-off-moment
    ref: rule-lint
  tags:
  - harness
  - workflow
  case_text:
    given: '`guppi/lint.py` and `tests/test_lint.py` — lint, which gains the class `moment` and its predicate,
      and its tests

      **＋** `guppi/prespec.py` and `tests/test_prespec.py` — pre-spec, which imports the predicate, and
      its tests

      **＋** `rule-lint` — the rule of lint; its classes live in the docstring of `guppi/lint.py`

      **＋** `rule-prespec` — the rule of pre-spec; its checks live in the docstring of `guppi/prespec.py`

      **＋** `rule-estimates-schema` and `vault/wiki/estimates/schema.yaml` — the `method` field and its
      render, which gain the form of a moment

      **＋** `vault/wiki/estimates/` — the Estimate pages lint reads

      **＋** the plan file of Plan Mode — the `then` blocks pre-spec reads

      **＋** `estimate-lint-reports-a-method-tied-to-a-one-off-moment` — the new promise'
    when: '`uv run guppi lint` reads the `method` field of each live Estimate under `vault/wiki/estimates/`.

      **＋** Or `uv run guppi prespec --check <plan> --session <id>` reads the `method` of a `create` of
      an Estimate, or of an `update` that carries `set: {method: …}`, in the `then` blocks of the plan
      file.'
    then: 'A `method` that holds `by hand` and names the first of something after the render or after
      the change, with no `;` between the two, is one lint finding of the class `moment`.

      **＋** The same `method` in the plan gives one line `case N: <create|update> <slug>: method ties
      its reading by hand to the first moment after the render or the change`, which goes on to say that
      the method names the kind of its moment.

      **＋** Both sides judge by one predicate in `guppi/lint.py`, which `guppi/prespec.py` imports.

      **－** A `method` that names the kind of its moment, with no word "first", gets no such finding.

      **－** A `method` that names the first of an event without "after the render" or "after the change",
      such as the first close of a sprint, gets no such finding.

      **－** A `method` without `by hand` gets no such finding.

      **－** The finding does not replace the `method` finding of a `method` that names no form.'
    context: 'Each Estimate has a `method` line that says how its promise is checked. Many checks by hand
      tie their reading to one moment, "the first X after the render": the first `/handoff`, the first
      `/retro`, the first `/work`. That moment passes once, and nobody reads it. Take `estimate-handoff-holds-each-fact-once`,
      read "at the first /handoff after the render". `/handoff` runs after Retro has written the session''s
      readings, so no step of that session is left to read it. The next `/hi` takes only readings whose
      method names `/hi` or the librarian''s run. The handoff of session 0115 then listed it as "moment
      not come". The moment is not lost. The event logs `vault/raw/<date>/event_log.md` name each session
      by its id and mark `hi`, `prespec`, `retro`, `handoff` and each `Skill` and `Agent` call. The transcript
      of that session holds the turn until Claude Code deletes it. `rule-work-mode` already says that
      a moment of an earlier session has come, but no step opens an old transcript. The main agent''s
      diagnosis holds: the tests run at every session, and one reading covers a whole `method`.


      The person chose this. A method names the kind of its moment, and any such moment after the render
      counts, in this session or an earlier one (613.3). The word "first" stays only for an event that
      has never happened, such as the first close of a sprint in the methods of case 612. `/hi` reads
      each moment of an earlier session from the transcript of the latest session that held it, part by
      part (613.2). One predicate in `guppi/lint.py` finds a reading by hand tied to "the first ... after
      the render" or "the first ... after the change". `make lint` and `pre-spec` both use it (613.1).
      The waiting Estimates, and the passed ones in the old wording, get their `method` line rewritten.
      The person did not choose a bulk `passed`: a reading line with no reading behind it is a false record.


      These facts come from the searches:

      - A Grep of `^status: (pending|failed)` over `vault/wiki/estimates/` printed 38 files. 613.3 rewrites
      27 of them, and 11 keep their method.

      - A Grep of `^method:.*\bfirst\b.*after the (render|change)` over `vault/wiki/estimates/` printed
      21 files. Ten of them are waiting Estimates. Ten are passed Estimates, which 613.3 rewrites. The
      last is `estimate-hi-takes-its-readings`, which 613.2 rewrites.

      - 613.3 also rewrites 17 waiting Estimates that tie their reading to a one-off moment in other words,
      such as "the first /retro" or "the first compaction".

      - A Grep of `^method:.*\bfirst\b` over the same folder printed 64 files. A passed Estimate among
      them that does not match the pattern stays as it is.


      The 11 waiting Estimates that keep their method fall into two groups:

      - Eight name no one-off moment: `estimate-end-of-work-order`, `estimate-event-log-records`, `estimate-ask-finds`,
      `estimate-plan-mode-verified`, `estimate-case-build-writes-the-case`, `estimate-session-start-context`,
      `estimate-orchestration-shows-the-built-case` (case 611 has it read again) and `estimate-synthesis-clusters`
      (read `passed` at this session''s `/hi`).

      - Three are the done-conditions of `entity-sprint-migration`, read at the close of the sprint (case
      612). `estimate-sprint-migration-leftovers-gone` names the close of the sprint and `estimate-sprint-migration-merges`
      the merge to main. Both are one-off moments, but each belongs to that close and comes only once
      by design. `estimate-sprint-migration-lint-clean` names `make lint`. All three keep their method.


      This session changes the Estimates of 613.3, so none of them is read in this session. The ledger
      hook refuses such a reading, and they are read from the next session on.


      These texts and Estimates were checked against the frame:

      - The new finding is a class of its own, `moment`. So `estimate-lint-checks-the-method` keeps its
      Criterion: it speaks of the `method` finding of the forms.

      - `estimate-prespec-catches-a-method-without-a-form` keeps its Criterion: it speaks of the line
      "method names no form".

      - `estimate-lint-catches` lists other classes and stays as it is.

      - `estimate-estimates-schema-checked` speaks of the lists of `schema.yaml`, not of the prose of
      `method`, and stands.

      - Three lines of the old Criterion of `estimate-hi-takes-its-readings` are not carried into 613.2,
      on purpose. They are the line on which readings `/hi` takes, the line on where it reads them, and
      the line that a later moment waits. 613.2 replaces each of them.

      - The check of the answer notes that the `then` of 613.3 shares words with the `then` of 613.1 and
      613.2. 613.3 rewrites the methods that 613.1 judges and that 613.2 reads, so they speak of the same
      thing.

      - Lint changes in Work Mode, but the rewritten pages land at the librarian''s run. In between, `make
      lint` shows red on them. Work Mode marks this under `## Expected red` of `work.md`, and Retro makes
      it a note for the handoff. Lint only goes red, so the check keeps no old form.

      - A Grep of `` /hi`? (takes|reads)|readings? of `?/hi|at `?/hi`? .{0,30}reading `` over the repository
      outside `vault/wiki/decisions/`, `vault/archive/` and `vault/raw/` printed 11 files. They are `glossary.md`,
      `librarian-guppi.md`, `carry/SKILL.md`, `log.md`, `entity-glossary.md`, `rule-skill-hi.md`, `estimate-carry-over-writes.md`,
      `rule-carry-over.md`, `rule-brief.md`, `estimate-hi-takes-its-readings.md` and `lesson-carry-short-brief-drops-the-work-list.md`.
      `log.md` was not read. The others outside this Case speak of where `/hi` takes its Work list, or
      of the sprint, and stay true.

      - A Grep of `first reply|previous session|transcript of` over `vault/wiki/rules/` printed seven
      files. They are `schema.yaml`, `rule-internal-context.md`, `rule-orchestration.md`, `rule-retro-onward.md`,
      `rule-rules-schema.md`, `rule-skill-hi.md` and `rule-case-protocol.md`. `rule-orchestration` defers
      the form of the first reply of `/hi` to `rule-skill-hi`. The other hits speak of the handover, of
      a refusal and of History, and stand.

      - The Work readings of `rule-work-mode` take what `/hi` leaves, and do not change.

      - Cases 611 and 612 change no page of this Case and set nothing at `/hi`.

      - The Case makes no `create` without a `ref`. A Glob of `vault/**/estimate-lint-reports*` printed
      no file, so the new slug is free.


      Not done: an Estimate whose event is rare still waits for it, and the close of a sprint settles
      it (case 612.4). An Estimate that pairs tests with a check by hand keeps one reading. The 11 waiting
      Estimates named above keep their method.'
