  fields:
    type: insight
    pattern: The closers of a Frontier line are listed for an item the session's own plan ends; an item
      left whose end stands elsewhere — on the sprint page for a later session, or in a defer of the conserved
      Spec the session takes — has no closer, and the agent closes it `work` by its own judgment, a form
      the check accepts and the reader misreads
