  sections:
    Criterion: 'When:

      `uv run guppi prespec --check <plan>` reads the session''s `vault/raw/<date>/<HHMM>/frontier.md`,
      and the title line of `<plan>` may name the `vault/raw/<date>/<HHMM>/spec.md` of a folder that holds
