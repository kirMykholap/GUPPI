  case_text:
    given: '`entity-reading-probe` — the test page this sub-case deletes

      **＋** `decision-case-614` — the Decision page whose `create` list keeps the slug

      **＋** `rule-page-generation` — `guppi generate` applies a `delete` at the librarian''s run

      **＋** `rule-cleanup` — `guppi cleanup` moves an archived page under `vault/archive/`

      **＋** `rule-lint` — `guppi lint` reports a live page off its schema or named by no page'
    when: The librarian's run after this session runs `guppi generate` over the `delete` of `entity-reading-probe`,
      after the `update` of Case 619.1, and then runs `guppi cleanup` and `guppi lint`.
    then: '`entity-reading-probe` stands `archived`, with History `deleted` after its `reworded` line.

      **＋** `guppi cleanup` moves `entity-reading-probe` under `vault/archive/`, with its History.

      **＋** `guppi lint` reports no `schema` and no `orphan` finding on `entity-reading-probe`.

      **－** The `create` list of `decision-case-614` keeps the slug, and `guppi lint` reports no `ref`
      finding for it.'
    context: 'The last session created the test page `entity-reading-probe` to bring on readings that
      wait for their moment (case 614). Its `## Purpose` holds the made-up word `quillwort` and the word
      `bramblewort`. A reword is an `update` item that carries `{old, new}` pairs. At the librarian''s
      run, `guppi generate` replaces each pair as a whole word on every live rule, entity and estimate.
      The page of the item is the owner, and its text must hold each `new`. The reword has never run live.
      `estimate-generate-rewords` stands `pending`, and its live leg waits for a librarian''s run that
      applies a reword. While the test page is live, `make lint` reports two findings on it, `schema`
      and `orphan`. `estimate-sprint-migration-lint-clean` needs `make lint` to exit 0 at the close of
      the sprint. Case 614 could not do the reword in its own session, because the pair check of `guppi/prespec.py`
      loads only the pages on disk. That gap still stands, and this Case does not fix it.


      This Case does the reword and then deletes the page. The two steps are two sub-cases, and both run
      at the librarian''s run after this session. The docstring of `guppi/generate.py` says it applies
      the entries of a yaml in order. The decision line of 619.1 comes before the line of 619.2, so the
      reword runs on the live page and then the delete sets it `archived`. `guppi cleanup` (`rule-cleanup`)
      then moves the page under `vault/archive/` with its History. Its `reworded` History line therefore
      stays readable. So do the `log.md` line and the stdout line of the run. If the reword fails and
      the delete applies, a later `update` still reaches the archived page, because `generate` finds a
      slug that is not under `vault/wiki/` in the archive. `check_items` of `guppi/prespec.py` keys each
      item by its kind and slug, so an `update` and a `delete` of one page in one Spec are no finding.


