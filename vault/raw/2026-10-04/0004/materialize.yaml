      `brief.md` and `entities/entity-reading-probe.md`. A reword never touches `brief.md`, so the pair
      hits the test page alone. The owner''s `## Purpose` holds `bramblewort`, so the check of the owner''s
      text passes, and the pair check of `guppi/prespec.py` finds the pair on a live page. The Grep `quillwort|bramblewort|reading-probe`
      (case-insensitive) over `vault/wiki/` printed five files: `brief.md`, `log.md`, `entities/entity-reading-probe.md`,
      `estimates/estimate-plan-mode-verified.md` and `decisions/decision-case-614.md`. The hit on `estimate-plan-mode-verified`
      stands in its `## Result`, a record that a reword skips and a delete leaves true. The hit on `decision-case-614`
      is its `create` list, a record. Its `ref` check in `guppi/lint.py` accepts a slug that an archived
      page carries. The hits in `brief.md` and `log.md` were not read. The Grep `reword` over `vault/wiki/rules/`
      printed `rule-case-protocol`, `rule-materialize` and `rule-page-generation`. Each describes how
      a reword pair is written, carried or applied, and this Case follows each as it stands. The same
      Grep over `.claude/` printed nothing. `rule-page-generation` carries `deferred_by` `decision-case-469`.
      Its Problem is whether a supersede of an archived Decision keeps `archived`, and that does not touch
      this Case.


      Done means the following. `estimate-generate-rewords` reads the librarian''s run that applies the
      pair. Its Criterion describes exactly that run, so it stands. Its reading comes at the next `/hi`
      through the Work list of the brief, since this Case does not set it `pending`. The delete is checked
      by `estimate-generate-writes` (a `delete` sets `archived` with History `deleted`) and `estimate-cleanup-moves`.
      Both Criteria stand, because the delete is the kind of entry each describes. At the close of the
      sprint, `estimate-sprint-migration-lint-clean` reads `make lint`, and its Criterion stands. The
      Criteria of `estimate-entities-schema-checked` and `estimate-lint-finds-a-broken-link` speak of
