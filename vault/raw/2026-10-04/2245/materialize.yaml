      or `estimate-case-check-sends-back-a-ratified-case-in-another-shape` by its method.
    then: 'The method is a run of pytest over `tests/test_casecheck.py` with the selector of that Estimate,
      and the reading can be taken at any time.

      **－** No live answer of `case-guppi` that the hook sends back is part of the reading.

      **－** The Criterion and the status of each of these Estimates stand.'
    context: 'Seven Estimates are `pending` because the second half of each method waits for a live event
      that seldom comes. Five of them check the `SubagentStop` hook `uv run guppi casecheck --subagent`
      of `rule-case-check`. Four of these five wait for a live answer of `case-guppi` that the hook sends
      back for that one reason. The fifth, `estimate-case-check-sends-back-a-clash-with-another-case`,
      also waits for the main agent''s question to the person after a clash and its `SendMessage` on a
      yes. In session 2041 the hook sent `case-guppi` back for other reasons only, so none of these readings
      came. `estimate-lint-runs-every-step` waits for a Baseline whose backlog step is red. No session
      has had one, and case 631 put off the question of a method that stages one. `estimate-session-start-context`
      waits for a session opened without `/hi` whose reply carries a `LEDGER` block, and no such session
      followed the `/hi` of 2041. While they stay `pending`, the closing Case of the sprint `migration`
      must read each one or name it by `--carry` or `--archive-unread` (case 628.2).


      The test half of each case-check method exists: `tests/test_casecheck.py` holds the tests that `-k
      lone`, `-k rounds`, `-k subagent_clash`, `-k shape` and `-k session_clash` select. The tests call
      `casecheck.run` with the payload of `SubagentStop`. The live half adds only the registration in
      `.claude/settings.json` and a real answer, and `estimate-case-check-sends-back-a-faulty-case` read
      both live on 2026-10-04. `estimate-case-check-refuses-a-letter-outside-the-script` and `estimate-case-check-refuses-a-problem-in-a-sub-case`
      are already read by pytest alone. So the four plain case-check Estimates keep their Criteria, with
      methods of pytest alone (637.1).


      The Criterion of the clash Estimate is replaced whole without two lines (637.2). One is the trigger
      line on the main agent getting the answer that passed. The other is the line on what `case-guppi`
      and the main agent do when another Case should change instead. The hook sends a note on each of
      the two lines, and both are dropped on purpose, as chosen in the round. Its `purpose`, which names
      that step, and its `method` are set anew. The main agent''s half of the step stays as text in `vault/wiki/orchestration.md`.
      The other half, where `case-guppi` changes its own Case and names the other one in `context`, stood
      in no live page. A Grep of `should change|bounded around` over the repository, leaving out `vault/raw/`,
      `vault/archive/` and `vault/wiki/decisions/`, printed `vault/wiki/orchestration.md`, `vault/wiki/log.md`,
      `vault/wiki/rules/rule-orchestration.md`, `vault/wiki/estimates/estimate-orchestration-asks-in-the-grill-me-shape.md`
      and `vault/wiki/estimates/estimate-case-check-sends-back-a-clash-with-another-case.md`. A Grep of
      `clash` over `.claude/agents/case-guppi.md` printed nothing. So 637.2 adds that half to the Render
      of `rule-case-build`, after the sentence on findings the hook sends back. As chosen at pre-spec,
      it has no check of its own, like the main agent''s half. The Criterion of the clash Estimate is
      therefore written under `sections.Criterion`, so the `case-guppi` line of the `then` of 637.2 stays
      out of it. Of the Estimates of `rule-case-build`, `estimate-case-build-writes-the-case` covers the
      moment the hook sends findings back, but its Criterion speaks of the form of the answer again, not
      of what the Case changes, so it stands. Case 636 replaces another sentence of `rule-case-build`,
      the one on a claim of `context` about a search, and sets the step just before an answer with a Case.
      The new sentence sits in a later paragraph and covers an answer again after a clash finding, so
      the two texts do not meet.


      A Grep of `clash` over `vault/wiki/estimates/` printed `estimate-case-build-checks-the-finished-case.md`,
      `estimate-prespec-reconciles.md`, `estimate-orchestration-asks-in-the-grill-me-shape.md`, `estimate-case-check-sends-back-a-case-number-held-by-another-agent.md`
      and `estimate-case-check-sends-back-a-clash-with-another-case.md`. `estimate-orchestration-asks-in-the-grill-me-shape`
      checks only the shape of the main agent''s question after a clash, so the send on a yes has no check
      of its own. The first two are about pre-spec and the checks of `case-guppi`, and the fourth names
      only its own `-k subagent_clash`. All three stand.


      No test runs `make lint` now. New tests in `tests/test_lint.py` run the real target of the `Makefile`
      with a fake `uv` first on the search path, once with a red backlog step and once with every step
      green (637.3). The Criterion of `estimate-lint-runs-every-step` names who runs `make lint`, and
      that list has no test. So the Criterion is replaced whole: it gets one trigger line for each test
      run, and every other line is carried word for word. Its `purpose` stands. The sub-case takes up
      the defer of case 631. `estimate-harness-pipeline` (`passed`) asks that `make test-harness` be green
      and that the steps of `make lint` before `guppi lint` exit 0 on the committed tree. The new tests
      join `make test-harness` and must pass there. They run the steps in a temp folder with a fake `uv`,
      never on the committed tree, so its Criterion stands.


      `rule-session-start` is a MOC, so the method of `estimate-session-start-context` must be a `make`
      target, and `make test-session-start` alone meets that (637.4). Its refusal path is held in `tests/test_ledger.py`.
      Both live readings passed on 2026-09-09, but on the old Criterion. Case 485.1 replaced that Criterion
      whole on 2026-09-28, and the page has stood `pending` since. The new Criterion only moved the ledger
      into the session folder, and this session''s ledger is written to `raw/2026-10-04/2245/ledger.md`,
      so the make target alone stands as chosen.


      A Grep of the seven slugs over `vault/wiki/` printed 29 files. Outside `decisions/` these were `brief.md`,
      `log.md`, `estimate-case-check-sends-back-a-case-number-held-by-another-agent.md`, `rule-case-check.md`,
      `rule-lint.md`, `estimate-case-build-records-the-rounds-in-recommend.md`, `rule-session-start.md`
      and `insight-workflow-contract-change-leaves-its-derived-text-stale.md`. The other 21 files are
      Decision pages, which state their own moment. Each hit read stays true: the rules list the Estimates,
      the promise of `estimate-case-check-requires-each-question-of-the-rounds` stands, and the Insight
      names an old Criterion. The new methods land at the librarian''s run, so each Estimate is read at
      the next session by its new method (case 428.1). 637.1 and 637.4 set no Estimate `pending` and are
      checked by those readings. 637.2 and 637.3 carry a read line.'
