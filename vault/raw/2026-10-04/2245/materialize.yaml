  sections:
    Criterion: 'When:

      Someone runs `make lint` of the `Makefile`: by hand, in the Baseline of `/work`, or in the librarian''s
      run of `.claude/agents/librarian-guppi.md`.

      **＋** Or `tests/test_lint.py` runs `make lint` of the `Makefile` in a temp folder, with a fake `uv`
      first on the search path that records each call and fails the step `guppi backlog --check`.

      **＋** Or `tests/test_lint.py` runs it the same way, with a fake `uv` that exits 0 for every step.


      Then:

      `make lint` runs all five steps in the order `guppi render --check`, `guppi sprint --check`, `guppi
      backlog --check`, `guppi glossary --check`, `guppi lint`, whether an earlier step exited 0 or not.

      **＋** Each step prints its own lines as it does when it runs alone, so a red step hides no finding
      of a later step.

      **＋** `make lint` exits non-zero when any step exits non-zero, and 0 only when every step exits
      0.

      **－** No step reads the stdin of its caller, and `make lint` writes nothing to the tree.'
