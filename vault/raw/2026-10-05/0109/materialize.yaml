  sections:
    Criterion: 'When:

      `/pre-spec` has reported findings that sent Cases of the plan back, and every `case-guppi` that
      got a finding has answered with its Case built again, with `.claude/skills/pre-spec/SKILL.md` rendered
      from `rule-prespec` and `.claude/agents/ask-guppi.md` rendered from `rule-ask`.


      Then:

      The main agent sends each `ask-guppi` run whose findings sent a Case back the Cases built again
      on them, by `SendMessage`, all in one message, and asks only whether each of its findings is closed.

      **＋** For each finding of its own, under the finding''s number, each `ask-guppi` answers with a
      line that holds `closed` or `not closed`, and under it at most a short paragraph of up to three
      sentences on why.

      **＋** After the findings stands one list of what the agent did not check in confirming them. The
      list says "none" when it checked all of it and its searches broke no rule. Its last lines name each
      rule that a search of the agent broke, one line each, and say whether a verdict rests on what that
      search printed. Then stands a list of the paths of the files the agent read, and nothing else stands
      before or after.

      **＋** The main agent asks the person a question after the confirmation, in the shape of `.claude/skills/grill-me/SKILL.md`:
      whether each finding not closed is fixed or left; it sends a finding to be fixed to the `case-guppi`
      of its Case.

      **＋** It then shows every Case built again in one reply, for one ratification, and writes what the
      confirmation found closed and not closed in its own text after the horizontal rule.

      **－** The message of the main agent invites no new finding and no new judgment of a Case beyond
      those findings.

      **－** No Case goes to `ask-guppi` a second time, and no new `ask-guppi` is dispatched.

      **－** The answer of `ask-guppi` names no new finding; it runs no Grep, the Grep of the rules included,
      and reads only the Cases built again and the pages its findings name.

      **－** After that ratification the hook of `rule-prespec-onward` sends the agent to the check and
      the exit, as before.'
