      `rule-page-generation.md`, `rule-orchestration.md`, `rule-case-protocol.md` and `rule-prespec-onward.md`.
      The hits in `rule-spec-write.md`, `rule-case-protocol.md` and `rule-prespec-onward.md` are History
      lines. The hit in `rule-page-generation.md` is the sentence above, which stays true. The hit in
      `rule-orchestration.md` is the paragraph this Case extends. A Grep of `ratified again|re-ratification|mark
      added` over `.claude/` printed nothing, so no harness file sets a form for these lines. Case 672
