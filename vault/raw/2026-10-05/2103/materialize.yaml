      `{supersedes:case …}` marks added. `guppi generate` applied the first line of each pair and printed
      for the second that it repeats the first, with nothing applied. The marks still retired 659, 630,
      617 and 622, since `materialize` puts the marks of every line of a Case into the record of that
      Case, and `generate` writes the Decision page from that record before it judges a repeat. The log
      of the vault shows the four pages superseded and archived, and the brief says that the three pages
      changed once. Nothing went wrong. The handoff of 1831 noted that no check catches the pair, and
      the brief made it a Frontier item.

