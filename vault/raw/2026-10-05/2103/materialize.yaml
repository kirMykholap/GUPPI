      against the vault. Until case 634.1 it sent one run over the whole plan. `lesson-prespec-one-ask-guppi-run-samples-the-spec`
      records why that changed: one run over the Spec of session 1439, about twenty sub-cases, found 10
      findings, and a later run over the same Spec found 12 more, 8 of them in sub-cases the first run
      had read. Since case 634.1 the skill sends one run per top-level Case, all at once; each judges
      its own Case and reads the others only for a clash. At the `/pre-spec` of session 0109 the person
      said that the check of the whole plan worked better, and case 643 put the question off as the placeholder
      `rule-prespec-judges-the-spec-whole`. In this session the person weighed the two ways. No record
      measures the cost of the per-Case runs or compares the two ways on one Spec; the vault records two
      costs of a single run only, 88 728 tokens in 204 s and 95 tool calls in about eight minutes. The
      person judged the per-Case runs too costly for an unclear benefit, chose to go back to one run,
      and said to think further later.

