      leave open together, a report that still never says the whole Spec is checked, and the placeholder
      kept in the backlog with its purpose rewritten for the later thought. The Case is cut by `rule-atomicity`:
      674.1 changes the skill and the agent frame and replaces the Criterion of `estimate-prespec-reconciles`;
      674.2 changes the one sentence of `rule-orchestration` and replaces the Criterion of `estimate-orchestration-shows-the-built-case`,
      whose line on the dispatch it makes false; 674.3 keeps the placeholder. No measurement of the cost
      of a run is added, and none is done.

      The vault''s answer: the Case creates no page, so no vault query on a `create` ran. The Frontier
      line has the source `backlog`, and `rule-prespec-judges-the-spec-whole` carries `deferred_by` the
      Decision of case 643, whose page holds no `## Problem`. 674.3 names the page on an `update` that
      carries `{supersedes:case 643}`, and defers it again by its own `defer` line; `guppi generate` adds
      the new Decision to `deferred_by` and clears only the Decision of case 643 from it, so the page
      stays in `## Deferred` of the backlog. `estimate-backlog-renders` checks that a page with `deferred_by`
      stands there with its `purpose`; its Criterion does not change, so it stands and checks 674.3.

      The frame. A Grep of `per top-level Case|for each top-level Case|ask-guppi` runs?|ask-guppi runs?|find
      a clash` over `vault/wiki/` printed 16 files: `backlog.md`, `orchestration.md`, `log.md`, `rules/rule-prespec.md`,
      `rules/rule-orchestration.md`, `rules/rule-ask.md`, `rules/rule-prespec-judges-the-spec-whole.md`,
      `estimates/estimate-prespec-confirms-the-findings-once.md`, `estimates/estimate-case-build-checks-the-finished-case.md`,
      `estimates/estimate-orchestration-shows-the-built-case.md`, `estimates/estimate-ask-finds.md`, `estimates/estimate-prespec-reconciles.md`,
      `estimates/estimate-orchestration-asks-in-the-grill-me-shape.md`, `lessons/lesson-ask-search-exclusion-of-decisions-left-to-each-agent.md`,
      `lessons/lesson-orchestration-dispatch-prompt-carried-counts-not-from-a-run.md` and `lessons/lesson-prespec-confirmation-prompt-invites-a-new-finding.md`.
      Over `.claude/` it printed `.claude/skills/pre-spec/SKILL.md` and `.claude/agents/ask-guppi.md`,
      and over `guppi/` it printed `guppi/casecheck.py`. The rules, their rendered files, the placeholder,
      and the `method` of `estimate-case-build-checks-the-finished-case` enter the Case; `backlog.md`
      is written by `guppi backlog`, and `log.md` was not read. The three lessons and the Result line
      of `estimate-ask-finds` record past runs, and the hit in `guppi/casecheck.py` speaks of the top-level
      Cases of an answer of `case-guppi`; they stand. Step 6 of the skill and `estimate-prespec-confirms-the-findings-once`
      send each run whose findings sent a Case back its Cases built again; with one run that is the one
      run, so both stay true and the Criterion stands. `estimate-orchestration-asks-in-the-grill-me-shape`
      names the question after the runs confirm their findings; it speaks of the shape of that question,
      not of the number of runs, so it stands. `estimate-ask-finds` promises the form of the answer, whose
      first line names the Cases the run checked; that stays true of one run, so it stands.

      The other rules of the moment of `/pre-spec`, `rule-prespec-hook` and `rule-prespec-onward`, act
      on the check and the exit, not on the dispatch, and this Case does not cover them. Cases 672 and
      673 of this session update other paragraphs of `rule-orchestration`, on who ticks which box and
      on the acknowledging reply; 674.2 changes neither paragraph. The skill and agent texts change at
      the librarian''s render, so the `/pre-spec` of this session still sends one run per Case. By case
      670 the Retro of this session reads `estimate-prespec-reconciles` and `estimate-orchestration-shows-the-built-case`
      on the new text of the Spec. Their old `method` lines read a live `/pre-spec` and the transcript
      of a session''s close, which in this session still show one run per Case; by case 670.4 a method
      holds only what runs in the Case''s own session, so both are set anew to a reading at Retro of the
      new Render in the Spec, as Case 672 does for its Estimate. The `purpose` of `estimate-orchestration-shows-the-built-case`
      does not state the number of runs, and `estimate-prespec-reconciles` has no `purpose`, so neither
      is set anew.'
