      The main agent dispatches `case-guppi` with the Case id, the Frontier item and its source, and the
      person''s words on it, in the prompt of the call, after the plan file stands with its title line;
      nothing of the Case stands in the chat before the answer.

      **＋** The person''s answers to a round go to the same `case-guppi` by `SendMessage`, verbatim and
      untranslated, and so does a question or a change of the person on a shown Case that is not a request
      for a plain explanation.

      **＋** A request for a plain explanation of a round, of the short text on a Case or of a reply the
      main agent answers itself by `.claude/skills/wait-what/SKILL.md`; it sends the `case-guppi` of the
      Case a `SendMessage` only to ask for a fact of the Case, and `case-guppi` answers with the fact
      alone, under a first line `**Fact:**` and with no Case heading.

      **＋** An answer with no first line `**Built:**` and no first line `**Fact:**` is a round of questions:
      the main agent shows it in the chat translated into Russian line by line, slugs, paths and quotations
      unchanged, each quotation in its blockquote — the `**Context:**` paragraph that opens the first
      round on an item translated in place before the first question, each question in the order and with
      the number of the answer, opening with its `❓ **Qn** - **<title>**:` line of `.claude/skills/grill-me/SKILL.md`
      and closing with its `➡️` line, its title, body and recommended answer translated in place, nothing
      merged, dropped or added between the questions, the agent''s own text after the last question and
      one horizontal rule; no Case is shown, no file is sent, and no step of confirmation follows the
      last round.

      **＋** The main agent shows a built Case at every showing by `SendUserFile` with `display: render`
      on `raw/<date>/<hi HHMM>/cases/case-<N>.md`, the file `case-guppi` wrote and the hook of `rule-case-check`
      checked. In the same reply it writes the heading of the top-level Case: its id, and its name in
      Russian translated from the `**Case:**` line of the summary `case-guppi` answered with. Under the
      heading it writes one list with an item per Case and sub-case of the summary: its id, its name in
      Russian, and a short text in Russian on what done means and how it is checked, taken from the Estimate
      the summary names for it. Then it writes one `ratification` with the ledger lines of every Case
      of the list as the summary holds them, and its own text after one horizontal rule. A summary in
      which a Case names no such Estimate goes back to its `case-guppi` by `SendMessage` before the Case
      is shown.

      **＋** A Case whose item in the summary carries a line `**Other Case:**` is shown as it stands, and
      the main agent asks the person whether that other Case is built again.

      **＋** A reply that shows a Case and that the `Stop` check of `rule-case-check` refuses is followed,
      before the person answers, by a reply that sends the file and shows the `ratification` as the summary
      holds it; a reply that shows a round and that the `Stop` check refuses is followed, before the person
      answers, by a reply that shows the round again with nothing before its `**Context:**` paragraph
      or its first question.

      **＋** A ratified Case that changes — in its prose or in its body — changes through its `case-guppi`,
      and its new file is sent and ratified again; the main agent edits no Case in the plan file or under
      `cases/`.

      **＋** An item that needs no decision the main agent closes alone, with no dispatch; it dispatches
      `ask-guppi` only at pre-spec, one run over the whole plan at its first run, never to build a Case,
      and asks that run again only to confirm its own findings.

      **－** The main agent writes the heading, the list, the `ratification` and the question on another
      Case from the summary, and does not read the file of the Case.

      **－** The heading carries no name of the main agent''s own and not the words of the Frontier item.

      **－** The main agent writes no context of its own before the first question of a round.

      **－** The main agent writes no `given`, `when`, `then` or `tasks` of a built Case into the chat.

      **－** A deferred decision in the short form is written by the main agent in English in the chat,
      with no dispatch and no file.'
