      checks that a body already in the ledger is not written again, which is why a marked line, a new
      body, is written. Their Criteria stay true, so they stand. `estimate-orchestration-acknowledging-reply`
      says that the ledger hook does not append a repeated decision line a second time; a line with a
      mark added is not a repeat of the first line''s text, so that line stays true and the Criterion
      stands. `estimate-orchestration-loaded` promises that the file equals the Render, that it holds
      what the main agent alone does, and that `CLAUDE.md`, `case-schema.md` and `ratification.md` repeat
      no paragraph of it. The new sentence keeps all three true, so its Criterion stands (case 378.5).

