      line with no mark; this Case does not take it up, and it stands. The Frontier line of this item
      has the source `brief`, so no supersede mark is due.'
    problem: A Case ratified again with a mark added to a decision line leaves two lines for one decision
      in the ledger. The rule of `generate` says that this is expected and harmless, but the main agent
      does not read that rule. So the handoff reports the pair as a gap, and the pair comes back as a
      Frontier item.
    recommend: "- **Whether anything changes for a ledger line written again with a mark added**\n  -\
      \ Recommended: (a) one sentence in the orchestration file the main agent loads: the marked line\
      \ stands beside the first, the page changes once, and the mark still retires the older decision;\
