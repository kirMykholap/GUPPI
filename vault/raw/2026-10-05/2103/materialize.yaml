    given: '`rule-orchestration`: its Render says what the reply that acknowledges a re-ratification carries.

      **＋** `vault/wiki/orchestration.md`: the file rendered from `rule-orchestration`.

      **＋** `rule-page-generation`: the rule of `generate`, whose repeat changes a page once.'
    when: The main agent reads `vault/wiki/orchestration.md`, rendered from `rule-orchestration`, after
