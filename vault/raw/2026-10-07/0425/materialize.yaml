      **＋** When no line under `## Cases` is open after `/pre-spec`, no question follows the Frontier.
      A reply with a `LEDGER` block ends with the Frontier, for the hook of `rule-prespec-onward` to send
      the agent on. A reply with no `LEDGER` block goes on by itself after the Frontier, to the check
      and the exit or on with the loop after the findings, as `rule-prespec` sets it.

