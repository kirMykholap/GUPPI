    status: pending
    purpose: Whether guppi onward --plan, after /pre-spec, sends the agent to the check and the exit only
      when a file under cases/ that holds more than blank space was written after the last prespec line
      of the session, and on with the loop after the findings when none was; the emptied file of a dropped
      Case counts as none
  change: the Criterion replaced whole — the emptied file of a dropped Case is no Case built again after
    /pre-spec (case 701.2)
  sections:
    Criterion: 'When:

      The `Stop` hook `uv run guppi onward --plan` of `guppi/onward.py` receives the end of a reply of
      the main agent that carries a `LEDGER` block, the event log holds a `prespec` line of this session
      after its `hi`, and every other condition holds under which the hook sends the agent on.


      Then:

      When a file under `raw/<date>/<hi HHMM>/cases/` was written after the last `prespec` line of the
      session, the hook exits 2 and tells the agent that the Cases built again on the findings of `/pre-spec`
      are ratified, to run `uv run guppi prespec --check` on the plan file with `--session <id>`, to fix
      what it prints, and to call `ExitPlanMode` when it prints no finding.

      **＋** When no file under `cases/` was written after that line, the hook exits 2 and tells the agent
      to go on with the loop after the findings of `/pre-spec`: to send each finding in a Case to its
      `case-guppi`, or, when no Case goes back, to run the check and exit as above.

      **＋** The hook reads the time of the `prespec` line, on the date of the event log that holds it,
      through the one function of `guppi/prespec.py` that `window` uses to find the line.

      **＋** One function of `guppi/casecheck.py` tells whether a file under `raw/<date>/<hi HHMM>/cases/`
      holds nothing but blank space, both for this judgment and for the judgment whether a Case is still
      out.

      **－** A reply that writes a defer or a lesson after `/pre-spec` and before any Case is built again
      never gets the message that the Cases built again are ratified.

      **－** A Case built again and not yet ratified keeps the hook silent, as before.

      **－** An emptied file under `cases/`, the file of a dropped Case, is never taken for a Case built
      again after the `prespec` line, whatever its time: with no other file written after that line, the
      agent is sent on with the loop after the findings.'
  applied: 06:23:42
