  text: decision[case 702][create][estimate-spec-write-reads-a-new-tag]{ref:rule-spec-write}{tags:hooks,harness,workflow}
  case: '702'
  kind: create
  slug: estimate-spec-write-reads-a-new-tag
  origin: raw/2026-10-07/0425/ledger.md#case-702
  decision: decision-case-702
  ref: rule-spec-write
  tags:
  - hooks
  - harness
  - workflow
  category: estimates
  fields:
    kind: QA
    purpose: Whether the Spec hook turns a tag line of a Case file into an entry of new_tags in the then
      block, leaves it out of the tasks block, and refuses a tag line off the form, and whether the check
      of the Case file reads the line alike
    method: uv run pytest tests/test_ratified.py tests/test_casecheck.py -k tag
    tags:
    - hooks
    - harness
    - workflow
    type: estimate
  sections:
    Criterion: 'When:

      The `Stop` hook `uv run guppi ratified` of `guppi/ratified.py` writes into the plan file a ratified
      Case whose `tasks` in `raw/<date>/<hi HHMM>/cases/case-<N>.md` hold a line `` - [ ] tag `<tag>`
      ``.

      **＋** Or the `SubagentStop` hook `uv run guppi casecheck --subagent` of `guppi/casecheck.py` checks
      that file.


      Then:

      A task line that opens with `tag` and the tag in its first code span, with the sub-points `meaning`
      and `aliases`, each one code span, becomes one entry of the key `new_tags` in the block tagged `then`:
      its `tag`, `meaning` and `aliases`.

