      writes it.

      **＋** The person''s words asking for the defer are its ratification: no question asks for it.

      **＋** The reply shows the Frontier of `raw/<date>/<hi HHMM>/frontier.md` after the Case, with the
      line of the item closed `[-] … · defer case N`.

