  case_text:
    context: 'After `/pre-spec`, the hook of `rule-prespec-onward` sends the agent on by itself only when
      no Case is still out. `case_out` of `guppi/onward.py` counts a Case as out when its file under `cases/`
      was written after its last decision line, and it counts a file whose Case has no decision line as
      out unless a supersedes mark retires it. A Case that is built and then dropped never gets a decision
      line, so its file keeps the hook silent for the rest of Plan Mode. In session 0211, Case 698 was
      first built again as a new Case 700, the check refused that build, and the Case was built again
      under 698; `raw/2026-10-07/0211/cases/case-700.md` stayed behind as an empty file, and the handoff
      of that session says that no ledger line names it. The Insight `insight-prespec-onward-a-case-ended-with-no-decision-line-stays-out`
      joins this lesson with the lesson of a Case ratified again with unchanged lines. Case 604 already
      closed that second cause: the History of `rule-prespec-onward` records that a Case is judged out
      by the decision lines of every reply of the transcript, so a re-ratification with unchanged lines
      counts for the rest of the session, and `transcript_replies` of `guppi/onward.py` reads every reply
      so. The person chose that an empty Case file counts as no Case and that this Case sets the Insight
      `actioned`. `case-guppi` has the tools Read, Grep, Glob, Write and Edit and no tool that removes
      a file, so it empties the file by `Write` of empty text, as it did for Case 700. The person also
      chose that the main agent sends the drop of a Case to its `case-guppi` when the person puts off,
      keeps or drops its item, and that the emptying is checked by `estimate-case-build-writes-the-case`.


      The frame sets these bounds. A Case with a decision line is never emptied: `guppi/generate.py` puts
      `## Problem` and `## Recommend` on the Decision page and leaves `context` and `given` in the Case
      file. So a ratified Case that was sent back for a change and then dropped still keeps the hook silent;
      this is left not done. The drop adds no closer of a Frontier line: the item closes by one of the
      closers `orchestration.md` already sets, as fits what the person chose for it. At `/pre-spec` the
      person chose that the turn of the person''s words ends with one `**Waiting:**` line, and that the
      reply that puts off or keeps the item comes in the turn that the answer `**Dropped:**` opens. `orchestration.md`
      says that no tool call follows a `LEDGER` block in the same reply, and the hook judges the file
      at the end of that reply, so the file must be empty by then. The hook of `rule-case-check` reads
      a `**Dropped:**` answer as neither a round nor a summary: `is_round` needs a line that opens with
      `❓`, and `is_summary` needs a first line `**Built:**`. An empty file splits into no Cases, so the
      check of the file stores nothing for it. `estimate-case-check-sends-back-a-faulty-case` therefore
      stands: it reads each file a `Write` of `case-guppi` names and reads no Case from an answer without
      a Case heading, and an empty file and a `**Dropped:**` answer fit both lines. A dropped Case keeps
      its entry in `<plan>.checked.json`, and `other_blocks` of `guppi/casecheck.py` would still compare
      it with a later Case, so Case 701.7 leaves it out. One function of `guppi/casecheck.py`, the module
      that owns `is_case_file` and `case_file`, judges an empty Case file, and `guppi/onward.py` imports
      it. The hooks read the file from the working tree at once, and `case-guppi` empties files only after
      the render. In between no hook refuses anything or loses anything, so no hook keeps an old form.


      A Grep for `` no first line `\*\*Built:\*\*` `` over `vault/wiki/` printed `vault/wiki/orchestration.md`,
      `vault/wiki/rules/rule-orchestration.md` and `vault/wiki/estimates/estimate-orchestration-shows-the-built-case.md`,
      and over `.claude/` printed nothing; Case 701.4 changes the first two through the Render and replaces
      the Criterion of the third. A Grep for `(?i)\bputs? off\b` over `vault/wiki/rules/` printed `rule-orchestration.md`,
      `rule-case-protocol.md` and `rule-skill-hi.md`, and over `.claude/` printed `.claude/skills/hi/SKILL.md`.
      The hits in `rule-case-protocol.md` are History lines. The hits in `rule-skill-hi.md` and `.claude/skills/hi/SKILL.md`
      set the closers of a Frontier line at `/hi`, and those closers stay. The hits in `rule-orchestration.md`
      set the reply that puts off an item, and Cases 701.5 and 701.6 change that reply. `estimate-prespec-onward-sends-the-agent-on`
      stands, since it takes a Case still out as `rule-prespec-onward` judges it. Each replaced Criterion
      keeps its old lines word for word, except the lines that change on purpose. The sibling sub-cases
      share words because they carry whole Criteria of the same hook and the same agent, and because 701.3
      to 701.6 describe one drop from each side; their promises stay apart.'
    problem: After `/pre-spec`, a Case that was built and then dropped keeps the hook of `rule-prespec-onward`
      silent for the rest of Plan Mode, because its file has no decision line, and the person has to push
      the agent on by hand.
    recommend: "- **How the hook learns that a Case was dropped**\n  - Recommended: (a) an empty file\
