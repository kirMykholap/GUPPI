      as a checklist, in the form that `estimate-orchestration-acknowledging-reply` sets.

      **＋** In the checklist the closed lines are folded into one line, and the lines put off stand as
      they are closed.

      **＋** The open `W` lines are folded into one line that lists their ids.

      **＋** Each other open line stands on its own line with a short title.

      **＋** While a line under `## Cases` of `raw/<date>/<hi HHMM>/frontier.md` is open, a question follows
