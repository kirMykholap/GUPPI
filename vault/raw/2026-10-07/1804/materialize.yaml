- case: '716.1'
  decision: decision-case-716.1
  origin: raw/2026-10-07/1804/ledger.md#case-716.1
  targets:
  - kind: update
    category: estimates
    slug: estimate-case-build-writes-the-case
    ref: rule-case-build
  tags: []
  case_text:
    given: '`estimate-case-build-writes-the-case`: its `method` is set anew, its Criterion written back
      unchanged.

      **＋** `rule-case-build`: the rule whose Render is the agent file of `case-guppi`.

      **＋** `.claude/agents/case-guppi.md`: the agent file rendered from `rule-case-build`.

      **＋** `rule-retro`: Retro reads each Estimate its session updates, and the new Render in the Spec.

      **＋** `raw/2026-10-07/1804/cases/case-717.md`: Case 717.2 changes the Render of `rule-case-build`
      that the reading reads.

      **＋** `estimate-case-check-sends-back-a-faulty-case`: its Criterion keeps an old path until a live
      reading of `estimate-case-build-writes-the-case`; unchanged.

      **＋** `guppi/casecheck.py`: the hook that keeps that old path; unchanged.'
    when: The Retro of a session whose Spec updates `estimate-case-build-writes-the-case` takes its reading
      by its `method`.
    then: 'The reading reads the Render of `rule-case-build` against the Criterion: its new text in the
      Spec when a Case of that session changes it, and `.claude/agents/case-guppi.md` otherwise.

      **＋** The estimate line gives the tokens and seconds of each dispatch of `case-guppi` in that session,
      when there was one.

      **－** The reading waits for no dispatch of `case-guppi` after the render of `rule-case-build`, and
      for no kind of dispatch that the session did not hold.'
    context: 'The person asked whether any change to a rule or an entity sets every Estimate of it `pending`,
      even an Estimate nobody touched. The scripts do not do that. `lift_criterion` of `guppi/materialize.py`
      sets `pending` only on an `update` of an Estimate that a Case names and whose Criterion it writes;
      an `update` of a rule touches no Estimate (case 378.5). Three rules make an Estimate hang. A Case
      names each Estimate whose Criterion speaks of its change, and `/pre-spec` reports one it missed.
      A Criterion changes only whole (case 378.4). Retro reads each Estimate its session updates, or sets
      it `failed` (`rule-retro`, case 670.2). While an Estimate is not `passed`, the cascade of `guppi/generate.py`
      keeps its target `draft`, and `make lint` gives an `unread` finding for it. `estimate-case-build-writes-the-case`
      shows the cost. Its Criterion holds almost every behaviour of `case-guppi`, so almost every Case
      on that agent names it. Case 698 changed one line of it, and its History says "the other lines stand".
      The `method` waits for live dispatches after the render, and for rare kinds of dispatch. So the
      Retro of each such session could not read it and wrote it `failed`, after cases 698, 701.3 and 705.1.
      `estimate-case-build-checks-the-finished-case` hangs the same way: its `method` waits for a `/pre-spec`
      after the render. The brief carries both, as C7 and C8 of this session.


      The person chose to change the `method` of these two Estimates only, and not to split them. Each
      sub-case updates one of the two pages, which are two promises. Their `then` lines share most of
      their words because both pages take the same form of reading, as the person chose for both. The
      check of the file notes this overlap, and it stands. A rule that lets unchanged lines keep their
      last reading was not chosen. The new `method` follows the form of `estimate-retro-loads`. The reading
      is the Render of `rule-case-build`, read against the Criterion: the new text in the Spec when a
      Case of the session changes it, and `.claude/agents/case-guppi.md` otherwise. The Render paragraph
      of `rule-retro` and the Criterion of `estimate-retro-loads` already set that reading of a changed
      Render. `estimate-case-build-writes-the-case` keeps the tokens and seconds of each dispatch of the
      session. So the sentence of the Purpose of `rule-case-build` that gives the cost question to the
      `method` of its Estimate stays true. `estimate-case-build-checks-the-finished-case` keeps its count
      of the findings of `ask-guppi` at the session''s own `/pre-spec`, which runs before Retro, in the
      same way as the cost line. That `method` no longer waits for another session. Its `purpose` still
      says that the check is counted by what `ask-guppi` finds at pre-spec, which stays true, so it stands.
      The person chose that each Criterion is written back word for word and that each page goes back
      to `pending`. The Retro of this session then reads both on the new `method`, and that reading is
      the check of this Case. This Case does not change the behaviour of `case-guppi`, so no Criterion
      changes and no other Estimate of `rule-case-build` is touched. The new `method` names no later session,
      no session after another, no librarian and no `/hi`. So neither the check of a `method` the plan
      writes nor the check that Case 715 adds reports it. Case 717.2 of this session changes the Render
      of `rule-case-build`. It adds `cacheTtl: "1h"` under `experimental` to the frontmatter of the agent,
      and says what the agent reads whole and what in parts. So the Retro reading that this Case sets
      reads the new text of the Render in the Spec, as Case 717.2 leaves it. That text keeps each line
      of both Criteria true. The agent still reads `case-schema.md` and `ratification.md` whole and reads
      each page and file the `given` names, and its model, effort, tools and mode stand. It reads whole
      the case file of each Case of the session that the prompt of its call names, or that the check of
      its file names in a finding or a note. It reads in parts only the case file of a Case of an earlier
      session. The context of Case 717 judges the same and names Case 716.1. No other Case of this session
      changes `rule-case-build` or these two pages.


      A Grep for `estimate-case-build-(writes-the-case|checks-the-finished-case)` over `vault/wiki/`,
