      ````case

      ## Case 1 — The cart stands before payment


      > **context:**

      > Until now items went straight from the catalogue to payment, and a buyer could not review an order.
      The person chose a cart between the two. The pair on `entity-checkout` changes the one sentence
      of its Purpose that names where the buyer pays; there it names the payment step, which now follows
      the cart. The Criterion of `estimate-checkout-orders-the-steps` speaks of the order of the steps,
      so Case 1.1 replaces it. A Glob `vault/**/*cart*` printed nothing, so both new slugs are free.


