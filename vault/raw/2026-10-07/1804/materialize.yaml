      `vault/wiki/rules/rule-case-build.md`, `vault/wiki/estimates/estimate-case-check-sends-back-a-faulty-case.md`,
      `vault/wiki/estimates/estimate-materialize-assembles.md` and `vault/wiki/estimates/estimate-skill-grill-me-asks-in-rounds.md`.
      I did not read `brief.md` or `log.md`. The hit in `estimate-skill-grill-me-asks-in-rounds` is a
      History line. The hit in `estimate-materialize-assembles` is a Result, the record of a past reading.
      The hit in `rule-case-build` is its `estimates` list. All three stand. `guppi/casecheck.py` and
      the Criterion of `estimate-case-check-sends-back-a-faulty-case` keep an old path of the hook until
