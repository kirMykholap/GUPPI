      changes and no other Estimate of `rule-case-build` is touched. The new `method` names no later session,
      no session after another, no librarian and no `/hi`. So neither the check of a `method` the plan
      writes nor the check that Case 715 adds reports it. Case 717.2 of this session changes the Render
      of `rule-case-build`. It adds `cacheTtl: "1h"` under `experimental` to the frontmatter of the agent,
      and says what the agent reads whole and what in parts. So the Retro reading that this Case sets
      reads the new text of the Render in the Spec, as Case 717.2 leaves it. That text keeps each line
      of both Criteria true. The agent still reads `case-schema.md` and `ratification.md` whole and reads
      each page and file the `given` names, and its model, effort, tools and mode stand. It reads whole
      the case file of each Case of the session that the prompt of its call names, or that the check of
