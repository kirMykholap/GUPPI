  text: decision[case 717.3][update][estimate-case-check-sends-back-a-pair-whose-sentence-was-not-read]{ref:rule-case-check}
  case: '717.3'
  kind: update
  slug: estimate-case-check-sends-back-a-pair-whose-sentence-was-not-read
  origin: raw/2026-10-07/1804/ledger.md#case-717.3
  decision: decision-case-717.3
  ref: rule-case-check
  category: estimates
  set:
    status: pending
  sections:
    Criterion: 'When:

      The `SubagentStop` hook `uv run guppi casecheck --subagent` of `guppi/casecheck.py` checks a file
      `raw/<date>/<hi HHMM>/cases/case-<N>.md` whose Case carries a `replace` or `reword` pair on a page
      that stands on disk, and reads the record of the subagent at `agent_transcript_path`.


      Then:

      For each match of each pair of the Cases of the file — the one match of a `replace`, and each match
      of a `reword` on each live page — the hook takes the sentence around it on the page as the earlier
      pairs leave it, by the function of the sentence of `guppi/prespec.py`.

      **＋** The sentence counts as read when each part of it that no pair wrote stands whole in the outputs
      of the `Read` calls of the subagent on the page file, the line numbers of the output and the whitespace
      set aside.

      **＋** A part of the sentence that a pair of another Case of the session wrote counts as read when
      it stands whole in the outputs of the `Read` calls of the subagent on the file `raw/<date>/<hi HHMM>/cases/case-<N>.md`
      of that Case.

      **＋** A sentence not read is a finding of its Case: "case <N>: <slug>: the sentence around a pair
      was not read whole: <opening>: Read the page around it, and the file of each other Case that wrote
      into it, and check the pair."

      **－** The output of a `Grep` call, or of any other tool than `Read`, is no read.

      **－** A part of the sentence that a pair of the Cases of the file wrote is not judged.

      **－** A transcript the hook cannot read, and a call of the check with no record of an agent, such
      as `tests/test_case_schema.py` over the example of `vault/wiki/case-example.md`, judge no read.'
