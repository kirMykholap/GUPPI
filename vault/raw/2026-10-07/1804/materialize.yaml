  sections:
    Pattern: In session 2214 of 2026-09-24, after Case 412 superseded each of 407.1 to 407.5, check_ratified
      of guppi/prespec.py still reported the parent Case 407, which had no ledger lines of its own and
      so was named by no supersedes line. In session 1804 of 2026-10-07 the store of the Case-file check
      kept 713.1 and 713.2 after case-guppi went back to the ratified Case 713, and the Stop check refused
      the showing of Case 719 twice on pairs only those stale entries held; the supersedes line that would
      leave them out comes only with the ratification the refusal blocked.
