    Purpose: Prevents a Case from being written in a form the check of its file refuses because the agent
      that writes it saw no example of the form. Until case 717.1 the examples stood in `case-schema.md`,
      the Render of [[rule-case-protocol]], which `case-guppi` reads whole on every dispatch, a dispatch
      that answers only with rounds included, and every later turn of the dispatch read them again from
      the cache. Here they stand apart, and `case-guppi` reads them once in a dispatch, just before it
      first writes the file of a Case ([[rule-case-build]]). The example Case passes the check of `rule-case-check`,
      and the test of its Estimate runs that check over it (case 646).
    Render: "<!-- rule-case-example -->\n# Case — examples\n\n`wiki/case-example.md` — the Render of `rule-case-example`:\
      \ two examples of the forms that `case-schema.md` sets. `case-guppi` reads this file once in a dispatch,\
      \ just before it first writes the file of a Case; the rules of the form stand in `case-schema.md`\
      \ (case 717.1).\n\n## The chat form, by example\n\nThe Case below is written in the chat form that\
      \ `case-guppi` writes into its file. A test runs over it the check that the `SubagentStop` hook\
      \ of `rule-case-check` runs over that file, and fails on any finding or note, so the example passes\
      \ that check as the check stands (case 646). The limits a form must keep are those of the check,\
      \ not of this paragraph: copy the form of the example, and read a finding of the check as the limit\
      \ it names.\n\n````case\n## Case 1 — The cart stands before payment\n\n> **context:**\n> Until now\
      \ items went straight from the catalogue to payment, and a buyer could not review an order. The\
      \ person chose a cart between the two. The pair on `entity-checkout` changes the one sentence of\
