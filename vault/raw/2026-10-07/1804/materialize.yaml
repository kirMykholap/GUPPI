  case_text:
    given: '`estimate-case-example-passes-the-check`: the new check that the example Case passes the check
      of a Case file.

      **＋** `rule-case-example`: the new rule whose Render is the file of examples.

      **＋** `vault/wiki/case-example.md`: the file of examples rendered from `rule-case-example`.

      **＋** `rule-case-protocol`: the rule whose Render loses the examples and points to the new file.

      **＋** `vault/wiki/case-schema.md`: the form of a Case rendered from `rule-case-protocol`.

      **＋** `estimate-case-protocol-example-passes-the-check`: the old check of the example, deleted.

      **＋** `tests/test_case_schema.py`: the test that runs the check over the example.

      **＋** `guppi/casecheck.py`: the check of the `SubagentStop` hook of `rule-case-check`.'
    when: '`tests/test_case_schema.py` runs under `uv run pytest`. It reads the block tagged `case` in
      `vault/wiki/case-example.md`, rendered from `rule-case-example`, and runs over it the function of
      `guppi/casecheck.py` that the `SubagentStop` hook of `rule-case-check` runs over the Cases of a
      file, in a temporary project that holds the schema files of the vault and the pages the example
      updates.'
    then: '`vault/wiki/case-example.md` holds one block tagged `case`, one Case with sub-cases in the
      chat form that `case-guppi` writes into its file, and after it one block tagged `then`.

      **＋** The example holds a `create` and an `update` with their sub-points, a `replace` pair whose
      values hold a backtick in spans padded by one space, a `set` in a fenced block, an `update` of an
      Estimate whose Criterion it replaces, a read line for each Estimate it creates or replaces, and
      its ledger lines in a quoted fence under `ratification`.

      **＋** The example''s `context` says what the sentence around the match of its `replace` pair names.

      **＋** The paragraph before the block says that the example passes the check of the `SubagentStop`
      hook of `rule-case-check`, and that the check, not the paragraph, is the source of the limits; it
      lists no limit.

      **＋** `vault/wiki/case-schema.md`, rendered from `rule-case-protocol`, holds no example block and
      names `vault/wiki/case-example.md` where it sets the chat form and the `then` block.

      **＋** The check gives the example no finding and no note, and the test passes; a change of the check
      that gives the example a finding or a note fails the test, which prints it.

      **＋** The test reads the example from the file and the checks from `guppi/casecheck.py`, and holds
      no copy of either.

      **－** While `vault/wiki/case-example.md` does not stand, the test reads the block tagged `case`
      of `vault/wiki/case-schema.md`; a Case of a later session removes that path.

      **－** While the file the test reads holds no block tagged `case`, both tests of `tests/test_case_schema.py`
      fail with a message that names the file; no test of the file is skipped.'
    context: 'Each dispatch of `case-guppi` reads `vault/wiki/case-schema.md` whole, and that file holds
      two examples: a whole example Case in the chat form, which `tests/test_case_schema.py` runs the
      check of `rule-case-check` over, and an example of the `then` block of the Spec, which the agent
      never writes. The agent reads every other source whole too, and each later turn reads the whole
      context again from the cache. The cache of a subagent lives five minutes, so an answer after a longer
      pause, or the findings `/pre-spec` sends back, writes the whole context into the cache again. The
      main agent measured these costs on the dispatches of this session and reported them; I could not
      read those transcripts, so no number of theirs stands in this Case.


      The person chose the following. Both examples move to a new file, `vault/wiki/case-example.md`,
      the Render of a new rule `rule-case-example` (Case 717.1). The agent reads that file once in a dispatch,
      just before its first `Write` of a Case file. It reads whole `case-schema.md`, `ratification.md`,
      each page the Case changes, the Criterion of each Estimate of such a page, and the case file of
      each Case of the session that the prompt or a finding of the check names; it reads the rest in parts,
      a case file of an earlier session included, and makes independent calls in one turn. Its cache lives
      one hour, set in its agent file only (Case 717.2). The setting `cacheTtl: "1h"` under `experimental`
      comes from the main agent''s report of the documentation of Claude Code; I could not open that documentation.
      The estimate line of `estimate-case-build-reads-by-need-and-in-parts` records the cache writes of
      each dispatch by their time to live, and that shows whether the setting takes effect.


      Case 717.1 creates `estimate-case-example-passes-the-check` on the new rule with the promise of
      `estimate-case-protocol-example-passes-the-check`, and deletes the old page: `generate` writes the
      `estimates` backlink of a target only on a `create`, so the old page cannot move to the new rule.
      `rule-case-protocol` drops it from its `estimates` by a `set`. The test reads the new file from
      Work Mode, but the file stands only after the librarian''s render, and Retro fixes or reverts a
      red test (`rule-retro`). So the test reads `case-schema.md` while `case-example.md` does not stand,
      and a Case of a later session removes that path. The sentences of `rule-case-protocol` that say
      `case-guppi` reads `case-schema.md` whole stay true. The Criterion of `estimate-case-protocol-loaded`
      names the section of the `then` block, which stays, and the example is not part of it, so that Criterion
      stands. Its `purpose` says that the form of a Case stands in one text, the Render of `rule-case-protocol`.
      That stays true: every rule of the form stays in `case-schema.md`, and `case-example.md` holds only
      samples that follow those rules and set no rule of their own.


      The person chose to write the new reading into the promise of the agent''s work, `estimate-case-build-writes-the-case`.
      Case 716.1 of this session already writes that Criterion back unchanged and sets its `method`, and
      the check of the file refuses a second wording of one promise in a session. So Case 717.2 creates
      `estimate-case-build-reads-by-need-and-in-parts` on `rule-case-build` for the new lines, with no
      limit on tokens, as the person chose. Its `method` follows the method of 716.1, and adds the tool
      calls and the cache writes. The Criterion of `estimate-case-build-writes-the-case` stays true. The
      agent still reads `case-schema.md` and `ratification.md` whole and reads each page and file the
      `given` names, and the new `experimental` field leaves its line on the frontmatter true. Case 716.1
      needs no change. The Criterion of `estimate-case-build-checks-the-finished-case` says the agent
      reads the case file of each Case of the session that the prompt names. The `/pre-spec` check found
      that a search first would miss a related Case that sets the same moment in other words. The person
      chose that those case files stay read whole, so that Criterion stays true, and the paragraph of
      `rule-case-build` on them does not change. The hook of case 711.3 counts only a `Read` of the sentence
      around a pair as read. A page the Case changes is read whole, and so is the file of each related
      Case that writes into the same page, so the hook still finds its reads. No other Estimate of `rule-case-build`
      speaks of what the agent reads in parts. A Glob `vault/**/*reads-by-need*` printed nothing, so that
      slug is free.


      A Glob `vault/**/*case-example*` printed nothing, so `rule-case-example` and `estimate-case-example-passes-the-check`
      are free. A Grep for `estimate-case-protocol-example-passes-the-check` over `vault/wiki/`, `guppi/`,
      `tests/` and `.claude/` printed `vault/wiki/log.md`, `vault/wiki/rules/rule-case-protocol.md` and
      `tests/test_case_schema.py`. I did not read `log.md`. The hit in `rule-case-protocol` is its `estimates`
      field, which Case 717.1 sets, and the hit in the test is its docstring, which Case 717.1 changes.
      A Grep for `test_case_schema` over `vault/wiki/`, `guppi/` and `.claude/` printed `vault/wiki/estimates/estimate-case-check-sends-back-a-pair-whose-sentence-was-not-read.md`,
      `vault/wiki/estimates/estimate-case-protocol-case-form.md` and `vault/wiki/estimates/estimate-case-protocol-example-passes-the-check.md`.
      The first names the example of `case-schema.md` in its Criterion, so Case 717.3 writes it back with
      the new file. The hit in `estimate-case-protocol-case-form` is a Result, the record of a past reading,
      and it stands. The third is the page Case 717.1 deletes. Not done: a limit on the tokens of a dispatch,
      since only a later session can measure one, and the removal of the old path of the test.'
