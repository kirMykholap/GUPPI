      of `guppi/casecheck.py`, as it leaves out a Case that a mark of the session''s ledger names; a mark
      on a sub-case leaves out that sub-case alone.

      **＋** Case M is not judged with the Cases of the answer by `check_same_target` of `guppi/prespec.py`,
      and its pairs are not applied before theirs by `check_pairs`, so a Case built again under a new
      number gets no clash and no pair finding from the build it replaces while that build stands in the
      plan file or the store.

      **＋** The marks are read from the decision lines of the `ratification` fences of the answer by `ratification_records`
      of `guppi/casecheck.py`, the one reading of those lines in the hook.

      **＋** A clash or a pair finding with any other Case of the session stays a finding.

      **－** The mark removes nothing from the plan file or the store: the `Stop` hook of `rule-spec-write`
      removes Case M only when the Case that carries the mark is ratified.

      **－** The findings on a Case ratified in the session and built again under its old number, in another
      shape or without a target, still read the decision lines of the session''s ledger.'
