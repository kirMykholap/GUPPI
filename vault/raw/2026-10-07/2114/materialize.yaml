  set:
    status: pending
  change: the Criterion replaced whole — a sprint or backlog item takes no short Case but for the short
    Case of a take-back (case 723.2)
  sections:
    Criterion: 'When:

      In Plan Mode, the person asks in the chat to put off a decision: an item of `raw/<date>/<hi HHMM>/frontier.md`
      whose source is neither the sprint nor the backlog, with `vault/wiki/orchestration.md` rendered
      from `rule-orchestration`.


      Then:

      In the same reply the agent shows the Case in the short form — `context`, `problem` and a fence
      tagged `then` with one `defer` item per target, no other section — and carries its `LEDGER` block,
      one `defer` line per target, with no tool call after it.

      **＋** The agent writes nothing of the Case into the plan file: the `Stop` hook of `rule-spec-write`
      writes it.

      **＋** The person''s words asking for the defer are its ratification: no question asks for it.

      **＋** The reply shows the Frontier of `raw/<date>/<hi HHMM>/frontier.md` after the Case, with the
      line of the item closed `[-] … · defer case N`.

      **＋** While a line under `## Cases` of `raw/<date>/<hi HHMM>/frontier.md` is open, a question follows
      the Frontier and ends the reply: which open item is next.

      **＋** When no line under `## Cases` is open before `/pre-spec`, the question whether to go on to
      `/pre-spec` follows the Frontier and ends the reply. The agent calls `/pre-spec` only after the
      person says to go on.

      **＋** When no line under `## Cases` is open after `/pre-spec`, no question follows: the reply ends
      with the Frontier, and the hook of `rule-prespec-onward` sends the agent on with the loop after
      the findings.

      **＋** A wording the person corrects is a new short Case with `{supersedes:case N}` on its line,
      shown the same way.

      **＋** When the item has a Case that `case-guppi` built and that has no decision line in `raw/<date>/<hi
      HHMM>/ledger.md`, the drop goes to that `case-guppi` first and the turn of the person''s words ends
      with one `**Waiting:**` line; the short Case, its `LEDGER` block and the Frontier come in the turn
      that the answer `**Dropped:**` opens.

      **－** No text follows the question, or the Frontier when no question stands.

      **－** Retro writes no short defer: what it would put off is a line of `## For the next session`
      of `raw/<date>/<hi HHMM>/handoff.md`.

      **－** An item of the sprint put off, its line of `raw/<date>/<hi HHMM>/frontier.md` closed `[-]
      … · sprint · defer`, and an item of the backlog left as it stands, closed `[-] … · backlog · kept`,
      are not this moment: they take no short Case and no ledger line but for the short Case of a take-back
      of a ratified Case, which is the moment of `estimate-orchestration-takes-back-a-ratified-case`,
      and a reply that closes only such lines with no take-back is the moment of `estimate-orchestration-shows-the-frontier-after-a-closed-line`.'
  applied: '22:45:11'
