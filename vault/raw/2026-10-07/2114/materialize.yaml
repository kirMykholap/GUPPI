  text: decision[case 723.1][update][estimate-orchestration-takes-back-a-ratified-case]{ref:rule-orchestration}
  case: '723.1'
  kind: update
  slug: estimate-orchestration-takes-back-a-ratified-case
  origin: raw/2026-10-07/2114/ledger.md#case-723.1
