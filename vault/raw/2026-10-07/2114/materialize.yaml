  case_text:
    given: '`estimate-prespec-notes-a-page-another-case-defers`: the new check of this note.

      **＋** `rule-prespec`: the rule of `/pre-spec`, whose check prints the notes.

      **＋** `guppi/prespec.py`: `plan_findings`, which gathers the notes of `--check`, and the module
      docstring, which says what the check compares.

      **＋** `tests/test_prespec.py`: the tests of the check on a made-up plan.

      **＋** `rule-prespec-hook`: the `ExitPlanMode` hook, which a note does not block.

      **＋** `guppi/casecheck.py`: the check of the file of a Case, which imports other notes of `guppi/prespec.py`.'
    when: '`uv run guppi prespec --check` reads the plan file of the session, where the `then` block of
      one Case holds a `defer` item of a page and the `then` block of another top-level Case holds a `create`,
      `update` or `delete` item of the same page.

      **＋** Or `tests/test_prespec.py` runs it over a made-up plan.'
    then: 'The check prints one line that opens with `note:` for each page and pair of Cases, and it names
      the Case that changes the page, the page and the Case that puts it off.

      **＋** A short Case under `## Deferred` of the plan file counts as a Case that puts the page off.

      **＋** The note is no finding: it does not change the exit code, and the hook of `rule-prespec-hook`
      does not block the exit from Plan Mode on it.

      **＋** The agent answers the note in one line in the chat, and the person may change a Case or keep
      the pair.

      **－** A Case and its sub-cases are one Case here: a change and a defer of one page inside one top-level
      Case give no note.

      **－** A page that only `defer` items name gives no note.

      **－** The check of the file of a Case by `guppi/casecheck.py` prints no such note.'
    context: 'At `/pre-spec` one `ask-guppi` agent reads the plan once, at the first run of the session.
      The Render of `rule-prespec` tells it that a Case of the plan that changes a page another Case of
      the plan defers is a finding (case 186.2). A later run dispatches no `ask-guppi`, and `guppi prespec
      --check` has no such check. At the `/pre-spec` of session 1804 the person put off Cases 720 and
      721 during the loop, after the one `ask-guppi` run, as the handoff of that session records. Case
      721 put off `rule-orchestration` and `rule-case-protocol`, which Cases 713 and 717.1 of the same
      plan update, and nothing reported the pair. The handoff told the librarian to apply the updates
      and let the defer add `deferred_by`, so the pair did no harm there. In this session Case 722.3 updates
      `rule-case-protocol` and puts it off again in the same sub-case, on purpose.


      Case 726.1 makes `guppi prespec --check` print a `note:` line for such a pair at every run, a change
      and a defer inside one top-level Case aside. A note sets no exit code, so the hook of `rule-prespec-hook`
      does not block the exit on it. `split_cases` of `guppi/materialize.py` reads every Case heading
      of the plan, so a short Case under `## Deferred` is read too. The note is printed by `plan_findings`
      of `guppi/prespec.py` alone. `guppi/casecheck.py` imports `promise_notes`, not the new judgment,
      so the check of the file of a Case prints no such note. With the one exception, the plan of this
      session gives no such note: 722.3 holds both its change and its defer. Case 726.1 creates its own
      Estimate. `estimate-prespec-notes-a-long-chain` checks another note, and `estimate-prespec-hook-gates`
      says only that a `note:` line does not block; its Criterion stands.


      Case 726.2 takes the pair off the list of what `ask-guppi` judges. It rewrites the sentence of the
      Render of `rule-prespec`, and it replaces whole the Criterion of `estimate-prespec-reconciles`,
      whose last line says the pair is still a finding. That Criterion is carried whole but for that line,
      which the check of this file notes as not carried. The same check notes that the dispatch line of
      726.2 shares most of the words of two `then` lines of 726.1. All three lines speak of `## Deferred`
      and of `defer` items, but the dispatch line sets what `ask-guppi` reads and the two lines set what
      the script notes, so they stay as they are. Its `method` reads the new Render against the Criterion
      and does not state the old promise, so it stands; the page has no `purpose` field. The dispatch
      keeps the instruction that `ask-guppi` reads the slugs of the `defer` items of a Case under `##
      Deferred`, since its first question still asks whether the Cases contradict each other. A Grep of
      `another Case of (this|the) plan defers` over `vault/wiki/` printed `vault/wiki/rules/rule-prespec.md`
      and `vault/wiki/estimates/estimate-prespec-reconciles.md`, and over `.claude/` it printed `.claude/skills/pre-spec/SKILL.md`,
      the Render of `rule-prespec`. Each enters this Case. The `context` of Case 722 and of Case 725 of
      this session say that `/pre-spec` calls such a pair a finding. They stand: they give the reason
      for a choice made under the rule as it stood, and a note still shows such a pair.'
