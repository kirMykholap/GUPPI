  case_text:
    context: 'The ledger only grows. A Case ratified in the session keeps its decision lines under its
      number, so a ratified Case with no sub-cases cannot become a parent under that number. The `## Splitting`
      section of `vault/wiki/case-schema.md` sends a Case built again in another shape to a new number
      whose decision lines carry `{supersedes:case N}` (cases 610.1, 671.1). At the `/pre-spec` of session
      1804, finding F6 asked ratified Case 713 to replace one more Criterion. Its `case-guppi` split 713
      into 713.1 and 713.2 under the old number, then built Case 719 to supersede it, and the check of
      the Case file refused 719 (ledger lines 27 and 28 of that session, `lesson-case-build-splits-a-ratified-leaf-case`).
      Case 722.1 of this session sets the fix of the stale store entries behind that refusal. A second
      cause stands: `other_blocks` of `guppi/casecheck.py` leaves out only a Case that a mark of the session''s
      ledger names. A mark reaches the ledger only when the new build is ratified, so a new build is compared
      with the first build while it stands in the plan. The pairs of the first build are applied first,
      and the new build''s old texts then miss. The `recommend` of Case 722 records the same refusal.
      The rule of `case-guppi` also contradicts itself. One sentence tells it to empty a file it leaves
      behind under another number. Another sentence says that it empties no file of a Case with a decision
      line. `rule-orchestration` says that such a file is never emptied (case 701.4). This session the
      file of ratified Case 722 was emptied that way and written back.


      Case 725.1 has `case-guppi` build a second behaviour as a Case of its own beside the ratified Case,
      with no mark, and empty a file left behind only when its Case has no decision line. It replaces
      the Criterion of `estimate-case-build-writes-the-case` whole. That Criterion held more than seven
      lines before this Case and is carried whole but for four lines that this Case changes. Those are
      the third `when` line, which adds a finding of `/pre-spec`; the line on the drop of a Case, whose
      file left behind is now emptied only with no decision line; the line on the files `case-guppi` writes,
      which adds the file of a new Case; and the line on the files it never empties, which now names the
      file left behind. Its `purpose` and `method` do not state the changed lines and stand. A Grep of
      `under another number` over `vault/wiki/` and `.claude/` printed `vault/wiki/rules/rule-case-build.md`,
      `vault/wiki/estimates/estimate-case-build-writes-the-case.md` and `.claude/agents/case-guppi.md`,
      its Render, and each enters this Case. The `## Splitting` section of `rule-case-protocol` stays
      true: it sets the path for a fix that changes what a ratified Case already set. It is not changed
      here, since Case 722.3 of this session puts `rule-case-protocol` off, and `/pre-spec` reports a
      Case that changes a page another Case of the plan puts off (case 186.2). `vault/wiki/orchestration.md`
      says the main agent dispatches `case-guppi` with the Case id. A new Case whose number `case-guppi`
      picks stands beside that, as a number the check gives does (case 610.1).


      Case 725.2 makes the check leave out a Case that a mark on a decision line of the answer''s own
      file names. A Grep of `other_blocks\(` over `guppi/` printed `guppi/casecheck.py` alone. Case 722.1
      replaces the Criterion of `estimate-case-check-sends-back-a-clash-with-another-case` whole and rewrites
      a clause of the Purpose of `rule-case-check`. So Case 725.2 creates its own Estimate and adds its
      clause to the end of the sentence of that Purpose whose start 722.1 rewrites. The two new texts
      fit side by side. The text of 722.1 names the Cases the check leaves aside: a dropped Case and a
      stored Case that the file of its top-level Case no longer holds. The clause of 725.2 comes after
      the end of that sentence, which 722.1 leaves as it stands, and it adds a Case that a mark of the
      file itself names. The first `then` line of Case 722.1 says that each Case of the plan file is judged,
      and its exceptions list only the marks of the ledger. Case 722.1 should add to that exception a
      Case that a mark on a decision line of the answer''s own file names. The Criterion of `estimate-case-check-applies-the-pairs-of-the-session-in-order`
      leaves out a Case that any mark names, and stands.'
    problem: A fix that adds a second behaviour to a ratified Case with no sub-cases has no step in the
      rule of `case-guppi`. A Case built again under a new number is refused by the check while the build
      it replaces stands in the plan. The rule also tells `case-guppi` to empty the file of a ratified
      Case that it leaves behind under the old number.
    recommend: "- **Where the second behaviour of a ratified Case with no sub-cases goes**\n  - Recommended:\
      \ (a) a Case of its own under a new number beside the ratified one, with no retiring mark; a build\
      \ under a new number stays only for a fix that changes what the ratified Case already set.\n  -\
