  tags: []
  case_text:
    given: '`rule-spec-write`: the rule of the `Stop` hook that writes a ratified Case into the Spec and
      removes a superseded one.

      **＋** `estimate-spec-write-removes-a-superseded-case`: its Criterion is replaced whole.

      **＋** `estimate-spec-write-answers-a-refusal`: the promise of the hook with `stop_hook_active` set.

      **＋** `guppi/ratified.py`: `remove_superseded`, which removes a superseded Case.

      **＋** `tests/test_ratified.py`: the tests of the removal of a superseded Case.

      **＋** `guppi/prespec.py`: `retired_whole`, the judgment of a parent retired sub-case by sub-case.

      **＋** `raw/<date>/<hi HHMM>/ledger.md`: the ledger of the session, whose marks retire a Case.

      **＋** `raw/<hi date>/<hi HHMM>/spec.md`: the approved Spec of the session.'
    when: The `Stop` hook `uv run guppi ratified` runs after a reply whose `LEDGER` block holds a decision
      line carrying `{supersedes:case N}`, and it has written the Case of that line in the same run.
    then: 'The hook removes the section of Case N — its heading, its sections, its `then` and `tasks`
      blocks, and the sections of its sub-cases — from the plan file.

      **＋** Once `raw/<hi date>/<hi HHMM>/spec.md` stands, it removes every section of Case N and of its
      sub-cases from it too.

      **＋** A `{supersedes:case N.M}` removes the section of that sub-case alone while another sub-case
      of its parent with a decision line is not retired; the parent and those other sub-cases stay.

      **＋** When the marks of the session''s `raw/<date>/<hi HHMM>/ledger.md` and of the reply retire
      each sub-case of a parent that has a decision line, judged by `retired_whole` of `guppi/prespec.py`,
      imported, not copied, and the parent holds no decision line of its own that no mark retires, the
      hook removes the section of that parent too.

      **－** A parent with a decision line of its own that no mark retires stays in the plan file and in
      `raw/<hi date>/<hi HHMM>/spec.md`, though each of its sub-cases is retired.

      **＋** A section of Case N under `## Deferred` is removed the same way.

      **＋** With `stop_hook_active` set, the hook removes as without it, as `estimate-spec-write-answers-a-refusal`
      sets it.

      **－** A Case N that neither file holds — a Case of an earlier session, a defer taken up — is no
      refusal, and nothing is removed.

      **－** A line whose own Case the hook refused or did not write removes nothing.'
    context: 'The check that runs when `case-guppi` stops saves the text of each Case it checks in a store,
      `<plan>.checked.json`, beside the plan file of the session. It compares a new Case with the other
      Cases of the session: those of the plan and those that only the store holds. Today a stored entry
      leaves that comparison only when it has findings, when its top-level Case file is empty, or when
      a `{supersedes:case N}` mark of the ledger names it. At the pre-spec of session 1804, Case 713 was
      built as 713.1 and 713.2 and then whole again. The store kept the two sub-cases, and the check refused
      the showing of Case 719 twice on clashes that only they held (`lesson-case-check-store-keeps-sub-cases-a-rebuild-dropped`,
      Case 720). `insight-case-check-a-case-id-leaves-only-by-a-supersedes-line` shows the same root on
      the side of the plan. When a later Case retires each sub-case of a parent, the Spec hook of `rule-spec-write`
      removes only the sub-cases that the marks name, by `remove_superseded` of `guppi/ratified.py`. So
      the heading and the story of the parent stay in the plan and in `spec.md` with no sub-case under
      them. The check of `/pre-spec` that once reported such a parent, `check_ratified` in `lesson-prespec-parent-of-superseded-sub-cases`,
      is gone: the docstring of `guppi/prespec.py` says the plan is compared with no other file since
      case 445.2. `retired_whole` of `guppi/prespec.py` already judges a parent retired sub-case by sub-case,
      for `guppi/onward.py` (case 696.1).


      Case 722.1 leaves out of the comparison a stored Case whose top-level file stands, holds text and
      holds no heading of its id. The entry stays in the store, and the test stands beside the test for
      a dropped Case of case 701.7. The two leftover entries 713.1 and 713.2 of `adaptive-gathering-dewdrop.checked.json`
      stay. A Grep of `store_of|read_store\(|STORE_SUFFIX` over `guppi/` printed `guppi/ledger.py`, `guppi/casecheck.py`
      and `guppi/ratified.py`. Each of them reads the store of the plan file that `plan_path` gives for
      the current session, so no later session reads that store. Case 722.2 makes the Spec hook remove
      a parent whose every sub-case with a decision line is retired, by `retired_whole`. Case 722.3 fixes
      the sentence of the `## Splitting` section of `rule-case-protocol` that says a mark on a sub-case
      removes that sub-case alone. Case 722.3 carries `{supersedes:case 721}`, since `rule-case-protocol`
      holds `decision-case-721` in `deferred_by` and the check of `rule-case-check` requires that mark
      (case 467). Case 722.1 carries `{supersedes:case 720}` for `rule-case-check` for the same reason.
      `generate` clears a defer only from the pages that the superseding Case names (case 467.3, the docstring
      of `guppi/generate.py`). So `rule-orchestration` keeps `decision-case-721`, and Frontier item C4
      can still take it up with the same mark. `decision-case-721` also held a fault of `rule-case-protocol`:
      a Frontier line closed again by the superseding Case does not hold for a sprint or backlog item
      whose Case is taken back. This Case does not fix that fault, so Case 722.3 puts `rule-case-protocol`
      off again for it. The skill `/pre-spec` calls it a finding when a Case of the plan changes a page
      that another Case of the plan defers (case 186.2). Here the update and the defer stand in the same
      sub-case.


      Case 722.1 replaces the Criterion of `estimate-case-check-sends-back-a-clash-with-another-case`
      and sets its `purpose` anew, since the purpose lists what is no other Case. `estimate-case-check-applies-the-pairs-of-the-session-in-order`
      speaks of the same `other_blocks`. Its Criterion stands: it takes the other Cases from `other_blocks`,
      its list of what that function leaves out is not closed, and its promise is the order of the pairs.
      Case 722.2 replaces the Criterion of `estimate-spec-write-removes-a-superseded-case`, whose line
      on a sub-case mark said the parent stays. Its `purpose` and `method` do not state that line and
      stand. Case 722.3 changes a Render. `estimate-spec-write-removes-a-superseded-case` checks the behaviour
      that the changed sentence describes, and `estimate-case-protocol-loaded` checks the render (case
      378.5). A Grep of `sub-case alone|removes that sub-case|its parent and its other sub-cases` over
      `vault/wiki/` printed `case-schema.md`, `rules/rule-case-protocol.md`, `estimates/estimate-spec-write-removes-a-superseded-case.md`
      and `estimates/estimate-materialize-marks-superseded.md`. The last one stands: it says how `guppi
      materialize` marks the entries of a superseded sub-case, and a parent with no decision line of its
      own has no entry. A Grep of `(removes|leaves the Spec|leaves the plan|out of the plan|from the plan)`
      over `vault/wiki/orchestration.md` and `vault/wiki/rules/rule-orchestration.md` printed the sentence
      on a Case taken back in both files. It says that the line of the item changes when no part of the
      Case stays in the plan. That sentence stays true and now also holds when the marks retire each sub-case.
      The insight and the two lessons are not changed by this Case.


      Case 725.2 of this session makes the same check leave out a Case that a `{supersedes:case N}` mark
      on a decision line of the answer''s own file names, under its own Estimate `estimate-case-check-leaves-out-a-case-the-file-supersedes`.
      So the Criterion that Case 722.1 writes, and the `purpose` it sets, name such a Case only as a Case
      left out as that Estimate sets, a pointer and no promise of their own, so that one promise is signed
      in one wording (cases 72.1, 188).


      `retired_whole` takes the parent out of the sub-cases it judges and does not read the decision lines
      of the parent itself, and a parent may hold a decision line of its own, such as the `create` of
      a rule whose promises are its sub-cases. So Case 722.2 removes a parent only when it also holds
      no decision line of its own that no mark retires; otherwise its line would stay with no heading
      in the plan, which `prespec --check` reports. `estimate-prespec-catches-a-superseded-case` says
      that a `{supersedes:case N.M}` covers Case N.M and its own sub-cases, and that the parent with its
      other sub-cases stays. Its Criterion stands: it says which Cases a mark covers in the findings of
      `prespec --check`, and the mark still covers no parent. The Spec hook removes the parent by another
      judgment, and a parent no longer in the plan gives `prespec --check` no finding, since the parent
      carries no decision line that stays unretired. The clause that Case 725.2 adds to the Purpose of
      `rule-case-check` follows the end of the sentence whose start Case 722.1 rewrites, and the two new
      texts read side by side as one sentence.'
