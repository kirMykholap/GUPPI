    ref: rule-orchestration
  - kind: update
    category: estimates
    slug: estimate-orchestration-takes-back-a-ratified-case
    ref: rule-orchestration
  tags: []
  case_text:
    given: '`rule-orchestration`: its Render sets the take-back of a ratified Case and the put-off reply.

      **＋** `vault/wiki/orchestration.md`: the file rendered from `rule-orchestration`.

      **＋** `estimate-orchestration-takes-back-a-ratified-case`: its Criterion is replaced whole.

      **＋** `rule-spec-write`: the hook that writes the short Case and removes the Case its mark names.

      **＋** `guppi/generate.py` and `vault/wiki/backlog.md`: a `defer` marks `deferred_by` only on rule,
      entity and insight pages, and `rule-backlog` lists them from it.

      **＋** `/pre-spec`: the check whose moment the question after the Frontier names.

      **＋** `raw/<date>/<hi HHMM>/frontier.md`, `raw/<date>/<hi HHMM>/ledger.md` and `raw/<date>/<hi HHMM>/cases/case-<N>.md`:
      the Frontier, the ledger and the file of a Case.'
    when: In Plan Mode, with `vault/wiki/orchestration.md` rendered from `rule-orchestration`, the person
      asks in the chat to take back a Case of the session that has a decision line in `raw/<date>/<hi
      HHMM>/ledger.md`, whole or one of its sub-cases.
    then: 'In the same reply the main agent shows a short Case of its own in the form of a deferred decision,
      with no dispatch of `case-guppi`, and carries its `LEDGER` block, with no tool call after it.

      **＋** The block holds one `defer` line for each rule, entity and insight page the Case taken back
      names, one for each Estimate it updates, and one for the page that each Estimate it updates checks
      or each Estimate it creates would check, once per page; each line carries `{supersedes:case N}`
      for the Case or sub-case taken back.

      **＋** At the librarian''s run, `guppi/generate.py` adds the short Case to the `deferred_by` of each
      rule, entity and insight page a `defer` line names, and each such page stands in `vault/wiki/backlog.md`,
      also when the Case taken back changed only existing Estimates.

      **＋** The `context` of the short Case names the Case taken back and each Estimate that Case creates;
      the person''s words asking for the take-back are its ratification, and no question asks for it.

      **＋** The `Stop` hook of `rule-spec-write` writes the short Case under `## Deferred` and removes
      the Case taken back from the plan file.

      **＋** When no part of the Case stays in the plan, the line of its item in `raw/<date>/<hi HHMM>/frontier.md`
      changes in the same reply from `[x] … · case N` to `[-] … · sprint · defer` for an item of the sprint,
      `[-] … · backlog · kept` for an item of the backlog, or `[-] … · defer case M` of the short Case
      for any other source.

      **＋** The reply ends as the reply that carries a defer: the Frontier with the line closed by that
      closer, then the question which open item is next, or before `/pre-spec` the question whether to
      go on to `/pre-spec`, or after `/pre-spec` no question.

      **－** The file of the Case taken back under `raw/<date>/<hi HHMM>/cases/` is not emptied, and no
      `case-guppi` undoes it.

      **－** In Work Mode no Case is taken back: the main agent tells the person that the ratified Case
      stands, and that a Case of a later session may replace it.'
    context: 'In Plan Mode the person can take back a Case already ratified in the session. The main agent
      then writes a short put-off Case of its own, whose `defer` lines carry `{supersedes:case N}` and
      so retire the Case. It closes the Frontier line of the item by the closer of its source: `[-] …
      · sprint · defer` for a sprint item, `[-] … · backlog · kept` for a backlog item, and `[-] … · defer
      case M` for any other source. Case 713 of session 1804 set this in the Render of `rule-orchestration`.
      The pre-spec of that session found faults F2–F6 in it, and Case 721 put `rule-orchestration` and
      `rule-case-protocol` off for them. F2: the short-form paragraph, which the take-back reply follows,
      names only the closer `[-] … · defer case N`, which `guppi/prespec.py` reports after the source
      `sprint` or `backlog`. F3: one sentence says both that the `defer` lines of a take-back add to the
      source of a backlog item and that its source stays as it is. F4: a take-back of a Case whose only
      targets are existing Estimates leaves nothing in `backlog.md`, since `guppi/generate.py` marks `deferred_by`
      only on rule, entity and insight pages. F5: `rule-case-protocol` says that a Frontier line is closed
      again by the superseding Case, which a sprint or backlog closer does not name. F6: the Criterion
      of `estimate-orchestration-defers-in-one-reply` says that a sprint or backlog item takes no short
      Case.


      Case 723.1 fixes F2, F3 and F4 in the Render of `rule-orchestration` and replaces the Criterion
      of `estimate-orchestration-takes-back-a-ratified-case` whole, so that the take-back stands whole
      in this Case. It carries `{supersedes:case 713}`, which sets `decision-case-713` `superseded`, and
      `{supersedes:case 721}`, since `rule-orchestration` holds `decision-case-721` in `deferred_by` and
      `generate` clears a defer only from the pages the superseding Case names (case 467.3). The new Criterion
      rewords four lines of the old one on purpose. The `defer` line also names the page each updated
      Estimate checks. The line on the `context` of the short Case and the line on the person''s words
      stand as one line. The line on the end of the reply names the closer of the source. Case 723.2 fixes
      F6: the last `－` line of the Criterion of `estimate-orchestration-defers-in-one-reply` is reworded
      on purpose to add the take-back as an exception, and Case 723.3 rewords the line of `estimate-hi-writes-frontier`
      on an item closed `defer` or `kept` in the same way. F5 stays: Case 722.3 of this session puts `rule-case-protocol`
      off again for that sentence, and a mark that retired 722.3 would remove its fix of the same page
      from the plan. The frame showed the same fault as F6 in `rule-skill-hi` and its check `estimate-hi-writes-frontier`,
      which the pre-spec of session 1804 did not find, and Case 723.3 fixes it. The `method` of that check
      waited for the `/hi` after the close of a sprint, which the check of the Case file refuses for a
      Criterion replaced whole (case 715). The person chose to keep that moment, with the reading by hand
      made the person''s answer there, and the unit tests kept.


      A Grep of `no short Case|take no short Case|has no short Case` over `vault/wiki/**/*.md` and `.claude/**/*.md`
      printed `vault/wiki/brief.md`, `vault/wiki/orchestration.md`, `vault/wiki/estimates/estimate-hi-writes-frontier.md`,
      `vault/wiki/rules/rule-orchestration.md` and `vault/wiki/estimates/estimate-orchestration-defers-in-one-reply.md`.
      The brief names F6, `orchestration.md` is the Render, and the other hits enter this Case. A Grep
      of `sprint · defer` over `vault/wiki/rules/*.md` and `.claude/**/*.md` printed `.claude/skills/hi/SKILL.md`,
      `vault/wiki/rules/rule-orchestration.md`, `vault/wiki/rules/rule-skill-hi.md` and `vault/wiki/rules/rule-case-protocol.md`.
      The hit in `rule-case-protocol.md` is a History line. `SKILL.md` is the Render of `rule-skill-hi`.
      A Grep of `sprint · defer|backlog · kept` over `vault/wiki/estimates/` printed `estimate-hi-writes-frontier.md`,
      `estimate-hi-takes-a-conserved-spec.md`, `estimate-orchestration-takes-back-a-ratified-case.md`,
      `estimate-orchestration-shows-the-frontier-after-a-closed-line.md`, `estimate-orchestration-shows-the-built-case.md`,
      `estimate-orchestration-defers-in-one-reply.md`, `estimate-orchestration-acknowledging-reply.md`
      and `estimate-prespec-binds-a-sprint-line.md`. The ones this Case does not name stand. They list
      the closers, judge where a closer may stand, or speak of a reply that carries no defer or of a Case
      with no decision line, and none says that such a line has no short Case. A Grep of `take-back|taken
      back|takes back|take back` over `vault/wiki/` printed `orchestration.md`, `log.md`, `rules/rule-orchestration.md`
      and `estimates/estimate-orchestration-takes-back-a-ratified-case.md`, and over `.claude/` it printed
      nothing. No code reads the changed texts. `orchestration.md` and `.claude/skills/hi/SKILL.md` change
      at the librarian''s render.'
