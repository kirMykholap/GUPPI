  case_text:
    context: 'Before it answers, `case-guppi` looks for the sentences its change makes false. For other
      pages it searches for the slug of the changed page. Inside a page the Case changes, which it reads
      whole, nothing tells it how to find those sentences, so it searched for the words of the one sentence
      it changed. A sentence that states the same rule in other words never came up. In session 0050 this
      left three sentences of `rule-orchestration` that stated the batch without the new route, and `/pre-spec`
      found them; Case 730 was built and ratified again (`lesson-case-build-finds-the-sentences-it-changes-by-their-words`).
      The person chose a reading by meaning of each page the Case changes, and only of those pages: every
      sentence that states the behaviour the change touches goes on a list, whatever its words.


      The new sentence goes into the Render of `rule-case-build` right after the sentence that already
      asks for a judgment by meaning when no slug marks a fact. The Case replaces the Criterion of `estimate-case-build-checks-the-finished-case`,
      which checks what `case-guppi` does with its finished Case, with one more line for the list and
      for the sentences on it that enter the Case; the other lines are carried word for word. Its `purpose`
      and `method` both list the kinds of miss that the Estimate counts, so this `update` adds the new
      kind to each. `estimate-case-build-writes-the-case` checks the reading of the frame before the forks,
      and `estimate-case-build-reads-by-need-and-in-parts` checks that each page the Case changes is read
      whole. The new step uses that reading and leaves both promises as they are, so both Criteria stand.
      The Case sets `insight-workflow-case-written-without-reading-the-pages-it-changes` `actioned`, as
      Case 730.3 did. `rule-insights-schema` makes `addressed_by` the latest decision that fixed the pattern,
      and a Case of the session writes it as the bare slug (case 712). So the same `update` sets it to
      `decision-case-734` in place of `decision-case-391.2`, which 730.3 left standing.


      A Grep for `estimate-case-build-checks-the-finished-case|insight-workflow-case-written-without-reading-the-pages-it-changes`
      over `vault/wiki/` printed `brief.md`, `backlog.md`, `log.md`, `lesson-case-build-finds-the-sentences-it-changes-by-their-words.md`,
      `rule-case-build.md`, `lesson-orchestration-recommended-a-rebuild-that-signed-a-promise-twice.md`
      and `estimate-materialize-assembles.md`. The same Grep over the repository outside `vault/` printed
      nothing. `brief.md` and `log.md` are not read. `rule-case-build` is in `given`. The two lessons
      name the Insight in their `insight` field, which stands. `backlog.md` is written by `guppi backlog`
      alone (`rule-carry-over`), not by a Case. The hit in `estimate-materialize-assembles` is a past
      reading that names the `create` of the Estimate, and it stands.'
    problem: Inside a page it changes, `case-guppi` finds the sentences to fix by the words of the one
      sentence it changes. A sentence that states the same rule in other words stays false until `/pre-spec`
      finds it, and the Case is built and ratified again.
    recommend: "- **How the agent finds the sentences a change touches**\n  - Recommended: (a) read each\
      \ changed page by meaning: list every sentence that states the behaviour the change touches, judged\
      \ by what it says, not found by a word search; each enters the Case or `context` says why it stands.\n\
      \  - Answer: agreed, (a).\n- **Which pages the reading by meaning covers**\n  - Recommended: (a)\
      \ only the pages the Case changes; other pages are still reached by the slug and moment searches\
      \ and read around each hit.\n  - Answer: agreed, (a).\n- **Which Estimate checks the fix**\n  -\
      \ Recommended: (a) add it to `estimate-case-build-checks-the-finished-case`: its Criterion replaced\
      \ whole with one more line, and its purpose and method gain this kind of miss.\n  - Answer: agreed,\
      \ (a).\n- **The open Insight**\n  - Recommended: (a) set `insight-workflow-case-written-without-reading-the-pages-it-changes`\
      \ `actioned`, as the last session did.\n  - Answer: agreed, (a)."
    given: '`rule-case-build`: the rule whose Render sets how `case-guppi` checks its finished Case.

      **＋** `.claude/agents/case-guppi.md`: the agent file rendered from `rule-case-build`.

      **＋** `estimate-case-build-checks-the-finished-case`: the check of the finished Case; its Criterion
      is replaced whole.

      **＋** `insight-workflow-case-written-without-reading-the-pages-it-changes`: the Insight this lesson
      reopened; set `actioned`.

      **＋** `rule-insights-schema`: the rule that sets `addressed_by` of an `actioned` Insight to the
      latest decision.'
    when: '`case-guppi`, with `.claude/agents/case-guppi.md` rendered from `rule-case-build`, has built
      a Case that changes a page and is about to answer with it.'
    then: 'In each page the Case changes, which it has read whole, it lists each sentence that states
      the behaviour the change touches, judged by what the sentence says.

      **＋** A sentence that states the same rule in other words than the sentence the Case changes is
