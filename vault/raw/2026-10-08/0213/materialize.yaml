  category: estimates
  set:
    status: pending
    purpose: Whether case-guppi checks its finished Case before it answers — the chosen options, the pages
      that name a slug the change makes false, the sentences of a page it changes that state the changed
      behaviour in other words, the rules that act at the moment the change sets, the Cases of the session
      its prompt names or the check of its file names in a finding or a note, the purpose and method of
      an Estimate whose Criterion it replaces, what each search printed and that the context keeps only
      the searches the Case rests on, the sub-cases that change one page — counted by what ask-guppi still
