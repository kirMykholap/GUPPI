  category: estimates
  set:
    status: pending
    purpose: Whether pre-spec refuses an Estimate whose method names none of the forms lint classifies,
      or, on a MOC, neither a make target nor by hand
    method: uv run pytest tests/test_prespec.py on a temp plan — a create with a prose method, a create
