  category: estimates
  set:
    status: pending
    purpose: Whether /hi takes, in its first reply, each open W reading whose whole method runs now from
      files and commands, reads no transcript, writes a Cases line for each other open W line but those
      of the close of a sprint, puts each open Ask line to the person but one that waits for the close
      of a sprint or the session after it, writes the answer as its reading line, and opens no page but
      the Estimates it reads
  change: the Criterion replaced whole — an Ask line that waits for the close of a sprint, or the session
    after it, stays open and is not asked; the purpose set anew
  sections:
    Criterion: 'When:

      The person types `/hi` of `.claude/skills/hi/SKILL.md` on `UserPromptSubmit`, and the agent writes
      `raw/<date>/<hi HHMM>/frontier.md`, whose `## Work` holds the `pending` readings of `vault/wiki/brief.md`
      and whose `## Ask` holds its readings that only the person can take.


      Then:

      In its first reply, before the question on the order, the agent takes each reading of an open `W`
      line whose whole method runs now.

      **＋** It reads what the method names from `vault/wiki/brief.md`, `git log`, `git status` and the
      files and commands the method names.

      **＋** It opens the page of each Estimate it reads and judges the reading against its `## Criterion`.

      **＋** It closes the `W` line of each reading taken `[x] … · work` in `raw/<date>/<hi HHMM>/frontier.md`,
      then writes one `estimate[...]` line per reading in a `LEDGER` block of the reply, which ends in
      text.

      **＋** For each other open `W` line, whose reading cannot run now, it writes one line under `## Cases`
      of `raw/<date>/<hi HHMM>/frontier.md` that names the Estimate by slug and asks to fix its method,
      replace its Criterion or archive it; the `W` line closes `· case N` when that Case is ratified.

      **＋** In the same reply, before the question on the order, it puts each open `A` line to the person
      as a question: the Estimate by slug and its question.

      **＋** When the person answers one, the agent closes its `A` line `[x] … · work` in `raw/<date>/<hi
      HHMM>/frontier.md` first, then writes its `estimate[...]` line, the answer as its result, in a `LEDGER`
      block of the reply, which ends in text.

      **－** It reads no transcript of an earlier session.

      **－** A `W` line of an Estimate whose `method` names the session that closes a sprint, or the session
      after that close, stays open under `## Work` and is no Cases line.

      **－** An `A` line whose question names the session that closes a sprint, or the session after that
      close, stays open under `## Ask` and is not put to the person. It is put at the `/hi` whose `vault/wiki/brief.md`
      opens the `Cases` of its Next session with `open the next sprint`, or in the session the person
      names as the one that closes the sprint. The agent judges this from the line as `vault/wiki/brief.md`
      gives it, with no page opened.

      **－** The Frontier is still assembled with no page opened. Only the reading step opens the pages
      of the Estimates it reads.

      **－** At `/hi` the agent changes no page and no file except `raw/<date>/<hi HHMM>/frontier.md`.'
  applied: 03:00:10
