  sections:
    Criterion: 'When:

      `SubagentStop` fires when `case-guppi` answers, and `uv run guppi casecheck --subagent` reads its
      newest output in `agent_transcript_path`: a text, or the `message` of a `SubagentHandback` call,
      whichever stands later.


      Then:

      `uv run guppi casecheck --subagent` takes that output as a round when `is_round` of `guppi/casecheck.py`,
      the one test of a round that the `Stop` run also imports, finds it one. That holds when it holds
      no Case heading, no line that opens with `**Fact:**` stands before its first line that opens with
      `❓`, and one of its lines opens with the mark `❓`, with the indent of each line set aside.

      **＋** Each line that opens with `❓` opens a question, and the question runs to the next such line
      or to the end of the output. The text before the first question, the `**Context:**` paragraph, is
      not judged.

      **＋** A question is out of form when its first line does not match the title line `❓ **Q<n>** -
      **<title>**:` of `.claude/skills/grill-me/SKILL.md`, judged by `QUESTION_LINE` of `guppi/casecheck.py`.

      **＋** A question is out of form when it holds no line that opens with `**Now:**`, or no line that
      holds `**Options:**` and nothing else.

      **＋** A question is out of form when it holds no line that opens with `➡️`, or when none of its
      lines that open with `🔹` has a line after it, before the next line that opens with `🔹` or `➡️`,
      that opens with `**After:**` or with `- **After:**`.

      **＋** A round with a question out of form exits 2. Its stderr names each such question by its first
      line and each part it misses, and tells `case-guppi` to answer with the round whole again, and `case-guppi`
      answers again.

      **－** A round gets none of the checks of a Case in the same run, and no earlier Case of the transcript
      is checked for it, so the exit 2 of a round carries the findings of its form alone.

      **－** A round out of form is not sent back again when an earlier output of `case-guppi` in `agent_transcript_path`
      holds the same text, trailing spaces aside.

      **－** A round in form gives no finding and prints nothing of its own.

