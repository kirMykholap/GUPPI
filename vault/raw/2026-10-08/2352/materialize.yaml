  sections:
    Purpose: 'Prevents the next sprint from opening without a goal, a Definition of done, a first milestone,
      its close line and a look at the backlog, while the text that asks for them stays out of the sessions
      that open no sprint. Until case 743 nothing set what the opening Case asks, and the steps of the
      turn of a sprint stood in `orchestration.md`, which every session loads. The skill loads only in
      the session that opens a sprint: the `UserPromptSubmit` hook `guppi sprint --hi` tells the agent
      at `/hi` to start it when `vault/wiki/sprint.md` marks the last sprint closed ([[rule-sprint]],
      case 743.5), and the person may type it too. The backlog is not gone through: the opening Case says
      how many items it holds and asks whether to take any (case 743.6). The close line it writes starts
      [[rule-skill-sprint-close]] in the session that closes the sprint.'
    Render: "<!-- rule-skill-sprint-open -->\n---\nname: sprint-open\ndescription: \"Open the next sprint.\
      \ Run it when the hook on /hi says that no sprint is open, or when the person types /sprint-open.\"\
      \n---\n\nNo sprint is open: the first heading of `vault/wiki/sprint.md` marks the last sprint closed.\
      \ This session opens the next one. The ledger hook refuses each decision line but a `defer` until\
      \ a `create` of a page `entity-sprint-<id>` stands, so the opening Case is the first Case the session\
      \ ratifies.\n\n1. Assemble the Frontier as `/hi` sets it: the line `open the next sprint` of the\
      \ brief stands first under `## Cases`, and no item of the closed sprint and no conserved Spec stands\
      \ there.\n2. When the person takes up that line, dispatch `case-guppi` for it as `vault/wiki/orchestration.md`\
      \ sets it, and write into the prompt of the call that the opening Case asks the person, in its rounds:\n\
      \   - the id of the sprint, which names the page `entity-sprint-<id>`;\n   - its goal in one sentence,\
      \ the `purpose` and the `## Purpose` of the page;\n   - its Definition of done, one Estimate per\
      \ condition, which the page lists in `estimates`;\n   - the first milestone and its items, under\
      \ `## Milestones`;\n   - whether to take any item of `vault/wiki/backlog.md` into the sprint: the\
      \ Case says how many items the file holds, and goes through no item the person does not name.\n\
      3. Write into the same prompt that the opening Case writes, as the last item of the last milestone\
      \ of the page, the line ``- the close of `<id>` — `/sprint-close`, a session of its own``, so that\
      \ the session that closes the sprint starts `/sprint-close` from it.\n4. The skill decides none\
      \ of the answers: `case-guppi` puts each to the person, and the person ratifies the opening Case\
      \ as any other.\n<!-- /rule-skill-sprint-open -->"
