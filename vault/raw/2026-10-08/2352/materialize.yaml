    given: '`rule-skill-grill-me`: the rule whose Render is the text of the skill.

      **＋** `.claude/skills/grill-me/SKILL.md`: the skill file the render writes.

      **＋** `.claude/agents/case-guppi.md`: the agent that loads the skill by its `skills` field.

      **＋** `rule-orchestration`: the rule by which the main agent shows a round in the chat.

      **＋** `estimate-skill-grill-me-asks-in-rounds`: its Criterion is replaced whole.'
    when: 'The person types `/grill-me` on `UserPromptSubmit`, or `case-guppi` answers with a round of
      questions, with `.claude/skills/grill-me/SKILL.md` loaded by `skills: [grill-me]` in `.claude/agents/case-guppi.md`,
      after `uv run guppi render` wrote `.claude/skills/grill-me/SKILL.md` from `rule-skill-grill-me`.'
    then: '`uv run guppi render --check` exits 0: `.claude/skills/grill-me/SKILL.md` equals the Render
      of `rule-skill-grill-me`.

      **＋** The agent asks in rounds: each round holds every question whose prerequisites are settled,
      and the agent waits for the answers before the next round.

      **＋** Each question opens with its numbered `❓ **Qn** - **<title>**:` line and closes with its `➡️`
      line, the recommended answer, together with the lines of a list under it. Its body starts on the
      next line with one `**Now:**` line that says once what holds today, or that nothing exists yet.

      **＋** The label `**Options:**` stands alone on the line before the first option. Each option starts
      on its own line, after a blank line, with the mark `🔹` and its name in bold. Directly under its
      name stands one `**After:**` line, indented two spaces with no list dash before the label, that
      says what holds with that option.

      **＋** A list stands one item per line, never inside a sentence. This covers items marked by a number,
      a letter or a bullet, and a series of two or more clauses that name parallel things. Under an `**After:**`
      line a list stands on the lines after it, indented as far as the label.

      **＋** A quotation, words taken from a page, a file or a reply, stands as a blockquote on its own
      line under the sentence that introduces it and names its source, a fragment of a few words too;
      it never stands inside a sentence in quote marks. Under an `**After:**` line it stands on the line
      after it, indented as far as the label.

      **＋** A fact the agent can look up it finds itself, or by a sub-agent when it can dispatch one;
      the person is asked only for decisions.

      **＋** The agent acts on the grill only after the shared understanding is confirmed, by the person''s
      word unless the instructions that started the grill name another confirmation.

      **－** An option carries nothing under it but its `**After:**` line: no list of costs, no second
      item and no other label. A cost is a plain sentence inside the `**After:**` text or in the `➡️`
      line.

      **－** A short series of words inside a sentence stays in the sentence.

      **－** No line of a question except an option starts with `🔹`.

      **－** In the chat the labels may stand translated, as the main agent shows a round of `case-guppi`
      by `rule-orchestration`. A translated label counts as the same label: the shape is what is read,
      not the language of the labels.

      **－** The `**Context:**` paragraph of a round of `case-guppi`, its lists and quotations included,
      and the place of its case numbers are not read here. They are the promises of the Estimates of the
      rule of `.claude/agents/case-guppi.md`.

      **－** No sentence of `.claude/skills/grill-me/SKILL.md` requires the agent to dispatch a sub-agent.'
    context: 'The skill `grill-me` sets the shape of each question of a round. Under each option name
      stands a line `- **After:**`, which shows as a bullet item. The person asked to remove the dash,
      as a cosmetic change. The dash is read in two places: the template of `.claude/skills/grill-me/SKILL.md`,
      which `rule-skill-grill-me` renders, and the check of a round in `guppi/casecheck.py`, whose `AFTER_ITEM`
      is `- **After:**`. If only the template changed, the check would send back every round that follows
      it. Three sentences of the skill also call the line a nested item and set the indent of a quotation
      or a list under it by the text of that item. The person chose that the check accepts the line with
      or without the dash, that the line stays directly under the option name, indented two spaces, with
      only the dash removed, and that the skill sentences are reworded for a line with no dash (744.1).
      Since the check accepts both forms for good, no round is refused between the change of the code
      and the render of the skill, and no later Case removes an old form. The two promises can fail apart,
      so the skill text and the check are two sub-cases.


      The frame: a Grep of `\*\*After:\*\*` over `vault/wiki/`, `.claude/`, `guppi/` and `tests/` printed
      `vault/wiki/orchestration.md`, `vault/wiki/rules/rule-orchestration.md`, `vault/wiki/estimates/estimate-orchestration-asks-in-the-grill-me-shape.md`,
      `vault/wiki/estimates/estimate-case-check-sends-back-a-faulty-round.md`, `vault/wiki/rules/rule-skill-grill-me.md`,
      `vault/wiki/estimates/estimate-skill-grill-me-asks-in-rounds.md`, `.claude/skills/grill-me/SKILL.md`,
      `guppi/casecheck.py` and `tests/test_casecheck.py`. The sentence of `rule-orchestration`, rendered
      into `orchestration.md`, and the Criterion of `estimate-orchestration-asks-in-the-grill-me-shape`
      speak of each option with its `**After:**` item. They stand: they name the label, which every option
      keeps, and no dash. The Criterion of `estimate-skill-grill-me-asks-in-rounds` speaks of a nested
      item and of the indent under it, so 744.1 replaces it. Its `method` reads a round in a session after
      the render, so 744.1 sets it to a reading this session can take; `uv run guppi render --check` is
      left to `make lint` in the librarian''s run. The old Criterion lines that the two sub-cases do not
      carry word for word are the lines on the After item, which the change rewords, and the first line
      of the check, which now lists its conditions without counting them. Some `then` lines of the two
      sub-cases share words because they describe the same template from two sides: the skill that writes
      a round, and the check that reads it. The Criterion of `estimate-case-check-sends-back-a-faulty-round`
      names `- **After:**`, so 744.2 replaces it and adds both forms to its `method`. The Purpose of `rule-skill-grill-me`
      and the text of `rule-case-check` do not name the dash, so they stand. `tests/test_case_schema.py`
      and `tests/test_orchestration.py` read live files of `vault/` and import `guppi/casecheck.py`, but
      the texts they read hold no round, so `round_form` returns nothing for them and they stand. Case
      743 of this session does not touch the skill or the check.'
