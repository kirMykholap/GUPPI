- case: '743.4'
  decision: decision-case-743.4
  origin: raw/2026-10-08/2352/ledger.md#case-743.4
  targets:
  - kind: update
    category: rules
    slug: rule-backlog
    ref: rule-backlog
  - kind: update
    category: estimates
    slug: estimate-backlog-renders
    ref: rule-backlog
  tags: []
  case_text:
    given: '`rule-backlog`: the rule of `vault/wiki/backlog.md`.

      **＋** `guppi/backlog.py`: the script that writes the file.

      **＋** `guppi/sprint.py`: the item reader and the statuses that tick an item.

      **＋** `tests/test_backlog.py`: the tests of the script.

      **＋** `guppi/materialize.py`: the Spec reader of a conserved Spec.

      **＋** `entity-sprint-<id>`: a sprint page, live under `vault/wiki/entities/` or archived under `vault/archive/`.

      **＋** `vault/raw/`: the sessions the script reads for conserved Specs and Frontiers.

      **＋** `estimate-backlog-renders`: its Criterion is replaced whole.'
    when: '`uv run guppi backlog` runs over `vault/wiki/`, `vault/raw/` and `vault/archive/`. The librarian
      runs it after `guppi sprint`, and the skill `carry` runs it after it writes `carry.md`.

      **＋** Or `tests/test_backlog.py` runs `guppi/backlog.py` over a made-up vault.'
    then: 'The script writes `vault/wiki/backlog.md`: the heading `# Backlog`, the line `N items`, then
      `## Conserved Specs` and `## Deferred`.

      **＋** `## Conserved Specs` holds each session folder under `vault/raw/` that holds `carry.md`. Each
      has one line that names its `spec.md` and its Cases. Under that line stands one line per item of
      its `then` blocks, with the kind and the slug, read by the Spec reader of `guppi/materialize.py`.

      **＋** `## Deferred` holds one line per item. The items are each live page with a `deferred_by` that
      is not empty, each Insight whose `status` is `open`, and each line of the `## Backlog` of each `entity-sprint-<id>`,
      live under `vault/wiki/entities/` or archived under `vault/archive/`. A line holds the slug, the
      page''s `purpose` (for an Insight, its `pattern` and `severity`) and the count. A Backlog line that
      names no page stands by its text.

      **＋** The count of an item is the number of sessions whose `frontier.md`, under `vault/raw/` or
      `vault/archive/`, holds a `[-]` line that names its slug in a code span of its title. It is read
      by `generate.frontier_marks`, and `guppi/backlog.py` holds no copy of that reader.

      **＋** `N` counts the conserved Specs and the lines of `## Deferred`. A slug that stands under a
      conserved Spec does not stand again under `## Deferred`, and a slug of two sources stands once.

      **＋** A folder whose `carry.md` is gone shows nothing. Its defers enter `## Deferred` through `deferred_by`
      once `materialize` and `generate` have applied them.

      **－** A slug of a line of the `## Backlog` of an archived sprint page does not stand when the live
      sprint page names it in its `## Milestones` or its `## Backlog`, or when its page stands `built`,
      `passed` or `archived`, the statuses that tick an item in `guppi/sprint.py`.

      **－** A line of the `## Backlog` of an archived sprint page that names no page does not stand when
      the live sprint page holds a line of the same text.

      **－** The script writes no page of `vault/wiki/` and no file but `vault/wiki/backlog.md`. The governed-files
      hook refuses a hand edit of that file.'
    context: 'Today the close of a sprint is the command `guppi sprint-close` of `guppi/sprint_close.py`,
