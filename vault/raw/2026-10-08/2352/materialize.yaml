  case_text:
    context: 'Today the close of a sprint is the command `guppi sprint-close` of `guppi/sprint_close.py`,
      run by the librarian from the task line of the closing Case. It moves the finished pages of the
      sprint to the archive and leaves `vault/raw/` alone. The daily step `guppi archive` of `guppi/archive.py`
      moves only the finished sessions of earlier days, so every session of the closing day, the closing
      session included, stays in `raw/`. When such a session leaves later, it goes to the folder named
      by the first heading of `vault/wiki/sprint.md`, which by then names the next sprint. One `event_log.md`
      per date stays in `raw/` for good. After the close, `guppi sprint` finds no sprint page, stops with
      an error and leaves `sprint.md` naming the closed sprint. `backlog.md` keeps every line of the Backlog
      of a closed sprint for good, since nothing changes an archived page. Nothing sets what the Case
      that opens the next sprint asks. The steps of the closing session stand in a paragraph of `orchestration.md`,
      which every session loads.


      The person wants all of `raw/` to go to the archive at the close, and chose this. The close also
      moves each finished session of `raw/`, whatever its day (743.1). A session goes to the archive folder
      of the sprint its own `materialize.yaml` records (743.2). The close moves the event logs that no
      open session reads, and git still leaves them out (743.3). Three things stay in `raw/` because something
      still writes or reads them there: the closing session, where Retro writes after the librarian''s
      commit; a session not yet turned into pages; and a conserved Spec, which `backlog.md` and `/box`
      find only in `raw/`. The opening of a sprint does not go through the old Backlog. It says how many
      items `backlog.md` holds and asks whether to take any. A line of a closed sprint''s Backlog leaves
      `backlog.md` once the live sprint takes it or its pages are finished (743.4). After the close, `guppi
      sprint` writes `sprint.md` with the closed sprint marked, for example `## migration — closed`, instead
      of failing (743.5). The person first chose a key in `guppi.toml`, then replaced that choice with
      `sprint.md`. A render of `guppi.toml` from the sprint page would break `estimate-guppi-config-fills-the-languages`
      and `estimate-render-harness-reproduces`, which promise that a rendered file is the text of its
      page. Two skills replace the paragraph of `orchestration.md`, so that the rare text loads only in
      the rare sessions. `/sprint-open` asks the opening questions (743.6), and a `UserPromptSubmit` hook
      on `/hi` tells the agent to start it when `sprint.md` marks the sprint closed (743.7). `/sprint-close`
      starts when the person takes up the close line of the sprint, which the opening writes in a fixed
      form. It refuses in a session that already ratified another Case, puts off the other Cases lines,
      sorts the readings and has the closing Case built (743.8).


      The vault''s answer: the Grep `^(purpose|deferred_by):` over `vault/wiki/rules/` names no rule of
      a skill for the turn of a sprint. `rule-sprint-close` stands `draft`, deferred by `decision-case-718`,
      and 743.1 carries the mark that retires that defer. The Glob `vault/**/*{sweeps-raw,files-a-session,moves-old,marks-a-closed,opening-questions,starts-at-hi,leads-the-closing,rule-skill-sprint}*`
      printed nothing, so the new slugs are free. The Grep `no live sprint page|missing sprint page|finds
      no live sprint page` over `vault/wiki/`, `.claude/` and `guppi/` printed `.claude/agents/librarian-guppi.md`,
      `vault/wiki/orchestration.md`, `vault/wiki/rules/rule-orchestration.md`, `vault/wiki/rules/rule-documentation.md`,
      `vault/wiki/rules/rule-ledger-write.md`, `vault/wiki/estimates/estimate-sprint-close-next-session-opens-the-sprint.md`,
      `vault/wiki/estimates/estimate-ledger-write-holds-a-decision-line-off-the-stored-case.md`, `vault/wiki/log.md`
      and `guppi/ledger.py`. 743.5 changes the sentence of the librarian''s frame in `rule-documentation`,
      and 743.8 removes the paragraph of `rule-orchestration`. The hits in `guppi/ledger.py` and `estimate-ledger-write-holds-a-decision-line-off-the-stored-case`
