      `uv run guppi sprint` of `guppi/sprint.py` runs while no live sprint page stands, in the librarian''s
      run after a close or in `tests/test_sprint.py` over a made-up vault.


      Then:

      `guppi sprint` writes `vault/wiki/sprint.md` as `# Sprint`, the heading `## <id> — closed` and the
