      **＋** A question is out of form when its first line does not match the title line `❓ **Q<n>** -
      **<title>**:` of `.claude/skills/grill-me/SKILL.md`, judged by `QUESTION_LINE` of `guppi/casecheck.py`.

      **＋** A question is out of form when it holds no line that opens with `**Now:**`, or no line that
