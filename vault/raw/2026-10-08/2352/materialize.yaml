  origin: raw/2026-10-08/2352/ledger.md#case-743.6
  targets:
  - kind: create
    category: rules
    slug: rule-skill-sprint-open
    ref: rule-session
  - kind: create
    category: estimates
    slug: estimate-skill-sprint-open-asks-the-opening-questions
    ref: rule-skill-sprint-open
  - kind: create
    category: rules
    slug: rule-skill-sprint-open
    ref: rule-session-start
  tags:
  - sprint
  - workflow
  - harness
  case_text:
    given: '`rule-skill-sprint-open`: the new rule whose Render is the skill `/sprint-open`.

      **＋** `.claude/skills/sprint-open/SKILL.md`: the skill rendered from it.

      **＋** `estimate-skill-sprint-open-asks-the-opening-questions`: the new check of what the skill has
      the opening Case ask.

      **＋** `rule-skill-hi`: `/hi`, whose Frontier puts the line that opens the next sprint first.

      **＋** `vault/wiki/backlog.md`: the list of the items put off, which the opening Case counts.

      **＋** `vault/wiki/sprint.md`: the file whose heading marks the last sprint closed.

      **＋** `/sprint-close`: the skill that the close line names.'
    when: The main agent starts the skill `/sprint-open` of `.claude/skills/sprint-open/SKILL.md`, rendered
      from `rule-skill-sprint-open`, on `PreToolUse Skill`, or the person types `/sprint-open` on `UserPromptSubmit`,
      in a session whose `vault/wiki/sprint.md` marks the last sprint closed.
    then: 'The main agent assembles the Frontier as `rule-skill-hi` sets it, the line `open the next sprint`
      first under `## Cases`.

      **＋** When the person takes up that line, the main agent dispatches `case-guppi` with the questions
      of the opening in the prompt of the call: the id of the sprint, its goal in one sentence, its Definition
      of done as Estimates, and the first milestone and its items.

      **＋** The prompt asks that the opening Case say how many items `vault/wiki/backlog.md` holds and
      ask the person whether to take any of them.

      **＋** The prompt asks that the opening Case write, as the last item of the last milestone of the
      new sprint page, the line ``- the close of `<id>` — `/sprint-close`, a session of its own``.

      **＋** The opening Case is the first Case the session ratifies.

      **－** The opening Case goes through no item of `vault/wiki/backlog.md` that the person does not
      name.

      **－** The skill decides none of the answers: `case-guppi` puts each to the person in a round.'
    context: 'Today the close of a sprint is the command `guppi sprint-close` of `guppi/sprint_close.py`,
      run by the librarian from the task line of the closing Case. It moves the finished pages of the
      sprint to the archive and leaves `vault/raw/` alone. The daily step `guppi archive` of `guppi/archive.py`
      moves only the finished sessions of earlier days, so every session of the closing day, the closing
      session included, stays in `raw/`. When such a session leaves later, it goes to the folder named
      by the first heading of `vault/wiki/sprint.md`, which by then names the next sprint. One `event_log.md`
      per date stays in `raw/` for good. After the close, `guppi sprint` finds no sprint page, stops with
      an error and leaves `sprint.md` naming the closed sprint. `backlog.md` keeps every line of the Backlog
      of a closed sprint for good, since nothing changes an archived page. Nothing sets what the Case
      that opens the next sprint asks. The steps of the closing session stand in a paragraph of `orchestration.md`,
      which every session loads.


      The person wants all of `raw/` to go to the archive at the close, and chose this. The close also
      moves each finished session of `raw/`, whatever its day (743.1). A session goes to the archive folder
      of the sprint its own `materialize.yaml` records (743.2). The close moves the event logs that no
      open session reads, and git still leaves them out (743.3). Three things stay in `raw/` because something
      still writes or reads them there: the closing session, where Retro writes after the librarian''s
      commit; a session not yet turned into pages; and a conserved Spec, which `backlog.md` and `/box`
      find only in `raw/`. The opening of a sprint does not go through the old Backlog. It says how many
      items `backlog.md` holds and asks whether to take any. A line of a closed sprint''s Backlog leaves
      `backlog.md` once the live sprint takes it or its pages are finished (743.4). After the close, `guppi
      sprint` writes `sprint.md` with the closed sprint marked, for example `## migration — closed`, instead
      of failing (743.5). The person first chose a key in `guppi.toml`, then replaced that choice with
      `sprint.md`. A render of `guppi.toml` from the sprint page would break `estimate-guppi-config-fills-the-languages`
      and `estimate-render-harness-reproduces`, which promise that a rendered file is the text of its
      page. Two skills replace the paragraph of `orchestration.md`, so that the rare text loads only in
      the rare sessions. `/sprint-open` asks the opening questions (743.6), and a `UserPromptSubmit` hook
      on `/hi` tells the agent to start it when `sprint.md` marks the sprint closed (743.7). `/sprint-close`
      starts when the person takes up the close line of the sprint, which the opening writes in a fixed
      form. It refuses in a session that already ratified another Case, puts off the other Cases lines,
      sorts the readings and has the closing Case built (743.8).


      The vault''s answer: the Grep `^(purpose|deferred_by):` over `vault/wiki/rules/` names no rule of
      a skill for the turn of a sprint. `rule-sprint-close` stands `draft`, deferred by `decision-case-718`,
      and 743.1 carries the mark that retires that defer. The Glob `vault/**/*{sweeps-raw,files-a-session,moves-old,marks-a-closed,opening-questions,starts-at-hi,leads-the-closing,rule-skill-sprint}*`
      printed nothing, so the new slugs are free. The Grep `no live sprint page|missing sprint page|finds
      no live sprint page` over `vault/wiki/`, `.claude/` and `guppi/` printed `.claude/agents/librarian-guppi.md`,
      `vault/wiki/orchestration.md`, `vault/wiki/rules/rule-orchestration.md`, `vault/wiki/rules/rule-documentation.md`,
      `vault/wiki/rules/rule-ledger-write.md`, `vault/wiki/estimates/estimate-sprint-close-next-session-opens-the-sprint.md`,
      `vault/wiki/estimates/estimate-ledger-write-holds-a-decision-line-off-the-stored-case.md`, `vault/wiki/log.md`
      and `guppi/ledger.py`. 743.5 changes the sentence of the librarian''s frame in `rule-documentation`,
      and 743.8 removes the paragraph of `rule-orchestration`. The hits in `guppi/ledger.py` and `estimate-ledger-write-holds-a-decision-line-off-the-stored-case`
      speak of the ledger hook, which judges the sprint by the live page and not by `sprint.md`, so they
      stand. The hit in `rule-ledger-write` is a History line. I did not read `log.md`. In `estimate-sprint-close-next-session-opens-the-sprint`,
      the exception that the error of `guppi sprint` in the closing run is a flag names an error that
      no longer comes. It stands, since it fails nothing, and its reading waits for the session after
      the close.


      The frame: `estimate-raw-archive` stands. Its Criterion covers `guppi archive` alone: it limits
      that command to earlier days, keeps `event_log.md` in `raw/` under it, and names no source of `<sprint>`.
      The sentence of `rule-sprint` that `sprint_id`, `cleanup` and `archive` read the first heading stands:
      the closed heading keeps the id as its first word, and the archive falls back to it. `guppi cleanup`
      still files pages by that heading, and this Case does not change it. `estimate-backlog-renders`
      and `estimate-sprint-checks-the-file` speak of what changes, so 743.4 and 743.9 replace their Criteria
      and set their `method` to a test of this session. 743.9 drops the old exception that no sprint page
      is an error of the check, since the check now compares the closed form, and it stands apart from
      743.5 because the check is a promise of its own. The Criteria of `estimate-sprint-close-takes-the-readings-in-groups`
      and `estimate-sprint-close-runs-in-the-librarian-run` stand: the skill keeps the behaviour that
      the paragraph of `orchestration.md` set. The other Estimates of `rule-sprint-close` speak of the
      pages the close moves, which do not change. No test reads a live file of `vault/` or `.claude/`
      through the code this Case changes. `rule-skill-sprint-open` hangs under `rule-session-start` and
      `rule-skill-sprint-close` under `rule-plan-mode`, as the other skill rules hang under a phase, since
      a child of `rule-session` would break `estimate-session-phases-in-order`. The start of `/sprint-close`
      puts off the other items by short-form defers, so 743.8 adds it as a third moment of the short form
      in `rule-orchestration`. The close keeps a conserved Spec by `is_carried_over` of `guppi/materialize.py`,
      the judgment `guppi sprint` and `guppi/box.py` already use. `estimate-sprint-ticks-the-spec` stands:
      its When, a run that wrote the file and exits 0, holds for the closed form, so that run ticks as
      any other (743.5). Two Estimates of `entity-sprint-migration` keep a reason that the change makes
      out of date, and they stand. `estimate-sprint-migration-leftovers-gone` says that a past `event_log.md`
      stays in `raw/` as `rule-raw-archive` keeps it. That still holds at its reading, which comes before
      the close; the page now adds that the close moves the log afterwards. `estimate-sprint-migration-merges`
      calls the merge into `main` a line of the Backlog, which 743.8 removes. Neither exception fails
      anything. Replacing their Criteria needs a `method` that runs in this session, while both are read
      by their `method` in the session that closes the sprint, as the Definition of done of `migration`
      (case 628.9). A Case of that session or a later one may correct them. Not done: the close of `migration`
      itself, which is a session of its own (case 628.9). A skill''s behaviour is read in this session
      from its Render in the Spec, and the first live run is the next close.'
