  sections:
    Criterion: 'When:

      `uv run guppi sprint-close --sprint <id>` of `guppi/sprint_close.py` previews or closes a sprint,
      in the librarian''s run or in `tests/test_sprint_close.py` over a made-up vault.


      Then:

      After a close whose run of `guppi cleanup` exits 0, each unit of `vault/raw/` that `guppi/archive.py`
      judges done moves to `vault/archive/` by the move of `guppi archive`, whatever its date.

      **＋** Stdout holds one line per unit, moved or kept with its reason, in the form of `guppi archive`.

      **＋** The preview without `--apply` names each unit the close would move, and moves none.

      **－** The session of the run does not move.

      **－** A unit with no yaml, an entry not applied or a ledger line outside the yaml stays in `vault/raw/`.

      **－** A unit whose folder holds `carry.md`, judged by `is_carried_over` of `guppi/materialize.py`,
      stays in `vault/raw/` with the reason `carried over`.

      **－** A refused close moves no unit.'
