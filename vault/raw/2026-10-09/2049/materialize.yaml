      the names and the short texts stand in the language of the chat, that the file goes by `SendUserFile`
      in the same reply, and that the example passes the check of `rule-case-check` at the `Stop` of the
      reply and at the person''s next message, which is the source of the limits, and that a refusal of
      the check, or its note at the person''s next message, names the limit a showing broke; it lists
      no other limit.

      **＋** The check finds no text outside the list and the `ratification`, the leading rule included,
      reads the `ratification` as the showing of each sub-case it names, and finds no difference from
      the store, and the test passes.

      **＋** The example with the lines of its fence not quoted gives the finding of a text outside the
      list, and the test asserts it.

      **＋** The test reads the example from `vault/wiki/orchestration.md` and the checks from `guppi/casecheck.py`,
      and holds no copy of either.

      **－** While `vault/wiki/orchestration.md` holds no block tagged `showing`, both tests of `tests/test_orchestration.py`
      that read it fail with a message that names the file; no test of the file is skipped.'
