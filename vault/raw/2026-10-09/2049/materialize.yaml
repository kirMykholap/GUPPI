      heading follows, a reply with no Case heading that holds a section, a fence tagged `DIFF` and a
      deferred decision in the short form are not judged, and it prints nothing for them.

      **－** It exits 0 always and never blocks the person''s message. An error of its own goes to stderr.

      **－** The person sees nothing of the note. It stores nothing and writes no file.'
