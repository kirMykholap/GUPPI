      came back — a text given back whose first line that is not blank opens with `**Built:**` — and before
      its last tool call. It judges only the texts after the reply that the last refusal of `uv run guppi
      casecheck` in the turn follows, judged by `refusals` of `guppi/ledger.py`.

      **＋** On a fault it prints one line to stdout, which reaches the agent''s context. The line quotes
      the first such text, says that the Case stands as shown and is not shown again, and tells the agent
      to write nothing of its own before the Case but a horizontal rule and to keep its own text after
      the horizontal rule at the next showing.

      **－** A showing with no rule before its first Case heading, or with no rule between two Cases, gets
      no note for it.

