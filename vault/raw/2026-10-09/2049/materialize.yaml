      the first Case heading. It finds a fault when a line between a Case heading and the next Case heading
      or the horizontal rule `---` is not blank, not a list item — a line that opens with `- `, `* ` or
      a number and `. ` — not a line indented under a list item, and not a line of the `ratification`
      blockquote.

