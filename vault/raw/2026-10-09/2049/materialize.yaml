      a horizontal rule stands before the first round of the list and one between the last question of
      one Case and the round of the next, and no heading or other line of the main agent''s own but such
      a rule marks where a round begins.

      **＋** It then shows every Case built again in one reply, in the showing that `vault/wiki/orchestration.md`
      sets, for one ratification.

