  sections:
    Criterion: 'When:

      A reply of the main agent shows a Case under `## Case N —` or `### Case N.M —` with at least one
      of its sections, not a deferred decision in the short form. `Stop` fires and `uv run guppi casecheck`
      of `guppi/casecheck.py` runs on it. Then the person sends a message, and `uv run guppi casecheck
      --prompt` runs on `UserPromptSubmit`, as `.claude/settings.json` registers it.


      Then:

      At `Stop`, `uv run guppi casecheck` refuses no showing for a text of the main agent''s own before
      its first Case heading, outside its list and its `ratification`, or written after the summary of
      `case-guppi` came back.

      **＋** It still refuses a shown Case that differs from the checked text, or whose file was not sent
      or differs from the store, as `estimate-case-check-shows-only-the-checked-case` sets it.

      **＋** On `UserPromptSubmit`, `uv run guppi casecheck --prompt` judges the last reply of the main
      agent before the person''s message, and the turn that reply ends, when that reply shows a Case.

      **＋** It finds a fault when a line that is neither blank nor the horizontal rule `---` stands before
      the first Case heading. It finds a fault when a line between a Case heading and the next Case heading
      or the horizontal rule `---` is not blank, not a list item — a line that opens with `- `, `* ` or
      a number and `. ` — not a line indented under a list item, and not a line of the `ratification`
      blockquote.

      **＋** A horizontal rule `---` whose next line that is not blank is a Case heading ends one Case,
      and the judgment goes on under that heading, so each Case of a batch is judged.

      **＋** It finds a fault when the main agent wrote text in the turn after the first summary of `case-guppi`
      came back — a text given back whose first line that is not blank opens with `**Built:**` — and before
      its last tool call. It judges only the texts after the reply that the last refusal of `uv run guppi
      casecheck` in the turn follows, judged by `refusals` of `guppi/ledger.py`.

      **＋** On a fault it prints one line to stdout, which reaches the agent''s context. The line quotes
      the first such text, says that the Case stands as shown and is not shown again, and tells the agent
      to write nothing of its own before the Case but a horizontal rule and to keep its own text after
      the horizontal rule at the next showing.

      **－** A showing with no rule before its first Case heading, or with no rule between two Cases, gets
      no note for it.

      **－** A text written before the first summary came back, text after a horizontal rule that no Case
      heading follows, a reply with no Case heading that holds a section, a fence tagged `DIFF` and a
      deferred decision in the short form are not judged, and it prints nothing for them.

      **－** It exits 0 always and never blocks the person''s message. An error of its own goes to stderr.

      **－** The person sees nothing of the note. It stores nothing and writes no file.'
