  change: the Criterion replaced whole — a leading horizontal rule is no text before a round
  sections:
    Criterion: 'When:

      A reply of the main agent shows a round of `case-guppi`, `Stop` fires and `uv run guppi casecheck`
      of `guppi/casecheck.py` runs on it. Then the person sends a message, and `uv run guppi casecheck
      --prompt` runs on `UserPromptSubmit`, as `.claude/settings.json` registers it.


      Then:

      At `Stop`, `uv run guppi casecheck` refuses no reply for the way it opens a round of `case-guppi`,
      or for a text of the main agent''s own before the round. Its other reasons stand.

      **＋** On `UserPromptSubmit`, `uv run guppi casecheck --prompt` judges the last reply of the main
      agent before the person''s message, and the turn that reply ends. The turn holds a round when a
      text that `case-guppi` gave back in it is a round by `is_round` of `guppi/casecheck.py`.

      **＋** It finds a fault when the first line of the reply that is neither blank nor the horizontal
      rule `---` opens neither with `❓ ` nor with a bold label that ends in a colon. While the session''s
      event log holds no `prespec` line of this session after its `hi`, it also finds a fault when the
      main agent wrote text in the turn after the first round came back and before its last tool call.
      It judges only the texts after the reply that the last refusal of `uv run guppi casecheck` in the
      turn follows, judged by `refusals` of `guppi/ledger.py`.

      **＋** On a fault it prints one line to stdout, which reaches the agent''s context. The line quotes
      the text before the round, says that the round stands as shown and is not shown again, and tells
      the agent to open the next round with its Context paragraph or its first question, with nothing
      before it but a horizontal rule.

      **＋** `.claude/settings.json` registers `uv run guppi casecheck --prompt` on `UserPromptSubmit`,
      as `rule-hook-registry` renders it.

      **－** A reply that opens with the horizontal rule `---` before its round gets no note for it, and
      neither does a reply with no rule before its round.

      **－** With no fault, in a turn with no round, and for text after the last question, it prints nothing.

      **－** It exits 0 always and never blocks the person''s message. An error of its own goes to stderr.

      **－** The person sees nothing of the note. It stores nothing and writes no file.

      **－** The refusals of the `Stop` run are counted as `estimate-case-check-judges-a-showing-after-a-refusal`
      sets it, and a layout fault of a round is not one of them.'
  applied: '22:10:50'
