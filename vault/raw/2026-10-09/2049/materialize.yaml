  case_text:
    given: '`rule-orchestration`: its Render sets how the main agent shows a reply of `case-guppi`.

      **＋** `vault/wiki/orchestration.md`: the file rendered from `rule-orchestration`.

      **＋** `estimate-orchestration-sets-off-each-reply-of-case-guppi`: the new check of the rules around
      a reply.'
    when: The main agent shows in the chat a reply of `case-guppi` — a round of questions, a `**Fact:**`
      answer it passes on, or a built Case with its list and its `ratification` — with `vault/wiki/orchestration.md`
      rendered from `rule-orchestration`.
    then: 'A horizontal rule stands on its own line before the reply of `case-guppi`.

      **＋** A second horizontal rule stands after the reply; the main agent''s own text follows it, or,
      in a batch, the next reply of `case-guppi`, for which that rule is the rule before it.

      **＋** Each rule is the line `---` alone, with a blank line after it, and with a blank line before
      it unless it opens the reply, so that Markdown does not read the line above it as the underline
      of a heading.

      **－** A `**Waiting:**` line, the acknowledging reply and a Case in the short form are no reply of
      `case-guppi` and get no such rules.'
    context: 'The main agent shows the replies of `case-guppi` in the chat: a round of questions, a `**Fact:**`
      answer, and a built Case with its list and its `ratification`. Today `orchestration.md` allows one
      horizontal rule at most in a reply, after the Case or the last question of a round, and only when
      the agent''s own text follows. In a batch, the rounds of several Cases stand in one list, and only
      the Context label and the question numbers mark where one Case ends and the next begins; case 699.5
      forbids any other line of the agent''s own there, and step 4 of the `/pre-spec` skill says the same
      for the loop after its findings (case 699.7). A Fact answer that the agent passes on gets no rule.
      The person asked for each reply of `case-guppi` to stand between two rules, and for a rule between
      the Cases of a batch, in the loop after `/pre-spec` too. The note that `uv run guppi casecheck --prompt`
      gives at the person''s next message works against that layout: `round_opening` of `guppi/casecheck.py`
      takes the first line that is not blank, so a leading `---` gets the note, and `outside_the_list`
      notes any line before the first Case heading and stops reading at the first `---`, so in a batch
      only the first Case would be judged. Both only add a note and never refuse; the `Stop` comparison
      (`shown_text`, `mechanical_parts`, `fence_ledger_lines`) cuts each Case at its own `---` after `split_cases`
      splits by heading, so a leading rule or a rule between Cases changes nothing there. The code changes
      in Work Mode and accepts a showing and a round with or without the rules, so the agent may keep
      the old layout until the librarian renders the new `orchestration.md` and `SKILL.md`, and no old
      form needs to be kept apart. `tests/test_orchestration.py` is the one test that reads a live file
      and reaches the changed code: a Grep `orchestration\.md` over `tests/` printed only that file. It
      runs `outside_the_list` over the example of a showing in `vault/wiki/orchestration.md`; the new
      check accepts the example as it stands and as Case 751.6 changes it. A Grep `horizontal rule` over
      `guppi/`, `tests/`, `.claude/` and `vault/wiki/` printed `guppi/casecheck.py`, `.claude/skills/pre-spec/SKILL.md`,
      `vault/wiki/rules/rule-prespec.md`, `.claude/agents/case-guppi.md`, `vault/wiki/rules/rule-case-protocol.md`,
      `vault/wiki/rules/rule-orchestration.md`, `vault/wiki/rules/rule-case-build.md`, `vault/wiki/orchestration.md`,
      `vault/wiki/log.md`, `tests/test_casecheck.py`, `vault/wiki/estimates/estimate-case-check-refuses-text-outside-the-list.md`,
      `vault/wiki/estimates/estimate-orchestration-shows-the-built-case.md`, `vault/wiki/estimates/estimate-orchestration-showing-example-passes-the-check.md`
      and `vault/wiki/estimates/estimate-prespec-confirms-the-findings-once.md`. These stand: step 7 of
      the `/pre-spec` skill and `estimate-prespec-confirms-the-findings-once` put the agent''s own text
      after the rule, which still holds; `case-guppi.md`, rendered from `rule-case-build`, has `case-guppi`
      end a round with no rule, and the main agent adds the rules; the line of `rule-case-protocol` and
      `log.md` are History; the two notes now allow a horizontal rule before a round or a Case, and the
      parts of their text that `tests/test_casecheck.py` asserts, `nothing before it` and `after the horizontal
      rule`, stay in them. A Grep `mark where|other line of|rule at most|one horizontal rule` over `vault/wiki/`
      printed `vault/wiki/orchestration.md`, `vault/wiki/log.md`, `vault/wiki/rules/rule-case-protocol.md`,
      `vault/wiki/rules/rule-skill-grill-me.md`, `vault/wiki/rules/rule-orchestration.md`, `vault/wiki/rules/rule-prespec.md`,
      `vault/wiki/estimates/estimate-orchestration-shows-the-built-case.md`, `vault/wiki/estimates/estimate-prespec-gathers-the-answers-after-findings.md`,
      `vault/wiki/estimates/estimate-orchestration-showing-example-passes-the-check.md` and `vault/wiki/estimates/estimate-orchestration-marks-each-round-of-a-batch.md`;
      the hit of `rule-skill-grill-me` is about the lines of a question, not a rule. `estimate-orchestration-shows-the-built-case`
      stands: its Criterion puts the agent''s own text after one rule, which still holds, and its line
      that the main agent writes no context of its own before a round does not cover a rule. Other sentences
      of `rule-orchestration` also stand: the round sentence of `## Who builds a Case` adds nothing between
      the questions of one round, and a rule stands between rounds of two Cases. The sentence that a text
      of the agent''s own before a round or a Case is not refused also stands, since the new rules are
      part of the form. A Grep `\*\*Fact:\*\*` over `.claude/` and `vault/wiki/` printed `vault/wiki/orchestration.md`,
      `.claude/agents/case-guppi.md`, `vault/wiki/estimates/estimate-case-check-sends-back-a-faulty-round.md`,
      `vault/wiki/rules/rule-orchestration.md`, `vault/wiki/rules/rule-case-build.md`, `vault/wiki/estimates/estimate-case-build-writes-the-case.md`,
      `vault/wiki/estimates/estimate-orchestration-shows-the-built-case.md`, `vault/wiki/estimates/estimate-case-check-sends-back-a-faulty-case.md`,
      `vault/wiki/estimates/estimate-case-check-sends-back-a-summary-without-the-case-name.md` and `vault/wiki/estimates/estimate-orchestration-forwards-a-discussion-question.md`.
      Only `rule-orchestration` sets how the agent shows a Fact; the four Estimates of `rule-case-check`
      and `rule-case-build` speak of what `case-guppi` gives back, not of the chat. `estimate-orchestration-forwards-a-discussion-question`
      stands: it has the agent show the Fact answer translated and then ask the open question again, which
      still holds; the rules around that answer are the promise of 751.1. `estimate-orchestration-signs-a-batch-together`,
      `estimate-orchestration-signs-items-taken-together` and `estimate-orchestration-batches-cases-out-at-once`
      stand too. They promise one list of every round, each question numbered `<Case id>.Q<n>`, and every
      Case of the batch in one reply, which still holds; none of them forbids a line between rounds, and
      the rules of that list are the promise of 751.2. Case 752 of this session changes `rule-case-build`
      and sets what `case-guppi` searches before a code task; it touches no page and no moment of this
      Case. A re-pitch by `wait-what` is the agent''s own text and is not covered. The page `rule-case-check`
      names no first line of a round or a showing, so it does not change; its Estimates do. Each sub-case
      that replaces a Criterion carries its standing lines as they are and rewrites only the lines the
      rules change, so the check notes those rewritten lines as not carried. The sub-cases share words
      because 751.4 and 751.5 carry the standing lines of two Criteria of one check, and the other sub-cases
      speak of the same rules at different moments; no line of one sub-case states the promise of another.'
  parent: decision-case-751
  spec: vault/raw/2026-10-09/2049/spec.md
  applied: '22:10:50'
