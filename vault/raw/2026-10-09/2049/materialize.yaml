      — the comparison of its `Stop` run and the judgment of the layout of its run on `UserPromptSubmit`
      — with a store whose sub-cases hold the ledger lines the example''s `ratification` gives them.


      Then:

      `vault/wiki/orchestration.md` holds, under its own heading at the end of `## Showing and signing
      a Case`, one block tagged `showing`: a reply that shows a Case with two sub-cases between two horizontal
      rules — a rule, its heading, one list with an item per sub-case, one `ratification`, a rule and
      the agent''s own text.

      **＋** The `ratification` of the example is a quote block: the line `> **ratification:**`, then the
      fence and the ledger lines of both sub-cases, each line opening with `> `.

