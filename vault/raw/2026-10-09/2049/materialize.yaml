      Case, to the `case-guppi` of that Case by `SendMessage`, one message to each `case-guppi`, as soon
      as the report asks the person no question or the person has answered every question of the report.

      **＋** While a question of the report is unanswered, the main agent sends nothing to any `case-guppi`.

      **＋** A question of the report that the person leaves unanswered is asked again in the shape of
      `.claude/skills/grill-me/SKILL.md` under its number.

      **＋** The main agent ends each turn that sends to a `case-guppi`, and each turn that an answer opens
      while another answer it sent is still out, with one line that opens with a bold label ending in
      a colon and names the Cases that have answered and the Cases still out.

      **＋** That line holds nothing of what an answer says and no question, and the main agent writes
      nothing else in the chat while an answer is out and passes on no answer of one `case-guppi` alone.

      **＋** It then shows the person one list of every round that came back, each question in the shape
      of `.claude/skills/grill-me/SKILL.md` and numbered `<Case id>.Q<n>` by the Case it belongs to, sends
      each answer to the `case-guppi` of its Case in one message, and repeats the wait and the list until
      every `case-guppi` it sent has answered with its Case.

