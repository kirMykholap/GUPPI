      only by the render after that Case is ratified
    method: 'by hand, after the session whose Work Mode builds the install skill of rule-morph: /hi typed
      in an empty project with GUPPI installed and no answers in its settings, the transcript of that
      session and the files its Work Mode writes read against the Criterion, recorded in the estimate
      line'
    tags:
