  case_text:
    context: 'Today `case-guppi` starts from the pages an item names, and reaches code only through a
      page field: `governs`, `implementation_ref` or `code_ref`. In a project that already has code and
      few pages, an item on that code finds no page, so `case-guppi` never reads the code and has nothing
      to build the Case on. On item C3 the person proposed that each Case read the code it touches and
      offer a page for it, so the pages grow Case by Case. In the round of Case 802 the person chose this
      over a scan of the whole codebase at install, and chose a separate Case for it. With the person''s
      answers to the round below, the Render of `rule-case-build` gains one sentence after the sentence
      that reads the code a page points to. Code counts as covered when a live page names its file, or
      a folder that holds it, in one of the three fields. For code that no page covers, `case-guppi` reads
      the code, searches the pages by meaning, and offers in a round either the path added to a page that
      already describes the thing, or a new page for the thing the Case changes. That page is a task of
      the same Case, and the Estimate of the Case stands on it.


      The rule that governs the options is `rule-entities-schema`: a thing the developer builds is an
      Entity, and a part comes only from the person''s words, through a Case. The new step only offers,
      and the person decides in the round, so the sentence on parts stands, by the person''s answer. Its
      clause on the cut that the agent proposes in Retro is about splitting a page that already exists,
      not about a first page for code. The frame showed one sentence that the change makes false. The
      Render of `rule-case-protocol`, which is `vault/wiki/case-schema.md`, lists `code_ref` among the
