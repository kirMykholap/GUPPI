      lint` reads a page of `vault/wiki/entities/`.'
    then: 'The file equals the Render. Lint reads from it: required `type, kind, purpose, status, estimates,
      origin, sprint, created, tags`; optional `parent, children, code_ref, deferred_by, rules, core`;
      values `kind: MOC | Leaf`, `status: draft | built | archived`, `core: true`; conditional — `Leaf`
      requires `parent`, `MOC` requires `children`; the sections `## Purpose` and `## History` required,
      `## How it works`, `## Milestones`, `## Backlog`, `## Closed`, `## Terms` optional.

      **＋** The file also holds `computed: [rules]`, which lint does not read.

      **＋** An Entity page with these fields, values and sections has no `schema` finding; one lacking
      a required field, with a value outside the list, with a conditional not met or lacking a required
      section has one finding per defect; an Entity with `rules` on live Rules has none; the glossary
      page with `## Terms` has none.

      **＋** An Entity page in the shape with `core: true`, `origin: guppi` and `sprint: guppi` has no
      `schema` finding.

      **＋** `fields` and `sections` describe each name of these lists, `rules`, `core` and `## Terms`
      among them, and the descriptions of `origin` and `sprint` name the value `guppi` on a page with
      `core: true` in the clean version; `description` holds the introduction, the Slug, `built`, `How
      it works` and Constraints notes, the sentence on the edge Rule → Entity and the one on the glossary
      page; `examples` holds the example pages.'
    context: 'Other people will install GUPPI from a clean copy of this project. That copy has no pointers
      to the decisions of this repository and none of its session records. Today nothing builds such a
      copy. `.github/workflows/checks.yml` runs the style, test and lint checks, and it skips a push to
      `prod`. The ruleset on `prod` that `rule-github-repository` sets lets only the owner write that
      branch, and that page plans to add the CI that writes `prod` to the bypass list. The texts carry
      these pointers everywhere. A Grep `\(cases? [0-9]` over `.claude/` counted 66 in 13 files, and a
      Grep `case [0-9]` over `guppi/` counted 894 in 32 files. Some sit inside a sentence, such as a link
      from `rule-page-read` to a Lesson page that names session 0051. The person chose, in this order:

      - the copy holds the code, the harness, the pages marked by a new optional field `core` and the
      files rendered from them (the person proposed the field, so that a page can stay in `main` while
      it is tried live)

      - a command removes what it can safely remove and fails on the rest

      - a push to `main`, or a push of a tag `prod-*` on a commit of another branch, writes `prod` as
      one commit on top of the last (at pre-spec the person put the tag in place of a run the owner starts
      by hand)

      - a deploy key with write access goes on the bypass list, and the workflow pushes to `prod` with
      it (in Work Mode, the GitHub Actions app could not be put on the bypass list of this repository,
      which belongs to a personal account, so the person chose the key in place of the app)

      - a new rule page, `rule-clean-branch`, which applies only to this repository and does not ship

      - the schema of rules says that a page with `core: true` comes into a new project without its Estimates,
      which that project writes through its own Cases (at pre-spec)

      - `entity-guppi`, `entity-sprint`, `entity-glossary` and every rule page but `rule-github-repository`
      get `core` now; no Estimate does

      - a shipped page carries `origin: guppi`, `sprint: guppi` and a History of one line, and the schemas
      and lint accept that

      - a later Case of this sprint rewords the text the command refuses

      - the copy leaves out `guppi.toml`, so the install step of Case 802 starts in a new project

      - the put-off question on the future shape of GUPPI, decision 616 on `entity-guppi`, stays open


      The rule that governs the options is `rule-ratification`: every page that ships carries a signed
      `core`, set by a decision line of its own, and no script marks a page. The removal and the check
      are new code that judges text. `rule-one-judgment-one-implementation` sets that they share the judgments
      that exist. A Grep `\\\(cases?` over `guppi/` printed nothing, so no code judges a parenthesis of
      case references today. A Grep `WIKILINK\s*=|CODE_SPAN\s*=` over `guppi/` printed `guppi/glossary.py`,
      `guppi/lint.py` and `guppi/sprint.py`. The check of body links calls `links_of` of `guppi/lint.py`,
      the function that the `ref` check of lint calls. The pattern of `guppi/glossary.py` reads one table
      cell, and the one of `guppi/sprint.py` reads a milestone line, so neither judges a page body. A
      Grep `^(ID|CASE_ID)\s*=|import ID as CASE_ID` over `guppi/` printed `guppi/caseid.py`, `guppi/box.py`
      and `guppi/lint.py`, so the pattern of a case reference is built on `ID` of `guppi/caseid.py`. The
      value `guppi` and the test for `core` are new. Both live in `guppi/pages.py`, which lint and the
      new `guppi/ship.py` import. The session folder patterns of `guppi/generate.py` and `guppi/materialize.py`
      judge a folder name, not a sentence, so the pattern of a session mention in prose is new.


      The frame showed four Criteria that the change makes false. `estimate-entities-schema-checked`,
      `estimate-rules-schema-checked` and `estimate-estimates-schema-checked` list every optional field
      of their schema, and `estimate-lint-finds-a-broken-link` calls an `origin` of another form a finding.
      Sub-cases 804.1 to 804.4 replace them, by the person''s answer. Their `purpose` and `method` do
      not state the old promise, so they stand. A Grep `check_origin|ORIGIN_CASE|ORIGIN_LINE` over `guppi/`
      and `tests/` printed `guppi/lint.py`, `guppi/caseid.py` and `tests/test_caseid.py`. The test there
      reads both forms of a ledger origin, and that still holds. A Grep `` `origin` `` over `vault/wiki/`
      without `log.md` and `brief.md` printed 27 files. Two other sentences state the form of the field.
      The row `origin` of `entity-glossary` speaks of a page a Case created, which a shipped page in a
      new project is not, so it stands. The sentence of `rule-vault-layout` that `ref` and `origin` name
      filenames speaks of references to pages, and `guppi` names no page, so it stands. A Grep `\bcore\b`
      over `vault/wiki/` without `log.md` and `brief.md`, and over `.claude/`, printed nothing, so the
      new field clashes with no term.


      A Grep `schema\.yaml|rule-github-repository|estimate-lint-finds-a-broken-link|estimate-sprint-plugin-ci|checks\.yml`
      over `tests/` printed `tests/test_lint.py`, `tests/test_prespec.py`, `tests/test_casecheck.py`,
      `tests/test_ratified.py`, `tests/test_generate.py`, `tests/test_schemas.py`, `tests/test_materialize.py`,
      `tests/test_orchestration.py` and `tests/test_case_schema.py`.

      - `tests/test_schemas.py` reads the live schema files. Its value test takes the first entry of `values`,
      which stays `kind`. `core` adds no conditional.

      - `tests/test_generate.py`, `tests/test_materialize.py`, `tests/test_orchestration.py` and `tests/test_case_schema.py`
      copy the live schema files into a temporary folder. An optional field more lets a `create` key `core`
      through, and none of them writes that key. The stray-key test of `tests/test_materialize.py` uses
      `contract_note`.

      - The other files write schemas of their own.


      A Grep `\bprod\b` over the repository outside `vault/raw/` and `vault/archive/` printed `vault/wiki/brief.md`,
      `.github/workflows/checks.yml`, `vault/wiki/entities/entity-guppi-repository.md`, `vault/wiki/rules/rule-github-repository.md`
      and `vault/wiki/estimates/estimate-sprint-plugin-pull-requests-reviewed-on-github.md`. The sentence
      of `rule-github-repository` that plans the bypass changes in 804.7. So do its sentences on who writes
      `prod` and who pushes, and its `purpose`. The Purpose of `entity-guppi-repository` names `rule-github-repository`
      as its only rule, and 804.6 changes it. The Criterion on pull requests from a second account, which
      cannot push to `prod`, stays true. `checks.yml` keeps skipping a push to `prod`.


      Before the `create` of `rule-clean-branch`, which has no `ref`, the vault query of `ask-guppi` ran.
      The Greps `^(purpose|deferred_by):` over the rules and the entities show no page on a clean version.
      The nearest page is `rule-github-repository`, which holds the settings of the repository. `entity-guppi`
      carries the put-off decision 616, which the person left open. A Glob `vault/**/*clean-branch*` printed
      only `vault/wiki/estimates/estimate-sprint-plugin-ci-writes-a-clean-branch.md`, so `rule-clean-branch`
      and `estimate-clean-branch-writes-a-clean-copy` are free. The tags `ci`, `git` and `plugin` stand
      in `tags.md`.


      In 804.5 the marking adds one field and no sentence, and it changes no Render. I did not read the
      rule pages whole. A Grep `\bcore\b` over them printed nothing. Cases of this session change the
      text of some of them:

      - Case 802 changes `rule-morph` and `rule-guppi-config`.

      - Case 803 changes `rule-case-build` and `rule-case-protocol`.

      - Cases 800 and 801 change `rule-ask` and `rule-case-build`, by the ledger.


      A field beside their text contradicts none of them. The marks of 804.5 are checked by `estimate-sprint-plugin-ci-writes-a-clean-branch`,
      whose Criterion in 804.7 gains the line that `prod` holds each page with `core: true` and no other
      page: the live run reads exactly the set the marks choose, so a missing or stray mark shows there,
      by the person''s answer at pre-spec. The new text of `rule-morph` from Case 802 links `entity-sprint-plugin`
      in its body. That link does not ship, so the check of 804.6 will refuse it, and it goes to the rewording
      Case. The pages get `core` at the librarian''s run, after Work Mode. So the Work Mode run of `guppi
      ship` lists only the leftovers of the code and the harness. The leftovers of the pages come from
      the first CI run, which the owner starts by a tag `prod-*` on a commit of `plugin` after pushing
      the librarian''s commit, by the person''s answer.


      At pre-spec the check of the plan asked for an update of the sprint page, since this Case works
      on an item of the sprint. 804.7 gives the item of the milestone The clean branch of `entity-sprint-plugin`
      two links, `rule-clean-branch` and `estimate-sprint-plugin-ci-writes-a-clean-branch`. By the person''s
      answer, the item ticks only when the rule is `built` and the live run has passed, which comes after
      the rewording Case. Case 802, as its file stands, updates the same page in its `## Backlog`. The
      pair of 804.7 changes only the line of the item of The clean branch, so the two changes do not touch
      the same text. Its Estimate `estimate-sprint-plugin-ci-writes-a-clean-branch` gets a new trigger
      in 804.7. Its `purpose` still states the promise and stands. Its `method` is set anew to name the
      run by tag and the reading of the `on:` block. The last brief, under `## Readings at the close`,
      reports `make test` at 1587 passed and 6 skipped, and `make lint` at 2 lines: the defer count of
      `rule-morph`, and the failed reading of `estimate-case-build-reads-the-last-output-of-a-check`.
      No check of this Case rests on lint over the copy.'
