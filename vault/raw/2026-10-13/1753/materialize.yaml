decisions:
- case: '800.1'
  decision: decision-case-800.1
  origin: raw/2026-10-13/1753/ledger.md#case-800.1
  targets:
  - kind: update
    category: rules
    slug: rule-case-build
    ref: rule-case-build
  - kind: update
    category: estimates
    slug: estimate-case-build-answers-what-done-means
    ref: rule-case-build
  tags: []
  case_text:
    given: '`rule-case-build`: the rule of `case-guppi`; one sentence of its Render changes.

      **＋** `.claude/agents/case-guppi.md`: the file rendered from `rule-case-build`.

      **＋** `raw/<date>/<hi HHMM>/cases/case-<N>.md`: the file of a Case.

      **＋** `estimate-case-build-answers-what-done-means`: its Criterion, `purpose` and `method` replaced.

      **＋** `rule-orchestration`: the main agent sends back a summary in which a Case gives no Estimate.'
    when: '`case-guppi` writes a Case into `raw/<date>/<hi HHMM>/cases/case-<N>.md`, following `.claude/agents/case-guppi.md`
      as rendered from `rule-case-build`.'
    then: 'Each Case and sub-case of the file creates an Estimate or replaces the Criterion of one, or
      its `context`, or its parent''s, names by slug the Estimate that already checks the change and says
      why its Criterion stands.

      **＋** The summary that `case-guppi` answers with names that Estimate under the item of each Case
      and sub-case.

      **＋** A question of a round before the Case on how it is checked gives an option that names by slug
      the Estimate that already checks the change, where one in the `estimates` of a page the Case changes
      does.

      **＋** After the person answers that no new Estimate is created, the `context` names by slug the
      Estimate that checks the change, taken from the `estimates` of a page the Case changes.

      **＋** When the person''s words and the frame give neither, `case-guppi` asks in a round, before
      it writes the Case, what the Estimate will check, and the `recommend` of the Case holds that question.

      **－** A deferred decision in the short form is not written by `case-guppi` and carries no such Estimate.'
    context: 'Session 1426 left two lessons with no fix. In `lesson-case-build-gave-a-sub-case-no-estimate`,
      the person answered that Case 795.1 creates no new Estimate. `case-guppi` read this as "no Estimate"
      and wrote the sub-case with no check. It never looked for an Estimate that already checked the change,
      though its frame sentence of case 561.11 asks it to name such an Estimate in `context`. The main
      agent sent the summary back before the showing, by case 561.9 of `rule-orchestration`. The cause
      is the round question on the promise: its "no new Estimate" option named no existing Estimate, so
      the answer could be read two ways. In `lesson-ask-guppi-read-a-decision-page-without-a-reason`,
      at the /pre-spec of session 1426, `ask-guppi` opened `decision-case-616`, the Decision behind the
