  sections:
    Criterion: 'When:

      `guppi render` writes `vault/wiki/entities/schema.yaml` from `rule-entities-schema`, and `guppi
      lint` reads a page of `vault/wiki/entities/`.


      Then:

      The file equals the Render. Lint reads from it: required `type, kind, purpose, status, estimates,
      origin, sprint, created, tags`; optional `parent, children, code_ref, deferred_by, rules, core`;
      values `kind: MOC | Leaf`, `status: draft | built | archived`, `core: true`; conditional — `Leaf`
      requires `parent`, `MOC` requires `children`; the sections `## Purpose` and `## History` required,
      `## How it works`, `## Milestones`, `## Backlog`, `## Closed`, `## Terms` optional.

