- case: '806.4'
  decision: decision-case-806.4
  origin: raw/2026-10-13/2118/ledger.md#case-806.4
  targets:
  - kind: update
    category: rules
    slug: rule-where-to-stop
    ref: rule-where-to-stop
  - kind: update
    category: estimates
    slug: estimate-where-to-stop-stops-only-on-its-conditions
    ref: rule-where-to-stop
  tags: []
  case_text:
    given: '`rule-where-to-stop`: renders the conditions on which the run stops.

      **＋** `vault/wiki/where-to-stop.md`: the file rendered from it.

      **＋** `estimate-where-to-stop-stops-only-on-its-conditions`: its Criterion is replaced whole.

      **＋** `/work`, `/box` and `/retro`: the run from the approved Spec to the handoff.

      **＋** `.claude/skills/box/SKILL.md`, `.claude/skills/sprint-open/SKILL.md`, `.claude/skills/pr-review/SKILL.md`
      and `.claude/skills/merge-main/SKILL.md`: the skills whose stops the conditions name.

      **＋** `raw/<date>/<hi HHMM>/spec.md`, `raw/<date>/<hi HHMM>/work.md` and `raw/<date>/<hi HHMM>/handoff.md`:
      the Spec, the baseline and the handoff of the session.

      **＋** `vault/wiki/case-schema.md`: the form of a Case, which names a `stop:` task.

      **＋** `rule-spec-box`: the rule of `/box`, which builds no Case of a conserved Spec again.'
    when: 'The agent calls `/work` on `PreToolUse Skill` after the person picked it at the fork of `ExitPlanMode`,
      or the person types `/work` on `UserPromptSubmit`, and the run goes from the tasks of `raw/<date>/<hi
      HHMM>/spec.md` to the librarian''s report.

      **＋** Or the agent calls `/box` on `PreToolUse Skill`, and the run goes from its first step to the
      librarian''s report.'
    then: 'The context of `/work` holds the text of `vault/wiki/where-to-stop.md`, rendered from `rule-where-to-stop`.

      **＋** The context of `/box`, from `.claude/skills/box/SKILL.md`, holds the same text.

      **＋** The agent ends a reply with a question to the person on a fork that changes a contract, on
      a hook refusal whose text gives no step it can follow or says that it is a stop, and before an action
      that git in the repository cannot undo.

      **＋** A fork that changes a contract is a choice that no ratified Case makes, or a ratified Case
      that turns out wrong: by a text the agent finds wrong or too narrow, or by a finding of `uv run
      guppi prespec --check` on the plan after a Case ratified in Work Mode.

      **＋** Before a task of `raw/<date>/<hi HHMM>/spec.md` whose text opens with `stop:`, the agent stops
      and asks; the task runs after the person''s word.

      **＋** On the branch `main` the agent stops and says so: Work Mode does not start there.

      **＋** In a run of `/box`, the agent stops and asks when `uv run guppi box --check` prints a line,
      or when a `git merge --ff-only` of `/box` refuses.

      **＋** In the merge tasks that the opening Case of a sprint holds by `.claude/skills/sprint-open/SKILL.md`,
      in the merge task that a review Case holds by `.claude/skills/pr-review/SKILL.md`, and in the tasks
      that a merge Case holds by `.claude/skills/merge-main/SKILL.md`, the agent stops, shows what stopped
      it and asks when a `git` or `gh` command refuses, or when the merge of a merge Case leaves in conflict
      a file that the merge Case does not settle.

      **－** `git merge --no-ff --no-commit` of a merge Case of `.claude/skills/merge-main/SKILL.md` that
      exits non-zero only on files that the merge Case settles is no refusal, and the run goes on to the
      tasks that settle them.

      **＋** When the full `make test` run of `/work` after its last task finds a failing test that `##
      Baseline` of `raw/<date>/<hi HHMM>/work.md` does not hold, and its fix needs a choice that no ratified
      Case makes, the agent ends a reply with a question to the person that names the test and its failure.

      **＋** When the auto mode classifier of Claude Code refuses a tool call that the run needs, the agent
      ends a reply with a question to the person that gives the shell command doing what the refused call
      would do, for the person to type after `!` in the prompt.

      **＋** A reply that stops from the call of `/retro` until `raw/<date>/<hi HHMM>/handoff.md` stands
      opens with `STOP:`.

      **＋** After the person''s answer the run goes on from where it stopped.

      **＋** After the person has run the command that a refusal of the auto mode classifier gave, the
      run goes on from where it stopped.

      **＋** `vault/wiki/case-schema.md` names a task line that opens with `stop:` as a task that waits
      for the person''s word.

      **－** No other point stops the run: any other red test, at `/retro` too, a reading that only the
      person can take, an observation or a doubt ends as a lesson or a line of `raw/<date>/<hi HHMM>/handoff.md`.'
    context: 'When the work of Work Mode meets a choice that a ratified Case of the approved Spec did
      not make, the rules today let the main agent send that Case back to its `case-guppi`, which builds
      it again under its own number; the person ratifies it again, and the `Stop` hook of `rule-spec-write`
      replaces its sections in `spec.md` in place, by `place` of `guppi/ratified.py`. In session 1753
      this happened to Case 804: the `stop:` task of 804.7 failed when GitHub refused the GitHub Actions
      app on the bypass list of the ruleset `prod` (HTTP 422), and Case 804 was built again around a deploy
      key and ratified again after the Spec was approved (handoff of 1753, line 38; ledger of 1753, line
      121). The person called this a bad step: a Case that `/pre-spec` checked and the person approved
      was changed after the fact. The person turned down moving such a choice to the next session, and
      chose instead that a new Case under a new number replaces only the sub-case the choice touches,
      and that the replaced sub-case leaves the Spec, so that only what is confirmed reaches the wiki.


      Most of that path works in the code today. `remove_superseded` of `guppi/ratified.py` removes from
      the plan and from `spec.md` the sections of the sub-case that a `{supersedes:case N.M}` on a decision
      line of the reply names, and the parent only once each of its sub-cases with a decision line is
      retired; `place` puts a Case that `spec.md` does not hold into the last approved document. The docstring
      of `guppi/materialize.py` reads one unit as its ledger and its own `spec.md` and nothing else, marks
      every entry of a retired sub-case `superseded_by`, and `guppi/generate.py` applies no such entry
      and gives its Decision page a two-line body naming the Decision that replaced it. The docstring
      of `guppi/casecheck.py` leaves out of the clash check a Case that a `{supersedes}` mark on a decision
      line of the answer names (case 725.2), so a new Case that changes the pages of the sub-case it replaces
      passes the check of its file. The decision line of the rebuilt Case 804 stands at 20:13 on line
      112 of the ledger of 1753, after the Spec was approved, so the ledger hook takes a decision line
      in Work Mode. What is missing is the rule: `orchestration.md`, the agent file of `case-guppi` and
      `/work` still say that a ratified Case is built again in Work Mode, and no check of the plan runs
      on a Case ratified there. The docstring of `guppi/prespec.py` says that an open line under `## Work`
      of the Frontier is no finding, so `uv run guppi prespec --check` can run on the plan in Work Mode;
      no run of it on a plan in Work Mode was taken for this Case, so whether it prints nothing there
      on a sound plan is not known; 806.3 makes its finding a stop, so a false finding stops the run rather
      than passing unseen.


      The searches. A Grep of the pattern `in Work Mode when a ratified Case is built again` over the
      repository outside `vault/raw/` and `vault/archive/` printed 5 files: `vault/wiki/orchestration.md`,
      `.claude/agents/case-guppi.md`, `vault/wiki/rules/rule-orchestration.md`, `vault/wiki/rules/rule-case-build.md`
      and `vault/wiki/estimates/estimate-case-build-writes-the-case.md`; each enters the Case, the two
      rendered files through the render of their rule. A Grep of the pattern `(?i)built again|ratified
      again|shown again` over `vault/wiki/rules/*.md` and `.claude/**/*.md` printed 14 files: `.claude/skills/sprint-open/SKILL.md`,
      `.claude/skills/pre-spec/SKILL.md`, `.claude/agents/case-guppi.md`, `.claude/agents/ask-guppi.md`,
      `rule-ask`, `rule-spec-write`, `rule-spec-box`, `rule-skill-sprint-open`, `rule-prespec-onward`,
      `rule-prespec`, `rule-orchestration`, `rule-case-protocol`, `rule-case-check` and `rule-case-build`.
      Beside the files above, the hits read stand: those of `rule-prespec-onward`, `rule-prespec`, `.claude/skills/pre-spec/SKILL.md`,
      `rule-ask`, `.claude/agents/ask-guppi.md`, `rule-skill-sprint-open` and `.claude/skills/sprint-open/SKILL.md`
      speak of Cases built again in Plan Mode — in the loop after `/pre-spec`, and the opening Case of
      a sprint built again under another id when its id is taken; the hit of `rule-spec-box` says that
      a conserved Spec is not built again; the hit of `rule-spec-write` is a History line; the Splitting
      paragraph of `rule-case-protocol` sets a new number for a Case built again in another shape, and
      its sentence that a Case superseded in its own session leaves the Spec is the way the person chose;
      the hit of `rule-case-check` is the clash rule of case 725.2 named above. A Grep of the pattern
      `orchestration\.md|case-guppi\.md|skills/work/SKILL\.md` over `tests/` printed 1 file, `tests/test_orchestration.py`;
      it reads only the blocks tagged `showing` and `defer` of the rendered page, which no pair of this
      Case touches. A Grep of the pattern `where-to-stop` over `tests/` printed 2 files, `tests/test_gate.py`
      and `tests/test_onward.py`; both assert that a hook message names the path `vault/wiki/where-to-stop.md`,
      not its text, so the new first condition of 806.4 breaks neither.


      The first condition of `where-to-stop.md` speaks only of a choice that no ratified Case makes, and
      the page closes with "Nothing else is a stop", so a finding of the check on a Case ratified in Work
      Mode, or a text the agent finds wrong, would be no stop; at `/pre-spec` the person chose to widen
      that condition, and 806.4 does it with the Criterion of `estimate-where-to-stop-stops-only-on-its-conditions`.
      A `/work` that `/box` calls runs a conserved Spec, and `rule-spec-box` says that in its first part
      a Case of that Spec is not checked again or built again and that its check refuses a session that
      ratified a Case of its own, while the hook of `rule-spec-write` writes only into the plan file and
      the session''s own `spec.md`; at `/pre-spec` the person chose that the route of this Case does not
      hold there: a fork is a stop with no new Case, and the choice goes to the handoff as a line, which
      806.1 and 806.3 say and no code of `/box` changes. In Work Mode the reply that acknowledges the
      new Case carries a `LEDGER` block and ends in text, and the docstring of `guppi/onward.py` sends
      the agent on by `guppi onward --plan` only while `raw/<hi date>/<hi HHMM>/spec.md` does not stand,
      so in Work Mode nothing sends it on: 806.3 says that this reply ends the turn and that the run goes
      on at the person''s next message, the check of the plan first, and its Estimate checks it; 806.1
      changes to match the sentence of `## The acknowledging reply` of `rule-orchestration` that says
      the hook of `rule-prespec-onward` sends the agent on after `/pre-spec`, which would be false in
      Work Mode, and signs no line of its own on it. The removal of the replaced sub-case from the plan
      file and `spec.md`, with the parent and the other sub-cases kept, is already the promise of `estimate-spec-write-removes-a-superseded-case`,
      so no line of this Case signs it again. The sentence of `orchestration.md` that no Case is taken
      back in Work Mode, and the line of `estimate-orchestration-takes-back-a-ratified-case` that says
      the same, stand: a take-back retires a Case whole with no replacement, while this route builds a
      new Case that replaces a sub-case; a Case of a later session may still replace a Case the person
      wants gone. The Criterion of `estimate-spec-write-reaches-the-approved-spec` stands: the hook places
      a new Case in `spec.md` as that Criterion says. The opening sentence of `## Who builds a Case`,
      that every Case, a ratified Case that changed included, is built by `case-guppi`, stays true. The
      lesson `lesson-case-build-recommended-an-unchecked-github-fact` stays `new` for a Case of its own,
      by the person''s answer. Case 805 of this session defers `entity-sprint-plugin` and touches no page
      of this Case. Each sub-case replaces the Criterion of the Estimate of its own page, every old line
      carried word for word, since a Case ratified in Work Mode none of whose tasks has run still changes
      under its own number, and the Work Mode lines added. The `method` of `estimate-work-mode-runs-the-spec-on-a-branch-from-a-baseline`
      waited for the session that closes a sprint, which the check of the file refuses for a replaced
      Criterion; 806.3 sets a `method` that reads the Render in the Spec at Retro, and leaves the lines
      that need the rendered `.claude/skills/work/SKILL.md` to the first `/work` on that file in which
      a Case is ratified in Work Mode, an event its `method` names. Lines of sibling sub-cases that share
      words are not one promise twice: those of 806.1 and 806.2 set two sides of one moment, what the
      main agent does and what `case-guppi` builds; the `/box` lines of 806.1 and 806.3 set what the main
      agent and `/work` each do there, as the person asked both to say; and the lines of 806.4 that share
      words with 806.3 are old lines of the two Criteria, carried word for word, on different stops and
      steps.'
