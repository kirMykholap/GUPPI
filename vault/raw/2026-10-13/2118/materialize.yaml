    context: 'When the work of Work Mode meets a choice that a ratified Case of the approved Spec did
      not make, the rules today let the main agent send that Case back to its `case-guppi`, which builds
      it again under its own number; the person ratifies it again, and the `Stop` hook of `rule-spec-write`
      replaces its sections in `spec.md` in place, by `place` of `guppi/ratified.py`. In session 1753
      this happened to Case 804: the `stop:` task of 804.7 failed when GitHub refused the GitHub Actions
      app on the bypass list of the ruleset `prod` (HTTP 422), and Case 804 was built again around a deploy
      key and ratified again after the Spec was approved (handoff of 1753, line 38; ledger of 1753, line
      121). The person called this a bad step: a Case that `/pre-spec` checked and the person approved
      was changed after the fact. The person turned down moving such a choice to the next session, and
      chose instead that a new Case under a new number replaces only the sub-case the choice touches,
      and that the replaced sub-case leaves the Spec, so that only what is confirmed reaches the wiki.


      Most of that path works in the code today. `remove_superseded` of `guppi/ratified.py` removes from
      the plan and from `spec.md` the sections of the sub-case that a `{supersedes:case N.M}` on a decision
      line of the reply names, and the parent only once each of its sub-cases with a decision line is
      retired; `place` puts a Case that `spec.md` does not hold into the last approved document. The docstring
      of `guppi/materialize.py` reads one unit as its ledger and its own `spec.md` and nothing else, marks
      every entry of a retired sub-case `superseded_by`, and `guppi/generate.py` applies no such entry
      and gives its Decision page a two-line body naming the Decision that replaced it. The docstring
      of `guppi/casecheck.py` leaves out of the clash check a Case that a `{supersedes}` mark on a decision
      line of the answer names (case 725.2), so a new Case that changes the pages of the sub-case it replaces
      passes the check of its file. The decision line of the rebuilt Case 804 stands at 20:13 on line
      112 of the ledger of 1753, after the Spec was approved, so the ledger hook takes a decision line
      in Work Mode. What is missing is the rule: `orchestration.md`, the agent file of `case-guppi` and
      `/work` still say that a ratified Case is built again in Work Mode, and no check of the plan runs
      on a Case ratified there. The docstring of `guppi/prespec.py` says that an open line under `## Work`
      of the Frontier is no finding, so `uv run guppi prespec --check` can run on the plan in Work Mode;
      no run of it on a plan in Work Mode was taken for this Case, so whether it prints nothing there
      on a sound plan is not known; 806.3 makes its finding a stop, so a false finding stops the run rather
      than passing unseen.


