      of this Case. Each sub-case replaces the Criterion of the Estimate of its own page, every old line
      carried word for word, since a Case ratified in Work Mode none of whose tasks has run still changes
      under its own number, and the Work Mode lines added. The `method` of `estimate-work-mode-runs-the-spec-on-a-branch-from-a-baseline`
      waited for the session that closes a sprint, which the check of the file refuses for a replaced
      Criterion; 806.3 sets a `method` that reads the Render in the Spec at Retro, and leaves the lines
      that need the rendered `.claude/skills/work/SKILL.md` to the first `/work` on that file in which
      a Case is ratified in Work Mode, an event its `method` names. Lines of sibling sub-cases that share
      words are not one promise twice: those of 806.1 and 806.2 set two sides of one moment, what the
      main agent does and what `case-guppi` builds; the `/box` lines of 806.1 and 806.3 set what the main
      agent and `/work` each do there, as the person asked both to say; and the lines of 806.4 that share
      words with 806.3 are old lines of the two Criteria, carried word for word, on different stops and
      steps.'
