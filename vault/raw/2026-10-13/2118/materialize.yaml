  case_text:
    given: '`guppi/prespec.py`: the check of the plan, `uv run guppi prespec --check`, and the hook of
      `ExitPlanMode`.

      **＋** `rule-prespec-hook`: the rule of the check, whose `implementation_ref` names `guppi/prespec.py`.

      **＋** `estimate-prespec-hook-reports-a-pointer-outside-a-bracket`: the new check.

      **＋** `tests/test_prespec.py`: the tests of the check.

      **＋** `guppi/ship.py` and `guppi/pages.py`: the judgment of a pointer and `is_core`, which the check
      imports.

      **＋** `rule-case-protocol` and `vault/wiki/case-schema.md`: the form of a Case, which tells `case-guppi`
      how a pointer stands.

      **＋** `decision-case-N`: the slug of a Decision page, a pointer the check finds.

      **＋** `rule-one-judgment-one-implementation`: one judgment, one implementation.'
    when: '`uv run guppi prespec --check <plan>` checks the plan of a session, or the hook of `rule-prespec-hook`
      runs the same judgment when the agent calls `ExitPlanMode`.'
    then: 'It prints a finding for each pointer — a reference to a case, an id `decision-case-N` or a
      mention of a session by its id — that stands outside a bracket of its own in the `new` of a `replace`
      pair, the text of a `sections` value or the `purpose` of an item for a page that carries `core:
      true`, on the live page or as the plan leaves it.

      **＋** The finding names the Case, the page and the pointer.

      **＋** It judges each text by the judgment that `guppi ship` runs over the files it writes, imported
      from `guppi/ship.py`.

      **－** A pointer inside such a bracket, a code span or a fenced block is no finding.

      **－** An item for a page without `core: true`, the `change` line of an item, and the `context`,
      `problem` and `recommend` of a Case are not judged.'
    context: '`guppi ship` builds the clean copy of GUPPI that other people install, and the workflow
      `.github/workflows/prod.yml` writes it to the branch `prod` as a commit of its own; `main` is never
      changed by the build. Today the script removes a bracket that holds only references to cases, and
      cuts a reference out of a longer bracket, which can leave words that mean nothing, such as `(supersedes
      518)` from `(case 523, supersedes 518)`. It fails on a reference inside a sentence, on a session
      number and on a link to a page that does not ship, so the run of session 1753 printed 206 lines,
      all in `guppi/*.py` (`vault/raw/2026-10-13/1753/ship.txt`), and the CI run cannot write `prod`.
      The person chose a rule that ends the same work at every release: a pointer to a Case, a decision
      or a session stands in this repository in a bracket of its own at the end of its sentence, with
      the words that go with it, such as `(as set in case 12)`, and the script removes each bracket that
      holds a pointer whole. The person asked who checks that the script removes nothing needed: what
      it removes is a bracket that holds a pointer into the records of this repository, which the copy
      does not hold, and `--review` lists each such bracket that holds other words, so that a needed word
      is found once and moved out; the writing rule in `case-schema.md`, the check of the plan and a step
      of `make lint` keep new text in the form.


      The run of this session, `uv run guppi ship` at commit 6d9afab, stands in `vault/raw/2026-10-13/2118/ship.txt`;
      a Grep `^ship: [^g]` over it printed its lines 207 to 312, all under `vault/wiki/`: the rendered
      schema files, `case-example.md`, `orchestration.md`, `entity-glossary` and rule pages. Some are
      ids of example Cases, such as `## Case 7 — Members get a reminder before a booking` inside a fenced
      block of `orchestration.md`, and sample slugs in code spans of `vault/wiki/decisions/schema.yaml`,
      which the script reads as plain text since it masks code spans only in `.md` files. That schema
      file ships by right: a new project writes Decision pages of its own. In a round I said that the
      example of `case-example.md` cannot be fenced; the frame shows that it stands inside a fence tagged
      `case`, so the fence rule alone covers it, and the exemption of that file and of the Render of `rule-case-example`
      by name, which the person chose on my word, adds nothing today; the Case keeps it as chosen, and
      the person may drop it at the showing. The person first chose to reword the pages in this Case from
      that run; I had said that the run shows every page line that holds a pointer, which is false, since
      today''s script cuts pointers out of longer brackets without a line, and the person then chose a
      Case of the next session that rewords the pages from the list of the changed script. 807.1 updates
      `entity-sprint-plugin` with a `change` alone, since the check of the plan asks for an update of
      the sprint page under a Case that works on its item, and the item stays open until that Case; Case
      805 of this session defers the same page, by its line `defer case 805` in `vault/raw/2026-10-13/2118/frontier.md`,
      and touches no line this Case touches.


      The judgment. A Grep `\[Cc\]ases?|[Ss]essions?\\s|decision-case-\{` over `guppi/` printed `guppi/box.py`,
      `guppi/materialize.py`, `guppi/lint.py` and `guppi/ship.py`. The lines of `guppi/box.py` and `guppi/materialize.py`
      write a slug `decision-case-N`, and those of `guppi/lint.py` judge the words of a `method`; only
      `REFS`, `DECISION_LINK`, `DECISION` and `SESSION` of `guppi/ship.py` judge a pointer in prose —
      a reference to a case, a link or an id of a Decision page, and a mention of a session — so the check
      of the plan in 807.4 and `--check` in 807.1 import the judgment of `guppi/ship.py`, as `rule-one-judgment-one-implementation`
      sets it, and no second copy is written. `guppi/prespec.py` judges no pointer today, so the two sides
      cannot part on an older input.


      The frame. A Grep `guppi ship|all five|five steps` over `vault/wiki/` printed 12 files: `brief.md`,
      not read; the three `schema.yaml` files of entities, rules and estimates and their rule pages `rule-entities-schema`,
      `rule-rules-schema` and `rule-estimates-schema`, which name the value `guppi` of a shipped page
      and stand; `rule-clean-branch` and `estimate-clean-branch-writes-a-clean-copy`, set anew in 807.1;
      `rule-lint` and `estimate-lint-runs-every-step`, which name the five steps of `make lint` and change
      in 807.2; and `estimate-sprint-plugin-ci-writes-a-clean-branch`, whose line that no text of the
      copy holds a link to a page the copy leaves out stays true, since such a link becomes a slug in
      a code span, so its Criterion stands and it is read after the Case of the next session. The same
      Grep over `.claude/` printed nothing. A Grep `case-schema\.md|rule-case-protocol|rule-lint\.md|rule-clean-branch|rule-prespec-hook|entity-sprint-plugin|estimate-lint-runs-every-step|estimate-clean-branch`
      over `tests/` printed `tests/test_guard.py`, `tests/test_glossary.py`, `tests/test_ship.py`, `tests/test_case_schema.py`,
      `tests/test_render.py`, `tests/test_lint.py`, `tests/test_prespec.py` and `tests/test_recall.py`.
      `tests/test_case_schema.py` reads only the block tagged `case` of the live `case-example.md` or
      `case-schema.md`, which no pair touches; `tests/test_recall.py` names the path of `case-schema.md`
      alone; the others seed pages of their own in a temporary folder. `tests/test_lint.py` copies the
      live `Makefile` and lists the steps of `make lint` in `LINT_STEPS`, so 807.2 changes it. In the
      page of `rule-case-protocol` the sentence that the story sections may name a case number speaks
      of text that reaches no shipped page, and stands. The Render of `rule-case-protocol` changes in
      807.4 and touches no Estimate of the live reading; the behaviour it tells `case-guppi` is the one
      the check of 807.4 finds. The brief reports `make lint` at 0 lines and `make test` at 1601 passed
      and 6 skipped under `## Readings at the close`; the new step of 807.2 is red until the code is reworded
      in 807.3, an expected red of the same Work Mode. Case 806 of this session changes `rule-orchestration`,
      `rule-case-build` and `rule-work-mode`, none of the pages of this Case; its check of the plan in
      Work Mode runs the finding of 807.4 once the code stands. The pair of 807.4 on `rule-case-protocol`
      adds one sentence, after the sentence on counts, inside the long paragraph of the Language section
      on the story sections, `given`, `when`, `then` and the chat form, which I read whole: that paragraph
      lets the story sections name a case number and sets the form of the values of a task, and the new
      sentence speaks only of the new text of a page with `core: true`, so it contradicts neither; Case
      803 of session 1753 wrote into the same page, in the paragraph on the derivable fields, and touches
      no sentence of this one. The new Criteria carry word for word each old line that still holds: in
      807.1 the set of files written, the shipped values, the exit on a section of a page without `core:
      true`, the pages and files left out, and the form of a line; in 807.2 the printing of each step,
      the exit code, stdin and the tree. Three old lines are dropped on purpose and stand rewritten: in
      807.1 the line that removes a parenthesis of references and cuts references out of a longer one,
      and the line that exits 1 on a link to a page left out, since the person''s rule removes each bracket
      that holds a pointer whole and turns such a link into a slug; in 807.2 the line that names five
      steps, since `guppi ship --check` is a sixth. `--check` judges each file outside `vault/` that the
      clean version holds — `guppi/`, `.claude/`, `CLAUDE.md`, `Makefile`, `pyproject.toml` and `.gitattributes`,
      by `TREES` and `ROOT_FILES` of `guppi/ship.py` but `uv.lock`, which it does not clean. The rewording
      of 807.3 covers `guppi/` and the root files edited in Work Mode; a file of `.claude/` and `CLAUDE.md`
      is rendered from a Rule page and changes only through it, as `rule-governed-files-hook` sets it,
      so a line on it goes to the handoff with the pages, and the red of `make lint` it makes is a note
      for the handoff by `rule-retro`. The run of today''s script printed no line outside `guppi/` and
      `vault/wiki/`; the new judgment has not run. The line of 807.3 on `--check` shares words with the
      lines of 807.1 on `--check` and on the files the command writes, since all three name the same files,
      but sets another promise: 807.1 promises what the command does, 807.3 that the code of this repository
      passes it.'
