  case_text:
    given: '`rule-clean-branch`: the rule of the clean version; its Purpose is set anew.

      **＋** `estimate-clean-branch-writes-a-clean-copy`: its Criterion is replaced whole.

      **＋** `guppi/ship.py`: the command `guppi ship` and the one judgment of a pointer.

      **＋** `tests/test_ship.py`: the tests of the command over a sample tree.

      **＋** `entity-sprint-plugin`: the sprint page whose milestone The clean branch this Case works on.

      **＋** `vault/wiki/case-example.md` and `rule-case-example`: the example Case, whose ids are no pointers.

      **＋** `vault/wiki/decisions/schema.yaml`: a schema file of the copy whose text holds sample slugs
      in code spans.

      **＋** `raw/<date>/<hi HHMM>/handoff.md`: the handoff of the session, which takes the list of the
      pages.

      **＋** `.claude/` and `vault/wiki/tags.md`: the harness and the tag registry the command copies.

      **＋** `CLAUDE.md`, `Makefile`, `pyproject.toml`, `uv.lock` and `.gitattributes`: the files at the
      root of the project that the command copies, outside `vault/`.

      **＋** `decision-case-N`: the slug of a Decision page, a pointer the command removes.

      **＋** `vault/raw/`, `vault/archive/` and `.github/`: the session records and the workflows the command
      leaves out.'
    when: '`uv run guppi ship <folder>`, as `rule-clean-branch` sets it, builds the clean version of the
      project from its working tree into an empty folder.

      **＋** Or `uv run guppi ship --review <folder>` does the same.

      **＋** Or `uv run guppi ship --check` judges the working tree and writes no folder.'
    then: 'It writes `guppi/`, `.claude/`, `CLAUDE.md`, `Makefile`, `pyproject.toml`, `uv.lock`, `.gitattributes`,
      the `schema.yaml` of each category, `vault/wiki/tags.md`, each page under `vault/wiki/` with `core:
      true`, and each file rendered from such a page.

      **＋** In each file it writes, it removes whole each bracket that holds a pointer — a reference to
      a case, an id `decision-case-N` or a mention of a session by its id — with every word in it and
      the space before it, and each `[[decision-case-N]]` link; a bracket that holds no pointer stays
      as it is.

      **＋** It writes each other `[[…]]` link of a Markdown file to a page or a file it does not write
      as the slug in a code span.

      **＋** Each page it writes carries `origin: guppi`, `sprint: guppi`, the date of the run in `created`
      and a `## History` of one line that says the page shipped with GUPPI, and its link fields keep only
      the pages it writes.

      **＋** It exits 1, and prints the file and the line, for each pointer that stands outside such a
      bracket, each id of a list of sessions included.

      **＋** It exits 1 when a file it writes holds a section between the markers of a page without `core:
      true`.

      **＋** With `--review` it also prints the file, the line and the bracket for each bracket it removes
      that holds words beside its pointers, and those lines set no exit code.

      **＋** With `--check` it judges each file it would write outside `vault/` — `guppi/`, `.claude/`
      and the files at the root of the project — but `uv.lock`, which it does not clean, as it would write
      it, prints the same lines for it, exits 1 on any, and writes nothing.

      **－** It writes no page without `core: true`, nothing of `vault/raw/`, `vault/archive/` or `.github/`,
      and no `sprint.md`, `backlog.md`, `brief.md`, `log.md` or `guppi.toml`.

      **－** It writes no file that a page without `core: true` renders in full.

      **－** A case id inside a code span of a Markdown file, or after `[case ` or `#case-`, is the form
      of a line, not a reference.

      **－** A case id inside a fenced block of a Markdown file, inside a code span of the text of a `schema.yaml`,
      in `vault/wiki/case-example.md` or the Render of `rule-case-example`, or after `:case `, is the
      form of a sample or of a line: it is neither removed nor printed.'
    context: '`guppi ship` builds the clean copy of GUPPI that other people install, and the workflow
      `.github/workflows/prod.yml` writes it to the branch `prod` as a commit of its own; `main` is never
      changed by the build. Today the script removes a bracket that holds only references to cases, and
      cuts a reference out of a longer bracket, which can leave words that mean nothing, such as `(supersedes
      518)` from `(case 523, supersedes 518)`. It fails on a reference inside a sentence, on a session
      number and on a link to a page that does not ship, so the run of session 1753 printed 206 lines,
      all in `guppi/*.py` (`vault/raw/2026-10-13/1753/ship.txt`), and the CI run cannot write `prod`.
      The person chose a rule that ends the same work at every release: a pointer to a Case, a decision
      or a session stands in this repository in a bracket of its own at the end of its sentence, with
      the words that go with it, such as `(as set in case 12)`, and the script removes each bracket that
      holds a pointer whole. The person asked who checks that the script removes nothing needed: what
      it removes is a bracket that holds a pointer into the records of this repository, which the copy
      does not hold, and `--review` lists each such bracket that holds other words, so that a needed word
      is found once and moved out; the writing rule in `case-schema.md`, the check of the plan and a step
      of `make lint` keep new text in the form.


      The run of this session, `uv run guppi ship` at commit 6d9afab, stands in `vault/raw/2026-10-13/2118/ship.txt`;
      a Grep `^ship: [^g]` over it printed its lines 207 to 312, all under `vault/wiki/`: the rendered
      schema files, `case-example.md`, `orchestration.md`, `entity-glossary` and rule pages. Some are
      ids of example Cases, such as `## Case 7 — Members get a reminder before a booking` inside a fenced
      block of `orchestration.md`, and sample slugs in code spans of `vault/wiki/decisions/schema.yaml`,
      which the script reads as plain text since it masks code spans only in `.md` files. That schema
      file ships by right: a new project writes Decision pages of its own. In a round I said that the
      example of `case-example.md` cannot be fenced; the frame shows that it stands inside a fence tagged
      `case`, so the fence rule alone covers it, and the exemption of that file and of the Render of `rule-case-example`
      by name, which the person chose on my word, adds nothing today; the Case keeps it as chosen, and
      the person may drop it at the showing. The person first chose to reword the pages in this Case from
      that run; I had said that the run shows every page line that holds a pointer, which is false, since
      today''s script cuts pointers out of longer brackets without a line, and the person then chose a
      Case of the next session that rewords the pages from the list of the changed script. 807.1 updates
      `entity-sprint-plugin` with a `change` alone, since the check of the plan asks for an update of
      the sprint page under a Case that works on its item, and the item stays open until that Case; Case
      805 of this session defers the same page, by its line `defer case 805` in `vault/raw/2026-10-13/2118/frontier.md`,
      and touches no line this Case touches.


      The judgment. A Grep `\[Cc\]ases?|[Ss]essions?\\s|decision-case-\{` over `guppi/` printed `guppi/box.py`,
      `guppi/materialize.py`, `guppi/lint.py` and `guppi/ship.py`. The lines of `guppi/box.py` and `guppi/materialize.py`
      write a slug `decision-case-N`, and those of `guppi/lint.py` judge the words of a `method`; only
      `REFS`, `DECISION_LINK`, `DECISION` and `SESSION` of `guppi/ship.py` judge a pointer in prose —
      a reference to a case, a link or an id of a Decision page, and a mention of a session — so the check
      of the plan in 807.4 and `--check` in 807.1 import the judgment of `guppi/ship.py`, as `rule-one-judgment-one-implementation`
      sets it, and no second copy is written. `guppi/prespec.py` judges no pointer today, so the two sides
      cannot part on an older input.


      The frame. A Grep `guppi ship|all five|five steps` over `vault/wiki/` printed 12 files: `brief.md`,
