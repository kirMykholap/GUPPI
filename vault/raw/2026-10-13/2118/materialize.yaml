  decision: decision-case-806.1
  origin: raw/2026-10-13/2118/ledger.md#case-806.1
  targets:
  - kind: update
    category: rules
    slug: rule-orchestration
    ref: rule-orchestration
  - kind: update
    category: estimates
    slug: estimate-orchestration-shows-the-built-case
