  text: decision[case 807.1][update][rule-clean-branch]{ref:rule-clean-branch}
  case: '807.1'
  kind: update
  slug: rule-clean-branch
  origin: raw/2026-10-13/2118/ledger.md#case-807.1
  decision: decision-case-807.1
  ref: rule-clean-branch
  category: rules
  sections:
    Purpose: 'Prevents a reference to a case, a mention of a session of this repository or a page that
      stays in this repository from reaching the clean version of GUPPI that other people install. `guppi
      ship` builds that version from the working tree into an empty folder: `guppi/`, `.claude/`, `CLAUDE.md`,
      `Makefile`, `pyproject.toml`, `uv.lock`, `.gitattributes`, the `schema.yaml` of each category, `vault/wiki/tags.md`,
      each page with `core: true` and each file rendered from such a page, but `sprint.md`, `backlog.md`
      and `guppi.toml`, which belong to this project. It gives each page `origin: guppi`, `sprint: guppi`,
      the date of the run in `created` and a `## History` of one line, and keeps in its link fields only
      the pages it writes.


      A pointer — a reference to a case, an id `decision-case-N` or a mention of a session by its id —
      stands in this repository in a bracket of its own at the end of its sentence, together with the
      words that go with it, such as `(as set in case 12)` or `(measured 2026-09-25, session 0051)`, so
      that the sentence reads whole without it. `guppi ship` removes each bracket that holds a pointer
      whole, every word in it included, and each `[[decision-case-N]]` link; a bracket that holds no pointer
      stays. It writes any other `[[…]]` link to a page or a file it does not write as the slug in a code
      span. A case id in a code span or a fenced block, of a Markdown file or of the text of a `schema.yaml`,
      in `case-example.md` or the Render of `rule-case-example`, or in the form of a line after `[case
      `, `#case-` or `:case `, is no pointer. It exits 1 on each pointer that stands outside such a bracket,
      and on each section of a page without `core: true`; a Case rewords that text at its source. `guppi
      ship --review` also lists each bracket it removes that holds words beside its pointer, so that a
      word the sentence needs is found and moved out of the bracket. `guppi ship --check` judges in place
      each file outside `vault/` that the clean version holds — the code, the harness and the files at
      the root of the project — and `make lint` runs it; `/pre-spec` finds a pointer outside such a bracket
      in the new text of a page with `core: true` before the Spec is approved, or, for a Case ratified
      in Work Mode, before its tasks run (case 807).


      The workflow `.github/workflows/prod.yml` runs it on each push to `main`, and on each push of a
      tag `prod-*`, such as `prod-1`, on a commit of another branch. It writes the result to the branch
      `prod` as one new commit on top of the last, whose message names the commit it was built from, and
      writes none when nothing changed or when the command exits 1. It pushes with a deploy key of this
      repository with write access, whose private half is the repository secret `PROD_DEPLOY_KEY`; deploy
      keys stand on the bypass list of the ruleset on `prod` that [[rule-github-repository]] sets. This
      rule and the workflow belong to this repository: neither carries `core`, and `.github/` is not part
      of the clean version (case 804).'
  change: a pointer stands in a bracket of its own, which guppi ship removes whole; a link to a page left
    out becomes its slug; --review and --check (case 807.1)
