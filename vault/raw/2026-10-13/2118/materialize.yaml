  sections:
    Pattern: Two lessons, one cause. In session 2252 case-guppi named page_exists of guppi/materialize.py
      as the judgment that /pre-spec and guppi generate share, without reading the find that generate
      calls, and the ask-guppi run found that the two answer differently, so Case 783 was built again.
      In session 2118 case-guppi of Case 807 recommended rewording the pages from the run of guppi ship,
      saying that run shows every page line that holds a pointer, without reading clean_parenthesis of
      guppi/ship.py, which cuts a pointer out of a longer bracket without printing a line; a later round
      withdrew the answer. In both a claim about what code does was stated and not read in the code.
