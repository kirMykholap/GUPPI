      repository, such as `since case 272` in `rule-claude-md`. Some brackets with words hold what the
      sentence needs: in `case-schema.md`, the Render of `rule-case-protocol`, the whole definition of
      `replace`, `reword` and `rename` stands in brackets that end with a case number, so the clean copy
      would lose it; many others hold the slug of the rule that sets the behaviour, such as `` (`rule-sprint-close`,
      case 627.1) ``, which the copy would lose too.


