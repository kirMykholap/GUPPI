  category: estimates
  set:
    status: pending
    purpose: Whether the code and the root files of this repository hold each pointer to a case, a decision
      or a session in a bracket of its own, and no case number without the word case before it, so that
      guppi ship --check prints no line on them and no bracket it removes from them holds a word the sentence
      needs
  change: the Criterion replaced whole — the code writes each case number with its word
  sections:
    Criterion: 'When:

      At Retro of the session, `uv run guppi ship --check` judges the working tree, and `uv run guppi
      ship --review <folder>` builds the clean version into an empty folder.


      Then:

      `uv run guppi ship --check` prints no line on a file under `guppi/`, on `Makefile`, on `pyproject.toml`
      or on `.gitattributes`, a bare case number in a comment or a docstring included.

      **＋** Each line of `--review` on those files shows a bracket that holds only pointers and the words
      that go with them, such as what a pointer sets, when a thing was measured or which session a pointer
      names.

      **－** The rewording of the bare case numbers in `guppi/` changes no line but a comment or a docstring,
      and `make test` has no failing test that it did not have before the change.

      **－** A line of `--check` on `.claude/` or `CLAUDE.md` is no part of this promise: it goes into
      the handoff with the pages, and the red of `make lint` it makes is a note for the handoff by `rule-retro`.'
  applied: 02:24:58
