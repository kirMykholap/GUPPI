      \ about GUPPI's own repository reworded?**\n  - Recommended: (a) name GUPPI's repository.\n  - Answer:\
      \ agreed, (a).\n- **How is the fix checked?**\n  - Recommended: (b) that check stands, and its method\
      \ waits for a tag.\n  - Answer: agreed, (b).\n- **Change**\n  - Asked: a `/pre-spec` finding: Case\
      \ 825 renames the install Case to the setup Case, so this Case should use that name in the sentences\
      \ it writes.\n  - Taken: the `then` lines on `rule-morph` and `rule-permissions` and the `context`\
      \ say \"setup Case\", and `given` names the file of Case 825."
    given: '`rule-language`: the rule of the two languages, whose Purpose names the manner of the vault''s
