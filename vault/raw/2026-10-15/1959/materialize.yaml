      `vault/wiki/tags.md`, read whole, has no row `retro` or `box`, and its row `prespec` covers what
      `pre-spec` would mean, so this Case adds no second spelling. This Case declares the two tags and
      adds each to its lesson; an earlier Case gave a lesson the tags the ledger hook had refused in the
      same way (`vault/wiki/log.md`, the line of 2026-10-08 on case 737). The rules `rule-retro` and `rule-spec-box`
      and their Estimates keep their tags; each takes the new tag when a later Case changes it. No Estimate
      is created: `estimate-generate-writes` already checks both writes, since its Criterion says that
      a tag of `new_tags` lands in `tags.md` and that an `update` applies `set` to the frontmatter; its
      Criterion stands, since this Case changes neither behaviour. The lessons list no Estimates. The
      person asked why a new tag needs a Case at all; the guard stays in this Case, and its change is
      left to a separate Frontier item for the main agent to add, since it touches the ledger hook, the
      check of a Case file and the one rule of `ratification.md`.'
    problem: The tags `retro` and `box` that two lessons of session 1739 wanted are not registered, so
      the lessons stand without them.
    recommend: "- **Which new tags to register, with what meaning and Russian aliases**\n  - Recommended:\
      \ (a) both `retro` and `box`, with the proposed meanings and aliases; no `pre-spec`, since `prespec`\
      \ covers it.\n  - Answer: agreed with the new tags, (a).\n- **Which pages take the new tags in this\
      \ Case**\n  - Recommended: (a) the two lessons only.\n  - Answer: agreed, (a).\n- **Which Estimate\
      \ checks the change**\n  - Recommended: (a) no new Estimate; `estimate-generate-writes` checks it.\n\
      \  - Answer: agreed, (a).\n- **Should a new tag still need a ratified Case**\n  - Recommended: (b)\
      \ keep this Case to the two tags, and add a separate Frontier item that changes the guard.\n  -\
      \ Answer: agreed, (b)."
    given: '`vault/wiki/tags.md`: the registry of tags, which gains the two rows.

      **＋** `lesson-retro-red-test-that-a-case-ratified-to-wait-for-the-librarian`: the lesson that takes
