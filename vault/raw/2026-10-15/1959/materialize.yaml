  sections:
    Criterion: 'When:

      The agent writes the ledger lines of a session — the decision lines in the reply that acknowledges
      a ratification, a lesson line the moment the lesson exists — with `vault/wiki/ratification.md` rendered
      from `rule-ratification`.


      Then:

      A decision line is `- decision[case N][kind][slug]` with `{ref:...}` when the target has a ref,
      `{tags:...}` on a `create`, and `{supersedes:case N}` when it applies.

      **＋** A line that supersedes more than one Case carries one `{supersedes:case N}` block per Case,
      side by side, never a list inside one block.

      **＋** A Case that takes up a deferred decision carries, on one of its decision lines, one `{supersedes:case
      N}` block for each Case in the page''s `deferred_by`.

      **＋** When a Case of this session closes the root cause of a lesson of this session, the line written
      second carries the mark: `{addresses:<lesson slug>}` on the decision line when the lesson line stands
      first, `{addressed_by:case N}` on the lesson line when the decision lines stand first; one mark
      per lesson.

      **＋** For a Case with sub-cases, the `N` of `{addressed_by:case N}` is the sub-case whose decision
      line closes the cause, never the parent, which has no decision line.

      **＋** The mark stands in the preview of the ledger lines the person ratifies, or in the `LEDGER`
      block of the lesson line.

      **＋** A lesson line whose tag `vault/wiki/tags.md` does not hold carries one `{newtag:<tag>|<meaning>|<aliases>}`
      block per such tag before `trigger:`, the tag also in its `{tags:...}`, the meaning one line and
      the aliases the words of the chat language for it.

      **－** A lesson whose fix is ratified in another session gets no mark.'
