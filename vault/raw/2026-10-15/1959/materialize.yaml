  sections:
    Criterion: 'When:

      `uv run --project .guppi guppi casecheck --subagent` checks an answer of `case-guppi` on `SubagentStop`,
      or `uv run --project .guppi guppi prespec --check <plan>` checks the plan, and the answer or the
      plan holds two or more sub-cases of one parent.


      Then:

      Two `then` lines of two sibling sub-cases (sub-cases of one parent, such as N.1 and N.2) are a note
      when the words that both lines hold make 60 percent or more of the words of the shorter line. A
      word is a run of letters and digits of four or more characters, and the case of letters is set aside.

      **＋** The note names both Cases and both lines, and it goes where every other note of the check
      goes (the notes of case 472.1).

      **－** A line with no word of four or more characters is compared with no line.

      **－** A sub-case that the answer holds alone has no sibling in the answer and gets no note from
      `guppi casecheck`. `guppi prespec --check` compares it with its siblings in the plan.'
  applied: '22:56:45'
