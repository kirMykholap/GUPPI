  - plugin
  case_text:
    context: '`guppi ship` of `.guppi/guppi/ship.py` builds the clean version of GUPPI. Since case 822
      it also writes each `passed` Estimate whose target page it writes and whose `method` names no `make`
      target (`ships`). It then reads every file it wrote and exits 1 on each pointer (a reference to
      a case, an id `decision-case-N` or a mention of a session) that stands outside a bracket of its
      own, judged by `outside` of `.guppi/guppi/pointers.py` (`leftovers`, `settled`). The order in `run`
      is: the draft pages with `core: true` first, which exit 1 without `--allow-draft`; then the tag
      `prod-x.y.z`, which exits 1 when none stands; only then the build and the pointer lines. So the
      run at this session''s `/hi`, with no tag, printed no pointer line. `guppi ship --check`, the last
      step of `guppi check`, judges only files outside `vault/` and never sees an Estimate. The handoff
      of session 1739 (`vault/raw/2026-10-15/1739/handoff.md`, Observations) reports that a build with
      the real vault printed 20 `ship:` lines in 16 shipped `passed` Estimates whose Criterion, `method`
      or `purpose` holds a pointer outside a bracket. While those stand, every run of `.github/workflows/prod.yml`
      fails, a tag `prod-0.2.0` included. `/pre-spec` cannot catch a new one: `check_pointers` of `.guppi/guppi/prespec.py`
      judges only the new text of a page with `core: true` (`core_as_left`), Estimates carry no `core`,
      and `written_texts` reads no `method` and no Criterion.


      The person chose to rewrite these Estimates at their source and to widen `/pre-spec` to the new
      text of an Estimate whose target has `core: true`. A Grep of `^(\*\*|[A-Za-z`])[^\n]*([Cc]ases?
      \d|decision-case-\d|[Ss]essions? (\d{4}-\d\d-\d\d/)?\d{4}\b)` over `vault/wiki/estimates/` printed
      lines in these files: `estimate-ask-finds`, `estimate-ask-query-before-a-create`, `estimate-ask-opens-a-decision-only-for-a-finding`,
      `estimate-case-build-reads-the-texts-a-test-runs-through-a-changed-check`, `estimate-case-build-reads-the-test-code-over-a-changed-text`,
      `estimate-case-check-notes-a-then-line-shared-by-siblings`, `estimate-case-check-sends-back-a-faulty-round`,
      `estimate-clean-branch-ships-the-tests`, `estimate-clean-branch-pages-hold-pointers-only-in-brackets`,
      `estimate-ledger-write-holds-a-decision-line-off-the-stored-case`, `estimate-orchestration-acknowledges-the-opening-with-the-frontier`,
      `estimate-orchestration-defer-example-passes-the-hook`, `estimate-orchestration-marks-each-round-of-a-batch`,
      `estimate-orchestration-names-related-cases-in-the-dispatch`, `estimate-generate-writes-the-decision-page`,
      `estimate-orchestration-signs-items-taken-together`, `estimate-prespec-checks-the-form-of-an-item`,
      `estimate-prespec-gathers-the-answers-after-findings`, `estimate-prespec-confirms-the-findings-once`,
      `estimate-ratification-case-id-carries-the-sprint`, `estimate-session-phases-in-order`, `estimate-search-leaves-out-decisions-in-every-agent`,
      `estimate-skill-sprint-close-leads-the-closing-session`, `estimate-skill-sprint-open-merges-the-closed-sprint-branch`,
      `estimate-spec-write-writes-a-defer`, `estimate-sprint-close-next-session-opens-the-sprint`. Each
      hit was read, and ten files stand. In eight the pointer is in a code span or in a bracket at the
      end of its sentence: `estimate-case-build-reads-the-texts-a-test-runs-through-a-changed-check`,
      `estimate-case-build-reads-the-test-code-over-a-changed-text`, `estimate-clean-branch-ships-the-tests`,
      `estimate-orchestration-marks-each-round-of-a-batch`, `estimate-generate-writes-the-decision-page`,
      `estimate-prespec-checks-the-form-of-an-item`, `estimate-prespec-gathers-the-answers-after-findings`
      and `estimate-spec-write-writes-a-defer`. Two are not shipped: `estimate-clean-branch-pages-hold-pointers-only-in-brackets`
      targets `rule-clean-branch`, which carries no `core`, and the `method` of `estimate-session-phases-in-order`
      names `make test-session`. The other sixteen are `passed`, and their targets carry `core: true`.
      They hold twenty pointers outside a bracket, the count the handoff gives. Twelve hold them only
      in the `method`, and Case 823.1 sets a new `method` for each, which keeps them `passed`. Four hold
      them in the `## Criterion`, which changes only whole, so Cases 823.2 to 823.5 each replace one and
      set it `pending`, to be read again at this Retro.


      Each new `method` was read against the predicates `/pre-spec` runs over a `method` the plan sets,
      as they stand now (`form_finding`, a nested function of `.guppi/guppi/prespec.py`, and `tied_to_a_one_off_moment`
      and `waits_for_another_session` of `.guppi/guppi/lint.py`). A `method` that named the session of
      an earlier Case now names that session by what happened in it, such as the session whose Spec set
      the new Render of a rule, since this Case is the one that sets the `method` and the words "the session
      that set this method" would point at this session. The three that waited for `/hi` or a later session
      (`estimate-ask-query-before-a-create`, `estimate-prespec-confirms-the-findings-once`, `estimate-search-leaves-out-decisions-in-every-agent`)
      now open with `by hand, after <event>:`. Each pointer now stands in a bracket at the end of its
      `method`. The `method` of `estimate-case-check-notes-a-then-line-shared-by-siblings` keeps only
      its pytest command. The `method` of `estimate-ratification-case-id-carries-the-sprint` reads the
      live Renders at this Retro. Both changes are in place of readings that cannot happen in this session.


      The `/pre-spec` check of `rule-case-check` notes each Criterion line that the new Criterion does
      not carry. Each such line in Cases 823.2 to 823.5 is the line that held the pointer, with its pointer
      moved into a bracket at the end. In Case 823.2 the sentence on what `case-guppi` does with the note
      is dropped, as the person chose: the new `method` is the pytest run alone, which reads the note
      of the hook and not a later answer of `case-guppi`. In Case 823.6 the last line of the Criterion
      of `estimate-prespec-hook-reports-a-pointer-outside-a-bracket` changes on purpose: an item of an
      Estimate of a core target is now judged. The insight line of `estimate-orchestration-defer-example-passes-the-hook`
      now says what holds: `insight-workflow-case-schema-silent-on-what-the-scripts-accept` stands under
      `vault/archive/migration/2026-10-10/1555/insights/` with `status: archived`.


      The check of Case 823.1 is a new Estimate. `.guppi/tests/test_guppi_package.py` already runs `ship.ship`
      over the live repository with a version it passes itself, so a test can read the real build with
      no tag. That test would fail from Work Mode until the librarian''s run lands the new texts, against
      `rule-retro`, which takes no red test as expected, and it would join the runs of `estimate-clean-branch-writes-a-clean-copy`
      and `estimate-clean-branch-ships-the-tests` over `test_ship.py`. So, as the person chose, it carries
      the pytest marker `live`, which the default run of `.guppi/pyproject.toml` leaves out, and the new
      Estimate runs it by hand with `-m live` after the librarian''s run of this session; the Retro stays
      green, and those two Estimates are not touched. `vault/wiki/brief.md` `## Readings at the close`
      reports the last run of the tests: "`make test`: 1 failed, 1699 passed, 6 skipped (exit 2)."


      A Grep of `pointer outside` over `vault/wiki/` printed `case-schema.md`, `estimate-clean-branch-ships-the-passed-estimates`,
      `estimate-clean-branch-writes-a-clean-copy`, `rule-lint`, `rule-clean-branch`, `estimate-clean-branch-ships-the-tests`,
      `rule-case-protocol` and `estimate-clean-branch-pages-hold-pointers-only-in-brackets`; over `.claude/`
      it printed nothing. Each hit stays true:

      - `rule-clean-branch` still exits 1 on each pointer and says a Case rewords the text at its source.

      - `/pre-spec` still finds a pointer in the new text of a page with `core: true`, as `rule-clean-branch`,
      `rule-case-protocol` and its Render `case-schema.md` say. Case 823.6 only adds the Estimates of
      such pages.

      - The Criterion of `estimate-clean-branch-ships-the-passed-estimates` still holds: a pointer in
      a shipped Estimate makes the build exit 1.

      - `rule-lint` speaks of `guppi ship --check` alone.


      The Frontier items C4 (`estimate-clean-branch-pages-hold-pointers-only-in-brackets`, `rule-rules-schema`),
      C1 (the tag and `prod.yml`), C6 and C9 are not touched here. The draft pages with `core: true` still
      stop the build after this Case.


      For Case 823.6 the new Criterion of an Estimate is read by `/pre-spec` in `criterion_notes` of `.guppi/guppi/prespec.py`:
      `written_criterion` of the item, else `criterion_text(case_texts(...))`. `lift_criterion` of `.guppi/guppi/materialize.py`,
      the writer, lifts the same. The two part only on a Criterion written under `sections` as blank text.
      There `lift_criterion` keeps the blank and `criterion_notes` reads the Case''s `when` and `then`.
      That gap stands as before: Case 823.6 moves the reading of `criterion_notes` into one function that
      both checks of `prespec.py` call, and names `lift_criterion` as no shared judgment. A Grep of `def
      check_pointers|def written_texts|def core_as_left` over `.guppi/guppi/` found each only in `prespec.py`,
      so the widened check adds no second copy.'
    problem: Sixteen shipped Estimates hold pointers outside a bracket, so every build of `prod` exits
      1, and `/pre-spec` cannot catch a new one in an Estimate.
    recommend: "- **How does the build stop failing on these Estimates?**\n  - Recommended: (a) leave\
      \ such an Estimate out of the copy.\n  - Answer: the pages must be rewritten, (b).\n- **Does `/pre-spec`\
      \ catch such a reference in the new text of an Estimate?**\n  - Recommended: (b) add it as a sub-case.\n\
      \  - Answer: (b).\n- **How is a reference in a `method` reworded?**\n  - Recommended: (a) move the\
      \ reference into a bracket at the end, and fix the wait where `/pre-spec` would report it.\n  -\
      \ Answer: agreed, (a).\n- **How are the four Estimates whose Criterion changes read again?**\n \
      \ - Recommended: (a) give those two a `method` that runs in this session.\n  - Answer: agreed, (a).\n\
      - **What checks that no shipped Estimate holds such a reference?**\n  - Recommended: (a) a new Estimate\
      \ with a test over the live repository.\n  - Answer: agreed, (a).\n- **What checks that `/pre-spec`\
