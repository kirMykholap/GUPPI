    context: 'A tag is a short label on a page. `vault/wiki/tags.md` lists each tag with its meaning and
      its Russian aliases, and `ask-guppi` maps a Russian question to tags by those aliases. Three guards
      keep a new tag out until a Case is ratified, read in the code. The ledger hook refuses a fresh lesson
