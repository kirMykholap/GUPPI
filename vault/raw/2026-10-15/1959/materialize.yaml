  - kind: update
    category: estimates
    slug: estimate-ledger-write-refuses-a-lesson-with-an-unlisted-tag
    ref: rule-ledger-write
  tags: []
  case_text:
    given: '`rule-ledger-write`: the rule of the ledger hook, whose Purpose names the refusal of an unlisted
      tag.

      **＋** `estimate-ledger-write-refuses-a-lesson-with-an-unlisted-tag`: its Criterion is replaced whole.

      **＋** `.guppi/guppi/ledger.py`: the hook, `refused_tags` and `tag_message`.

      **＋** `.guppi/guppi/tags.py`: the one reading of the listed tags.

      **＋** `.guppi/guppi/materialize.py`: `parse_line`, the one reading of a ledger line.

      **＋** `.guppi/guppi/casecheck.py`: the check of a Case file, which reads the same tags.

      **＋** `.guppi/tests/test_ledger.py`: the tests of the refusal.

      **＋** `vault/wiki/tags.md`: the registry of tags.'
    when: The `Stop` hook `uv run --project .guppi guppi ledger` of `.guppi/guppi/ledger.py` finds a fresh
      `lesson[<slug>]` line in a `LEDGER` block of the session whose `{tags:...}` holds a tag.
    then: 'A fresh lesson line stays out of the ledger while its `{tags:...}` names something outside
      `vault/wiki/tags.md`.

      **＋** Such a line lands once this session ratified a Case declaring each such name, the decision
      line of that Case written earlier or in the same `Stop`.

      **＋** Such a line lands when a `{newtag:<tag>|<meaning>|<aliases>}` block declares each such tag,
      on the line itself or on a lesson line of the session''s ledger or of the same `Stop`.

      **＋** A block declares its tag only when that tag stands in the `{tags:...}` of its line and its
      meaning and aliases are not empty, as `parse_line` of `.guppi/guppi/materialize.py` reads it.

      **＋** The other lines of the `Stop` are written as before.

      **＋** When the refused line stands in the reply just finished, the hook exits 2 with one stderr
      line per refused line: "ledger: lesson[<slug>] not written — tag <tag> is not in tags.md and nothing
      of this session declares it: write the line again with a tag of tags.md, or declare the tag on the
      line by {newtag:<tag>|<meaning>|<aliases>}, the tag also in its {tags:...}."

      **＋** A refused line from an earlier text of the transcript is judged again at every `Stop` without
      a word, and is written at the first `Stop` where each of its tags is listed or declared.

      **＋** The ledger hook takes its known tags from `.guppi/guppi/tags.py`, the same source as `.guppi/guppi/casecheck.py`.

      **－** A line that the hook cannot read, or refuses for its prefix, is not judged for its tags.

      **－** The blocks of such a line declare no tag.

      **－** `estimate[...]` and `decision[...]` lines are not judged for their tags, and a line already
      in the ledger of any session is not judged again.

      **－** In a project with no `vault/wiki/tags.md`, the ledger hook refuses no lesson for its tags.'
    context: 'A tag is a short label on a page. `vault/wiki/tags.md` lists each tag with its meaning and
      its Russian aliases, and `ask-guppi` maps a Russian question to tags by those aliases. Three guards
      keep a new tag out until a Case is ratified, read in the code. The ledger hook refuses a fresh lesson
      line whose tag `tags.md` does not hold and no tag line of a Case ratified in the session declares
      (`refused_tags` and `tag_message` of `.guppi/guppi/ledger.py`, case 703.2). The check of a Case
      file sends back a Case that uses such a tag without a tag line (`unlisted_tags` of `.guppi/guppi/casecheck.py`,
      case 703.1). `tags.md` gains a row only from the `new_tags` of the Spec, by `register_tags` of `.guppi/guppi/generate.py`,
      and its header says a tag enters only after a Case ratified it. Lessons are mostly written at Retro,
      where no Case is ratified, so the refusal message sends the tag to the handoff of a later session;
      at the Retro of session 1739 two lessons lost the tags `retro` and `box` that way, and Case 826
      of this session adds them. The person agreed that a lesson line may declare its new tag itself by
      a block `{newtag:<tag>|<meaning>|<aliases>}`, which the ledger hook accepts and the librarian''s
      run registers; that the check of a Case file stays; that the one rule names this exception; and
      that the header of `tags.md` changes by a one-off task by hand, with the exception written into
      every text that makes the script the only writer to `vault/wiki/`.


      The block is read once, by `parse_line` of `.guppi/guppi/materialize.py`: both the ledger hook (`refused_tags`)
      and the lift of `materialize` call that function today for a lesson line, so the two sides share
      one reading; a Grep of `newtag` over `.guppi/` printed 0 occurrences, so no other reading of the
      block exists. Until Work Mode changes the code, `parse_line` passes the new block by, so a line
      with it is refused for its tag as today and judged again at each `Stop`; no line is lost. A Grep
      of `the new tag goes as a line of the handoff` over the repository outside `vault/raw/` printed
      `estimate-ledger-write-refuses-a-lesson-with-an-unlisted-tag.md`, `.guppi/tests/test_ledger.py`,
      `.guppi/guppi/ledger.py` and three files of `vault/archive/migration/2026-10-07/0636/raw/` (`materialize.yaml`,
      `spec.md`, `cases/case-703.md`); the first three change in Case 827.1, and the archived ones are
      records of their session and stand. A Grep of `only writer` over `.claude/`, `vault/wiki/` and `CLAUDE.md`
      printed `glossary.md`, `librarian-guppi.md`, `log.md`, `rule-page-generation.md`, `entity-glossary.md`
      and `rule-documentation.md`; `log.md` is a record and is not read, `glossary.md` and `librarian-guppi.md`
      are renders of the pages Case 827.4 changes, and `rule-vault-layout` says the same in other words
      (No file of `wiki/` is written by hand). A Grep of `registry of tags` over `vault/wiki/` printed
      `tags.md`, `glossary.md`, `entity-glossary.md` and `rule-vault-layout.md`, each changed in Case
      827.4. The hand edit of the header runs in Work Mode, before the librarian''s run writes the exceptions
      of Case 827.4 into `rule-vault-layout` and `rule-page-generation`; at that moment it rests on `rule-case-build`,
      which says that a page or a rendered file changes at the librarian''s run or the render, or earlier
      only by a one-off task by hand in Work Mode that a Case names.


