  case_text:
    context: 'A new project gets GUPPI in three moves. The person installs the plugin `guppi`, types `/guppi:install`,
      which only copies the files and builds the Python environment, then reopens Claude Code and types
      `/hi`. Two pages claim that first `/hi`. `rule-morph` puts the Case that sets the project''s settings
      first (case 817). The session files that `guppi ship` writes make `/hi` start `/sprint-open` first,
      so the first sprint opens (case 822.3, `estimate-clean-branch-writes-the-session-files`). Neither
      page gives an order. The pages also call the setup "the install Case" and "the install step", which
      reads as if `/guppi:install` were itself a Case.


      The person chose setup first and the sprint after it, in the same session (Q1). They chose the name
      "setup" for the Case, "install" only for `/guppi:install` (Q2). They chose the Purpose of `rule-morph`
      as the one place that tells the whole start in order (Q3), and the Criterion of `estimate-morph-sets-up-the-project-at-the-first-hi`
      replaced whole as the check (Q4). The person also said that `/guppi:install` is no Case and is never
      ratified, and that the setup is a Case. The new Purpose says both.


      The rule that governs the order is the ledger hook of `rule-ledger-write`. `refused_without_sprint`
      of `.guppi/guppi/ledger.py` refuses each decision line but a `defer` while no live `entity-sprint-`
      page stands, until a `create` of one stands. The Render of `rule-skill-sprint-open` says "the opening
      Case is the first Case the session ratifies", and its first step says that no other item is taken
      up before the opening Case is ratified. The Render of `rule-skill-hi` starts `/sprint-open` first
      when the brief opens with `open the next sprint`. The Criterion of `estimate-sprint-close-next-session-opens-the-sprint`
      promises that refusal, and the Criterion of `estimate-skill-sprint-open-starts-at-hi` promises the
      hook line at `/hi`. These texts stand in this Case. They state what the code and the live skills
      do today. The key of `guppi.toml` that marks the setup as done does not exist yet. A live skill
      that waited for that key would show a setup Case in the repository of GUPPI too. So the new Purpose
      of `rule-morph` says that these steps, the pass of the ledger hook and the key are built in the
      milestone The plugin, and the milestone line of `entity-sprint-plugin` names them as what remains.
      The Case that builds them changes those Renders, that rule and those two Estimates. `estimate-clean-branch-writes-the-session-files`
      and its sentence in `rule-clean-branch`, that the first `/hi` starts `/sprint-open` before the Frontier,
      stand. With setup first, `/sprint-open` still starts before the Frontier.


      A Grep of `install Case|install step|install as done` over `vault/wiki/` printed `log.md`, `rules/rule-clean-branch.md`,
      `rules/rule-claude-md.md`, `rules/rule-guppi-config.md`, `entities/entity-sprint-plugin.md`, `rules/rule-morph.md`
      and `estimates/estimate-morph-sets-up-the-project-at-the-first-hi.md`. `log.md` is not read. Each
      other hit enters this Case. The same Grep over `.claude/` printed nothing. A Grep of `at install\b`
      over `vault/wiki/` printed `log.md`, `rules/rule-guppi-config.md`, `rules/rule-morph.md` and `rules/rule-permissions.md`.
      "The questions asked at install" in `rule-guppi-config` and "whose initiation at install sets the
      folder name" in `rule-permissions` name the setup, and both enter this Case. The hits in `rule-morph`
      stand in its History, and `log.md` is not read. Case 824 also changes the last sentence of the Purpose
      of `rule-permissions`, and its pair there replaces only the words before the colon. The pair of
      this Case replaces only words after the colon, so the two do not overlap, and the ledger applies
      Case 824 first. Read side by side, the sentence then says that the read rules name the folder of
      the repository of GUPPI, after where that repository sits on the person''s disk, and that another
      install waits for `rule-morph`, whose setup Case sets the folder name. Both texts fit. Case 824
      is built again to write "setup Case" in its own texts, so the pairs of this Case do not need to
      catch its text. The rename is a pair under `replace` on each page, not a `reword`. `reword_pairs`
      of `.guppi/guppi/generate.py` fails an entry whose `new` does not already stand in the owner''s
      text, by `owner_text`, and no page holds "setup Case" yet. The sections of the other Estimates whose
      text says "the install" mean `/guppi:install`, and they stand.


      Case 824 of this session changes two sentences of the Purpose of `rule-morph`. The ledger applies
      it before this Case, and this Case writes that Purpose whole, so the new text keeps the words of
      Case 824: "of the repository of GUPPI" for the commands and for the folder of saved transcripts.
      The new texts of `rule-morph`, `rule-claude-md` and `rule-guppi-config`, which carry `core: true`,
      keep each pointer in a bracket at the end of its sentence (case 807.4). The `purpose` and `method`
      of `estimate-morph-sets-up-the-project-at-the-first-hi` state the old promise, and are set anew
      in its `update`. Its `method` waits for the session that builds the setup step, the same event as
      before. No line of its old Criterion is carried word for word. Each old line comes back with "install
      Case" or "install step" renamed "setup Case" or "setup step". The new Criterion adds the order before
      `/sprint-open`, the pass of the ledger hook and the line that `/guppi:install` is no Case. The tests
      of `.guppi/tests/` that read live pages, `test_guppi_package.py` among them, look for old command
      and path words that these texts do not hold.'
    problem: Two pages each put a different Case first at the first `/hi` of a new project, with no order
      between them, and the pages call the setup "the install Case", as if `/guppi:install` were a Case.
    recommend: "- **In what order do setup and the first sprint come?**\n  - Recommended: (a) setup first,\
      \ then the sprint, in one session.\n  - Answer: agreed, (a).\n- **Should the \"install Case\" be\
      \ renamed \"setup Case\"?**\n  - Recommended: (a) rename to \"setup\" everywhere.\n  - Answer: agreed,\
      \ (a).\n- **Where does the start-to-finish description live?**\n  - Recommended: (a) in the Purpose\
      \ of `rule-morph`.\n  - Answer: agreed, (a).\n- **How is the order checked?**\n  - Recommended:\
      \ (a) rewrite that check's promise.\n  - Answer: agreed, (a).\n- **Change**\n  - Asked: a `/pre-spec`\
      \ finding: `rule-permissions` still says that the folder name is set \"at install\".\n  - Taken:\
      \ a pair on `rule-permissions` names the setup Case of `rule-morph` there."
    given: '`rule-morph`: the rule of the setup Case, whose Purpose tells the start of a new project in
      order.

      **＋** `estimate-morph-sets-up-the-project-at-the-first-hi`: the check of that rule, whose Criterion
      is replaced whole.

      **＋** `rule-plugin-install`: the rule of `/guppi:install`, the copy before the setup.

      **＋** `rule-skill-hi` and `rule-skill-sprint-open`: the rules of `/hi` and of `/sprint-open`, which
      opens a sprint.

      **＋** `rule-ledger-write`: the rule of the ledger hook that refuses decision lines while no sprint
      is open.

      **＋** `rule-guppi-config`, `rule-claude-md` and `rule-permissions`: the rules whose Renders hold
      the settings of the setup Case, the read rules of the saved transcripts under `~/.claude/projects`
      among them.

      **＋** `rule-clean-branch` and `entity-sprint-plugin`: pages whose text names the setup Case.'
    when: In a project where the person installed the plugin `guppi` and typed `/guppi:install`, as `rule-plugin-install`
      sets it, and whose `guppi.toml` does not mark the setup of `rule-morph` as done, the person reopens
      Claude Code and types `/hi`.
    then: '`/hi` opens the session as `rule-skill-hi` sets it, and puts the setup Case first, before the
      opening Case of `rule-skill-sprint-open` and before the Frontier.

      **＋** Once the person ratifies the setup Case, `/hi` starts `/sprint-open` in the same session,
      and the ledger hook of `rule-ledger-write` writes the decision lines of the setup Case though no
      sprint is open.

      **＋** The setup step takes the name of the main branch and the git remote from git, and the name
      of the project''s folder of saved transcripts under `~/.claude/projects` from the path of the project.

      **＋** It asks the person only for the values it cannot find, such as `documentation_lang`, `chat_lang`,
      the commands of the keys `test` and `style` of `guppi.toml`, and the description of the project.

      **＋** Every value stands in that one setup Case, which the person ratifies or corrects.

      **＋** The Work Mode of the same session writes the settings by the render of the rule pages that
      hold them, such as `guppi.toml` from `rule-guppi-config`, the description of the project in `CLAUDE.md`
      from `rule-claude-md` and the read rules of the saved transcripts from `rule-permissions`, and `guppi.toml`
      then marks the setup as done.

      **－** `/guppi:install` is no Case, and the person ratifies nothing at it.

      **－** Between `/guppi:install` and the ratified setup Case, no settings file changes but by the
      copy of `/guppi:install` and the render that `/hi` runs.

      **－** The setup step is no skill named `install`.

      **－** The setup step does not ask for the category set: the project takes the development set, as
      `entity-sprint-plugin` keeps the category set as data in its `## Backlog`.

      **－** The setup step reads no code of the project and creates no page for it.

      **－** A project whose `guppi.toml` marks the setup as done gets no setup Case at `/hi`.'
