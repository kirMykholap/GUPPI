  case_text:
    context: 'A tag enters `vault/wiki/tags.md` only from a ratified Case, and the ledger hook refuses
      a lesson line whose tag that file does not hold and no ratified Case of the session declares (case
      703.2). At the Retro of session 1739 two lessons wanted the tags `retro`, `box` and `pre-spec`.
      No Case could be ratified there, so they were written with listed tags: `lesson-retro-red-test-that-a-case-ratified-to-wait-for-the-librarian`
