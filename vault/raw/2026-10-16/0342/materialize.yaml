      output of `guppi gitstate` under `Branch:` in place of two git lines, and the line of `allowed-tools`
      names `guppi gitstate` in place of the two git commands. `git init -b main` writes `.git/` in Plan
      Mode before any Case is ratified. `rule-default-mode` keeps a session from writing anything before
      a Case is ratified, so Case 851.1 adds to its Purpose the one exception the person chose. `rule-permissions`
      allows the agent its own working files only, and `git init -b main` stays out of `allowed-tools`,
      so Claude Code asks the person to allow it and that rule stands. The Criterion of `estimate-default-mode`
      asks only that the Purpose of `rule-default-mode` say why nothing is written before a Case, which
      it still says, so it stands.


