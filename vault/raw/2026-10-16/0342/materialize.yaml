    Criterion: 'When:

      The person types `/guppi:install` of `plugin/skills/install/SKILL.md` in an empty project open in
      Claude Code, where `uv --version` fails.


      Then:

      Before it writes anything, the agent says that GUPPI needs the tool `uv` and asks the person whether
      it installs `uv` now by the standalone installer of `uv` for the system: a PowerShell command on
      Windows, a shell command on macOS and Linux.

