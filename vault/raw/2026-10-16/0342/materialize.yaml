      `estimate-morph-sets-up-the-project-at-the-first-hi.md`, `estimate-plugin-install-writes-guppi-into-an-empty-project.md`,
      `lesson-hi-fails-outside-a-git-repository.md`, `rule-clean-branch.md`, `estimate-sprint-plugin-installs-as-a-plugin.md`,
      `rule-harness.md`, `rule-plugin-install.md` and `rule-morph.md`, and no file under `.claude/`. The
      sentence of `rule-morph` that `/guppi:install` decides nothing and is no Case stands, since the
