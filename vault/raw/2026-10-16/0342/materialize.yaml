      of Case 852.1. The check of this file notes that the step 7 pair of Case 852.1 touches a sentence
      that Case 853 changes too. The check reads the end of the new step 6 of Case 853, which ends with
      a sentence that tells the agent not to send the person to `uv sync`, a reopen of Claude Code or
      `/hi`, and the start of step 7 as one sentence. The `old` of Case 852.1 starts at step 7, and the
      `old` of Case 853 ends at the end of step 6, so neither pair matches text the other changes. The
      two new texts were read side by side, and they fit. The new step 6 of Case 853 stops on a failed
