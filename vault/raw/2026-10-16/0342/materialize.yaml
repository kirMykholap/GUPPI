      now leaves before step 7 on a failure. The sentence of step 4, change no other file, stands, since
      the agent deletes only files it wrote. The Criterion of `estimate-plugin-install-writes-guppi-into-an-empty-project`
      says that the last message tells the person to type `/hi`. It stands, since its last `－` line puts
      what the install does about the Python environment outside that promise. A Grep `uv sync` over `vault/wiki/`
