      \ install's `uv sync` also install `pytest` and `ruff`?**\n  - Recommended: (a) keep the `dev` group\
      \ in the install; leaving it out only moves the download to the first hook.\n  - Answer: agreed,\
      \ (a).\n- **How should we check that a failed `uv sync` undoes the install?**\n  - Recommended:\
      \ (a) a new Estimate on `rule-plugin-install` for the failure path, read by hand in an empty project\
      \ offline with an empty cache of `uv`; Case 852 is built again so that the check of the Python environment\
      \ drops its line on a failed `uv sync` and its offline project.\n  - Answer: agreed, (a)."
