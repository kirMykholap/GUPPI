- case: '852'
  decision: decision-case-852
  origin: raw/2026-10-16/0342/ledger.md#case-852
  children:
  - decision-case-852.1
  - decision-case-852.2
  tags:
  - plugin
  - harness
  case_text:
    context: '`/guppi:install` is the one skill of the plugin `guppi`. Its first step runs `uv --version`.
      When that fails, it says that GUPPI needs the tool `uv`, tells the person to install it and type
      `/guppi:install` again, stops and writes nothing. In `C:\PROJECTS\test-no-uv` it did just that,
      and the person said they would prefer the agent itself to offer to install `uv`; this session recorded
      `estimate-guppi-package-is-ready-after-the-install` as failed on that answer and on the offline
      install. The person chose that the agent asks whether it installs `uv` by the standalone installer
      of `uv` and runs it on a yes. After the installer, the agent runs `uv --version` again. When that
      passes, the install goes on in the same session, and its last message tells the person to start
      Claude Code from a new terminal, so that the hooks of the project find `uv`. When it fails, because
      this session of Claude Code does not see the new `uv`, the agent sends the person to a new terminal
      and a new `/guppi:install`. On a no, the agent shows the command and stops, writing nothing. The
      two installer commands in the new step come from the agent''s knowledge: `case-guppi` could not
      read the installation page of `uv` from here. The person agreed that Work Mode reads that page before
      the render, so Case 852.1 holds a task that compares the commands with the page and stops on a difference,
      as condition 1 of `rule-where-to-stop` sets it. The rule is `rule-plugin-install`. Its Purpose holds
      one sentence on a missing `uv`, which Case 852.1 replaces, and its Render holds step 1, which Case
      852.1 replaces, and step 7, to which Case 852.1 adds the new terminal. Its one Estimate, `estimate-plugin-install-writes-guppi-into-an-empty-project`,
      stands: its Criterion leaves out what the install does about `uv`, and its sentence that the last
      message tells the person to reopen Claude Code and type `/hi` stays true. The offer is a promise
      that can fail apart from the build of the environment, so Case 852.1 creates `estimate-plugin-install-offers-to-install-uv`,
      a slug that a Glob `vault/**/*install-uv*` did not print. Case 852.2 replaces the Criterion, `purpose`
      and `method` of `estimate-guppi-package-is-ready-after-the-install` without the missing-`uv` line
      and the project with no `uv`, so they no longer state the old stop. The new Criterion keeps the
      `When` line, the line that `uv --version` runs before any write, the line on `uv sync` after the
      copy and the line on the hooks word for word. It adds a `－` line that the install asks nothing about
      `uv` where `uv --version` passes, since the reading of this Estimate runs on the machine with `uv`,
      and the reading of `estimate-plugin-install-offers-to-install-uv` runs only where `uv` is missing.
      The line on a failed `uv --version` is dropped, since Case 852.1 sets that path anew and its Estimate
      checks it. At the person''s word, Case 852.2 also drops the line on a failed `uv sync` and the offline
      project from that Estimate, so it keeps only the build of `.guppi/.venv/`. Case 853 of this session,
      the related item C4, sets what the install does when `uv sync` fails and creates its own Estimate
      on `rule-plugin-install` for it. That Case changes step 6 of the Render of `rule-plugin-install`,
      and Case 852.1 changes the description, step 1, step 7 and the Purpose sentence on a missing `uv`.
      Its case file, `vault/raw/2026-10-16/0342/cases/case-853.md`, was read whole and stands in the `given`
      of Case 852.1. The check of this file notes that the step 7 pair of Case 852.1 touches a sentence
      that Case 853 changes too. The check reads the end of the new step 6 of Case 853, which ends with
      a sentence that tells the agent not to send the person to `uv sync`, a reopen of Claude Code or
      `/hi`, and the start of step 7 as one sentence. The `old` of Case 852.1 starts at step 7, and the
      `old` of Case 853 ends at the end of step 6, so neither pair matches text the other changes. The
      two new texts were read side by side, and they fit. The new step 6 of Case 853 stops on a failed
      `uv sync` before step 7, and its ban on `/hi` binds only that failure. The new step 7 of Case 852.1
      runs only after a successful step 6, and it adds the new terminal only when step 1 installed `uv`.
      The new Purpose sentence of Case 853 follows the sentence on `uv sync`, and Case 852.1 changes only
      the sentence on a missing `uv`. `guppi ship --check`, run by `uv run --project .guppi guppi check`,
      refuses a reference to a case in `plugin/skills/install/SKILL.md`, as `test_check_judges_the_plugin_skill_in_place`
      of `.guppi/tests/test_ship.py` shows, so the new Render text holds no pointer to a case; the pointer
      in the new Purpose sentence stands, since the page has no `core: true` and `guppi ship` does not
      write it. A Grep `rule-plugin-install|guppi:install` over the repository, outside `vault/raw/`,
      `vault/archive/`, `log.md` and `brief.md`, printed `vault/wiki/sprint.md`, `entity-sprint-plugin.md`,
