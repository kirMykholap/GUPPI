decisions:
- case: '851.1'
  decision: decision-case-851.1
  origin: raw/2026-10-16/0342/ledger.md#case-851.1
  targets:
  - kind: update
    category: rules
    slug: rule-git-context
    ref: rule-git-context
  - kind: update
    category: rules
    slug: rule-skill-hi
    ref: rule-skill-hi
  - kind: create
    category: estimates
    slug: estimate-git-context-offers-git-init
    ref: rule-git-context
  - kind: update
    category: rules
    slug: rule-default-mode
    ref: rule-default-mode
  tags:
  - session
  - harness
  - git
  case_text:
    given: '`rule-git-context`: the Render of the `Branch:` line of `/hi` and the step outside a repository.

      **＋** `rule-skill-hi`: the skill `/hi`, its `allowed-tools` and its step that starts `/sprint-open`.

      **＋** `rule-default-mode`: no write before a ratified Case, with its one exception.

      **＋** `rule-skill-sprint-open`: its hook on `/hi` asks for `/sprint-open` before the Frontier.

      **＋** `.claude/skills/hi/SKILL.md`: the skill file rendered from `rule-skill-hi`.

      **＋** `raw/<date>/<hi HHMM>/frontier.md`: the Frontier that `/hi` writes.

      **＋** `estimate-git-context-offers-git-init`: the new check of this behaviour.'
    when: 'The person types `/hi` of `.claude/skills/hi/SKILL.md` in a project folder, and its `Branch:`
      line, which runs `uv run --project .guppi guppi gitstate` of `rule-git-context`, reads `none: this
      folder is no git repository`.'
    then: 'Before `/sprint-open` and before the Frontier, the agent says that GUPPI works only in a git
      repository and asks the person whether it runs `git init -b main`.

      **＋** On the person''s yes, the agent runs `git init -b main`, which Claude Code asks the person
      to allow, says that the repository is made, and tells the person to type `/hi` again.

      **＋** The next `/hi` prints `main` under `Branch:` and goes on as `rule-skill-hi` sets it, `/sprint-open`
      first when the hook of `rule-skill-sprint-open` asks for it.

      **＋** On the person''s no, the agent tells the person to type `/hi` again after `git init -b main`.

      **－** After either answer, that `/hi` starts no `/sprint-open` and writes no `raw/<date>/<hi HHMM>/frontier.md`.

      **－** `git init -b main` is the one write before a ratified Case that `rule-default-mode` allows,
      and `allowed-tools` of `.claude/skills/hi/SKILL.md` does not name it.'
    context: 'When the person types `/hi`, the skill file runs two git commands as `!` lines before the
      agent''s first turn: `git branch --show-current` for `Branch:` and `git status --short` for `Status:`.
      Claude Code stops the whole skill when one of those commands fails, so in a folder that is no git
      repository `/hi` ends on `fatal: not a git repository` and the agent never gets a turn. In session
      0104 this stopped the first `/hi` after `/guppi:install` in an empty folder; after `git init`, a
      second `/hi` started `/sprint-open` (`lesson-hi-fails-outside-a-git-repository`, the Result of `estimate-clean-branch-writes-the-session-files`).
      The hooks on `/hi` need no git: `dirty` of `.guppi/guppi/gate.py` gives an empty text when git fails,
      and `.guppi/guppi/shellwrite.py` catches the error of git. The person chose that one GUPPI command,
      `uv run --project .guppi guppi gitstate`, takes the place of the two git lines and always exits
      0. In a folder with no repository it prints a line that says so, and the agent asks whether it runs
      `git init -b main`. On a yes it runs it and ends `/hi`, and the person types `/hi` again; on a no
      it ends `/hi` too. Either way the `/hi` that saw no repository starts no `/sprint-open` and writes
      no Frontier. `-b main` names the first branch `main`, since `/sprint-open` takes any other branch
      for the branch of a closed sprint and plans a push of it. The pre-spec finding on atomicity split
      what the command prints, checked by a test in Case 851.3, from what the agent asks, checked by hand
      in Case 851.1.


      In a repository the command prints the branch under `Branch:` as git did, and the `/hi` that prints
      the `none` line ends before any skill reads that line. So step 4 of `rule-skill-sprint-open`, step
      1 of `rule-skill-merge-main` and `estimate-skill-sprint-open-merges-the-closed-sprint-branch` read
      a real branch name, `main` after a `git init -b main`, and stand. The Criterion of `estimate-git-context-current`,
      which speaks of `Branch:` with the current branch and `Status:` with `git status --short` in this
      repository, stands for the same reason. The `allowed-tools` of `rule-skill-hi` names the two git
      commands, and the Criterion of `estimate-hi-no-read-calls` names them too, so Case 851.2 replaces
      that Criterion. It carries both of its promises in new words: the line of the context names the
      output of `guppi gitstate` under `Branch:` in place of two git lines, and the line of `allowed-tools`
      names `guppi gitstate` in place of the two git commands. `git init -b main` writes `.git/` in Plan
      Mode before any Case is ratified. `rule-default-mode` keeps a session from writing anything before
      a Case is ratified, so Case 851.1 adds to its Purpose the one exception the person chose. `rule-permissions`
      allows the agent its own working files only, and `git init -b main` stays out of `allowed-tools`,
      so Claude Code asks the person to allow it and that rule stands. The Criterion of `estimate-default-mode`
      asks only that the Purpose of `rule-default-mode` say why nothing is written before a Case, which
      it still says, so it stands.


      `estimate-morph-sets-up-the-project-at-the-first-hi` (pending, on the draft `rule-morph`, whose
      setup Case is not built) puts the setup Case before the opening Case of `/sprint-open` and before
      the Frontier, and takes the name of the main branch and the remote from git. The git step of this
      Case comes first: the setup needs a repository, and the `/hi` that runs `git init` ends before any
      Case. `estimate-sprint-plugin-installs-as-a-plugin` (pending) promises that `/hi` opens a working
      session in an empty project after `/guppi:install`; in a folder with no git that now happens at
      the `/hi` after the person''s `git init -b main`. For the related item C7, Case 855 defers `estimate-clean-branch-writes-the-session-files`.


      The Case leaves out the following:

      - `/guppi:install`, which still runs no git command (`rule-plugin-install`).

      - A machine without git: there the command prints the same line, and the `git init` that the person
      allows fails where the person sees it.

      - `/work` and `/box`, whose skills also run `git branch --show-current` but run only after a `/hi`.

      - The owner check of `/sprint-open` by `gh`, which a new repository with no remote does not pass.

      - The setting for the name of the main branch, which the person left to the setup Case of `rule-morph`.
      That page lists the code that takes the main branch to be `main` among the settings that the setup
      Case fixes.


      Rule `rule-one-judgment-one-implementation` in `CLAUDE.md`: a Grep `\["git"` over `.guppi/guppi/`
      printed `box.py`, `gate.py`, `ship.py` and `shellwrite.py`. `git` of `box.py` and `dirty` of `gate.py`
      give an empty text when git fails, so they cannot tell a missing repository from an empty answer.
      No function there judges whether a folder is a git repository, so the new command holds the one
      copy of that judgment. A Grep `git branch --show-current|git status --short|Branch:` over `.claude/`
      printed `.claude/skills/work/SKILL.md`, `.claude/skills/hi/SKILL.md`, `.claude/skills/merge-main/SKILL.md`,
      `.claude/skills/sprint-open/SKILL.md` and `.claude/skills/box/SKILL.md`. The hits in `work`, `box`,
      `merge-main` and `sprint-open` stand for the reasons above, and `hi` is the rendered file that this
      Case changes. `.guppi/tests/test_guppi_package.py` reads each file under `.claude/` live for the
      old forms of commands. The new line uses `uv run --project .guppi guppi`, so it passes that test.
      The brackets `(as set in case 851)` and `(as set in case 851.1)` in the new text of `rule-git-context`
      and `rule-default-mode`, pages with `core: true`, each stand at the end of their sentence, so `guppi
      ship` removes each one whole.'
  parent: decision-case-851
  spec: vault/raw/2026-10-16/0342/spec.md
  applied: 05:25:46
