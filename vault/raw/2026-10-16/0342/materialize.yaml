  case_text:
    context: '`/guppi:install` copies the files of GUPPI into an empty project and then runs `uv sync
      --project .guppi`, which downloads the Python packages and builds `.guppi/.venv/`. Step 6 of its
      skill says only that when `uv sync` fails, the agent shows the output and stops. In `C:\PROJECTS\test-uv-offline`
      of session 0104, `uv sync` failed on `ruff==0.16.1` of the `dev` group, and the agent''s last sentence
      still told the person to run `uv sync`, reopen Claude Code and type `/hi`. `.guppi/.venv/` was left
      unbuilt (handoff of session 0104). The project kept every copied file, and a second `/guppi:install`
      would refuse it at step 3, because its files already stand. The person said this was bad, and this
      session recorded `estimate-guppi-package-is-ready-after-the-install` as failed. The person chose
      that on a failed `uv sync` the agent shows the output, deletes every file it copied and every folder
      it made, says that the install did not finish, and tells the person to type `/guppi:install` again,
      with no word on `/hi`. The deletion keeps the Purpose of `rule-plugin-install`, the rule that governs
      this change: a project loses no file of its own, since the install deletes only what it wrote into
      a project that held none of those files. The person chose that `uv sync` keeps the `dev` group.
      A project runs `pytest` and `ruff` through `guppi test` and `guppi style`, as `guppi.toml` sets
      them, and Work Mode, Retro and the CI of the project run them. From the agent''s knowledge of `uv`,
      which was not read here, `uv run` would install the missing group at the first hook anyway, and
      with no network and an empty cache `uv` cannot download PyYAML or Python either. The person chose
      a new Estimate on `rule-plugin-install` for this failure path. Case 852.2 replaced the Criterion
      of `estimate-guppi-package-is-ready-after-the-install` with a `－` line on a failed `uv sync`. To
      keep this promise from being signed twice, Case 852 is built again: that line and the offline project
      leave that Criterion and its `method`, and point to `estimate-plugin-install-undoes-the-copy-when-uv-sync-fails`.
      The person agreed to that rebuild. Case 852.1 changes the Purpose sentence on a missing `uv`, the
      description, step 1 and step 7 of `rule-plugin-install`. This Case changes step 6 and adds one sentence
      after the sentence on `uv sync` in the Purpose, which Case 852.1 does not touch, so the `old` of
      each pair matches the page as Case 852.1 leaves it. The check of this file notes that the step 6
      pair touches a sentence that Case 852.1 changes too. That sentence runs across the end of step 6
      and the start of step 7, which the check reads as one sentence. The `old` of this Case ends at the
      end of step 6, and the `old` of Case 852.1 starts at step 7, so neither pair matches text the other
