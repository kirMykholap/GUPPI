  sections:
    Criterion: 'When:

      The `Stop` hook `uv run --project .guppi guppi ratified` runs after a reply whose `LEDGER` block
      holds lines of a Case N that are all `defer` — beside the lines of other Cases or alone — and the
      same reply shows `## Case N —` in the short form, by `is_short_form` of `.guppi/guppi/casecheck.py`:
      `context`, `problem` and a fence tagged `then` with its `defer` items, no `given` and no `when`.


      Then:

      The hook writes that Case under `## Deferred` of the plan file while `spec.md` in the session''s
      folder does not stand, and of that `spec.md` once it stands: the heading, `context`, `problem` and
      the `then` block as the reply shows them.

      **＋** The section of Case N is replaced when it stands there, appended at the end of `## Deferred`
      otherwise; the heading `## Deferred` is added when the file has none.

      **＋** A `then` block without a `defer` item carrying `slug`, `type` and `purpose` for each `defer`
      line of the reply: exit 2 with the reason on stderr.

      **＋** A `defer` line of Case N whose slug names a Lesson or a Decision page, by `defers_a_record`
      of `.guppi/guppi/materialize.py`, whether its page stands or not: exit 2 with `case N: defer <slug>:
      a Lesson or a Decision page carries no deferred_by, so no list shows its defer — defer the rule
      or entity page whose change settles it` on stderr, and nothing of the Case is written.

      **＋** A key of a `defer` item that `item_keys` of `.guppi/guppi/materialize.py` does not give a
      `defer` of its category: exit 2 with `` `<key>`: not a key of defer <slug> `` on stderr, and nothing
      of the Case is written.

      **＋** A `then` block that holds a YAML comment — a `#` at the start of a line or after a space or
      a tab, outside a quoted value and outside a `|` or `>` block — as the function of `.guppi/guppi/materialize.py`
      judges it: exit 2 with the line of the comment and the advice to quote the value on stderr, and
      nothing of the Case is written.

      **＋** With `stop_hook_active` set, the hook writes and refuses as without it, as `estimate-spec-write-answers-a-refusal`
      sets it, and a reason it already gave in the stretch is not given again, as `estimate-spec-write-tells-each-reason-once`
      sets it.

      **－** A `defer` line of a rule, an entity, an Insight or an Estimate is not refused by `defers_a_record`.

      **－** A `#` inside a quoted value or inside a `|` or `>` block is text, not a comment, and is no
      refusal.

      **－** A `defer` of a category with no schema file, or of one whose schema rule a decision line of
      the session or of the reply creates or updates, is not judged by its keys (case 308.2).

      **－** The check after the write does not run on the Case.'
  applied: '21:10:11'
