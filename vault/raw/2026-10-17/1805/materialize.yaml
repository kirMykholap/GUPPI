    slug: rule-spec-write
    ref: rule-spec-write
  - kind: update
    category: rules
    slug: rule-spec-capture
    ref: rule-spec-capture
  tags:
  - hooks
  - harness
  - workflow
  case_text:
    given: '`estimate-spec-write-copies-a-built-defer-only-case`: the new check of the path of such a
      Case.

      **＋** `rule-spec-write`: the rule of the `Stop` hook that writes the Spec.

      **＋** `rule-spec-capture`: the rule of the Spec file, which names the writers of the file.

      **＋** `.guppi/guppi/ratified.py`: the hook, `uv run --project .guppi guppi ratified`.

      **＋** `.guppi/guppi/casecheck.py`: the store, the reading of a sending and `is_short_form`.

      **＋** `.guppi/tests/test_ratified.py`: the tests of the hook.'
    when: 'The `Stop` hook `uv run --project .guppi guppi ratified` of `.guppi/guppi/ratified.py` runs
      after a reply whose `LEDGER` block holds lines of a Case N that are all `defer`, and the same reply
      does not show Case N in the short form, by `is_short_form` of `.guppi/guppi/casecheck.py`: no `given`,
      no `when`, and a fence tagged `then` with `defer` items.'
    then: 'The hook takes Case N for a Case built by `case-guppi`: it reads the text stored for Case N
      and the sending of the file of Case N, as for a Case with lines of another kind.

      **＋** It writes the stored text into the plan file, and into the approved Spec of the session once
      it stands, in the place of a ratified Case and not under `## Deferred`: the heading, `context`,
      `problem`, `recommend`, `given`, `when` and `then`, a block tagged `then` whose `defer` items it
      builds from the sub-points of `tasks`, and a block tagged `tasks`.

      **＋** A store with no Case N: exit 2 with `case N: not built and checked by case-guppi — dispatch
      it` on stderr, and nothing of Case N is written.

      **＋** A decision line of Case N that carries `{supersedes:case M}` removes Case M from the plan
      file and the approved Spec, as for any Case written in the run.

      **－** A reply that shows Case N in the short form makes the hook write Case N under `## Deferred`
      from that reply, and the hook reads no stored text for it.'
    context: 'When the person ratifies a Case, the `Stop` hook of `rule-spec-write` copies it into the
      Spec. A Case built by `case-guppi` is copied from the text the check of `rule-case-check` stored
      for its file. A short put-off, which the main agent writes itself, is copied from the reply that
      shows it: `context`, `problem` and a fence tagged `then` with its `defer` items. Today the hook
      picks the path by the kinds of the lines alone: `ratified_cases` of `.guppi/guppi/ratified.py` leaves
      out each Case whose lines in the reply are all `defer`, and `defer_only` sends it to `deferred_section`,
      which wants the fence tagged `then` in the reply. A Case that `case-guppi` built in full with only
      `defer` lines holds its items as task lines in its file, and the check of the file refuses a fence
      there. In session 0027 Case 876 was such a Case: the hook refused its acknowledging reply with "no
      fence tagged then with its defer items", and the main agent showed it again in the short form, so
      the Spec of that session holds it without `recommend`, `given`, `when` and `then`, in words that
      differ from its file (`lesson-ratified-defer-only-case-wants-its-fence-in-the-reply`, handoff of
      session 0027). The rule that governs the choice is the Purpose of `rule-spec-write`, that a ratified
      Case enters the Spec in the words `case-guppi` wrote into its file.


      The person chose: the Spec hook changes, not the check of the file; the hook tells the two kinds
      by what the reply shows, by `is_short_form` of `.guppi/guppi/casecheck.py`, read whole, which is
      true when the lines hold no `given` and no `when` and a fence tagged `then` opens with `defer:`.
      `shows_sections` of the same module, read whole, already leaves out a showing that `is_short_form`
      takes for the short form, and its docstring names it the one judgment of the `Stop` check of a showing
      and of the showing the Spec hook reads, so after the change both hooks judge the short form by one
      function, imported, and no second copy is written. A reply that shows a built Case, and the acknowledging
      reply that shows only its heading, are not the short form, so such a Case takes the path of every
      built Case: `against_store`, `sent`, `changed_file` of `.guppi/guppi/casecheck.py`, then `write_case`,
      whose `read_tasks` already builds `defer` items from task lines, as for Case 875 of session 0027,
      whose `defer` line stood beside an `update`. A reply with lines that are all `defer`, no short form
      and no store entry gets the refusal `against_store` gives, "not built and checked by case-guppi
      — dispatch it". The store was not chosen as the test, since it keeps the entry of a Case that `case-guppi`
      dropped — `other_blocks` of `.guppi/guppi/casecheck.py` leaves such an entry out by `dropped`, whose
      file holds only blank space — so a short put-off written after a drop would take the full path.
      The ledger hook does not part: `off_store` of `.guppi/guppi/ledger.py` leaves every `defer` line
      out of its comparison with the store.


      The person chose a new Estimate, `estimate-spec-write-copies-a-built-defer-only-case`; a Glob `vault/**/estimate-spec-write-copies-a-built-*.md`
      printed nothing, so the slug is free. Three Criteria of `rule-spec-write` speak of every Case of
      put-offs as the short form and are replaced whole by the person''s choice, one line each: `estimate-spec-write-writes-a-defer`
      (879.2), whose refusal of a reply with no showing goes, since such a reply now takes the full path;
      `estimate-spec-write-refuses-a-changed-case-file` (879.3), whose "A defer-only Case has no file";
      and `estimate-spec-write-checks-the-written-case` (879.4), whose "a defer-only Case ... are not
      checked". Their `purpose` and `method` do not state the old promise and stand. Each replaced Criterion
      keeps every other line word for word, so the check of the file notes the lines it leaves, which
      are the one line each changes, and the trigger it widens or narrows. It also notes the lines the
      sub-cases share, such as the lines on `stop_hook_active` and on a refusal with exit 2; they stand,
      since each is a line of its own Estimate today and says the same of a different path of the hook.
      `estimate-spec-write-copies-the-ratified-case` stands: its trigger, lines of a kind other than `defer`,
      stays true, and the new Estimate covers the rest. A Grep `defer-only` over `vault/wiki/` outside
      `decisions/`, `log.md` and `brief.md` printed `orchestration.md`, `rule-orchestration.md`, `rule-prespec.md`,
      `rule-spec-capture.md`, `rule-spec-write.md`, `estimate-materialize-assembles.md`, `estimate-orchestration-defer-example-passes-the-hook.md`,
      `estimate-prespec-checks-the-frame.md`, `estimate-spec-write-copies-the-ratified-case.md`, `estimate-spec-write-checks-the-written-case.md`
      and `estimate-spec-write-refuses-a-changed-case-file.md`. The hits in `rule-prespec.md`, `estimate-materialize-assembles.md`
      and `estimate-spec-write-copies-the-ratified-case.md` are History lines. The hit in `estimate-prespec-checks-the-frame.md`
      speaks of a Case without `given`, which stays true. The hits in `orchestration.md`, `rule-orchestration.md`
      and `estimate-orchestration-defer-example-passes-the-hook.md` speak of the short-form example, which
      takes the short path, and `.guppi/tests/test_orchestration.py` calls `write_defers` with that reply,
      so it stays green under the Criterion that Case 878.11 sets. `rule-spec-write.md` and `rule-spec-capture.md`
      change here. A Grep `defer` over `vault/wiki/estimates/estimate-{spec-capture,case-check,ledger-write}*.md`
      printed nothing for `rule-spec-capture`, and 13 files: `estimate-ledger-write-refuses-a-defer-of-a-record.md`,
      `estimate-ledger-write-holds-a-decision-line-off-the-stored-case.md`, `estimate-ledger-write-reminds-of-the-mark-on-a-decision-line.md`,
      `estimate-ledger-write-refuses-a-reading-of-a-change-of-the-session.md`, `estimate-case-check-shows-only-the-checked-case.md`,
      `estimate-case-check-sends-back-a-ratified-case-without-a-target.md`, `estimate-case-check-sends-back-a-ratified-case-in-another-shape.md`,
      `estimate-case-check-sends-back-a-ratified-case-with-a-changed-create-line.md`, `estimate-case-check-sends-back-a-faulty-case.md`,
      `estimate-case-check-refuses-text-outside-the-list.md`, `estimate-case-check-requires-a-backlog-item-decided-on-its-page.md`,
      `estimate-case-check-refuses-a-changed-case-file.md` and `estimate-case-check-notes-a-page-the-cascade-archives.md`.
      None of them is made false: the hits on the case check speak of a showing in the short form, of
      `defer` lines in the ledger or in a Result or History, and the hits on the ledger hook speak of
      the ledger lines, which this Case does not change. A Grep `rule-spec-write\.md|rule-spec-capture\.md`
      over `.guppi/tests/` printed `test_spec.py`, whose hit is its docstring, so no test reads either
      page live. Left not done: the Spec of session 0027 keeps Case 876 in the short form, and the lesson
      stays as it stands, since its fix is ratified in another session.'
  parent: decision-case-879
