    given: '`estimate-ratification-case-id-carries-the-sprint`: its Criterion is replaced whole, and its
      purpose set anew.

      **＋** `rule-ratification`: its target, the rule of the ledger and the Case id.

      **＋** `.guppi/guppi/caseid.py`: the reader of a Case id and its fixed list `PLAIN_SPRINTS`.

      **＋** `.guppi/guppi/casecheck.py`, `.guppi/guppi/ratified.py`, `.guppi/guppi/lint.py`, `.guppi/guppi/gate.py`
      and `.guppi/guppi/materialize.py`: the readers of a Case id.

      **＋** `vault/wiki/orchestration.md` and `rule-orchestration`: the steps of the main agent.

      **＋** `raw/<date>/<hi HHMM>/ledger.md`: the ledger of the session.

      **＋** `vault/wiki/sprint.md`: the file of the open sprint.

      **＋** `/sprint-open`: the skill that sets the id of the opening Case.'
    when: '`.guppi/guppi/casecheck.py`, `.guppi/guppi/ratified.py`, `.guppi/guppi/lint.py`, `.guppi/guppi/gate.py`
      or `.guppi/guppi/materialize.py` reads a Case id in a ledger line, a heading of a Case file, a file
      name `case-<id>.md` or an `origin`.

      **＋** The main agent, with `vault/wiki/orchestration.md` rendered from `rule-orchestration`, runs
      `uv run --project .guppi guppi caseid --next --session <stamp>`, `<stamp>` the stamp of the `hi:`
      line of its session, before it dispatches a new top-level Case.

      **＋** Or `uv run --project .guppi guppi caseid --next` runs without `--session`, or with a stamp
      whose session has no plan file.'
    then: 'A Case id of a sprint that `PLAIN_SPRINTS` of `.guppi/guppi/caseid.py` does not list is the
      sprint id, a hyphen and the number of the Case in that sprint, from 1, with a dot for each sub-case
      level, such as `kir-plugin-12.1`, and its Case file is `case-<id>.md` of its top-level Case (sprint
      ids came in with case 788.2).

      **＋** The readers read a Case id through `.guppi/guppi/caseid.py`, which takes both forms and reads
      the sprint id as the text before the last hyphen ahead of the number.

      **＋** The sprints that `PLAIN_SPRINTS`, a fixed list in `.guppi/guppi/caseid.py`, names keep plain
      ids to their close (the sprints of that list opened before case 788.2).

      **＋** The main agent creates the plan file of its session with its title line before its first run
      of the command.

      **＋** `uv run --project .guppi guppi caseid --next --session <stamp>` takes the open sprint from
      the `create` decision line of a sprint page in `raw/<date>/<hi HHMM>/ledger.md` of the session of
      that stamp, else from the first heading of `vault/wiki/sprint.md`, and prints the next id of that
      sprint.

      **＋** It holds the id it prints in `<plan>.checked.json` of the plan file of that session, under
      that id, with no `agent_id` and no text, so that the next run prints the id after it.

      **＋** The main agent dispatches each new top-level Case with the id that the command printed, but
      the opening Case of a sprint, whose id `/sprint-open` sets.

      **－** The main agent runs the command only to get the id of a new top-level Case, once for each
      Case, and never to check an id or what the store holds, since each run holds a new id.

      **－** Without `--session` the command prints no id: it prints its usage error and exits 2.

      **－** With a stamp whose session has no plan file, the command prints no id, holds nothing, prints
      one line on stderr and exits 1.

      **－** An id with no sprint part, such as `785.1`, stays as it is, and no page, file or citation
      is renamed.'
