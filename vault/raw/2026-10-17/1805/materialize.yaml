  case_text:
    given: '`estimate-tests-clock-pinned`: its Criterion is replaced whole.

      **＋** `rule-tests-clock-pinned`: its target, the rule of the pinned clock.

      **＋** `.guppi/tests/conftest.py`: the file of the fixture.

      **＋** `.guppi/tests/test_conftest.py`: the test of the fixture.

      **＋** `.guppi/tests/` and `.guppi/guppi/`: the tests and the modules.'
    when: '`pytest` collects `.guppi/tests/`, and a test calls the `run()` of a module of `.guppi/guppi/`
      without `now`, or the code reads the clock outside `run()`.'
    then: 'Before every test, an autouse fixture in `.guppi/tests/conftest.py` sets into every module
      of `.guppi/guppi/` that carries a `datetime` attribute a subclass whose `now(tz=None)` returns `2001-01-01
      00:00:00 UTC`, and `astimezone` gives the same second. A test that leaves the code on the real clock
      sees the year 2001 and fails on the day it is written.

      **＋** The list of modules comes from a walk over `.guppi/guppi/`, never from a hand list: a new
      module with a clock is covered with no change to the fixture.

      **＋** `.guppi/tests/test_conftest.py` shows it: a `run()` without `now` writes a time dated 2001,
      and `datetime.strptime`, `fromisoformat` and the constructor of the subclass work as before.

      **＋** Each run of the tests of `.guppi/tests/` under pytest runs under the same fixture, whatever
      command starts it.

      **－** A test that passes `now` does not notice the fixture: `run()` reads no clock.'
