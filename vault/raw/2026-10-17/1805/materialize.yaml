  decision: decision-case-879.1
  origin: raw/2026-10-17/1805/ledger.md#case-879.1
  targets:
  - kind: create
    category: estimates
    slug: estimate-spec-write-copies-a-built-defer-only-case
    ref: rule-spec-write
  - kind: update
