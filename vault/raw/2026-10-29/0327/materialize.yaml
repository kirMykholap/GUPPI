      `test_ship.py` asserts no line on a page under `vault/wiki/estimates/`, and the new texts hold no
      case id. Each of the five is `pending` until its reading, and `guppi ship` writes only `passed`
      Estimates. So the clean version holds the new Criterion of each one whose reading passes before
      the next reading of `estimate-clean-branch-ships-neutral-texts`, whose Criterion Case 898.1 replaces.'
