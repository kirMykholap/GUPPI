    method: 'by hand at Retro of the session that replaces this Criterion: the Render of rule-orchestration
      in vault/wiki/orchestration.md read against the Criterion, recorded in the estimate line'
  change: the Criterion replaced whole — it names no Estimate that the clean version does not hold; the
    method reads the Render as it stands
  sections:
    Criterion: 'When:

      In Plan Mode before `/pre-spec`, a Case of the session goes back to its `case-guppi` — the person
      questions or changes it, or the person drops a change to it and its `case-guppi` undoes the change
      — while the `case-guppi` of another Case has not answered or a round of another Case stands unanswered,
      with `vault/wiki/orchestration.md` rendered from `rule-orchestration`.


      Then:

      The Cases out at the same time are one batch, and take the steps of a batch that `vault/wiki/orchestration.md`
      sets until each is ratified or deferred.

      **＋** The main agent shows no Case while a round of another Case of the batch stands unanswered:
      a Case that comes back built waits, and is not shown.

      **＋** While an answer of a `case-guppi` of the batch is out, the main agent ends each turn with
      one line under the bold label `**Waiting:**`, translated, that names the Cases that have answered
      and those still out, and nothing else.

      **＋** It shows every round that came back in one list, each question numbered `<Case id>.Q<n>`,
      and sends each answer to the `case-guppi` of its Case, all in one message.

      **＋** It shows every Case of the batch in one reply, for one ratification.

      **－** A Case that goes back while no other Case of the session is out is shown again alone.

      **－** A batch of items that one answer of the person takes up, and a batch of a ratified Case asked
      to change while another Case is built, are no moment of this promise.

      **－** The loop after the findings of `/pre-spec` stays as `rule-prespec` sets it.'
  applied: '19:20:00'
