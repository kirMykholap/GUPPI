- case: '900.1'
  decision: decision-case-900.1
  origin: raw/2026-10-29/0327/ledger.md#case-900.1
  targets:
  - kind: update
    category: estimates
    slug: estimate-git-context-offers-git-init
    ref: rule-git-context
  tags: []
  case_text:
    given: '`estimate-git-context-offers-git-init`: its defer is retired and its `method` is set anew.

      **＋** `rule-git-context`: the git step of `/hi`.

      **＋** `.claude/skills/hi/SKILL.md`: the skill that opens a session.

      **＋** `rule-skill-hi`: sets `/hi`.

      **＋** `rule-skill-sprint-open`: its hook asks for `/sprint-open`.

      **＋** `rule-default-mode`: sets the writes allowed before a ratified Case.

      **＋** `raw/<date>/<hi HHMM>/frontier.md`: the Frontier of a session.'
    when: 'The person types `/hi` of `.claude/skills/hi/SKILL.md` in a project folder, and its `Branch:`
      line, which runs `uv run --project .guppi guppi gitstate` of `rule-git-context`, reads `none: this
      folder is no git repository`.'
    then: 'Before `/sprint-open` and before the Frontier, the agent says that GUPPI works only in a git
      repository and asks the person whether it runs `git init -b main`.

      **＋** On the person''s yes, the agent runs `git init -b main`, which Claude Code asks the person
      to allow, says that the repository is made, and tells the person to type `/hi` again.

      **＋** The next `/hi` prints `main` under `Branch:` and goes on as `rule-skill-hi` sets it, `/sprint-open`
      first when the hook of `rule-skill-sprint-open` asks for it.

      **＋** On the person''s no, the agent tells the person to type `/hi` again after `git init -b main`.

      **－** After either answer, that `/hi` starts no `/sprint-open` and writes no `raw/<date>/<hi HHMM>/frontier.md`.

      **－** `git init -b main` is the one write before a ratified Case that `rule-default-mode` allows,
      and `allowed-tools` of `.claude/skills/hi/SKILL.md` does not name it.'
    context: 'Five install checks stand `pending` and put off in the backlog. Each needs a person to install
      GUPPI by hand, from a clean copy written by `guppi ship --allow-draft`, into an empty project. `decision-case-862`
      put off four of them: `estimate-git-context-offers-git-init`, `estimate-guppi-package-is-ready-after-the-install`,
      `estimate-plugin-install-offers-to-install-uv` and `estimate-plugin-install-undoes-the-copy-when-uv-sync-fails`.
      `decision-case-885` put off `estimate-clean-branch-writes-the-session-files`. The events that the
      methods wait for have come. A tag `prod-x.y.z` stands in the history of HEAD, since `git tag --merged
      HEAD` prints `prod-0.2.0`, `prod-1` and `prod-2`. The librarian''s runs that the methods name are
      done. So the readings can be taken in the Work Mode of this session. The person chose one Case for
      the five, one sub-case per Estimate. Each sub-case retires the defer of its Estimate by an `update`
      that names the page and carries one `{supersedes}` mark for each Case in its `deferred_by`, as `case-schema.md`
      sets it for a taken-up defer. `decided_on_its_page` of `.guppi/guppi/prespec.py`, which the check
      of this file and `/pre-spec` both call, counts only a decision line whose own slug is the page.
      The `ref` of a line does not count. `clear_deferred_by` of `.guppi/guppi/generate.py` drops a defer
      only from the pages that the superseding Case names. So `estimate-close-commits` and `estimate-spec-write-writes-a-defer`
      keep their defer by Case 885 and stay in the backlog, which the person chose. The pages `rule-clean-branch`
      and `rule-guppi-package` stand in the backlog on their own defers, and this Case leaves them there.

      Each sub-case is checked by its own Estimate. The `when` and `then` of each sub-case are the Criterion
      of that Estimate word for word. The `update` sets no `status` and no Criterion, so the Criterion
      and the `pending` status stand until the reading. By the person''s choice, the readings run at one
      `stop:` task of Work Mode, in Case 900.2. Before it, the agent runs `test_ship.py -k skeleton` in
      the repository, since those tests build their own tree in a temporary folder and the clean copy
      holds no `test_ship.py`. It writes one fresh clean copy for the three `--check` commands that `estimate-clean-branch-writes-the-session-files`
      names, and a second fresh copy, in which no command runs, as the catalogue of the installs. Step
      2 of `plugin/skills/install/SKILL.md` copies each file of the plugin but those under `.claude-plugin/`,
      `skills/` and `.git/`, so a Python environment that the `--check` commands may leave in their copy
      would reach the projects. It would then hide whether `uv sync` built `.guppi/.venv/`, or whether
      it failed offline. `rule-clean-branch` says that the clean version does not hold `.guppi/.venv/`.
      At the stop, the person makes three installs from the second copy. The first goes into a folder
      with no git on a machine with `uv`, for the checks of Cases 900.1, 900.2 and 900.3. The second is
      started from a terminal whose PATH holds no folder of `uv`, for Case 900.4. The third runs with
      `UV_OFFLINE=1` and an empty `UV_CACHE_DIR`, for Case 900.5. `rule-where-to-stop` makes a reading
      that only the person can take no stop, unless a task opens with `stop:`. The reading lines are taken
      from the person''s report and the files of each folder. Frontier line A1 is the question of `estimate-guppi-package-is-ready-after-the-install`,
      and the reading of Case 900.3 answers it. `estimate-plugin-install-writes-guppi-into-an-empty-project`
      and `estimate-sprint-plugin-installs-as-a-plugin` may be read at the same installs, and they are
      not part of this Case.

