  text: decision[case 901.3][update][estimate-case-protocol-case-form]{ref:rule-case-protocol}{supersedes:case
    899.5}{supersedes:case 899.7}
  case: '901.3'
  kind: update
  slug: estimate-case-protocol-case-form
  origin: raw/2026-10-29/0327/ledger.md#case-901.3
  decision: decision-case-901.3
  ref: rule-case-protocol
  supersedes:
  - '899.5'
  - '899.7'
  category: estimates
  set:
    status: pending
  change: the Criterion replaced whole — it names no Estimate that the clean version does not hold
  sections:
    Criterion: 'When:

      `case-guppi` writes a Case it built into `raw/<date>/<hi HHMM>/cases/case-<N>.md`, the hook of `rule-case-check`
      checks it, and the main agent sends that file to the person, at its first showing or again.


      Then:

      The file opens with the heading `## Case N — name`, a sub-case with `### Case N.M — name` under
      its parent, and holds the sections of each Case in the order of the Sections table of `vault/wiki/case-schema.md`,
      each one blockquote whose first line is `**name:**`.

      **＋** `context` and `problem` are plain prose that explains briefly — `context` opens with the mechanism
      in plain words, then gives the state of the pages the Case changes, the vault''s answer, what `case-guppi`
      found in the frame and why an Estimate of the rule is not touched, and leaves out a part with nothing
      to say — `recommend` is the list the Sections table of `vault/wiki/case-schema.md` sets, each item
      plain prose, and the person raised no complaint in the session about their length or clarity.

      **＋** `given` holds the frame, one thing per line — each page, module, file and test the Case touches
      and the rule that constrains, its slug or path in a code span and its role — and no state.

      **＋** In `given`, `when` and `then` each line after the first opens with `**＋**` or `**－**`, a `**－**`
      line names something of `given` or `when`, `then` holds behaviour only, and none of them holds a
      count of items — pages, lines, Estimates, Cases, tests; a number that states a condition or a limit
      stands.

      **＋** `tasks` names by slug each Estimate the Case creates or replaces, and under a line whose item
      writes content that content stands as sub-points; no `contract` line and no "block N" line.

      **＋** `tasks` holds no `by hand` box whose moment comes after Work Mode of the Case''s own session
      — the librarian''s run of that session or a later session; such a check stands as the reading of
      an Estimate or is left to the `uv run --project .guppi guppi check` of the librarian''s run.

      **＋** A pair under `replace` or `reword` stands only when the Case says what the sentence around
      each match names; a Case that changes the behaviour of a page gives an `update` to each Estimate
      of that page whose Criterion speaks of the change.

      **＋** `ratification` holds only the preview of the ledger lines in an untagged fence; in the chat
      the Case stands as the short text and that `ratification`, as `vault/wiki/orchestration.md` sets
      the showing, and the reply ends with a plain question.

      **＋** A Case with sub-cases stands in one file and is sent in one reply: the parent''s `context`,
      `problem` and `recommend`, then each sub-case whole, with its own `recommend` when it has one.

      **－** A case number, a count, a line number or a quotation in `context`, `problem` or `recommend`
      is no fault of the form.'
  applied: '19:20:00'
