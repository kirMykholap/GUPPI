  slug: insight-orchestration-writes-from-its-own-reading
  origin: raw/2026-10-29/0327/ledger.md#L45
  fields:
    type: insight
    pattern: the main agent writes a fact or a line that a source of record holds — a ratification line
      of a case-guppi summary, the tool calls of a transcript — from its own reading or impression instead
      of copying it from that source or reading it there first, so what it writes can differ from the
      source
    children:
    - lesson-orchestration-claimed-a-reading-before-taking-it
    - lesson-orchestration-retyped-a-ratification-line
  tags:
  - orchestration
  - session
  sections:
    Pattern: Twice in two sessions the main agent wrote what a source of record already held from its
      own reading of it. In session 2312 it stated that no "modified since read" refusal came, from its
      impression of the case-guppi summaries, before it opened a transcript. In session 0327 it showed
      the line of 900.5 with {supersedes:case 885}, retyped from its own reading of the defers, where
      the summary of case-guppi held {supersedes:case 862}; the Stop check of rule-case-check refused
      the reply.
    Proposal: A suggestion, not a decision — rule-orchestration could say that a ratification line of
      a showing is copied from the summary of its case-guppi and a fact of a subagent's tool calls is
      stated only after a run over its transcript, and a check could compare the lines of a showing with
      the summary.
  librarian: synthesis
