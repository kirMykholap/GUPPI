    given: '`estimate-sprint-close-next-session-opens-the-sprint`: its Criterion is replaced whole.

      **＋** `rule-brief`: its Render writes the `Cases` of Next session in `vault/wiki/brief.md`.

      **＋** `.claude/skills/hi/SKILL.md`: the skill that opens a session.

      **＋** `.claude/skills/sprint-open/SKILL.md`: the skill that opens a sprint.

      **＋** `vault/wiki/sprint.md`: the page of the open sprint.

      **＋** `entity-sprint-<id>`, `entity-sprint-<new id>` and `entity-sprint-`: the page of a sprint,
      the closed one and the new one, and the prefix of its slug.

      **＋** `.guppi/tests/test_ledger.py`: the tests of `guppi ledger`.

      **＋** `.guppi/tests/test_materialize.py`: the tests of `guppi materialize`.'
    when: 'Someone reads `.claude/skills/hi/SKILL.md`, `.claude/skills/sprint-open/SKILL.md` and the step
      of the Render of `rule-brief` that writes the `Cases` of Next session in `vault/wiki/brief.md`,
      for the session that opens after the librarian''s run of the session that closes `entity-sprint-<id>`
      ends with no live sprint page.

      **＋** Or `.guppi/tests/test_ledger.py` and `.guppi/tests/test_materialize.py` run `guppi ledger`
      and `guppi materialize` over a made-up vault with no live sprint page.'
    then: 'The first line of the `Cases` of Next session in `vault/wiki/brief.md` is `open the next sprint
      — no sprint is open since the close of <id>`.

      **＋** `/hi` starts `/sprint-open` and writes no `frontier.md` before the opening Case is ratified;
      then `frontier.md` holds that line first under `## Cases`, closed `[x] … · case N` by the opening
      Case, and no item of `vault/wiki/sprint.md`.

      **＋** While no live `entity-sprint-` page stands, `guppi ledger` refuses each decision line of the
      session but a `defer`, with one stderr line, until the session''s ledger or the same reply holds
      a `create` decision line of an `entity-sprint-` slug.

      **＋** Each page that the librarian''s run writes from the ledger of that session, which holds the
      `create` decision line of `entity-sprint-<new id>`, carries `sprint: <new id>`.

      **－** An `estimate` or `lesson` line is not refused for this reason.

      **－** The error of `guppi sprint` in the closing run is a flag of the brief, not a failure of this
      promise.'
    context: '`guppi ship` writes into the clean version of GUPPI each `passed` Estimate whose target
      page it ships, with its Criterion as it stands here. The reading of `estimate-clean-branch-ships-neutral-texts`
      in this Plan Mode (ledger line 1 of this session) listed shipped Estimates whose Criterion holds
      a sentence true only in the repository of GUPPI. Case 898 set the yardstick: a sentence passes when
      it holds as it reads in a project that installed GUPPI. This Case is Case 899 built again under
      a new number, since the person narrowed it at `/pre-spec` and it no longer holds sub-cases that
      have decision lines. Its decision lines carry `{supersedes:case 899}` and one mark for each sub-case
      of Case 899.

      `decision-case-893.1` deferred this rewrite on `rule-clean-branch`, so that a Criterion replaced
      then would not set each Estimate `pending` and its rule `draft` until its reading. The `status`
      field of `rule-rules-schema` says that the cascade of `generate` sets a rule `built` only once every
      Estimate passes. `rule-clean-branch` says that while a rule or an entity with `core: true` stands
      `draft`, `guppi ship <folder>` writes nothing, so the workflow writes nothing to `prod`. So the
      person chose to keep in this Case only the Estimates whose reading this session takes, by a test
      or at its Retro. The others go back on the list of the reading, and the defer of `decision-case-893.1`
      stays for them. No line of this Case carries a mark that retires that defer.

      Five Estimates stay, each one sub-case. `estimate-sprint-close-next-session-opens-the-sprint` is
      read by pytest and a reading of the skill files. `estimate-materialize-lifts-a-lesson` and `estimate-materialize-judges-a-fence`
      are read by pytest. `estimate-case-protocol-case-form` is read on the Cases of this session at its
      close. `estimate-orchestration-batches-cases-out-at-once` is read at the Retro of this session,
      once its `method` reads the Render as it stands, since its old `method` reads "the new Render of
      rule-orchestration in the Spec" and this session does not change that Render. The cost: `rule-sprint-close`,
      `rule-case-protocol` and `rule-materialize` stand `built` with `core: true`, so each is `draft`
      from the replaced Criterion until its reading passes in this session. `rule-orchestration` already
      stands `draft`.

      Seven Estimates leave, since their `method` waits for a live event:

      - `estimate-synthesis-keeps-actioned-by-the-mark` and `estimate-synthesis-clusters` wait for a librarian''s
      run of a given kind.

      - `estimate-permissions` waits for the person''s word after a Case file written in Plan Mode.

      - `estimate-orchestration-forwards-a-discussion-question` waits for such a question.

      - `estimate-glossary-terms-defined` waits for the librarian''s run.

      - `estimate-ask-query-before-a-create` waits for a Case with a `create` without a `ref`.

      - `estimate-compact-recall-reloads` holds a live reading of a compaction beside its pytest.

      The person added the last two at `/pre-spec`. The first holds "in Russian or in English" and the
      second the sample session folder "raw/2026-09-28/2229/".

      In the five, the lines change by the yardstick. Three lines named an Estimate that the clean version
      does not hold, so they now say what they need in their own words, or drop the pointer. `estimate-hi-writes-frontier`,
      `estimate-orchestration-signs-items-taken-together` and `estimate-orchestration-shows-the-built-case`
      are `pending`. `estimate-materialize-lifts-a-lesson` said "that day" of a past day of GUPPI. `estimate-materialize-judges-a-fence`
      listed code names that a past change of GUPPI removed. Four of the Estimates first listed stand
      by the yardstick of Case 898, and the Case 899 text says why. Two wait for a Case of their own that
      removes a fallback path from the code.

      A Grep of `wiki_root\(REPO|read_vault\(.*REPO|REPO / "vault"|ship\.ship\(REPO` over `.guppi/tests/`
