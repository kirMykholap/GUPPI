      **＋** `rule-orchestration`: renders `vault/wiki/orchestration.md`, which sets the steps of a batch.

      **＋** `case-guppi`: the agent that builds each Case.

      **＋** `rule-prespec`: sets the loop after the findings of `/pre-spec`.'
    when: In Plan Mode before `/pre-spec`, a Case of the session goes back to its `case-guppi` — the person
      questions or changes it, or the person drops a change to it and its `case-guppi` undoes the change
      — while the `case-guppi` of another Case has not answered or a round of another Case stands unanswered,
      with `vault/wiki/orchestration.md` rendered from `rule-orchestration`.
    then: 'The Cases out at the same time are one batch, and take the steps of a batch that `vault/wiki/orchestration.md`
      sets until each is ratified or deferred.

      **＋** The main agent shows no Case while a round of another Case of the batch stands unanswered:
      a Case that comes back built waits, and is not shown.

      **＋** While an answer of a `case-guppi` of the batch is out, the main agent ends each turn with
      one line under the bold label `**Waiting:**`, translated, that names the Cases that have answered
      and those still out, and nothing else.

      **＋** It shows every round that came back in one list, each question numbered `<Case id>.Q<n>`,
      and sends each answer to the `case-guppi` of its Case, all in one message.

