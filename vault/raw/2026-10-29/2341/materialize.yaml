  case_text:
    given: '`estimate-sprint-close-moves-old-event-logs`: its Criterion is replaced whole and its `method`
      set.

      **＋** `.guppi/guppi/sprint_close.py`: the close; its module docstring names the ignore file.

      **＋** `.guppi/tests/test_sprint_close.py`: the tests of the close over a made-up vault.

      **＋** `.guppi/guppi/ledger.py`: `session_dir` and `session_event_logs`, which find the session of
      the run.

      **＋** `vault/.gitignore`: the lines that leave the event logs out of git.

      **＋** `vault/raw/<date>/event_log.md`: a daily event log, beside the session folders of `vault/raw/`.

      **＋** `vault/archive/<id>/<date>/event_log.md`: where an old log goes.

      **＋** `estimate-clean-branch-ships-neutral-texts`: constrains the `method` of a shipped Estimate.'
    when: '`uv run --project .guppi guppi sprint-close --sprint <id> --apply` of `.guppi/guppi/sprint_close.py`
      closes a sprint, in the librarian''s run or in `.guppi/tests/test_sprint_close.py` over a made-up
      vault, and the session of the run is the stamp whose `hi` line `session_dir` of `.guppi/guppi/ledger.py`
      takes to the newest session folder of `vault/raw/`.'
    then: 'After a close whose run of `guppi cleanup` exits 0, each `vault/raw/<date>/event_log.md` dated
      before the start date of the session of the run, the first date that `session_event_logs` of `.guppi/guppi/ledger.py`
      gives for its stamp, moves to `vault/archive/<id>/<date>/event_log.md`.

      **＋** A date folder that the moves leave empty is removed.

      **＋** `vault/.gitignore` leaves out each moved log, so git tracks none.

      **＋** Stdout holds one line per log moved.

      **－** The log of the start date and of each later date stays where it is, since the hooks of that
      session read them, the start date two or more days before the date of the session folder included.

      **－** With no session folder in `vault/raw/`, or with no stamp or more than one whose `hi` line
      `session_dir` takes to the newest session folder, no log moves, and stdout holds one line that says
      why.

      **－** A log whose target exists does not move: one line on stderr, and the close exits 1 after the
      other moves.

      **－** A refused close moves no log.'
    context: 'When a sprint closes, `guppi sprint-close` moves old daily event logs into `vault/archive/`,
      and git must ignore them there. Since case 893.1 the lines that ignore the logs stand in `vault/.gitignore`,
      and the root `.gitignore` holds none. `guppi ship` writes `vault/.gitignore` into the clean version:
      the constant `VAULT_IGNORE` of `.guppi/guppi/ship.py`, which `plan` adds to the files it writes,
      checked by `test_it_writes_the_lines_that_keep_the_event_logs_out_of_git` in `.guppi/tests/test_ship.py`.
      So the brief''s line that the clean version holds no `.gitignore` and that no module writes one
      is half wrong: the root `.gitignore` does not ship, but `vault/.gitignore` does. The defect is that
      two shipped Estimates name a bare `.gitignore`. The `method` of `estimate-sprint-close-moves-old-event-logs`
      sends the reader to "the line of .gitignore" in the tree, which reads as the root file and finds
      no such line there. One line of its Criterion and one line of the Criterion of `estimate-event-log-records`
      name the same bare file. The module docstring of `.guppi/guppi/sprint_close.py` says the same. The
      rule that governs these texts is the Criterion of `estimate-clean-branch-ships-neutral-texts`: no
      sentence of the `purpose` or `method` of a shipped Estimate may hold only in the repository of GUPPI.
