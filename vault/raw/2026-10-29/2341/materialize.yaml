- case: '918.2'
  decision: decision-case-918.2
  origin: raw/2026-10-29/2341/ledger.md#case-918.2
  targets:
  - kind: update
    category: estimates
    slug: estimate-case-build-writes-the-case
    ref: rule-case-build
  tags: []
  case_text:
    given: '`estimate-case-build-writes-the-case`: its Criterion is replaced whole.

      **＋** `rule-case-build`: renders `.claude/agents/case-guppi.md`, the agent that builds a Case.

      **＋** `.claude/skills/grill-me/SKILL.md`: the form of a round.

      **＋** `vault/wiki/case-schema.md`: the form of a Case; `vault/wiki/ratification.md`: the form of
      the ledger lines.

      **＋** `raw/<date>/<hi HHMM>/cases/case-<N>.md`: the file of a Case.

      **＋** `raw/<date>/<hi HHMM>/cases/note-<N>.md`: the working note of `case-guppi`.

      **＋** `raw/<date>/<hi HHMM>/ledger.md`: the session''s ledger, whose decision lines decide the number
      of a Case.

      **＋** `.claude/agents/ask-guppi.md`: the vault query run before a `create` without a `ref`.

      **＋** `.claude/settings.json`: the hooks registered on each event.

      **＋** `/pre-spec`: the skill whose findings come back on a Case.

      **＋** `rule-case-check`: the hook that sends findings on the file and on the summary.

      **＋** `rule-spec-reconcile`: the guard of `.guppi/guppi/ratified.py` that writes the file in Plan
      Mode.

      **＋** `estimate-clean-branch-ships-neutral-texts`: constrains the texts of a shipped Estimate.'
    when: 'The main agent dispatches `case-guppi` with a Case id, a Frontier item and its source, and
      the person''s words on it; or sends it by `SendMessage` the person''s answers to a round, or the
      person''s question or change on a Case it built.

      **＋** Or the hook of `rule-case-check` sends it findings on the file of its Case or on its summary.

      **＋** Or the main agent sends it by `SendMessage` the drop of the Case it built, the drop of a change
      to that Case, or a finding of `/pre-spec` on that Case.

      **＋** Or, in Work Mode, the main agent dispatches it with the id of a new top-level Case, the path
      of the file of a ratified Case of the approved Spec, the sub-case of it that must change and the
      reason.'
    then: '`case-guppi` starts with `.claude/skills/grill-me/SKILL.md` in its context by `skills: [grill-me]`
      in `.claude/agents/case-guppi.md`, and reads `vault/wiki/case-schema.md` and `vault/wiki/ratification.md`
      whole before it answers.

      **＋** Before a `create` without a `ref`, it runs the vault query of `.claude/agents/ask-guppi.md`
      itself, and the `context` of the Case gives the answer.

      **＋** It reads each page and file the `given` names, the Criterion of each Estimate such a page
      lists, and, for a Case that adds or changes a hook, the hooks on the same event in `.claude/settings.json`;
      each contradiction is fixed in the Case, or the `context` says why it stands.

      **＋** While a fork is open — the bound, the alternative, the promise, the split, the exceptions
      or what is left not done — its answer is a round of questions in the form of `.claude/skills/grill-me/SKILL.md`,
      in the language of the repository, with no Case heading and nothing else but the context of a first
      round.

      **＋** The first round on an item opens, before its first question, with one prose paragraph under
      the label `**Context:**`: what the item is about, what the thing does today and where it goes wrong,
      and what the round decides — a sentence per part where one is enough, a part with nothing to say
      left out.

      **＋** When no fork is open, it writes the Case whole in the language of the repository in the chat
      form of `vault/wiki/case-schema.md`, its ledger lines in the form of `vault/wiki/ratification.md`,
      from the heading to the fence of `ratification` and nothing else, into `raw/<date>/<hi HHMM>/cases/case-<N>.md`
      by `Write`, N the id of the top-level Case.

      **＋** Its answer is then a summary alone: a first line `**Built:**` and the path of the file; a
      second line `**Case:**` with the id and the name of the top-level Case as the heading of the file
      writes them, a Case with sub-cases included; then one list item per Case and sub-case with its id
      and name, the Estimate that checks it and one line on what that Estimate checks, and under the item
      its ledger lines in an untagged fence, as the file holds them.

      **＋** When the `context` of a Case says that another Case of the session should change instead,
      the item of that Case in the summary carries a line `**Other Case:**` that names the other Case
      and the change it needs.

      **＋** Where an Estimate that the Case creates, or whose Criterion it replaces, already makes the
      promise behind that change, the change it names is a pointer to that Estimate, never that promise
      written again.

      **＋** Sent findings by the hook on the file, or asked for a change by a message, it changes the
      file by `Edit` of the lines that change and answers with the summary again; sent a finding on its
      summary alone, it answers with the summary again and leaves the file as it stands; asked by a message
      that opens a fork, it answers with a round.

      **＋** Asked, by a message or by a finding of `/pre-spec`, to change a Case, it builds the change
      under the number of that Case; outside Work Mode a Case keeps its number unless `vault/wiki/case-schema.md`
      sets a new one for it.

      **＋** Asked, by a message or by a finding of `/pre-spec`, for a fix that adds a second behaviour
      with a promise of its own to a Case that has a decision line in `raw/<date>/<hi HHMM>/ledger.md`
      and no sub-cases, it writes no new file and answers with a round that asks whether the behaviour
      goes into that Case, built again under a new number as `vault/wiki/case-schema.md` sets it, or into
      a new top-level Case beside it.

      **＋** Where the person chooses a new Case beside it, it builds that behaviour as a new top-level
      Case in its own file and with no `{supersedes:case N}` mark. The number of the new Case is one above
      the highest number of the files under `raw/<date>/<hi HHMM>/cases/` and of the decision lines of
      that ledger, or the free number that the guard of `.guppi/guppi/ratified.py` names when it refuses
      that number. The ratified Case and its file stay as they are, and its summary names the new Case.

      **＋** A pair of that new Case whose sentence the ratified Case changed takes that sentence as the
      ratified Case leaves it.

      **＋** Dispatched in Work Mode with a ratified Case and the sub-case of it that must change, it reads
      the file of that Case whole and builds under the id of the prompt a new top-level Case that holds
      each sub-case it replaces whole, as it is to stand: each page change, task and Estimate of that
      sub-case that still holds, with the change.

      **＋** Each decision line of that new Case carries `{supersedes:case N.M}` for each sub-case it replaces,
      or `{supersedes:case N}` for a ratified Case with no sub-cases, and the file of the ratified Case
      stays as it is.

      **＋** A round may come at the first answer on an item, after a message on a Case it built, and in
      Work Mode when a ratified Case is built again.

      **＋** In Work Mode a round may also come when it builds a new Case that replaces a sub-case of a
      ratified Case.

      **＋** It runs on `model: opus` with `effort: medium`, the tools Read, Grep, Glob, Write, Edit and
      WebFetch, and `permissionMode: auto`, which Claude Code applies only while the session runs in `default`
      or `dontAsk` mode.

      **＋** In Plan Mode the guard of `rule-spec-reconcile` writes the text of its `Write` or `Edit` into
      its file and stops the call; a line of the guard that says the file is written it takes as the write
      done, does not make the call again, and reads the file by `Read` before its next `Edit` of it.

      **＋** `.claude/agents/case-guppi.md` sets `autoCompactWindow: 400000`, so Claude Code compacts the
      context of `case-guppi` before it reaches 400000 tokens.

      **＋** Before each answer, and first when a message brings the person''s answers or a change, `case-guppi`
      writes `raw/<date>/<hi HHMM>/cases/note-<N>.md` whole by `Write`, N the id of the top-level Case:
      each question of its rounds by its title with its recommendation and the person''s answer, the pages
      and files it read for the frame, the forks still open, and what is still to do.

      **＋** When its context opens with a summary of earlier work, it reads that note by `Read` before
      anything else, goes on from what it says, and reads again the pages and files its next step needs.

      **＋** Sent the drop of its Case, which has no decision line in `raw/<date>/<hi HHMM>/ledger.md`,
      it writes empty text into the file of that Case by `Write` and answers with a first line `**Dropped:**`
      and the path of the file, and nothing else. A file of its own that it leaves behind, when it builds
      the Case again under another number, it empties the same way only when that Case has no decision
      line in that ledger.

      **＋** Sent the drop of a change to its Case, which has a decision line in `raw/<date>/<hi HHMM>/ledger.md`
      and which it changed after the Case was last ratified, it undoes by `Edit` each edit it made since
      then in every section but `recommend`. `recommend` keeps its items and gains one item `**Change**`:
      its `Asked:` line says that the person dropped the change, and its `Taken:` line says that the Case
      went back to its ratified form. It answers with the summary again, so that the check of `rule-case-check`
      finds an item for each question of its rounds.

      **－** It does not put a change asked on a named Case into a new top-level Case without the person''s
      answer to a round.

      **－** A fix that changes what the ratified Case already set is not built beside it: `case-guppi`
      builds the Case again under a new number, as `vault/wiki/case-schema.md` sets it.

      **－** In Work Mode it never builds a Case of the approved Spec again under its own number; a Case
      ratified in that Work Mode that comes back to it before any of its tasks has run it changes under
      its own number, as in Plan Mode.

      **－** The `**Case:**` line is no Markdown heading, so the hook of `rule-case-check` does not read
      the summary as a Case.

      **－** It does not write the whole Case again to fix a finding, make a change or undo a change.

      **－** A later round on the item, a round after a message on a Case it built and a round in Work
      Mode carry no context.

      **－** The context carries no Case heading, so the hook of `rule-case-check` neither checks nor stores
      the round as a Case; it judges only the form of the questions of the round, not its context.

      **－** It writes no file but the file of its Case, the file it leaves behind under an earlier number
      of the same Case, the file of a new Case it builds beside a ratified Case and its note, and no ledger
      line.

      **－** It asks no question again whose answer its note holds.

      **－** It empties no file of a Case that has a decision line in `raw/<date>/<hi HHMM>/ledger.md`,
      the file it leaves behind when it builds that Case again under a new number included: sent the drop
      of such a Case that it did not change after the Case was last ratified, it answers under a first
      line `**Fact:**` that the Case is ratified, and the file stands.'
