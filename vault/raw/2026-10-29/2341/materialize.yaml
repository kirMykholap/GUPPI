decisions:
- case: '913'
  decision: decision-case-913
  origin: raw/2026-10-29/2341/ledger.md#case-913
  targets:
  - kind: update
    category: rules
    slug: rule-close
    ref: rule-close
  - kind: update
    category: estimates
    slug: estimate-close-reports-in-twenty-lines
    ref: rule-close
  tags: []
  case_text:
    context: 'At the end of its run the librarian returns a short report, and `/handoff` or `/box` shows
      it to the person unchanged. The Render of `rule-close` in `.claude/agents/librarian-guppi.md` lists
      what the report gives, caps it at twenty lines and ends with "Nothing else". `estimate-close-reports-in-twenty-lines`
      checks the counts, the flags, the lint total and the twenty lines. Its reading at the start of this
      session was `failed` on the numbers 15, 25 and 12. `case-guppi` read the report at its source, the
      last message of the saved chat of the previous session (`7f200512-38a4-43be-9723-2cbf3756ed67.jsonl`,
      the message after the librarian''s hand-back). That report gives 24 pages created, 23 updated, the
      `incomplete` mark of Case 905, a Flags list with the stale defer of `rule-clean-branch`, a lint
      of 11 lines and 19 lines in all. A Grep `12 lines|\(15\)|\(25\)` over that chat printed nothing,
      and the person then said they had looked at another report; the main agent writes the new reading
      before this Case is ratified. `brief.md` gives 23 created while its own list adds up to 24; the
      main agent records that as a lesson line (Q2). The report''s own rule is still at fault. Other steps
      of the same frame send more to the report: each Grep of the index check with the number of lines
      it printed, each page opened for a duplicate, a cluster or a script error, the one read of `ledger.md`,
      a refused instruction or call, and what `guppi archive` moved or kept. So "Nothing else" is false
      beside them. Three Estimates set those parts, and the pointer of the new list to them leaves each
      Criterion true, so each stands: `estimate-index-check-merges` (each Grep and its number of lines,
      each page opened), `estimate-synthesis-clusters` (each page opened at the synthesis) and `estimate-documentation-completes`
      (each page opened, the read of `ledger.md`, the units of `guppi archive`, a refused call, a refused
      instruction of the handoff). `estimate-spec-box-runs-a-conserved-spec` says that `/box` shows the
      librarian''s report unchanged with the exit code of `uv run --project .guppi guppi test`. That exit
      code is a line `/box` adds beside the report, not a part of the report, so that Criterion stands,
      and the new `then` says so. The report also held a `Tests` line and a list of files, which no step
      asks for. The person chose to drop the twenty-line limit, since they see no point in it. This Case
      rewrites the list of `rule-close`: the report gives the parts the list names and each part that
      another step of the frame sends to it, holds no test result and no list of files, and has no limit
      of lines. It replaces the Criterion, the `purpose` and the `method` of the Estimate, since all three
      state the old promise. The old line on the counts, the flags and the lint total is not carried word
      for word: the first line of the new `then` names those parts and the marks and archived pages beside
      them. The old line on twenty lines or fewer is dropped, as the person chose. The Case also renames
      the Estimate `estimate-close-reports-the-run`; a Glob `vault/**/estimate-close-reports-the-run*.md`
      printed nothing, so the slug is free. `estimate-close-commits`, the other Estimate of `rule-close`,
      speaks of the commit, not of the report, so its Criterion stands. The failure of the commit command
      that the report names is a Frontier item of its own (Q4). The librarian applies the ledger entries
      in their order (`apply` in `.guppi/guppi/generate.py`), and `Vault.estimate` there replaces the
      status and the Result of the page. So the new reading, written before this Case''s decision lines,
      lands on the old Criterion before this update sets the page `pending`. The `method` waits for a
      librarian''s run that starts with the new Render. The run of this session starts with the old one,
      since its render step comes later, so Retro leaves the Estimate `pending`. A Grep `twenty` (case-insensitive)
      over `vault/wiki/` and `.claude/` printed `brief.md`, `log.md`, `rules/rule-close.md`, `estimates/estimate-close-reports-in-twenty-lines.md`,
      `estimates/estimate-close-commits.md` and `.claude/agents/librarian-guppi.md`. brief.md and log.md
      are not read. In `estimate-close-commits.md` the word stands only in the slug on a History line.
