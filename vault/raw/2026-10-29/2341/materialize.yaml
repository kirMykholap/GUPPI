      the close command or a copy of it, so no other shell command reads the output of a `guppi` command.
      The fix is in code, so it holds at the librarian''s run of this session, whose frame still holds
      the old close command, which then works as written; the Render of `rule-close` does not change.
      `rule-render-harness` lists `.guppi/guppi/render.py` in its `implementation_ref`, but a Grep `--paths`
      over `vault/wiki/estimates/estimate-render-*.md`, the files of its three Estimates, printed nothing;
      `estimate-close-commits`, whose target is `rule-close`, holds that promise since case 857. This
      Case replaces its Criterion whole (Q2): each old line stands, but its first line, on what `--paths`
      prints, which is not carried word for word, since the new first line adds the bare line feed to
      it, and a new line says that the close command as written passes each path as it stands. It also
      sets its `purpose` anew, since the old one does not name the close command as written; its `method`
      gains the test that runs `--paths` as a child process and reads its output as bytes, and keeps its
      reading by hand of the commit after a librarian''s run. The main agent writes a new reading `failed`
      of the Estimate before this Case''s decision lines (Q3), so that the failure lands in its Result
      before this update sets it `pending`. A failed close command does not go into the librarian''s report
      by this Case (Q4); the report is the frame of Case 913, which changes another sentence of the same
      Render. A Grep `estimate-close-commits|render --paths` over the repository outside `vault/raw/`
      and `vault/archive/` printed `vault/wiki/brief.md`, `vault/wiki/log.md`, `.claude/agents/librarian-guppi.md`,
      `vault/wiki/rules/rule-close.md`, `vault/wiki/estimates/estimate-close-commits.md`, `vault/wiki/lessons/lesson-brief-lists-transcript-readings-under-work.md`
      and `.guppi/tests/test_render.py`. `brief.md` and `log.md` are not read; the lesson records a reading
      of an earlier session and stands; the close command in `rule-close` and `librarian-guppi.md` stays
