      and `estimates/estimate-sprint-close-moves-old-event-logs.md`. `rule-clean-branch` and `estimate-clean-branch-writes-a-clean-copy`
      already name `vault/.gitignore`. `rule-guppi-package` and `estimate-guppi-package-runs-from-its-own-folder`
      speak of `.guppi/.gitignore`, and the hit in `estimate-clean-branch-ships-neutral-texts` is its
      Result. All of these stand. The same Grep of `.claude/` printed nothing. A Grep of `.guppi/` for
      `leaves the moved logs|event-log-records|sprint-close-moves`, with `.venv/` left out, printed only
      `.guppi/guppi/sprint_close.py`, so no test reads either Estimate page or that docstring. Frontier
      item C3 of this session lists the Criterion line of `estimate-sprint-close-moves-old-event-logs`
      among the sentences to rewrite. 917.1 rewrites it, and Case 918, which takes C3, leaves that Estimate
      out of its rewrite for this reason, in its finished file. Case 918 replaces the Criterion of four
      other Estimates and names neither Estimate of this Case. In their finished files, Case 913 changes
      `rule-close` and its report Estimate, Case 915 the ledger hook, `rule-orchestration`, `rule-case-build`
      and `rule-prespec-onward`, and Case 916 `rule-orchestration` and `rule-case-build`. None of them
      changes a page or a file of this Case.'
