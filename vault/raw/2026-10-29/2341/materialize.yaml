  case_text:
    context: 'Today the `Stop` hook `uv run --project .guppi guppi ledger` writes the decision lines of
      a reply. Then, for each lesson of the session that no mark ties to a Case, it exits 2 with one stderr
      line asking whether a Case of the session fixed the lesson''s cause: `unaddressed` and `reminder_message`
      of `.guppi/guppi/ledger.py`, called in `run` after `append`, judged by `unlinked_lessons` of `.guppi/guppi/materialize.py`.
      `untold` of the same module stays silent only while the line already stands in a refusal of the
      hook since the person''s last message. So the question comes back at every ratification. In session
      2341 the lesson `lesson-librarian-writes-a-total-no-count-printed` drew it after Case 913 and again
      after Case 914, and each time the answer was no. Each time it cost one more reply in the chat. The
      person found this noisy and pointed out two things. A later Case may still fix a lesson. Only an
      `error` lesson needs this judgment, since a `knowledge` lesson records a fact and has no cause for
      a Case to fix. The person asked for a quiet question, or an answer inside the reply that holds the
      Frontier.


      A `Stop` hook cannot ask quietly. Claude Code''s hook documentation (https://code.claude.com/docs/en/hooks,
      the first 100 000 characters read) says that exit 2 on `Stop` "continues the conversation", and
      that `additionalContext` on `Stop` is "feedback that continues the conversation". The quiet way
      it gives, `additionalContext` on `UserPromptSubmit`, "doesn''t appear as a chat message in the interface".
      The person chose instead that `case-guppi` weighs each `error` lesson of the session that has no
      mark while it builds a Case. Where the Case fixes the cause, `case-guppi` puts `{addresses:<slug>}`
      on a decision line of its `ratification`. The person sees the mark and ratifies it with the Case,
      and the main agent copies it into the reply that acknowledges the ratification, above the Frontier.
      The rule that governs the choice is the one rule of `ratification.md`: nothing changes without a
      ratified decision. A mark changes which Case the lesson entry names in `addressed_by`, so the person
      signs it in the Case. The person also chose that the hold of a lesson written after a Case (case
      682.1) leaves out a `knowledge` lesson. That is a second promise with its own Estimate, so the Case
      splits: 915.1 removes the reminder, 915.2 gives `case-guppi` the judgment, and 915.3 narrows the
      hold.


      A line with the mark lands today. `off_store` of `.guppi/guppi/ledger.py` removes `{addresses:...}`
      by `ADDRESSES_MARK` from both the fresh line and the stored lines, which it reads by `fence_ledger_lines`
      of `.guppi/guppi/casecheck.py`, before it compares them. So no reader needs an old form. The kind
      of a lesson is read by `parse_line` of `.guppi/guppi/materialize.py`, which gives a lesson record
      its `kind`, `error` or `knowledge`. A Grep of `.guppi/guppi/` for `"error"|"knowledge"|== .error|lesson\[error`
      printed `materialize.py` and `sprint_close.py`. The second judges the `kind` of a lesson page, not
      of a ledger line. So the hold reads `record["kind"]` of the same parse and adds no second copy.
      A Grep of `.guppi/` for `unlinked_lessons|reminder|addresses`, `test_ledger.py` left out, printed
      `test_onward.py`, `casecheck.py`, `test_materialize.py`, `ledger.py`, `onward.py` and `materialize.py`.
      A Grep of `.guppi/` for `unlinked_lessons` printed only `ledger.py`, in `unaddressed` and its docstring,
      `materialize.py`, its definition, and two tests of `test_ledger.py`, so 915.1 removes it with them.


      A Grep of `vault/wiki/` for `reminder|has no mark|lesson with no mark`, `log.md` and `brief.md`
      left out, printed `orchestration.md`, `rules/rule-orchestration.md`, `rules/rule-prespec-onward.md`,
      `estimates/estimate-ledger-write-asks-for-the-mark-of-a-lesson.md`, `estimates/estimate-ledger-write-reminds-of-the-mark-on-a-decision-line.md`
      and `estimates/estimate-prespec-onward-sends-the-agent-on.md`. The same Grep of `.claude/` printed
      nothing. The hits in `orchestration.md` and `rule-orchestration.md` under the example Case 7 speak
      of a booking reminder and stand. The sentence of `rule-orchestration` on the reply that answers
      the reminder, and the three places in the Purpose of `rule-prespec-onward`, change in 915.1. The
      Criterion of `estimate-prespec-onward-sends-the-agent-on` stands. `guppi onward --plan` judges a
      refusal of the ledger hook by its command through `sent_back_last`, never by its text. The Criterion
      names the reminder only as one kind of such a refusal, and replacing it whole would sign the same
      promise again. The tests of `.guppi/tests/test_onward.py` that feed a hand-made reminder text stand
      for the same reason. The sentence of `ratification.md` (`rule-ratification`) on `{addresses:<lesson
      slug>}` sets only the form of the mark and stays true. The slug `estimate-ledger-write-reminds-of-the-mark-on-a-decision-line`
      stays as it is: 915.1 replaces its Criterion and `purpose`, which now say that the hook reminds
      of nothing, and a rename would change its links in the middle of the readings of this session. The
      sentence of `rule-orchestration` around its pair, read whole under `## Writing the ledger lines`,
      keeps the hold of a decision line off the stored Case and the readings, and drops only the reply
      that answers the reminder. A Grep of `case-913.md` and `case-914.md` under `cases/` for `rule-ledger-write|rule-orchestration|rule-case-build|rule-prespec-onward|ledger\.py|onward\.py`
      printed nothing, so no other Case of the session writes into the pages of this Case.


      A Grep of `.guppi/tests/` for `case-guppi\.md|orchestration\.md|rule-ledger-write|rule-case-build|rule-orchestration`
      printed `test_gate.py`, `test_guppi_package.py`, `test_ledger.py`, `test_onward.py` and `test_orchestration.py`.
      Only `test_orchestration.py` reads a live file, `vault/wiki/orchestration.md`. It reads only the
      blocks tagged `showing` and `defer`, which this Case does not touch. The code changes in Work Mode
      of this session. `.claude/agents/case-guppi.md` and `orchestration.md` change at the librarian''s
      render after it, so for the rest of this session nothing asks about a lesson. A lesson written after
      `case-guppi` built a Case, and before that Case is ratified, is not weighed against it. The person
      accepted that cost in the round.'
    problem: The ledger hook asks the same question about a lesson with no mark after every ratification,
      and each time it costs one more reply in the chat. It asks about `knowledge` lessons too, though
      no Case fixes the cause of a fact.
    recommend: "- **How often should the hook ask about a lesson with no mark?**\n  - Recommended: (a)\
      \ once a lesson, at the first ratification after it, judged from the session's ledger.\n  - Answer:\
      \ none of the options; a later Case may still fix the lesson, only an error lesson needs the judgment\
      \ and a knowledge lesson none, and the question should be quiet or answered inside the reply that\
      \ holds the Frontier; replaced by **Where should the question about an error lesson with no mark\
      \ reach the agent?**\n- **Where should the question about an error lesson with no mark reach the\
      \ agent?**\n  - Recommended: (b) the Case answers it when it is built: `case-guppi` weighs each\
      \ open error lesson and writes the mark on its own ledger lines, which the person ratifies.\n  -\
      \ Answer: agreed, (b).\n- **Which lessons does the question cover?**\n  - Recommended: (a) error\
      \ lessons only, for the new question and for the hold of a lesson written after a Case.\n  - Answer:\
      \ agreed, (a).\n- **Change**\n  - Asked: the person agreed with the fixes that `/pre-spec` proposed:\
      \ the new text of `rule-case-build` names only a lesson that stands before the decision lines of\
      \ a reply, and reads the ledger by a Grep for `lesson\\[error\\]` and a Grep for `\\{addresses:`;\
      \ the pair of `rule-prespec-onward` keeps the pointer to case 688.7; the `then` of 915.1 names the\
      \ new Render of `rule-orchestration` in the Spec.\n  - Taken: each fix as proposed; the `method`\
      \ of `estimate-ledger-write-reminds-of-the-mark-on-a-decision-line` adds the reading of that Render\
      \ at Retro."
