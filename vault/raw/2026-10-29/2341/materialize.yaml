      prints each path of `--paths` by `print(governs, file=stdout)`, and `main` of `.guppi/guppi/cli.py`
      sets only the encoding of the output, to UTF-8. On Windows the output of Python ends each line with
      a carriage return and a line feed. The shell keeps the carriage return on each path. `case-guppi`
      read the run at its source, the saved chat of the librarian of session 1930 (`subagents/agent-a9b114d335b9583a3.jsonl`
      under `7f200512-38a4-43be-9723-2cbf3756ed67`): the command as written printed `Exit code 128` and
      `fatal: pathspec ''.claude/agents/ask-guppi.md?'' did not match any files`, and the next call ran
      the same command with `| tr -d ''\\r''` after `--paths`. The report of that run, the last message
      of the main chat, says the same. `estimate-close-commits` was read `passed` at the /hi of this session
      from the end state alone: one separate commit and a clean tree. Its tests in `.guppi/tests/test_render.py`
      call `render.run` with an in-memory stream and split its output into lines, so they never see a
      line ending. The Python documentation of `io` (https://docs.python.org/3/library/io.html) says that
      on output `newline=None` translates each line feed to `os.linesep`, that `''''` or `''\n''` translates
      nothing, and that `reconfigure` may change `newline` on a stream that nothing was read from. The
      person chose to fix the output of `--paths` alone, at its source (Q1): a Grep `\$\(uv run[^)]*guppi`
      over the repository outside `vault/raw/` printed `vault/wiki/rules/rule-close.md`, `.claude/agents/librarian-guppi.md`,
