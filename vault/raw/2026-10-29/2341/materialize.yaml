  case_text:
    given: '`rule-orchestration`: renders `vault/wiki/orchestration.md`, which sets what the main agent
      does with an `**Other Case:**` line.

      **＋** `estimate-orchestration-passes-a-change-to-an-item-not-built`: the new check.

      **＋** `estimate-orchestration-shows-the-built-case`: its `method` names the line it waits for.

      **＋** `estimate-orchestration-signs-items-taken-together`: its `method` names the line it waits
      for.

      **＋** `raw/<date>/<hi HHMM>/frontier.md`: the Frontier, whose item the line names.'
    when: In Plan Mode, with `vault/wiki/orchestration.md` rendered from `rule-orchestration`, the summary
      of `case-guppi` carries, under the item of a Case, a line `**Other Case:**` that names an item of
      `raw/<date>/<hi HHMM>/frontier.md` by its id, an item that no Case of the session has built, and
      the change that item's Case needs.
    then: 'The main agent shows the Case as it stands, asks the person no question on the line, and sends
      no built Case back for it, in a batch too.

      **＋** When the person takes up the named item later, the prompt that dispatches its `case-guppi`
      names the Case that wrote the line, as a related Case, and the change the line names.

      **＋** When the person took up the named item in the same batch as the Case whose line names it,
      so that the `case-guppi` of the item is already out, the main agent sends the change to that `case-guppi`
      by `SendMessage`, and its Case stays in the batch.

      **＋** When the line of the named item in `raw/<date>/<hi HHMM>/frontier.md` closes with no Case
      of its own — put off, kept, closed as work, or its built Case dropped — the main agent, in the turn
      that closes it, sends the change by `SendMessage` to the `case-guppi` of the Case that wrote the
      line, with no question to the person.

      **＋** That Case is shown again when its `case-guppi` answers, in a batch while another Case of the
      session is out, and the person agrees or not at that showing.

      **－** When the Case that wrote the line is dropped or taken back before the item is taken up, the
      main agent passes the change to nobody.

      **－** A line `**Other Case:**` that names a Case of the session is handled as before.'
    context: 'When `case-guppi` builds a Case and finds that part of the work belongs to another Case,
      it writes a line `**Other Case:**` in its summary, and the main agent sends that other Case back
      with the change. `vault/wiki/orchestration.md` (`rule-orchestration`, `## Who builds a Case`) and
      `.claude/agents/case-guppi.md` (`rule-case-build`) set the line only for another Case of the session.
      In session 1930 the summary of Case 902 carried such a line that named Frontier item C7, which had
      no Case yet: the person had chosen in a round of 902 to leave the retirement of the defer of `decision-case-885`
      on `estimate-close-commits` to the Case of C7 (`vault/raw/2026-10-29/1930/cases/note-902.md`). No
      rule said what to do with it. The handoff of session 1930 says that the main agent showed 902 as
      it stood and passed the change into the prompt that later dispatched Case 903. The brief adds that
      the `method` of `estimate-orchestration-signs-items-taken-together` does not say whether such a
      line is the event it waits for.


      The person chose that the main agent keeps the change for the Case of the named item and puts it
      into the prompt that dispatches that item''s `case-guppi`, so the person still chooses the order
      of the items, as the Frontier passage of `rule-orchestration` sets it: the reply ends with the question
      which open item is next. When the item ends with no Case of its own, the change goes back to the
      Case that wrote the line, with no question, and the person agrees or not at its showing, as for
      a line that names a Case (case 872.3). The two sides fail apart, so the Case splits: 916.1 sets
      what the main agent does on `rule-orchestration` with a new Estimate, and 916.2 sets the line and
      the dispatch prompt on `rule-case-build` with a new Estimate. 916.1 also sets the `method` of the
      two waiting Estimates of `rule-orchestration` to a line that names a Case of the session. That keeps
      the event each one waits for: the rule of case 781 on a part of a `method` that opens with `after`
      and names its event before a colon holds for both new texts. A Case taken back whole after it took
      the change puts its pages into `backlog.md` by the take-back of `rule-orchestration`; this Case
      adds nothing there.


      A Grep of `vault/wiki/` (Decision pages left out by the hook) and `.claude/` for `Other Case` printed
      `brief.md`, `orchestration.md`, `log.md`, `rules/rule-case-build.md`, `rules/rule-orchestration.md`,
      `estimates/estimate-orchestration-shows-the-built-case.md`, `estimates/estimate-orchestration-signs-items-taken-together.md`,
      `estimates/estimate-case-build-writes-the-case.md`, `estimates/estimate-case-build-reads-no-sibling-file-mid-send.md`,
      `insights/insight-subagents-read-a-sibling-mid-flight.md` and `.claude/agents/case-guppi.md`. The
      Criteria of `estimate-orchestration-shows-the-built-case` and `estimate-orchestration-signs-items-taken-together`
      speak of the other Case a line names and stay true for a line that names a Case of the session,
      so they stand, and only their `method` changes. The same holds for the Criterion of `estimate-case-build-writes-the-case`,
      whose line names another Case of the session, and for `estimate-case-build-reads-no-sibling-file-mid-send`
      and the insight, which speak of Cases built at the same time. The sentence of `rule-orchestration`
      on a batch (case 872.5) sends back the other Case a line names, and the description of the summary
      under `## Who builds a Case` sets the line only for another Case of the session; `/pre-spec` found
      both narrow (findings 1.3 and 1.4), and 916.1 widens each to the Case of a Frontier item that no
      Case of the session has built. When the person takes that item up in the same batch as the Case
      whose line names it, the `case-guppi` of the item is already out and its prompt has gone, so the
      change goes to that `case-guppi` by `SendMessage`, as the person agreed at `/pre-spec`. Line 23
      of the Criterion of `estimate-orchestration-signs-items-taken-together` speaks of the other Case
      a line names; it stands, since its `method` now waits for a line that names a Case of the session,
      and the new Estimate checks a line that names an item, in a batch too. The Criterion of `estimate-orchestration-names-related-cases-in-the-dispatch`
      sets which Cases are related by the pages they change or the moment they act at, and what the prompt
      holds for each (finding 2.3). The new clause names the Case that wrote the line in the prompt, with
      the change, even where it changes no page the item names. That Criterion only says that such a Case
      need not stand in the prompt, and its last `－` line holds only when no Case of the session is related.
      It lists what the prompt holds and forbids nothing more, so it stands, and `estimate-orchestration-passes-a-change-to-an-item-not-built`
      checks the change in the prompt.


      A Grep of `.guppi/tests/` for `orchestration\.md|case-guppi\.md|rule-orchestration|rule-case-build|signs-items-taken-together|shows-the-built-case`
      printed `test_onward.py`, `test_guppi_package.py` and `test_orchestration.py`. Only `test_orchestration.py`
      reads a live file, `vault/wiki/orchestration.md`, and it reads only the blocks tagged `showing`
      and `defer`, which this Case does not touch. A Grep of `.guppi/guppi/` for `Other Case` printed
      nothing, so no code judges the line. Case 915 of this session changes `rule-orchestration` under
      `## Writing the ledger lines` and `rule-case-build` after the sentence that ends with case 784;
      this Case changes other sentences, at the dispatch and the showing of a Case, so the two do not
      meet. The Glob `vault/wiki/estimates/estimate-*item-not-built*.md` printed nothing, so both new
      slugs are free. Both files change at the librarian''s render after this session, so for the rest
      of the session the main agent works by the text that stands.'
