- case: '918.3'
  decision: decision-case-918.3
  origin: raw/2026-10-29/2341/ledger.md#case-918.3
  targets:
  - kind: update
    category: estimates
    slug: estimate-python-utf8-output-intact
    ref: rule-python-utf8
  tags: []
  case_text:
    given: '`estimate-python-utf8-output-intact`: its Criterion is replaced whole.

      **＋** `rule-python-utf8`: the key `PYTHONUTF8` of the settings.

      **＋** `rule-settings`: renders `.claude/settings.json`.

      **＋** `.claude/settings.json`: the settings, their `env` and their hooks.

      **＋** `estimate-clean-branch-ships-neutral-texts`: constrains the texts of a shipped Estimate.'
    when: 'A session starts with `.claude/settings.json` as `uv run --project .guppi guppi render` wrote
      it from `rule-settings`, and the agent runs a Python script through the Bash tool, with no encoding
      set in the command, that prints a dash and a character outside the code page of the locale.

      **＋** The hooks of `.claude/settings.json` run in the same session.'
    then: '`.claude/settings.json` carries `"PYTHONUTF8": "1"` under `env`, the text of `rule-python-utf8`.

      **＋** The script runs in UTF-8 mode, and the dash reaches the agent in the output of the Bash tool
