      those that do. Both target rules, `rule-sprint-close` and `rule-event-log`, carry `core: true`,
      so both Estimates ship. The Criterion of `estimate-clean-branch-ships-neutral-texts` stands, since
      this Case changes texts it judges and not the promise.


      The person chose to replace the Criterion of each Estimate whole, with the one line changed to `vault/.gitignore`,
      and to fix the docstring. The two Estimates fail apart and need different readings, so the Case
      splits: 917.1 covers the close and 917.2 the event log. Each Estimate goes `pending` and is read
      at the Retro of this session. Its rule goes `draft` at the librarian''s cascade until that reading
      passes, so `guppi ship` without `--allow-draft` refuses until then. The `method` of `estimate-event-log-records`
      asked for a `/hi` by hand in plan mode and one outside it, which wait for another session, and the
      check of this file refused it. The person chose to drop those two readings. The tests `test_plan_mode_hi_writes_the_line`
      and `test_plan_mode_hi_outside_it_is_refused` of `.guppi/tests/test_event.py` feed made-up `/hi`
      payloads in plan mode and in each other mode. A live payload with its mode was read once, at the
      reading the page''s Result records, and is not read again. The new `method` keeps the tests and
      the ignore and timing readings by hand, all at the Retro of this session. The `purpose` of `estimate-sprint-close-moves-old-event-logs`
      speaks of logs kept outside git and names no file, so it stands. `estimate-event-log-records` has
      no `purpose` field: a Grep of its page for `^purpose:` printed nothing, and this Case adds none.


      A Grep of `vault/wiki/` for `\.gitignore`, with `brief.md` and `log.md` left out, printed `rules/rule-clean-branch.md`,
