- case: '918.1'
  decision: decision-case-918.1
  origin: raw/2026-10-29/2341/ledger.md#case-918.1
  targets:
  - kind: update
    category: estimates
    slug: estimate-case-build-records-the-rounds-in-recommend
    ref: rule-case-build
  tags: []
  case_text:
    given: '`estimate-case-build-records-the-rounds-in-recommend`: its Criterion is replaced whole.

      **＋** `rule-case-build`: renders `.claude/agents/case-guppi.md`, the agent that builds a Case.

      **＋** `rule-case-protocol`: renders `vault/wiki/case-schema.md`, the form of a Case.

      **＋** `raw/<date>/<hi HHMM>/cases/case-<N>.md`: the file of a Case.

      **＋** `estimate-case-check-requires-each-question-of-the-rounds`: the check of a question title
      with no item.

      **＋** `estimate-clean-branch-ships-neutral-texts`: constrains the texts of a shipped Estimate.'
    when: '`case-guppi` writes a Case into `raw/<date>/<hi HHMM>/cases/case-<N>.md`, with `.claude/agents/case-guppi.md`
      rendered from `rule-case-build` and `vault/wiki/case-schema.md` rendered from `rule-case-protocol`.'
    then: 'The `recommend` of the Case is a list with one item per question of the rounds of `case-guppi`
      on the Case: the item''s first line is the title of the question in bold as the round wrote it,
      with a sub-item `Recommended:` with what the agent recommended and a sub-item `Answer:` with the
      person''s answer in the language of the repository, both as they stood when the person answered
      that question.

      **＋** A later question that replaced an earlier one is an item of its own, and the earlier item
      keeps its own recommendation and answer.

      **＋** A question asked in more than one round is one item, with the recommendation and the answer
      of the last round in which the person answered it.

      **＋** A question the person left unanswered is asked again in the next round under the same title;
      a question never answered has one item, whose `Answer:` sub-item says it was not answered and names
      the later question that replaced it, if one did.

      **＋** A change the person asked for on a shown Case is an item whose first line is `**Change**`,
      with a line `Asked:` and a line `Taken:` that says how the Case took it.

      **＋** A Case built with no round has one item: a line `Recommended:` and the line `Answer: ratified
      as built`.

      **＋** An item whose answer changed only one sub-case stands in the parent''s `recommend` or in a
      `recommend` under that sub-case''s heading; every other item stands in the parent''s `recommend`.

      **＋** A Case with sub-cases carries `problem` on the parent only.

      **－** No item quotes the person''s words word for word.

      **－** The promise of `estimate-case-check-requires-each-question-of-the-rounds` stands: each question
      title of the rounds has an item.'
    context: '`guppi ship` copies into the clean version each `passed` Estimate whose target page it ships,
      its Criterion as it stands here (the Purpose of `rule-clean-branch`). The `/hi` reading of `estimate-clean-branch-ships-neutral-texts`
      in session 1930 listed Criterion sentences that hold only in the repository of GUPPI, for a Case
      of a later session to rewrite, and the handoff of session 1930 names those that remain. This Case
      takes Frontier item C3. The Criterion of `estimate-clean-branch-ships-neutral-texts` is the rule
      that governs these texts: no sentence of the `purpose` or `method` of a shipped Estimate may hold
