- case: '974'
  decision: decision-case-974
  origin: raw/2026-10-31/2307/ledger.md#case-974
  targets:
  - kind: update
    category: rules
    slug: rule-case-build
    ref: rule-case-build
  - kind: create
    category: estimates
    slug: estimate-case-build-reads-the-readers-of-a-new-files-folder
    ref: rule-case-build
  - kind: update
    category: insights
    slug: insight-case-build-changes-a-step-without-reading-its-readers
    ref: insight-case-build-changes-a-step-without-reading-its-readers
  tags:
  - session
  - workflow
  - harness
  - case-build
  case_text:
    context: 'When `case-guppi` builds a Case that changes what a step writes, the Render of `rule-case-build`
      makes it search the rules and `.claude/` for the name of that output and read each step that reads
      it (cases 924, 966). A reader that takes every file of a folder holds no word of a new file there,
      so that search misses it. `lesson-case-build-names-a-file-without-the-readers-of-its-folder`, written
      at the Retro of session 1831, records such a miss: Case 967.3 added the generated file `.guppi/links.md`,
      and the full test run failed on the test of the live code of `test_ship.py`, since the clean copy
      would carry the graph; Work Mode added the file to `LEFT_OUT` of `.guppi/guppi/ship.py`. I read
      in `.guppi/guppi/ship.py` the function `tree_files` whole, which walks a folder by `os.walk` and
      takes each file but the skipped names, `TREES`, which names the folders as bare names `.guppi` and
      `.claude`, `LEFT_OUT`, and the lines that call `tree_files` over `TREES` and drop each name of `LEFT_OUT`;
      `.guppi/.gitignore` holds `links.md`, a second reader of the folder that names the file by its bare
      name. The person chose that, for each new file that is no page of `vault/wiki/`, the builder searches
      for the path of each folder that holds it and for the calls that walk a folder, reads the ignore
      files of git there, and reads each reader that takes every file of such a folder; a page that a
      `create` adds is left out, since the schema of its category and lint set its readers. The change
      is a new sentence of the Render, after the sentence of cases 924 and 966, and that sentence stands,
      since it speaks of a reader that names the output. The rule that governs the choice is `rule-atomicity`:
      a reader that names the output and a reader that walks a folder can fail apart and need different
      fixes, so the change is checked by a new Estimate, `estimate-case-build-reads-the-readers-of-a-new-files-folder`,
      and the Criterion of `estimate-case-build-reads-the-readers-of-a-changed-step` stands with its pending
