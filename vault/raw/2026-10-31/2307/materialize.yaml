- case: '972'
  decision: decision-case-972
  origin: raw/2026-10-31/2307/ledger.md#case-972
  targets:
  - kind: create
    category: estimates
    slug: estimate-prespec-hook-reports-a-wait-off-its-form
    ref: rule-prespec-hook
  tags:
  - harness
  - workflow
  case_text:
    context: 'A reading by hand that waits for an event writes it in one form: the part of the `method`
      between two `;` opens with `after`, or with `by hand, after`, and names its event before a colon.
      `waits_for_an_event` of `.guppi/guppi/lint.py` judges that form by `EVENT_PART`, matched at the
      start of the stripped part; `waits_for_a_later_moment` and `check_unread` call it, so a `pending`
      Estimate whose `method` waits this way earns no `unread` finding, and `waits_for_another_session`
      calls it, so pre-spec lets such a part pass. A part that holds the form behind another word waits
      for nothing in either reader. The `method` of `estimate-link-graph-at-session-start-writes-the-file`
      writes `; and by hand, after the first session start whose .claude/settings.json holds the hook:
      ...`, and the `## Flags` of `vault/wiki/brief.md` report that lint reads it as a reading that does
      not wait, `unread: pending`. Pre-spec did not catch it when its Case was built: `waits_for_another_session`
      reports a part only when `ANOTHER_SESSION` finds a later session, the next session, a session after
      another, a session of a sprint, the session that closes one, the librarian or `/hi` in it, and this
      part names none of them. The person chose that the form stays one and that pre-spec reports a part
      that names its event behind another word, by a new predicate in `.guppi/guppi/lint.py` that `.guppi/guppi/prespec.py`
      imports, as `rule-one-judgment-one-implementation` sets it. The new predicate is built on `EVENT_PART`
      and on `waits_for_an_event`: a part in which `EVENT_PART` finds its form after a word boundary,
      and which `waits_for_an_event` does not accept; so `by hand, after X: ...` and `after X: ...` stay
      clean, and no second pattern of the form is written. Such a part may also name a moment of the Case''s
      own session, which `vault/wiki/case-schema.md` allows, such as the part `by hand at a Case ratified
      again ... at the reply that closes the last line under Cases after a later message of the person:
      the transcript, ...` of the `method` of `estimate-prespec-onward-reads-the-decisions-of-the-session`.
      So, at the finding of `/pre-spec` on this Case, the person chose that pre-spec prints the line as
      a note: `plan_findings` of `.guppi/guppi/prespec.py` returns the findings and the notes apart, and
      `check` prints both and exits 1 only on a finding, so a note sets no exit code and does not hold
      the exit from Plan Mode. `rule-prespec` already sets that a `note:` line is answered in one line
      in the chat; the text of the note names the two answers. The note covers the kept `method` too:
      `kept_method_waits` gives its line for an `update` that replaces the Criterion whole, writes no
      `method` and keeps the `method` of the live page, and the same `update` of `estimate-link-graph-at-session-start-writes-the-file`
      would keep its `method` with no line, so the new note reads the kept `method` of such an `update`
      by the same conditions, but for the sprint page, since a part written off the form is the same fault
      on any target. The Criterion of `estimate-prespec-hook-reports-a-kept-method-that-waits-for-another-session`
      stays true: it speaks only of the line `KEPT_WAITS`, which this Case leaves as it is, and the note
      stands beside it. I read `waits_for_an_event`, `waits_for_another_session`, `waits_for_a_later_moment`
      and `check_unread` of `.guppi/guppi/lint.py`, and `check_form`, `kept_method_waits`, `plan_findings`
      and `check` of `.guppi/guppi/prespec.py`. The reading of `estimate-link-graph-at-session-start-writes-the-file`
      was taken in this session, so that page stops being `pending` at the librarian''s run, and this
      Case does not change its `method`. A Grep of ``^method:.*[a-zA-Z0-9)`''] (by hand, )?after\b[^:;]*\S\s*:``
      over `vault/wiki/` printed seven files: `estimate-link-graph-at-session-start-writes-the-file`,
      `estimate-case-check-sends-back-a-faulty-round`, `estimate-render-harness-reproduces`, `estimate-prespec-onward-reads-the-decisions-of-the-session`,
      `estimate-hi-takes-a-conserved-spec`, `estimate-skill-pr-review-takes-a-pull-request-whole` and
      `estimate-case-build-writes-a-plain-round`, all under `vault/wiki/estimates/`. I read the `method`
      of each: the part of `estimate-skill-pr-review-takes-a-pull-request-whole` opens with `by hand,
      after` and gives no note; each of the other six holds `after ... :` in a part that does not open
      with it, and all of them but `estimate-link-graph-at-session-start-writes-the-file` are `passed`.
      The lint run does not call the predicate, so these live pages get no finding; a Case that writes
      or keeps such a `method` gets the note. The new note is checked by a new Estimate on `rule-prespec-hook`.
      Several texts state the form, and each stays true, since the form does not change. They are the
      sentence of `vault/wiki/case-schema.md` on a part that waits for an event, the Renders of `rule-brief`
      and `rule-retro`, the Criteria of `estimate-prespec-hook-reports-a-method-that-waits-for-another-session`
      and `estimate-lint-checks-the-statuses`, and the `method` field of `vault/wiki/estimates/schema.yaml`.
      The Criterion of `estimate-prespec-hook-reports-a-method-that-waits-for-another-session` says that
      a part in which `after` does not open the part still gives the line of a method that waits for another
      session; that stays true, since the new note stands beside that line and does not replace it. The
      Purpose of `rule-prespec-hook` sends the reader to the module docstring of `.guppi/guppi/prespec.py`
      for what `--check` compares, and says that a line that opens with `note:` does not block, so the
      page text is not changed and the docstring gains the new note. The lint run does not call the new
      predicate, so the classes in the docstring of `.guppi/guppi/lint.py` and the text of `rule-lint`
      stay as they are. A Grep of `[a-z,;] after\b[^":\n]*\S\s*:` over `test_prespec.py`, `test_casecheck.py`,
      `test_ratified.py` and `test_lint.py` under `.guppi/tests/` printed three files, `test_lint.py`,
      `test_prespec.py` and `test_ratified.py`; I read each hit, and none is a `method` of a plan that
      writes the form behind another word, so no test that compares the whole output of `--check` gains
      the new note. Item C8 of the Frontier, a word of a code span that lint reads as a slug, touches
      another class of lint and does not clash with this Case.'
    problem: A `method` that writes its wait for an event behind another word, such as `and by hand, after`,
      waits for nothing in lint and in pre-spec, and no check says so while the Case can still be fixed.
    recommend: "- **How the wait form is fixed**\n  - Recommended: (b) pre-spec reports the near miss\
      \ — a new predicate in `.guppi/guppi/lint.py`, imported by pre-spec, finds a part that holds the\
      \ form but does not open with it; the form stays as it is.\n  - Answer: (b).\n- **How pre-spec reports\
      \ the near miss**\n  - Recommended: (a) pre-spec prints it as a `note:` line, which sets no exit\
      \ code, and the main agent answers it in one line in the chat: rewritten into the form, or a moment\
      \ of the Case's own session that is no wait.\n  - Answer: (a)."
    given: '`estimate-prespec-hook-reports-a-wait-off-its-form`: the new check of the note pre-spec prints.

      **＋** `rule-prespec-hook`: the rule of the check of the plan, the target of the new Estimate.

      **＋** `.guppi/guppi/lint.py`: the new predicate, beside `waits_for_an_event` and `EVENT_PART`.

      **＋** `.guppi/guppi/prespec.py`: `plan_findings` gains the new note, `kept_method_waits` shares
      its reading of the kept `method`, and the module docstring names the note.

      **＋** `.guppi/tests/test_lint.py`: the test of the new predicate.

      **＋** `.guppi/tests/test_prespec.py`: the test of the new note.

      **＋** `rule-one-judgment-one-implementation`: one predicate of the form, which both modules import.'
    when: '`uv run --project .guppi guppi prespec --check <plan> --session <id>` of `.guppi/guppi/prespec.py`
      reads, in the `then` blocks of the plan file, the `method` of a `create` of an Estimate, of an `update`
      that carries `set: {method: …}`, or, for an `update` of an Estimate that replaces its Criterion
      whole, writes no `method` and sets no status `passed` or `failed`, the `method` of its live page.'
    then: 'A `method` with a part between two `;` that names an event before a colon behind another word
      — `after`, or `by hand, after`, after a word boundary but not at the start of the stripped part,
      such as `and by hand, after the first session start: the file read` — gives one note `note: case
      N: <create|update> <slug>: method names its event inside a part — open the part with after, or with
      by hand, after, or answer that it names a moment of this session`.

      **＋** For the `method` of the live page, the note reads `note: case N: update <slug>: the method
      on the page names its event inside a part —` and the same words after the dash.

      **＋** The note sets no exit code, so it does not hold the exit from Plan Mode.

      **＋** The judgment is one predicate in `.guppi/guppi/lint.py`, built on the pattern that `waits_for_an_event`
      matches by, which `.guppi/guppi/prespec.py` imports.

      **－** A part that opens with `after`, or with `by hand, after`, and names its event before a colon
      gives no such note.

      **－** A part in which `after` stands with no colon after it gives no such note.

      **－** The note does not replace the line of a `method` that waits for another session, of a `method`
      kept on the page that waits for another session, or of a `method` that names no form or that ties
      its reading to a one-off moment.

      **－** `uv run --project .guppi guppi lint` of `.guppi/guppi/lint.py` over the live Estimate pages
      gives no finding by this predicate.'
