    ref: rule-prespec-onward
  - kind: update
    category: estimates
    slug: estimate-prespec-onward-sends-the-agent-on
    ref: rule-prespec-onward
  tags: []
  case_text:
    given: '`rule-prespec-onward`: the hook that sends the agent on after `/pre-spec`; its Purpose states
      the text each of its reasons adds.

      **＋** `estimate-prespec-onward-sends-the-agent-on`: its Criterion is replaced whole.

      **＋** `estimate-prespec-onward-tells-the-loop-from-its-end`: sets the reasons the hook gives; it
      stands.

      **＋** `.guppi/guppi/onward.py`: `ONLY_THE_PERSON`, the text each reason of `--plan` adds, and the
      docstring.

      **＋** `.guppi/tests/test_onward.py`: the tests of the reasons.

      **＋** `.guppi/guppi/ledger.py`: `refusals`, by which the hook reads the refusals of the stretch.

      **＋** `.claude/settings.json`: registers the hook on `Stop`.

      **＋** `vault/wiki/orchestration.md`: the layout of a showing and of a round, which the reason points
      to.

      **＋** `rule-case-check`: the check that notes a text of the agent''s own before a showing or a round.

      **＋** `raw/<date>/<hi HHMM>/spec.md`: the Spec of the session, whose presence silences the hook.

      **＋** `raw/<date>/<hi HHMM>/frontier.md`: the Frontier, whose open lines under `## Cases` silence
      the hook.'
    when: The `Stop` hook `uv run --project .guppi guppi onward --plan` receives the payload of the end
      of a reply of the main agent.
    then: 'It exits 2 when all of these hold: the event log of the session''s window holds a `hi` of this
      session and, after it, a `prespec` line of this session; `raw/<date>/<hi HHMM>/spec.md` does not
      stand; `raw/<date>/<hi HHMM>/frontier.md` holds no open line under `## Cases`; the reply carries
      a `LEDGER` block, or a refusal of the ledger hook in the stretch follows the reply of the main agent
      that ended just before it; its own refusal is not spent; and the reply does not open with `STOP:`.

      **＋** The stretch is the records of the transcript at `transcript_path` after the last `user` record
      whose `origin.kind` is `human`. A refusal of a `Stop` hook is a `user` record marked `isMeta` whose
      text opens with `Stop hook feedback:` and holds a line that opens with `[<command>]: `. Its own
      command is `uv run --project .guppi guppi onward --plan`, and the command of the ledger hook is
      `uv run --project .guppi guppi ledger`.

      **＋** Its own refusal is spent when its last refusal stands in the stretch and no refusal of the
      ledger hook follows the same reply of the agent or a later one, judged by `refusals` of `.guppi/guppi/ledger.py`.
      So after a reply that the ledger hook sent back — a line it refused or held, or its reminder of
      a lesson with no mark — it sends the agent on again at the end of the next reply: the one that writes
      a line again, or an answer with no `LEDGER` block, such as the answer that no Case fixed the cause
      of the lesson.

      **＋** A refusal of another `Stop` hook in the stretch neither silences it nor sends it on again,
      and neither does `stop_hook_active`.

      **＋** Its reason on stderr sends the agent on with the Cases still out, to the check and the exit,
      or on with the loop after the findings of `/pre-spec`, as `estimate-prespec-onward-tells-the-loop-from-its-end`
      sets it.

      **＋** Each reason adds that, when only the person can go on — a question the person must answer,
      or a Case that waits only for the person''s word — the agent opens with `STOP:` a reply that carries
      a `LEDGER` block, or that answers a reply the ledger hook sent back, and asks the person instead;
      that a reply that shows a Case or a round of `case-guppi` carries no `LEDGER` block and opens with
      no `STOP:` line, in the layout `vault/wiki/orchestration.md` sets; and that while a `case-guppi`
      has not answered the agent ends the turn as `vault/wiki/orchestration.md` sets it for a Case out
