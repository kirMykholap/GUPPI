  sections:
    Criterion: 'When:

      The person invokes `/hi` of `rule-skill-hi`. The agent assembles the Frontier from `vault/wiki/sprint.md`,
      `vault/wiki/brief.md`, `vault/wiki/backlog.md`, the output of the skill''s commands and, in the
      session that opens a sprint, the case file `raw/<date>/<hi HHMM>/cases/case-<N>.md` of the opening
      Case, and closes its lines in Plan Mode.


      Then:

      The Frontier is written to `raw/<date>/<hi HHMM>/frontier.md` in the lists `## Cases`, with lines
      `- [ ] C<n> — <title> · <source>`, `## Work`, with lines `- [ ] W<n> — <title> · <source>`, and
      `## Ask`, with lines `` - [ ] A<n> — `<slug>` — <question> · brief ``. The title of a line of the
      current milestone or of the backlog opens with the slug of each of its pages in a code span.

      **＋** The kind comes from the source. Cases: first, when the first line of the `Cases` of the brief''s
      Next session opens with `open the next sprint`, that line, closed `[x] … · case N` by the opening
      Case of `/sprint-open`; then, on a plan branch, the unfinished plan and each conserved Spec of `vault/wiki/backlog.md`,
      with the source `backlog`; then the items of the current milestone of `vault/wiki/sprint.md`, or,
      while that opening line stands, the items of the first milestone that the `create` of `entity-sprint-<id>`
      writes under `## Milestones` in the case file of the opening Case, with the source `sprint`; the
      `Cases` list of the brief''s Next session; a hand edit shown by `Render:`; a `failed` reading or
      a lesson of the ledger''s Tail; an item the person adds. Work: the `Work` list of the brief''s Next
      session; a dirty tree by `git status`. Ask: the `Ask the person` list of the brief''s Next session.

      **＋** A line of the `Cases` of the brief''s Next session that names the same item as a line of the
      current milestone makes no line of its own. The milestone line stands as the sprint page, or the
      opening Case, gives it, with the source `sprint` alone. The agent judges the sameness by meaning,
      with no page opened.

      **＋** The other items of the backlog are not lines. `## Cases` ends with the line `Backlog: N items`,
      where N is the count in `vault/wiki/backlog.md`. Under a Cases line, an indented line `- near` names
      by slug each backlog item whose `purpose` is near that line in meaning. The agent judges this from
      the loaded file, with no `ask-guppi`. An item the person brings onto the Frontier becomes a Cases
      line with the source `backlog`.

      **＋** A line closes by appending the closer and keeping the source. An item ended closes `[x] …
      · case N` when a decision line of Case N ends it, as `vault/wiki/orchestration.md` sets it, or `[x]
      … · work` when done with no decision. A line of the sprint page left for a later session closes
      `[-] … · sprint · defer`. An item of the backlog left as it stands closes `[-] … · backlog · kept`.
      A decision of any other source put off closes `[-] … · defer case N`. An item closed `defer` or
      `kept` gets no short Case and no ledger line of its own, but for the short Case of a take-back of
      a ratified Case, as `vault/wiki/orchestration.md` sets it. A Case built on that item and ratified
      keeps its decision lines, and a sprint item never closes `· defer case N`.

      **＋** Only the current milestone gives items. A later milestone and Closed give none, and the sprint
      page''s Backlog reaches the Frontier only through the backlog. A decision line of the Tail is not
      an item.

      **＋** When the first reply of `/hi` shows the Frontier, the Cases are shown as a checklist. Each
      line stands as `raw/<date>/<hi HHMM>/frontier.md` holds it, with its detail on an indented line
      under it and the `- near` line under that, and the line `Backlog: N items` comes last. The Work
      is shown as one block. Only Cases are cut into sub-cases. A `W` that turns out to need a decision
      closes `· case N`, and a `C` that needs none closes `· work`.

      **－** While the first line of the `Cases` of the brief''s Next session opens with `open the next
      sprint`, no conserved Spec and no item of `vault/wiki/sprint.md` is a Cases line, and each conserved
      Spec stays in `vault/wiki/backlog.md`.

      **－** At `/hi` no Case stands in the chat as a bold line, and no Case has its detail as a paragraph.

      **－** `/pre-spec` finds an open line under `## Cases`. A `W` or an `A` line stands open until its
      work is done and closes `· work` where that work is done: at `/hi`, in Work Mode or at Retro. Claude
      Code''s plan mode does not stop the agent from writing `raw/<date>/<hi HHMM>/frontier.md`.'
  applied: '21:39:04'
