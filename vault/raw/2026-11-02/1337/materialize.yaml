- case: '1002'
  decision: decision-case-1002
  origin: raw/2026-11-02/1337/ledger.md#case-1002
  targets:
  - kind: update
    category: rules
    slug: rule-orchestration
    ref: rule-orchestration
  - kind: update
    category: estimates
    slug: estimate-orchestration-acknowledging-reply
    ref: rule-orchestration
  tags: []
  case_text:
    context: 'After the person ratifies a Case, the main agent writes a reply that acknowledges it, in
      the form that `vault/wiki/orchestration.md` sets. That text names each part of the reply by its
      English words in a code span or in bold: the heading `## Case N — ratified`, the labels `Changes:`
      and `Notes:`, and the heading `## Frontier`. It then tells the agent to translate each one. In session
      2227 the agent kept the labels and `## Frontier` in English. Case 997 rewrote the text so that it
      says first that each heading and label is translated. In session 0254 the agent translated the labels
      but still kept `## Frontier` in English. So `estimate-orchestration-acknowledging-reply` stands
      `failed`, and its Result says that the heading `## Frontier` stood in English. Both lessons, `lesson-acknowledging-reply-labels-left-in-english`
      and `lesson-orchestration-acknowledging-reply-leaves-the-frontier-heading-untranslated`, give the
      same cause, and `insight-orchestration-acknowledging-reply-keeps-headings-in-english` joins them:
      the agent copies an English name in a code span as a literal. The person chose to remove that literal.
      The text of `rule-orchestration` now names each heading and label of the reply by what it says,
      in the acknowledging reply and in each other reply that shows the Frontier, and gives no English
      word to copy. The bracket of the first sentence of `## The acknowledging reply` points to this Case,
      as `case-schema.md` sets it for the new text of a page with `core: true`.


      The promise does not change. The Criterion of `estimate-orchestration-acknowledging-reply` already
      says that each heading and label stands in the language of the chat, and that the English words
      in the Criterion only name the parts, so its Criterion stands. Its `method` waits for the render
      that wrote the text of Case 997, and that render has already happened. Its new `method` waits for
      the render of this text. The Estimate stays `failed` until a reading after that render, and that
      reading checks this Case. In the same way, the brief of the librarian of session 0254 reports `guppi
      check` under Flags: `status: a page with core: true that is draft` on `rule-orchestration` and `rule-skill-approve-spec`,
      and `unread: failed` on `estimate-orchestration-acknowledging-reply`. Those lines stay until that
      reading passes, in a later session. The insight stays `open`, since no reading has yet shown that
      the fix holds.


