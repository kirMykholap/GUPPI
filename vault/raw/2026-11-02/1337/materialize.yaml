  change: the Criterion replaced whole — guppi check takes --exit-zero; purpose and method name it
  sections:
    Criterion: 'When:

      Someone runs `uv run --project .guppi guppi check` in a project: by hand, in the librarian''s run
      of `.claude/agents/librarian-guppi.md`, or in the job `lint` of `.github/workflows/checks.yml`.

      **＋** Or `.claude/skills/work/SKILL.md` runs it with `--exit-zero` as it loads.

      **＋** Or `.guppi/tests/test_check.py` runs it in a temporary project whose steps record each call:
      once with the step `guppi backlog --check` failing, once with every step exiting 0, once with no
      module `.guppi/guppi/ship.py`, and with `--exit-zero` with a step failing.


      Then:

      It runs `guppi render --check`, `guppi sprint --check`, `guppi backlog --check`, `guppi glossary
      --check`, `guppi lint` and `guppi ship --check`, in that order, whether an earlier step exited 0
      or not.

      **＋** Each step prints its own lines as it does when it runs alone, so a red step hides no finding
      of a later step.

      **＋** Without `--exit-zero`, it exits non-zero when any step exits non-zero, and 0 only when every
      step exits 0.

      **＋** With `--exit-zero`, it prints the same lines, then one last line `exit code: <n>`, where n
      is the exit code of the run without the flag, and it exits 0.

      **＋** `guppi check` takes the flag and writes that last line by the function of `.guppi/guppi/commands.py`
      that `guppi test` and `guppi style` use, and holds no copy of it.

      **＋** No live rule, entity or Estimate outside History and Result, and no file of `.claude/`, names
      make with the target `lint` as the way to run the vault checks.

      **－** Where the module `.guppi/guppi/ship.py` is missing, as in a project that installed GUPPI,
      it runs the other five steps and prints one line that it skips `guppi ship --check`, and that skip
      sets no exit code.

      **－** No step reads the stdin of its caller, and it writes nothing to the tree.'
