  - kind: update
    category: estimates
    slug: estimate-work-mode-runs-the-spec-on-a-branch-from-a-baseline
    ref: rule-work-mode
  tags: []
  case_text:
    given: '`rule-work-mode`: the Rule page whose Render is `.claude/skills/work/SKILL.md`.

      **＋** `.claude/skills/work/SKILL.md`: the skill `/work`, whose lines Tests and Lint run their commands
      with `--exit-zero`.

      **＋** `estimate-work-mode-runs-the-spec-on-a-branch-from-a-baseline`: its Criterion is replaced
      whole.

      **＋** `.guppi/guppi/commands.py` and `.guppi/guppi/check.py`: `guppi test` and `guppi check`, which
      take the flag.

      **＋** `vault/wiki/where-to-stop.md`: the conditions on which the run stops.

      **＋** `rule-spec-box`: `/box`, which calls `/work` with the folder `vault/raw/<date>/<HHMM>/` of
      a conserved Spec.

      **＋** `rule-prespec-onward`: the hook that sends the agent on until `spec.md` stands.

      **＋** `/retro`: the skill that `/work` calls at its end and that fixes or reverts a new failing
      test.

      **＋** `raw/<date>/<hi HHMM>/spec.md`, `raw/<date>/<hi HHMM>/work.md` and `raw/<date>/<hi HHMM>/handoff.md`:
      the Spec, the baseline and the handoff of the session.'
    when: 'The agent calls `/work` on `PreToolUse Skill` after the person picked it at the fork of `ExitPlanMode`,
      or the person types `/work` on `UserPromptSubmit`, after `uv run --project .guppi guppi render`
      wrote `.claude/skills/work/SKILL.md` from `rule-work-mode`.

      **＋** Or `/box` calls `/work` with the folder `vault/raw/<date>/<HHMM>/` of a conserved Spec.

      **＋** Or, while the run of `/work` goes on, the person ratifies a Case built in Work Mode.'
    then: '`uv run --project .guppi guppi render --check` exits 0: `.claude/skills/work/SKILL.md` equals
      the Render of `rule-work-mode`.

      **＋** The skill loads while `uv run --project .guppi guppi check` or `uv run --project .guppi guppi
      test` finds something: its lines Tests and Lint run both commands with `--exit-zero`, and each line
      comes back with the output of its command and a last line that names the exit code of its run.

      **＋** On the branch `main` the skill stops and says so, and nothing is written or changed.

      **＋** On another branch, before the first change, the agent writes `raw/<date>/<hi HHMM>/work.md`:
      under `## Baseline` the exit code of `uv run --project .guppi guppi test` and of `uv run --project
      .guppi guppi check`, as the last line of Tests and of Lint names it, with each failing test and
      each lint finding line as printed, and an empty `## Expected red`.

      **＋** When `work.md` already stands, its `## Baseline` stays as it is.

      **＋** The agent runs the tasks of `raw/<date>/<hi HHMM>/spec.md` in the order the Spec holds them,
      and ticks each box of code, a test, a migration or a `by hand` check in the reply that finishes
      the task; a task line that opens with a code span holding `guppi sprint-close` it neither runs nor
      ticks, since the librarian runs it.

      **＋** The reply that acknowledges a Case ratified in Work Mode ends the turn, since the hook of
      `rule-prespec-onward` sends nothing on once `raw/<date>/<hi HHMM>/spec.md` stands; at the person''s
      next message the run goes on from where it stopped.

      **＋** After the reply that acknowledges a Case ratified in Work Mode, and before the first task
      of that Case, the agent runs `uv run --project .guppi guppi prespec --check` on the plan file of
      the session, with the session id of its `hi:` line.

      **＋** When that check prints a line that does not open with `note:`, the agent stops as the first
      condition of `vault/wiki/where-to-stop.md` sets it and sends the finding to the `case-guppi` of
      that Case; the run goes on after the person ratifies the fixed Case and the check prints no such
      line.

      **＋** A task of that Case whose work already stands, done under the sub-case the Case replaces,
      is ticked in `raw/<date>/<hi HHMM>/spec.md` and not run again.

      **＋** A task that changes `uv run --project .guppi guppi check`, one of its steps or a hook of the
      working tree that reads a page or a governed file the same Spec updates adds one line under `##
      Expected red` in the same reply: the check, and the page or file it waits for.

      **＋** When the last task of `raw/<date>/<hi HHMM>/spec.md` is done, before the Work readings, the
      agent runs `uv run --project .guppi guppi test` in full and holds each failing test against `##
      Baseline` of `raw/<date>/<hi HHMM>/work.md`.

      **＋** A failing test that `## Baseline` holds goes on, and a new one whose fix finishes ratified
      work is fixed.

      **＋** With a folder from `/box`, `work.md` holds a third section, `## Conserved Spec`, naming the
      folder; the tasks run and ticked are those of that folder''s `spec.md`; and the agent deletes that
      folder''s `carry.md` when the last task is done, before the Work readings.

      **－** The skill writes no page of `vault/wiki/`, and it ticks no line of a page, a render, the sprint,
      the glossary or a reading.

      **－** A new failing test whose fix needs a choice that no ratified Case makes is not fixed in that
      step: it is a stop of `vault/wiki/where-to-stop.md`.

      **－** Any other new failing test goes on to `/retro`, which fixes it or reverts it into a patch.

      **－** In a `/work` that `/box` calls no Case is ratified, so the check of the plan does not run
      there: a fork stops the run, as `rule-spec-box` sets it, and the choice goes to `raw/<date>/<hi
      HHMM>/handoff.md` as a line.'
    context: 'When Claude Code loads a skill, it first runs each `!` command of the skill text and pastes
