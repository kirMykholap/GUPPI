- case: '1003.1'
  decision: decision-case-1003.1
  origin: raw/2026-11-02/1337/ledger.md#case-1003.1
  targets:
  - kind: update
    category: rules
    slug: rule-guppi-config
    ref: rule-guppi-config
  - kind: update
    category: estimates
    slug: estimate-guppi-config-runs-the-test-and-style-commands
    ref: rule-guppi-config
  tags: []
  case_text:
    given: '`rule-guppi-config`: the Rule page of `guppi test` and `guppi style`, whose Purpose names
      their exit code.

      **＋** `estimate-guppi-config-runs-the-test-and-style-commands`: its Criterion is replaced whole.

      **＋** `.guppi/guppi/commands.py`: the code of both commands, and the one place of the flag.

      **＋** `.guppi/tests/test_commands.py`: the tests of both commands.

      **＋** `.github/workflows/checks.yml`: the jobs `test` and `style`, which run both commands with
      no flag.

      **＋** `.claude/skills/work/SKILL.md` and `.claude/skills/retro/SKILL.md`: the skills that run the
      commands with the flag.

      **＋** `uv run --project .guppi pytest -q .guppi/tests` and `.guppi/pyproject.toml`: the command
      of the key `test` in this repository and the settings it runs with.'
    when: 'Someone runs `uv run --project .guppi guppi test` or `uv run --project .guppi guppi style`
      in a project, as `rule-guppi-config` sets it: by hand, in Work Mode, in Retro, or in the jobs `test`
      and `style` of `.github/workflows/checks.yml`.

      **＋** Or `.claude/skills/work/SKILL.md` or `.claude/skills/retro/SKILL.md` runs one of them with
      `--exit-zero` as it loads.'
    then: 'It reads the list of commands of the key `test`, or of the key `style`, from `guppi.toml` at
      the root of the project.

      **＋** It runs each command of the list in order, in the folder of the project and with no shell
      between, each one even after a red one.

      **＋** The output of each command reaches the person whole, and no command gets the stdin of `guppi
      test` or `guppi style`.

      **＋** Without `--exit-zero`, a single red command makes the run red, and the run is green only when
      all the listed commands pass.

      **＋** With `--exit-zero`, it prints the same lines, then one last line `exit code: <n>`, where n
      is the exit code of the run without the flag, and it exits 0.

      **＋** In this repository, the key `test` holds `uv run --project .guppi pytest -q .guppi/tests`,
      and the key `style` holds `uv run --project .guppi ruff check .` and `uv run --project .guppi ruff
      format --check .`; that command of `test` runs the tests of `.guppi/tests/` with the settings of
      `.guppi/pyproject.toml`, the tests marked `live` left out, whether the root of the project holds
      a `pyproject.toml` of its own or none.

      **＋** The rules, entities and Estimates of the vault and the harness files of `.claude/` call the
      tests and the style check by these two commands, and never by make.

      **－** When `guppi.toml` is missing or holds no such key, it prints one line that names the file
      and the key, runs nothing and exits 1; with `--exit-zero` it prints the line `exit code: 1` after
      it and exits 0.

      **－** The render reads `documentation_lang` and `chat_lang` as before, and a key `test` or `style`
      does not stop it.'
    context: 'When Claude Code loads a skill, it first runs each `!` command of the skill text and pastes
      the output into the skill. When such a command exits non-zero, Claude Code refuses to load the whole
      skill. `/work` runs `uv run --project .guppi guppi test` and `uv run --project .guppi guppi check`
      this way to write its baseline, and `guppi check` exits 1 whenever it finds anything. In the trial
      on the clone `C:\PROJECTS\GUPPI-trial`, `/box` called `/work`, and line 233 of the transcript `21f5559f-a385-4f16-be94-df02e138242f.jsonl`
      holds the refusal `` Shell command failed for pattern "!`uv run --project .guppi guppi check`" ``,
      with the three lines that the check printed. The agent then read the skill file and ran Work Mode
      by hand. The brief of this repository reports the same check under Readings at the close: `guppi
      check`: exit 1, 3 lines. So the `/work` of this repository fails to load the same way today. The
      text of `/work` says that a line can come back empty when its command fails, and that the agent
      then runs the command itself. Claude Code does not do that. `/retro` runs `guppi test` and `guppi
      style` the same way, so a red test stops `/retro` from loading, which is exactly when Retro has
      to fix or revert one. The lesson `lesson-hi-fails-outside-a-git-repository` gives the same cause
      for `/hi`, and case 851.3 fixed it by `guppi gitstate`, which exits 0 in each case.


      The person turned down a skill text where the agent runs the commands by hand, and asked that the
      tests run by themselves when the skill loads. The person also said that a core page in draft must
      block CI and the push to prod, not the work. So `guppi test`, `guppi style` and `guppi check` take
      a flag, `--exit-zero`. With it, a command prints its lines as before, then one last line `exit code:
      <n>` with the exit code that the run has without the flag, and exits 0. `/work` and `/retro` call
      their commands with the flag. Without the flag nothing changes. The job `lint` of `.github/workflows/checks.yml`
      runs `uv run --project .guppi guppi check` with no flag, and `.github/workflows/prod.yml` runs `guppi
      ship`, which refuses a draft core page. So both stay red on such a page. The finding of a draft
      core page stays in `guppi lint` (`check_status` of `.guppi/guppi/lint.py`, by `is_draft_core` of
      `.guppi/guppi/pages.py`), and this Case does not touch it. Moving it out alone would not unblock
      `/work`, since the failed Estimate is a finding of its own.


      The documentation of Claude Code on skills, https://code.claude.com/docs/en/skills, says that a
      failed command aborts the entire skill invocation and that, with the default `bash` shell, any non-zero
      exit code counts as a failure. It also says that in auto mode a command that needs approval does
      not abort the skill: Claude Code itself tells Claude to run it first. So the sentence of `/work`
      on an empty line is false, and the person chose to drop it. The line `Branch:` keeps `git branch
      --show-current`, which fails only outside a git repository, where `/hi` already stops the session.


      The code. `run` of `.guppi/guppi/commands.py` runs the commands of a key of `guppi.toml` and returns
      1 when one is red or when the file or the key is missing. `run_test` and `run_style` call it. `run`
      of `.guppi/guppi/check.py` runs the six steps and returns 1 when any step is red. A Grep of `exit-zero|exit_zero|"exit:|f"exit`
      over `.guppi/guppi/` printed nothing, so no code there prints an exit code yet. The flag and the
      last line live in one function of `commands.py`, and `check.py` imports it, as `rule-one-judgment-one-implementation`
      sets it. A Grep of `` skills/work|skills/retro|rule-work-mode|rule-retro|rule-lint|rule-guppi-config|!`|guppi\.toml
      `` over `.guppi/tests/` printed `test_gate.py`, `test_case_schema.py`, `test_config.py`, `test_commands.py`,
      `test_casecheck.py`, `test_glossary.py`, `test_onward.py`, `test_lint.py`, `test_render.py`, `test_prespec.py`,
      `test_ship.py` and `test_sprint.py`. None of them reads `.claude/skills/work/SKILL.md`, `.claude/skills/retro/SKILL.md`
      or the four Rule pages live. Each one writes its own copy in a temporary folder, or only names the
      slug.


      The texts. A Grep of `exits? (non-zero|1) when any|makes the run red|0 only when every` over `{vault/wiki,.claude,.guppi/guppi,.guppi/tests}/**`
      printed `rule-guppi-config.md`, `rule-lint.md`, `log.md`, `check.py`, `commands.py`, `estimate-guppi-config-runs-the-test-and-style-commands.md`
      and `estimate-lint-runs-every-step.md`. The Purpose of each Rule page, the docstring of each module,
      and the Criterion and `purpose` of each Estimate state that exit code, so each one enters a sub-case.
      The hits in `log.md` and in the History of `rule-lint.md` are records. A Grep of `back empty` over
      the same paths printed `.claude/skills/work/SKILL.md`, `rule-work-mode.md` and `estimate-work-mode-runs-the-spec-on-a-branch-from-a-baseline.md`,
      and each of them enters Case 1003.3. Under the rule of atomicity, the change makes four promises
      on four pages: the flag of `guppi test` and `guppi style`, the flag of `guppi check`, the load of
      `/work` and the load of `/retro`. So the Case has four sub-cases. Case 1003.1 and Case 1003.2 replace
      the Criteria of `estimate-guppi-config-runs-the-test-and-style-commands` and `estimate-lint-runs-every-step`,
      whose lines on the exit code the flag makes false. Case 1003.3 replaces the Criterion of `estimate-work-mode-runs-the-spec-on-a-branch-from-a-baseline`,
      whose line on an empty substitution is false. Each line of the three old Criteria that is not carried
      word for word stands in the new Criterion with the flag added. The two lines of the old Criterion
      of `estimate-guppi-config-runs-the-test-and-style-commands` on the key `test` in this repository
      are joined into one line, and the line of `estimate-lint-runs-every-step` on the Baseline of `/work`
      goes into its new `when` line on the preamble of `/work`. The lines of Case 1003.1 and Case 1003.2
      on the flag share their words, but each one speaks of its own command and its own Estimate. In the
      same way, the lines of Case 1003.3 and Case 1003.4 on the load each speak of their own skill. So
      nothing is signed twice. No Estimate of `rule-retro` checks how the skill loads, so Case 1003.4
      creates `estimate-retro-loads-on-a-red-command`, and a Glob of `vault/**/estimate-retro-loads-on-a-red-command.md`
      printed nothing. Three Estimates of `rule-retro` stand as they are. The Criterion of `estimate-retro-loads`
      checks only the readings of Retro, not how the skill loads. `estimate-retro-red-in-the-baseline-is-not-charged`
      and `estimate-retro-runs-on-to-the-handoff` speak of a failing test at Retro and of a commit that
      needs a clean style check and green tests. After the change, Retro still takes those results, now
      from lines that end with the exit code. So none of those lines becomes false. `estimate-spec-box-runs-a-conserved-spec`
      says that `/box` calls `/work` with the folder, and that Work Mode, the Work readings, `/retro`
      and `/handoff` run in one turn. That is the path that failed in the trial. The Case makes it hold
      while the check is red, so its Criterion stands. The `/pre-spec` run found that the `method` of
      `estimate-lint-runs-every-step` asked Retro to run `guppi check`, which the Render of `rule-retro`
      forbids. So the live run of the flag is left to `test_check.py`, which runs `check.run` with the
      flag. The `/pre-spec` run also found that the flag sentence on `rule-guppi-config` stood before
      the sentence on a missing file or key. So the flag sentence now follows that sentence and says that
      it holds in each case. Case 1002 changes `rule-orchestration` and `estimate-orchestration-acknowledging-reply`,
      and no page of this Case. The session''s ledger holds the `error` lesson `lesson-work-skill-fails-to-load-on-a-red-check`,
      with no mark yet. Case 1003.3 fixes its root cause, so its decision line on `rule-work-mode` carries
      `{addresses:lesson-work-skill-fails-to-load-on-a-red-check}`.'
