      hook of `rule-case-check` finds when you stop, from each page your Case updates or deletes and each
      file outside `vault/wiki/` whose path a task line writes in a code span, and it sends you a note
      once for each such file you have read by no `Read` call of it and no `Grep` call whose `path` is
      it, with its path, the name it holds and the purpose line of a page; so write in a code span of
      its task line the path of each file outside `vault/wiki/` that a task changes, and on each note
