      then print the purpose line of each page on that list by one Grep of `^(purpose|root_cause|pattern):`
      in the mode that prints the lines, its path `vault/wiki/` and its glob `**/{<slug>,<slug>}.md` with
      the bare slug of each page on the list and no folder before it, since a brace list of paths with
      their folders matches nothing, and open each file of the list whose purpose line, or whose path
      where it has none, bears on the change, whole or in parts as the paragraph that opens with the reading
      of `vault/wiki/case-schema.md` sets for its kind of text, leaving out `log.md` and `brief.md`; each
      one the change makes false enters the Case, or `context` names it and says why it stands (as set
