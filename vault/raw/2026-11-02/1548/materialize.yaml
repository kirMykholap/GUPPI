    file itself give none; a name is matched as a whole word; a held note is not sent again; check_answer
    with no transcript gives no such note; carried_names gives the agent, the skill with its slash and
    guppi style and guppi test for commands.py; beyond the Criterion the hook leaves out its own store
    *.checked.json, and the fixture plan of test_casecheck.py moved under a home folder outside the made-up
    project, as Claude Code writes plans'
