      or in parts as the paragraph that opens with the reading of `vault/wiki/case-schema.md` sets for
      its kind of text, or name it in `context` and say why it stands; each one the change makes false
      enters the Case, or `context` names it and says why it stands (as set in case 1005.2).
  - old: List each page and file that the tasks of the Case change, and search the names of each one that
      exists before the Case and whose names you have not searched in this build, as the paragraph on
      the frame of the Case sets it (as set in cases 986 and 999.2). When the Case changes what a step
