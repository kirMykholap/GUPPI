decisions:
- case: '1005.1'
  decision: decision-case-1005.1
  origin: raw/2026-11-02/1548/ledger.md#case-1005.1
  targets:
  - kind: update
    category: rules
    slug: rule-case-check
    ref: rule-case-check
  - kind: create
    category: estimates
    slug: estimate-case-check-notes-the-files-that-name-what-a-case-changes
    ref: rule-case-check
  tags:
  - hooks
  - harness
  - workflow
  - case-build
  case_text:
    given: '`rule-case-check`: the rule of the `SubagentStop` hook that checks the file of a Case.

      **＋** `.guppi/guppi/casecheck.py`: the hook, its notes and `read_outputs`.

      **＋** `.guppi/tests/test_casecheck.py`: the tests of the hook.

      **＋** `.guppi/guppi/cli.py`: `COMMANDS`, which maps each command to its module.

      **＋** `.guppi/guppi/generate.py`: `REWORD_PATH_FIELDS`, the path fields of a page.

      **＋** `.guppi/guppi/prespec.py` and `.guppi/guppi/lint.py`: `items_of`, the items of a `then` block,
      and `CODE_SPAN`, the pattern of a code span.

      **＋** `rule-one-judgment-one-implementation`: one judgment lives in one module.

      **＋** `raw/<date>/<hi HHMM>/cases/case-<N>.md` and `<plan>.checked.json`: the file of a Case the
      hook checks, and the store of its notes.

      **＋** `vault/wiki/`, `.claude/`, `.guppi/guppi/`, `.guppi/tests/` and `vault/wiki/decisions/`: the
      folders the hook searches, and the Decision pages it leaves out.

      **＋** `estimate-case-check-notes-the-files-that-name-what-a-case-changes`: the new check of the
      note.'
    when: 'The `SubagentStop` hook `uv run --project .guppi guppi casecheck --subagent` of `.guppi/guppi/casecheck.py`
      checks a file `raw/<date>/<hi HHMM>/cases/case-<N>.md` that `case-guppi` wrote, whose Case updates
      or deletes a page, or writes in a code span of a task line the path of a file of the repository
      outside `vault/wiki/`.

      **＋** Or `.guppi/tests/test_casecheck.py` runs it over a made-up file, transcript, plan file and
      store.'
    then: 'The hook searches the files under `vault/wiki/`, `.claude/`, `.guppi/guppi/` and `.guppi/tests/`
      for every name of each such page and file.

      **＋** The names of a page are its slug, the file name of each path of its `governs`, `implementation_ref`
      and `code_ref`, the name of the agent, or of the skill with its slash, whose file those paths name,
      and `guppi <command>` for each command that `COMMANDS` of `.guppi/guppi/cli.py` maps to a module
      of those paths.

      **＋** The names of a file are its file name and the name of the agent, the skill or the command
      it carries.

      **＋** For each file that holds a name and that the subagent, in `agent_transcript_path`, read by
      no `Read` call of the file and no `Grep` call whose `path` is the file, it sends a note that names
      the Case, the path, the name the file holds and, for a page, its `purpose`, `root_cause` or `pattern`
      line, and asks the agent to read the file or to name it in `context` with the reason it stands.

      **＋** Each note is sent once by exit 2 beside any findings, stored under `notes` in `<plan>.checked.json`,
      and not sent again for the same Case id.

      **－** The note leaves out the file of the page or the file itself, the pages under `vault/wiki/decisions/`,
      `log.md` and `brief.md`.

      **－** A note is no finding: the `Stop` check of `guppi casecheck` refuses no showing for it, and
      a transcript the hook cannot read gives no such note.'
    context: '`case-guppi` must find each file that names a page or a file its Case changes, by every
      name of it, and a member already in a list when its Case adds a new member. Both steps stand in
      the Render of `rule-case-build`, and both failed their reading on the build of Case 1001 in session
      0254 (readings L17 and L18 of session 1337). For the names, the agent ran one Grep per slug and
      no Grep of the purpose lines, and it searched two pages over `.guppi/tests` only. For the list,
      its one search ran over `.guppi/{guppi,tests}`, none over `vault/wiki/` or `.claude/`, though the
      Case itself missed no text. The person chose to move the names search into the `SubagentStop` hook
      of `rule-case-check`. The hook already reads the `Read` calls of the agent through `read_outputs`
      of `.guppi/guppi/casecheck.py`, and already sends notes once through `check_answer` and `judge_and_store`,
      which store each note under its Case id and do not send it again. So Case 1005.1 adds one note per
      file that names what the Case changes and that the agent did not read. Case 1005.2 makes the agent
      answer each note in place of its own search. Case 1005.3 writes the list-member search as one fixed
      Grep. The rule of one judgment (`rule-one-judgment-one-implementation`) bounds 1005.1. A Grep of
      `"agents"|agents/|SKILL\.md|__module__` over `.guppi/guppi/` printed `render.py` and `recall.py`,
      and neither derives a name from a path. A Grep of `code_ref|implementation_ref` over `.guppi/guppi/`
      printed `generate.py` and `lint.py`. `REWORD_PATH_FIELDS` of `generate.py` lists the three path
      fields, and the task imports it. `PATH_FIELDS` of `lint.py` lists two fields for another judgment,
      whether a path exists. `cli.py` was read whole for `COMMANDS`. For the pages a Case updates or deletes,
      `items_of` of `prespec.py`, read whole, gives each item of a `then` block with its kind and its
      slug, and the task imports it. For the code spans of a task line, a Grep of `CODE_SPAN\b.*=|import.*CODE_SPAN|CODE_SPAN,`
      over `.guppi/guppi/` printed `lint.py`, `prespec.py`, `generate.py`, `pointers.py` and `config.py`.
      `CODE_SPAN` is set in `lint.py`, the other four import it, and the task imports it too. The fixes
      of `/pre-spec` changed two points of behaviour. First, the path a task line must write in a code
      span is only that of a file outside `vault/wiki/`. A page task names its page by slug, as `case-schema.md`
      sets it, and the hook takes pages from the `then` block. Second, the hook counts as a read a `Read`
      call of the file and a `Grep` call whose `path` is that file, since the Render of `rule-case-build`
      lets the agent read a text in parts by a Grep with lines of context. The read check of the pairs
      keeps its own rule, under which the output of a Grep is no read. The names search of this build,
      over the root with the glob `{vault/wiki,.claude,.guppi/guppi,.guppi/tests}/**`, for the names of
      `rule-case-build`, `rule-case-check`, both Estimates, `case-guppi`, `casecheck.py`, `tags.py`, `test_casecheck.py`,
      `settings.json` and `guppi casecheck`, printed 273 files. Of those, the files that bear on the change
      were read. `estimate-case-build-checks-the-finished-case` stands: its slug search of a page whose
      text turns false is another step, which stays in the Render. `estimate-case-example-passes-the-check`
      stands: `.guppi/tests/test_case_schema.py` runs `check_answer` with no transcript, so it gets no
      names note and still finds no note. `lesson-grep-glob-brace-list-of-paths-matches-nothing` stands
      as the record of a fact. A Grep of `a note once` over `{vault/wiki,.claude,.guppi/guppi}/**` printed
      `rule-case-check.md`, `estimate-case-check-notes-a-page-the-cascade-archives.md` and `estimate-case-check-notes-a-sentence-two-cases-change.md`.
      The two Estimates check their own notes, and the new note leaves them true. The `purpose` field
      of `rule-case-check` names no note and stands. `/pre-spec` gets no such note: the agent''s record
      of calls is the hook''s input alone. The `purpose` and `method` of `estimate-case-build-reads-each-list-of-a-new-member`
      still hold with the fixed search and stand. A Grep of `parents\[2\]|REPO|ROOT =|project_root|Path\(__file__\)`
      over `.guppi/tests/` printed 12 files. A Grep of `check_answer|judge_and_store|casecheck\.subagent|casecheck\.run`
      over `.guppi/tests/` printed `test_prespec.py`, `test_casecheck.py` and `test_case_schema.py`. Of
      those three, only `test_case_schema.py` is among the 12, and it runs `check_answer` over the live
      `case-example.md`. The session ledger holds no `error` lesson. The check of this file noted the
      old Criterion lines that the two replaced Criteria do not carry, and they are dropped on purpose.
      The old lines of `estimate-case-build-searches-the-names-of-what-it-changes` promise the agent''s
      own search, its names, its purpose-line Grep and its search again at the check of the finished Case.
      That search now belongs to the hook, and the Criterion of 1005.1 holds the names. The new trigger
      is the note, and the exclusion of `log.md` and `brief.md` is now a line of 1005.1. The old first
      line of `estimate-case-build-reads-each-list-of-a-new-member` gave three folders and no form, and
      the fixed Grep replaces it. The note also found that a `then` line of 1005.3 shares most of its
      words with one of 1005.2. Both lines stand, since they speak of different texts: in 1005.3 a text
      that lists the members of a list, and in 1005.2 a file that a note of the hook names.'
  parent: decision-case-1005
  spec: vault/raw/2026-11-02/1548/spec.md
  applied: '20:27:14'
