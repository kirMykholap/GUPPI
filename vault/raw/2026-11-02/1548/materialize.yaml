      the form that `vault/wiki/orchestration.md` sets. That text used to name each heading and label
      of the reply by its English words in a code span. Twice the agent copied those words into a Russian
      chat: the labels and the heading of the Frontier in session 2227, and the heading of the Frontier
      alone in session 0254, after Case 997 had moved the instruction to translate to the front. The librarian
      clustered the two lessons, `lesson-acknowledging-reply-labels-left-in-english` and `lesson-orchestration-acknowledging-reply-leaves-the-frontier-heading-untranslated`,
      into `insight-orchestration-acknowledging-reply-keeps-headings-in-english`, which stands `open`
      in the backlog. Case 1002 of session 1337 rewrote the paragraph so that it names each heading and
      label by what it says and gives no English word to copy, and a Grep of `orchestration.md` showed
      that the render after that session wrote the new text there. Case 1002 left the insight `open` until
      a reading showed that the fix holds.


      That reading came in this session, from two replies that the `method` of `estimate-orchestration-acknowledging-reply`
      names: an acknowledging reply, and a reply that acknowledges Cases ratified together in one answer.
      In the transcript of this session, `e96fc117-189d-45c1-ac5c-b9ece4544309.jsonl`, the reply that
      acknowledges Case 1005 with its sub-cases, ratified in one answer, opens with the `LEDGER` block,
      and its heading of the Case, its labels of the changes and of the notes and its heading of the Frontier
      all stand in Russian. Line 7 of the session''s ledger, `estimate[estimate-orchestration-acknowledging-reply][passed]`,
      records that reply alone. In the same transcript the reply that acknowledges Case 1006 alone opens
      with the `LEDGER` block that holds line 8 of the ledger, writes its heading of the Case, its label
      of the changes and its heading of the Frontier in Russian, folds the closed lines, ends with the
      question which item is next and calls no tool after the block. The main agent writes a second reading
      line of that Estimate, `passed`, that names both replies, in the reply that acknowledges Cases 1005
      and 1006 ratified again; this Case rests on both replies.


      `addressed_by` names `decision-case-1002`, not `decision-case-997`: Case 1002 removed the English
      words that the agent copied, which is the pattern of the insight, and `rule-insights-schema` keeps
      one decision in the field, the latest. Both Decision pages exist, so the field takes the quoted
      wikilink. In `.guppi/guppi/generate.py` I read `cascade`, `kept_decisions`, `archived_by_cascade`
      and the end of `apply`, where `cascade` runs after every entry of the run: `archived_by_cascade`
      puts each `clustered` child of an `actioned` Insight among the pages to archive, `cascade` sets
      those lessons `archived` and sets the Insight''s `severity` to the count of its live children, and
      an `actioned` Insight is never archived there. If the agent writes an English heading again, a new
      lesson reopens the insight, as `rule-insights-schema` sets it.


      This Case changes the status of a page and no behaviour, so no new Estimate is created. The fix
      that the insight records is checked by `estimate-orchestration-acknowledging-reply`, read on the
      two replies above; its Criterion already says that each heading and label of the reply stands in
      the language of the chat, so it stands. The `then` of this Case comes only at the librarian''s run.
      The cascade parts of it are checked by `estimate-generate-cascades`, whose Criterion says that every
      `clustered` child of an Insight with `status: actioned` becomes `archived` and that an `actioned`
      Insight at a severity of 0 stays; it speaks of the cascade for every Insight, so it stands. The
      state of the insight page after that run, `actioned` with its `addressed_by`, is left to the `uv
      run --project .guppi guppi check` of the librarian''s run, which the brief reports, as `case-schema.md`
      allows for a check whose moment comes after Work Mode. A Grep of `insight-orchestration-acknowledging-reply-keeps-headings-in-english`
      over `{vault/wiki,.claude,.guppi/guppi,.guppi/tests}/**`, files only, printed `vault/wiki/backlog.md`,
      `vault/wiki/log.md` and the two lessons. The lessons name the insight in their `insight` field and
      go to the archive by the cascade. The backlog and the log are written by the scripts, so neither
      changes here. The session''s ledger holds no `error` lesson, so no line carries a mark.'
    problem: The insight stands `open` in the backlog, though the rewrite of Case 1002 removed its cause
      and the first reply after the render shows that the fix holds.
    recommend: "- **What happens to the pattern page**\n  - Recommended: (a) mark it fixed now, by the\
      \ rewrite of `orchestration.md`, its `addressed_by` naming `decision-case-1002`.\n  - Answer: agreed,\
