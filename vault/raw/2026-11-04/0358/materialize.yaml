      was lost; `git check-ignore` was not run here. Case 1025.2 makes the rule say that the folders go
      up to the root in each of its three folder clauses, and replaces the Criterion of `estimate-case-build-reads-the-readers-of-a-new-files-folder`
      with the same words. Its `purpose` and its `method` are set anew: the `method` read `.claude/agents/case-guppi.md`,
      which changes only at the render of the librarian''s run, so it now reads the new Render in the
      Spec at Retro, in the form that other Estimates of `rule-case-build` use. The governing rule is
      `rule-case-build`. Of the Estimates that `rule-case-build` lists, only `estimate-case-build-reads-the-readers-of-a-new-files-folder`
      has a `purpose` that speaks of ignore files. At the finding 1.4 of `/pre-spec`, the person chose
      that all three folder clauses of that paragraph go up to the root: the path search, the ignore files
      and the readers. In round 3 the person chose that the path search stops below the root, since the
