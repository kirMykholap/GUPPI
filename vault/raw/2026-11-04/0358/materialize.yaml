      - the `style` key of `guppi.toml`, `uv run --project .guppi ruff check .` and `uv run --project
      .guppi ruff format --check .`, judges the new module like every other Python file.


      The other walks of the tests read temporary folders, the vault, `.claude/` or `.github/workflows/`.
      `.gitignore` and `.guppi/.gitignore` ignore no `.py` file of `.guppi/guppi/`. In `rule-plugin-install`,
      the install copies `.claude/settings.json` from the clean version, which no longer holds the entry.
