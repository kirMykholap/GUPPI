- case: '1026.5'
  decision: decision-case-1026.5
  origin: raw/2026-11-04/0358/ledger.md#case-1026.5
  targets:
  - kind: update
    category: estimates
    slug: estimate-orchestration-acknowledging-reply
    ref: rule-orchestration
  tags: []
  case_text:
    given: '`estimate-orchestration-acknowledging-reply`: its put-off is retired and its reading is taken.

      **＋** `rule-orchestration`: sets the reply that acknowledges a ratification.

      **＋** `vault/wiki/orchestration.md`: the file rendered from `rule-orchestration`.

      **＋** `rule-ledger-write`: the ledger hook.

      **＋** `rule-morph`: the setup Case.

      **＋** `rule-skill-setup`: the skill `/setup` that builds the setup Case.

      **＋** `rule-prespec-onward`: its hook sends the agent on after `/pre-spec`.

      **＋** `estimate-orchestration-acknowledging-reply-opens-with-stop-after-prespec`: checks the `STOP:`
      line before the `LEDGER` block.

      **＋** `estimate-ledger-write-holds-a-decision-line-off-the-stored-case`: checks the decision line
      that the ledger hook holds.

      **＋** `raw/<date>/<hi HHMM>/frontier.md`: the Frontier of a session.'
    when: The person ratifies a Case, ratifies again a Case shown again after its ratification, or ratifies
      in one answer Cases shown together, and the agent writes the reply that acknowledges it, with `vault/wiki/orchestration.md`
      rendered from `rule-orchestration`.
    then: 'The reply has four parts, in this order. First, the `LEDGER` block, before which stands nothing
      but the `STOP:` line that `estimate-orchestration-acknowledging-reply-opens-with-stop-after-prespec`
      checks. Second, the heading `## Case N — ratified` and a paragraph `Changes:` that says what changes,
      in one or two sentences. Third, a paragraph `Notes:` with facts that did not enter the Case, left
      out when there are none. Last, the heading `## Frontier` and the lines of `raw/<date>/<hi HHMM>/frontier.md`
      as a checklist.

      **＋** Each heading and label of the reply stands in the language of the chat that `CLAUDE.md` sets,
      but for the terms of the harness it holds: the words of the heading `## Case N — ratified` and of
      the labels `Changes:` and `Notes:` other than such a term stand in that language, not in the English
      words by which this Criterion names them.

      **＋** In the checklist the closed lines are folded into one line, and the lines put off stand as
      `[-] … · sprint · defer`, `[-] … · backlog · kept` or `[-] … · defer case N`.

      **＋** The open `W` lines are folded into one line that lists their ids, and each other open line
      stands on its own line with a short title.

      **＋** While a line under `## Cases` is open, the question which item is next ends the reply.

      **＋** When none is open before `/pre-spec`, the question whether to go on to `/pre-spec` ends the
      reply, in the plain form of the question which item is next. The agent calls `/pre-spec` only after
      the person says to go on. A reply that answers a question of the person instead ends with the same
      question again.

      **＋** When none is open after `/pre-spec`, the reply ends with the Frontier and asks nothing, and
      the hook of `rule-prespec-onward` sends the agent on.

      **＋** One reply acknowledges every Case and sub-case ratified in one answer, a Case with its sub-cases
      or Cases shown together for one ratification: one `LEDGER` block with all their lines, one heading
      `## Case N — ratified` that names their ids, one paragraph `Changes:`, one Frontier.

      **＋** The reply that acknowledges a re-ratification carries the `LEDGER` block with the decision
      lines of each Case ratified again, as at its first ratification.

      **＋** No tool call follows the `LEDGER` block in the same reply.

      **－** The reply that acknowledges the setup Case of `rule-morph`, built by `/setup` of `rule-skill-setup`,
      holds no Frontier and ends with the open question on what the first sprint is to build, and no tool
      call follows its `LEDGER` block.

      **－** A term of the harness that a heading or a label holds, such as Case or Frontier, may stay
      in English, untransliterated as `CLAUDE.md` sets it, and the heading of the Frontier may be that
      term alone, such as `## Frontier`.

      **－** Slugs, paths, the tag of the `LEDGER` block, the ledger lines and the word `STOP:` that opens
      a reply keep their own words in any language of the chat; the rest of the `STOP:` line stands in
      the language of the chat.

      **－** The ledger hook of `rule-ledger-write` does not append a repeated decision line a second time.

      **－** When a `Stop` hook other than the ledger hook of `rule-ledger-write` refuses the reply with
      exit 2, the agent''s answer to the refusal is a reply of its own and may call tools. The `LEDGER`
      block stands written, but for a decision line the ledger hook holds, as `estimate-ledger-write-holds-a-decision-line-off-the-stored-case`
      sets it.'
    context: 'The setup of `rule-morph` is built: the first `/hi` after `/guppi:install` starts `/setup`
      of `rule-skill-setup`, which puts one setup Case before the opening of the first sprint (case 1017).
      What remains is the readings by hand of its Estimates, which need a person to install the plugin
      from a copy that `guppi ship --allow-draft` writes into a new project, in a second Claude Code window
      that the agent cannot open. No session has made that install. Earlier in this session the person
      ratified Cases 1022, 1023 and 1024, which put off three of those readings; their defers stand only
      as lines of this session''s ledger and would reach the pages and `backlog.md` only at the librarian''s
      run. The person then asked why the work is only put off, and picked this item: one session prepares
      the copy and three folders, and the person installs into each. By the person''s choice this Case
      takes five readings at one `stop:` task of Work Mode, one sub-case per Estimate, since each reading
      can fail alone and needs its own fix (`rule-atomicity`): `estimate-morph-sets-up-the-project-at-the-first-hi`,
      `estimate-morph-takes-in-the-set-aside-files`, `estimate-git-context-offers-git-init`, `estimate-sprint-plugin-installs-as-a-plugin`
      and `estimate-orchestration-acknowledging-reply`. The precedent is Case 900 of session 0327, which
      took five install readings from the backlog the same way.

      The readings are not all short. The Criterion of `estimate-morph-sets-up-the-project-at-the-first-hi`
      reads the settings that the librarian''s run of the new project''s session writes, so in the empty
      git project the person takes that session through the setup Case, the opening of its first sprint,
      Work Mode and the librarian''s run; the Criterion of `estimate-morph-takes-in-the-set-aside-files`
      reads the render at the librarian''s run of its session too. In the folder with no git the person
      answers no, then yes, then types `/hi` a third time, as the method of `estimate-git-context-offers-git-init`
      sets it. The empty git project also serves `estimate-sprint-plugin-installs-as-a-plugin`, whose
      Criterion asks for an empty project, and the second part of the method of `estimate-orchestration-acknowledging-reply`,
      which waits for a setup Case ratified in a new install. Its first part waits for replies written
      after the render of the sentence that lets a heading keep a term of the harness in English; `vault/wiki/orchestration.md`
      holds that sentence on its line 82, and this session''s ledger holds decision lines of Cases ratified
      alone and of two Cases ratified at one time, so the replies that acknowledge them stand in this
      session''s transcript.

      By the person''s choice the put-offs of Cases 1022, 1023 and 1024 are retired: a reading taken today
      cannot also stand put off. Each sub-case names its Estimate by an `update` with only `change` and
      carries one `{supersedes:case N}` mark for the Case that put it off, as `case-schema.md` sets it
      for a taken-up defer, so Cases 1022, 1023 and 1024 leave the Spec of this session. `estimate-orchestration-acknowledging-reply`
      carries `deferred_by: ["[[decision-case-1014]]"]`, so Case 1026.5 carries `{supersedes:case 1014}`.
      `estimate-plugin-install-sets-aside-the-files-of-the-project` stays put off by Case 949: its method
      needs two more projects, one started with uv offline, and the person chose not to add them.

      Each sub-case is checked by its own Estimate, and its `when` and `then` are the Criterion of that
      Estimate word for word. The `update` sets no `status` and no Criterion, so by `case-schema.md` the
      Criterion and the `pending` status stand until the reading, which the main agent records as an estimate
      line from the person''s report and the files of each folder. A reading that fails stands `failed`,
      and a Case of a later session fixes its cause.

      The copy comes from `run` of `.guppi/guppi/ship.py`, read with `parser`: it refuses a folder that
      is not empty, prints the line of each draft page with `core: true` and goes on with `--allow-draft`,
      and stops with the line `ship: no tag prod-x.y.z in the history of HEAD; nothing written` when `version`
      finds no such tag. A Glob of `.git/refs/tags/prod-*` printed `prod-1`, `prod-2`, `prod-0.2.0` and
      `prod-0.3.0`; `VERSION_TAG` of `.guppi/guppi/ship.py` matches only the form `prod-x.y.z`, so `prod-1`
      and `prod-2` give no version, and whether `prod-0.2.0` and `prod-0.3.0` stand in the history of
      HEAD was not checked here, and the task of the copy shows it. Work Mode waits at the `stop:` task
      for the person''s word, as `rule-where-to-stop` sets it.

      The milestone line of `rule-morph` on `entity-sprint-plugin` says that `rule-morph` and `rule-skill-setup`
      stay `draft` until the readings; `rule-skill-setup` is `built` already, so that part is false. By
      the person''s choice it stands: how the readings end is known only after Work Mode, and the whole
      line then needs new words, which a later Case writes once. This Case changes no other text of `entity-sprint-plugin`,
      which Case 1021 put off; Case 1025 of this session touches that page only through its Estimate.

      A Grep of `.guppi/tests/` for `morph-sets-up-the-project|morph-takes-in-the-set-aside|git-context-offers-git-init|sprint-plugin-installs-as-a-plugin|orchestration-acknowledging-reply\b`
      printed nothing, so no test reads these pages by slug. A Grep of the session''s ledger for `lesson\[error\]|\{addresses:`
      printed nothing, so no lesson is marked.

      The check of this file listed the files that name the changed Estimates, and each stands, since
      this Case adds only a History line to each Estimate. `rule-git-context` and `rule-orchestration`
      list them in `estimates` and in History. The Criteria of `estimate-orchestration-acknowledging-reply-opens-with-stop-after-prespec`
      and `estimate-orchestration-shows-the-frontier-after-a-closed-line` point to the order and the form
      that `estimate-orchestration-acknowledging-reply` checks, and that Criterion stands. The `method`
      of `estimate-clean-branch-writes-the-session-files` lets its reading share the copy and the folder
      of the reading of `estimate-git-context-offers-git-init` at the same commit; this Case does not
      take that reading. `backlog.md` is written by `guppi backlog` from the pages, so it follows the
      retired put-offs at the librarian''s run. The check also noted that some `then` lines of Cases 1026.4
      and 1026.5 share words with lines of Case 1026.1; they stand, since each sub-case copies the Criterion
      of its own Estimate word for word.'
