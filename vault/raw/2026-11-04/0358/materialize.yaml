  case_text:
    context: 'A pointer to a case in a comment or a docstring under `.guppi/` must stand in a bracket
      of its own at the end of its sentence, such as `(as set in case 12)`, so that `guppi ship` can remove
      it whole from the clean version. Today the one check of the live code, `test_the_live_code_holds_no_pointer_outside_a_bracket`
      of `.guppi/tests/test_ship.py`, runs only inside the full `uv run --project .guppi guppi test` at
      the end of Work Mode. So the agent learns of a bare case number only there and goes back to fix
      it. The two children of `insight-ship-live-code-writes-a-case-number-outside-a-bracket` record two
      such cases: a test comment that held a case number alone, and a sample closer in the docstring of
      `.guppi/guppi/frontierguard.py` that held a real case number where the placeholder `case N` belonged.
      The person chose a hook after each Edit, Write or MultiEdit of a file under `.guppi/`. It runs the
      same judgment over that file and tells the agent at once, by a note beside the tool result, and
      it refuses nothing. It is written into `rule-clean-branch` beside the live code test and checked
      by a new Estimate.


      This Case replaces Case 1027, which held the hook alone. `/pre-spec` found that Case 1027 put the
      hook''s tests into `test_ship.py`, which the clean version leaves out, while `codewrite.py` shipped.
      The person then chose that the hook does not ship, since it serves only the build of the clean copy.
      In an installed project it would be a hook that runs on every write and does nothing. Leaving the
      hook out is a second behaviour that can fail on its own, so the Case now has two sub-cases. The
      person chose this Case again with two parts. Case 1027 has decision lines in the ledger, and `vault/wiki/case-schema.md`
      (`## Splitting`) sets a new number for a Case that comes back with sub-cases (case 722.2). So this
      Case is 1028, and its decision lines carry `{supersedes:case 1027}`. The file of Case 1027 stays
      as it is.


      The judgment stays one. The test''s `live_code_lines` walks `ship.tree_files(root, ".guppi")`, skips
      `ship.LEFT_OUT` and `ship.NOT_CLEANED`, and takes `ship.judged(name, text, set(), set())[1]` for
      each file. `judged` of `.guppi/guppi/ship.py` returns no line for a file of `NOT_CLEANED`. Otherwise
      it judges a Markdown file or a `schema.yaml` as a sample file, a Python file under `.guppi/tests/`
      by its comments and docstrings only, and a `.py` file for bare numbers by `bare_numbers`, through
      `leftovers` and through `outside` of `.guppi/guppi/pointers.py`. Case 1028.1 moves the per-file
      part of that test into one function, `live_code(name, text)` of `ship.py`, and both the test and
      the hook import it. A Grep of `.guppi/guppi/` for `judged\(|live_code` printed `ship.py` alone,
      where `ship` and `check` call `judged`, so no other module of the package holds a copy. Since the
      hook does not ship, `codewrite.py` imports `guppi.ship` directly and does not call `ship_stands`
      of `.guppi/guppi/pages.py`. So the docstring of `ship_stands` and the test of `.guppi/tests/test_lint.py`
      that checks its importers are left as they are. Those importers are `lint.py`, `check.py` and `cli.py`.
      `cli.py` adds the command `codewrite` under the same `if ship_stands():` that adds `ship`, so the
      clean version, which holds neither module, lists neither. The note form follows `shellwrite` of
      `.guppi/guppi/shellwrite.py`, which prints `{"hookSpecificOutput": {"hookEventName": "PostToolUse",
      "additionalContext": ...}}` and exits 0. The page on hooks, https://code.claude.com/docs/en/hooks,
      says that the `additionalContext` of a `PostToolUse` hook is inserted next to the tool result. It
      also says that exit 2 there only shows stderr, since the tool already ran, and that the matcher
      of `PostToolUse` is the tool name, with `Edit|Write` among its examples. `frontierguard` reads the
      path as `tool_input.file_path` and resolves a relative one against the project.


      The copy takes `.claude/settings.json` byte for byte. `ship` of `ship.py` copies each file of `plan`
      and then cleans it by `settled`. It takes the Render of each page with `core: true` through `shipped_page`,
      which already rewrites the Render of `rule-claude-md` by `blank_description` and that of `rule-guppi-config`
      by `setup_not_done`. So Case 1028.2 adds `.guppi/guppi/codewrite.py` to `LEFT_OUT`. It also removes
      the exact registration of `guppi codewrite` from the copy of `.claude/settings.json` and from the
      Render of `rule-hook-registry` in `shipped_page`, so that `guppi render --check` over the copy finds
      both alike. The person chose to name one exact entry. They then chose that the build exits 1 only
      where a text still names `guppi codewrite` after the removal. The made-up project of `tree` in `test_ship.py`
      writes `{}` into `.claude/settings.json`. This repository holds no entry until the librarian''s
      run. A refusal of every text without the entry would have made both red. `plan` leaves out each
      name of `LEFT_OUT`, so `check` does not judge `codewrite.py` either, as it does not judge `ship.py`.


      `rule-hook-registry` says in its Purpose that a hook Rule names `.claude/settings.json` in `implementation_ref`,
      so `rule-clean-branch` now names it, with `codewrite.py`. It also says that a hook is registered
      in the same Case that creates the hook''s Rule. This hook gets no new Rule, so Case 1028.1 widens
      that sentence to a Rule the hook is added to. The Purpose of `rule-clean-branch` says that the copy
      holds the tests but `test_ship.py`, the tests of the command `ship`, and that it does not write
      `ship.py`. Case 1028.2 adds the hook to both sentences.


      The Estimates of `rule-clean-branch` stand as follows. The Criterion of `estimate-clean-branch-tests-judge-the-live-code`
      stands: the test still walks by `tree_files`, leaves out `LEFT_OUT` and `NOT_CLEANED`, now inside
      `live_code`, and runs `judged` over each file, and its promise is the full test run. `estimate-clean-branch-ships-the-tests`
      stands, since the hook''s tests stand in `test_ship.py`, which the copy leaves out, and the copy
      holds no test that needs `codewrite.py`. `estimate-clean-branch-ships-no-ship-command` stands, since
