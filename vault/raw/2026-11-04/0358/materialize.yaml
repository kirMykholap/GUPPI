      that the new code holds its pointers in brackets. `estimate-hook-registry-rendered` stands, since
      the render line keeps the live `.claude/settings.json` equal to the Render. The insight is set `actioned`
      with this decision in `addressed_by`, as `vault/wiki/insights/schema.yaml` sets it for a Case of
      its own session.


      The other `PostToolUse` hooks of `.claude/settings.json` are `guppi event tool` on every tool, `guppi
      spec` on `ExitPlanMode`, `guppi pageread --after` on `Read` and `guppi shellwrite` on `Bash|PowerShell`.
      None of them runs on Edit or Write. `lesson-hooks-matching-hooks-of-one-event-run-in-parallel` stands,
      since `guppi event tool` and the new hook do not read each other''s output. A Grep with the glob
      `{vault/wiki,.claude,.guppi/guppi}/**` from the root for `shellwrite`, a member of the list of hook
      commands, printed `.claude/settings.json`, `vault/wiki/log.md`, `vault/wiki/rules/rule-hook-registry.md`,
      `.guppi/guppi/cli.py`, `vault/wiki/estimates/estimate-shell-write-check-repairs-and-reports.md`,
      `vault/wiki/rules/rule-shell-write-check.md`, `.guppi/guppi/shellwrite.py` and `vault/wiki/lessons/lesson-work-mode-edited-a-source-file-through-the-shell.md`.
      The texts that list the hook commands are the Render of `rule-hook-registry` and the docstring of
      `cli.py`, and both enter the Case. A Grep of `.guppi/tests/` for `settings\.json|"shellwrite"|COMMANDS`
      printed `test_ship.py`, `test_ratified.py`, `test_render.py`, `test_guppi_package.py`, `test_shellwrite.py`
      and `test_guard.py`. Of these, two tests read the live repository. `test_each_hook_command_stands_in_the_settings_in_the_new_form`
      of `test_guppi_package.py` reads `.claude/settings.json`, and the new line passes it. `test_the_clean_version_holds_no_pyproject_and_no_lock_at_its_root`
      builds the copy of this repository and asserts no line of the build, so the removal changes nothing
      it asserts.


      The one new file is `.guppi/guppi/codewrite.py`. A Grep for `guppi/`, which covers `.guppi/guppi/`,
      `.guppi/` and the bare `guppi/`, printed 33 files of `.guppi/guppi/`. It printed 5 files of `.claude/`:
      `skills/setup/SKILL.md`, `skills/pre-spec/SKILL.md`, `agents/librarian-guppi.md`, `agents/ask-guppi.md`
      and `agents/case-guppi.md`. It printed 196 hits in 49 files of `vault/wiki/rules/`. A Grep of `vault/wiki/rules/`
      and `.claude/` for a rule over each module or file of such a folder, `(each|every) (module|file)[^.]{0,80}guppi/`,
      printed nothing. A Grep of `.guppi/guppi/` for `os\.walk|rglob|\.glob\(|iterdir` printed 14 files:
      `ledger.py`, `ship.py`, `prespec.py`, `casecheck.py`, `pages.py`, `lint.py`, `onward.py`, `backlog.py`,
      `sprint_close.py`, `generate.py`, `materialize.py`, `archive.py`, `cleanup.py` and `caseid.py`.
      The same Grep of `.guppi/tests/` printed 15 files: `test_ship.py`, `test_check.py`, `test_lint.py`,
      `test_onward.py`, `test_generate.py`, `test_spec.py`, `test_backlog.py`, `test_materialize.py`,
      `test_ratified.py`, `test_case_schema.py`, `test_sprint_close.py`, `test_guppi_package.py`, `test_gitstate.py`,
      `test_orchestration.py` and `test_archive.py`. These are the readers that take every file of the
      folder:

      - `tree_files` of `ship.py` walks `.guppi/`, and `LEFT_OUT` keeps the new module out of the copy
      and out of `live_code`;

      - `named_files` of `.guppi/guppi/casecheck.py` searches every file of `.guppi/guppi` for names,
