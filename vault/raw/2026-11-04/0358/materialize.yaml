  fields:
    kind: QA
    purpose: Whether, after an Edit, Write or MultiEdit of a file under .guppi/ in the repository of GUPPI,
      the hook guppi codewrite names to the agent each pointer outside its bracket and each bare case
      number of that file by the judgment of the live code test, and gives no line on a clean file, on
      a file outside .guppi/ or on a call of another tool
    method: uv run --project .guppi pytest .guppi/tests/test_ship.py -k code_write_names
    tags:
    - ci
    - hooks
    - plugin
    type: estimate
  sections:
    Criterion: 'When:

      An Edit, Write or MultiEdit call writes a file under `.guppi/` in the repository of GUPPI, and the
      `PostToolUse` hook `uv run --project .guppi guppi codewrite` of `.guppi/guppi/codewrite.py` runs;
      or `.guppi/tests/test_ship.py` runs that hook over a payload of such a call in a temporary project.


      Then:

      The hook reads the file as written and runs over it `live_code` of `.guppi/guppi/ship.py`, the judgment
      that the live code test of `.guppi/tests/test_ship.py` runs too.

      **＋** For each pointer outside a bracket of its own and each bare case number in a comment or a
      docstring of the file, it gives the agent a line with the file, the line and what it found, in `hookSpecificOutput.additionalContext`
      beside the result of the tool.

      **＋** With those lines it gives one line on the fix: a bracket of its own at the end of the sentence,
      or the sample `case N`.

      **＋** `live_code` leaves out each file of `LEFT_OUT` and `NOT_CLEANED` of `.guppi/guppi/ship.py`
      and each file outside `.guppi/`, and the live code test of `.guppi/tests/test_ship.py` takes its
      lines from it.

      **－** A file with no such line, a file outside `.guppi/` and a call of another tool get no line.

      **－** The hook refuses no call and exits 0; a payload or a file it cannot read gives one line on
      stderr.'
  status: passed
