      The person judged otherwise: the root holds every file of the repository, git applies its `.gitignore`
      to every file under it, and the build already counted `.guppi/`, two levels up. Case 1025.1 sets
      the one-time check `failed` by the person''s decision. Its Criterion is written back unchanged.
