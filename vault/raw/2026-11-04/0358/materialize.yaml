- case: '1028.1'
  decision: decision-case-1028.1
  origin: raw/2026-11-04/0358/ledger.md#case-1028.1
  targets:
  - kind: create
    category: estimates
    slug: estimate-clean-branch-names-a-pointer-at-the-write
    ref: rule-clean-branch
  - kind: update
