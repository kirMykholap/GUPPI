  tags:
  - hooks
  - harness
  - workflow
  case_text:
    given: '`rule-spec-write`: the rule of the `Stop` hook that writes the plan file.

      **＋** `.guppi/guppi/ratified.py`: the hook, which gains the map and the mode `--map`.

      **＋** `.guppi/tests/test_ratified.py`: the tests of the hook.

      **＋** `.guppi/guppi/prespec.py`: the home of `STOP_LINE`, the one judgment of a stop line.

      **＋** `.guppi/guppi/generate.py`: the home of `READ_LINE`, the one judgment of a read line.

      **＋** `.guppi/guppi/materialize.py`: `split_cases`, the reader of the Cases of the plan and of `spec.md`.

      **＋** `estimate-spec-write-writes-the-map`: the new check of the map.'
    when: 'The `Stop` hook `uv run --project .guppi guppi ratified` of `.guppi/guppi/ratified.py` writes,
      places or removes a Case in the plan file of the session.

      **＋** Or `uv run --project .guppi guppi ratified --map <file> --session <stamp>` runs on a file
      that holds Cases.'
    then: 'Right under its title line, the plan file holds a map of the Cases it holds, rebuilt from them
      at each such run.

      **＋** The map opens with a table of one row per top-level Case: its id, its name, and the number
      of open `stop:` lines and of open `read` lines of the Case and its sub-cases.

      **＋** A Mermaid diagram follows, with one node per Case and sub-case in the order of the plan, an
      edge from each top-level Case to the next and from a parent to each of its sub-cases, and ⛔ on the
      node of a Case that holds an open `stop:` line.

      **＋** Then each Case and sub-case has an entry: 🧩 with its id and its name, the path of its case
      file, and each line of its `tasks` block without its box and sub-points, with ✅ before a ticked
      line, ⛔ before an open `stop:` line and 🔍 before an open `read` line.

      **＋** A `create`, `update`, `delete` or `defer` line carries the `purpose`, the `change` or the
      `impact` of its item, and a `read` line carries the `purpose` of the `create` of the same Estimate
      in the Case.

      **＋** The Cases under `## Deferred` stand in the map by id and name.

      **＋** `--map` prints the same map of the Cases of `<file>`, reads no payload and writes no file.

      **－** No line of the map opens with a box, with a Case heading or with `# `, and no line of it is
      `## Deferred`, so `split_cases` of `.guppi/guppi/materialize.py`, the tickers and `place` of `.guppi/guppi/ratified.py`
      read the plan file and `spec.md` as before, and a Case placed after the approval goes before the
      `## Deferred` of its document, never into the map.'
    context: 'When Plan Mode ends, Claude Code shows the plan file. The `Stop` hook of `rule-spec-write`
      writes each ratified Case into that file whole, so the person gets every `context`, `recommend`,
      `given`, `then` block and task of every Case. In this session two Cases already fill a long document.
      The person asked for a short map that is easy to read, with signs on it and on the Frontier. The
      person first chose to move the whole Cases into `spec.md` from the first ratified Case, with the
      stamp line of `rule-spec-capture` marking the approval (Q1, Q5). The frame then showed what that
      move costs. A Grep `(?i)the plan file|into the plan|in the plan\b|of the plan\b|the plan''s|from
      the plan` over `vault/wiki/estimates` printed 66 files. Among them, the Criteria of `estimate-spec-write-copies-the-ratified-case`,
      `estimate-prespec-hook-gates` and `estimate-case-check-takes-a-case-built-again-from-its-file` say
      that the plan file holds the Cases. So the person chose (Q9 c) to put the map at the head of the
      plan file, with the whole Cases under it as today. The move into `spec.md` is the Frontier item
      C6, for a later session. That item needs the whole Cases to go into `spec.md` from the first ratified
      Case, the approval marked by the stamp line, and the map to stay in the plan file. To the person''s
      question at Q5: the same `Stop` hook builds the map from the Cases it writes, and no agent judges
      anything for it.


      Choices of form. The person widened Q2 to a short description of each task and stop. `case-schema.md`
      forbids a second wording of a signed Case, so every word of the map is cut from the Case. An item
      line takes the `change` of its `update`, the `purpose` of its `create` or `defer`, or the `impact`
      of its `delete`. A `read` line takes the `purpose` of the `create` of the same Estimate in the Case.
      A `stop:` line or a line of a file is its own description. The table has one row per top-level Case,
      so that it stays short. The preview of Q4 is printed by a new mode `--map` of the hook. It needs
      `--session`, the way `caseid` and `prespec --check` take the session, so that the map names each
      case file. The main agent saves the preview outside the repository, so no new file enters a folder
      of the repository. The person asked to try the Mermaid diagram and to fall back on the signs if
      it does not draw (Q3). The signs stand in the map in any case. `estimate-spec-write-shows-the-map-in-the-plan-view`
      reads the diagram at the next exit of Plan Mode, and where that reading fails, a Case of a later
      session removes the diagram. That reading is of the plan view of the VS Code extension alone. `insight-plugin-cli-withholds-approval-of-a-long-plan`
      records that the Claude Code CLI withholds the approval of a plan above the size it can show, while
      the VS Code extension approves the same plan, and `rule-skill-approve-spec` gives the CLI its way
      around, `/approve-spec`. The map makes the plan file longer, so in the CLI a plan with the map is
      approved by `/approve-spec`, as a long plan is today, and the CLI view stands as those two pages
      leave it. The sign of a question to the person is ❓, the person''s choice (Q8). Emojipedia lists
      no blue question mark, only the red ❓ and the white ❔. Four sub-cases are four promises that can
      fail apart: the map the hook writes (1078.1), the map as the plan view shows it (1078.2), the signs
      of the Frontier in the replies that `orchestration.md` sets (1078.3), and the signs in the first
      reply of `/hi` that `rule-skill-hi` sets (1078.4).


      The frame. A Grep `^(STOP_LINE|READ_LINE|READ|TASK_READ|TASK_LINE|ITEM_LINE)\s*=|def conserved_spec_named`
      over `.guppi/guppi` printed `box.py`, `casecheck.py`, `generate.py`, `grepguard.py`, `prespec.py`
      and `ratified.py`. `STOP_LINE` of `.guppi/guppi/prespec.py`, `` ^- \[[ xX]\] stop: ``, judges a
      stop line, open or ticked. `READ_LINE` of `.guppi/guppi/generate.py`, `` ^- \[ \] read ``, judges
