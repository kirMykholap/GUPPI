  case_text:
    context: 'When Plan Mode ends, Claude Code shows the plan file. The `Stop` hook of `rule-spec-write`
      writes each ratified Case into that file whole, so the person gets every `context`, `recommend`,
      `given`, `then` block and task of every Case. In this session two Cases already fill a long document.
      The person asked for a short map that is easy to read, with signs on it and on the Frontier. The
      person first chose to move the whole Cases into `spec.md` from the first ratified Case, with the
      stamp line of `rule-spec-capture` marking the approval (Q1, Q5). The frame then showed what that
      move costs. A Grep `(?i)the plan file|into the plan|in the plan\b|of the plan\b|the plan''s|from
      the plan` over `vault/wiki/estimates` printed 66 files. Among them, the Criteria of `estimate-spec-write-copies-the-ratified-case`,
      `estimate-prespec-hook-gates` and `estimate-case-check-takes-a-case-built-again-from-its-file` say
      that the plan file holds the Cases. So the person chose (Q9 c) to put the map at the head of the
      plan file, with the whole Cases under it as today. The move into `spec.md` is the Frontier item
      C6, for a later session. That item needs the whole Cases to go into `spec.md` from the first ratified
      Case, the approval marked by the stamp line, and the map to stay in the plan file. To the person''s
      question at Q5: the same `Stop` hook builds the map from the Cases it writes, and no agent judges
      anything for it.


      Choices of form. The person widened Q2 to a short description of each task and stop. `case-schema.md`
      forbids a second wording of a signed Case, so every word of the map is cut from the Case. An item
      line takes the `change` of its `update`, the `purpose` of its `create` or `defer`, or the `impact`
      of its `delete`. A `read` line takes the `purpose` of the `create` of the same Estimate in the Case.
      A `stop:` line or a line of a file is its own description. The table has one row per top-level Case,
      so that it stays short. The preview of Q4 is printed by a new mode `--map` of the hook. It needs
      `--session`, the way `caseid` and `prespec --check` take the session, so that the map names each
      case file. The main agent saves the preview outside the repository, so no new file enters a folder
      of the repository. The person asked to try the Mermaid diagram and to fall back on the signs if
      it does not draw (Q3). The signs stand in the map in any case. `estimate-spec-write-shows-the-map-in-the-plan-view`
      reads the diagram at the next exit of Plan Mode, and where that reading fails, a Case of a later
      session removes the diagram. That reading is of the plan view of the VS Code extension alone. `insight-plugin-cli-withholds-approval-of-a-long-plan`
      records that the Claude Code CLI withholds the approval of a plan above the size it can show, while
      the VS Code extension approves the same plan, and `rule-skill-approve-spec` gives the CLI its way
      around, `/approve-spec`. The map makes the plan file longer, so in the CLI a plan with the map is
      approved by `/approve-spec`, as a long plan is today, and the CLI view stands as those two pages
      leave it. The sign of a question to the person is ❓, the person''s choice (Q8). Emojipedia lists
      no blue question mark, only the red ❓ and the white ❔. Four sub-cases are four promises that can
      fail apart: the map the hook writes (1078.1), the map as the plan view shows it (1078.2), the signs
      of the Frontier in the replies that `orchestration.md` sets (1078.3), and the signs in the first
      reply of `/hi` that `rule-skill-hi` sets (1078.4).


      The frame. A Grep `^(STOP_LINE|READ_LINE|READ|TASK_READ|TASK_LINE|ITEM_LINE)\s*=|def conserved_spec_named`
      over `.guppi/guppi` printed `box.py`, `casecheck.py`, `generate.py`, `grepguard.py`, `prespec.py`
      and `ratified.py`. `STOP_LINE` of `.guppi/guppi/prespec.py`, `` ^- \[[ xX]\] stop: ``, judges a
      stop line, open or ticked. `READ_LINE` of `.guppi/guppi/generate.py`, `` ^- \[ \] read ``, judges
      an open read line only, so 🔍 marks an open read line, a ticked read line takes ✅ as any ticked line
      does, and the table counts the open read lines. `generate.py` holds a `TASK_LINE` of its own, ``
      ^- \[ \] (create|update|delete|defer) ``, the pattern by which its tickers find an open item line
      to tick. The map reads every task line of a Case whatever its box, and the text after the box, which
      is what `TASK_LINE` of `.guppi/guppi/ratified.py`, `` ^- \[[ xX-]\] (.*)$ ``, matches for `read_tasks`
      and `keep_boxes` of the same module, so the map uses that one. `ITEM_LINE` of `ratified.py` judges
      the kind and the slug of an item line, and `READ` of `casecheck.py` and `grepguard.py` names a tool.
      So the map imports those four patterns and holds no second copy, as `rule-one-judgment-one-implementation`
      sets it. A Grep `\[x\]` over `.guppi/guppi` printed `frontierguard.py`, `generate.py`, `prespec.py`,
      `render.py`, `sprint.py` and `sprint_close.py`. The tickers there write `- [x]` over an open box,
      `sprint.py` judges `- [x]` on the lines of a milestone, and `prespec.py` and `frontierguard.py`
      judge the box of a Frontier line. No function judges a task line of a Case as ticked, so the map
      judges it by the box of the line that `TASK_LINE` of `ratified.py` matched, `[x]` or `[X]`. `generate.py`
      imports neither `ratified.py` nor `prespec.py`, and `prespec.py` imports `ratified.py` at load,
      so `ratified.py` imports `prespec.py` inside the function, as `stop` already does. The readers of
      the plan stay right because of what the map leaves out. `split_cases` of `.guppi/guppi/materialize.py`
      reads a Case only under a heading that `CASE_HEADING`, `^#{2,4} Case (\S+)`, matches, and no heading
      of the map opens with `Case`. Through `split_cases` that covers the check of `prespec.py` (`judge`),
      the other Cases that `casecheck.py` reads from the plan (line 1035) and `spec_check` of `gate.py`.
      `conserved_spec_named` of `.guppi/guppi/box.py` reads the first line that opens with `# `, and the
      map has no such line. The tickers match only a line that opens with a box, and no line of the map
      opens with one. `place` of `ratified.py` puts a Case that has no section of its family before the
      first line `## Deferred` after the last stamp, and `place_deferred` adds that heading only where
      no such line stands. So no line of the map is `## Deferred`, and the Cases under `## Deferred` stand
      in the map on a line of the map''s own words; a map line `## Deferred` would pull a Case placed
      in Work Mode into the map. `estimate-spec-write-reaches-the-approved-spec` stands on that: its Criterion
      places such a Case "before the `## Deferred` of the last approved document", and that document now
      opens with the map. The test of 1078.1 named `approved_spec` and `map` places a Case into a `spec.md`
      whose approved document opens with the map, so both the `-k approved_spec` of that Estimate and
      the `-k map` of the new one run it and keep the Criterion true. At the approval, `append_plan` of
      `.guppi/guppi/spec.py` copies the plan text, so `spec.md` holds the map at the head of each approved
      document. The writer later places only Cases there, so that copy of the map stays as it was at the
      approval, and no reader of `spec.md` reads it. These Estimates stand, since none says that the plan
      file holds nothing but Cases: `estimate-spec-write-copies-the-ratified-case`, `estimate-spec-write-checks-the-written-case`,
      whose plan is compared with no other file, `estimate-spec-write-removes-a-superseded-case`, `estimate-spec-write-writes-a-defer`,
      `estimate-spec-capture-appends`, whose plan text the map is part of, `estimate-spec-reconcile-refuses-an-edit-of-the-plan`,
      since the hook writes the map with no tool call, and `estimate-language-spec-prose-in-english`,
      which reads only names, `context` and `problem`. A Grep `guppi ratified --guard` in the mode that
      prints paths, glob `{vault/wiki,.claude,.guppi/guppi}/**`, looked for a text that lists the modes
      of the command. It printed 9 files: `.claude/settings.json` and `rule-hook-registry`, which register
      the guard as a hook, and `--map` is none; `ledger.py`, `casecheck.py`, `estimate-spec-reconcile-refuses-a-case-file-another-agent-holds`,
      `estimate-spec-reconcile-refuses-an-edit-of-the-plan` and `estimate-spec-write-exits-2-on-an-error`,
      which speak of the guard alone; `log.md`; and `ratified.py`, whose docstring and parser the task
      changes.


      The signs of the Frontier. `FRONTIER_LINE` of `.guppi/guppi/generate.py`, `^- \[([ x-])\] (\S+)(.*)$`,
