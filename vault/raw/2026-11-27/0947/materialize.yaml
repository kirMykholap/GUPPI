  case_text:
    context: 'The person gave a link to an Excalidraw board, the first sketch of GUPPI, and asked that
      `README.md` show it as it is, with a note that GUPPI started from it and that it shows only roughly
      how GUPPI is built. A WebFetch of the link moved to `app.excalidraw.com`, and the page it got held
      only the word "Excalidraw+", since the board is drawn by script; so `case-guppi` could not read
      the board and makes no claim on what it shows. GitHub draws no Excalidraw board inside a page, so
      the person chose an exported picture stored in `plugin/assets/`, beside the logo that `README.md`
      already shows from there, with the link to the board under it, in a section of its own after "Main
      parts". The person exported the board to `plugin/assets/GUPPI.png`, which git does not track yet;
      the Case keeps that name and the file as it stands, a choice of form, so no second copy stays in
      the folder, and the task commits it, since `dirty` of `.guppi/guppi/gate.py` runs `git status --porcelain`
      over the whole tree and a file left untracked would block `/handoff` (finding of `/pre-spec`). `README.md`
      is listed in `code_ref` of `entity-guppi-repository`, so that page holds the change; the picture
      path is added to that field. The new check `estimate-guppi-repository-readme-shows-the-first-sketch`
      is a promise of its own, so `estimate-guppi-repository-readme-shows-the-path-of-a-decision` stands:
      its Criterion speaks of the terms, the Mermaid path and the example question, not of the board.
      `estimate-sprint-plugin-readme-describes-the-project` passed and stands: its Criterion names what
      `README.md` says, not a closed list of its sections, so a new section makes none of its lines false.
      The other Estimates of `entity-guppi-repository` speak of the remote, the license and the merge
      tasks, so they stand. A Grep for `plugin/assets|assets` over `.guppi/guppi/`, `.claude/` and `vault/wiki/rules/`
      printed one file, `vault/wiki/rules/rule-clean-branch.md`: its Purpose says that `plugin/assets/`
      holds the two pictures the icon is made from, which a third picture makes false, so the Case changes
      that sentence; `rule-clean-branch` has `plugin/assets` in `implementation_ref` already. `estimate-clean-branch-leaves-out-the-source-pictures`
      stands: its Criterion says that the clean version holds no file of `plugin/assets/` and that the
      repository holds the two named pictures, both still true with a third file, and its test `test_the_repository_keeps_the_source_pictures_in_plugin_assets`
      checks only those two names. The copy that `guppi ship` builds holds neither `README.md` nor any
      file of `plugin/assets/`: `ROOT_FILES` of `.guppi/guppi/ship.py` names `CLAUDE.md`, `.gitattributes`
      and `LICENSE`, its walk `tree_files` runs only over `TREES`, `.guppi` and `.claude`, and over `plugin/skills`,
      and the module writes no file of `plugin/` at its own path. A Grep for `os\.walk|rglob|\.glob\(|iterdir`
      over `.guppi/` printed 77 hits in 31 files; `case-guppi` read only `tree_files` of them, and the
      run of `ask-guppi` for `/pre-spec` read `named_files` of `.guppi/guppi/casecheck.py` and `callers`
      of `.guppi/tests/test_guppi_package.py` and found that neither takes a file of `plugin/assets/`.
      A Grep for `plugin` over `.guppi/guppi/`, `.claude/` and `vault/wiki/rules/` printed 84 hits in
      23 files; most name the sprint `plugin` or the plugin `guppi`, and a narrower Grep of the same paths
      for the folder `plugin/` printed hits only in `.guppi/guppi/ship.py`, `vault/wiki/rules/rule-clean-branch.md`
      and `vault/wiki/rules/rule-plugin-install.md`: `ship.py` takes from `plugin/` only the two files
      of `PLUGIN_FILES` and the files under `plugin/skills/`, and `--check` judges only those, so no reader
      there takes every file of `plugin/` and the new picture makes none wrong; `rule-plugin-install`
      names `.claude-plugin/` of the clean version, not this folder. Neither `plugin/` nor `plugin/assets/`
      holds a `.gitignore`, and the root `.gitignore` holds no pattern that matches the new file. A Glob
      `vault/**/*first-sketch*` printed nothing, so the slug is free. The pair on `rule-clean-branch`
      was set against the whole sentence of its Purpose that names `plugin/assets/`, read in the page;
      the rest of that sentence, that `guppi ship` writes no file of the folder and `--check` judges none,
      holds for the third picture too. The other Estimates of `rule-clean-branch`, and the pages and code
      that name `rule-clean-branch`, `ship.py` or `guppi ship`, speak of what the clean version holds,
      of pointers, of the install and of the hooks, and not of the files of `plugin/assets/` or of `README.md`,
      by their purpose lines, so they stand. Case 1077 of this session names `plugin/assets/GUPPI.png`
      as where the picture stands and closes the Frontier line of the export, which agrees with this Case;
      Cases 1078 and 1079 name none of the files or pages this Case changes.'
    problem: '`README.md` does not show the first sketch of GUPPI, and the person wants it there as history,
      marked as a rough picture.'
    recommend: "- **How the board stands in README.md**\n  - Recommended: (a) a picture exported into\
      \ `plugin/assets/` and the link to the board under it.\n  - Answer: (a).\n- **Where the board stands\
      \ in README.md**\n  - Recommended: (a) a short section of its own after \"Main parts\".\n  - Answer:\
      \ (a).\n- **How we check that it is done**\n  - Recommended: (a) a new check of its own, read by\
      \ the person.\n  - Answer: (a)."
    given: '`README.md`: the front page of the repository, which gets the new section.

      **＋** `plugin/assets/GUPPI.png`: the picture of the board that the person exported.

      **＋** `https://link.excalidraw.com/l/9tRP8fIyCPi/4Jt5sJbxujf`: the Excalidraw board of the first
      sketch, which the person gave.

      **＋** `entity-guppi-repository`: the page whose `code_ref` lists the files of the repository.

      **＋** `rule-clean-branch`: the rule whose Purpose names the pictures of `plugin/assets/`.

      **＋** `estimate-guppi-repository-readme-shows-the-first-sketch`: the new check of the section.'
    when: The person reads `README.md` at the root of the branch of the session whose Work Mode wrote
      its new section.
    then: 'A section after "Main parts" shows the picture `plugin/assets/GUPPI.png` of the first sketch
      of GUPPI.

      **＋** The section links to the Excalidraw board `https://link.excalidraw.com/l/9tRP8fIyCPi/4Jt5sJbxujf`
      under the picture.

      **＋** The section says that GUPPI started from this sketch and that it shows only roughly how GUPPI
      is built.

      **＋** The person says that the section shows the sketch as intended.

      **－** No section that `README.md` holds today is removed.'
