  case_text:
    given: '`rule-orchestration`: the rule of what the main agent does with the Frontier.

      **＋** `vault/wiki/orchestration.md`: the file rendered from it.

      **＋** `raw/<date>/<hi HHMM>/frontier.md`: the Frontier of the session, whose `## Ask` gets the line.

      **＋** `vault/wiki/where-to-stop.md`: the stop before a `stop:` task, which does not change.

      **＋** `estimate-orchestration-keeps-a-stop-line-on-the-frontier`: the new check of the line.'
    when: 'A Case or a sub-case is ratified, in Plan Mode or in Work Mode, and the summary of its `case-guppi`
      holds a line `**From the person:**`, with `vault/wiki/orchestration.md` rendered from `rule-orchestration`.

      **＋** Or the person gives, in Plan Mode or at the stop in Work Mode, the thing that an open line
      of the source `stop` of `raw/<date>/<hi HHMM>/frontier.md` waits for.'
    then: 'Before the reply that acknowledges the Case, the main agent writes under `## Ask` of `raw/<date>/<hi
      HHMM>/frontier.md` one line `- [ ] A<n> — case N — <what the person gives> · stop` for each such
      summary line, N the Case or sub-case of the task.

      **＋** The reply shows that line in its Frontier.

      **＋** A Case ratified again keeps the line it has and gets no second one.

      **＋** The main agent closes the line `[x] … · stop · work` when it sees the thing: a file when a
      `Read` or a `Glob` of the path the line names finds it, data when the person''s message holds it,
      and an action on the person''s word that it is done.

      **＋** The close of such a line writes no reading into the ledger.

      **－** Work Mode still stops before the `stop:` task, as the fourth condition of `vault/wiki/where-to-stop.md`
      sets it, whether the line is closed or not.'
    context: 'A task that opens with `stop:` waits for something from the person: a file, some data or
      an action. The fourth condition of `vault/wiki/where-to-stop.md` stops Work Mode before such a task
      and runs it after the person''s word, so the task cannot run without the thing. Plan Mode does not
      show the wait, so the person learns of it only at the stop. Case 1076 raised the item: as it was
      first ratified, its task `stop: the person gives the board exported as a PNG file.` had no line
      on the Frontier. Since the person put the picture in place, Case 1076, built again, holds no `stop:`
      task. The person chose this design. `case-guppi` names each such wait in its summary (1077.1). The
      main agent keeps one line per wait under `## Ask` of `frontier.md` until it sees the thing (1077.2).
      `/carry` leaves such a line out of the brief (1077.3). `/pre-spec` names an open line in its report
      and blocks nothing (1077.4). The frame of the brief in `rule-brief`, which `/carry` follows, says
      the same for its short shape (1077.5). Work Mode still stops before the task. By the answer to Q6
      the main agent already added the line for Case 1076 by hand, so no task of this Case adds it: line
      24 of `vault/raw/2026-11-27/0947/frontier.md` holds A2 for Case 1076, the board exported as a PNG
      file, with the source `stop`, now closed `[x] … · stop · work`. A Glob `plugin/assets/*.png` printed
      `logo_guppi.png`, `icon_guppi.png` and `GUPPI.png`: the picture stands at `plugin/assets/GUPPI.png`,
      not at the path the line names.


      Choices of form. The five sub-cases are five promises that can fail apart; 1077.3 and 1077.5 each
      replace one Criterion, since one sub-case replaces no more than one. The source segment of the line
      is `stop`, and the source is never `case N`: `open_box_closers` of `.guppi/guppi/prespec.py`, which
      the hook of `.guppi/guppi/frontierguard.py` imports in `run`, refuses an open line whose last segment
      after ` · ` matches `CLOSERS`, and `case N` matches it. `stop` is no closer, so the open line passes,
      and `[x] … · stop · work` passes `line_closer` and the box check of `check_frontier`. `open_case_items`
      skips the open lines under the headings of `OPEN_LISTS`, which holds `## Ask`, and `check_frontier`
      skips each open line, so `guppi prespec --check` reports none and its hook refuses no exit for one.
      The summary label is `**From the person:**`. The words `Waiting:` and `STOP:` already have other
      uses. Each new Estimate reads the new Render in the Spec at Retro, as the passed Estimates of these
      rules do. The new Criterion of `estimate-carry-over-writes` is written under `sections`, because
      the `when` and `then` of 1077.3 hold only the change. Its `method` now waits for a `/carry` with
      a stop line open, since this session runs no `/carry`. The new Criterion of `estimate-brief-written`
      is written under `sections` for the same reason. The check notes that a few old lines of these two
      Criteria are not carried word for word. These are the lines this change rewrites: the `Ask the person`
      part and the last line of `estimate-carry-over-writes`, and the line on the brief of `carry` of
      `estimate-brief-written`. Each stands in the new Criterion in its new words, and every other line
      is carried as it was.


      The frame. Some Criteria speak of the Frontier, the summary or the report and stand, since each
      lists parts and claims no part is the last:

      `estimate-orchestration-acknowledging-reply` already shows each open line on its own line.

      `estimate-orchestration-shows-the-built-case` lists the summary lines and does not say the list
      is closed.

      `estimate-prespec-reconciles` and `estimate-prespec-gathers-the-answers-after-findings` list what
      the report holds and what follows it.

      `estimate-where-to-stop-stops-only-on-its-conditions` stands, since the stop does not change. Criterion
      line 29 of `estimate-hi-writes-frontier`, and the same sentence of `.claude/skills/hi/SKILL.md`,
      say that an `A` line closes at `/hi`, in Work Mode or at Retro. Both stand: they speak of the lines
      that `/hi` writes from the brief, and `orchestration.md` sets the stop line. Line 24 and line 29
      of the Criterion of `estimate-carry-over-writes` would become false, so 1077.3 replaces that Criterion.
      The `/carry` text copies each open `A` line with its Estimate, and the next `/hi` closes such a
      line with a reading. That is why the person chose to keep a stop line out of the brief. Line 39
      of `rule-brief` says that the short shape takes the open `A` lines in `Ask the person`, and line
      27 of the Criterion of `estimate-brief-written` says the same; both would become false, so 1077.5
      changes them. The note of the check of this file listed other files. These stand, judged by their
      purpose or their text:

      `estimate-orchestration-shows-the-frontier-after-a-closed-line`, whose `When` gives examples of
      a closed line and does not give a full list.

      `estimate-prespec-checks-the-frontier`, whose closers the line of the source `stop` keeps.

      `estimate-case-build-writes-the-case`, whose summary list already admits the line `**Other Case:**`
      under an item.

      `estimate-hi-takes-its-readings` and `estimate-orchestration-closes-a-line-by-what-its-case-does`,
      which speak of the readings of `/hi` and of sprint and backlog lines.

      `rule-frontier-hook`, whose code is read above.

      `rule-prespec-onward`, whose hook waits only on the open lines that `open_case_items` gives.

      `estimate-spec-box-runs-a-conserved-spec`, whose Criterion speaks of the branches, the merges and
      the librarian of `/box`, and not of its tasks; `/box` calls `/work`, which loads `vault/wiki/where-to-stop.md`,
      so it halts before a `stop:` task.

      `estimate-brief-carries-the-run-facts` and `estimate-sprint-close-next-session-opens-the-sprint`,
      which speak of the brief of the librarian, not of the short shape.


      The other listed files speak of other things. The note also listed `vault/raw/2026-11-27/0947/cases/case-1078.md`
      and `vault/raw/2026-11-27/0947/cases/case-1079.md`, and the files of Cases 1076, 1078 and 1079 were
      read whole once their builds ended. 1078.3 changes the same sentence of `rule-orchestration`, the
      one on a reply that closes a Frontier line with no ratification and no defer. Its anchor is the
      words on the checklist of that reply, while the pair of 1077.2 changes the words on an `A` line
      closed by the person''s answer, so each anchor still hits once. Read side by side, the two new texts
      fit: 1077.2 lets that reply close a stop line, and 1078.3 gives the lines it shows their signs,
      ⛔ for an open `A` line of the source `stop` and ✅ for a closed one. The other pairs of 1078.3 and
      1077.2 change other sentences. The context of 1078 counts three pairs of 1077.2 and reads that pair
      beside its own, and both hold. The stop tasks of 1079 fit 1077.1 and 1077.2, as its context says:
      its clone stop waits only for a word before a command, and its session stops wait for an action
      of the person. 1076 now keeps the picture at `plugin/assets/GUPPI.png` and holds no `stop:` task.


      The searches. A Grep `\*\*Sibling:\*\*`, glob `{vault/wiki,.claude,.guppi/guppi}/**`, looked for
      a summary line that already stands in the list. It printed six files: `vault/wiki/orchestration.md`
      and `.claude/agents/case-guppi.md`, which 1077.2 and 1077.1 change through their rules; `vault/wiki/rules/rule-orchestration.md`
      and `vault/wiki/rules/rule-case-build.md`; and `estimate-orchestration-rechecks-a-sibling-after-a-joint-send`
      and `estimate-case-build-reads-no-sibling-file-mid-send`, which speak of the Sibling step alone
      and stand. A Grep `· brief` over the same glob looked for a Frontier source. It printed `.claude/skills/hi/SKILL.md`,
      `vault/wiki/rules/rule-skill-hi.md` and `estimate-hi-writes-frontier`, which set the forms `/hi`
      writes and stand for the reason above. A Grep of `.guppi/tests/` for `orchestration\.md|case-guppi\.md|skills/pre-spec|skills/carry|rule-carry-over|rule-prespec\b`
      printed five files: `test_prespec.py`, `test_config.py`, `test_casecheck.py`, `test_onward.py` and
      `test_orchestration.py`. `test_orchestration.py` reads the live `orchestration.md`, but only its
      showing and defer examples, which this Case leaves as they are. The other four name the paths or
      the slugs in strings and read no changed text. A Grep of `.guppi/tests/` for `librarian-guppi\.md|rule-brief\b`
      printed only `test_guppi_package.py`, whose `librarian_commands` reads only the commands of the
      frontmatter of `.claude/agents/librarian-guppi.md`, which 1077.5 leaves as they are. A Glob `vault/**/*stop-line*`
      printed only `lesson-onward-stop-line-before-a-showing-breaks-its-form`, and a Glob `vault/**/*for-the-person*`
      printed nothing, so the three new slugs are free.


      Not set here. The line of a Case that is taken back stays open, and it blocks nothing. The session''s
      ledger holds no `error` lesson to address.'
