      checklist" and nothing of the words of a line. `rule-case-protocol` and `case-schema.md` speak of
      the checklist of `tasks`. `orchestration.md`, `rule-orchestration`, `rule-skill-hi` and `estimate-hi-writes-frontier`
      this Case changes, and `log.md` is not read. 1077.2 changes `rule-orchestration` by three pairs,
      and the two `old` texts of 1078.3 overlap none of its anchors, so each still hits once after 1077.2.
      A Grep over `.guppi/tests` for `skills/hi|skills" / "hi|"hi" / "SKILL|orchestration\.md|rule-skill-hi|rule-orchestration\.md`
      printed `test_guard.py`, `test_lint.py`, `test_onward.py`, `test_orchestration.py`, `test_prespec.py`,
      `test_ratified.py`, `test_recall.py` and `test_ship.py`. `test_orchestration.py` reads the live
