  text: decision[case 1077.5][update][estimate-brief-written]{ref:rule-brief}
  case: '1077.5'
  kind: update
  slug: estimate-brief-written
  origin: raw/2026-11-27/0947/ledger.md#case-1077.5
  decision: decision-case-1077.5
  ref: rule-brief
  category: estimates
  set:
    status: pending
  sections:
    Criterion: 'When:

      The librarian rewrites `vault/wiki/brief.md` at the end of its run.


      Then:

      The brief holds, in order: Where things stand, Readings due, Flags, Next session, Readings at the
      close.

      **＋** It holds no Deferred list and no cap on deferred items; they stand in `vault/wiki/backlog.md`.
      Where things stand, Readings due and Readings at the close are as before, and Readings due takes
      from each Estimate page its `status`, `target` and `method`, and from the target rule its `status`.

      **＋** Flags keep their kinds of lines — marked entries, failed Estimates, MOC candidates, stale
      defers, contradictions, the lint output — and a read that the librarian''s frame says its job does
      not need, with what was read, the part of the job it served, and the handoff when the handoff asked
      for it.

      **＋** Next session holds `Cases`, `Work` and `Ask the person`, one line per item, an item in one
      list only, a list with no item the line "none". `Cases` is what needs a decision: after a run whose
      `guppi sprint-close --apply` moved the sprint page, first the line `open the next sprint — no sprint
      is open since the close of <id>`; a line of `## For the next session` of `handoff.md`, a handoff
      flag with a question or a request to change the sprint, a `failed` Estimate, each contradiction
      of Flags, one between pages that stand in `vault/archive/` too, a defect the librarian found, with
      what and from where; and, for each line of `## Debt` of `handoff.md` that names an Estimate whose
      reading cannot be taken yet, but one of the live sprint page, one whose `method` names the close
      of a sprint and one whose `method` waits for an event the librarian has not seen, one line that
      names the Estimate by slug and proposes to defer it into `vault/wiki/backlog.md`.

      **＋** `Work` is what is done without a decision: every `pending` reading of Readings due by its
      slug but one that `Ask the person` holds, one of an Estimate whose `target` is the live sprint page
      `entity-sprint-<id>`, one whose `method` names the close of a sprint — the session that closes a
      sprint, its librarian''s run or the session after it —, one whose `method` waits for an event the
      librarian has not seen, one that a line of `Cases` proposes to defer and one of an Estimate with
      `deferred_by`; the unticked boxes of the Specs but the `read` box of such a reading; a ledger line
      this run did not apply, a dirty tree.

      **＋** `Ask the person` holds each line of `## Ask the person` of `handoff.md` — the Estimate by
