      is what `TASK_LINE` of `.guppi/guppi/ratified.py`, `` ^- \[[ xX-]\] (.*)$ ``, matches for `read_tasks`
      and `keep_boxes` of the same module, so the map uses that one. `ITEM_LINE` of `ratified.py` judges
      the kind and the slug of an item line, and `READ` of `casecheck.py` and `grepguard.py` names a tool.
      So the map imports those four patterns and holds no second copy, as `rule-one-judgment-one-implementation`
      sets it. A Grep `\[x\]` over `.guppi/guppi` printed `frontierguard.py`, `generate.py`, `prespec.py`,
      `render.py`, `sprint.py` and `sprint_close.py`. The tickers there write `- [x]` over an open box,
      `sprint.py` judges `- [x]` on the lines of a milestone, and `prespec.py` and `frontierguard.py`
      judge the box of a Frontier line. No function judges a task line of a Case as ticked, so the map
      judges it by the box of the line that `TASK_LINE` of `ratified.py` matched, `[x]` or `[X]`. `generate.py`
      imports neither `ratified.py` nor `prespec.py`, and `prespec.py` imports `ratified.py` at load,
      so `ratified.py` imports `prespec.py` inside the function, as `stop` already does. The readers of
      the plan stay right because of what the map leaves out. `split_cases` of `.guppi/guppi/materialize.py`
      reads a Case only under a heading that `CASE_HEADING`, `^#{2,4} Case (\S+)`, matches, and no heading
      of the map opens with `Case`. Through `split_cases` that covers the check of `prespec.py` (`judge`),
      the other Cases that `casecheck.py` reads from the plan (line 1035) and `spec_check` of `gate.py`.
      `conserved_spec_named` of `.guppi/guppi/box.py` reads the first line that opens with `# `, and the
      map has no such line. The tickers match only a line that opens with a box, and no line of the map
      opens with one. `place` of `ratified.py` puts a Case that has no section of its family before the
      first line `## Deferred` after the last stamp, and `place_deferred` adds that heading only where
      no such line stands. So no line of the map is `## Deferred`, and the Cases under `## Deferred` stand
      in the map on a line of the map''s own words; a map line `## Deferred` would pull a Case placed
      in Work Mode into the map. `estimate-spec-write-reaches-the-approved-spec` stands on that: its Criterion
      places such a Case "before the `## Deferred` of the last approved document", and that document now
      opens with the map. The test of 1078.1 named `approved_spec` and `map` places a Case into a `spec.md`
      whose approved document opens with the map, so both the `-k approved_spec` of that Estimate and
      the `-k map` of the new one run it and keep the Criterion true. At the approval, `append_plan` of
      `.guppi/guppi/spec.py` copies the plan text, so `spec.md` holds the map at the head of each approved
      document. The writer later places only Cases there, so that copy of the map stays as it was at the
      approval, and no reader of `spec.md` reads it. These Estimates stand, since none says that the plan
      file holds nothing but Cases: `estimate-spec-write-copies-the-ratified-case`, `estimate-spec-write-checks-the-written-case`,
      whose plan is compared with no other file, `estimate-spec-write-removes-a-superseded-case`, `estimate-spec-write-writes-a-defer`,
      `estimate-spec-capture-appends`, whose plan text the map is part of, `estimate-spec-reconcile-refuses-an-edit-of-the-plan`,
      since the hook writes the map with no tool call, and `estimate-language-spec-prose-in-english`,
      which reads only names, `context` and `problem`. A Grep `guppi ratified --guard` in the mode that
      prints paths, glob `{vault/wiki,.claude,.guppi/guppi}/**`, looked for a text that lists the modes
      of the command. It printed 9 files: `.claude/settings.json` and `rule-hook-registry`, which register
