      so the list of signs stood in two wordings; 1078.4 now points to the signs of `orchestration.md`
      and lists none, and its promise is only that the first reply of `/hi` takes them. The finished file
      of Case 1077, read whole once its build ended, keeps the three pairs of 1077.2 in `rule-orchestration`.
      Their anchors are the words on the line `**Sibling:**`, the words `` an `A` line by the person''s
