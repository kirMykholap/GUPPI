  sections:
    Criterion: 'When:

      The client compacts the context of a session, on the person''s command or on its own, and `SessionStart`
      fires with `source: compact` and runs `.guppi/guppi/recall.py`.


      Then:

      With a `hi` in the session''s window, stdout holds a header line, "recall: the context was compacted
      at HH:MM:SS; the session is" followed by the session folder under the vault, such as `raw/<date>/<hi
      HHMM>/`, and "Read before the next reply:". Then comes one path per line: the `@` files of `.claude/skills/hi/SKILL.md`
      in their order, the session''s `frontier.md` when it exists, and the Spec when one exists. Last
      come the line `Frontier:` and the text of `frontier.md` as it stands.

      **＋** The Spec is the `spec.md` of the folder, or before the approval the plan file the event log
      names last and, on the next line, the Cases file `<plan stem>.cases.md` beside it when it stands,
      by `plan_cases_file` of `.guppi/guppi/ledger.py`.

      **＋** The list of paths is the `@` lines of the skill file at the moment the hook fires, with no
      copy in the code: a file added to those lines is in the list without a change to the hook.

      **＋** The texts of the files, the Frontier apart, are not printed, only the paths; the output stays
      under 10,000 characters.

      **－** Before the approval, with no Cases file beside the plan file, the plan file alone is named.

      **－** Without a `hi` in the window, nothing is printed on stdout, and the exit is 0.

      **－** Another `source` gives nothing: the matcher keeps the hook from firing, and the code checks
      `source` itself.

      **－** Exit 0 always; an error prints nothing and blocks nothing; the hook writes no file and no
      event line — `session-start compact` is written by `guppi event`.'
