  text: decision[case 1087.2][update][estimate-spec-write-rebuilds-the-maps-of-the-spec]{ref:rule-spec-write}
  case: '1087.2'
  kind: update
  slug: estimate-spec-write-rebuilds-the-maps-of-the-spec
  origin: raw/2026-11-27/2214/ledger.md#case-1087.2
  decision: decision-case-1087.2
  ref: rule-spec-write
  category: estimates
  set:
    status: pending
  sections:
    Criterion: 'When:

      The agent''s `Edit`, `Write` or `MultiEdit` of a `spec.md` in a session folder `vault/raw/<date>/<HHMM>/`
      ends, and `uv run --project .guppi guppi ratified --boxes` of `.guppi/guppi/ratified.py` runs on
      its `PostToolUse`.

      **＋** Or the `Stop` hook `uv run --project .guppi guppi ratified` writes, places or removes a Case
      or a defer in `raw/<date>/<hi HHMM>/spec.md`.


      Then:

      Each approved document of that `spec.md` that holds a map has its map rebuilt from the Cases and
      the boxes of that document, in the form of the map of the plan file.

      **＋** A document that holds no map gets none.

      **＋** The line that opens each map of `spec.md` says that each box copies the box of its task line
      below and is no task of its own; the line that opens the map of the plan file names its Cases file
      `<plan stem>.cases.md` in place of below.

      **＋** After an edit of the `spec.md` of the session''s own folder, `--boxes` also rebuilds the map
      of the plan file of the session, with its boxes taken from that `spec.md`.

      **＋** `--boxes` refuses no call, prints nothing on stdout and exits 0; an error gives one line on
      stderr.

      **－** `--boxes` changes no file after an edit of any other file.'
  change: the Criterion replaced whole — the head line of the map of the plan file names its Cases file
  applied: 00:25:41
- line: 10
  text: decision[case 1087.3][update][estimate-spec-write-copies-the-ratified-case]{ref:rule-spec-write}
  case: '1087.3'
  kind: update
  slug: estimate-spec-write-copies-the-ratified-case
  origin: raw/2026-11-27/2214/ledger.md#case-1087.3
  decision: decision-case-1087.3
  ref: rule-spec-write
  category: estimates
  set:
    status: pending
    purpose: The ratified Case enters the Cases file beside the plan file in the words of the stored answer
      of case-guppi, the then block built from the sub-points, each block fenced by its content
    method: uv run --project .guppi pytest .guppi/tests/test_ratified.py -k write
  sections:
    Criterion: 'When:

      The `Stop` hook `uv run --project .guppi guppi ratified` runs after a reply whose `LEDGER` block
      holds `- decision[case N]` lines of a kind other than `defer`; it reads `<plan>.checked.json` beside
      the plan file for the text stored under Case N, and the session''s transcript for the `SendUserFile`
      calls on `raw/<date>/<hi HHMM>/cases/case-<N>.md`, N the id of the top-level Case, and for the last
      earlier reply that shows Case N with at least one of its sections.


      Then:

      The hook writes the text stored under Case N into the Cases file `<plan stem>.cases.md` beside the
      plan file `plan_path` finds, never into the plan file, the section of Case N replaced when it stands,
      appended otherwise: the heading, `context`, `problem`, `recommend`, `given`, `when` and `then` as
      the store holds them; a block tagged `then` built from the sub-points of `tasks`; a block tagged
      `tasks` of the task lines without their sub-points; `ratification` is not written.

      **＋** A sub-case''s own `recommend` is written under its heading, and the `context`, `problem` and
      `recommend` of its parent come from the text stored under the parent.

      **＋** Each of the two blocks opens and closes with a fence of backticks one longer than the longest
      run of backticks that opens a line inside it, three at the least, which `tagged_blocks` of `.guppi/guppi/materialize.py`
      reads back whole; the same fence rule holds for the blocks it writes into `raw/<date>/<hi HHMM>/spec.md`
      once it stands, and for the `then` block of a short-form defer under `## Deferred`.

      **＋** No `SendUserFile` call on the file of Case N made after the time the store holds for Case
      N: exit 2 with the reason on stderr, and nothing of Case N is written.

      **＋** A last showing of Case N that differs from the stored text in a section it shows — by the
      one comparison `uv run --project .guppi guppi casecheck` makes on `Stop`, imported from `.guppi/guppi/casecheck.py`
      — a store with no Case N, or a Case N stored with findings: exit 2 with the reason on stderr, and
      nothing of Case N is written.

      **＋** A task line opening with `create`, `update`, `delete` or `defer` and the slug in its first
      code span is an item of the `then` block; its sub-points are its keys — `old` and `new` in pairs
      under `replace`, `reword old` and `reword new` under `reword`, `set`, `change`, `rename`, `sections.<Name>`,
      the fields of a `create` — each value one code span, padded by one space on each side when the value
      holds a backtick, or a fenced block under the sub-point.

      **＋** A sub-point that reads into no key `item_keys` of `.guppi/guppi/materialize.py` gives the
      kind and the category of its item, or a value that holds a backtick in an outer span not padded
      on both sides, is refused: exit 2 with `` `<key>`: not a key of <kind> <slug> `` or `` `<key>`:
      a value holding a backtick takes its outer span padded by one space `` on stderr, and nothing of
      the Case is written.

      **＋** No plan file in the event log, or a sub-point it cannot read: exit 2 with the reason on stderr.
      With `stop_hook_active` set, the hook writes and refuses as without it, as `estimate-spec-write-answers-a-refusal`
      sets it, and a reason it already gave in the stretch is not given again, as `estimate-spec-write-tells-each-reason-once`
      sets it.

      **－** A `create` or a `defer` of a category with no schema file, or of one whose schema rule a decision
      line of the session or of the reply creates or updates, is not judged by its keys.

      **－** A reply with no showing of Case N is no refusal when the file of Case N was sent after the
      store.'
  change: the Criterion replaced whole — a ratified Case is written into the Cases file beside the plan
    file, never into the plan file
  applied: 00:25:41
