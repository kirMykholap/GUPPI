      holds a decision line carrying `{supersedes:case N}`, and it has written the Case of that line in
      the same run.


      Then:

      The hook removes the section of Case N — its heading, its sections, its `then` and `tasks` blocks,
      and the sections of its sub-cases — from the Cases file `<plan stem>.cases.md` beside the plan file,
      and from the plan file where it holds them.

