  sections:
    Criterion: 'When:

      The `Stop` hook `uv run --project .guppi guppi ratified` has written a ratified Case N from the
      text stored under it into the Cases file `<plan stem>.cases.md` beside the plan file, after a reply
      whose `LEDGER` block holds the decision lines of Case N, and `raw/<hi date>/<hi HHMM>/spec.md` stands.


      Then:

      The hook writes the same stored text of Case N into `spec.md`: the heading, `context`, `problem`,
      `recommend`, `given`, `when` and `then`, the block tagged `then` and the block tagged `tasks`.

      **＋** Every section of Case N that stands in `spec.md` is replaced; a Case with no section there
