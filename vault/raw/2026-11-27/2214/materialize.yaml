      says that a line closes with the closer appended and the source kept. Its example shows the box
      `[x]` with the closer, so the line it describes stays true, and `/hi` loads `orchestration.md`,
      which now says how that line is edited. The Criterion of `estimate-hi-writes-frontier` says that
      a line closes by appending the closer and keeping the source. That is the closed line `/hi` writes,
      which the new sentence does not change, so that Criterion stands and the Estimate gets no `update`.
      The docstring of `frontierguard.py`, the Insight and `backlog.md` describe the defect, and they
      stand.


      The check''s note listed the files that name `rule-orchestration` or `orchestration.md`. I judged
      them by their purpose lines. These speak of the Frontier, and I read them. `estimate-orchestration-keeps-a-stop-line-on-the-frontier`
      (Criterion read whole) closes an `A` line `[x] … · stop · work` by what the agent sees, and does
      not say how the edit is written, so it stands. `estimate-hi-writes-frontier` (read whole) stands
      as said above. `insight-frontier-line-closed-by-the-case-built-on-its-item` (read through its Proposal)
      is about which closer a line takes and is `actioned` by case 991.1, so it stands. `estimate-orchestration-acknowledges-the-opening-with-the-frontier`
      and `estimate-orchestration-marks-the-frontier-by-signs` speak of when the Frontier is written and
      of the signs a reply shows, not of how a line is edited. Every other listed file speaks of something
      else.'
    problem: The main agent closes a Frontier line by an edit of its end alone and is refused by the guard
      each time, since the text it reads never says that the box and the closer change in one edit of
      the whole line.
    recommend: "- **What the Case does about the Insight**\n  - Recommended: (b) one sentence in `orchestration.md`\
      \ saying that a line closes by one `Edit` of the whole line, and the Insight set `actioned`.\n \
      \ - Answer: agreed, (b)."
    given: '`rule-orchestration`: the Frontier paragraph of `orchestration.md`, where the closers of a
      line are set.

      **＋** `vault/wiki/orchestration.md`: the file rendered from `rule-orchestration`.

      **＋** `rule-frontier-hook`: the guard that refuses an edit that leaves the box and the closer of
      a line apart.

      **＋** `insight-orchestration-frontier-closer-leaves-the-box-open`: the Insight this Case actions.

      **＋** `raw/<date>/<hi HHMM>/frontier.md`: the Frontier of the session, whose lines the agent closes.

      **＋** `raw/2026-11-27/2214/cases/case-1087.md`: the Case of this session that also changes `rule-orchestration`,
      the take-back of a line included.'
    when: In a working session, with `vault/wiki/orchestration.md` rendered from `rule-orchestration`,
      the main agent reads its Frontier paragraph before it closes a line of `raw/<date>/<hi HHMM>/frontier.md`.
    then: 'The Frontier paragraph of `vault/wiki/orchestration.md` says that the box and the closer of
      a line change together, in one `Edit` whose `old_string` holds the whole line, from its box, whatever
      it holds, to its end.

      **＋** The same sentence says that the hook of `rule-frontier-hook` refuses an edit of the end of
      the line alone or of its box alone.

      **－** The hook of `rule-frontier-hook` and its Estimates stay as they are.'
