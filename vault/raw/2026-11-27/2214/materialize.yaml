  case_text:
    given: '`estimate-spec-write-readers-take-the-cases-file`: the new check of the readers of the Cases
      of the plan.

      **＋** `.guppi/guppi/ledger.py`: `plan_cases_text`, the one reading of the Cases of the plan.

      **＋** `.guppi/guppi/prespec.py`: `--check` and the exit gate of Plan Mode.

      **＋** `.guppi/guppi/casecheck.py` and `.guppi/guppi/gate.py`: the check of a Case file and the gate
      of `/retro`.

      **＋** `.guppi/tests/test_ledger.py`: the tests of the readers.

      **＋** `rule-prespec-hook`: the rule of the exit gate and of `--check`.

      **＋** `rule-prespec`: the skill `/pre-spec`, rendered into `.claude/skills/pre-spec/SKILL.md`.'
    when: '`uv run --project .guppi guppi prespec --check <plan file> --session <stamp>` of `.guppi/guppi/prespec.py`
      runs, the hook of `rule-prespec-hook` judges an exit from Plan Mode, the `SubagentStop` check `uv
      run --project .guppi guppi casecheck` of `.guppi/guppi/casecheck.py` reads the other Cases of the
      session, or `guppi gate` of `.guppi/guppi/gate.py` reads the unwritten items of the session for
      `/retro`, while the Cases file `<plan stem>.cases.md` stands beside the plan file.

      **＋** Or the main agent runs the first `/pre-spec` of a session by `.claude/skills/pre-spec/SKILL.md`.'
    then: 'Each of those readers reads the Cases of the plan from the plan file and then its Cases file,
      by `plan_cases_text` of `.guppi/guppi/ledger.py`, imported, never copied.

      **＋** A Case that stands only in the Cases file is judged as a Case of the plan: `--check` prints
      its findings, the exit from Plan Mode is refused on them, a Case file that clashes with it goes
      back to `case-guppi`, and its item with no decision line is an unwritten item for `/retro`.

      **＋** `/pre-spec` dispatches `ask-guppi` with the absolute paths of the plan file and of its Cases
