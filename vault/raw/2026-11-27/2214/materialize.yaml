- case: '1087.14'
  decision: decision-case-1087.14
  origin: raw/2026-11-27/2214/ledger.md#case-1087.14
  targets:
  - kind: update
    category: estimates
    slug: estimate-compact-recall-reloads
    ref: rule-compact-recall
  tags: []
  case_text:
    given: '`rule-compact-recall`: the hook that names what to read back after a compaction.

      **＋** `.guppi/guppi/recall.py`: `spec_of` and `recall`, which name the Spec.

      **＋** `.guppi/guppi/ledger.py`: `plan_cases_file`, the path of the Cases file beside the plan file.

      **＋** `.guppi/tests/test_recall.py`: the tests of the hook.

      **＋** `estimate-compact-recall-reloads`: its Criterion is replaced whole.

      **＋** `raw/<date>/<hi HHMM>/`: the session folder, whose `frontier.md` and `spec.md` the hook names.

      **＋** `.claude/skills/hi/SKILL.md`: the `@` lines whose paths the hook names first.'
    when: 'The client compacts the context of a session, on the person''s command or on its own, and `SessionStart`
      fires with `source: compact` and runs `.guppi/guppi/recall.py`.'
    then: 'With a `hi` in the session''s window, stdout holds a header line, "recall: the context was
      compacted at HH:MM:SS; the session is" followed by the session folder under the vault, such as `raw/<date>/<hi
      HHMM>/`, and "Read before the next reply:". Then comes one path per line: the `@` files of `.claude/skills/hi/SKILL.md`
      in their order, the session''s `frontier.md` when it exists, and the Spec when one exists. Last
      come the line `Frontier:` and the text of `frontier.md` as it stands.

      **＋** The Spec is the `spec.md` of the folder, or before the approval the plan file the event log
      names last and, on the next line, the Cases file `<plan stem>.cases.md` beside it when it stands,
      by `plan_cases_file` of `.guppi/guppi/ledger.py`.

      **＋** The list of paths is the `@` lines of the skill file at the moment the hook fires, with no
      copy in the code: a file added to those lines is in the list without a change to the hook.

      **＋** The texts of the files, the Frontier apart, are not printed, only the paths; the output stays
      under 10,000 characters.

      **－** Before the approval, with no Cases file beside the plan file, the plan file alone is named.

      **－** Without a `hi` in the window, nothing is printed on stdout, and the exit is 0.

      **－** Another `source` gives nothing: the matcher keeps the hook from firing, and the code checks
      `source` itself.

      **－** Exit 0 always; an error prints nothing and blocks nothing; the hook writes no file and no
      event line — `session-start compact` is written by `guppi event`.'
    context: 'The `Stop` hook of `rule-spec-write`, `.guppi/guppi/ratified.py`, writes each ratified Case
      whole into the plan file, after the map of the Cases that opens it under its title line (`write_case`,
      `write_parent`, `write_defers`, `remove_superseded`, `rebuild_map` and `stop`, read whole). At the
      exit of Plan Mode the hook of `rule-spec-capture`, `.guppi/guppi/spec.py`, appends the plan text
      of `tool_response.plan` to `spec.md` of the session, and on a typed `/approve-spec` it appends the
      plan file itself (`append_plan`, `typed` and `run`, read whole). So the plan view that VS Code opens,
      and that the person approves, shows every Case in full below the map. The person read the map at
      this `/hi`, said it looked fine, and asked that the plan file no longer hold the Cases themselves.


      The person chose that each ratified Case waits in a second file beside the plan file, outside the
      repository, until the approval, and that `spec.md` keeps the map and every Case in full, as today.
      The person first asked why the Cases should not go straight into `spec.md`. The round answered from
      the code: several readers take a `spec.md` that stands for an approved Spec. These are `write_case`
      and `stop` of `ratified.py`, `plan_onward` of `.guppi/guppi/onward.py`, which does nothing once
      the file stands, and `spec_files` of `.guppi/guppi/materialize.py`, which takes the session''s `spec.md`
      whenever it stands and does not look for the approval stamp.


      Choices of form, mine. The file is `<plan stem>.cases.md` beside the plan file, as the store `<plan
      stem>.checked.json` of `rule-case-check` stands beside it (`store_of` of `.guppi/guppi/casecheck.py`).
      Its `.md` suffix makes it a plan file to `is_plan_file` of `.guppi/guppi/ledger.py`, so the guard
      of `rule-spec-reconcile` refuses an `Edit` of it and a `Write` once it stands; the one call it lets
      through is an agent `Write` that creates it with a title line alone, which no step of the harness
      makes, and that gap stands. In the texts of the harness, "the plan" now means the plan file together
      with its Cases file. Three new functions of `ledger.py`, beside `plan_path`, give the path and the
      one reading of the Cases of the plan, the plan file and then its Cases file. `plan_cases_file` gives
      the path. `with_cases` joins a plan text with the Cases file, for `run` of `spec.py`, which holds
      the plan text of `tool_response.plan`. `plan_cases_text` gives `with_cases` the text of the plan
      file. Every reader imports them, and none joins the two texts itself (`rule-one-judgment-one-implementation`,
      as the pre-spec finding on 1087.12 asked). Reading the plan file too keeps the plan file of this
      session, which the code of Plan Mode still fills with Cases, readable after Work Mode changes the
      code. So the old form needs no removal later, and each Criterion whose reader takes "the plan file"
      stays true. A Grep of `.guppi/guppi/` for `\.cases\.md|cases_of|CASES_SUFFIX|plan_text\(` printed
      `materialize.py` (`cases_of`) and `spec.py` (`plan_text`), so the new names avoid both and copy
      no judgment. A Grep of `.guppi/guppi/` for `"plans"|/plans|plans/` printed `gate.py`, `ledger.py`,
      `ratified.py` and `recall.py`. Each hit is a docstring or `is_plan_file`, and no code walks that
      folder.


      This Case takes up the defer of `rule-spec-write` that `backlog.md` lists as put off in 1 session.
      Case 1081 of session 0947 deferred that the hook write each Case whole into `spec.md` from the first
      one on, with the stamp line marking the approval and the plan file keeping only the map. In that
      session the person had chosen that place (1078.Q5 a) and put the move off because 66 Estimate pages
      said the plan file holds the Cases (`context` of Case 1081 in `raw/2026-11-27/0947/spec.md`). In
      this session the person chose a Cases file beside the plan file until the approval instead. So the
      decision line of 1087.1 on `rule-spec-write` carries `{supersedes:case 1081}`, which retires that
      defer.


      The split gives one Estimate to each sub-case: the map (1087.1, `estimate-spec-write-writes-the-map`,
      whose Criterion now also checks that the plan file holds no Case), the line that opens each map
      (1087.2), the write (1087.3), the write into `spec.md` after the approval (1087.4), the check after
      the write (1087.5), a Case repeated after a refusal (1087.6), a tag line (1087.7), a short-form
      defer (1087.8), a built Case of defer lines (1087.9), the removal (1087.10), a take-back (1087.11),
      the approval (1087.12), the readers before the approval (1087.13), and the read-back after a compaction
      (1087.14). The readers share one reading, so they share one new Estimate. The pre-spec findings
      brought four method changes. `estimate-spec-write-reaches-the-approved-spec`, `estimate-spec-write-checks-the-written-case`,
      `estimate-spec-write-writes-a-defer` and `estimate-spec-write-removes-a-superseded-case` keep only
      their pytest part. Their by-hand part waited on a live write that Plan Mode of this session cannot
      make with the old code and that names no event. The check noted lines of the old Criteria of 1087.2
      to 1087.12 as not carried. Each such line names the plan file, or the map below the Cases, and the
      new Criterion writes it again with the Cases file, or with the plan file read before its Cases file.
      Two examples are the line of 1087.5 that no ratified copy is written and the line of 1087.10 on
      a parent that stays. The new Criteria of 1087.1 and 1087.2 also merge and extend their old lines.
      The check also noted `then` lines of sibling sub-cases that share most of their words. Each of those
      lines names the Cases file for its own Estimate, and no two of them set one thing in two ways. A
      Grep of `vault/wiki/estimates/` for `plan file|the plan\b` printed 82 files. I read the `purpose`
      of each Estimate of `rule-spec-write` and of `rule-spec-capture`, and the Criterion of each whose
      `purpose` speaks of where a Case is written. A Grep of `vault/wiki/` for `(writes?|written|removes?|goes)
      [^.]{0,80}(into|from|of|in) the plan file` printed:


      - `case-schema.md`, `orchestration.md`, `rule-case-protocol.md`, `rule-orchestration.md` and `rule-skill-approve-spec.md`;

      - `log.md`, `insight-plugin-cli-withholds-approval-of-a-long-plan.md` and `lesson-spec-write-skips-the-reply-that-answers-a-refusal.md`;

      - the Estimates `estimate-case-check-leaves-out-a-case-the-file-supersedes`, `estimate-orchestration-defer-example-passes-the-hook`,
      `estimate-orchestration-defers-in-one-reply`, `estimate-orchestration-takes-back-a-ratified-case`,
      `estimate-prespec-reconciles`, `estimate-spec-write-answers-a-refusal`, `estimate-spec-write-checks-the-written-case`,
      `estimate-spec-write-copies-a-built-defer-only-case`, `estimate-spec-write-copies-the-ratified-case`,
      `estimate-spec-write-reaches-the-approved-spec`, `estimate-spec-write-reads-a-new-tag`, `estimate-spec-write-refuses-a-changed-case-file`,
      `estimate-spec-write-writes-a-defer` and `estimate-spec-write-writes-the-map`.


      Each Estimate whose Criterion says that a Case is written into, or removed from, the plan file gets
      its Criterion replaced in a sub-case of its own. `estimate-case-check-leaves-out-a-case-the-file-supersedes`
      and `estimate-orchestration-defers-in-one-reply` say that nothing is removed from, or written into,
      the plan file, and that stays true. `estimate-spec-write-refuses-a-changed-case-file` says that
      nothing of a refused Case is written into the plan file or `spec.md`; that stays true, and the new
      Criterion of 1087.3 writes nothing of a refused Case into the Cases file either. `estimate-orchestration-defer-example-passes-the-hook`
      runs `write_defers` over a file it calls the plan file. `write_defers` writes into the file it is
      given, and only `stop` changes which file it gives, so that Criterion and its test stand. The Insight
      and the Lesson record what was seen while the plan file held the Cases, and they stand; `log.md`
      is not read. `estimate-spec-write-shows-the-map-in-the-plan-view` (its `passed` reading in this
      session''s ledger) and `estimate-spec-write-shows-the-boxes-in-the-plan-file` read the map in the
      plan view, and they stand.


      Texts that stand. `estimate-skill-approve-spec-takes-the-spec` appends the plan file "as `rule-spec-capture`
      sets it", and so follows 1087.12. The skill text of `rule-skill-approve-spec` says the plan file
      now stands in `spec.md`, which stays true; the sentence of its Purpose that GUPPI writes each Case
      whole into the plan file changes in 1087.1. `.claude/skills/pre-spec/SKILL.md` and `.claude/skills/work/SKILL.md`
      run `--check <the plan file>`, which now reads the Cases file too. The line of `.claude/agents/ask-guppi.md`
      that names what it read says "the plan file", and the dispatch of 1087.13 hands it both paths. The
      Criterion of `estimate-prespec-reconciles` names the path of the plan file in the dispatch, which
      still holds. `rule-spec-reconcile` says the hooks alone write the Cases into the plan, true under
      the new meaning. The sentences of `rule-case-check` on the other Cases "of the plan" are true too,
      and its code changes in 1087.13. `recall.py` of `rule-compact-recall` names the plan file as the
      Spec before the approval (`spec_of` and `recall`, read whole). That file now holds the map alone,
      so the promise of `estimate-compact-recall-reloads` that the Spec stands in the context would fail.
      So 1087.14 has recall name the Cases file after the plan file and replaces that Criterion, as the
      pre-spec finding asked. The Purpose of `rule-compact-recall` names the Spec and no file, so it stands.
      The `/retro` gate `spec_check` of `.guppi/guppi/gate.py` reads `spec.md` and the plan file, and
      1087.13 makes it read the Cases file too. The `/approve-spec` path is kept, though a plan of the
      map alone is shorter.


      Texts that change. A Grep of `{vault/wiki,.claude,.guppi/guppi}/**` for `writes it into the plan
      file|removes it from the plan file|the plan the human approves|into the plan file, outside the repository|with
      the absolute path of the plan file|approved as Claude Code''s plan` printed `.claude/skills/pre-spec/SKILL.md`,
      `case-schema.md`, `entity-glossary.md`, `estimate-prespec-reconciles.md`, `glossary.md`, `orchestration.md`,
      `rule-case-protocol.md`, `rule-orchestration.md` and `rule-prespec.md`. The pairs on `rule-case-protocol`,
      `rule-orchestration`, `rule-prespec` and `entity-glossary` fix each of them but `estimate-prespec-reconciles`,
      which stands as said above, and the render and glossary lines carry them to the rendered files.
      A Grep of `{vault/wiki,.claude,.guppi}/**` for `write the Cases|Cases into it|title line alone`
      printed `ratified.py`, `.guppi/tests/test_ratified.py` and `rule-spec-reconcile.md`. The reason
      the guard gives says the hooks write the Cases into the plan file, so it changes, and the test keeps
      its phrase "title line alone". Of the tests that read a live file, `.guppi/tests/test_orchestration.py`
      reads `orchestration.md` for its two examples, and the pairs of 1087.3 change no example. The sub-cases
      change the tests of `test_ratified.py` and `test_spec.py` that read a written Case in the plan file.
      I read each sentence around a pair whole: on `rule-case-protocol` the paragraphs of `## when and
      then are the Criterion`, `## The then block lives in the Spec` and the paragraph that opens with
      the writing of the Spec; on `rule-orchestration` the paragraph of `## Showing and signing a Case`
      on Work Mode and the paragraph of the short form on where the hook writes a defer; on `rule-prespec`
      the paragraph of the `ask-guppi` dispatch; on `entity-glossary` the page whole, its table from the
      header row to the last row, the row of the Spec among them; on `rule-skill-approve-spec` its Purpose.
      No other Case of this session writes into those pages. No lesson of this session''s ledger is open.


      The files that the check''s notes listed. The notes listed every file that names a page or a file
      this Case changes, such as `SKILL.md`, `/approve-spec`, `/pre-spec`, `rule-orchestration`, `casecheck.py`
      or `settings.json`. I judged them by their purpose lines, and most speak of something else. These
      I read, since their purpose speaks of the plan or of where its Cases stand:


      - `estimate-spec-reconcile-refuses-an-edit-of-the-plan`: its Criterion judges a plan file by `is_plan_file`
      and refuses an `Edit` of one. So the Cases file is guarded as said above, and `ratified.py` writes
      it from Python with no tool call. That Criterion stands.

      - `estimate-prespec-checks-the-plan` and the Estimates of `rule-prespec-hook` that check "the plan"
      by `prespec --check`: they stand, since the plan now means the plan file with its Cases file, and
      1087.13 makes `--check` read both.

      - `estimate-spec-capture-offers-the-fork`: `fork_output` of `spec.py` judges a conserved Spec by
      `conserved_spec_named` of `.guppi/guppi/box.py`, which reads the title line of the plan alone (both
      read whole). The title line stays in the plan file, so that Criterion stands.

      - `insight-plugin-cli-withholds-approval-of-a-long-plan`: it is `actioned` by Case 987.1 and records
      what was seen. A shorter plan file only helps it, so it stands.

      - `caseid.py`: `run`, read whole, checks only that the plan file stands and keeps its store beside
      it. It reads no Case of the plan, so it stands.


      The message texts of `onward.py` name `prespec --check` "on the plan file", which still takes the
      path of the plan file, so they stand.


      The pre-spec findings named more Estimates whose Criterion takes the plan file as the input of a
      reader that 1087.13 changes. I read the lines of each that name the plan:


      - Of `rule-case-check`: `estimate-case-check-sends-back-a-clash-with-another-case`, `estimate-case-check-takes-a-case-built-again-from-its-file`,
      `estimate-case-check-applies-the-pairs-of-the-session-in-order` and `estimate-case-check-notes-a-page-the-cascade-archives`.

      - Of `rule-prespec-hook` and `rule-prespec`: `estimate-prespec-hook-gates` and `estimate-prespec-catches-bare-wikilinks`.

      - Of `rule-ask`: `estimate-ask-finds`, `estimate-ask-searches-at-prespec` and `estimate-ask-opens-a-decision-only-for-a-finding`,
      which say that `/pre-spec` dispatches `ask-guppi` with the plan file.


      Each one checks a judgment over the Cases of the plan, and the file that holds those Cases is checked
      by the new `estimate-spec-write-readers-take-the-cases-file` of 1087.13. Its Criterion says that
      a Case that stands only in the Cases file is judged as a Case of the plan, and that `ask-guppi`
      gets both paths. The readers still read the plan file first, so the tests of these Estimates, whose
      made-up plan file holds Cases, pass as they stand, and each Criterion stays true. They become narrower
      than the code, and since a promise is signed once, I replace none of them (a choice of form).


      The new Cases file stands in `~/.claude/plans/`, outside the repository. A Grep of `.claude/` for
      `plans` printed nothing. The same Grep of `vault/wiki/rules/` printed `rule-internal-context.md`,
      where "plans" is a verb. A Grep of `.guppi/guppi/` and `.guppi/tests/` for `os\.walk|rglob|\.glob\(|iterdir`
      printed 29 matches in 16 files of `.guppi/tests/` and 48 matches in 15 files of `.guppi/guppi/`.
      Of them only `.guppi/tests/test_ratified.py:253` walks a folder `.claude/plans`, and its glob `*.ratified.md`
      in a made-up project does not match `.cases.md`. A Grep of `.guppi/guppi/` for `home\(\)|expanduser|~/\.claude`
      printed `agents.py` and `lint.py`, which name `~/.claude/projects/` and not the plans folder. A
      Glob of `~/.claude` for `.gitignore` printed five files under `plugins/` and none in `~/.claude`
      or in `~/.claude/plans`. No `.gitignore` of the repository reaches a folder outside it. So the new
      file makes no reader of its folders wrong. Case 1088 is built at the same time as this one, so I
      read no file of it, though the check''s note lists `case-1088.md`. This Case rests on no text of
      it.


      For 1087.14 the note listed the files that name `recall.py` or `guppi recall`. `estimate-internal-context-loaded`
      says that after a compaction the paths of the `/hi` files are in the list of `guppi recall`. 1087.14
      keeps that, so it stands. `rule-hook-registry`, `rule-internal-context` and `.claude/settings.json`
      register the hook or name its list of `@` files, which 1087.14 does not change. In `.guppi/tests/test_recall.py`,
      `test_the_spec_is_the_plan_file_before_the_approval_and_spec_md_after` makes a plan file with no
      Cases file beside it and finds its path on the sixth line. That still holds, and the task of 1087.14
      adds a test with a Cases file. `estimate-clean-branch-ships-neutral-texts` names `estimate-compact-recall-reloads`
      among the shipped Estimates. The new `method` of 1087.14 waits for a kind of moment that comes again
      in any project, a compaction in Plan Mode, which that Criterion lets hold, so it stands. The check
      notes the line of the old Criterion on the Spec as not carried, since the new line adds the Cases
      file to it. The check also notes the `－` line of 1087.14 on a plan file with no Cases file as sharing
      words with 1087.1, 1087.12 and 1087.13. Each of those lines speaks of its own reader, and the four
      lines agree.'
