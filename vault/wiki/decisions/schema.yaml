# Decision — the machine-readable schema. Lint reads this file; schema.md beside it is the
# same schema as prose with examples, and lint checks the two agree. Rule-class: changes only
# through a ratified `decision update`.
type: decision
properties:
  required: [type, case, status, origin, sprint, created, tags]
  optional: [create, update, delete, defer, source, supersedes, superseded_by]
  values:
    status: [current, superseded, archived]
# `create`, `update`, `delete`, `defer`: one list per kind present among the Case's ledger
# lines, in that order, each the slugs of those lines in ledger order (a page, or a
# Rule-class file such as `case-schema`); a kind with no line is absent, at least one is
# present. The category is derived from the slug prefix or the Rule-class map, never
# written. Lint checks every page slug names a live or archived page, and that neither
# `kind` nor `target_slug` is present (case 59.4).
body:
  required: ["## Context", "## Problem", "## History"]
  # `## Given` and `## When` are required by materialize when any kind is not `defer`; a
  # defer-only Case, the short form of Retro, has neither (case 56).
  optional: ["## Given", "## When", "## Note"]
