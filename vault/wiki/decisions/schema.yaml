# Decision — the machine-readable schema. Lint reads this file; schema.md beside it is the
# same schema as prose with examples, and lint checks the two agree. Rule-class: changes only
# through a ratified `decision update`.
type: decision
properties:
  required: [type, case, status, targets, origin, sprint, created, tags]
  optional: [supersedes, superseded_by]
  values:
    status: [current, superseded, archived]
# `targets` is a list of {kind, category, slug, ref?, source?, path?}; one item per ledger
# line of the Case. Lint checks the field exists; the script writes its items.
body:
  required: ["## Context", "## Now", "## Problem", "## Then", "## History"]
  optional: ["## Note"]
