# Decision — the machine-readable schema. Lint reads this file; schema.md beside it is the
# same schema as prose with examples, and lint checks the two agree. Rule-class: changes only
# through a ratified `decision update`.
type: decision
properties:
  required: [type, case, status, kind, target_slug, origin, sprint, created, tags]
  optional: [source, supersedes, superseded_by]
  values:
    status: [current, superseded, archived]
# `kind` and `target_slug` are two lists aligned by position, one position per ledger line
# of the Case: `kind` items are create | update | delete | defer, `target_slug` items the
# slug of the ledger line (a page, or a Rule-class file such as `case-schema`); the category
# is derived from the slug prefix or the Rule-class map, never written. Lint checks the two
# lists have equal length and every page slug exists (case 52.1).
body:
  required: ["## Context", "## Problem", "## History"]
  # `## Given` and `## When` are required by materialize when any kind is not `defer`; a
  # defer-only Case, the short form of Retro, has neither (case 56).
  optional: ["## Given", "## When", "## Note"]
