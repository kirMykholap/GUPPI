# Estimate — the machine-readable schema. Lint reads this file; schema.md beside it is the
# same schema as prose with examples, and lint checks the two agree. Rule-class: changes only
# through a ratified `decision update`.
type: estimate
properties:
  required: [type, kind, status, target, origin, sprint, created, tags]
# `target` names an Entity or a Rule; lint reports any other category (case 53.1).
# `purpose`, `method` and `checked` are the fields of the model of case 182: one line each,
# written on a page born since case 193; the 42 older pages carry none until their recut at
# their first touch (case 191), so none is required yet (case 193).
  optional: [purpose, method, checked]
  values:
    kind: [QA, Research]
    status: [pending, passed, failed]
body:
  required: ["## Criterion", "## History"]
# `## Criterion` is the Given, When and Then of one Case, replaced whole by the update that
# names the Estimate. `## Context` and `## Method` are the shape before case 193: kept on
# the pages that carry them, never written to a new page (case 193).
  optional: ["## Context", "## Method", "## Result"]
  conditional:
    - when: {status: passed}
      required: ["## Result"]
    - when: {status: failed}
      required: ["## Result"]
