# Estimate — the machine-readable schema. Lint reads this file; schema.md beside it is the
# same schema as prose with examples, and lint checks the two agree. Rule-class: changes only
# through a ratified `decision update`.
type: estimate
properties:
  required: [type, kind, status, target, origin, sprint, created, tags]
# `target` names an Entity or a Rule; lint reports any other category (case 53.1).
  optional: []
  values:
    kind: [QA, Research]
    status: [pending, passed, failed]
body:
  required: ["## Context", "## Criterion", "## Method", "## History"]
# `## Context` is written once, from the Case's `problem`; `## Criterion` may hold one
# `### case N` sub-block per Case that shaped the Estimate, in ledger order; `## Method` is
# the Case's `method`. All three stay required (case 72.2).
  optional: ["## Result"]
  conditional:
    - when: {status: passed}
      required: ["## Result"]
    - when: {status: failed}
      required: ["## Result"]
