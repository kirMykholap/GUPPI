# Insight — the machine-readable schema. Lint reads this file; schema.md beside it is the
# same schema as prose with examples, and lint checks the two agree. Rule-class: changes only
# through a ratified `decision update`.
type: insight
properties:
  required: [type, pattern, status, children, severity, origin, sprint, created, tags]
  optional: [addressed_by, deferred_by]
# `deferred_by`: the `defer` decisions that postponed the Insight; set by `generate`, cleared by
# a `supersedes` (case 124.2).
  values:
    status: [open, actioned, archived]
  conditional:
    - when: {status: actioned}
      required: [addressed_by]
# `severity` is count(children where status != archived), recomputed by lint.
computed: [severity]
# No `## Children` or `## Addressed by` section: the fields are the links (case 166.1).
body:
  required: ["## Pattern", "## History"]
  optional: ["## Proposal"]
