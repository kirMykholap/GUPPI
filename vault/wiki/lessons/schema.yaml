# Lesson — the machine-readable schema. Lint reads this file; schema.md beside it is the
# same schema as prose with examples, and lint checks the two agree. Rule-class: changes only
# through a ratified `decision update`.
type: lesson
properties:
  required: [type, kind, root_cause, status, origin, sprint, created, tags]
# A lesson is a recorded fact and carries no Estimate: an Estimate exists only for a page
# with a contract, an Entity or a Rule (case 53.1).
  optional: [source, insight]
  values:
    kind: [error, knowledge]
    status: [new, clustered, archived]
  conditional:
    - when: {kind: knowledge}
      required: [source]
    - when: {status: clustered}
      required: [insight]
# No `## Insight` section: the `insight` field is the link (case 166.1).
body:
  required: ["## Trigger", "## Root cause", "## History"]
