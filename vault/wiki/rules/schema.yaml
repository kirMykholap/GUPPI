# Rule — the machine-readable schema. Lint reads this file; schema.md beside it is the
# same schema as prose with examples, and lint checks the two agree. Rule-class: changes only
# through a ratified `decision update`.
type: rule
properties:
  required: [type, kind, purpose, status, estimates, origin, sprint, created, tags]
  optional: [enforcement, implementation_ref, governs, render_mode, parent, children, deferred_by]
# `deferred_by`: the Decision pages whose `defer` targets this page; written on a defer and
# cleared on a `supersedes` by `guppi generate`, never by hand (case 52.3).
  values:
    kind: [MOC, Leaf]
    status: [draft, built, archived]
    enforcement: [hook, check, render]
    render_mode: [full, partial]
  conditional:
    - when: {enforcement: hook}
      required: [implementation_ref]
    - when: {enforcement: check}
      required: [implementation_ref]
    - when: {enforcement: render}
      required: [governs, render_mode]
    - when: {kind: MOC}
      required: [children]
      # a MOC carries `enforcement` only as `render`: the frame of a harness file
      forbidden_values: {enforcement: [hook, check]}
# `children` on a Rule MOC is ordered and the order is content; nothing may sort it.
ordered_children: true
# No body section is derived from a ref field: `estimates`, `children`, `parent` and
# `implementation_ref` are the link, seen by Obsidian since case 148.1 (case 166.1).
body:
  required: ["## Purpose", "## History"]
  optional: ["## Render", "## How it works"]
  conditional:
    - when: {enforcement: render}
      required: ["## Render"]
